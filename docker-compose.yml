services:
  manga-translator:
    build: .
    image: manga-translator:local
    container_name: manga-translator
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - RELOAD=0
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
    restart: unless-stopped
    shm_size: "1gb"
