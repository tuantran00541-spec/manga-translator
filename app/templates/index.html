<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manga Translator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="app">
  <header id="site-header">
    <div id="wordmark">
      <span class="wordmark-mark">✛</span>
      <span class="wordmark-text">MANGA<span class="wordmark-accent">TRANSLATOR</span></span>
    </div>
    <span id="wordmark-tag">bàn biên tập &middot; local</span>
  </header>

  <div id="chapter-input">
    <input type="text" id="chapter-url" placeholder="Dán link chapter">
    <select id="lang-select">
      <option value="ja">Nhật</option>
      <option value="ch">Trung</option>
      <option value="korean">Hàn</option>
      <option value="en">Anh</option>
    </select>
    <button id="load-btn">Tải chapter</button>
  </div>

  <div id="upload-divider">hoặc</div>

  <div id="upload-dropzone">
    <p>Kéo thả ảnh hoặc file ZIP vào đây, hoặc <label for="upload-input" id="upload-browse-label">chọn file</label></p>
    <span id="upload-hint">Chấp nhận PNG, JPG, WEBP, BMP, ZIP, CBZ — kéo thả tập ảnh hoặc file ZIP</span>
    <input type="file" id="upload-input" accept="image/png,image/jpeg,image/webp,image/bmp,.zip,.cbz" multiple hidden>
  </div>

  <div id="recent-chapters"></div>

  <div id="page-view"></div>
</div>
<div id="toast-container"></div>
<script src="/static/js/toast.js"></script>
<script src="/static/js/api.js"></script>
<script src="/static/js/upload.js"></script>
<script src="/static/js/preview.js"></script>
<script src="/static/js/review.js"></script>
<script src="/static/js/box-item.js"></script>
<script src="/static/js/editor.js"></script>
<script src="/static/js/main.js"></script>
</body>
</html>
