name: Extract Shadow Slave chapter 1 inpaint samples

on:
  push:
    branches:
      - perf/bubble-fastpath-roi-lama
    paths:
      - .github/workflows/extract-shadow-slave-ch1-inpaint-samples.yml

permissions:
  actions: read
  contents: read

jobs:
  sample:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Download completed chapter artifact
        uses: actions/download-artifact@v4
        with:
          name: shadow-slave-ch1-ocr-audit-35030161624
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35030161624
          path: artifact

      - name: Install image inspection runtime
        run: python -m pip install --disable-pip-version-check pillow==10.4.0

      - name: Build before-after inpaint samples
        run: |
          mkdir -p compact/inpaint-samples
          python - <<'PY'
          import json
          import shutil
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont

          root = Path("artifact")
          manifest_path = next(root.rglob("manifest.json"))
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          pages = manifest.get("pages", [])

          def metric(page, key):
              return float((((page.get("processing_metrics") or {}).get("timing_ms") or {}).get(key)) or 0.0)

          # Cover the slowest inpaint pages, residue pages, and a normal page.
          ranked = sorted(range(len(pages)), key=lambda i: metric(pages[i], "auto_inpaint"), reverse=True)
          residue = [
              i for i, page in enumerate(pages)
              if int((((page.get("processing_metrics") or {}).get("detector") or {}).get("post_inpaint_residue") or 0)) > 0
          ]
          selected = []
          for i in ranked + residue + [0, 37, 86, 133, 134]:
              if i not in selected and (pages[i].get("boxes") or []):
                  selected.append(i)
              if len(selected) >= 10:
                  break

          font = ImageFont.load_default()
          rows = []
          for page_index in selected:
              page = pages[page_index]
              original = root / page["original"]
              clean_name = Path(page.get("clean") or "").name
              clean_matches = sorted(root.rglob(clean_name))
              if not original.exists() or not clean_matches:
                  continue
              clean = clean_matches[0]
              before = Image.open(original).convert("RGB")
              after = Image.open(clean).convert("RGB")
              for box_index, box in enumerate(page.get("boxes") or []):
                  if not box.get("safe_to_inpaint"):
                      continue
                  x1 = max(0, int(box["x1"]) - 36)
                  y1 = max(0, int(box["y1"]) - 36)
                  x2 = min(before.width, int(box["x2"]) + 36)
                  y2 = min(before.height, int(box["y2"]) + 36)
                  if x2 <= x1 or y2 <= y1:
                      continue
                  b = before.crop((x1, y1, x2, y2))
                  a = after.crop((x1, y1, x2, y2))
                  max_w, max_h = 720, 420
                  scale = min(max_w / max(b.width, a.width), max_h / max(b.height, a.height), 1.0)
                  if scale < 1.0:
                      size = (max(1, int(b.width * scale)), max(1, int(b.height * scale)))
                      b = b.resize(size, Image.Resampling.LANCZOS)
                      a = a.resize(size, Image.Resampling.LANCZOS)
                  label_h = 38
                  card = Image.new("RGB", (b.width * 2, b.height + label_h), "white")
                  card.paste(b, (0, label_h))
                  card.paste(a, (b.width, label_h))
                  draw = ImageDraw.Draw(card)
                  draw.text((8, 8), f"p{page_index} box{box_index} BEFORE", fill="black", font=font)
                  draw.text((b.width + 8, 8), "AFTER", fill="black", font=font)
                  out = Path("compact/inpaint-samples") / f"p{page_index:03d}-b{box_index}.jpg"
                  card.save(out, quality=92)
                  rows.append({
                      "page_index": page_index,
                      "box_index": box_index,
                      "box_id": box.get("id"),
                      "source": page.get("original"),
                      "timing_ms": (page.get("processing_metrics") or {}).get("timing_ms"),
                      "detector": (page.get("processing_metrics") or {}).get("detector"),
                      "auto_inpaint": (page.get("processing_metrics") or {}).get("auto_inpaint"),
                      "sample": out.as_posix(),
                  })

          Path("compact/inpaint-samples.json").write_text(
              json.dumps({"selected_pages": selected, "samples": rows}, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps({"selected_pages": selected, "samples": len(rows)}, ensure_ascii=False))
          PY

      - name: Upload inpaint samples
        uses: actions/upload-artifact@v4
        with:
          name: shadow-slave-ch1-inpaint-samples-35030161624
          path: compact/
          retention-days: 7
          compression-level: 6
          if-no-files-found: error
