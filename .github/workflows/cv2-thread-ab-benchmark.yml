name: OpenCV thread A-B-A benchmark

on:
  push:
    branches:
      - fix/observer-processing-freeze
    paths:
      - .github/workflows/cv2-thread-ab-benchmark.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cv2-thread-ab-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
      MANGA_USE_DYNAMIC_LAMA: "1"
      MANGA_ORT_PROVIDER: cpu
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CPU production runtime
        run: |
          python -m pip install \
            numpy==1.26.4 Pillow==10.4.0 opencv-contrib-python==4.10.0.84 \
            onnxruntime==1.21.0 psutil==6.1.1 loguru==0.7.2 \
            requests==2.32.3 beautifulsoup4==4.12.3 lxml==5.3.0 \
            fastapi==0.115.0 'uvicorn[standard]==0.30.6' \
            pydantic==2.9.2 filelock==3.16.1 python-multipart==0.0.12

      - name: Restore detector and inpaint models
        id: models
        uses: actions/cache@v4
        with:
          path: |
            models/*.onnx
            models/.e2e-provenance.json
          key: processing-profile-models-b224548-v1

      - name: Read pinned model provisioner
        if: steps.models.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          ref: b22454827f8190655d7070b80eb20c2550beadfa
          path: benchmark-bootstrap
          sparse-checkout: scripts/provision_real_e2e_models.py
          sparse-checkout-cone-mode: false

      - name: Provision public-equivalent production models
        if: steps.models.outputs.cache-hit != 'true'
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple torch==2.5.1+cpu torchvision==0.20.1+cpu
          python -m pip install --no-deps ultralytics==8.3.221 onnx==1.17.0 onnxslim==0.1.71
          python -m pip install numpy==1.26.4 sympy==1.13.1 PyYAML==6.0.2 scipy==1.14.1 tqdm==4.67.1 matplotlib==3.9.2 pandas==2.2.3 py-cpuinfo==9.0.0 ml_dtypes==0.5.3 colorama==0.4.6 polars==1.33.1 ultralytics-thop==2.0.17
          python benchmark-bootstrap/scripts/provision_real_e2e_models.py
          cp benchmark-bootstrap/models/*.onnx models/
          cp benchmark-bootstrap/models/.e2e-provenance.json models/

      - name: Prepare exact benchmark chapter
        run: |
          python - <<'PY'
          import json, shutil
          from pathlib import Path
          from app.config import RAW_DIR, PROCESSED_DIR, OUTPUT_DIR
          from app.manifest_utils import load_manifest_raw, save_manifest_raw
          from app.optimized_pipeline import OptimizedChapterPipeline

          chapter_id = 'c165fc0b'
          url = 'https://asurascans.com/comics/player-who-returned-10000-years-later-53fc8424/chapter/159'
          for root in (RAW_DIR, PROCESSED_DIR, OUTPUT_DIR):
              shutil.rmtree(root / chapter_id, ignore_errors=True)
          pipeline = OptimizedChapterPipeline()
          pipeline.download_chapter(url, chapter_id, workers=2)
          manifest = load_manifest_raw(chapter_id)
          skipped = {0, 8, 9, 79}
          for index, page in enumerate(manifest.get('pages', [])):
              page['skipped'] = index in skipped
          manifest['workflow'] = {'stage': 'preview', 'page_index': 35}
          save_manifest_raw(chapter_id, manifest)
          selected = [i for i, page in enumerate(manifest.get('pages', [])) if not page.get('skipped')]
          batch = selected[32:48]
          if batch != list(range(35, 51)):
              raise RuntimeError(f'unexpected benchmark batch: {batch}')
          manifest_path = PROCESSED_DIR / chapter_id / 'manifest.json'
          Path('benchmark-pristine-manifest.json').write_bytes(manifest_path.read_bytes())
          Path('cv2-benchmark-meta.json').write_text(json.dumps({
              'chapter_id': chapter_id,
              'batch': batch,
              'slices': len(manifest.get('pages', [])),
              'processable': len(selected),
          }, indent=2), encoding='utf-8')
          print(Path('cv2-benchmark-meta.json').read_text())
          PY

      - name: Run OpenCV 4-1-4 A-B-A benchmark
        run: |
          python - <<'PY'
          from __future__ import annotations
          import json, math, os, statistics, subprocess, sys, threading, time
          from pathlib import Path
          import psutil, requests
          from app.config import PROCESSED_DIR

          meta = json.loads(Path('cv2-benchmark-meta.json').read_text())
          chapter_id = meta['chapter_id']
          batch = meta['batch']
          chapter_dir = PROCESSED_DIR / chapter_id
          manifest_path = chapter_dir / 'manifest.json'
          pristine = Path('benchmark-pristine-manifest.json').read_bytes()
          results = []

          def percentile(values, q):
              if not values:
                  return None
              data = sorted(float(x) for x in values)
              pos = (len(data) - 1) * q / 100.0
              lo, hi = math.floor(pos), math.ceil(pos)
              if lo == hi:
                  return data[lo]
              return data[lo] * (hi - pos) + data[hi] * (pos - lo)

          def summary(values):
              if not values:
                  return None
              return {
                  'p50': round(percentile(values, 50), 3),
                  'p95': round(percentile(values, 95), 3),
                  'max': round(max(values), 3),
                  'mean': round(statistics.mean(values), 3),
              }

          def restore_pristine():
              manifest_path.write_bytes(pristine)
              for pattern in ('clean_*.png', 'auto_clean_*.png', '.page-*.artifact-txn.json*'):
                  for path in chapter_dir.glob(pattern):
                      try:
                          path.unlink()
                      except OSError:
                          pass

          def wait_healthy():
              deadline = time.time() + 30
              while time.time() < deadline:
                  try:
                      r = requests.get('http://127.0.0.1:8765/health', timeout=2)
                      if r.ok:
                          return
                  except Exception:
                      pass
                  time.sleep(0.25)
              raise RuntimeError('server failed to become healthy')

          def run_variant(label, cv2_threads):
              restore_pristine()
              code = (
                  f'import cv2; cv2.setNumThreads({cv2_threads}); '
                  'import uvicorn; uvicorn.run("app.main:app", host="127.0.0.1", port=8765, log_level="warning")'
              )
              log_path = Path(f'cv2-{label}-server.log')
              with log_path.open('wb') as log:
                  proc = subprocess.Popen([sys.executable, '-c', code], stdout=log, stderr=subprocess.STDOUT)
              try:
                  wait_healthy()
                  server = psutil.Process(proc.pid)
                  server.cpu_percent(None)
                  psutil.cpu_percent(None)
                  request_result = {}

                  def request_worker():
                      t0 = time.perf_counter()
                      try:
                          resp = requests.post(
                              'http://127.0.0.1:8765/api/process_pages',
                              json={'chapter_id': chapter_id, 'page_indices': batch, 'workers': 2},
                              timeout=600,
                          )
                          request_result['status'] = resp.status_code
                          request_result['body'] = resp.text[:1000]
                      except Exception as exc:
                          request_result['error'] = repr(exc)
                      finally:
                          request_result['elapsed_s'] = time.perf_counter() - t0

                  worker = threading.Thread(target=request_worker, daemon=True)
                  worker.start()
                  health_ms, health_fail = [], 0
                  server_cpu, server_rss, server_threads, system_cpu = [], [], [], []
                  while worker.is_alive():
                      h0 = time.perf_counter()
                      try:
                          hr = requests.get('http://127.0.0.1:8765/health', timeout=3)
                          health_ms.append((time.perf_counter() - h0) * 1000.0)
                          if not hr.ok:
                              health_fail += 1
                      except Exception:
                          health_ms.append(3000.0)
                          health_fail += 1
                      try:
                          server_cpu.append(server.cpu_percent(None))
                          server_rss.append(server.memory_info().rss / 2**20)
                          server_threads.append(server.num_threads())
                      except psutil.Error:
                          pass
                      system_cpu.append(psutil.cpu_percent(None))
                      time.sleep(0.5)
                  worker.join(timeout=1)
                  if request_result.get('status') != 200:
                      raise RuntimeError(f'{label} request failed: {request_result}')
                  result = {
                      'label': label,
                      'cv2_threads': cv2_threads,
                      'elapsed_s': round(request_result['elapsed_s'], 3),
                      'health_failures': health_fail,
                      'health_latency_ms': summary(health_ms),
                      'server_cpu_percent': summary(server_cpu),
                      'server_rss_mb': summary(server_rss),
                      'server_threads': summary(server_threads),
                      'system_cpu_percent': summary(system_cpu),
                  }
                  results.append(result)
                  print(json.dumps(result, indent=2))
              finally:
                  proc.terminate()
                  try:
                      proc.wait(timeout=10)
                  except subprocess.TimeoutExpired:
                      proc.kill(); proc.wait(timeout=5)

          for label, threads in [('a1-default4', 4), ('b-cv2-1', 1), ('a2-default4', 4)]:
              run_variant(label, threads)

          defaults = [r['elapsed_s'] for r in results if r['cv2_threads'] == 4]
          cv2_one = next(r['elapsed_s'] for r in results if r['cv2_threads'] == 1)
          baseline_mean = statistics.mean(defaults)
          comparison = {
              'source_sha': '${{ github.sha }}',
              'os_cpu_count': os.cpu_count(),
              **meta,
              'results': results,
              'default4_mean_elapsed_s': round(baseline_mean, 3),
              'cv2_1_elapsed_s': round(cv2_one, 3),
              'cv2_1_speedup_percent': round((baseline_mean / cv2_one - 1.0) * 100.0, 2),
          }
          Path('cv2-thread-ab-benchmark.json').write_text(json.dumps(comparison, indent=2), encoding='utf-8')
          print(json.dumps(comparison, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cv2-thread-ab-benchmark-${{ github.run_id }}
          path: |
            cv2-thread-ab-benchmark.json
            cv2-benchmark-meta.json
            cv2-*-server.log
          if-no-files-found: warn
          retention-days: 3
