name: Chaos project run

# One-off: Chaos builds a small project from a 5-item todo on SovInfra; deleted once it has answered.
on:
  push:
    branches: [claude/friendly-hypatia-xi865r]
    paths: [".github/workflows/chaos-project-run.yml", ".github/chaos-run/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OUT: audit-results/chaos-project/run-${{ github.run_id }}
      PROJ: /tmp/kvproject
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install
        run: python -m pip install -r requirements-test.txt
      - name: Profile and empty project
        run: |
          mkdir -p "$HOME/.manga-agent" "$PROJ" "$OUT"
          cat > "$HOME/.manga-agent/profile.json" <<'JSON'
          {"tools": "hybrid", "max_output_tokens": 32000, "token_budget": 20000000, "max_steps": 400, "learn_every": 10,
           "models": {".": {"request": {"reasoning_effort": "xhigh", "temperature": 1.0, "top_p": 0.95}}}}
          JSON
          git -C "$PROJ" init -q
          python -c "from app.agent import sandbox; print('sandbox engine:', sandbox.backend())" | tee "$OUT/sandbox.txt"
      - name: Chaos does the project
        env:
          AGENT_API_KEY: ${{ secrets.SOVINFRA_LAB_1B_TOKEN }}
        run: |
          start=$(date +%s)
          timeout 75m python -m app.agent.cli exec "$(cat .github/chaos-run/task.md)" --base https://api.sovinfra.ai/v1 --model qwen3.8-27b \
            --provider sovinfra --workspace "$PROJ" --mode bypass --sandbox workspace-write --timeout-min 70 --json \
            > "$OUT/events.jsonl" 2> "$OUT/stderr.log" < /dev/null || echo "exit $?" >> "$OUT/stderr.log"
          echo $(( $(date +%s) - start )) > "$OUT/seconds.txt"
      - name: Grade with hidden tests
        if: always()
        run: |
          cd "$PROJ"
          cp "$GITHUB_WORKSPACE/.github/chaos-run/acceptance_test.py" /tmp/acceptance_test.py
          python -m pytest -q -p no:cacheprovider --rootdir "$PROJ" /tmp/acceptance_test.py > "$GITHUB_WORKSPACE/$OUT/acceptance.txt" 2>&1 || true
          python -m pytest -q -p no:cacheprovider tests > "$GITHUB_WORKSPACE/$OUT/own-tests.txt" 2>&1 || true
          tail -3 "$GITHUB_WORKSPACE/$OUT/acceptance.txt" "$GITHUB_WORKSPACE/$OUT/own-tests.txt"
      - name: Summarize
        if: always()
        run: |
          mkdir -p "$OUT/project" "$OUT/agent-home"
          (cd "$PROJ" && git ls-files --others --exclude-standard -z | xargs -0 -I{} cp --parents {} "$GITHUB_WORKSPACE/$OUT/project/") || true
          for d in tools lessons skills; do [ -d "$HOME/.manga-agent/$d" ] && cp -r "$HOME/.manga-agent/$d" "$OUT/agent-home/"; done
          python - <<'PY'
          import collections, json, os
          out = os.environ["OUT"]
          tools, notices, created, chained, one_offs = collections.Counter(), [], set(), 0, 0
          final, todos = "", []
          for line in open(f"{out}/events.jsonl", encoding="utf-8", errors="replace"):
              try:
                  e = json.loads(line)
              except ValueError:
                  continue
              kind = e.get("type")
              if kind == "tool":
                  tools[e.get("name") or "?"] += 1
              elif kind == "notice":
                  notices.append(e.get("text", "")[:300])
              elif kind == "assistant":
                  final = e.get("text") or final
                  for c in e.get("calls") or []:
                      if c.get("name") == "create":
                          args = c.get("args") or {}
                          created.add(args.get("name"))
                          chained += "args" in args
                          one_offs += args.get("keep") is False
              elif kind == "todos":
                  todos = e.get("items") or todos
          def tail(name):
              try:
                  return open(f"{out}/{name}").read().strip().splitlines()[-1]
              except (OSError, IndexError):
                  return ""
          summary = {"seconds": tail("seconds.txt"), "acceptance": tail("acceptance.txt"), "own_tests": tail("own-tests.txt"),
                     "tool_calls": dict(tools.most_common()), "created_tools": sorted(n for n in created if n), "create_and_run": chained,
                     "one_off_chains": one_offs, "notices": notices[-40:], "todos": todos, "stderr_tail": open(f"{out}/stderr.log").read()[-1500:],
                     "final_reply": final[-3000:]}
          json.dump(summary, open(f"{out}/summary.json", "w"), ensure_ascii=False, indent=1)
          print(json.dumps({k: summary[k] for k in ("seconds", "acceptance", "own_tests", "tool_calls", "created_tools", "create_and_run", "one_off_chains")}, ensure_ascii=False, indent=1))
          PY
      - uses: ./.github/actions/save-evidence
        if: always()
        with:
          paths: ${{ env.OUT }}
          message: Chaos project run ${{ github.run_id }}
