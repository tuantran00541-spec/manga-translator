name: Perf Shadow Slave chapter 1 OCR audit

on:
  push:
    branches:
      - perf/bubble-fastpath-roi-lama
    paths:
      - .github/workflows/perf-shadow-slave-ch1-ocr-audit.yml
      - scripts/build_e0_review_queue.py
      - app/benchmarking/**
  workflow_dispatch:
  # fresh chapter benchmark trigger: 2026-09-15

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  MANGA_ORT_PROVIDER: openvino
  MANGA_ORT_REQUIRE_PROVIDER: "1"
  MANGA_ORT_OPENVINO_SCOPE: detectors
  MANGA_ORT_OPENVINO_THREADS: "2"
  MANGA_ORT_OPENVINO_STREAMS: "1"
  MANGA_ORT_OPENVINO_CACHE_DIR: /tmp/manga-openvino-cache
  OPENBLAS_NUM_THREADS: "1"
  PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
  MANGA_PPOCRV6_TIER: small
  MANGA_OCR_TARGET_SELECTION: all
  CHAPTER_ID: 5e8ce7e3
  CHAPTER_URL: https://asurascans.com/comics/shadow-slave-6f7fe6eb/chapter/1
  SERIES_SLUG: shadow-slave-6f7fe6eb
  CHAPTER_NUMBER: "1"
  # Pin the edge-glyph decode margin used by this reproducible perf run.
  MANGA_DETECTOR_TEXT_MASK_DECODE_PAD: "16"

jobs:
  shadow-slave-ch1-audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/bubble-fastpath-roi-lama

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install production clean and OCR runtimes
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            numpy==1.26.4 Pillow==10.4.0 opencv-contrib-python==4.10.0.84 \
            onnxruntime-openvino==1.24.1 \
            paddleocr==3.7.0 paddlepaddle==3.2.2 \
            psutil==6.1.1 loguru==0.7.2 requests==2.32.3 beautifulsoup4==4.12.3 lxml==5.3.0 \
            playwright==1.47.0 fastapi==0.115.0 'uvicorn[standard]==0.30.6' \
            pydantic==2.9.2 filelock==3.16.1 python-multipart==0.0.12 chardet==5.2.0

      - name: Restore detector and inpaint models
        id: models
        uses: actions/cache@v4
        with:
          path: |
            models/*.onnx
            models/.e2e-provenance.json
          key: processing-profile-models-b224548-v1

      - name: Read pinned model provisioner
        if: steps.models.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          ref: b22454827f8190655d7070b80eb20c2550beadfa
          path: benchmark-bootstrap
          sparse-checkout: scripts/provision_real_e2e_models.py
          sparse-checkout-cone-mode: false

      - name: Provision public-equivalent production models
        if: steps.models.outputs.cache-hit != 'true'
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple torch==2.5.1+cpu torchvision==0.20.1+cpu
          python -m pip install --no-deps ultralytics==8.3.221 onnx==1.17.0 onnxslim==0.1.71
          python -m pip install sympy==1.13.1 PyYAML==6.0.2 scipy==1.14.1 tqdm==4.67.1 matplotlib==3.9.2 pandas==2.2.3 py-cpuinfo==9.0.0 ml_dtypes==0.5.3 colorama==0.4.6 polars==1.33.1 ultralytics-thop==2.0.17
          python benchmark-bootstrap/scripts/provision_real_e2e_models.py
          cp benchmark-bootstrap/models/*.onnx models/
          cp benchmark-bootstrap/models/.e2e-provenance.json models/

      - name: Download slice clean OCR and build audit evidence
        run: |
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, math, os, shutil, textwrap, time
          from collections import Counter
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path

          import numpy as np
          from PIL import Image, ImageDraw, ImageFont

          from app.downloader.registry import download_chapter
          from app.downloader.slicer import slice_image
          from app.manifest_utils import load_manifest_raw
          from app.ocr.multi_lang_ocr import MultiLangOCR
          from app.ocr.service import OCRService, _ocr_crop_bounds
          from app.optimized_pipeline import OptimizedChapterPipeline
          from app.parameters import PIPELINE_DEFAULT_WORKERS, PIPELINE_SLICE_WORKER_LIMIT
          from app.security import validate_chapter_id
          from app.image_io import read_image

          class AuditPipeline:
              @staticmethod
              def _sync_output_dir(chapter_id, manifest, page_indices=None):
                  return None

          chapter_id = validate_chapter_id(os.environ['CHAPTER_ID'])
          chapter_url = os.environ['CHAPTER_URL']
          raw_root = Path('data/raw') / chapter_id
          source_dir = raw_root / 'source'
          sliced_dir = raw_root / 'sliced'
          processed_dir = Path('data/processed') / chapter_id
          out = Path('benchmark-results/shadow-slave-ch1')
          sheets = out / 'ocr-cards'
          audit_crops = out / 'ocr-crops'
          for p in (raw_root, processed_dir, out):
              if p.exists():
                  shutil.rmtree(p)
          source_dir.mkdir(parents=True, exist_ok=True)
          sliced_dir.mkdir(parents=True, exist_ok=True)
          processed_dir.mkdir(parents=True, exist_ok=True)
          sheets.mkdir(parents=True, exist_ok=True)
          audit_crops.mkdir(parents=True, exist_ok=True)

          raw_paths = download_chapter(chapter_url, source_dir)
          if not raw_paths:
              raise RuntimeError('fresh downloader returned zero source images')

          def sha256_file(path):
              digest = hashlib.sha256()
              with Path(path).open('rb') as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b''):
                      digest.update(chunk)
              return digest.hexdigest()

          source_index = {
              'schema': 'manga-translator.source-index.v1',
              'chapter_id': chapter_id,
              'source_url': chapter_url,
              'sources': [
                  {
                      'source_page': index,
                      'path': Path(path).as_posix(),
                      'sha256': sha256_file(path),
                  }
                  for index, path in enumerate(raw_paths)
              ],
          }
          (raw_root / 'source-index.json').write_text(
              json.dumps(source_index, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )

          workers = max(1, min(int(PIPELINE_DEFAULT_WORKERS), int(PIPELINE_SLICE_WORKER_LIMIT), len(raw_paths)))
          results = {}
          def one(item):
              i, path = item
              return i, slice_image(path, sliced_dir, f'{i:03d}', return_metadata=True)
          with ThreadPoolExecutor(max_workers=workers) as pool:
              futures = [pool.submit(one, (i, p)) for i, p in enumerate(raw_paths)]
              for future in as_completed(futures):
                  i, items = future.result()
                  results[i] = items

          pages = []
          for source_index in range(len(raw_paths)):
              for slice_index, item in enumerate(results[source_index]):
                  core = {k: item.get(k) for k in (
                      'source_y1','source_y2','core_y1','core_y2','core_source_y1','core_source_y2',
                      'unsafe_before','unsafe_after','source_height'
                  )}
                  pages.append({
                      'original': Path(item['path']).as_posix(), 'clean': None, 'boxes': [], 'skipped': False,
                      'excluded_regions': [], 'source_page': source_index, 'slice_index': slice_index,
                      'stitch_core': core,
                  })

          manifest = {
              'chapter_id': chapter_id,
              'series_slug': os.environ['SERIES_SLUG'],
              'chapter_number': int(os.environ['CHAPTER_NUMBER']),
              'source_url': chapter_url,
              'pages': pages,
              'workflow': {'stage': 'preview', 'page_index': 0},
          }
          (processed_dir / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')

          pipeline = OptimizedChapterPipeline()
          indices = list(range(len(pages)))
          clean_t0 = time.perf_counter()
          for start in range(0, len(indices), 16):
              batch = indices[start:start+16]
              t0 = time.perf_counter()
              pipeline.process_pages(chapter_id, batch, workers=2)
              print(f'clean {start+len(batch)}/{len(indices)} in {time.perf_counter()-t0:.1f}s')
          clean_wall = time.perf_counter() - clean_t0

          manifest = load_manifest_raw(chapter_id)
          safe = sum(bool(b.get('safe_to_inpaint')) for p in manifest.get('pages', []) for b in (p.get('boxes') or []))
          review = sum(not bool(b.get('safe_to_inpaint')) for p in manifest.get('pages', []) for b in (p.get('boxes') or []))

          service = OCRService(MultiLangOCR(), AuditPipeline())
          plan = service.plan_chapter(chapter_id)
          if not plan:
              raise RuntimeError('OCR plan is empty')
          print(f'OCR plan targets: {len(plan)}')

          ocr_t0 = time.perf_counter()
          ocr_results = []
          errors = []
          for n, (page_index, box_id) in enumerate(plan, start=1):
              t0 = time.perf_counter()
              try:
                  result = service.inspect_box_id(chapter_id, page_index, box_id, 'en', force=True)
                  result['page_index'] = page_index
                  result['elapsed_ms'] = round((time.perf_counter() - t0) * 1000.0, 3)
                  ocr_results.append(result)
              except Exception as exc:
                  errors.append({'page_index': page_index, 'box_id': box_id, 'error': f'{type(exc).__name__}: {exc}'})
              if n == 1 or n % 10 == 0 or n == len(plan):
                  print(f'ocr {n}/{len(plan)} results={len(ocr_results)} errors={len(errors)}')
          ocr_wall = time.perf_counter() - ocr_t0

          quality = Counter(str(r.get('quality') or 'unknown') for r in ocr_results)
          reasons = Counter(str(r.get('quality_reason') or 'none') for r in ocr_results)
          weak = [r for r in ocr_results if str(r.get('quality')) in {'review', 'reject'}]
          empty = sum(not str(r.get('text') or '').strip() for r in ocr_results)
          low = sum(r.get('confidence') is not None and float(r['confidence']) < 0.80 for r in ocr_results)
          retry = sum(bool(r.get('retry_applied')) for r in ocr_results)

          report = {
              'benchmark': 'shadow-slave-ch1-fresh-clean-ocr-v2',
              'chapter_id': chapter_id,
              'chapter_url': chapter_url,
              'source_images': len(raw_paths),
              'slices': len(pages),
              'clean': {
                  'wall_s': round(clean_wall, 3),
                  'slices_per_min': round(60.0 * len(pages) / max(clean_wall, 0.001), 3),
                  'safe_boxes': int(safe),
                  'review_boxes': int(review),
              },
              'ocr': {
                  'planned': len(plan),
                  'completed': len(ocr_results),
                  'errors': errors,
                  'quality': dict(quality),
                  'quality_reasons': dict(reasons),
                  'empty': int(empty),
                  'low_conf_lt_0_80': int(low),
                  'review_or_reject': len(weak),
                  'retry': int(retry),
                  'wall_s': round(ocr_wall, 3),
                  'mean_ms_per_target': round(sum(float(r['elapsed_ms']) for r in ocr_results) / max(1, len(ocr_results)), 3),
              },
              'results': ocr_results,
          }
          manifest = load_manifest_raw(chapter_id)
          by_id = {}
          for pi, page in enumerate(manifest.get('pages', [])):
              for bi, box in enumerate(page.get('boxes') or []):
                  if isinstance(box, dict) and box.get('id'):
                      by_id[str(box['id'])] = (pi, bi, page, box)

          font = ImageFont.load_default()
          def wrap_lines(text, width=46, max_lines=7):
              lines = []
              for paragraph in str(text or '').replace('\r', '').split('\n'):
                  lines.extend(textwrap.wrap(paragraph, width=width) or [''])
              return lines[:max_lines]

          cards = []
          for result in ocr_results:
              info = by_id.get(str(result.get('box_id')))
              if info is None:
                  continue
              pi, bi, page, box = info
              image = read_image(Path(page['original']))
              x1, y1, x2, y2 = _ocr_crop_bounds(image.shape, box)
              if x2 <= x1 or y2 <= y1:
                  continue
              crop = Image.fromarray(image[y1:y2, x1:x2, ::-1]).convert('RGB')
              crop_name = f'p{pi:03d}-b{bi:03d}-{hashlib.sha256(str(result.get("box_id")).encode()).hexdigest()[:12]}.png'
              crop_path = audit_crops / crop_name
              crop.save(crop_path, compress_level=6)
              result['audit_crop'] = {
                  'path': crop_path.relative_to(out).as_posix(),
                  'sha256': sha256_file(crop_path),
                  'bounds': [int(x1), int(y1), int(x2), int(y2)],
              }
              crop.thumbnail((480, 240), Image.Resampling.LANCZOS)
              lines = [
                  f'p{pi:03d} b{bi} {box.get("semantic_type")} {result.get("box_id")}',
                  f'q={result.get("quality")} reason={result.get("quality_reason")} conf={result.get("confidence")}',
                  f'retry={result.get("retry_applied")}',
                  'OCR:', *wrap_lines(result.get('text')),
              ]
              h = crop.height + 18 * len(lines) + 20
              card = Image.new('RGB', (max(560, crop.width + 20), h), 'white')
              card.paste(crop, (10, 8))
              d = ImageDraw.Draw(card)
              y = crop.height + 14
              for line in lines:
                  d.text((10, y), line, fill='black', font=font)
                  y += 18
              cards.append(card)

          for start in range(0, len(cards), 9):
              group = cards[start:start+9]
              cols = 3
              rows = math.ceil(len(group) / cols)
              cw = max(c.width for c in group)
              ch = max(c.height for c in group)
              sheet = Image.new('RGB', (cols*cw, rows*ch), 'white')
              for j, card in enumerate(group):
                  sheet.paste(card, ((j % cols) * cw, (j // cols) * ch))
              sheet.save(sheets / f'ocr-{start:03d}-{start+len(group)-1:03d}.jpg', quality=92)

          (out / 'report.json').write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8')
          (out / 'weak-cases.json').write_text(json.dumps(weak, ensure_ascii=False, indent=2), encoding='utf-8')

          print('SHADOW_SLAVE_CH1=' + json.dumps({
              'source_images': len(raw_paths), 'slices': len(pages),
              'safe': int(safe), 'review': int(review),
              'ocr_targets': len(plan), 'quality': dict(quality),
              'weak': len(weak), 'errors': len(errors),
              'clean_slices_per_min': report['clean']['slices_per_min'],
              'ocr_wall_s': report['ocr']['wall_s'],
          }, ensure_ascii=False))
          if errors:
              raise RuntimeError(f'OCR audit had {len(errors)} runtime errors')
          PY

      - name: Build E0 source-hashed failure review queue
        if: success()
        run: |
          python scripts/build_e0_review_queue.py \
            --processing-manifest data/processed/${CHAPTER_ID}/manifest.json \
            --source-index data/raw/${CHAPTER_ID}/source-index.json \
            --ocr-report benchmark-results/shadow-slave-ch1/report.json \
            --out-dir benchmark-results/shadow-slave-ch1/e0 \
            --repo-sha "${GITHUB_SHA}" \
            --evidence-ref "github-actions:${GITHUB_RUN_ID}:shadow-slave-ch1-ocr-audit" \
            --model bubble=models/bubble_yolo.onnx \
            --model text=models/text_segmenter.onnx \
            --model lama_dynamic=models/lama-manga-dynamic.onnx

      - name: Write E0 reviewer decision template
        if: success()
        run: |
          python scripts/apply_e0_review_decisions.py \
            --review-queue benchmark-results/shadow-slave-ch1/e0/review-queue.json \
            --failure-registry benchmark-results/shadow-slave-ch1/e0/failure-registry.jsonl \
            --ocr-samples benchmark-results/shadow-slave-ch1/e0/ocr-review-samples.json \
            --template-out benchmark-results/shadow-slave-ch1/e0/review-decisions.template.json

      - name: Benchmark inpaint accuracy with ground truth and real audit
        if: success()
        run: |
          python scripts/benchmark_inpaint_accuracy.py \
            --chapter-id 5e8ce7e3 \
            --out benchmark-results/shadow-slave-ch1/inpaint-accuracy.json

      - name: Build compact inpaint audit
        if: always()
        run: |
          if [ ! -f data/processed/5e8ce7e3/manifest.json ]; then exit 0; fi
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont

          root = Path('.')
          manifest = json.loads(
              (root / 'data/processed/5e8ce7e3/manifest.json').read_text(encoding='utf-8')
          )
          pages = manifest.get('pages') or []
          out = root / 'benchmark-results/shadow-slave-ch1/compact'
          out.mkdir(parents=True, exist_ok=True)

          def metric(page, section, key):
              return float(
                  (((page.get('processing_metrics') or {}).get(section) or {}).get(key)) or 0.0
              )

          def aggregate(section, key):
              values = [metric(page, section, key) for page in pages]
              values = [value for value in values if value > 0.0]
              return {
                  'count': len(values),
                  'sum_ms': round(sum(values), 3),
                  'mean_ms': round(sum(values) / max(1, len(values)), 3),
                  'max_ms': round(max(values), 3) if values else 0.0,
              }

          detector_totals = {}
          inpaint_totals = {}
          for page in pages:
              for section, target in (
                  ('detector', detector_totals),
                  ('auto_inpaint', inpaint_totals),
              ):
                  values = (page.get('processing_metrics') or {}).get(section) or {}
                  for key, value in values.items():
                      if isinstance(value, (int, float)) and not isinstance(value, bool):
                          target[key] = target.get(key, 0) + value

          report_path = root / 'benchmark-results/shadow-slave-ch1/report.json'
          report = json.loads(report_path.read_text(encoding='utf-8')) if report_path.exists() else {}
          accuracy_path = root / 'benchmark-results/shadow-slave-ch1/inpaint-accuracy.json'
          accuracy = json.loads(accuracy_path.read_text(encoding='utf-8')) if accuracy_path.exists() else None
          compact = {
              'run_id': __import__('os').environ.get('GITHUB_RUN_ID'),
              'chapter_id': manifest.get('chapter_id'),
              'source_url': manifest.get('source_url'),
              'source_images': len({page.get('source_page') for page in pages}),
              'slices': len(pages),
              'clean': report.get('clean'),
              'ocr': report.get('ocr'),
              'inpaint_accuracy': accuracy,
              'processing': {
                  'timing_ms': {
                      key: aggregate('timing_ms', key)
                      for key in ('read', 'detect', 'auto_inpaint', 'residue_verify', 'write', 'total')
                  },
                  'detector_totals': detector_totals,
                  'auto_inpaint_totals': inpaint_totals,
                  'last_processing_run': manifest.get('last_processing_run'),
              },
              'samples': [],
          }

          def timing(page, key):
              return metric(page, 'timing_ms', key)

          ranked = sorted(range(len(pages)), key=lambda i: timing(pages[i], 'auto_inpaint'), reverse=True)
          residue = [
              i for i, page in enumerate(pages)
              if int((((page.get('processing_metrics') or {}).get('detector') or {}).get('post_inpaint_residue') or 0)) > 0
          ]
          selected = []
          for page_index in ranked + residue + [0, len(pages) // 2, max(0, len(pages) - 1)]:
              if not 0 <= page_index < len(pages) or page_index in {item[0] for item in selected}:
                  continue
              page = pages[page_index]
              boxes = [box for box in (page.get('boxes') or []) if box.get('safe_to_inpaint')]
              if boxes:
                  selected.append((page_index, max(boxes, key=lambda box: float(box.get('confidence') or 0.0))))
              if len(selected) >= 12:
                  break

          font = ImageFont.load_default()
          for sample_index, (page_index, box) in enumerate(selected):
              page = pages[page_index]
              original_value = page.get('original')
              clean_value = page.get('clean')
              if not original_value or not clean_value:
                  continue
              original_path = root / str(original_value)
              clean_path = root / str(clean_value)
              if not original_path.is_file() or not clean_path.is_file():
                  continue
              before = Image.open(original_path).convert('RGB')
              after = Image.open(clean_path).convert('RGB')
              x1 = max(0, int(box['x1']) - 48)
              y1 = max(0, int(box['y1']) - 48)
              x2 = min(before.width, int(box['x2']) + 48)
              y2 = min(before.height, int(box['y2']) + 48)
              if x2 <= x1 or y2 <= y1:
                  continue
              before = before.crop((x1, y1, x2, y2))
              after = after.crop((x1, y1, x2, y2))
              before.thumbnail((720, 480), Image.Resampling.LANCZOS)
              after = after.resize(before.size, Image.Resampling.LANCZOS)
              label_h = 28
              card = Image.new('RGB', (before.width * 2, before.height + label_h), 'white')
              card.paste(before, (0, label_h))
              card.paste(after, (before.width, label_h))
              draw = ImageDraw.Draw(card)
              draw.text((8, 7), f'p{page_index:03d} BEFORE', fill='black', font=font)
              draw.text((before.width + 8, 7), f'AFTER  inpaint={timing(page, "auto_inpaint"):.1f}ms', fill='black', font=font)
              sample_path = out / f'inpaint-{sample_index:03d}-p{page_index:03d}.jpg'
              card.save(sample_path, quality=92)
              compact['samples'].append({
                  'page_index': page_index,
                  'box': {key: box.get(key) for key in ('id', 'x1', 'y1', 'x2', 'y2', 'confidence', 'semantic_type')},
                  'timing_ms': (page.get('processing_metrics') or {}).get('timing_ms'),
                  'detector': (page.get('processing_metrics') or {}).get('detector'),
                  'auto_inpaint': (page.get('processing_metrics') or {}).get('auto_inpaint'),
                  'sample': sample_path.as_posix(),
              })

          (out / 'report.json').write_text(json.dumps(compact, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps({'compact_report': (out / 'report.json').as_posix(), 'samples': len(compact['samples'])}))
          PY

      - name: Upload compact Shadow Slave audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shadow-slave-ch1-compact-${{ github.run_id }}
          path: benchmark-results/shadow-slave-ch1/compact/
          retention-days: 7
          compression-level: 6
          if-no-files-found: ignore

      - name: Upload E0 review evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: shadow-slave-ch1-e0-review-${{ github.run_id }}
          path: |
            benchmark-results/shadow-slave-ch1/e0/
            benchmark-results/shadow-slave-ch1/ocr-crops/*.png
            data/raw/5e8ce7e3/source-index.json
            data/processed/5e8ce7e3/manifest.json
          retention-days: 7
          compression-level: 6
          if-no-files-found: error

      - name: Upload Shadow Slave chapter 1 audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shadow-slave-ch1-ocr-audit-${{ github.run_id }}
          path: |
            benchmark-results/shadow-slave-ch1/
            data/raw/5e8ce7e3/source-index.json
            data/raw/5e8ce7e3/sliced/*.png
            data/processed/5e8ce7e3/manifest.json
            data/processed/5e8ce7e3/clean_*.png
          retention-days: 7
          compression-level: 6
          if-no-files-found: error
# benchmark rerun after 1b9d886: compact inpaint visual audit
