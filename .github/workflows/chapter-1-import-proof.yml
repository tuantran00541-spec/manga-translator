name: Chapter 1 Import Proof Pack
on:
  push:
    branches:
      - chapter/war-of-extinction-1
    paths:
      - .github/workflows/chapter-1-import-proof.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chapter/war-of-extinction-1
      - name: Verify import proof files
        run: |
          test -f chapters/war-of-extinction-1/review/01-import/source-contact-sheet.jpg
          test -f chapters/war-of-extinction-1/review/01-import/slice-contact-sheet.jpg
          test -f chapters/war-of-extinction-1/review/01-import/import-summary.json
          test -f chapters/war-of-extinction-1/review/01-import/manifest.json
      - name: Upload compact import proof
        uses: actions/upload-artifact@v4
        with:
          name: 01-import-proof-05efce51
          path: |
            chapters/war-of-extinction-1/review/01-import/source-contact-sheet.jpg
            chapters/war-of-extinction-1/review/01-import/slice-contact-sheet.jpg
            chapters/war-of-extinction-1/review/01-import/import-summary.json
            chapters/war-of-extinction-1/review/01-import/manifest.json
          retention-days: 7
          if-no-files-found: error
