name: Qwen3.8 exact prompt block F32 cache probe

on:
  push:
    branches: [research/qwen3.8-27b-runtime-finish]
    paths:
      - "research/qwen38/qwen38_k3_prompt_block_cached_probe.py"
      - ".github/workflows/qwen38-k3-prompt-block-cache.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  HF_HUB_DISABLE_TELEMETRY: "1"
  QWEN_REVISION: "1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0"

jobs:
  prompt-block-cache:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[qwen-prefill-cache]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Exact target and cache sanity
        shell: bash
        run: |
          set -euo pipefail
          cc -O3 -std=c11 -mavx2 -fno-fast-math -ffp-contract=off \
            -DQWEN_AVX2_EXACT_SELFTEST research/qwen38/gguf_quant_dot_avx2.c -lm \
            -o "$RUNNER_TEMP/qwen-avx2-selftest"
          "$RUNNER_TEMP/qwen-avx2-selftest"
          PYTHONPATH=research/qwen38 python -u research/qwen38/qwen38_k3_prompt_block_cached_probe.py sanity

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Runner CPU and storage information
        shell: bash
        run: |
          lscpu
          df -h
          free -h

      - name: Reclaim disk
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true
          docker system prune -af || true
          df -h
          free -h

      - name: Install runtime dependencies
        run: python -m pip install --no-cache-dir huggingface_hub hf_xet tokenizers

      - name: Download pinned real GGUF and tokenizer once
        shell: bash
        run: |
          set -euo pipefail
          readarray -t files < <(python - <<'PY'
          from huggingface_hub import hf_hub_download
          rev="1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0"
          print(hf_hub_download(
              "bartowski/Qwen3.8-27B-GGUF",
              filename="Qwen3.8-27B-Q6_K_L.gguf",
              local_dir="${{ runner.temp }}/qwen38-model",
          ))
          print(hf_hub_download(
              "Qwen/Qwen3.8-27B",
              filename="tokenizer.json",
              revision=rev,
              local_dir="${{ runner.temp }}/qwen38-tokenizer",
          ))
          PY
          )
          test -f "${files[0]}"; test -f "${files[1]}"
          echo "MODEL=${files[0]}" >> "$GITHUB_ENV"
          echo "TOKENIZER_JSON=${files[1]}" >> "$GITHUB_ENV"
          echo "K3_WORK=$RUNNER_TEMP/qwen38-prompt-cache-k3" >> "$GITHUB_ENV"
          echo "EVIDENCE=$RUNNER_TEMP/qwen38-prompt-cache-evidence" >> "$GITHUB_ENV"

      - name: Validate pinned decoder inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          PYTHONPATH=research/qwen38 python -u research/qwen38/qwen35_gguf_decoder_contract.py real \
            --model "$MODEL" --output "$EVIDENCE/inventory.json" \
            2>&1 | tee "$EVIDENCE/inventory.log"

      - name: Compile exact target and recurrent-state bridges
        shell: bash
        run: |
          set -euo pipefail
          cc -O3 -std=c11 -mavx2 -fno-fast-math -ffp-contract=off -fPIC -shared \
            research/qwen38/gguf_quant_dot_avx2.c -lm -o "$RUNNER_TEMP/libqwen_quant_avx2.so"
          cc -O2 -std=c11 -fPIC -shared research/qwen38/gdn_state_ar.c -lm \
            -o "$RUNNER_TEMP/libqwen_gdn_serial.so"

      - name: Run same-run block-v1 vs F32-cache probe
        timeout-minutes: 22
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$K3_WORK" "$EVIDENCE"
          PYTHONPATH=research/qwen38 python -u research/qwen38/qwen38_k3_prompt_block_cached_probe.py run \
            --model "$MODEL" \
            --native-lib "$RUNNER_TEMP/libqwen_quant_avx2.so" \
            --state-lib "$RUNNER_TEMP/libqwen_gdn_serial.so" \
            --inventory "$EVIDENCE/inventory.json" \
            --tokenizer-json "$TOKENIZER_JSON" \
            --prompt "Write a 700-word essay on curiosity." --raw-prompt \
            --work-dir "$K3_WORK" --output "$EVIDENCE/prompt-cache.json" \
            2>&1 | tee "$EVIDENCE/prompt-cache.log"
          grep -F "QWEN38_K3_PROMPT_BLOCK_F32_CACHE_EXACT_PASS" "$EVIDENCE/prompt-cache.log"

      - name: Validate exactness and print cache summary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads((Path(os.environ["EVIDENCE"])/"prompt-cache.json").read_text(encoding="utf-8"))
          assert r["status"] == "PASS"
          assert r["model_sha256"] == "a487690b9f17de581857c4ae484dab50800335bb9eb978a4fb02c0465629dc0a"
          assert r["prompt_token_count"] == 11
          assert r["hidden_vectors_bitwise_exact"] is True
          assert r["persistent_state_bitwise_exact"] is True
          assert r["hidden_sha256"] == "e40dfb2d14456006608b095dd0c6bd018cdeed4214fdc573c8e352fb463f2e04"
          assert r["state_sha256"] == "41f6fcd8f9947833956aaad0175da197456a3e678e0e31b40c5d7a08560fda06"
          assert r["block_v1_k3_bytes"] == 21127430144
          assert r["block_cached_k3_bytes"] == 21127430144
          assert r["reader"]["direct_io"] is True
          print("QWEN38_K3_PROMPT_BLOCK_F32_CACHE_REAL_PASS")
          print(json.dumps({
              "block_v1_seconds_same_run": r["block_v1_seconds_same_run"],
              "block_cached_seconds_same_run": r["block_cached_seconds_same_run"],
              "speedup_vs_block_v1_same_run": r["speedup_vs_block_v1_same_run"],
              "block_v1_k3_bytes": r["block_v1_k3_bytes"],
              "block_cached_k3_bytes": r["block_cached_k3_bytes"],
              "max_rss_gib": r["max_rss_gib"],
          }, indent=2))
          PY

      - name: Upload cache evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen38-prompt-block-cache-${{ github.run_id }}
          path: ${{ runner.temp }}/qwen38-prompt-cache-evidence/
          if-no-files-found: warn
          retention-days: 14
