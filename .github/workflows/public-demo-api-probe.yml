name: Public demo API probe

on:
  push:
    branches:
      - probe/public-demo-api
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bearer-egress-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call public demo API over real HTTPS
        shell: bash
        run: |
          set -euo pipefail
          KEY='gk_demo_public_v1'
          BODY="$RUNNER_TEMP/genji-projects.json"

          http_status=$(curl -sS --connect-timeout 10 --max-time 20 \
            -o "$BODY" -w '%{http_code}' \
            -H "Authorization: Bearer ${KEY}" \
            https://www.genjicrowd.com/v1/projects)

          echo "http_status=${http_status}"
          test "$http_status" = "200"

          python - "$BODY" <<'PY'
          import json, sys
          payload = json.load(open(sys.argv[1], encoding='utf-8'))
          print('json_type=' + type(payload).__name__)
          if isinstance(payload, dict):
              print('root_keys=' + ','.join(sorted(payload.keys())))
          elif isinstance(payload, list):
              print('item_count=' + str(len(payload)))
          PY
