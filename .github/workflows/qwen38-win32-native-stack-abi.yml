name: Qwen3.8 Win32 complete exact native-stack ABI

on:
  push:
    branches:
      - research/qwen3.8-27b-runtime-finish
    paths:
      - research/qwen38/qwen38_win32_bootstrap.py
      - research/qwen38/qwen38_win32_native_stack_abi.py
      - research/qwen38/qwen38_current_best_runtime_win32.py
      - research/qwen38/q6_persistent_pool_portable_exact.c
      - research/qwen38/qwen_thread_compat.h
      - research/qwen38/gguf_quant_dot.c
      - research/qwen38/gguf_quant_dot_avx2.c
      - research/qwen38/gguf_quant_matvec_many_avx2.c
      - research/qwen38/gguf_quant_matvec_many_bridge.c
      - research/qwen38/gguf_quant_matvec_many_noalloc_bridge.c
      - research/qwen38/gdn_state_ar.c
      - research/qwen38/gdn_state_batch_exact.c
      - research/qwen38/f32_fsum_matvec.c
      - research/qwen38/attention_core_exact.c
      - research/qwen38/gdn_conv_silu_exact.c
      - research/qwen38/gdn_output_gate_exact.c
      - research/qwen38/swiglu_exact.c
      - research/qwen38/rmsnorm_exact.c
      - research/qwen38/rmsnorm_many_exact.c
      - research/qwen38/rmsnorm_heads_many_exact.c
      - research/qwen38/residual_add_exact.c
      - research/qwen38/attention_gate_exact.c
      - research/qwen38/gdn_repeat_scale_exact.c
      - research/qwen38/win32_direct_io.c
      - .github/workflows/qwen38-win32-native-stack-abi.yml
  workflow_dispatch:

jobs:
  win32-native-stack-abi:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Compiler information
        shell: pwsh
        run: |
          clang --version
          python --version

      - name: Verify proven arithmetic source blobs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = @{
            'research/qwen38/attention_core_exact.c' = '580953c54acbbc243763dc08cb02bae676f56d7c'
            'research/qwen38/attention_gate_exact.c' = '9e648ee01b9cf1a1e1367903d04aea45cb402a07'
            'research/qwen38/f32_fsum_matvec.c' = 'c07db99577f3925061410770d09491c338ca3747'
            'research/qwen38/gdn_conv_silu_exact.c' = 'e25726656288846e081bc08af90975711eb09987'
            'research/qwen38/gdn_output_gate_exact.c' = 'e67f602ee230dd3ef127f5a0ddb2c8edb7bf1bc0'
            'research/qwen38/gdn_repeat_scale_exact.c' = 'a85f1e4990d6bd7b83a68cc7e8333dda5d01371b'
            'research/qwen38/gdn_state_ar.c' = 'df79e103920145225133f745fcbff0763ea6a5c6'
            'research/qwen38/gdn_state_batch_exact.c' = 'c472ef3fce53dd07dca53dec10feeab6d95b9442'
            'research/qwen38/gguf_quant_dot.c' = 'b8f8a8de51df341994827ad5d3265218d5ae0920'
            'research/qwen38/gguf_quant_dot_avx2.c' = '4022a1501cd4503af0ce29c356429dddfe2b05c8'
            'research/qwen38/gguf_quant_matvec_many_avx2.c' = 'f9265ced3ddb4902710039ee4d5da459e829ad76'
            'research/qwen38/gguf_quant_matvec_many_bridge.c' = 'eb6473f8acefab0c57eaa7e76bf673d962776cd2'
            'research/qwen38/gguf_quant_matvec_many_noalloc_bridge.c' = 'c7411f8d521e767f9dead9a74ad91a5a6ed94654'
            'research/qwen38/q6_persistent_pool_portable_exact.c' = 'fbd991e715068834e1a77cce921e4410e67bf8e2'
            'research/qwen38/qwen_thread_compat.h' = '2b90018e141f88c85852ec32604b7075a5fe0353'
            'research/qwen38/residual_add_exact.c' = 'bdc96e14442dbfe1b870a8a9417d19d3bffff4f5'
            'research/qwen38/rmsnorm_exact.c' = '7a8c7a8bb39d7e55e6cbd8460954140042580a11'
            'research/qwen38/rmsnorm_many_exact.c' = '196c143a6a4f3cef0ee7b90968a2a81075186c7d'
            'research/qwen38/rmsnorm_heads_many_exact.c' = '200888a3f793bc18020b0640bcf33f1ce02f6394'
            'research/qwen38/swiglu_exact.c' = '5cbf5629ab777a84735340f747a0e77cb8eb7018'
            'research/qwen38/win32_direct_io.c' = '689d5a22b0353ec1ee19ba9c037be64194bd041f'
          }
          foreach ($entry in $expected.GetEnumerator()) {
            $actual = (git hash-object $entry.Key).Trim()
            if ($actual -ne $entry.Value) {
              throw "proven-source blob changed: $($entry.Key) actual=$actual expected=$($entry.Value)"
            }
          }
          Write-Host "QWEN38_WIN32_NATIVE_SOURCE_INTEGRITY_PASS"

      - name: Compile exact Windows DLL bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'qwen-win32-native-stack'
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          function Build-Dll {
            param(
              [string]$Name,
              [string[]]$Sources,
              [string[]]$Exports,
              [string[]]$ExtraFlags = @()
            )
            $args = @(
              '-O3', '-std=c11', '-shared',
              '-fno-fast-math', '-fno-associative-math', '-ffp-contract=off',
              '-fno-vectorize', '-fno-slp-vectorize'
            )
            $args += $ExtraFlags
            $args += $Sources
            foreach ($symbol in $Exports) {
              $args += '-Xlinker'
              $args += "/EXPORT:$symbol"
            }
            $target = Join-Path $out $Name
            $args += @('-o', $target)
            & clang @args
            if ($LASTEXITCODE -ne 0) {
              throw "clang failed for $Name rc=$LASTEXITCODE"
            }
          }

          Build-Dll 'qwen_quant_base.dll' `
            @('research/qwen38/gguf_quant_matvec_many_bridge.c') `
            @(
              'qwen_quantize_q8_k_scalar',
              'qwen_quantize_q8_0_scalar',
              'qwen_matvec_q6_k_q8_k_scalar',
              'qwen_matvec_q8_0_q8_0_scalar',
              'qwen_matvec_many_q6_k_q8_k_bridge',
              'qwen_matvec_many_q8_0_q8_0_bridge'
            ) `
            @('-mavx2')

          Build-Dll 'qwen_q6_portable.dll' `
            @('research/qwen38/q6_persistent_pool_portable_exact.c') `
            @(
              'qwen_q6_pool_create',
              'qwen_q6_pool_destroy',
              'qwen_q6_pool_matvec_many',
              'qwen_q6_pool_calls',
              'qwen_q6_pool_threads',
              'qwen_matvec_many_q6_k_q8_k_bridge',
              'qwen_matvec_many_q8_0_q8_0_bridge'
            ) `
            @('-mavx2')

          Build-Dll 'qwen_gdn_state.dll' `
            @('research/qwen38/gdn_state_ar.c') `
            @('qwen_gdn_ar_step_f32')

          Build-Dll 'qwen_gdn_state_batch.dll' `
            @('research/qwen38/gdn_state_ar.c', 'research/qwen38/gdn_state_batch_exact.c') `
            @('qwen_gdn_ar_batch_f32')

          Build-Dll 'qwen_f32.dll' `
            @('research/qwen38/f32_fsum_matvec.c') `
            @('qwen_matvec_f32_fsum_exact')

          Build-Dll 'qwen_attention_core.dll' `
            @('research/qwen38/attention_core_exact.c') `
            @('qwen_attention_core_f32_exact')

          Build-Dll 'qwen_gdn_conv_silu.dll' `
            @('research/qwen38/gdn_conv_silu_exact.c') `
            @('qwen_gdn_conv_silu_many_f32_exact')

          Build-Dll 'qwen_gdn_output_gate.dll' `
            @('research/qwen38/gdn_output_gate_exact.c') `
            @('qwen_gdn_output_rmsnorm_gate_f32_exact')

          Build-Dll 'qwen_swiglu.dll' `
            @('research/qwen38/swiglu_exact.c') `
            @('qwen_swiglu_many_f32_exact')

          Build-Dll 'qwen_rmsnorm.dll' `
            @('research/qwen38/rmsnorm_exact.c') `
            @('qwen38_rmsnorm_exact_f32', 'qwen38_rmsnorm_heads_exact_f32')

          Build-Dll 'qwen_rmsnorm_many.dll' `
            @('research/qwen38/rmsnorm_exact.c', 'research/qwen38/rmsnorm_many_exact.c') `
            @('qwen38_rmsnorm_many_exact_f32')

          Build-Dll 'qwen_rmsnorm_heads_many.dll' `
            @('research/qwen38/rmsnorm_exact.c', 'research/qwen38/rmsnorm_heads_many_exact.c') `
            @('qwen38_rmsnorm_heads_many_exact_f32')

          Build-Dll 'qwen_residual_add.dll' `
            @('research/qwen38/residual_add_exact.c') `
            @('qwen38_residual_add_many_exact_f32')

          Build-Dll 'qwen_attention_gate.dll' `
            @('research/qwen38/attention_gate_exact.c') `
            @('qwen38_attention_gate_exact_f32')

          Build-Dll 'qwen_gdn_repeat_scale.dll' `
            @('research/qwen38/gdn_repeat_scale_exact.c') `
            @('qwen38_gdn_repeat_scale_many_exact_f32')

          Build-Dll 'qwen_win32_direct_io.dll' `
            @('research/qwen38/win32_direct_io.c') `
            @(
              'qwen_win32_direct_open_utf8',
              'qwen_win32_direct_close',
              'qwen_win32_direct_alignment',
              'qwen_win32_direct_read',
              'qwen_win32_direct_no_buffering',
              'qwen_win32_direct_overlapped',
              'qwen_win32_buffer_create',
              'qwen_win32_buffer_ptr',
              'qwen_win32_buffer_destroy'
            )

          "QWEN_WIN32_NATIVE_DLL_DIR=$out" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "QWEN38_WIN32_NATIVE_DLL_BUILD_PASS"

      - name: Python syntax gate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m py_compile `
            research/qwen38/qwen38_win32_bootstrap.py `
            research/qwen38/qwen38_win32_native_stack_abi.py `
            research/qwen38/qwen38_current_best_runtime_win32.py

      - name: Full generator import and native ABI gate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PYTHONPATH = 'research/qwen38'
          $log = Join-Path $env:RUNNER_TEMP 'qwen-win32-native-stack-abi.log'
          python -u research/qwen38/qwen38_win32_bootstrap.py 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -u research/qwen38/qwen38_win32_native_stack_abi.py `
            --dll-dir $env:QWEN_WIN32_NATIVE_DLL_DIR 2>&1 | Tee-Object -FilePath $log -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Select-String -Path $log -SimpleMatch 'QWEN38_WIN32_GENERATOR_BOOTSTRAP_PASS')) {
            throw 'Win32 generator bootstrap marker missing'
          }
          if (-not (Select-String -Path $log -SimpleMatch 'QWEN38_WIN32_NATIVE_STACK_ABI_PASS')) {
            throw 'Win32 native-stack ABI marker missing'
          }
