name: Chapter 218 Checkpoint 02B Clean Local Repair

on:
  push:
    branches:
      - trial/chapter-render-218
    paths:
      - .github/workflows/chapter-218-clean-local-repair.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: chapter-218-human-loop
  cancel-in-progress: false

jobs:
  repair-promo-slice:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      CHAPTER_ID: c2182180
      IMPORT_RUN_ID: "34569128327"
      IMPORT_ARTIFACT: 01-import-c2182180
      CLEAN_RUN_ID: "34569707469"
      CLEAN_ARTIFACT: 02-clean-review-c2182180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: trial/chapter-render-218

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install proof dependency
        run: python -m pip install Pillow==10.4.0

      - name: Restore base checkpoints
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf checkpoint repair
          mkdir -p checkpoint/01-import checkpoint/02-clean repair/overlay/processed repair/proof
          gh run download "$IMPORT_RUN_ID" -n "$IMPORT_ARTIFACT" -D checkpoint/01-import
          gh run download "$CLEAN_RUN_ID" -n "$CLEAN_ARTIFACT" -D checkpoint/02-clean
          test -f checkpoint/01-import/raw/sliced/014_04.png
          test -f checkpoint/02-clean/processed/clean_014_04.png
          test -f checkpoint/02-clean/box-index.json

      - name: Apply local human repair
        run: |
          cp checkpoint/01-import/raw/sliced/014_04.png repair/overlay/processed/clean_014_04.png
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          from PIL import Image, ImageChops, ImageDraw

          raw_path=Path('checkpoint/01-import/raw/sliced/014_04.png')
          base_path=Path('checkpoint/02-clean/processed/clean_014_04.png')
          repaired_path=Path('repair/overlay/processed/clean_014_04.png')
          box_index=json.loads(Path('checkpoint/02-clean/box-index.json').read_text(encoding='utf-8'))
          promo_boxes=[b for b in box_index if int(b.get('page_index',-1))==68]
          if len(promo_boxes)!=6:
              raise SystemExit(f'expected 6 p068 boxes, got {len(promo_boxes)}')

          def sha256(path):
              h=hashlib.sha256()
              with open(path,'rb') as f:
                  for chunk in iter(lambda:f.read(1024*1024),b''): h.update(chunk)
              return h.hexdigest()

          raw=Image.open(raw_path).convert('RGB')
          base=Image.open(base_path).convert('RGB')
          repaired=Image.open(repaired_path).convert('RGB')
          if raw.size!=base.size or raw.size!=repaired.size:
              raise SystemExit('repair dimensions changed')
          diff=ImageChops.difference(raw,repaired)
          if diff.getbbox() is not None:
              raise SystemExit('repaired slice is not pixel-exact RAW restore')

          thumb_w=420
          def thumb(img):
              out=img.copy()
              out.thumbnail((thumb_w,1200))
              return out
          panels=[('RAW / PRESERVE',thumb(raw)),('BASE CLEAN / REJECT',thumb(base)),('REPAIRED / APPROVE',thumb(repaired))]
          pad=24; label_h=42
          canvas=Image.new('RGB',(sum(im.width for _,im in panels)+pad*(len(panels)+1), max(im.height for _,im in panels)+label_h+pad*2),'white')
          draw=ImageDraw.Draw(canvas)
          x=pad
          for label,im in panels:
              draw.text((x,pad),label,fill='black')
              canvas.paste(im,(x,pad+label_h))
              x += im.width+pad
          canvas.save('repair/proof/p068-raw-base-repaired.jpg',quality=92)

          repair={
            'checkpoint':'02b-clean-local-repair',
            'chapter_id':'c2182180',
            'base_clean_run_id':34569707469,
            'base_clean_artifact':'02-clean-review-c2182180',
            'import_run_id':34569128327,
            'import_artifact':'01-import-c2182180',
            'page_index':68,
            'source_page':14,
            'slice_index':4,
            'classification':'non_story_promo_credit',
            'editorial_issue':'base clean destructively removed promo/credit material that must be preserved',
            'action':'restore_raw_slice_pixel_exact',
            'raw_sha256':sha256(raw_path),
            'base_clean_sha256':sha256(base_path),
            'repaired_sha256':sha256(repaired_path),
            'raw_vs_repaired_pixel_diff':0,
            'drop_from_story_object_ids':[b.get('box_id') for b in promo_boxes],
            'tombstone_seed':{
              'source_missing':True,
              'auto_generated':False,
              'origin':'human_review_drop',
              'reason':'non_story_promo_credit'
            },
            'next_action':'STOP_FOR_TARGETED_HUMAN_REVIEW'
          }
          Path('repair/clean-repair.json').write_text(json.dumps(repair,ensure_ascii=False,indent=2),encoding='utf-8')
          Path('repair/HUMAN_CHECKPOINT.txt').write_text(
            'CHECKPOINT: CLEAN LOCAL REPAIR\nReview p068 RAW vs BASE CLEAN vs REPAIRED.\nApprove only if promo/credit is fully restored and repaired slice is pixel-exact RAW.\n',encoding='utf-8')
          print(json.dumps(repair,indent=2))
          PY

      - name: Upload local repair delta
        uses: actions/upload-artifact@v4
        with:
          name: 02b-clean-local-repair-c2182180
          path: repair/
          retention-days: 7
          if-no-files-found: error
