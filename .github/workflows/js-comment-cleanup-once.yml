name: One-shot JavaScript comment cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/js-comment-cleanup-once.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove redundant standalone JavaScript comments
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo 'main moved after this cleanup run started; refusing to rewrite stale source'
            exit 1
          }

          python - <<'PY'
          from pathlib import Path
          import re

          roots = [Path('app/static/js')]
          files = sorted(path for root in roots for path in root.rglob('*.js'))

          keep_markers = (
              'eslint', 'prettier', '@ts-', 'ts-check', 'ts-nocheck',
              'sourceurl', 'sourcemappingurl', 'istanbul', 'c8 ignore',
              'spdx-', 'copyright', 'license', 'licence',
          )

          def must_keep(comment_text: str) -> bool:
              lowered = comment_text.lower()
              return any(marker in lowered for marker in keep_markers)

          def clean_file(path: Path) -> tuple[int, int]:
              original = path.read_text(encoding='utf-8')
              lines = original.splitlines(keepends=True)
              out: list[str] = []
              removed_line_comments = 0
              removed_block_comments = 0
              i = 0

              while i < len(lines):
                  line = lines[i]
                  stripped = line.lstrip()

                  if stripped.startswith('//'):
                      if must_keep(stripped):
                          out.append(line)
                      else:
                          removed_line_comments += 1
                      i += 1
                      continue

                  if stripped.startswith('/*') and not stripped.startswith('/**'):
                      indent_len = len(line) - len(stripped)
                      prefix = line[:indent_len]
                      block = [line]
                      j = i
                      while '*/' not in block[-1] and j + 1 < len(lines):
                          j += 1
                          block.append(lines[j])

                      if '*/' in block[-1]:
                          first = block[0].lstrip()
                          last = block[-1]
                          end_pos = last.find('*/')
                          tail = last[end_pos + 2:].strip() if end_pos >= 0 else 'x'
                          starts_clean = first.startswith('/*')
                          standalone = starts_clean and not tail
                          text = ''.join(block)
                          if standalone and not must_keep(text):
                              removed_block_comments += 1
                              i = j + 1
                              continue

                  out.append(line)
                  i += 1

              cleaned = ''.join(out)
              cleaned = re.sub(r'\n{4,}', '\n\n\n', cleaned)
              if original.endswith('\n') and not cleaned.endswith('\n'):
                  cleaned += '\n'
              if cleaned != original:
                  path.write_text(cleaned, encoding='utf-8')
              return removed_line_comments, removed_block_comments

          total_line = 0
          total_block = 0
          changed = []
          for path in files:
              before = path.read_text(encoding='utf-8')
              line_count, block_count = clean_file(path)
              after = path.read_text(encoding='utf-8')
              total_line += line_count
              total_block += block_count
              if before != after:
                  changed.append((str(path), line_count, block_count))

          print(f'JS files scanned: {len(files)}')
          print(f'Removed standalone // comments: {total_line}')
          print(f'Removed standalone /* */ blocks: {total_block}')
          for path, line_count, block_count in changed:
              print(f'  {path}: line={line_count}, block={block_count}')
          PY

          python -m compileall -q app run.py
          find app/static/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          git diff --check

          python - <<'PY'
          from pathlib import Path

          forbidden = []
          for path in Path('app/static/js').rglob('*.js'):
              for number, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                  stripped = line.lstrip()
                  if stripped.startswith('//'):
                      lowered = stripped.lower()
                      keep = any(marker in lowered for marker in (
                          'eslint', 'prettier', '@ts-', 'ts-check', 'ts-nocheck',
                          'sourceurl', 'sourcemappingurl', 'istanbul', 'c8 ignore',
                          'spdx-', 'copyright', 'license', 'licence',
                      ))
                      if not keep:
                          forbidden.append(f'{path}:{number}:{stripped[:100]}')
          if forbidden:
              raise SystemExit('Standalone JS comments remain:\n' + '\n'.join(forbidden[:30]))
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/static/js
          git rm .github/workflows/js-comment-cleanup-once.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'refactor(js): remove redundant standalone comments'
          git push origin HEAD:main
