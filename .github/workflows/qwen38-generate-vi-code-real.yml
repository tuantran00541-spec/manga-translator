name: Qwen3.8 K3 Vietnamese and code generation

on:
  push:
    branches: [test/qwen3.8-27b]
    paths:
      - "research/qwen38/qwen35_k3_generate.py"
      - ".github/workflows/qwen38-generate-vi-code-real.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  HF_HUB_DISABLE_TELEMETRY: "1"
  QWEN_REVISION: "1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0"

jobs:
  sanity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generator sanity
        run: |
          python -m py_compile research/qwen38/qwen35_k3_generate.py
          python research/qwen38/qwen35_k3_generate.py sanity
          cc -O2 -std=c11 -DQWEN_GDN_STATE_SELFTEST research/qwen38/gdn_state_ar.c -lm -o "$RUNNER_TEMP/gdn-state-selftest"
          "$RUNNER_TEMP/gdn-state-selftest"
          cc -O2 -std=c11 -DQWEN_QUANT_DOT_SELFTEST research/qwen38/gguf_quant_dot.c -lm -o "$RUNNER_TEMP/qwen-quant-selftest"
          "$RUNNER_TEMP/qwen-quant-selftest"

  real-vi-code:
    needs: sanity
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[qwen-generate-vi-code-real]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reclaim disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true
          docker system prune -af || true
          df -h
          free -h
      - name: Install runtime dependencies
        run: python -m pip install --no-cache-dir huggingface_hub hf_xet tokenizers
      - name: Download pinned GGUF and official tokenizer once
        shell: bash
        run: |
          set -euo pipefail
          readarray -t files < <(python - <<'PY'
          from huggingface_hub import hf_hub_download
          rev="1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0"
          print(hf_hub_download(
              "bartowski/Qwen3.8-27B-GGUF",
              filename="Qwen3.8-27B-Q6_K_L.gguf",
              local_dir="${{ runner.temp }}/qwen38-model",
          ))
          print(hf_hub_download(
              "Qwen/Qwen3.8-27B",
              filename="tokenizer.json",
              revision=rev,
              local_dir="${{ runner.temp }}/qwen38-tokenizer",
          ))
          PY
          )
          test -f "${files[0]}"; test -f "${files[1]}"
          echo "MODEL=${files[0]}" >> "$GITHUB_ENV"
          echo "TOKENIZER_JSON=${files[1]}" >> "$GITHUB_ENV"
      - name: Emit mixed-quant decoder contract
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/qwen38-vi-code-evidence"; mkdir -p "$evidence"
          python -u research/qwen38/qwen35_gguf_decoder_contract.py real \
            --model "$MODEL" --output "$evidence/inventory.json" \
            2>&1 | tee "$evidence/inventory.log"
      - name: Compile native runtime bridges
        run: |
          cc -O2 -std=c11 -fPIC -shared research/qwen38/gguf_quant_dot.c -lm -o "$RUNNER_TEMP/libqwen_quant_dot.so"
          cc -O2 -std=c11 -fPIC -shared research/qwen38/gdn_state_ar.c -lm -o "$RUNNER_TEMP/libqwen_gdn_state.so"
      - name: Generate Vietnamese continuation
        timeout-minutes: 25
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/qwen38-vi-code-evidence"; work="$RUNNER_TEMP/qwen38-vi-work"; mkdir -p "$work"
          /usr/bin/time -v python -u research/qwen38/qwen35_k3_generate.py run \
            --model "$MODEL" --native-lib "$RUNNER_TEMP/libqwen_quant_dot.so" \
            --state-lib "$RUNNER_TEMP/libqwen_gdn_state.so" \
            --inventory "$evidence/inventory.json" --tokenizer-json "$TOKENIZER_JSON" \
            --prompt "Xin chào" --raw-prompt --max-new-tokens 3 --max-prompt-tokens 8 \
            --work-dir "$work" --output "$evidence/vi.json" \
            2>&1 | tee "$evidence/vi.log"
      - name: Generate Python code continuation
        timeout-minutes: 35
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/qwen38-vi-code-evidence"; work="$RUNNER_TEMP/qwen38-code-work"; mkdir -p "$work"
          /usr/bin/time -v python -u research/qwen38/qwen35_k3_generate.py run \
            --model "$MODEL" --native-lib "$RUNNER_TEMP/libqwen_quant_dot.so" \
            --state-lib "$RUNNER_TEMP/libqwen_gdn_state.so" \
            --inventory "$evidence/inventory.json" --tokenizer-json "$TOKENIZER_JSON" \
            --prompt "def add(a, b):" --raw-prompt --max-new-tokens 5 --max-prompt-tokens 16 \
            --work-dir "$work" --output "$evidence/code.json" \
            2>&1 | tee "$evidence/code.log"
      - name: Validate Vietnamese and code evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          root=os.path.join(os.environ['RUNNER_TEMP'],'qwen38-vi-code-evidence')
          vi=json.load(open(os.path.join(root,'vi.json'),encoding='utf-8'))
          code=json.load(open(os.path.join(root,'code.json'),encoding='utf-8'))
          for d,prompt,limit in ((vi,'Xin chào',3),(code,'def add(a, b):',5)):
              assert d['schema']=='qwen38-k3-generate-v1' and d['status']=='PASS'
              assert d['mode']=='raw' and d['prompt']==prompt
              assert 1 <= len(d['generated_token_ids']) <= limit
              assert isinstance(d['generated_text'],str)
          print('QWEN38_VI_CODE_TEXT PASS')
          print('VI prompt_ids=',vi['prompt_token_ids'])
          print('VI generated_ids=',vi['generated_token_ids'])
          print('VI text=',repr(vi['generated_text']))
          print('CODE prompt_ids=',code['prompt_token_ids'])
          print('CODE generated_ids=',code['generated_token_ids'])
          print('CODE text=',repr(code['generated_text']))
          PY
      - name: Show compact evidence and cleanup
        if: always()
        shell: bash
        run: |
          evidence="$RUNNER_TEMP/qwen38-vi-code-evidence"
          python - <<'PY'
          import json, os
          root=os.path.join(os.environ['RUNNER_TEMP'],'qwen38-vi-code-evidence')
          for name in ('vi','code'):
              p=os.path.join(root,name+'.json')
              if os.path.exists(p):
                  d=json.load(open(p,encoding='utf-8'))
                  print(name,{k:d.get(k) for k in ['status','prompt_token_count','generated_token_ids','generated_text','elapsed_seconds','max_rss_gib']})
          PY
          tail -n 80 "$evidence/vi.log" 2>/dev/null || true
          tail -n 80 "$evidence/code.log" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/qwen38-model" "$RUNNER_TEMP/qwen38-tokenizer" "$RUNNER_TEMP/qwen38-vi-work" "$RUNNER_TEMP/qwen38-code-work" || true
      - name: Upload Vietnamese and code evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen38-vi-code-${{ github.run_id }}
          path: ${{ runner.temp }}/qwen38-vi-code-evidence/
          if-no-files-found: warn
          retention-days: 14
