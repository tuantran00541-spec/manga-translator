name: Kiuyha stable eval

# Evaluation ONLY: old stable checkpoints (S R4, S R3, N N2) + run-9 baseline,
# raw detection on EXACTLY ONE chapter (Wimp ch.27, 89 slices) on GitHub runners.
# No deploy, no training, no translate/render, no River cost.
# Triggered by pushing this file (workflow_dispatch on a branch-only workflow
# 404s via the API, so push is the reliable trigger — same lesson as the
# bubble-harvest and cpu-detector-probe workflows).
# This workflow's only trigger path is its own file, so pushing it cannot
# retrigger kiuyha-train.yml / kiuyha-train-s.yml / kiuyha-train-ns.yml,
# and it never touches .github/kiuyha/**.
# Slices come from release cpu-probe-slices-v1 (wimp30-slices.zip), verified
# byte-for-byte (89 files + full sha256 of the 5 key slices) before any
# detection runs; a mismatch fails the run hard.
# Detection uses the app's OWN KiuyhaTextDetector.detect_slice, conf 0.25 —
# the same raw-detect method as the N+S evaluation. Note: detect_slice is
# identical between this branch and the local uncommitted tree (the local
# detector diff touches only the text_boxes path), so runner numbers are
# directly comparable to the recorded raw references (run-9 255, NS-N 270,
# NS-S 262, soup 245).

on:
  push:
    branches-ignore: [main]
    paths:
      - ".github/workflows/kiuyha-stable-eval.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install light deps
        run: |
          python -m pip install --upgrade pip
          pip install onnxruntime numpy opencv-python-headless Pillow pyclipper shapely

      - name: Record runner specs
        run: |
          mkdir -p stable-eval-results
          {
            echo "runner: ubuntu-latest (GitHub-hosted)"
            echo "nproc: $(nproc)"
            grep -m1 "model name" /proc/cpuinfo
            free -h
            python --version
            pip show onnxruntime numpy opencv-python-headless Pillow 2>/dev/null | grep -E "Name|Version"
          } | tee stable-eval-results/specs.txt

      - name: Download checkpoint ONNX artifacts
        run: |
          mkdir -p ckpt
          GH_TOKEN=${{ github.token }} gh run download 39716413022 -n kiuyha-tuned-s-onnx -D ckpt/s-r4 || echo "S_R4_DOWNLOAD_FAILED" > stable-eval-results/s-r4_DOWNLOAD_FAILED.txt
          GH_TOKEN=${{ github.token }} gh run download 39677810289 -n kiuyha-tuned-s-onnx -D ckpt/s-r3 || echo "S_R3_DOWNLOAD_FAILED" > stable-eval-results/s-r3_DOWNLOAD_FAILED.txt
          GH_TOKEN=${{ github.token }} gh run download 38672322338 -n kiuyha-tuned-all-onnx -D ckpt/n-n2 || echo "N_N2_DOWNLOAD_FAILED" > stable-eval-results/n-n2_DOWNLOAD_FAILED.txt
          GH_TOKEN=${{ github.token }} gh run download 40340455331 -n kiuyha-tuned-s-onnx -D ckpt/run9 || echo "RUN9_DOWNLOAD_FAILED" > stable-eval-results/run9_DOWNLOAD_FAILED.txt
          find ckpt -name "*.onnx" 2>/dev/null
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download Wimp ch.27 slices (release asset, verified in script)
        run: |
          gh release download cpu-probe-slices-v1 -p wimp30-slices.zip
          mkdir -p slices && python -c "import zipfile; zipfile.ZipFile('wimp30-slices.zip').extractall('slices')"
          ls slices | wc -l
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Run detection (script embedded as base64, push contains only this file)
        run: |
          echo '' | base64 -d > detect_runner.py
          python detect_runner.py
        env:
          PYTHONUNBUFFERED: "1"

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: stable-eval-detection
          path: stable-eval-results/
          if-no-files-found: error
