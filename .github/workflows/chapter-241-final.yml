name: Chapter 241 Final Layer Two

on:
  push:
    branches:
      - 'chapter/doctors-rebirth\+241'
    paths:
      - '.github/workflows/chapter-241-final.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: chapter-241-human-loop
  cancel-in-progress: false

jobs:
  final-package:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      RENDER_RUN_ID: '34744936501'
      RENDER_ARTIFACT: 05-render-candidate-c241d001
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'chapter/doctors-rebirth+241'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependency
        run: python -m pip install --only-binary=:all: Pillow==10.4.0

      - name: Layer two
        run: echo FINAL_LAYER_TWO_PASS
