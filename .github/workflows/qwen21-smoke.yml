name: Qwen Image 2.1 UC edit smoke test

# One-off: can Qwen-Image-2.1 (uncensored Q4_K_M) erase manga lettering on a CPU runner, and how long does it take.
on:
  push:
    branches-ignore: [main]
    paths:
      - ".github/workflows/qwen21-smoke.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      OUT: audit-results/qwen21-edit
    steps:
      - uses: actions/checkout@v4

      - name: Make room
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / && free -h && nproc

      - name: Build stable-diffusion.cpp (CPU)
        run: |
          git clone --depth 1 --recursive https://github.com/leejet/stable-diffusion.cpp sdcpp
          cmake -S sdcpp -B sdcpp/build -DCMAKE_BUILD_TYPE=Release
          cmake --build sdcpp/build -j "$(nproc)"
          ls sdcpp/build/bin

      - name: Download weights
        run: |
          python3 -m pip install -q -U "huggingface_hub[cli]"
          hf download abenzerps/Qwen-Image-2.1-Uncensored-GGUF qwen-image-2.1-UC-Q4_K_M.gguf \
            vae/qwen_image_2.1_vae_bf16.safetensors --local-dir w
          hf download unsloth/Qwen3-VL-8B-Instruct-GGUF Qwen3-VL-8B-Instruct-Q4_K_M.gguf mmproj-BF16.gguf --local-dir w
          find w -type f -printf "%p %s bytes\n"
          df -h /

      - name: Inputs
        run: |
          python3 -m pip install -q pillow
          mkdir -p "$OUT"
          git fetch -q origin audit-evidence
          git show origin/audit-evidence:audit-results/ai-cost/push/shadow-slave-1/pairs/036.jpg > pair036.jpg
          python3 - <<'PY'
          from PIL import Image
          def fit(im, side=512):
              s = side / max(im.size)
              w, h = (max(32, int(v * s) // 32 * 32) for v in im.size)
              return im.resize((w, h), Image.LANCZOS)
          fit(Image.open("docs/images/demo-raw.jpg").convert("RGB")).save("in-demo.png")
          pair = Image.open("pair036.jpg").convert("RGB")
          fit(pair.crop((0, 0, pair.width // 2, pair.height))).save("in-police.png")
          for name in ("in-demo.png", "in-police.png"):
              print(name, Image.open(name).size)
          PY
          cp in-*.png "$OUT/"

      - name: Edit
        run: |
          SD=$(ls sdcpp/build/bin/sd-cli sdcpp/build/bin/sd 2>/dev/null | head -n1)
          for name in demo police; do
            size=$(python3 -c "from PIL import Image; w,h=Image.open('in-$name.png').size; print(w,h)")
            set -- $size
            start=$(date +%s)
            "$SD" --diffusion-model w/qwen-image-2.1-UC-Q4_K_M.gguf --vae w/vae/qwen_image_2.1_vae_bf16.safetensors \
              --llm w/Qwen3-VL-8B-Instruct-Q4_K_M.gguf --llm_vision w/mmproj-BF16.gguf \
              -r "in-$name.png" -W "$1" -H "$2" --steps 20 --cfg-scale 6.0 --sampling-method euler --seed 42 \
              -t "$(nproc)" -v \
              -p "Remove all lettering, captions and speech-bubble text. Keep the artwork, colours and bubbles exactly the same." \
              -o "$OUT/out-$name.png" 2>&1 | tail -n 40 | tee "$OUT/log-$name.txt"
            echo "$name: $(( $(date +%s) - start )) s" | tee -a "$OUT/timing.txt"
          done

      - name: Save evidence to audit-evidence
        if: always()
        uses: ./.github/actions/save-evidence
        with:
          paths: audit-results/qwen21-edit
          message: "audit: Qwen-Image-2.1 UC edit smoke (run ${{ github.run_id }})"
