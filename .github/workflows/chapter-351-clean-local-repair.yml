name: Chapter 351 Checkpoint 02B Clean Local Repair

on:
  push:
    branches:
      - chapter/logging-10000-years-into-the-future-351
    paths:
      - .github/workflows/chapter-351-clean-local-repair.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: chapter-351-human-loop
  cancel-in-progress: false

jobs:
  repair-non-story:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      CHAPTER_ID: c3513510
      IMPORT_RUN_ID: "34700742617"
      IMPORT_ARTIFACT: 01-import-c3513510
      CLEAN_RUN_ID: "34700955145"
      CLEAN_ARTIFACT: 02-clean-review-c3513510
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chapter/logging-10000-years-into-the-future-351

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install proof dependency
        run: python -m pip install Pillow==10.4.0

      - name: Restore base checkpoints
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf checkpoint repair
          mkdir -p checkpoint/01-import checkpoint/02-clean repair/overlay/processed repair/proof
          gh run download "$IMPORT_RUN_ID" -n "$IMPORT_ARTIFACT" -D checkpoint/01-import
          gh run download "$CLEAN_RUN_ID" -n "$CLEAN_ARTIFACT" -D checkpoint/02-clean
          test -f checkpoint/01-import/raw/sliced/000_00.png
          test -f checkpoint/01-import/raw/sliced/010_01.png
          test -f checkpoint/02-clean/processed/clean_000_00.png
          test -f checkpoint/02-clean/processed/clean_010_01.png
          test -f checkpoint/02-clean/box-index.json

      - name: Apply two targeted non-story repairs
        run: |
          python - <<'PY'
          import hashlib, json, shutil
          from pathlib import Path
          from PIL import Image, ImageChops, ImageDraw

          root=Path('checkpoint')
          repair=Path('repair')
          overlay=repair/'overlay'/'processed'
          proof=repair/'proof'
          overlay.mkdir(parents=True,exist_ok=True)
          proof.mkdir(parents=True,exist_ok=True)

          raw_cover=root/'01-import'/'raw'/'sliced'/'000_00.png'
          base_cover=root/'02-clean'/'processed'/'clean_000_00.png'
          out_cover=overlay/'clean_000_00.png'
          shutil.copy2(raw_cover,out_cover)

          raw_tail=root/'01-import'/'raw'/'sliced'/'010_01.png'
          base_tail=root/'02-clean'/'processed'/'clean_010_01.png'
          out_tail=overlay/'clean_010_01.png'
          raw=Image.open(raw_tail).convert('RGB')
          base=Image.open(base_tail).convert('RGB')
          if raw.size != base.size:
              raise SystemExit('tail repair dimensions changed before repair')
          cutoff=2600
          fixed=base.copy()
          fixed.paste(raw.crop((0,cutoff,raw.width,raw.height)),(0,cutoff))
          fixed.save(out_tail)

          def sha256(path):
              h=hashlib.sha256()
              with open(path,'rb') as f:
                  for chunk in iter(lambda:f.read(1024*1024),b''): h.update(chunk)
              return h.hexdigest()

          cover_raw=Image.open(raw_cover).convert('RGB')
          cover_fixed=Image.open(out_cover).convert('RGB')
          if ImageChops.difference(cover_raw,cover_fixed).getbbox() is not None:
              raise SystemExit('cover restore is not pixel-exact RAW')

          tail_fixed=Image.open(out_tail).convert('RGB')
          if ImageChops.difference(base.crop((0,0,base.width,cutoff)),tail_fixed.crop((0,0,base.width,cutoff))).getbbox() is not None:
              raise SystemExit('tail repair changed story area above cutoff')
          if ImageChops.difference(raw.crop((0,cutoff,raw.width,raw.height)),tail_fixed.crop((0,cutoff,raw.width,raw.height))).getbbox() is not None:
              raise SystemExit('promo tail is not pixel-exact RAW')

          box_index=json.loads((root/'02-clean'/'box-index.json').read_text(encoding='utf-8'))
          cover_boxes=[b for b in box_index if int(b.get('page_index',-1))==0]
          promo_boxes=[b for b in box_index if int(b.get('page_index',-1))==39 and int((b.get('region') or {}).get('y1') or 0)>=2600]
          drop_ids=[str(b.get('box_id')) for b in cover_boxes+promo_boxes if b.get('box_id')]
          if len(cover_boxes)!=6:
              raise SystemExit(f'expected 6 cover/credit boxes, got {len(cover_boxes)}')
          if len(promo_boxes)<1:
              raise SystemExit('expected at least one detected promo-tail box')

          def triptych(raw_img,base_img,fixed_img,path,title):
              imgs=[]
              for label,im in [('RAW / PRESERVE',raw_img),('BASE CLEAN / REJECT',base_img),('REPAIRED / APPROVE',fixed_img)]:
                  t=im.copy(); t.thumbnail((420,1200)); imgs.append((label,t))
              pad=24; label_h=42
              canvas=Image.new('RGB',(sum(i.width for _,i in imgs)+pad*(len(imgs)+1),max(i.height for _,i in imgs)+label_h+pad*2),'white')
              d=ImageDraw.Draw(canvas); d.text((pad,4),title,fill='black')
              x=pad
              for label,im in imgs:
                  d.text((x,pad),label,fill='black'); canvas.paste(im,(x,pad+label_h)); x+=im.width+pad
              canvas.save(path,quality=92)

          triptych(cover_raw,Image.open(base_cover).convert('RGB'),cover_fixed,proof/'p000-cover-raw-base-repaired.jpg','p000 non-story title/credit preservation')
          # focused tail proof only
          tail_box=(0,2450,raw.width,raw.height)
          triptych(raw.crop(tail_box),base.crop(tail_box),tail_fixed.crop(tail_box),proof/'p039-promo-raw-base-repaired.jpg','p039 promo preservation; y>=2600 restored')

          meta={
            'checkpoint':'02b-clean-local-repair',
            'chapter_id':'c3513510',
            'base_clean_run_id':34700955145,
            'base_clean_artifact':'02-clean-review-c3513510',
            'import_run_id':34700742617,
            'import_artifact':'01-import-c3513510',
            'repairs':[
              {
                'page_index':0,'source_page':0,'slice_index':0,
                'classification':'non_story_title_credit_cover',
                'action':'restore_raw_slice_pixel_exact',
                'raw_sha256':sha256(raw_cover),'base_clean_sha256':sha256(base_cover),'repaired_sha256':sha256(out_cover),
                'raw_vs_repaired_pixel_diff':0
              },
              {
                'page_index':39,'source_page':10,'slice_index':1,
                'classification':'non_story_promo_tail',
                'action':'restore_raw_rows','restore_y1':cutoff,'restore_y2':raw.height,
                'raw_tail_pixel_diff':0,'base_story_area_pixel_diff':0,
                'base_clean_sha256':sha256(base_tail),'repaired_sha256':sha256(out_tail)
              }
            ],
            'drop_from_story_object_ids':drop_ids,
            'tombstone_seed':{
              'source_missing':True,'auto_generated':False,'origin':'human_review_drop','reason':'non_story_title_credit_or_promo'
            },
            'next_action':'STOP_FOR_TARGETED_HUMAN_REVIEW'
          }
          (repair/'clean-repair.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2),encoding='utf-8')
          (repair/'HUMAN_CHECKPOINT.txt').write_text(
            'CHECKPOINT: CLEAN LOCAL REPAIR\nReview p000 cover/title/credits and p039 promo tail. Approve only if non-story material is restored while story-clean pixels remain unchanged.\n',encoding='utf-8')
          print(json.dumps(meta,indent=2))
          PY

      - name: Upload local repair delta
        uses: actions/upload-artifact@v4
        with:
          name: 02b-clean-local-repair-c3513510
          path: repair/
          retention-days: 7
          if-no-files-found: error
