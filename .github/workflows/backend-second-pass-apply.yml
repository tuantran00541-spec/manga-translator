name: Apply backend second-pass audit fixes

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/backend-second-pass-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply guarded source patch
        run: |
          python scripts/apply_backend_second_pass.py
          python scripts/migrate_backend_foundation_second_pass.py
      - name: Install foundation-test runtime
        run: >-
          python -m pip install
          numpy==1.26.4 Pillow==10.4.0 opencv-contrib-python==4.10.0.84
          fastapi==0.115.0 pydantic==2.9.2 filelock==3.16.1 loguru==0.7.2
          python-multipart==0.0.12
      - name: Compile patched backend
        run: >-
          python -m py_compile
          app/manifest_utils.py app/pipeline.py app/inpaint/lama_inpainter.py
          app/render/identity.py app/routers/editor.py app/routers/chapters.py
          scripts/backend_foundation_sanity.py scripts/backend_second_pass_sanity.py
      - name: Run second-pass regressions before commit
        run: |
          python scripts/backend_foundation_sanity.py
          python scripts/backend_second_pass_sanity.py
      - name: Commit verified fixes to main
        shell: bash
        run: |
          git config user.name "Manga backend CI"
          git config user.email "actions@users.noreply.github.com"
          git rm \
            .github/workflows/backend-second-pass-apply.yml \
            scripts/apply_backend_second_pass.py \
            scripts/migrate_backend_foundation_second_pass.py
          git add \
            app/manifest_utils.py \
            app/pipeline.py \
            app/inpaint/lama_inpainter.py \
            app/render/identity.py \
            app/routers/editor.py \
            app/routers/chapters.py \
            scripts/backend_foundation_sanity.py \
            scripts/backend_second_pass_sanity.py \
            .github/workflows/backend-foundation-gate.yml
          git commit -m "fix(backend): close second-pass audit findings"
          git push origin HEAD:main
