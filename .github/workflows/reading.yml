name: Reading

on:
  push:
    paths:
      - ".github/reading.txt"

permissions:
  contents: write

jobs:
  read:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --only-binary :all: numpy==1.26.4 opencv-python-headless==4.10.0.84 playwright==1.47.0
          python -m playwright install --with-deps chromium
      - name: Fetch chapters
        run: python scripts/read_series.py
      - name: Save evidence to audit-evidence
        if: always()
        uses: ./.github/actions/save-evidence
        with:
          paths: audit-results/reading
          message: "reading: ${{ github.run_id }}"
