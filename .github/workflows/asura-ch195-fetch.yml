name: Asura chapter 195 fetch

on:
  push:
    branches:
      - test/asura-ch195-v02
    paths:
      - .github/workflows/asura-ch195-fetch.yml
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/detection-recovery-pipeline
      - name: Upload v0.2 source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: v02-final-source
          path: |
            .
            !.git/**
          include-hidden-files: true
          retention-days: 1
          compression-level: 0
