name: Finalize v0.3 accessibility polish

on:
  push:
    branches:
      - test/asura-ch195-v02
    paths:
      - .github/workflows/asura-ch195-fetch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout helper
        uses: actions/checkout@v4
        with:
          ref: test/asura-ch195-v02
          path: helper
      - name: Checkout feature
        uses: actions/checkout@v4
        with:
          ref: feat/v03-workstation-ui
          path: target
          fetch-depth: 0
      - name: Apply final polish
        run: |
          set -euo pipefail
          test "$(git -C target rev-parse HEAD)" = "542e9865f000bb918c4c63ecbbbf110b09202237"
          python helper/.v03-final-polish.py target
          git -C target diff --check
          for f in target/app/static/js/*.js; do node --check "$f" >/dev/null; done
          python -m compileall -q target/app target/tests
      - name: Commit final polish
        run: |
          set -euo pipefail
          cd target
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/static/css/preview.css app/static/js/page-navigator.js app/static/js/chapter-qc.js tests/test_chapter_qc_ui.py tests/test_ui_system_contract.py
          git diff --cached --quiet && exit 0
          git commit -m "fix(v0.3-ui): harden navigator and keyboard accessibility"
          git push origin HEAD:feat/v03-workstation-ui
