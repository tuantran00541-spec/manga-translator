name: Apply v0.3 workstation patch

on:
  push:
    branches:
      - test/asura-ch195-v02
    paths:
      - .github/workflows/asura-ch195-fetch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout helper patches
        uses: actions/checkout@v4
        with:
          ref: test/asura-ch195-v02
          path: helper
      - name: Checkout v0.3 UI branch
        uses: actions/checkout@v4
        with:
          ref: feat/v03-workstation-ui
          path: target
          fetch-depth: 0
      - name: Reconcile workbench CSS patch
        run: |
          set -euo pipefail
          cd target
          git apply --3way ../helper/.v03-workbench.patch
          git diff --check
      - name: Commit workbench CSS migration
        run: |
          set -euo pipefail
          cd target
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/static/css/workbench.css
          git diff --cached --quiet && exit 0
          git commit -m "style(v0.3-ui): finish workstation layout migration"
          git push origin HEAD:feat/v03-workstation-ui
