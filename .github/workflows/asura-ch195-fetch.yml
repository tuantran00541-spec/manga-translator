name: Apply v0.3 workstation patch

on:
  push:
    branches:
      - test/asura-ch195-v02
    paths:
      - .github/workflows/asura-ch195-fetch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout helper patches
        uses: actions/checkout@v4
        with:
          ref: test/asura-ch195-v02
          path: helper
      - name: Checkout v0.3 UI branch
        uses: actions/checkout@v4
        with:
          ref: feat/v03-workstation-ui
          path: target
      - name: Apply checked workstation patches
        run: |
          cd target
          for patch in ../helper/.v03-preview.patch ../helper/.v03-review.patch ../helper/.v03-editor-qc.patch ../helper/.v03-workbench.patch; do
            git apply --check "$patch"
            git apply "$patch"
          done
          git diff --check
          node --check app/static/js/preview.js
          node --check app/static/js/review-workspace.js
          node --check app/static/js/chapter-qc.js
          node --check app/static/js/editor.js
      - name: Commit source-only workstation migration
        run: |
          cd target
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/static/js/preview.js app/static/js/review-workspace.js app/static/js/chapter-qc.js app/static/js/editor.js app/static/css/workbench.css
          git diff --cached --quiet && exit 0
          git commit -m "feat(v0.3-ui): unify page navigation and workspace layout"
          git push origin HEAD:feat/v03-workstation-ui
