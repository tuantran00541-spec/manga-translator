name: Shadow Slave Ch1 hybrid-only benchmark

on:
  workflow_dispatch:
  push:
    branches: ["experiment/one-shot-cleanup"]
    paths:
      - app/one_shot_cleanup.py
      - scripts/benchmark_one_shot_cleanup.py
      - tests/test_one_shot_cleanup.py
      - .github/workflows/one-shot-cleanup-experiment.yml

permissions:
  contents: read

concurrency:
  group: shadow-slave-ch1-hybrid-only
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"
      CHAPTER_URL: "https://asurascans.com/comics/shadow-slave-6f7fe6eb/chapter/1"
      RAW_DIR: "benchmark-results/shadow-slave-ch1/input"
      SLICE_DIR: "benchmark-results/shadow-slave-ch1/slices"
      RESULT_DIR: "benchmark-results/shadow-slave-ch1"
      MANGA_USE_DYNAMIC_LAMA: "1"
      MANGA_ORT_PROVIDER: openvino
      MANGA_ORT_REQUIRE_PROVIDER: "1"
      MANGA_ORT_OPENVINO_SCOPE: detectors
      MANGA_ORT_OPENVINO_THREADS: "2"
      MANGA_ORT_OPENVINO_STREAMS: "1"
      MANGA_ORT_OPENVINO_CACHE_DIR: /tmp/manga-openvino-cache

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bounded benchmark dependencies
        run: |
          python -m pip install pytest==8.3.5 numpy==1.26.4 Pillow==10.4.0 opencv-contrib-python==4.10.0.84 onnxruntime-openvino==1.24.1 psutil==6.1.1 loguru==0.7.2 requests==2.32.3 beautifulsoup4==4.12.3 lxml==5.3.0 playwright==1.47.0 fastapi==0.115.0 pydantic==2.9.2 filelock==3.16.1 threadpoolctl==3.6.0

      - name: Lock dumb-detector hybrid contract
        run: python -m pytest -q tests/test_one_shot_cleanup.py

      - name: Restore benchmark models
        id: models
        uses: actions/cache@v4
        with:
          path: |
            models/*.onnx
            models/.e2e-provenance.json
          key: processing-profile-models-b224548-v1

      - name: Read pinned existing model provisioner
        if: ${{ steps.models.outputs.cache-hit != 'true' }}
        uses: actions/checkout@v4
        with:
          ref: b22454827f8190655d7070b80eb20c2550beadfa
          path: benchmark-bootstrap
          sparse-checkout: scripts/provision_real_e2e_models.py
          sparse-checkout-cone-mode: false

      - name: Provision public models with recorded hashes
        if: ${{ steps.models.outputs.cache-hit != 'true' }}
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple torch==2.5.1+cpu torchvision==0.20.1+cpu
          python -m pip install --no-deps ultralytics==8.3.221 onnx==1.17.0 onnxslim==0.1.71
          python -m pip install numpy==1.26.4 sympy==1.13.1 PyYAML==6.0.2 scipy==1.14.1 tqdm==4.67.1 matplotlib==3.9.2 pandas==2.2.3 py-cpuinfo==9.0.0 ml_dtypes==0.5.3 colorama==0.4.6 polars==1.33.1 ultralytics-thop==2.0.17
          python benchmark-bootstrap/scripts/provision_real_e2e_models.py
          cp benchmark-bootstrap/models/*.onnx models/
          cp benchmark-bootstrap/models/.e2e-provenance.json models/

      - name: Download full Shadow Slave Chapter 1
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from app.downloader.registry import download_chapter

          chapter_url = os.environ["CHAPTER_URL"]
          raw_dir = Path(os.environ["RAW_DIR"])
          result_dir = Path(os.environ["RESULT_DIR"])
          raw_dir.mkdir(parents=True, exist_ok=True)
          result_dir.mkdir(parents=True, exist_ok=True)

          paths = download_chapter(chapter_url, raw_dir)
          if len(paths) < 4:
              raise RuntimeError(
                  f"Expected a full chapter, downloaded only {len(paths)} images"
              )

          manifest = {
              "chapter_url": chapter_url,
              "downloaded_images": len(paths),
              "files": [path.name for path in paths],
          }
          (result_dir / "chapter-source.json").write_text(
              json.dumps(manifest, indent=2) + "\n"
          )
          print(json.dumps(manifest), flush=True)
          PY

      - name: Benchmark dumb detector with normal inpaint on full chapter
        run: |
          python scripts/benchmark_one_shot_cleanup.py \
            --mode simple \
            --raw-dir "$RAW_DIR" \
            --slice-dir "$SLICE_DIR" \
            --limit 0 \
            --evidence-stride 10 \
            --output "$RESULT_DIR/hybrid.json" \
            --evidence-dir "$RESULT_DIR/hybrid"

      - name: Summarize full chapter hybrid
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RESULT_DIR"])
          hybrid = json.loads((root / "hybrid.json").read_text())

          pages = hybrid["pages"]
          slice_count = int(hybrid["sample_count"])
          wall_ms = float(hybrid["sum_page_wall_ms"])
          detector_ms = float(hybrid["sum_detector_ms"])
          inpaint_ms = float(hybrid["sum_inpaint_ms"])
          detector_calls = int(hybrid["detector_forward_calls"])
          lama_runs = int(hybrid["lama_model_runs"])
          smart_fill_regions = sum(
              int(row.get("smart_fill_regions", 0)) for row in pages
          )
          bubble_fast_fill_regions = sum(
              int(row.get("bubble_fast_fill_regions", 0)) for row in pages
          )
          clusters = sum(int(row.get("clusters", 0)) for row in pages)
          outside = int(hybrid["outside_mask_changed"])

          summary = {
              "chapter_url": os.environ["CHAPTER_URL"],
              "slice_count": slice_count,
              "wall_ms": round(wall_ms, 3),
              "wall_seconds": round(wall_ms / 1000.0, 3),
              "seconds_per_slice": round(wall_ms / max(1, slice_count) / 1000.0, 3),
              "slices_per_minute": round(
                  slice_count / max(1e-9, wall_ms / 60000.0), 3
              ),
              "detector_ms": round(detector_ms, 3),
              "inpaint_ms": round(inpaint_ms, 3),
              "detector_forward_calls": detector_calls,
              "expected_one_forward_per_slice": detector_calls == slice_count,
              "lama_model_runs": lama_runs,
              "smart_fill_regions": smart_fill_regions,
              "bubble_fast_fill_regions": bubble_fast_fill_regions,
              "clusters": clusters,
              "mask_pixels": int(hybrid["mask_pixels"]),
              "changed_pixels": int(hybrid["changed_pixels"]),
              "outside_mask_changed": outside,
          }
          (root / "hybrid-summary.json").write_text(
              json.dumps(summary, indent=2) + "\n"
          )

          if detector_calls != slice_count:
              raise RuntimeError(
                  f"Expected exactly one detector forward per slice: "
                  f"{detector_calls} calls / {slice_count} slices"
              )
          if outside:
              raise RuntimeError(
                  f"Hybrid changed {outside} pixels outside detector authority"
              )

          lines = [
              "## Shadow Slave Chapter 1 — hybrid only",
              "",
              f"**Slices:** {slice_count}",
              f"**Wall time:** {wall_ms/1000:.2f}s",
              f"**Throughput:** {summary['slices_per_minute']:.2f} slices/min",
              f"**Detector:** {detector_ms/1000:.2f}s",
              f"**Inpaint:** {inpaint_ms/1000:.2f}s",
              f"**Detector forwards:** {detector_calls} (exactly 1/slice)",
              f"**LaMa forwards:** {lama_runs}",
              f"**Smart-fill regions:** {smart_fill_regions}",
              f"**Pixels changed outside authority:** {outside}",
          ]
          rendered = "\n".join(lines)
          print(rendered)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write(rendered + "\n")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shadow-slave-ch1-hybrid-only
          path: benchmark-results/shadow-slave-ch1/
          retention-days: 7
          if-no-files-found: warn
