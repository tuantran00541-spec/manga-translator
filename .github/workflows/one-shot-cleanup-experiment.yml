name: Shadow Slave Ch1 dumb-detector benchmark

on:
  workflow_dispatch:
  push:
    branches: ["experiment/one-shot-cleanup"]
    paths:
      - app/one_shot_cleanup.py
      - scripts/benchmark_one_shot_cleanup.py
      - tests/test_one_shot_cleanup.py
      - .github/workflows/one-shot-cleanup-experiment.yml

permissions:
  contents: read

concurrency:
  group: shadow-slave-ch1-dumb-detector
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: "1"
      CHAPTER_URL: "https://asurascans.com/comics/shadow-slave-6f7fe6eb/chapter/1"
      RAW_DIR: "benchmark-results/shadow-slave-ch1/input"
      SLICE_DIR: "benchmark-results/shadow-slave-ch1/slices"
      RESULT_DIR: "benchmark-results/shadow-slave-ch1"
      MANGA_USE_DYNAMIC_LAMA: "1"
      MANGA_ORT_PROVIDER: openvino
      MANGA_ORT_REQUIRE_PROVIDER: "1"
      MANGA_ORT_OPENVINO_SCOPE: detectors
      MANGA_ORT_OPENVINO_THREADS: "2"
      MANGA_ORT_OPENVINO_STREAMS: "1"
      MANGA_ORT_OPENVINO_CACHE_DIR: /tmp/manga-openvino-cache

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bounded benchmark dependencies
        run: |
          python -m pip install pytest==8.3.5 numpy==1.26.4 Pillow==10.4.0 opencv-contrib-python==4.10.0.84 onnxruntime-openvino==1.24.1 psutil==6.1.1 loguru==0.7.2 requests==2.32.3 beautifulsoup4==4.12.3 lxml==5.3.0 playwright==1.47.0 fastapi==0.115.0 pydantic==2.9.2 filelock==3.16.1 threadpoolctl==3.6.0

      - name: Lock dumb-detector hybrid contract
        run: python -m pytest -q tests/test_one_shot_cleanup.py

      - name: Restore benchmark models
        id: models
        uses: actions/cache@v4
        with:
          path: |
            models/*.onnx
            models/.e2e-provenance.json
          key: processing-profile-models-b224548-v1

      - name: Read pinned existing model provisioner
        if: ${{ steps.models.outputs.cache-hit != 'true' }}
        uses: actions/checkout@v4
        with:
          ref: b22454827f8190655d7070b80eb20c2550beadfa
          path: benchmark-bootstrap
          sparse-checkout: scripts/provision_real_e2e_models.py
          sparse-checkout-cone-mode: false

      - name: Provision public models with recorded hashes
        if: ${{ steps.models.outputs.cache-hit != 'true' }}
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple torch==2.5.1+cpu torchvision==0.20.1+cpu
          python -m pip install --no-deps ultralytics==8.3.221 onnx==1.17.0 onnxslim==0.1.71
          python -m pip install numpy==1.26.4 sympy==1.13.1 PyYAML==6.0.2 scipy==1.14.1 tqdm==4.67.1 matplotlib==3.9.2 pandas==2.2.3 py-cpuinfo==9.0.0 ml_dtypes==0.5.3 colorama==0.4.6 polars==1.33.1 ultralytics-thop==2.0.17
          python benchmark-bootstrap/scripts/provision_real_e2e_models.py
          cp benchmark-bootstrap/models/*.onnx models/
          cp benchmark-bootstrap/models/.e2e-provenance.json models/

      - name: Download full Shadow Slave Chapter 1
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from app.downloader.registry import download_chapter

          chapter_url = os.environ["CHAPTER_URL"]
          raw_dir = Path(os.environ["RAW_DIR"])
          raw_dir.mkdir(parents=True, exist_ok=True)
          paths = download_chapter(chapter_url, raw_dir)
          if len(paths) < 4:
              raise RuntimeError(
                  f"Expected a full chapter, downloaded only {len(paths)} images"
              )
          manifest = {
              "chapter_url": chapter_url,
              "downloaded_images": len(paths),
              "files": [path.name for path in paths],
          }
          (Path(os.environ["RESULT_DIR"]) / "chapter-source.json").write_text(
              json.dumps(manifest, indent=2) + "\n"
          )
          print(json.dumps(manifest), flush=True)
          PY

      - name: Benchmark current cleanup on full chapter
        run: |
          python scripts/benchmark_one_shot_cleanup.py \
            --mode current \
            --raw-dir "$RAW_DIR" \
            --slice-dir "$SLICE_DIR" \
            --limit 0 \
            --evidence-stride 10 \
            --output "$RESULT_DIR/current.json" \
            --evidence-dir "$RESULT_DIR/current"

      - name: Benchmark dumb detector with normal inpaint on full chapter
        run: |
          python scripts/benchmark_one_shot_cleanup.py \
            --mode simple \
            --raw-dir "$RAW_DIR" \
            --slice-dir "$SLICE_DIR" \
            --limit 0 \
            --evidence-stride 10 \
            --output "$RESULT_DIR/hybrid.json" \
            --evidence-dir "$RESULT_DIR/hybrid"

      - name: Compare full chapter
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          import cv2
          import numpy as np

          root = Path(os.environ["RESULT_DIR"])
          current = json.loads((root / "current.json").read_text())
          hybrid = json.loads((root / "hybrid.json").read_text())

          if current["files"] != hybrid["files"]:
              raise RuntimeError("Current and hybrid did not benchmark identical slices")

          intersection = 0
          current_pixels = 0
          hybrid_pixels = 0
          per_page = []
          for row in current["pages"]:
              index = int(row["index"])
              current_mask = cv2.imread(
                  str(root / "current" / f"{index:02d}-mask.png"),
                  cv2.IMREAD_GRAYSCALE,
              )
              hybrid_mask = cv2.imread(
                  str(root / "hybrid" / f"{index:02d}-mask.png"),
                  cv2.IMREAD_GRAYSCALE,
              )
              if current_mask is None or hybrid_mask is None:
                  raise RuntimeError(f"Missing evidence mask for slice {index}")
              a = current_mask > 127
              b = hybrid_mask > 127
              inter = int(np.count_nonzero(a & b))
              a_pixels = int(np.count_nonzero(a))
              b_pixels = int(np.count_nonzero(b))
              intersection += inter
              current_pixels += a_pixels
              hybrid_pixels += b_pixels
              per_page.append({
                  "index": index,
                  "current_pixels": a_pixels,
                  "hybrid_pixels": b_pixels,
                  "intersection": inter,
                  "hybrid_coverage_of_current": inter / max(1, a_pixels),
              })

          current_ms = float(current["sum_page_wall_ms"])
          hybrid_ms = float(hybrid["sum_page_wall_ms"])
          comparison = {
              "chapter_url": os.environ["CHAPTER_URL"],
              "slice_count": int(hybrid["sample_count"]),
              "current_ms": round(current_ms, 3),
              "hybrid_ms": round(hybrid_ms, 3),
              "speedup_x": round(current_ms / max(1e-9, hybrid_ms), 3),
              "current_detector_ms": current["sum_detector_ms"],
              "hybrid_detector_ms": hybrid["sum_detector_ms"],
              "current_inpaint_ms": current["sum_inpaint_ms"],
              "hybrid_inpaint_ms": hybrid["sum_inpaint_ms"],
              "current_detector_forward_calls": current["detector_forward_calls"],
              "hybrid_detector_forward_calls": hybrid["detector_forward_calls"],
              "current_lama_model_runs": current["lama_model_runs"],
              "hybrid_lama_model_runs": hybrid["lama_model_runs"],
              "current_mask_pixels": current_pixels,
              "hybrid_mask_pixels": hybrid_pixels,
              "intersection_pixels": intersection,
              "hybrid_coverage_of_current_mask": round(
                  intersection / max(1, current_pixels), 5
              ),
              "current_coverage_of_hybrid_mask": round(
                  intersection / max(1, hybrid_pixels), 5
              ),
              "hybrid_outside_mask_changed": hybrid["outside_mask_changed"],
              "worst_mask_coverage_slices": sorted(
                  per_page,
                  key=lambda row: row["hybrid_coverage_of_current"],
              )[:10],
          }
          (root / "comparison.json").write_text(
              json.dumps(comparison, indent=2) + "\n"
          )

          lines = [
              "## Shadow Slave Chapter 1 — dumb detector + normal inpaint",
              "",
              f"**Slices:** {comparison['slice_count']}",
              "",
              "| Metric | Current core | Hybrid |",
              "|---|---:|---:|",
              f"| Wall time | {current_ms/1000:.2f}s | {hybrid_ms/1000:.2f}s |",
              f"| Detector time | {current['sum_detector_ms']/1000:.2f}s | {hybrid['sum_detector_ms']/1000:.2f}s |",
              f"| Inpaint time | {current['sum_inpaint_ms']/1000:.2f}s | {hybrid['sum_inpaint_ms']/1000:.2f}s |",
              f"| Detector forwards | {current['detector_forward_calls']} | {hybrid['detector_forward_calls']} |",
              f"| LaMa forwards | {current['lama_model_runs']} | {hybrid['lama_model_runs']} |",
              "",
              f"**Hybrid speed ratio:** {comparison['speedup_x']:.2f}×",
              "",
              f"Hybrid mask covers **{comparison['hybrid_coverage_of_current_mask']*100:.2f}%** of current destructive-mask pixels.",
              f"Current mask covers **{comparison['current_coverage_of_hybrid_mask']*100:.2f}%** of hybrid-mask pixels.",
              f"Hybrid changed **{comparison['hybrid_outside_mask_changed']} pixels** outside its authority mask.",
              "",
              "The artifact includes JSON for every slice and sparse original/clean visual evidence.",
          ]
          summary = "\n".join(lines)
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write(summary + "\n")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shadow-slave-ch1-dumb-detector-normal-inpaint
          path: benchmark-results/shadow-slave-ch1/
          retention-days: 7
          if-no-files-found: warn
