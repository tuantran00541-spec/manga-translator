name: Chapter 38 editor trial

on:
  push:
    branches: [trial/chapter-render-38]
    paths:
      - .github/workflows/chapter-38-editor-trial.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chapter-38-editor-trial
  cancel-in-progress: false

jobs:
  extract-clean-ocr:
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    env:
      PYTHONUNBUFFERED: "1"
      MANGA_USE_DYNAMIC_LAMA: "1"
      MANGA_ORT_PROVIDER: openvino
      MANGA_ORT_REQUIRE_PROVIDER: "1"
      MANGA_ORT_OPENVINO_SCOPE: detectors
      MANGA_ORT_OPENVINO_THREADS: "2"
      MANGA_ORT_OPENVINO_STREAMS: "1"
      MANGA_ORT_OPENVINO_CACHE_DIR: /tmp/manga-openvino-cache
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install production runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple torch==2.5.1+cpu torchvision==0.20.1+cpu
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Restore detector and inpaint models
        id: models
        uses: actions/cache@v4
        with:
          path: |
            models/*.onnx
            models/.e2e-provenance.json
          key: processing-profile-models-b224548-v1

      - name: Read pinned model provisioner
        if: steps.models.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          ref: b22454827f8190655d7070b80eb20c2550beadfa
          path: benchmark-bootstrap
          sparse-checkout: scripts/provision_real_e2e_models.py
          sparse-checkout-cone-mode: false

      - name: Provision public-equivalent production models
        if: steps.models.outputs.cache-hit != 'true'
        run: |
          python -m pip install --no-deps ultralytics==8.3.221 onnx==1.17.0 onnxslim==0.1.71
          python -m pip install sympy==1.13.1 PyYAML==6.0.2 scipy==1.14.1 tqdm==4.67.1 matplotlib==3.9.2 pandas==2.2.3 py-cpuinfo==9.0.0 ml_dtypes==0.5.3 colorama==0.4.6 polars==1.33.1 ultralytics-thop==2.0.17
          python benchmark-bootstrap/scripts/provision_real_e2e_models.py
          cp benchmark-bootstrap/models/*.onnx models/
          cp benchmark-bootstrap/models/.e2e-provenance.json models/

      - name: Download, clean, create text objects and OCR chapter 38
        run: |
          python - <<'PY'
          from __future__ import annotations
          import json, time
          from pathlib import Path
          from app.manifest_utils import load_manifest_raw, save_manifest_raw
          from app.optimized_pipeline import OptimizedChapterPipeline
          from app.text_objects import ensure_page_text_objects
          from app.ocr.service import OCRService
          from app.dependencies import ocr

          chapter_id = 'chapter38trial'
          url = 'https://asurascans.com/comics/to-hell-with-the-status-window-53fc8424/chapter/38'
          pipeline = OptimizedChapterPipeline()
          print('Downloading chapter...')
          pipeline.download_chapter(url, chapter_id, workers=2)
          manifest = load_manifest_raw(chapter_id)
          indices = [i for i,p in enumerate(manifest.get('pages', [])) if not p.get('skipped')]
          print(json.dumps({'slices': len(manifest.get('pages', [])), 'processable': len(indices)}, indent=2))

          for start in range(0, len(indices), 16):
              batch = indices[start:start+16]
              t0 = time.perf_counter()
              pipeline.process_pages(chapter_id, batch, workers=2)
              print(f'processed {start+len(batch)}/{len(indices)} in {time.perf_counter()-t0:.1f}s')

          manifest = load_manifest_raw(chapter_id)
          created = 0
          for page in manifest.get('pages', []):
              if page.get('skipped'):
                  continue
              n, _changed = ensure_page_text_objects(page)
              created += n
          save_manifest_raw(chapter_id, manifest)
          print(f'created {created} text objects')

          service = OCRService(ocr, pipeline)
          manifest = load_manifest_raw(chapter_id)
          ok = failed = 0
          for pi, page in enumerate(manifest.get('pages', [])):
              if page.get('skipped'):
                  continue
              for obj in list(page.get('text_objects') or []):
                  oid = obj.get('id')
                  if not oid:
                      continue
                  try:
                      service.group_text_object(chapter_id, pi, oid, 'en')
                      ok += 1
                  except Exception as exc:
                      failed += 1
                      print(f'OCR_FAIL page={pi} object={oid}: {exc}')
          manifest = load_manifest_raw(chapter_id)
          summary = {
              'chapter_id': chapter_id,
              'source_url': url,
              'slices': len(manifest.get('pages', [])),
              'processable': len(indices),
              'text_objects': sum(len(p.get('text_objects') or []) for p in manifest.get('pages', [])),
              'ocr_ok': ok,
              'ocr_failed': failed,
          }
          Path('chapter38-summary.json').write_text(json.dumps(summary, indent=2), encoding='utf-8')
          print(json.dumps(summary, indent=2))
          PY

      - name: Pack translator/editor handoff
        if: always()
        run: |
          mkdir -p chapter38-handoff
          cp -a data/raw/chapter38trial chapter38-handoff/raw || true
          cp -a data/processed/chapter38trial chapter38-handoff/processed || true
          cp -a data/output/chapter38trial chapter38-handoff/output || true
          cp chapter38-summary.json chapter38-handoff/ 2>/dev/null || true
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('data/processed/chapter38trial/manifest.json')
          if p.exists():
              m=json.loads(p.read_text(encoding='utf-8'))
              rows=[]
              for pi,page in enumerate(m.get('pages', [])):
                  for o in page.get('text_objects') or []:
                      rows.append({'page_index':pi,'id':o.get('id'),'source_text':o.get('source_text') or o.get('ocr_text') or o.get('text') or '', 'translation':o.get('translation') or '', 'bbox':o.get('bbox') or o.get('rect')})
              Path('chapter38-handoff/ocr-text.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          zip -qr chapter38-handoff.zip chapter38-handoff

      - name: Upload translator/editor handoff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapter38-translator-handoff
          path: chapter38-handoff.zip
          if-no-files-found: error
          retention-days: 7
