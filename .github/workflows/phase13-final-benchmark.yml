name: Phase 13 worker scaling benchmark

on:
  push:
    branches:
      - benchmark/phase13-worker-scaling
    paths:
      - .github/workflows/phase13-final-benchmark.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase13-worker-scaling-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  worker-scaling:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"
      MANGA_USE_DYNAMIC_LAMA: "1"
      MANGA_PIPELINE_PROCESS_WORKER_LIMIT: "3"
      MANGA_ORT_PROVIDER: openvino
      MANGA_ORT_REQUIRE_PROVIDER: "1"
      MANGA_ORT_OPENVINO_SCOPE: detectors
      MANGA_ORT_OPENVINO_THREADS: "2"
      MANGA_ORT_OPENVINO_STREAMS: "1"
      MANGA_ORT_OPENVINO_CACHE_DIR: /tmp/manga-openvino-cache
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install production processing runtime
        run: |
          python -m pip install \
            numpy==1.26.4 Pillow==10.4.0 opencv-contrib-python==4.10.0.84 \
            onnxruntime-openvino==1.24.1 psutil==6.1.1 loguru==0.7.2 \
            requests==2.32.3 beautifulsoup4==4.12.3 lxml==5.3.0 \
            playwright==1.47.0 fastapi==0.115.0 pydantic==2.9.2 \
            filelock==3.16.1 threadpoolctl==3.6.0

      - name: Restore detector and inpaint models
        id: models
        uses: actions/cache@v4
        with:
          path: |
            models/*.onnx
            models/.e2e-provenance.json
          key: processing-profile-models-b224548-v1

      - name: Read pinned model provisioner
        if: steps.models.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          ref: b22454827f8190655d7070b80eb20c2550beadfa
          path: benchmark-bootstrap
          sparse-checkout: scripts/provision_real_e2e_models.py
          sparse-checkout-cone-mode: false

      - name: Provision public-equivalent production models
        if: steps.models.outputs.cache-hit != 'true'
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple torch==2.5.1+cpu torchvision==0.20.1+cpu
          python -m pip install --no-deps ultralytics==8.3.221 onnx==1.17.0 onnxslim==0.1.71
          python -m pip install numpy==1.26.4 sympy==1.13.1 PyYAML==6.0.2 scipy==1.14.1 tqdm==4.67.1 matplotlib==3.9.2 pandas==2.2.3 py-cpuinfo==9.0.0 ml_dtypes==0.5.3 colorama==0.4.6 polars==1.33.1 ultralytics-thop==2.0.17
          python benchmark-bootstrap/scripts/provision_real_e2e_models.py
          cp benchmark-bootstrap/models/*.onnx models/
          cp benchmark-bootstrap/models/.e2e-provenance.json models/

      - name: Run representative 1/2/3 worker probe
        run: |
          mkdir -p benchmark-results/phase13-workers
          python - <<'PY'
          from __future__ import annotations

          import gc
          import hashlib
          import json
          import os
          import statistics
          import threading
          import time
          from pathlib import Path

          import psutil

          from app.config import RAW_DIR
          from app.manifest_utils import load_manifest_raw
          from app.optimized_pipeline import OptimizedChapterPipeline
          from app.parameters import DETECTOR_FOCUS_MAX_CHIPS, parameter_snapshot
          from app.pipeline import ChapterPipeline
          from app.runtime_responsiveness import (
              recommended_ort_intra_threads,
              responsive_process_workers,
              visible_cpu_count,
          )

          OUT_DIR = Path("benchmark-results/phase13-workers")
          URL = "https://asurascans.com/comics/killer-pietro-08677664/chapter/120"
          IMAGE_SUFFIXES = {".png", ".jpg", ".jpeg", ".webp", ".bmp"}
          SAMPLE_COUNT = 30

          if DETECTOR_FOCUS_MAX_CHIPS != 2:
              raise RuntimeError(
                  f"expected restored focus budget 2, got {DETECTOR_FOCUS_MAX_CHIPS}"
              )

          class ForcedWorkerPipeline(OptimizedChapterPipeline):
              """Production detector, but no responsive worker downshift."""

              def process_pages(self, chapter_id, page_indices, workers=2):
                  return ChapterPipeline.process_pages(
                      self, chapter_id, page_indices, workers=workers
                  )

          def percentile(values: list[float], q: float) -> float:
              if not values:
                  return 0.0
              ordered = sorted(values)
              if len(ordered) == 1:
                  return ordered[0]
              pos = (len(ordered) - 1) * q
              lo = int(pos)
              hi = min(lo + 1, len(ordered) - 1)
              frac = pos - lo
              return ordered[lo] * (1.0 - frac) + ordered[hi] * frac

          def summarize(values: list[float]) -> dict:
              return {
                  "count": len(values),
                  "sum": round(sum(values), 3),
                  "mean": round(statistics.mean(values), 3) if values else 0.0,
                  "p50": round(percentile(values, 0.50), 3),
                  "p95": round(percentile(values, 0.95), 3),
                  "max": round(max(values), 3) if values else 0.0,
              }

          def collect_page_metrics(pages: list[dict], selected: list[int]) -> dict:
              timing_names = (
                  "read",
                  "detect",
                  "auto_inpaint",
                  "manual_inpaint",
                  "residue_verify",
                  "write",
                  "total",
              )
              groups = {name: [] for name in timing_names}
              detector_groups: dict[str, list[float]] = {}
              for index in selected:
                  metrics = pages[index].get("processing_metrics") or {}
                  timing = metrics.get("timing_ms") or {}
                  if isinstance(timing, dict):
                      for name in timing_names:
                          value = timing.get(name)
                          if isinstance(value, (int, float)) and not isinstance(value, bool):
                              groups[name].append(float(value))
                  detector = metrics.get("detector") or {}
                  if isinstance(detector, dict):
                      for name, value in detector.items():
                          if (
                              isinstance(value, (int, float))
                              and not isinstance(value, bool)
                              and name.endswith("_ms")
                          ):
                              detector_groups.setdefault(name, []).append(float(value))
              return {
                  "timing_ms": {
                      name: summarize(values) for name, values in groups.items() if values
                  },
                  "detector_ms": {
                      name: summarize(values)
                      for name, values in sorted(detector_groups.items())
                      if values
                  },
              }

          def start_peak_sampler():
              process = psutil.Process()
              peak = {"rss_mb": process.memory_info().rss / 2**20}
              stop = threading.Event()

              def sample():
                  while not stop.wait(0.10):
                      peak["rss_mb"] = max(
                          peak["rss_mb"], process.memory_info().rss / 2**20
                      )

              thread = threading.Thread(target=sample, daemon=True)
              thread.start()
              return process, peak, stop, thread

          template = OptimizedChapterPipeline()
          template_id = hashlib.sha256(
              f"phase13-worker-template-{time.time_ns()}".encode()
          ).hexdigest()[:8]
          ingest_started = time.perf_counter()
          template_manifest = template.download_chapter(URL, template_id, workers=2)
          ingest_ms = round((time.perf_counter() - ingest_started) * 1000.0, 3)
          total_slices = len(template_manifest.get("pages", []))
          if total_slices != 101:
              raise RuntimeError(f"expected exactly 101 template slices, got {total_slices}")

          raw_paths = sorted(
              p
              for p in (RAW_DIR / template_id).iterdir()
              if p.is_file() and p.suffix.lower() in IMAGE_SUFFIXES
          )
          if len(raw_paths) != 19:
              raise RuntimeError(f"expected 19 raw images, got {len(raw_paths)}")

          selected = sorted(
              set(round(i * (total_slices - 1) / (SAMPLE_COUNT - 1)) for i in range(SAMPLE_COUNT))
          )
          if len(selected) != SAMPLE_COUNT:
              raise RuntimeError(f"sample selection collapsed to {len(selected)} slices")

          cpu_visible = visible_cpu_count()
          runtime = {
              "source_sha": os.getenv("GITHUB_SHA"),
              "chapter_url": URL,
              "source_pages": len(raw_paths),
              "total_slices": total_slices,
              "sample_count": SAMPLE_COUNT,
              "sample_indices": selected,
              "ingest_ms": ingest_ms,
              "host_cpu_count": os.cpu_count() or 0,
              "visible_cpu_count": cpu_visible,
              "recommended_ort_intra_threads": recommended_ort_intra_threads(cpu_visible),
              "responsive_workers": {
                  str(requested): responsive_process_workers(requested, cpu_visible)
                  for requested in (1, 2, 3)
              },
              "parameters": parameter_snapshot(),
          }
          (OUT_DIR / "runtime.json").write_text(
              json.dumps(runtime, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print("RUNTIME", json.dumps(runtime, ensure_ascii=False), flush=True)

          del template
          gc.collect()
          results = []

          for requested_workers in (1, 2, 3):
              variant = f"forced-{requested_workers}"
              pipeline = ForcedWorkerPipeline()
              chapter_id = hashlib.sha256(
                  f"phase13-workers-{variant}-{time.time_ns()}".encode()
              ).hexdigest()[:8]
              manifest = pipeline._build_chapter_from_raw_paths(
                  chapter_id,
                  raw_paths,
                  source_url=URL,
                  workers=2,
              )
              if len(manifest.get("pages", [])) != total_slices:
                  raise RuntimeError(f"slice drift in {variant}")

              process, peak, stop, sampler = start_peak_sampler()
              started = time.perf_counter()
              pipeline.process_pages(
                  chapter_id, selected, workers=requested_workers
              )
              wall_ms = round((time.perf_counter() - started) * 1000.0, 3)
              stop.set()
              sampler.join(timeout=1)

              manifest = load_manifest_raw(chapter_id)
              pages = manifest.get("pages", [])
              last = manifest.get("last_processing_run") or {}
              failed = last.get("failed_page_indices") or []
              report = {
                  "variant": variant,
                  "requested_workers": requested_workers,
                  "effective_workers": last.get("workers"),
                  "sample_count": SAMPLE_COUNT,
                  "sample_indices": selected,
                  "process_wall_ms": wall_ms,
                  "process_wall_s": round(wall_ms / 1000.0, 3),
                  "ms_per_slice": round(wall_ms / SAMPLE_COUNT, 3),
                  "slices_per_minute": round(SAMPLE_COUNT * 60000.0 / wall_ms, 3),
                  "peak_rss_mb": round(
                      max(peak["rss_mb"], process.memory_info().rss / 2**20), 1
                  ),
                  "page_metrics": collect_page_metrics(pages, selected),
                  "last_processing_run": last,
                  "status": "ok" if not failed and len(last.get("committed_page_indices") or []) == SAMPLE_COUNT else "failed",
              }
              (OUT_DIR / f"{variant}.json").write_text(
                  json.dumps(report, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8",
              )
              print("RESULT", json.dumps(report, ensure_ascii=False), flush=True)
              results.append(report)
              del pipeline
              gc.collect()

          comparison = {"runtime": runtime, "results": results}
          (OUT_DIR / "comparison.json").write_text(
              json.dumps(comparison, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          if any(r.get("status") != "ok" for r in results):
              raise RuntimeError("one or more worker variants failed")
          PY

      - name: Publish worker scaling summary
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          p = Path("benchmark-results/phase13-workers/comparison.json")
          if not p.is_file():
              raise SystemExit(0)
          data = json.loads(p.read_text(encoding="utf-8"))
          runtime = data.get("runtime") or {}
          results = data.get("results") or []
          lines = [
              "## Phase 13 worker scaling benchmark",
              "",
              f"- Host / visible CPU: `{runtime.get('host_cpu_count')}` / `{runtime.get('visible_cpu_count')}`",
              f"- Responsive worker map 1/2/3: `{runtime.get('responsive_workers')}`",
              f"- ORT intra-op recommendation: `{runtime.get('recommended_ort_intra_threads')}`",
              f"- Chapter slices / sampled: `{runtime.get('total_slices')}` / `{runtime.get('sample_count')}`",
              "",
              "| Variant | Requested | Effective | Wall s | s/slice | slices/min | Peak RSS MiB |",
              "|---|---:|---:|---:|---:|---:|---:|",
          ]
          for r in results:
              lines.append(
                  f"| {r.get('variant')} | {r.get('requested_workers')} | {r.get('effective_workers')} | {r.get('process_wall_s')} | {float(r.get('ms_per_slice') or 0)/1000.0:.3f} | {r.get('slices_per_minute')} | {r.get('peak_rss_mb')} |"
              )

          lines += [
              "",
              "### Per-page timing mean (ms)",
              "",
              "| Variant | read | detect | auto inpaint | residue | write | total |",
              "|---|---:|---:|---:|---:|---:|---:|",
          ]
          for r in results:
              timings = ((r.get("page_metrics") or {}).get("timing_ms") or {})
              def mean(name):
                  return (timings.get(name) or {}).get("mean")
              lines.append(
                  f"| {r.get('variant')} | {mean('read')} | {mean('detect')} | {mean('auto_inpaint')} | {mean('residue_verify')} | {mean('write')} | {mean('total')} |"
              )

          text = "\n".join(lines) + "\n"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write(text)
          print(text)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase13-worker-scaling-${{ github.run_id }}
          path: benchmark-results/phase13-workers/
          retention-days: 7
          if-no-files-found: warn
