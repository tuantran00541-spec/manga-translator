name: Focused inpaint smear audit

on:
  push:
    branches:
      - test/preserve-region-repaint
    paths:
      - .github/workflows/test-inpaint-smear-focused.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  MANGA_ORT_PROVIDER: openvino
  MANGA_ORT_REQUIRE_PROVIDER: "1"
  MANGA_ORT_OPENVINO_SCOPE: detectors
  MANGA_ORT_OPENVINO_THREADS: "2"
  MANGA_ORT_OPENVINO_STREAMS: "1"
  MANGA_ORT_OPENVINO_CACHE_DIR: /tmp/manga-openvino-cache
  OPENBLAS_NUM_THREADS: "1"
  CHAPTER_ID: c159smear01
  CHAPTER_URL: https://asurascans.com/comics/player-who-returned-10000-years-later-53fc8424/chapter/159

jobs:
  smear-audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/preserve-region-repaint

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime
        run: |
          python -m pip install \
            numpy==1.26.4 Pillow==10.4.0 opencv-contrib-python==4.10.0.84 \
            onnxruntime-openvino==1.24.1 psutil==6.1.1 loguru==0.7.2 \
            requests==2.32.3 beautifulsoup4==4.12.3 lxml==5.3.0 playwright==1.47.0 \
            fastapi==0.115.0 'uvicorn[standard]==0.30.6' \
            pydantic==2.9.2 filelock==3.16.1 python-multipart==0.0.12

      - name: Restore detector and inpaint models
        id: models
        uses: actions/cache@v4
        with:
          path: |
            models/*.onnx
            models/.e2e-provenance.json
          key: processing-profile-models-b224548-v1

      - name: Read pinned model provisioner
        if: steps.models.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          ref: b22454827f8190655d7070b80eb20c2550beadfa
          path: benchmark-bootstrap
          sparse-checkout: scripts/provision_real_e2e_models.py
          sparse-checkout-cone-mode: false

      - name: Provision public-equivalent production models
        if: steps.models.outputs.cache-hit != 'true'
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple torch==2.5.1+cpu torchvision==0.20.1+cpu
          python -m pip install --no-deps ultralytics==8.3.221 onnx==1.17.0 onnxslim==0.1.71
          python -m pip install sympy==1.13.1 PyYAML==6.0.2 scipy==1.14.1 tqdm==4.67.1 matplotlib==3.9.2 pandas==2.2.3 py-cpuinfo==9.0.0 ml_dtypes==0.5.3 colorama==0.4.6 polars==1.33.1 ultralytics-thop==2.0.17
          python benchmark-bootstrap/scripts/provision_real_e2e_models.py
          cp benchmark-bootstrap/models/*.onnx models/
          cp benchmark-bootstrap/models/.e2e-provenance.json models/

      - name: Process known smear-prone slices
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import shutil
          from pathlib import Path

          import cv2
          import numpy as np
          from PIL import Image, ImageDraw, ImageFont

          from app.dependencies import pipeline
          from app.image_io import read_image
          from app.manifest_utils import load_manifest_raw

          chapter_id = os.environ["CHAPTER_ID"]
          chapter_url = os.environ["CHAPTER_URL"]
          out = Path("benchmark-results/inpaint-smear-focused")
          if out.exists():
              shutil.rmtree(out)
          out.mkdir(parents=True, exist_ok=True)

          # These were visually confirmed to show ghost/smear in an older
          # processed chapter. Coordinates are only review windows; current
          # detector geometry remains fully live.
          targets = [
              {"source_page": 1, "slice_index": 6, "name": "p007", "roi": [180, 105, 725, 440]},
              {"source_page": 8, "slice_index": 1, "name": "p035", "roi": [105, 1005, 815, 1455]},
              {"source_page": 5, "slice_index": 4, "name": "p025", "roi": [315, 2120, 845, 2425]},
              {"source_page": 11, "slice_index": 0, "name": "p047a", "roi": [75, 1920, 815, 2355]},
              {"source_page": 11, "slice_index": 0, "name": "p047b", "roi": [275, 2550, 850, 2835]},
              {"source_page": 10, "slice_index": 4, "name": "p045", "roi": [165, 3160, 735, 3575]},
          ]

          manifest = pipeline.download_chapter(chapter_url, chapter_id, workers=1)
          pages = manifest.get("pages", [])
          located = {}
          for target in targets:
              key = (target["source_page"], target["slice_index"])
              matches = [
                  i for i, page in enumerate(pages)
                  if int(page.get("source_page", -1)) == key[0]
                  and int(page.get("slice_index", -1)) == key[1]
              ]
              if len(matches) != 1:
                  raise RuntimeError(f"target lookup failed {key}: {matches}")
              located[key] = matches[0]

          unique_pages = list(dict.fromkeys(located.values()))
          pipeline.process_pages(chapter_id, unique_pages, workers=1)
          state = load_manifest_raw(chapter_id)

          report = {"chapter_id": chapter_id, "pages": {}, "targets": []}
          panels = []
          font = ImageFont.load_default()
          for target in targets:
              key = (target["source_page"], target["slice_index"])
              page_index = located[key]
              page = state["pages"][page_index]
              raw = read_image(Path(page["original"]))
              clean = read_image(Path(page["clean"]))
              report["pages"].setdefault(str(page_index), {
                  "source_page": key[0],
                  "slice_index": key[1],
                  "detection_state": page.get("detection_state"),
                  "detection_issues": page.get("detection_issues"),
                  "processing_metrics": page.get("processing_metrics"),
              })

              x1, y1, x2, y2 = target["roi"]
              x1, x2 = max(0, x1), min(raw.shape[1], x2)
              y1, y2 = max(0, y1), min(raw.shape[0], y2)
              raw_roi = raw[y1:y2, x1:x2]
              clean_roi = clean[y1:y2, x1:x2]
              if raw_roi.size == 0 or clean_roi.size == 0:
                  raise RuntimeError(f"empty ROI for {target}")

              raw_path = out / f"{target['name']}-raw.png"
              clean_path = out / f"{target['name']}-clean.png"
              cv2.imwrite(str(raw_path), raw_roi)
              cv2.imwrite(str(clean_path), clean_roi)

              diff = cv2.absdiff(raw_roi, clean_roi)
              target_report = {
                  **target,
                  "page_index": page_index,
                  "changed_channel_values": int(np.count_nonzero(diff)),
                  "max_abs_channel_diff": int(diff.max(initial=0)),
                  "mean_abs_channel_diff": round(float(diff.mean()), 6),
              }
              report["targets"].append(target_report)

              def thumb(arr, width=430):
                  pil = Image.fromarray(cv2.cvtColor(arr, cv2.COLOR_BGR2RGB))
                  height = max(1, int(round(pil.height * width / pil.width)))
                  return pil.resize((width, height), Image.Resampling.LANCZOS)

              left = thumb(raw_roi)
              right = thumb(clean_roi)
              header = 32
              gap = 10
              canvas = Image.new(
                  "RGB",
                  (left.width + right.width + gap, max(left.height, right.height) + header),
                  "white",
              )
              draw = ImageDraw.Draw(canvas)
              draw.text((4, 7), f"{target['name']} RAW", fill="black", font=font)
              draw.text((left.width + gap + 4, 7), "CURRENT HEAD CLEAN", fill="black", font=font)
              canvas.paste(left, (0, header))
              canvas.paste(right, (left.width + gap, header))
              panels.append(canvas)

          max_w = max(panel.width for panel in panels)
          total_h = sum(panel.height for panel in panels) + 10 * (len(panels) - 1)
          review = Image.new("RGB", (max_w, total_h), "#eeeeee")
          y = 0
          for panel in panels:
              review.paste(panel, (0, y))
              y += panel.height + 10
          review.save(out / "current-head-smear-review.jpg", quality=95)
          (out / "report.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print("SMEAR_AUDIT=" + json.dumps(report, ensure_ascii=False))
          PY

      - name: Upload smear audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: inpaint-smear-focused-${{ github.run_id }}
          path: benchmark-results/inpaint-smear-focused/
          retention-days: 7
          compression-level: 6
          if-no-files-found: error
