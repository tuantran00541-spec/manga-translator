name: Apply AI provider payload

on:
  push:
    branches:
      - feature/custom-ai-provider-orchestrator

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[apply-ai-provider]') && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and apply payload
        run: |
          test -f .tmp/ai-provider-payload.part-000
          cat .tmp/ai-provider-payload.part-* | base64 -d > /tmp/ai-provider-files.tgz
          echo '15df4db85f668cf472707725916aa2bb6e6ab18e3d6e82a04eacff919427191d  /tmp/ai-provider-files.tgz' | sha256sum -c -
          tar -tzf /tmp/ai-provider-files.tgz > /tmp/ai-provider-files.txt
          test "$(wc -l < /tmp/ai-provider-files.txt)" -eq 22
          tar -xzf /tmp/ai-provider-files.tgz
          rm -f .tmp/ai-provider-payload.part-*
          rm -f .tmp/ai-provider-files.tgz.b64
          rm -f .github/workflows/apply-ai-provider-payload.yml

      - name: Validate Python and JavaScript
        run: |
          python -m compileall -q app tests
          find app/static/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Commit feature tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: custom AI provider orchestration'
          git push origin HEAD:feature/custom-ai-provider-orchestrator
