name: Perf chapter 351 human-clean reference

on:
  push:
    branches:
      - perf/bubble-fastpath-roi-lama
    paths:
      - .github/workflows/perf-chapter351-human-clean.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: perf-chapter351-human-clean
  cancel-in-progress: false

jobs:
  chapter351-human-clean:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"
      MANGA_ORT_PROVIDER: openvino
      MANGA_ORT_REQUIRE_PROVIDER: "1"
      MANGA_ORT_OPENVINO_SCOPE: detectors
      MANGA_ORT_OPENVINO_THREADS: "2"
      MANGA_ORT_OPENVINO_STREAMS: "1"
      MANGA_ORT_OPENVINO_CACHE_DIR: /tmp/manga-openvino-cache
      OPENBLAS_NUM_THREADS: "1"
      CHAPTER_ID: c3513510
      IMPORT_RUN_ID: "34700742617"
      IMPORT_ARTIFACT: 01-import-c3513510
      CLEAN_RUN_ID: "34700955145"
      CLEAN_ARTIFACT: 02-clean-review-c3513510
      REPAIR_RUN_ID: "34702416332"
      REPAIR_ARTIFACT: 02b-clean-local-repair-c3513510

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install production clean benchmark runtime
        run: |
          python -m pip install \
            numpy==1.26.4 Pillow==10.4.0 opencv-contrib-python==4.10.0.84 \
            onnxruntime-openvino==1.24.1 psutil==6.1.1 loguru==0.7.2 \
            requests==2.32.3 beautifulsoup4==4.12.3 lxml==5.3.0 playwright==1.47.0 \
            fastapi==0.115.0 'uvicorn[standard]==0.30.6' \
            pydantic==2.9.2 filelock==3.16.1 python-multipart==0.0.12

      - name: Restore detector and inpaint models
        id: models
        uses: actions/cache@v4
        with:
          path: |
            models/*.onnx
            models/.e2e-provenance.json
          key: processing-profile-models-b224548-v1

      - name: Read pinned model provisioner
        if: steps.models.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          ref: b22454827f8190655d7070b80eb20c2550beadfa
          path: benchmark-bootstrap
          sparse-checkout: scripts/provision_real_e2e_models.py
          sparse-checkout-cone-mode: false

      - name: Provision public-equivalent production models
        if: steps.models.outputs.cache-hit != 'true'
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple torch==2.5.1+cpu torchvision==0.20.1+cpu
          python -m pip install --no-deps ultralytics==8.3.221 onnx==1.17.0 onnxslim==0.1.71
          python -m pip install sympy==1.13.1 PyYAML==6.0.2 scipy==1.14.1 tqdm==4.67.1 matplotlib==3.9.2 pandas==2.2.3 py-cpuinfo==9.0.0 ml_dtypes==0.5.3 colorama==0.4.6 polars==1.33.1 ultralytics-thop==2.0.17
          python benchmark-bootstrap/scripts/provision_real_e2e_models.py
          cp benchmark-bootstrap/models/*.onnx models/
          cp benchmark-bootstrap/models/.e2e-provenance.json models/

      - name: Download approved chapter 351 reference stack
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf checkpoint/ch351
          mkdir -p checkpoint/ch351/import checkpoint/ch351/base-clean checkpoint/ch351/repair
          gh run download "$IMPORT_RUN_ID" -n "$IMPORT_ARTIFACT" -D checkpoint/ch351/import
          gh run download "$CLEAN_RUN_ID" -n "$CLEAN_ARTIFACT" -D checkpoint/ch351/base-clean
          gh run download "$REPAIR_RUN_ID" -n "$REPAIR_ARTIFACT" -D checkpoint/ch351/repair
          test -f checkpoint/ch351/import/manifest.json
          test -d checkpoint/ch351/import/raw/sliced
          test -f checkpoint/ch351/base-clean/clean-review-summary.json
          test -f checkpoint/ch351/base-clean/box-index.json
          test -d checkpoint/ch351/base-clean/processed
          test -f checkpoint/ch351/repair/clean-repair.json
          test -d checkpoint/ch351/repair/overlay/processed

      - name: Compile benchmark candidate
        run: |
          python -m compileall -q app scripts/benchmark_chapter351_human_clean.py

      - name: Run current perf stack against human-approved clean reference
        run: |
          rm -rf benchmark-results/chapter351-human-clean
          PYTHONPATH=. python scripts/benchmark_chapter351_human_clean.py \
            --import-root checkpoint/ch351/import \
            --base-clean-root checkpoint/ch351/base-clean \
            --repair-root checkpoint/ch351/repair \
            --out benchmark-results/chapter351-human-clean/report.json \
            --workers 2 \
            --batch-size 16

      - name: Upload chapter 351 benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapter351-human-clean-${{ github.run_id }}
          path: |
            benchmark-results/chapter351-human-clean/report.json
            data/processed/c3513510/manifest.json
            data/processed/c3513510/clean_*.png
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6
