name: Starting With 13 Hidden Traits 46 Checkpoint 03 OCR Review

on:
  push:
    branches:
      - trial/starting-with-13-hidden-traits-46
    paths:
      - .github/workflows/starting-with-13-hidden-traits-46-ocr-review.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: starting-with-13-hidden-traits-46-human-loop
  cancel-in-progress: false

jobs:
  ocr-from-raw:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: ${{ github.workspace }}
      GH_TOKEN: ${{ github.token }}
      CHAPTER_ID: 57d7b970
      IMPORT_RUN_ID: "34587403083"
      IMPORT_ARTIFACT: 01-import-57d7b970
      CLEAN_RUN_ID: "34587852339"
      CLEAN_ARTIFACT: 02-clean-review-57d7b970
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
      MANGA_PPOCRV6_TIER: small
      MANGA_OCR_TARGET_SELECTION: all
      MANGA_PPOCRV6_TEXTLINE_ORIENTATION: "0"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "2"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: trial/starting-with-13-hidden-traits-46

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Syntax-check OCR checkpoint runner
        run: |
          python -m py_compile trials/starting-with-13-hidden-traits-46/run_ocr_review.py
          python -m py_compile trials/starting-with-13-hidden-traits-46/run_ocr_review_compat.py

      - name: Install production OCR runtime
        run: |
          python -m pip install --only-binary=:all: \
            numpy==1.26.4 \
            Pillow==10.4.0 \
            opencv-contrib-python==4.10.0.84 \
            paddlepaddle==3.2.2 \
            paddleocr==3.7.0 \
            onnxruntime-openvino==1.24.1 \
            psutil==6.1.1 \
            loguru==0.7.2 \
            requests==2.32.3 \
            beautifulsoup4==4.12.3 \
            lxml==5.3.0 \
            playwright==1.47.0 \
            fastapi==0.115.0 \
            pydantic==2.9.2 \
            filelock==3.16.1 \
            python-multipart==0.0.12

      - name: Restore Paddle model cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.paddlex
            ~/.paddleocr
          key: chapter-trial-ppocrv6-small-en-v1

      - name: Restore reviewed checkpoints
        run: |
          rm -rf checkpoint/01-import checkpoint/02-clean checkpoint/03-ocr-review data/raw/${CHAPTER_ID} data/processed/${CHAPTER_ID}
          mkdir -p checkpoint/01-import checkpoint/02-clean checkpoint/03-ocr-review
          gh run download "$IMPORT_RUN_ID" -n "$IMPORT_ARTIFACT" -D checkpoint/01-import
          gh run download "$CLEAN_RUN_ID" -n "$CLEAN_ARTIFACT" -D checkpoint/02-clean
          test -f checkpoint/01-import/manifest.json
          test -d checkpoint/01-import/raw/sliced
          test -f checkpoint/02-clean/processed/manifest.json
          test -f trials/starting-with-13-hidden-traits-46/clean-review.json
          python - <<'PY'
          import json
          review=json.load(open('trials/starting-with-13-hidden-traits-46/clean-review.json',encoding='utf-8'))
          if review.get('status')!='PASS' or review.get('chapter_id')!='57d7b970':
              raise SystemExit('CLEAN gate not approved for chapter 46')
          human=review.get('human_review') or {}
          for key in ('story_text_blockers','artwork_damage_blockers','source_story_residue_blockers'):
              if human.get(key)!=0:
                  raise SystemExit(f'CLEAN blocker remains: {key}={human.get(key)}')
          repairs=review.get('local_repairs') or []
          if len(repairs)!=3 or any(r.get('raw_vs_repaired_pixel_diff')!=0 for r in repairs):
              raise SystemExit('CLEAN local repair evidence is incomplete')
          drops=review.get('non_story_tombstone_box_ids') or []
          if len(drops)!=13 or len(set(drops))!=13:
              raise SystemExit(f'expected 13 unique durable drops, got {len(set(drops))}')
          PY

      - name: Run production OCR from RAW and build review pack
        run: |
          python trials/starting-with-13-hidden-traits-46/run_ocr_review_compat.py \
            --chapter-id "$CHAPTER_ID" \
            --import-root checkpoint/01-import \
            --clean-root checkpoint/02-clean \
            --clean-review trials/starting-with-13-hidden-traits-46/clean-review.json \
            --output checkpoint/03-ocr-review \
            --lang en

      - name: Verify OCR checkpoint contract
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('checkpoint/03-ocr-review')
          summary=json.loads((root/'ocr-review-summary.json').read_text(encoding='utf-8'))
          if summary.get('ocr_source')!='RAW' or not summary.get('ocr_source_invariant_verified'):
              raise SystemExit('OCR did not prove RAW source invariant')
          if summary.get('failed')!=0:
              raise SystemExit(f"OCR failures remain: {summary.get('failed')}")
          if summary.get('planned_ocr_targets')!=summary.get('completed_ocr_results'):
              raise SystemExit('OCR result count does not match planned targets')
          if summary.get('second_reconciliation_created')!=0:
              raise SystemExit('text-object reconciliation is not idempotent')
          if summary.get('resurrection_count')!=0:
              raise SystemExit(f"tombstone resurrection: {summary.get('resurrection_count')}")
          if len(summary.get('seeded_non_story_tombstones') or [])!=13:
              raise SystemExit('expected 13 non-story tombstones')
          if summary.get('status')!='REVIEW_REQUIRED':
              raise SystemExit('checkpoint must stop for human OCR review')
          print(json.dumps(summary,indent=2))
          PY

      - name: Upload checkpoint 03 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 03-ocr-review-57d7b970
          path: checkpoint/03-ocr-review/
          retention-days: 7
          if-no-files-found: warn
