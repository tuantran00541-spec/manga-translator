name: Starting With 13 Hidden Traits 46 Checkpoint 02C Title Credit Repair

on:
  push:
    branches:
      - trial/starting-with-13-hidden-traits-46
    paths:
      - .github/workflows/starting-with-13-hidden-traits-46-clean-local-repair-credits.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: starting-with-13-hidden-traits-46-human-loop
  cancel-in-progress: false

jobs:
  repair-title-credit:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      CHAPTER_ID: 57d7b970
      IMPORT_RUN_ID: "34587403083"
      IMPORT_ARTIFACT: 01-import-57d7b970
      CLEAN_RUN_ID: "34587852339"
      CLEAN_ARTIFACT: 02-clean-review-57d7b970
    steps:
      - uses: actions/checkout@v4
        with:
          ref: trial/starting-with-13-hidden-traits-46

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install proof dependency
        run: python -m pip install Pillow==10.4.0

      - name: Restore base checkpoints
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf checkpoint repair
          mkdir -p checkpoint/01-import checkpoint/02-clean repair/overlay/processed repair/proof
          gh run download "$IMPORT_RUN_ID" -n "$IMPORT_ARTIFACT" -D checkpoint/01-import
          gh run download "$CLEAN_RUN_ID" -n "$CLEAN_ARTIFACT" -D checkpoint/02-clean
          test -f checkpoint/01-import/raw/sliced/005_00.png
          test -f checkpoint/02-clean/processed/clean_005_00.png
          test -f checkpoint/02-clean/box-index.json

      - name: Restore title credit slice pixel-exact
        run: |
          cp checkpoint/01-import/raw/sliced/005_00.png repair/overlay/processed/clean_005_00.png
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          from PIL import Image, ImageChops, ImageDraw

          raw_path=Path('checkpoint/01-import/raw/sliced/005_00.png')
          base_path=Path('checkpoint/02-clean/processed/clean_005_00.png')
          repaired_path=Path('repair/overlay/processed/clean_005_00.png')
          box_index=json.loads(Path('checkpoint/02-clean/box-index.json').read_text(encoding='utf-8'))
          page_boxes=[b for b in box_index if int(b.get('page_index',-1))==15]
          if len(page_boxes)!=2:
              raise SystemExit(f'expected 2 p015 boxes, got {len(page_boxes)}')

          def sha256(path):
              h=hashlib.sha256()
              with open(path,'rb') as f:
                  for chunk in iter(lambda:f.read(1024*1024),b''): h.update(chunk)
              return h.hexdigest()

          raw=Image.open(raw_path).convert('RGB')
          base=Image.open(base_path).convert('RGB')
          repaired=Image.open(repaired_path).convert('RGB')
          if raw.size!=base.size or raw.size!=repaired.size:
              raise SystemExit('repair dimensions changed')
          if ImageChops.difference(raw,repaired).getbbox() is not None:
              raise SystemExit('repaired p015 is not pixel-exact RAW')

          def thumb(img):
              out=img.copy(); out.thumbnail((380,1100)); return out
          panels=[('RAW / PRESERVE',thumb(raw)),('BASE CLEAN / REJECT',thumb(base)),('REPAIRED / APPROVE',thumb(repaired))]
          pad=20; label_h=36
          canvas=Image.new('RGB',(sum(im.width for _,im in panels)+pad*4,max(im.height for _,im in panels)+label_h+pad*2),'white')
          d=ImageDraw.Draw(canvas); x=pad
          for label,im in panels:
              d.text((x,pad),label,fill='black'); canvas.paste(im,(x,pad+label_h)); x+=im.width+pad
          canvas.save('repair/proof/p015-raw-base-repaired.jpg',quality=92)

          payload={
            'checkpoint':'02c-clean-title-credit-repair',
            'chapter_id':'57d7b970',
            'base_clean_run_id':34587852339,
            'base_clean_artifact':'02-clean-review-57d7b970',
            'import_run_id':34587403083,
            'import_artifact':'01-import-57d7b970',
            'page_index':15,
            'source_page':5,
            'slice_index':0,
            'classification':'non_story_title_credit',
            'editorial_issue':'base clean removed ORIGINAL / ADAPTATION / ART credits from the series logo page',
            'action':'restore_raw_slice_pixel_exact',
            'raw_sha256':sha256(raw_path),
            'base_clean_sha256':sha256(base_path),
            'repaired_sha256':sha256(repaired_path),
            'raw_vs_repaired_pixel_diff':0,
            'drop_from_story_object_ids':[b.get('box_id') for b in page_boxes],
            'tombstone_seed':{
              'source_missing':True,
              'auto_generated':False,
              'origin':'human_review_drop',
              'reason':'non_story_title_credit'
            },
            'next_action':'STOP_FOR_TARGETED_HUMAN_REVIEW'
          }
          Path('repair/clean-repair.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2),encoding='utf-8')
          Path('repair/HUMAN_CHECKPOINT.txt').write_text(
            'CHECKPOINT: CLEAN TITLE CREDIT REPAIR\nReview p015 RAW vs BASE CLEAN vs REPAIRED. Approve only if ORIGINAL / ADAPTATION / ART credits are fully restored and repaired slice is pixel-exact RAW.\n',encoding='utf-8')
          print(json.dumps(payload,indent=2))
          PY

      - name: Upload local repair delta
        uses: actions/upload-artifact@v4
        with:
          name: 02c-clean-title-credit-repair-57d7b970
          path: repair/
          retention-days: 7
          if-no-files-found: error
