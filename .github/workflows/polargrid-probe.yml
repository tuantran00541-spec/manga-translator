name: PolarGrid probe

# One-off: can gemma-4-31b on PolarGrid yvr-02 read manga lettering from an image.
on:
  push:
    branches-ignore: [main]
    paths:
      - ".github/workflows/polargrid-probe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      OUT: audit-results/polargrid-probe
    steps:
      - uses: actions/checkout@v4

      - name: Two Shadow Slave slices
        run: |
          git fetch -q --depth 1 origin audit-evidence
          mkdir -p "$OUT"
          for n in 024 094; do
            git show "origin/audit-evidence:audit-results/ai-cost/agnes/shadow-slave-1/pairs/$n.jpg" > "pair$n.jpg"
          done
          python3 -m pip install -q opencv-python-headless requests
          python3 - <<'PY'
          import os, cv2
          for n in ("024", "094"):
              im = cv2.imread(f"pair{n}.jpg")
              cv2.imwrite(f"{os.environ['OUT']}/in{n}.jpg", im[:, : im.shape[1] // 2 - 2], [cv2.IMWRITE_JPEG_QUALITY, 92])
          PY

      - name: Find every Qwen model on every PolarGrid region and try an image on each
        env:
          POLARGRID_KEY: ${{ secrets.polagrid_ }}
        run: |
          python3 - <<'PY'
          import base64, json, os, time, requests
          out = os.environ["OUT"]
          head = {"Authorization": "Bearer " + os.environ["POLARGRID_KEY"], "Content-Type": "application/json"}
          regions = ["yvr-02"]
          found, listing = {}, {}
          for region in regions:
              base = f"https://api.{region}.edge.polargrid.ai/v1"
              try:
                  r = requests.get(base + "/models", headers=head, timeout=30)
                  ids = [m["id"] for m in r.json().get("data", [])] if r.ok else []
                  listing[region] = ids or f"{r.status_code} {r.text[:200]}"
              except Exception as exc:
                  listing[region] = f"error {exc}"[:200]; ids = []
              for i in ids:
                  if ("qwen" in i.lower() and i != "qwen-3.8-27b") or "gemma" in i.lower():
                      found.setdefault(i, base)
              print(region, listing[region], flush=True)
          read = ("List every piece of text in this manga page from top to bottom: speech bubbles, captions, "
                  "sound effects and signs in the art. Reply with JSON only: "
                  '[{"text": "...", "kind": "dialogue|narration|sfx|sign", "box": [x1, y1, x2, y2]}].')
          log = []
          for model, base in found.items():
              for n in ("024", "094"):
                  b64 = base64.b64encode(open(f"{out}/in{n}.jpg", "rb").read()).decode()
                  body = {"model": model, "temperature": 0, "chat_template_kwargs": {"enable_thinking": False},
                          "messages": [{"role": "user", "content": [{"type": "text", "text": read},
                                       {"type": "image_url", "image_url": {"url": "data:image/jpeg;base64," + b64}}]}]}
                  start = time.time()
                  r = requests.post(base + "/chat/completions", headers=head, json=body, timeout=180)
                  row = {"model": model, "base": base, "image": n, "status": r.status_code, "seconds": round(time.time() - start, 1)}
                  try:
                      data = r.json(); row["usage"] = data.get("usage"); row["reply"] = data["choices"][0]["message"].get("content")
                  except Exception:
                      row["body"] = r.text[:1500]
                  log.append(row); print(json.dumps(row, ensure_ascii=False)[:2500], flush=True)
          json.dump({"models": listing, "replies": log}, open(f"{out}/replies.json", "w"), ensure_ascii=False, indent=1)
          PY

      - name: Save evidence to audit-evidence
        if: always()
        uses: ./.github/actions/save-evidence
        with:
          paths: audit-results/polargrid-probe
          message: "audit: PolarGrid probe (run ${{ github.run_id }})"
