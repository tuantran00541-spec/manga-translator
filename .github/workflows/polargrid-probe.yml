name: PolarGrid probe

# One-off: can qwen3.8-27b on PolarGrid read manga lettering from a base64 image, and how well does it translate it.
on:
  push:
    branches-ignore: [main]
    paths:
      - ".github/workflows/polargrid-probe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      OUT: audit-results/polargrid-probe
    steps:
      - uses: actions/checkout@v4

      - name: Two Shadow Slave slices
        run: |
          git fetch -q --depth 1 origin audit-evidence
          mkdir -p "$OUT"
          for n in 024 094; do
            git show "origin/audit-evidence:audit-results/ai-cost/agnes/shadow-slave-1/pairs/$n.jpg" > "pair$n.jpg"
          done
          python3 -m pip install -q opencv-python-headless requests
          python3 - <<'PY'
          import os, cv2
          for n in ("024", "094"):
              im = cv2.imread(f"pair{n}.jpg")
              cv2.imwrite(f"{os.environ['OUT']}/in{n}.jpg", im[:, : im.shape[1] // 2 - 2], [cv2.IMWRITE_JPEG_QUALITY, 92])
          PY

      - name: Ask qwen3.8-27b on PolarGrid
        env:
          POLARGRID_KEY: ${{ secrets.polagrid_ }}
        run: |
          python3 - <<'PY'
          import base64, json, os, time, requests
          out = os.environ["OUT"]
          base = "https://api.mia-01.edge.polargrid.ai/v1"
          head = {"Authorization": "Bearer " + os.environ["POLARGRID_KEY"], "Content-Type": "application/json"}
          url = base + "/chat/completions"
          listed = requests.get(base + "/models", headers=head, timeout=60)
          print("models", listed.status_code, listed.text[:3000], flush=True)
          try:
              ids = [m["id"] for m in listed.json().get("data", [])]
          except Exception:
              ids = []
          model = next((i for i in ids if "3.8" in i and "27" in i.lower()), None) or next((i for i in ids if "qwen" in i.lower()), "qwen3.8-27b")
          print("model", model, flush=True)
          open(f"{out}/models.txt", "w").write(f"{listed.status_code}\n{listed.text[:20000]}")
          read = ("List every piece of text in this manga page from top to bottom: speech bubbles, captions, "
                  "sound effects and signs in the art. Reply with JSON only: "
                  '[{"text": "...", "kind": "dialogue|narration|sfx|sign", "box": [x1, y1, x2, y2]}] '
                  "with the box in pixels of this image.")
          log = []

          def ask(name, content):
              body = {"model": model, "messages": [{"role": "user", "content": content}], "temperature": 0,
                      "chat_template_kwargs": {"enable_thinking": False}}
              start = time.time()
              r = requests.post(url, headers=head, json=body, timeout=180)
              if 400 <= r.status_code < 500:
                  print("retry without thinking switch:", r.status_code, r.text[:500], flush=True)
                  body.pop("chat_template_kwargs")
                  r = requests.post(url, headers=head, json=body, timeout=180)
              row = {"name": name, "model": model, "status": r.status_code, "seconds": round(time.time() - start, 1)}
              try:
                  data = r.json()
                  row["usage"] = data.get("usage")
                  row["reply"] = data["choices"][0]["message"].get("content")
              except Exception:
                  row["body"] = r.text[:2000]
              log.append(row)
              print(json.dumps(row, ensure_ascii=False)[:3000], flush=True)
              time.sleep(2)
              return row.get("reply") or ""

          lines = []
          for n in ("024", "094"):
              b64 = base64.b64encode(open(f"{out}/in{n}.jpg", "rb").read()).decode()
              reply = ask(f"read{n}", [{"type": "text", "text": read},
                                       {"type": "image_url", "image_url": {"url": "data:image/jpeg;base64," + b64}}])
              lines.append(reply)
          ask("translate", "Translate the dialogue and narration in these manga transcripts into natural Vietnamese "
                           "for a webtoon. Keep sound effects as short Vietnamese onomatopoeia. Reply as JSON "
                           '[{"en": "...", "vi": "..."}].\n\n' + "\n\n".join(lines))
          json.dump(log, open(f"{out}/replies.json", "w"), ensure_ascii=False, indent=1)
          PY

      - name: Save evidence to audit-evidence
        if: always()
        uses: ./.github/actions/save-evidence
        with:
          paths: audit-results/polargrid-probe
          message: "audit: PolarGrid probe (run ${{ github.run_id }})"
