name: Apply backend Phase 4

on:
  push:
    branches: [main]
    paths:
      - scripts/apply_phase4_patch.py
      - .github/workflows/phase4-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply Phase 4 patch
        run: python scripts/apply_phase4_patch.py
      - name: Compile Phase 4 source
        run: >-
          python -m py_compile app/detector/adaptive_focus_detector.py
          app/detector/recovery.py scripts/backend_phase4_sanity.py
      - name: Install deterministic test runtime
        run: python -m pip install numpy==1.26.4 opencv-contrib-python==4.10.0.84
      - name: Run Phase 4 acceptance fixtures
        run: python scripts/backend_phase4_sanity.py
      - name: Run existing backend source/authority sanity
        run: |
          python scripts/release_sanity.py
          python scripts/inpaint_authority_sanity.py
      - name: Commit Phase 4 production code
        shell: bash
        run: |
          git config user.name "Manga backend CI"
          git config user.email "actions@users.noreply.github.com"
          git add app/detector/adaptive_focus_detector.py app/detector/recovery.py scripts/backend_phase4_sanity.py
          git diff --cached --quiet && exit 0
          git commit -m "fix(detector): bound adaptive focus scheduling"
          git push origin HEAD:main
