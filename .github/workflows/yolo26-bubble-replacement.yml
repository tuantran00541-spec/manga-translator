name: YOLO26 bubble replacement

on:
  workflow_dispatch:
  push:
    branches: ["experiment/one-shot-yolo26"]
    paths:
      - .github/workflows/yolo26-bubble-replacement.yml

permissions:
  contents: read

concurrency:
  group: yolo26-bubble-replacement
  cancel-in-progress: true

jobs:
  replace:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"
      CHAPTER_URL: "https://asurascans.com/comics/shadow-slave-6f7fe6eb/chapter/1"
      ROOT: "benchmark-results/yolo26-bubble"
      RAW_DIR: "benchmark-results/yolo26-bubble/raw"
      SLICE_DIR: "benchmark-results/yolo26-bubble/slices"
      DATASET_DIR: "benchmark-results/yolo26-bubble/dataset"
      RUNS_DIR: "benchmark-results/yolo26-bubble/runs"
      MANGA_ORT_PROVIDER: openvino
      MANGA_ORT_REQUIRE_PROVIDER: "1"
      MANGA_ORT_OPENVINO_SCOPE: detectors
      MANGA_ORT_OPENVINO_THREADS: "2"
      MANGA_ORT_OPENVINO_STREAMS: "1"
      MANGA_ORT_OPENVINO_CACHE_DIR: /tmp/manga-openvino-cache

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install training and runtime deps
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple torch==2.8.0+cpu torchvision==0.23.0+cpu
          python -m pip install ultralytics==8.4.156 onnx==1.17.0 onnxslim==0.1.71
          python -m pip install numpy==1.26.4 Pillow==10.4.0 opencv-contrib-python==4.10.0.84 psutil==6.1.1 loguru==0.7.2 requests==2.32.3 beautifulsoup4==4.12.3 lxml==5.3.0 playwright==1.47.0 fastapi==0.115.0 pydantic==2.9.2 filelock==3.16.1 threadpoolctl==3.6.0 PyYAML==6.0.2
          python -m pip install --force-reinstall --no-deps onnxruntime-openvino==1.24.1

      - name: Restore production models
        id: models
        uses: actions/cache@v4
        with:
          path: |
            models/*.onnx
            models/.e2e-provenance.json
          key: processing-profile-models-b224548-v1

      - name: Read pinned model provisioner
        if: ${{ steps.models.outputs.cache-hit != 'true' }}
        uses: actions/checkout@v4
        with:
          ref: b22454827f8190655d7070b80eb20c2550beadfa
          path: benchmark-bootstrap
          sparse-checkout: scripts/provision_real_e2e_models.py
          sparse-checkout-cone-mode: false

      - name: Provision production models on cache miss
        if: ${{ steps.models.outputs.cache-hit != 'true' }}
        run: |
          python benchmark-bootstrap/scripts/provision_real_e2e_models.py
          cp benchmark-bootstrap/models/*.onnx models/
          cp benchmark-bootstrap/models/.e2e-provenance.json models/

      - name: Download and slice chapter
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from app.downloader.registry import download_chapter
          from app.downloader.slicer import slice_image

          raw = Path(os.environ["RAW_DIR"])
          slc = Path(os.environ["SLICE_DIR"])
          raw.mkdir(parents=True, exist_ok=True)
          slc.mkdir(parents=True, exist_ok=True)

          paths = download_chapter(os.environ["CHAPTER_URL"], raw)
          slices = []
          for i, path in enumerate(sorted(paths)):
              recs = slice_image(path, slc, f"{i:03d}", return_metadata=True)
              slices.extend(Path(r["path"]) for r in recs)

          print("raw_images", len(paths))
          print("slices", len(slices))
          if len(slices) < 100:
              raise RuntimeError(f"expected real chapter slice set, got {len(slices)}")
          PY

      - name: Build 2-class pseudo-label dataset from bubble_yolo teacher
        run: |
          python - <<'PY'
          import json, os, shutil
          from pathlib import Path
          import cv2
          import yaml

          from app.config import BUBBLE_DETECTOR_MODEL
          from app.detector.bubble_detector import YoloDetector
          from app.parameters import BUBBLE_PROPOSAL_CONF_THRESHOLD

          root = Path(os.environ["DATASET_DIR"])
          for split in ("train", "val"):
              (root / "images" / split).mkdir(parents=True, exist_ok=True)
              (root / "labels" / split).mkdir(parents=True, exist_ok=True)

          paths = sorted(Path(os.environ["SLICE_DIR"]).glob("*.png"))
          teacher = YoloDetector(
              BUBBLE_DETECTOR_MODEL,
              BUBBLE_PROPOSAL_CONF_THRESHOLD,
              use_tta=False,
              model_role="bubble_detector",
          )

          total_boxes = 0
          class_counts = {0: 0, 1: 0}
          empty = 0
          manifest = []

          for idx, path in enumerate(paths):
              img = cv2.imread(str(path), cv2.IMREAD_COLOR)
              if img is None:
                  raise RuntimeError(f"cannot read {path}")
              h, w = img.shape[:2]
              boxes = teacher.detect(img)
              split = "val" if idx % 5 == 0 else "train"

              dst_img = root / "images" / split / path.name
              try:
                  dst_img.hardlink_to(path.resolve())
              except Exception:
                  shutil.copy2(path, dst_img)

              lines = []
              for b in boxes:
                  if b.class_id not in (0, 1):
                      continue
                  bw = max(0, b.x2 - b.x1)
                  bh = max(0, b.y2 - b.y1)
                  if bw <= 0 or bh <= 0:
                      continue
                  cx = (b.x1 + b.x2) / 2.0 / w
                  cy = (b.y1 + b.y2) / 2.0 / h
                  nw = bw / w
                  nh = bh / h
                  vals = [cx, cy, nw, nh]
                  if not all(0.0 <= v <= 1.0 for v in vals):
                      continue
                  lines.append(
                      f"{int(b.class_id)} {cx:.8f} {cy:.8f} {nw:.8f} {nh:.8f}"
                  )
                  total_boxes += 1
                  class_counts[int(b.class_id)] += 1

              if not lines:
                  empty += 1
              (root / "labels" / split / f"{path.stem}.txt").write_text(
                  "\n".join(lines) + ("\n" if lines else "")
              )
              manifest.append({
                  "index": idx,
                  "file": path.name,
                  "split": split,
                  "teacher_boxes": len(lines),
              })

          data = {
              "path": str(root.resolve()),
              "train": "images/train",
              "val": "images/val",
              "names": {0: "text_bubble", 1: "text_free"},
          }
          (root / "data.yaml").write_text(yaml.safe_dump(data, sort_keys=False))
          (root / "teacher-manifest.json").write_text(
              json.dumps({
                  "slice_count": len(paths),
                  "teacher_boxes": total_boxes,
                  "class_counts": class_counts,
                  "empty_slices": empty,
                  "rows": manifest,
              }, indent=2) + "\n"
          )

          print(json.dumps({
              "slice_count": len(paths),
              "teacher_boxes": total_boxes,
              "class_counts": class_counts,
              "empty_slices": empty,
              "teacher_conf": float(BUBBLE_PROPOSAL_CONF_THRESHOLD),
          }, indent=2))
          PY

      - name: Train YOLO26n bubble detector
        run: |
          python - <<'PY'
          import os
          from ultralytics import YOLO

          model = YOLO("yolo26n.pt")
          model.train(
              data=os.path.join(os.environ["DATASET_DIR"], "data.yaml"),
              epochs=5,
              imgsz=640,
              batch=4,
              workers=2,
              device="cpu",
              cache=False,
              pretrained=True,
              optimizer="AdamW",
              lr0=0.001,
              patience=5,
              project=os.environ["RUNS_DIR"],
              name="bubble-yolo26n",
              exist_ok=True,
              verbose=True,
          )
          PY

      - name: Export trained YOLO26n bubble ONNX 1024
        run: |
          python - <<'PY'
          import os, shutil
          from pathlib import Path
          from ultralytics import YOLO

          best = Path(os.environ["RUNS_DIR"]) / "bubble-yolo26n" / "weights" / "best.pt"
          if not best.exists():
              best = Path(os.environ["RUNS_DIR"]) / "bubble-yolo26n" / "weights" / "last.pt"
          if not best.exists():
              raise RuntimeError("YOLO26 training produced no checkpoint")

          model = YOLO(str(best))
          exported = Path(model.export(
              format="onnx",
              imgsz=1024,
              opset=17,
              simplify=True,
              dynamic=False,
              device="cpu",
          ))
          target = Path(os.environ["ROOT"]) / "bubble_yolo26n.onnx"
          shutil.copy2(exported, target)
          print("checkpoint", best)
          print("onnx", target, target.stat().st_size)
          PY

      - name: A/B raw inference speed on 32 slices
        run: |
          python - <<'PY'
          import json, os, statistics, time
          from pathlib import Path
          import cv2
          import numpy as np
          import onnxruntime as ort

          paths = sorted(Path(os.environ["SLICE_DIR"]).glob("*.png"))[:32]
          teacher = Path("models/bubble_yolo.onnx")
          student = Path(os.environ["ROOT"]) / "bubble_yolo26n.onnx"

          if "OpenVINOExecutionProvider" not in ort.get_available_providers():
              raise RuntimeError(f"OpenVINO EP missing: {ort.get_available_providers()}")

          def session(path):
              so = ort.SessionOptions()
              so.intra_op_num_threads = 2
              so.inter_op_num_threads = 1
              return ort.InferenceSession(
                  str(path),
                  sess_options=so,
                  providers=["OpenVINOExecutionProvider"],
                  provider_options=[{
                      "device_type": "CPU",
                      "num_of_threads": "2",
                      "num_streams": "1",
                      "cache_dir": "/tmp/manga-openvino-cache",
                  }],
              )

          def preprocess(path):
              img = cv2.imread(str(path), cv2.IMREAD_COLOR)
              h, w = img.shape[:2]
              scale = min(1024 / w, 1024 / h)
              rw, rh = max(1, int(w * scale)), max(1, int(h * scale))
              resized = cv2.resize(img, (rw, rh), interpolation=cv2.INTER_LINEAR)
              canvas = np.full((1024,1024,3), 114, dtype=np.uint8)
              x=(1024-rw)//2
              y=(1024-rh)//2
              canvas[y:y+rh, x:x+rw] = resized
              rgb=cv2.cvtColor(canvas, cv2.COLOR_BGR2RGB)
              return np.ascontiguousarray(
                  (rgb.astype(np.float32)/255.0).transpose(2,0,1)[None]
              )

          blobs=[preprocess(p) for p in paths]
          ts=session(teacher)
          ss=session(student)

          def bench(sess):
              name=sess.get_inputs()[0].name
              for i in range(3):
                  sess.run(None,{name:blobs[i]})
              xs=[]
              shapes=None
              for blob in blobs:
                  t0=time.perf_counter()
                  out=sess.run(None,{name:blob})
                  xs.append((time.perf_counter()-t0)*1000.0)
                  if shapes is None:
                      shapes=[list(np.asarray(x).shape) for x in out]
              ordered=sorted(xs)
              return {
                  "median_ms": statistics.median(xs),
                  "mean_ms": statistics.fmean(xs),
                  "p95_ms": ordered[int(0.95*(len(ordered)-1))],
                  "output_shapes": shapes,
              }

          a=bench(ts)
          b=bench(ss)
          report={
              "teacher": a,
              "student": b,
              "teacher_bytes": teacher.stat().st_size,
              "student_bytes": student.stat().st_size,
              "median_speedup": a["median_ms"]/max(1e-9,b["median_ms"]),
              "latency_reduction_pct": (1-b["median_ms"]/a["median_ms"])*100.0,
          }
          (Path(os.environ["ROOT"])/"speed.json").write_text(
              json.dumps(report,indent=2)+"\n"
          )
          print(json.dumps(report,indent=2))
          PY

      - name: A/B box agreement on full chapter
        run: |
          python - <<'PY'
          import json, os, statistics, time
          from pathlib import Path
          import cv2
          import numpy as np
          from ultralytics import YOLO

          from app.config import BUBBLE_DETECTOR_MODEL
          from app.detector.bubble_detector import YoloDetector
          from app.parameters import BUBBLE_PROPOSAL_CONF_THRESHOLD

          paths=sorted(Path(os.environ["SLICE_DIR"]).glob("*.png"))
          teacher=YoloDetector(
              BUBBLE_DETECTOR_MODEL,
              BUBBLE_PROPOSAL_CONF_THRESHOLD,
              use_tta=False,
              model_role="bubble_detector",
          )
          student=YOLO(str(Path(os.environ["ROOT"])/"bubble_yolo26n.onnx"), task="detect")

          def iou(a,b):
              ix1=max(a[0],b[0]); iy1=max(a[1],b[1])
              ix2=min(a[2],b[2]); iy2=min(a[3],b[3])
              iw=max(0,ix2-ix1); ih=max(0,iy2-iy1)
              inter=iw*ih
              aa=max(0,a[2]-a[0])*max(0,a[3]-a[1])
              bb=max(0,b[2]-b[0])*max(0,b[3]-b[1])
              return inter/max(1e-9,aa+bb-inter)

          thresholds=[0.05,0.10,0.20]
          summaries=[]

          teacher_rows=[]
          for path in paths:
              img=cv2.imread(str(path),cv2.IMREAD_COLOR)
              boxes=teacher.detect(img)
              teacher_rows.append([
                  (b.x1,b.y1,b.x2,b.y2,int(b.class_id),float(b.confidence))
                  for b in boxes if b.class_id in (0,1)
              ])

          for conf in thresholds:
              tp=fp=fn=0
              student_total=0
              teacher_total=0
              zero_student=0
              slice0=None
              times=[]

              for idx,path in enumerate(paths):
                  t0=time.perf_counter()
                  r=student.predict(
                      source=str(path),
                      imgsz=1024,
                      conf=conf,
                      iou=0.5,
                      device="cpu",
                      verbose=False,
                      max_det=300,
                  )[0]
                  times.append((time.perf_counter()-t0)*1000.0)

                  s=[]
                  if r.boxes is not None:
                      xyxy=r.boxes.xyxy.detach().cpu().numpy()
                      cls=r.boxes.cls.detach().cpu().numpy().astype(int)
                      cf=r.boxes.conf.detach().cpu().numpy()
                      for box,c,k in zip(xyxy,cls,cf):
                          if int(c) in (0,1):
                              s.append((
                                  float(box[0]),float(box[1]),
                                  float(box[2]),float(box[3]),
                                  int(c),float(k)
                              ))
                  if not s:
                      zero_student += 1

                  t=teacher_rows[idx]
                  teacher_total += len(t)
                  student_total += len(s)

                  matched_t=set()
                  matched_s=set()
                  pairs=[]
                  for ti,tb in enumerate(t):
                      for si,sb in enumerate(s):
                          if tb[4] != sb[4]:
                              continue
                          ov=iou(tb[:4],sb[:4])
                          if ov >= 0.5:
                              pairs.append((ov,ti,si))
                  pairs.sort(reverse=True)
                  for ov,ti,si in pairs:
                      if ti in matched_t or si in matched_s:
                          continue
                      matched_t.add(ti); matched_s.add(si)

                  tp += len(matched_t)
                  fn += len(t)-len(matched_t)
                  fp += len(s)-len(matched_s)

                  if idx==0:
                      slice0={
                          "teacher_boxes":len(t),
                          "student_boxes":len(s),
                          "matched":len(matched_t),
                      }

              precision=tp/max(1,tp+fp)
              recall=tp/max(1,tp+fn)
              f1=2*precision*recall/max(1e-9,precision+recall)
              summaries.append({
                  "conf":conf,
                  "teacher_boxes":teacher_total,
                  "student_boxes":student_total,
                  "tp":tp,"fp":fp,"fn":fn,
                  "precision":precision,
                  "recall":recall,
                  "f1":f1,
                  "zero_student_slices":zero_student,
                  "median_predict_ms":statistics.median(times),
                  "slice_000":slice0,
              })

          best=max(summaries,key=lambda x:(x["f1"],x["recall"]))
          report={"thresholds":summaries,"best":best}
          (Path(os.environ["ROOT"])/"agreement.json").write_text(
              json.dumps(report,indent=2)+"\n"
          )
          print(json.dumps(report,indent=2))

          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as f:
              f.write("## YOLO26n bubble replacement\n\n")
              f.write(f"- best conf: {best['conf']}\n")
              f.write(f"- precision vs YOLOv8m teacher: {best['precision']:.4f}\n")
              f.write(f"- recall vs YOLOv8m teacher: {best['recall']:.4f}\n")
              f.write(f"- F1: {best['f1']:.4f}\n")
              f.write(f"- zero student slices: {best['zero_student_slices']}\n")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yolo26-bubble-replacement
          path: |
            benchmark-results/yolo26-bubble/bubble_yolo26n.onnx
            benchmark-results/yolo26-bubble/speed.json
            benchmark-results/yolo26-bubble/agreement.json
            benchmark-results/yolo26-bubble/dataset/teacher-manifest.json
          retention-days: 7
