name: Profile detector and inpaint

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/profile_processing.py
      - scripts/profile_stage_breakdown.py
      - .github/workflows/profile-processing.yml

permissions:
  contents: read

concurrency:
  group: profile-processing-main
  cancel-in-progress: false

jobs:
  profile:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"
      MANGA_USE_DYNAMIC_LAMA: "1"
      MANGA_ORT_PROVIDER: openvino
      MANGA_ORT_REQUIRE_PROVIDER: "1"
      MANGA_ORT_OPENVINO_SCOPE: detectors
      MANGA_ORT_OPENVINO_THREADS: "2"
      MANGA_ORT_OPENVINO_STREAMS: "1"
      MANGA_ORT_OPENVINO_CACHE_DIR: /tmp/manga-openvino-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install production detector and inpaint dependencies only
        run: |
          python -m pip install numpy==1.26.4 Pillow==10.4.0 opencv-contrib-python==4.10.0.84 onnxruntime-openvino==1.24.1 psutil==6.1.1 loguru==0.7.2 requests==2.32.3 beautifulsoup4==4.12.3 lxml==5.3.0 playwright==1.47.0 fastapi==0.115.0 pydantic==2.9.2 filelock==3.16.1 threadpoolctl==3.6.0
      - name: Restore benchmark models
        id: models
        uses: actions/cache@v4
        with:
          path: |
            models/*.onnx
            models/.e2e-provenance.json
          key: processing-profile-models-b224548-v1
      - name: Read pinned existing model provisioner
        if: steps.models.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          ref: b22454827f8190655d7070b80eb20c2550beadfa
          path: benchmark-bootstrap
          sparse-checkout: scripts/provision_real_e2e_models.py
          sparse-checkout-cone-mode: false
      - name: Provision public models with recorded hashes
        if: steps.models.outputs.cache-hit != 'true'
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple torch==2.5.1+cpu torchvision==0.20.1+cpu
          python -m pip install --no-deps ultralytics==8.3.221 onnx==1.17.0 onnxslim==0.1.71
          python -m pip install numpy==1.26.4 sympy==1.13.1 PyYAML==6.0.2 scipy==1.14.1 tqdm==4.67.1 matplotlib==3.9.2 pandas==2.2.3 py-cpuinfo==9.0.0 ml_dtypes==0.5.3 colorama==0.4.6 polars==1.33.1 ultralytics-thop==2.0.17
          python benchmark-bootstrap/scripts/provision_real_e2e_models.py
          cp benchmark-bootstrap/models/*.onnx models/
          cp benchmark-bootstrap/models/.e2e-provenance.json models/
      - name: Fetch three original chapter images
        run: python scripts/profile_processing.py --prepare
      - name: Compare isolated production CPU configurations on identical slices
        run: |
          python scripts/profile_processing.py --profile workers1 --workers 1 --output benchmark-results/profile/workers1.json
          python scripts/profile_processing.py --profile workers2 --workers 2 --output benchmark-results/profile/workers2.json
          OPENBLAS_NUM_THREADS=1 python scripts/profile_processing.py --profile blas1 --workers 2 --output benchmark-results/profile/blas1.json
          MANGA_ORT_CPU_MEM_ARENA=1 python scripts/profile_processing.py --profile arena --workers 2 --output benchmark-results/profile/arena.json
      - name: Build non-overlapping stage attribution
        run: |
          mkdir -p benchmark-results/profile/stage-breakdown
          for profile in workers1 workers2 blas1 arena; do
            python scripts/profile_stage_breakdown.py \
              "benchmark-results/profile/${profile}.json" \
              --output "benchmark-results/profile/stage-breakdown/${profile}.json"
          done
      - name: Publish timing evidence
        if: always()
        run: |
          mkdir -p benchmark-results/profile
          cp models/.e2e-provenance.json benchmark-results/profile/model-provenance.json || true
          python - <<'PY'
          import json, os
          from pathlib import Path

          lines = [
              '## Production detector and inpaint CPU profile',
              '',
              'Inclusive timer sums overlap across threads; compare wall time. Stage-attribution files use non-overlapping page budgets.',
              '',
              '| Profile | Cold seconds | Warm seconds | Peak RSS MiB |',
              '|---|---:|---:|---:|',
          ]
          provider_lines = []
          bottleneck_lines = []
          for path in sorted(Path('benchmark-results/profile').glob('*.json')):
              report = json.loads(path.read_text())
              if 'runs' not in report:
                  continue
              times = [round(run['wall_ms'] / 1000, 2) for run in report['runs']]
              lines.append(f"| {report['profile']} | {times[0] if times else '-'} | {times[1] if len(times)>1 else '-'} | {report.get('peak_rss_mb', 0):.0f} |")
              if report.get('runs'):
                  provider_lines.append(f"- `{report['profile']}` providers: `{report['runs'][-1].get('provider_placement')}`")

              stage_path = Path('benchmark-results/profile/stage-breakdown') / path.name
              if stage_path.is_file():
                  stage = json.loads(stage_path.read_text())
                  runs = stage.get('runs') or []
                  if runs:
                      warm = runs[-1]
                      totals = {
                          'detector': 0.0,
                          'inpaint': 0.0,
                          'read': 0.0,
                          'write': 0.0,
                          'orchestration': 0.0,
                      }
                      for page in warm.get('stage_breakdown') or []:
                          totals['detector'] += float(page.get('detector', {}).get('detector_total_ms') or 0.0)
                          totals['inpaint'] += float(page.get('auto_inpaint', {}).get('total_ms') or 0.0)
                          totals['read'] += float(page.get('read_decode_ms') or 0.0)
                          totals['write'] += float(page.get('write_encode_ms') or 0.0)
                          totals['orchestration'] += float(page.get('orchestration_other_ms') or 0.0)
                      top = max(totals, key=totals.get)
                      bottleneck_lines.append(
                          f"- `{report['profile']}` warm top stage: **{top}** `{totals[top]/1000:.2f}s` "
                          f"(detector `{totals['detector']/1000:.2f}s`, inpaint `{totals['inpaint']/1000:.2f}s`)"
                      )
          lines.extend(['', '### Effective provider placement', *provider_lines])
          lines.extend(['', '### Warm-run non-overlapping bottlenecks', *bottleneck_lines])
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write('\n'.join(lines) + '\n')
          print('\n'.join(lines))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: processing-profile-${{ github.run_id }}
          path: |
            benchmark-results/profile/
            benchmark-results/profile-input/
          retention-days: 7
          if-no-files-found: error
