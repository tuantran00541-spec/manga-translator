name: Phone preview

# One-off: serves the app through a temporary Cloudflare quick tunnel for a phone test the user asked for.
on:
  push:
    branches-ignore: [main]
    paths:
      - ".github/workflows/phone-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phone-preview
  cancel-in-progress: true

jobs:
  serve:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: "1"
      PYTHON_KEYRING_BACKEND: keyrings.alt.file.PlaintextKeyring
      MANGA_USE_DYNAMIC_LAMA: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install the app
        run: |
          python -m pip install -r requirements.txt
          python -m pip install keyrings.alt==5.0.2
          python -m playwright install --with-deps chromium

      - name: Restore detector and inpaint models
        uses: actions/cache/restore@v4
        with:
          path: |
            models/*.onnx
            models/.e2e-provenance.json
          key: processing-profile-models-b224548-v1

      - name: Build the CTD mask model
        uses: ./.github/actions/build-ctd

      - name: Open the tunnel and start the app
        run: |
          curl -fsSL -o /tmp/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /tmp/cloudflared
          nohup /tmp/cloudflared tunnel --no-autoupdate --url http://127.0.0.1:8000 > /tmp/tunnel.log 2>&1 &
          for i in $(seq 1 60); do
            url=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' /tmp/tunnel.log | head -n 1)
            [ -n "$url" ] && break
            sleep 1
          done
          test -n "$url" || { cat /tmp/tunnel.log; exit 1; }
          MANGA_ALLOWED_HOSTS="${url#https://}" nohup python run.py > /tmp/app.log 2>&1 &
          for i in $(seq 1 180); do
            curl -sf http://127.0.0.1:8000/health > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/health > /dev/null || { tail -n 50 /tmp/app.log; exit 1; }
          echo "::notice title=Open on your phone::$url"
          echo "PHONE URL: $url"

      - name: Keep serving for 60 minutes
        run: |
          for i in $(seq 1 60); do
            sleep 60
            curl -sf http://127.0.0.1:8000/health > /dev/null || { echo "app stopped"; tail -n 50 /tmp/app.log; exit 1; }
          done
          grep -E "ERROR|Traceback" /tmp/app.log | tail -n 50 || true
