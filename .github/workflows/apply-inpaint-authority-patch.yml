name: Apply inpaint authority patch

on:
  push:
    branches:
      - fix/inpaint-authority-mser-safety

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/inpaint-authority-mser-safety

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply focused pipeline patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app/pipeline.py")
          source = path.read_text(encoding="utf-8")
          marker = "Persisted review-only detector masks are evidence"
          if marker not in source:
              method_start = source.index("    def _do_reinpaint(")
              start = source.index("        boxes_objects = []\n", method_start)
              end = source.index("\n        clean_image = None", start)
              new_lines = [
                  "        boxes_objects = []",
                  "        for box in boxes:",
                  "            if box.get(\"removed\"):",
                  "                continue",
                  "",
                  "            confidence = float(box.get(\"confidence\", 1.0))",
                  "            geometry_overridden = bool(box.get(\"geometry_overridden\"))",
                  "            explicit_manual = bool(",
                  "                box.get(\"manual\")",
                  "                or box.get(\"origin\") == \"manual\"",
                  "                or confidence >= 1.0",
                  "            )",
                  "            safe_to_inpaint = bool(box.get(\"safe_to_inpaint\"))",
                  "            overlap_context_only = bool(box.get(\"overlap_context_only\"))",
                  "",
                  "            # Persisted review-only detector masks are evidence, not erase",
                  "            # authority. Preserve the same overlap rule as initial processing.",
                  "            if overlap_context_only and not geometry_overridden:",
                  "                continue",
                  "            if not (safe_to_inpaint or geometry_overridden or explicit_manual):",
                  "                continue",
                  "",
                  "            box_h = int(box[\"y2\"]) - int(box[\"y1\"])",
                  "            box_w = int(box[\"x2\"]) - int(box[\"x1\"])",
                  "            if box_h <= 0 or box_w <= 0:",
                  "                continue",
                  "            mask_arr = decode_mask_value(box.get(\"mask\"))",
                  "            if mask_arr is not None and mask_arr.shape != (box_h, box_w):",
                  "                try:",
                  "                    mask_arr = cv2.resize(",
                  "                        mask_arr,",
                  "                        (box_w, box_h),",
                  "                        interpolation=cv2.INTER_NEAREST,",
                  "                    )",
                  "                except Exception:",
                  "                    mask_arr = None",
                  "",
                  "            box_object = BubbleBox(",
                  "                int(box[\"x1\"]),",
                  "                int(box[\"y1\"]),",
                  "                int(box[\"x2\"]),",
                  "                int(box[\"y2\"]),",
                  "                confidence,",
                  "                mask_arr,",
                  "                source_model=str(box.get(\"source_model\") or \"unknown\"),",
                  "                class_id=int(box.get(\"class_id\") or 0),",
                  "                class_name=str(box.get(\"class_name\") or \"unknown\"),",
                  "                semantic_type=str(box.get(\"semantic_type\") or \"unknown\"),",
                  "                mask_source=str(box.get(\"mask_source\") or \"none\"),",
                  "                safe_to_inpaint=safe_to_inpaint,",
                  "                ocr_eligible=bool(box.get(\"ocr_eligible\")),",
                  "                needs_review=bool(box.get(\"needs_review\")),",
                  "            )",
                  "            if geometry_overridden or explicit_manual:",
                  "                box_object.allow_rectangle_fallback = True",
                  "            boxes_objects.append(box_object)",
              ]
              source = source[:start] + "\n".join(new_lines) + "\n" + source[end:]
              path.write_text(source, encoding="utf-8")
              print("pipeline inpaint-authority patch applied")
          else:
              print("pipeline patch already applied")
          PY

      - name: Add release invariant
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/release_sanity.py")
          source = path.read_text(encoding="utf-8")
          if "def check_inpaint_authority_contract()" not in source:
              insert_at = source.index("\ndef main() -> None:")
              function = '''

          def check_inpaint_authority_contract() -> None:
              recovery = Path("app/detector/recovery.py").read_text(encoding="utf-8")
              mask_builder = Path("app/detector/mask_builder.py").read_text(encoding="utf-8")
              pipeline = Path("app/pipeline.py").read_text(encoding="utf-8")
              failures: list[str] = []

              if "safe_to_inpaint=True" in recovery:
                  failures.append("MSER recovery must never grant automatic inpaint authority")
              for expected in (
                  "safe_to_inpaint=False",
                  "ocr_eligible=True",
                  "needs_review=True",
              ):
                  if expected not in recovery:
                      failures.append(f"MSER recovery missing review-only marker: {expected}")

              for expected in (
                  "def is_destructive_box_authorized",
                  "if not is_destructive_box_authorized(box)",
              ):
                  if expected not in mask_builder:
                      failures.append(f"mask builder missing destructive-authority guard: {expected}")

              for expected in (
                  "Persisted review-only detector masks are evidence",
                  "if overlap_context_only and not geometry_overridden",
                  "if not (safe_to_inpaint or geometry_overridden or explicit_manual)",
                  "safe_to_inpaint=safe_to_inpaint",
              ):
                  if expected not in pipeline:
                      failures.append(f"reinpaint path missing authority preservation: {expected}")

              _fail("Inpaint authority contract broken:", failures)
              print("Inpaint authority contract OK")
          '''
              function = "\n".join(line[10:] if line.startswith("          ") else line for line in function.splitlines())
              source = source[:insert_at] + function + source[insert_at:]
              call_marker = "    check_duplicate_api_routes()\n    check_javascript_function_reachability()"
              source = source.replace(
                  call_marker,
                  "    check_duplicate_api_routes()\n    check_inpaint_authority_contract()\n    check_javascript_function_reachability()",
                  1,
              )
              path.write_text(source, encoding="utf-8")
              print("release inpaint-authority invariant added")
          else:
              print("release invariant already present")
          PY

          python -m compileall -q app/pipeline.py app/detector/mask_builder.py app/detector/recovery.py scripts/release_sanity.py
          python scripts/release_sanity.py

      - name: Commit focused patch
        run: |
          if git diff --quiet -- app/pipeline.py scripts/release_sanity.py; then
            echo "No focused patch to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/pipeline.py scripts/release_sanity.py
          git commit -m "test(inpaint): lock destructive authority contract"
          git push origin HEAD:fix/inpaint-authority-mser-safety
