name: Agent tavily check

# One-off: does the Tavily key work through web_search (site: filter, recency) and does web_fetch read a page.
on:
  push:
    branches-ignore: [main]
    paths:
      - ".github/workflows/agent-tavily.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q -r requirements-test.txt
      - name: Search and fetch
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY }}
        run: |
          [ -n "$TAVILY_API_KEY" ] || { echo "::error::secret TAVILY is not set"; exit 1; }
          python - <<'PY'
          import tempfile
          from app.agent import websearch
          from app.agent.tools import Workspace

          print("--- plain query")
          print(websearch.search("pytest fixtures scope", 4))
          print("--- site: filter, past year")
          print(websearch.search("pytest fixtures site:docs.pytest.org", 4, "year"))
          print("--- web_fetch of a GitHub file and a docs page")
          work = Workspace(tempfile.mkdtemp())
          print(work._tool_web_fetch("https://github.com/pytest-dev/pytest/blob/main/README.rst", max_chars=600))
          print(work._tool_web_fetch("https://docs.pytest.org/en/stable/how-to/fixtures.html", max_chars=600))
          print("--- find")
          print(work._tool_web_fetch("https://docs.pytest.org/en/stable/how-to/fixtures.html", find="scope=", ))
          PY
