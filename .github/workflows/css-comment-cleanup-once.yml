name: One-shot CSS comment cleanup
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove redundant CSS comments
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^1^{tree})" = "c2337bd2950740e58cf5b9199224f9d8ce9477d5"
          python - <<'PY'
          from pathlib import Path

          def strip_comments(text: str) -> tuple[str, int]:
              out = []
              i = 0
              quote = None
              removed = 0
              n = len(text)
              while i < n:
                  ch = text[i]
                  if quote is not None:
                      out.append(ch)
                      if ch == "\\" and i + 1 < n:
                          i += 1
                          out.append(text[i])
                      elif ch == quote:
                          quote = None
                      i += 1
                      continue
                  if ch in ("'", '"'):
                      quote = ch
                      out.append(ch)
                      i += 1
                      continue
                  if text.startswith("/*", i):
                      end = text.find("*/", i + 2)
                      if end < 0:
                          raise SystemExit("Unterminated CSS comment")
                      raw = text[i:end + 2]
                      if raw.startswith("/*!"):
                          out.append(raw)
                      else:
                          removed += 1
                      i = end + 2
                      continue
                  out.append(ch)
                  i += 1
              if quote is not None:
                  raise SystemExit("Unterminated CSS string")
              return "".join(out), removed

          total = 0
          touched = []
          for path in sorted(Path("app/static/css").glob("*.css")):
              source = path.read_text(encoding="utf-8")
              cleaned, removed = strip_comments(source)
              if removed:
                  path.write_text(cleaned, encoding="utf-8")
                  total += removed
                  touched.append((path.as_posix(), removed))
          print(f"Removed {total} CSS comment blocks from {len(touched)} files")
          for path, count in touched:
              print(f"  {count:3d}  {path}")
          PY
          python - <<'PY'
          from pathlib import Path

          def validate_css(path: Path) -> None:
              text = path.read_text(encoding="utf-8")
              quote = None
              depth = 0
              i = 0
              while i < len(text):
                  ch = text[i]
                  if quote is not None:
                      if ch == "\\" and i + 1 < len(text):
                          i += 2
                          continue
                      if ch == quote:
                          quote = None
                      i += 1
                      continue
                  if ch in ("'", '"'):
                      quote = ch
                  elif ch == "{":
                      depth += 1
                  elif ch == "}":
                      depth -= 1
                      if depth < 0:
                          raise SystemExit(f"Unbalanced CSS braces in {path}")
                  i += 1
              if quote is not None or depth != 0:
                  raise SystemExit(f"Invalid CSS structure in {path}: quote={quote!r}, depth={depth}")

          for path in sorted(Path("app/static/css").glob("*.css")):
              validate_css(path)
          PY
          python -m compileall -q app run.py
          find app/static/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/static/css
          git rm .github/workflows/css-comment-cleanup-once.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'style: remove redundant CSS comments'
          git push origin HEAD:main
