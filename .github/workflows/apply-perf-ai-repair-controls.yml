def geometry_center_in_regions(
    geometry: dict | None,
    regions: list[dict] | tuple[dict, ...] | None,
) -> bool:
    """Return True when geometry ownership belongs to a protected page region.

    Center ownership is deliberate: an exclusion rectangle that merely touches a
    neighbouring dialogue box must not suppress that dialogue. Invalid geometry
    or invalid regions fail open so review data is never silently discarded.
    """
    if not isinstance(geometry, dict) or not regions:
        return False
    try:
        x1 = float(geometry["x1"])
        y1 = float(geometry["y1"])
        x2 = float(geometry["x2"])
        y2 = float(geometry["y2"])
    except (KeyError, TypeError, ValueError):
        return False
    if x2 <= x1 or y2 <= y1:
        return False
    cx = (x1 + x2) / 2.0
    cy = (y1 + y2) / 2.0
    for region in regions:
        if not isinstance(region, dict):
            continue
        try:
            rx1 = float(region["x1"])
            ry1 = float(region["y1"])
            rx2 = float(region["x2"])
            ry2 = float(region["y2"])
        except (KeyError, TypeError, ValueError):
            continue
        if rx2 <= rx1 or ry2 <= ry1:
            continue
        if rx1 <= cx <= rx2 and ry1 <= cy <= ry2:
            return True
    return False


def text_object_in_excluded_region(page: dict, obj: dict) -> bool:
    region = obj.get("region") if isinstance(obj, dict) else None
    return geometry_center_in_regions(region, page.get("excluded_regions") or [])
''', encoding="utf-8")

