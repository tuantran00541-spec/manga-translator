e\n\n    seen = []\n    def fake_render(_image, _req, objects, *_args):\n        seen.extend(str(obj["id"]) for obj in objects)\n        return len(objects)\n\n    monkeypatch.setattr(render_module, "render_text_objects", fake_render)\n    page = {\n        "excluded_regions": [{"x1": 0, "y1": 0, "x2": 70, "y2": 70}],\n        "text_objects": [\n            {"id": "protected", "region": {"x1": 10, "y1": 10, "x2": 50, "y2": 50}, "translation": "DO NOT RENDER"},\n            {"id": "story", "region": {"x1": 100, "y1": 100, "x2": 160, "y2": 150}, "translation": "OK"},\n        ],\n    }\n    req = RenderRequest(chapter_id="abcd1234", page_index=0, translations={"protected": "NO", "story": "OK"})\n    count = _render_snapshot(Image.new("RGB", (200, 200), "white"), req, page, {}, _request_style_maps(req))\n    assert count == 1\n    assert seen == ["story"]\n\n\ndef test_ai_rectangle_repaint_mask_is_bounded_and_exact():\n    mask = _regions_to_repaint_mask(\n        (100, 120, 3),\n        [{"x1": 10, "y1": 20, "x2": 30, "y2": 40}, {"x1": 50, "y1": 60, "x2": 70, "y2": 90}],\n    )\n    assert mask.shape == (100, 120)\n    assert np.all(mask[20:40, 10:30] == 255)\n    assert np.all(mask[60:90, 50:70] == 255)\n    assert int(np.count_nonzero(mask)) == (20 * 20) + (20 * 30)\n    with pytest.raises(ValueError, match="exceeds page dimensions"):\n        _regions_to_repaint_mask((100, 120, 3), [{"x1": 0, "y1": 0, "x2": 121, "y2": 10}])\n\n\ndef test_repaint_refuses_skipped_page(monkeypatch):\n    import app.pipeline_editing as editing_module\n\n    manifest = {"pages": [{"skipped": True, "original": "unused.png", "boxes": []}]}\n    monkeypatch.setattr(editing_module, "get_page_lock", lambda *_args: nullcontext())\n    monkeypatch.setattr(editing_module, "get_manifest_lock", lambda *_args: nullcontext())\n    monkeypatch.setattr(editing_module, "load_manifest_raw", lambda _chapter: manifest)\n    pipeline = ChapterPipeline.__new__(ChapterPipeline)\n    with pytest.raises(ValueError, match="Cannot repaint a skipped page"):\n        pipeline.repaint_mask("abcd1234", 0, np.ones((10, 10), dtype=np.uint8) * 255)\n\n\ndef test_skip_slice_preserves_repair_metadata_but_forces_raw_state(monkeypatch):\n    import app.pipeline as pipeline_module\n\n    page = {\n        "skipped": False,\n        "clean": "clean.png",\n        "boxes": [{"id": "box_1"}],\n        "excluded_regions": [{"x1": 1, "y1": 2, "x2": 3, "y2": 4}],\n        "manual_mask": "manual.png",\n        "text_objects": [{"id": "text_1", "ocr_text": "keep state"}],\n        "clean_revision": 4,\n    }\n    manifest = {"pages": [page]}\n    monkeypatch.setattr(pipeline_module, "get_page_lock", lambda *_args: nullcontext())\n    monkeypatch.setattr(pipeline_module, "get_manifest_lock", lambda *_args: nullcontext())\n    monkeypatch.setattr(pipeline_module, "load_manifest_raw", lambda _chapter: manifest)\n    monkeypatch.setattr(pipeline_module, "save_manifest_raw", lambda *_args, **_kwargs: None)\n    monkeypatch.setattr(pipeline_module, "invalidate_page_render", lambda *_args, **_kwargs: None)\n    pipeline = ChapterPipeline.__new__(ChapterPipeline)\n    pipeline._sync_output_dir = lambda *_args, **_kwargs: None\n\n    result = pipeline.mark_skipped("abcd1234", [0], True)\n    current = result["pages"][0]\n    assert current["skipped"] is True\n    assert current["clean"] is None\n    assert current["boxes"] == []\n    assert current["excluded_regions"] == page["excluded_regions"]\n    assert current["manual_mask"] == "manual.png"\n    assert current["text_objects"][0]["ocr_text"] == "keep state"\n'''
          test_path.write_text(tests, encoding="utf-8")
