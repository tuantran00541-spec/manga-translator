name: Apply preserve-region design

on:
  push:
    branches:
      - perf/bubble-fastpath-roi-lama
    paths:
      - scripts/preserve_patch_core.py
      - scripts/preserve_patch_editing.py
      - scripts/preserve_patch_api_ui.py
      - scripts/preserve_patch_tests.py
      - .github/workflows/apply-perf-ai-repair-controls.yml

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  apply-preserve-region-design:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/bubble-fastpath-roi-lama
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install correctness-test runtime
        run: python -m pip install -r requirements-test.txt
      - name: Apply preserve-region design
        run: |
          sed -i 's/rep("app\/page_processing.py", "excluded_regions", "preserve_regions", 3)/rep("app\/page_processing.py", "excluded_regions", "preserve_regions", 2)/' scripts/preserve_patch_core.py
          sed -i 's/, 2)$/, 1)/' scripts/preserve_patch_core.py
          python scripts/preserve_patch_core.py
          python scripts/preserve_patch_editing.py
          python scripts/preserve_patch_api_ui.py
          python scripts/preserve_patch_tests.py
      - name: Compile candidate
        run: python -m compileall -q app tests/test_ai_repair_controls.py
      - name: Run repair-control regression suite
        run: |
          python -m pytest -q \
            tests/test_ai_repair_controls.py \
            tests/test_cleanup_safety_regressions.py \
            tests/test_ocr_pipeline_regressions.py
      - name: Check patch hygiene
        run: |
          git diff --check
          test -z "$(git grep -n 'excluded_regions' -- app ':!app/manifest_utils.py' ':!app/region_policy.py' ':!app/schemas.py' ':!app/routers/chapters.py' || true)"
          ! git grep -n 'vùng loại trừ\|Vùng loại trừ\|vùng cấm dịch\|Vùng cấm dịch' -- app/static/js
      - name: Commit tested source candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app tests/test_ai_repair_controls.py
          git rm -f \
            scripts/preserve_patch_core.py \
            scripts/preserve_patch_editing.py \
            scripts/preserve_patch_api_ui.py \
            scripts/preserve_patch_tests.py \
            .github/workflows/apply-perf-ai-repair-controls.yml
          git diff --cached --quiet && { echo "No source changes"; exit 1; }
          git commit -m "fix(perf): redesign AI repair controls"
          git push origin HEAD:perf/bubble-fastpath-roi-lama
