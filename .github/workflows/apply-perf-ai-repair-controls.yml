name: Apply perf AI repair controls

on:
  push:
    branches:
      - perf/bubble-fastpath-roi-lama
    paths:
      - .github/workflows/apply-perf-ai-repair-controls.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  apply-ai-repair-controls:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/bubble-fastpath-roi-lama
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install correctness-test runtime
        run: python -m pip install -r requirements-test.txt

      - name: Apply AI repair safety patch
        run: |
          python - <<'PY'
          import base64
          payload = (
            ""
            "            ""
            ""
            ""
            ""
          )
          exec(base64.b64decode(payload), {})
          PY

      - name: Compile candidate
        run: python -m compileall -q app

      - name: Run repair-control regression suite
        run: |
          python -m pytest -q \
            tests/test_cleanup_safety_regressions.py \
            tests/test_ocr_pipeline_regressions.py

      - name: Commit source candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git status --short
          git add \
            app/region_policy.py \
            app/text_objects.py \
            app/ocr/service.py \
            app/routers/translation.py \
            app/routers/render_commit.py \
            app/render/identity.py \
            app/pipeline_editing.py \
            app/schemas.py \
            app/routers/editor.py \
            app/static/js/preview.js \
            tests/test_cleanup_safety_regressions.py
          git commit -m "fix(editor): harden AI repair controls"
          git push origin HEAD:perf/bubble-fastpath-roi-lama
