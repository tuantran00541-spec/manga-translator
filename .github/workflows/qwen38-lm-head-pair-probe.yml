name: Qwen3.8 exact two-vector LM-head stream reuse gate

on:
  push:
    branches: [research/qwen3.8-27b-runtime-finish]
    paths:
      - "research/qwen38/qwen38_lm_head_pair_probe.py"
      - ".github/workflows/qwen38-lm-head-pair-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  HF_HUB_DISABLE_TELEMETRY: "1"

jobs:
  lm-head-pair:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[qwen-lm-pair]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Exact kernel and LM-head pair sanity gates
        shell: bash
        run: |
          set -euo pipefail
          cc -O3 -std=c11 -mavx2 -fno-fast-math -ffp-contract=off \
            -DQWEN_AVX2_EXACT_SELFTEST research/qwen38/gguf_quant_dot_avx2.c -lm \
            -o "$RUNNER_TEMP/qwen-avx2-selftest"
          "$RUNNER_TEMP/qwen-avx2-selftest"
          PYTHONPATH=research/qwen38 python -u research/qwen38/qwen38_lm_head_pair_probe.py sanity

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Runner CPU and storage information
        shell: bash
        run: |
          lscpu
          df -h
          free -h

      - name: Reclaim disk
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true
          docker system prune -af || true
          df -h
          free -h

      - name: Install download dependencies
        run: python -m pip install --no-cache-dir huggingface_hub hf_xet

      - name: Download pinned real GGUF once
        shell: bash
        run: |
          set -euo pipefail
          MODEL=$(python - <<'PY'
          from huggingface_hub import hf_hub_download
          print(hf_hub_download(
              "bartowski/Qwen3.8-27B-GGUF",
              filename="Qwen3.8-27B-Q6_K_L.gguf",
              local_dir="${{ runner.temp }}/qwen38-model",
          ))
          PY
          )
          test -f "$MODEL"
          echo "MODEL=$MODEL" >> "$GITHUB_ENV"
          echo "K3_WORK=$RUNNER_TEMP/qwen38-lm-head-pair-k3" >> "$GITHUB_ENV"
          echo "EVIDENCE=$RUNNER_TEMP/qwen38-lm-head-pair-evidence" >> "$GITHUB_ENV"

      - name: Validate pinned decoder inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          PYTHONPATH=research/qwen38 python -u research/qwen38/qwen35_gguf_decoder_contract.py real \
            --model "$MODEL" --output "$EVIDENCE/inventory.json" \
            2>&1 | tee "$EVIDENCE/inventory.log"

      - name: Compile exact target and recurrent-state bridges
        shell: bash
        run: |
          set -euo pipefail
          cc -O3 -std=c11 -mavx2 -fno-fast-math -ffp-contract=off -fPIC -shared \
            research/qwen38/gguf_quant_dot_avx2.c -lm \
            -o "$RUNNER_TEMP/libqwen_quant_avx2.so"
          cc -O2 -std=c11 -fPIC -shared research/qwen38/gdn_state_ar.c -lm \
            -o "$RUNNER_TEMP/libqwen_gdn_serial.so"

      - name: Run exact two-vector LM-head stream probe
        timeout-minutes: 18
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$K3_WORK" "$EVIDENCE"
          PYTHONPATH=research/qwen38 python -u research/qwen38/qwen38_lm_head_pair_probe.py run \
            --model "$MODEL" \
            --native-lib "$RUNNER_TEMP/libqwen_quant_avx2.so" \
            --state-lib "$RUNNER_TEMP/libqwen_gdn_serial.so" \
            --inventory "$EVIDENCE/inventory.json" \
            --work-dir "$K3_WORK" \
            --output "$EVIDENCE/lm-head-pair.json" \
            2>&1 | tee "$EVIDENCE/lm-head-pair.log"
          grep -F "QWEN38_LM_HEAD_PAIR_EXACT_PASS" "$EVIDENCE/lm-head-pair.log"

      - name: Require exact logits and exact 2-to-1 LM-head traffic
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads((Path(os.environ["EVIDENCE"])/"lm-head-pair.json").read_text(encoding="utf-8"))
          assert r["status"] == "PASS"
          assert r["model_sha256"] == "a487690b9f17de581857c4ae484dab50800335bb9eb978a4fb02c0465629dc0a"
          assert r["prefix_token_ids"] == [12675, 11]
          assert r["pair_token_ids"] == [353, 2688]
          assert r["expected_top1"] == [2688, 264]
          assert r["logits_a_bitwise_exact"] is True
          assert r["logits_b_bitwise_exact"] is True
          assert r["lm_head_tensor_bytes"] == 1350860800
          assert r["sequential_lm_head_bytes"] == 2 * r["pair_lm_head_bytes"]
          assert r["pair_lm_head_bytes"] == r["lm_head_tensor_bytes"]
          assert r["lm_head_bytes_saved"] == r["pair_lm_head_bytes"]
          assert r["exact_two_to_one_lm_head_bytes"] is True
          assert r["target_k3_reader"]["direct_io"] is True
          print("QWEN38_LM_HEAD_PAIR_REAL_GATE_PASS")
          print(json.dumps({
              "sequential_seconds": r["sequential_seconds"],
              "pair_seconds": r["pair_seconds"],
              "speedup": r["pair_speedup_vs_two_sequential_heads"],
              "sequential_lm_head_bytes": r["sequential_lm_head_bytes"],
              "pair_lm_head_bytes": r["pair_lm_head_bytes"],
              "lm_head_bytes_saved": r["lm_head_bytes_saved"],
              "max_rss_gib": r["max_rss_gib"],
          }, indent=2))
          PY

      - name: Upload compact LM-head pair evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: qwen38-lm-head-pair-${{ github.run_id }}
          path: ${{ runner.temp }}/qwen38-lm-head-pair-evidence/
          retention-days: 14
