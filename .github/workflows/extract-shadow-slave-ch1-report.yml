name: Extract Shadow Slave chapter 1 report

on:
  push:
    branches:
      - perf/bubble-fastpath-roi-lama
    paths:
      - .github/workflows/extract-shadow-slave-ch1-report.yml

permissions:
  actions: read
  contents: read

jobs:
  extract:
    if: github.event.head_commit.message == 'ci(perf)'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Download completed chapter artifact
        uses: actions/download-artifact@v4
        with:
          name: shadow-slave-ch1-ocr-audit-35030161624
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35030161624
          path: artifact

      - name: Build compact report
        run: |
          mkdir -p compact
          python - <<'PY'
          import json
          import shutil
          import statistics
          from collections import Counter
          from pathlib import Path

          root = Path("artifact")
          def one(name):
              matches = sorted(root.rglob(name))
              if not matches:
                  raise RuntimeError(f"missing {name}")
              return matches[0]

          report_path = one("report.json")
          manifest_path = one("manifest.json")
          weak_path = one("weak-cases.json")
          report = json.loads(report_path.read_text(encoding="utf-8"))
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          weak = json.loads(weak_path.read_text(encoding="utf-8"))

          pages = manifest.get("pages", [])
          timing_keys = ("detect", "auto_inpaint", "residue_verify", "total")
          timing = {key: [] for key in timing_keys}
          page_rows = []
          source_models = Counter()
          mask_sources = Counter()
          semantic_types = Counter()
          safe_total = review_total = 0

          for index, page in enumerate(pages):
              boxes = page.get("boxes") or []
              safe = sum(bool(box.get("safe_to_inpaint")) for box in boxes)
              review = len(boxes) - safe
              safe_total += safe
              review_total += review
              for box in boxes:
                  source_models[str(box.get("source_model") or "none")] += 1
                  mask_sources[str(box.get("mask_source") or "none")] += 1
                  semantic_types[str(box.get("semantic_type") or "unknown")] += 1
              tm = (page.get("processing_metrics") or {}).get("timing_ms") or {}
              row = {
                  "page_index": index,
                  "source_page": page.get("source_page"),
                  "slice_index": page.get("slice_index"),
                  "width": page.get("width"),
                  "height": page.get("height"),
                  "boxes": len(boxes),
                  "safe_boxes": safe,
                  "review_boxes": review,
                  "timing_ms": {},
                  "detection_state": page.get("detection_state"),
                  "needs_review": bool(page.get("needs_review")),
              }
              for key in timing_keys:
                  value = tm.get(key)
                  if value is not None:
                      value = float(value)
                      timing[key].append(value)
                      row["timing_ms"][key] = round(value, 3)
              page_rows.append(row)

          def stats(values):
              if not values:
                  return None
              ordered = sorted(values)
              return {
                  "count": len(values),
                  "mean_ms": round(statistics.mean(values), 3),
                  "median_ms": round(statistics.median(values), 3),
                  "p95_ms": round(ordered[min(len(ordered) - 1, int(0.95 * len(ordered)))], 3),
                  "max_ms": round(max(values), 3),
              }

          ocr = report.get("ocr") or {}
          ocr_results = report.get("results") or []
          ocr_elapsed = [float(item["elapsed_ms"]) for item in ocr_results if item.get("elapsed_ms") is not None]
          ocr_quality = Counter(str(item.get("quality") or "unknown") for item in ocr_results)
          ocr_weak = [
              {
                  "page_index": item.get("page_index"),
                  "box_id": item.get("box_id"),
                  "quality": item.get("quality"),
                  "quality_reason": item.get("quality_reason"),
                  "confidence": item.get("confidence"),
                  "retry_applied": bool(item.get("retry_applied")),
                  "text_length": len(str(item.get("text") or "")),
                  "elapsed_ms": item.get("elapsed_ms"),
              }
              for item in ocr_results
              if str(item.get("quality")) in {"review", "reject"}
          ]
          ocr_weak.sort(key=lambda item: (str(item.get("quality")), -(float(item.get("elapsed_ms") or 0.0))))

          compact = {
              "benchmark": "shadow-slave-ch1-compact-extract",
              "source_report": report.get("benchmark"),
              "chapter_id": report.get("chapter_id"),
              "chapter_url": report.get("chapter_url"),
              "source_images": report.get("source_images"),
              "slices": len(pages),
              "clean_summary": report.get("clean"),
              "timing_ms": {key: stats(values) for key, values in timing.items()},
              "boxes": {
                  "safe": safe_total,
                  "review": review_total,
                  "total": safe_total + review_total,
                  "source_models": dict(source_models),
                  "mask_sources": dict(mask_sources),
                  "semantic_types": dict(semantic_types),
              },
              "ocr": {
                  "planned": ocr.get("planned"),
                  "completed": ocr.get("completed"),
                  "errors": len(ocr.get("errors") or []),
                  "quality": dict(ocr_quality),
                  "reported_quality": ocr.get("quality"),
                  "quality_reasons": ocr.get("quality_reasons"),
                  "empty": ocr.get("empty"),
                  "low_conf_lt_0_80": ocr.get("low_conf_lt_0_80"),
                  "retry": ocr.get("retry"),
                  "wall_s": ocr.get("wall_s"),
                  "mean_ms_per_target": ocr.get("mean_ms_per_target"),
                  "elapsed_ms": stats(ocr_elapsed),
              },
              "weak_ocr_count": len(ocr_weak),
              "weak_ocr": ocr_weak[:80],
              "slowest_pages": sorted(
                  page_rows,
                  key=lambda row: float((row.get("timing_ms") or {}).get("total") or 0.0),
                  reverse=True,
              )[:20],
          }

          out = Path("compact")
          (out / "summary.json").write_text(json.dumps(compact, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          (out / "weak-cases.json").write_text(json.dumps(weak, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          (out / "manifest.json").write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          crops = sorted(root.rglob("ocr-crops/*.jpg"))
          crop_out = out / "ocr-crops"
          crop_out.mkdir(parents=True, exist_ok=True)
          for source in crops[:12]:
              shutil.copy2(source, crop_out / source.name)

          print("COMPACT_REPORT=" + json.dumps({
              "source_images": compact["source_images"],
              "slices": compact["slices"],
              "clean": compact["clean_summary"],
              "timing_ms": compact["timing_ms"],
              "boxes": compact["boxes"],
              "ocr": compact["ocr"],
              "weak_ocr_count": compact["weak_ocr_count"],
              "copied_ocr_sheets": len(crops[:12]),
          }, ensure_ascii=False))
          PY

      - name: Upload compact chapter report
        uses: actions/upload-artifact@v4
        with:
          name: shadow-slave-ch1-compact-35030161624
          path: compact/
          retention-days: 7
          compression-level: 6
          if-no-files-found: error
