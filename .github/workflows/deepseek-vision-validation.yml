name: deepseek-vision-validation

on:
  push:
    branches:
      - feature/deepseek-vision-provider

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install pinned test dependencies
        run: |
          python -m pip install \
            pytest==8.3.5 \
            fastapi==0.115.0 \
            pydantic==2.9.2 \
            requests==2.32.3 \
            beautifulsoup4==4.12.3 \
            lxml==5.3.0 \
            playwright==1.47.0 \
            python-multipart==0.0.12 \
            Pillow==10.4.0 \
            numpy==1.26.4 \
            opencv-python-headless==4.10.0.84 \
            onnxruntime==1.21.0 \
            filelock==3.16.1 \
            loguru==0.7.2 \
            psutil==6.1.1 \
            keyring==25.6.0
      - name: Prepare runtime directories
        run: mkdir -p logs data/raw data/processed data/output models
      - name: Check JavaScript syntax
        run: |
          node --check app/static/js/chapter-qc.js
          node --check app/static/js/deepseek-qc-settings.js
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run chapter QC browser smoke
        run: python tests/browser_phase43_chapter_qc.py
      - name: Run repository regression suite
        run: |
          python -m pytest -q \
            --deselect=tests/test_inpaint_benchmark.py::TestInpaintBenchmarkFinalTrustClosure::test_01_prod_and_model_integrity_real_files_pass \
            --deselect=tests/test_inpaint_benchmark.py::TestInpaintBenchmarkFinalTrustClosure::test_02_prod_integrity_mutate_one_byte_fails
