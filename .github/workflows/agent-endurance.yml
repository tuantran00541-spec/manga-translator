name: Agent endurance

# One-off: PolarGrid Qwen works on a very long build with every limit lifted, to see whether the harness holds up for hours.
on:
  push:
    branches-ignore: [main]
    paths:
      - ".github/workflows/agent-endurance.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  endurance:
    runs-on: ubuntu-22.04
    timeout-minutes: 355
    env:
      OUT: audit-results/agent-endurance
      WORK: /tmp/agent-work
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q -r requirements-test.txt

      - name: Lift the limits and write the task
        run: |
          mkdir -p "$OUT" "$WORK/project" "$HOME/.manga-agent"
          # No token budget, no step cap, no goal-nudge cap: only the job's own time limit remains.
          echo '{"token_budget": 1000000000000, "max_steps": 1000000, "goal_turns": 1000000}' > "$HOME/.manga-agent/profile.json"
          cat > "$WORK/task.txt" <<'TXT'
          /goal Xây từ con số 0 một cơ sở dữ liệu quan hệ nhỏ bằng Python thuần tên minisql trong thư mục làm việc (pyproject.toml, bố cục src/minisql, tests/). Làm lần lượt 40 mốc dưới đây. Xong mỗi mốc phải có test riêng và TOÀN BỘ bộ test pass rồi mới sang mốc tiếp; ghi tiến độ vào PROGRESS.md sau mỗi mốc. Dùng agent con song song cho các mốc độc lập. Chỉ gọi goal_done khi cả 40 mốc xong, bộ test pass và README đầy đủ.
          1 tokenizer SQL. 2 parser CREATE TABLE. 3 INSERT. 4 SELECT cơ bản. 5 WHERE với AND/OR/NOT và so sánh. 6 ORDER BY, LIMIT, OFFSET. 7 UPDATE. 8 DELETE. 9 kiểu INT/TEXT/REAL/BOOL và kiểm tra kiểu. 10 NULL và logic ba trị. 11 PRIMARY KEY và UNIQUE. 12 NOT NULL và DEFAULT. 13 lưu trữ file theo trang 4KB. 14 B-tree index. 15 CREATE INDEX và planner dùng index. 16 INNER JOIN. 17 LEFT JOIN. 18 GROUP BY với COUNT/SUM/AVG/MIN/MAX. 19 HAVING. 20 DISTINCT. 21 subquery trong WHERE (IN, EXISTS). 22 subquery trong FROM. 23 UNION và UNION ALL. 24 hàm LOWER, UPPER, LENGTH, ABS, ROUND, SUBSTR. 25 LIKE. 26 BETWEEN và IN. 27 CASE WHEN. 28 giao dịch BEGIN/COMMIT/ROLLBACK. 29 WAL và khôi phục sau crash giả lập. 30 khóa đọc/ghi nhiều luồng. 31 ALTER TABLE ADD COLUMN. 32 DROP TABLE và DROP INDEX. 33 EXPLAIN. 34 REPL dòng lệnh minisql. 35 import/export CSV. 36 VIEW. 37 trigger đơn giản. 38 benchmark 100k dòng và tối ưu. 39 fuzz test so sánh kết quả với sqlite3 trên 1000 truy vấn ngẫu nhiên. 40 tài liệu và ví dụ.
          TXT

      - name: Run, sampling the harness every two minutes
        env:
          AGENT_API_KEY: ${{ secrets.polagrid_ }}
        run: |
          cat > "$WORK/monitor.py" <<'PY'
          import csv, glob, json, os, sys, time
          pid, out = int(sys.argv[1]), sys.argv[2]
          start = time.time()
          with open(f"{out}/monitor.csv", "w", newline="") as handle:
              writer = csv.writer(handle)
              writer.writerow(["minutes", "rss_mb", "session_file_mb", "events", "history_items", "history_mb", "prompt_tokens", "completion_tokens", "status"])
              while os.path.exists(f"/proc/{pid}"):
                  time.sleep(120)
                  try:
                      rss = int([l for l in open(f"/proc/{pid}/status") if l.startswith("VmRSS")][0].split()[1]) / 1024
                  except (OSError, IndexError):
                      break
                  files = sorted(glob.glob(os.path.expanduser("~/.manga-agent/sessions/*.json")), key=os.path.getmtime)
                  row = [round((time.time() - start) / 60, 1), round(rss), "", "", "", "", "", "", ""]
                  if files:
                      try:
                          data = json.load(open(files[-1], encoding="utf-8"))
                          row[2:] = [round(os.path.getsize(files[-1]) / 1e6, 1), len(data["events"]), len(data["history"]),
                                     round(len(json.dumps(data["history"])) / 1e6, 2), data["usage"]["prompt_tokens"], data["usage"]["completion_tokens"], data.get("status", "")]
                      except (OSError, ValueError):
                          pass
                  writer.writerow(row)
                  handle.flush()
          PY
          python -m app.agent.cli exec "$(cat "$WORK/task.txt")" --base "https://api.mia-01.edge.polargrid.ai/v1" --model "qwen-3.8-27b" \
            --provider polargrid --workspace "$WORK/project" --mode auto --sandbox workspace-write \
            --timeout-min 335 --json > "$OUT/events.jsonl" 2> "$OUT/stderr.log" &
          CLI=$!
          python "$WORK/monitor.py" "$CLI" "$OUT" &
          wait "$CLI" || true
          tail -c 600 "$OUT/stderr.log"

      - name: Summarize
        if: always()
        run: |
          python - <<'PY'
          import collections, json, os
          out = os.environ["OUT"]
          rows = []
          for line in open(f"{out}/events.jsonl", encoding="utf-8", errors="replace"):
              try:
                  rows.append(json.loads(line))
              except ValueError:
                  pass
          tools = [r["name"] for r in rows if r.get("type") == "tool"]
          result = next((r for r in reversed(rows) if r.get("type") == "result"), {})
          steps = [r for r in rows if r.get("type") == "assistant"]
          t0 = rows[0]["time"] if rows else 0
          per_hour = collections.Counter(int((r["time"] - t0) // 3600) for r in steps)
          errors = [r["text"][:200] for r in rows if r.get("type") == "error"]
          summary = {"status": result.get("status"), "usage": result.get("usage"), "stats": result.get("stats"), "events": len(rows),
                     "assistant_steps": len(steps), "steps_per_hour": dict(per_hour), "tool_counts": dict(collections.Counter(tools).most_common(30)),
                     "failed_tools": sum(1 for r in rows if r.get("type") == "tool" and not r.get("ok")),
                     "helpers_started": sum(1 for r in rows if r.get("type") == "subagent" and r.get("state") == "started"),
                     "errors": errors[:20], "notices": collections.Counter(r["text"][:70] for r in rows if r.get("type") == "notice").most_common(25),
                     "goal_done": any(r.get("type") == "tool" and r.get("name") == "goal_done" for r in rows)}
          open(f"{out}/summary.json", "w", encoding="utf-8").write(json.dumps(summary, ensure_ascii=False, indent=1))
          final = next((r["text"] for r in reversed(rows) if r.get("type") == "assistant" and r.get("text")), "")
          open(f"{out}/answer.md", "w", encoding="utf-8").write(final)
          print(json.dumps({k: v for k, v in summary.items() if k not in ("notices", "tool_counts")}, ensure_ascii=False))
          PY
          # The event log can be huge; keep it compressed and only its last part when too big.
          gzip -9 "$OUT/events.jsonl"
          if [ "$(stat -c %s "$OUT/events.jsonl.gz")" -gt 40000000 ]; then
            rm "$OUT/events.jsonl.gz"
          fi

      - name: Check the project that was built
        if: always()
        run: |
          cd "$WORK/project"
          find . -type f -not -path './.git/*' -not -path '*/__pycache__/*' | sort > "$GITHUB_WORKSPACE/$OUT/files.txt"
          wc -l "$GITHUB_WORKSPACE/$OUT/files.txt"
          cp PROGRESS.md "$GITHUB_WORKSPACE/$OUT/PROGRESS.md" 2>/dev/null || true
          (python -m pip install -q -e . pytest && timeout 900 python -m pytest -q -p no:cacheprovider 2>&1 | tail -15) | tee "$GITHUB_WORKSPACE/$OUT/project-pytest.txt" || true

      - name: Give git access only now that the agents are done
        if: always()
        env:
          TOKEN: ${{ github.token }}
        run: |
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"

      - name: Save evidence to audit-evidence
        if: always()
        uses: ./.github/actions/save-evidence
        with:
          paths: audit-results/agent-endurance
          message: "audit: Agent endurance run on PolarGrid Qwen (run ${{ github.run_id }})"
