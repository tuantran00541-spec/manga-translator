name: Phase 4.0 patch apply

on:
  push:
    branches:
      - phase-4-0-correctness-foundation

permissions:
  contents: write

jobs:
  apply-tested-patch:
    if: ${{ !contains(github.event.head_commit.message, '[phase40-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-4-0-correctness-foundation
          fetch-depth: 0
      - name: Apply tested Phase 4.0 patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d phase40.patch.gz.b64 | gzip -d > /tmp/phase40.patch
          git apply --check /tmp/phase40.patch
          git apply /tmp/phase40.patch
          rm -f phase40.patch.gz.b64 .github/workflows/phase40-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: Phase 4.0 correctness foundation [phase40-applied]"
          git push origin HEAD:phase-4-0-correctness-foundation
