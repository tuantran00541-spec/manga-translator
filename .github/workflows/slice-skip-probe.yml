name: Slice skip probe

on:
  push:
    branches: [claude/friendly-hypatia-xi865r]
    paths: [".github/workflows/slice-skip-probe.yml"]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: "."
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install download runtime
        run: |
          python -m pip install --only-binary :all: numpy==1.26.4 Pillow==10.4.0 opencv-contrib-python==4.10.0.84 \
            onnxruntime==1.20.1 psutil==6.1.1 loguru==0.7.2 requests==2.32.3 \
            beautifulsoup4==4.12.3 lxml==5.3.0 playwright==1.47.0 fastapi==0.115.0 \
            pydantic==2.9.2 filelock==3.16.1 python-multipart==0.0.12
          python -m playwright install --with-deps chromium
      - name: Ask the decider which slices hold story text
        env:
          MINIROUTER_API_KEY: ${{ secrets.MINIROUTER_API_KEY }}
        run: |
          git fetch -q origin audit-evidence
          mkdir -p audit-results/slice-skip
          python - <<'PY'
          import base64, json, os, subprocess
          from concurrent.futures import ThreadPoolExecutor
          from pathlib import Path
          import cv2, numpy as np, requests
          from app.image_io import read_image
          from app.processing_pipeline_factory import build_processing_pipeline

          out = Path("audit-results/slice-skip")
          key = os.environ["MINIROUTER_API_KEY"]
          question = {"kind": {"type": "choice", "instructions": "What lettering does this webtoon panel show?",
                               "criteria": {"story": "Dialogue, narration, thoughts, signs or game/system windows a reader needs translated",
                                            "credit": "Only scanlator credits, a watermark, a logo or a website address",
                                            "none": "No lettering at all, or only sound effects drawn into the art"}}}

          def tiles(image):
              h, w = image.shape[:2]
              for y in range(0, h, w):
                  tile = image[y:min(h, y + w + 60)]
                  for side in (640, 544, 460, 390, 330):
                      small = cv2.resize(tile, None, fx=side / w, fy=side / w, interpolation=cv2.INTER_AREA)
                      ok, data = cv2.imencode(".jpg", small, [cv2.IMWRITE_JPEG_QUALITY, 75])
                      if len(data) < 20000:
                          break
                  yield "data:image/jpeg;base64," + base64.b64encode(data.tobytes()).decode()

          def ask(url):
              try:
                  r = requests.post("https://api.minirouter.sh/v1/evaluate", timeout=(5, 60),
                                    headers={"Authorization": f"Bearer {key}"},
                                    json={"model": "perplexity/pplx-decider-v1.2",
                                          "state": [{"type": "image_url", "image_url": {"url": url}}], "questions": question})
                  r.raise_for_status()
                  return r.json()["answers"]["kind"]
              except Exception as e:
                  return {"error": str(e)[:200]}

          def story(answer):
              probs = answer.get("probabilities")
              if isinstance(probs, dict):
                  return float(probs.get("story", 0))
              if isinstance(probs, list):
                  for p in probs:
                      if isinstance(p, dict) and p.get("choice", p.get("name")) == "story":
                          return float(p.get("probability", 0))
              return 1.0 if answer.get("choice") == "story" else 0.0

          pipeline = build_processing_pipeline()
          summary = {}
          chapters = {"shadow-slave-1": "https://asurascans.com/comics/shadow-slave-05c7df14/chapter/1",
                      "solo-swordmaster-1": None, "the-hero-cannot-rest-1": "https://asurascans.com/comics/the-hero-cannot-rest-3ec3b16f/chapter/1"}
          for name in chapters:
              report = json.loads(subprocess.check_output(["git", "show", f"FETCH_HEAD:audit-results/ai-cost/final/{name}/report.json"]))
              chapters[name] = chapters[name] or report["url"]
              scan_skip = set(report["report"]["textless_pages"]) | set(report["report"]["credit_pages"])
              pages = pipeline.download_chapter(chapters[name], f"c1a9010{len(summary)}", workers=2)["pages"]
              images = [read_image(Path(p["original"])) for p in pages]
              jobs = [(i, url) for i, image in enumerate(images) for url in tiles(image)]
              with ThreadPoolExecutor(8) as pool:
                  answers = list(pool.map(lambda job: ask(job[1]), jobs))
              per_slice = {}
              for (i, _), answer in zip(jobs, answers):
                  per_slice.setdefault(i, []).append(answer)
              rows = []
              for i in range(len(images)):
                  best = max((story(a) for a in per_slice.get(i, []) if "error" not in a), default=1.0)
                  rows.append({"slice": i, "story": round(best, 3), "scan_skip": i in scan_skip,
                               "errors": sum("error" in a for a in per_slice.get(i, [])), "tiles": per_slice.get(i, [])})
              (out / f"{name}.json").write_text(json.dumps(rows, indent=1))
              for th in (0.1, 0.2, 0.3, 0.5):
                  skip = {r["slice"] for r in rows if r["story"] < th}
                  summary.setdefault(name, {"slices": len(images), "scan_skip": sorted(scan_skip)})[f"skip<{th}"] = {
                      "skip": sorted(skip), "both": len(skip & scan_skip), "only_decider": sorted(skip - scan_skip), "only_scan": sorted(scan_skip - skip)}
              # Thumbnails of every slice either side would skip, labelled with the decider's story chance.
              picks = sorted({r["slice"] for r in rows if r["story"] < 0.5} | scan_skip)
              thumbs = []
              for i in picks:
                  t = cv2.resize(images[i], (220, int(images[i].shape[0] * 220 / images[i].shape[1])))[:700]
                  t = cv2.copyMakeBorder(t, 30, 700 - t.shape[0], 0, 6, cv2.BORDER_CONSTANT, value=(255, 255, 255))
                  cv2.putText(t, f"{i} s={rows[i]['story']:.2f}{' SCAN' if i in scan_skip else ''}", (4, 21), cv2.FONT_HERSHEY_SIMPLEX, 0.55, (0, 0, 200), 1)
                  thumbs.append(t)
              for n in range(0, len(thumbs), 8):
                  part = thumbs[n:n + 8] + [np.full_like(thumbs[0], 255)] * (8 - len(thumbs[n:n + 8]))
                  cv2.imwrite(str(out / f"{name}-{n // 8 + 1}.jpg"), np.concatenate(part, axis=1), [cv2.IMWRITE_JPEG_QUALITY, 80])
              print(name, json.dumps(summary[name], indent=1), flush=True)
          (out / "summary.json").write_text(json.dumps(summary, indent=1))
          PY
      - if: always()
        uses: ./.github/actions/save-evidence
        with:
          paths: audit-results/slice-skip
          message: "audit: decider slice skip probe (run ${{ github.run_id }})"
