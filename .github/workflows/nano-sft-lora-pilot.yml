name: Nano SFT LoRA pilot (CPU)
on:
  workflow_dispatch:
    inputs:
      data_run_id:
        description: "nano-sft-data-build run id whose artifacts hold the pairs (empty = use data_file)"
        required: false
        default: ""
        type: string
      data_file:
        description: "repo path of a pairs jsonl to train on (e.g. scripts/nano_sft/data/vision-trial-pairs.jsonl); empty = use data_run_id artifacts"
        required: false
        default: ""
        type: string
      crops_zip:
        description: "repo path of a zip holding the crops for data_file (unzipped at repo root); empty = none"
        required: false
        default: ""
        type: string
      init_adapter_run_id:
        description: "nano-sft-text-stage run id whose nano-sft-text artifact holds the stage-1 adapter (empty = fresh LoRA)"
        required: false
        default: ""
        type: string
      max_pairs:
        description: "pairs to train on (pilot)"
        required: false
        default: "150"
        type: string
      epochs:
        description: "epochs over the pilot pairs"
        required: false
        default: "2"
        type: string
      prompts_file:
        description: "repo path of a prompts file (one prompt per line, rotated per example); empty = single default prompt"
        required: false
        default: ""
        type: string
      holdout_file:
        description: "repo path of a holdout file (one crop basename per line, forced into holdout); empty = positional holdout"
        required: false
        default: ""
        type: string

jobs:
  pilot:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      PYTHONPATH: "."
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "4"
      HF_HUB_ENABLE_HF_TRANSFER: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install training deps
        run: |
          pip install --quiet torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet "transformers==5.23.0" peft accelerate pillow
          python3 -c "import torch, transformers, peft; print('torch', torch.__version__, 'transformers', transformers.__version__, 'peft', peft.__version__)"
      - name: Download pairs artifacts from data-build run
        if: ${{ inputs.data_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p pairs2
          ids=$(gh api "repos/${{ github.repository }}/actions/runs/${{ inputs.data_run_id }}/artifacts" --jq '.artifacts[] | select(.name | startswith("nano-sft-ch")) | .id')
          echo "artifact ids: $ids"
          [ -n "$ids" ] || { echo "no nano-sft-ch artifacts on run ${{ inputs.data_run_id }}"; exit 1; }
          for id in $ids; do
            gh api "repos/${{ github.repository }}/actions/artifacts/$id/zip" > "a-$id.zip"
            unzip -o -q "a-$id.zip" -d .
          done
          echo "pair files:"; ls ch*.jsonl | wc -l
      - name: Unzip trial crops (optional)
        if: ${{ inputs.crops_zip != '' }}
        run: |
          unzip -o -q "${{ inputs.crops_zip }}" -d .
          ls crops/ | wc -l
      - name: Download stage-1 adapter (optional)
        if: ${{ inputs.init_adapter_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          id=$(gh api "repos/${{ github.repository }}/actions/runs/${{ inputs.init_adapter_run_id }}/artifacts" --jq '.artifacts[] | select(.name == "nano-sft-text") | .id')
          [ -n "$id" ] || { echo "no nano-sft-text artifact on run ${{ inputs.init_adapter_run_id }}"; exit 1; }
          gh api "repos/${{ github.repository }}/actions/artifacts/$id/zip" > init-adapter.zip
          mkdir -p init-adapter
          unzip -o -q init-adapter.zip -d init-adapter
          ls init-adapter/text-out/
      - name: LoRA pilot train
        run: |
          if [ -n "${{ inputs.data_file }}" ]; then
            pairs="${{ inputs.data_file }}"
          else
            pairs="ch*.jsonl"
          fi
          init_arg=""
          if [ -n "${{ inputs.init_adapter_run_id }}" ]; then
            init_arg="--init-adapter init-adapter/text-out"
          fi
          prompts_arg=""
          if [ -n "${{ inputs.prompts_file }}" ]; then
            prompts_arg="--prompts-file ${{ inputs.prompts_file }}"
          fi
          holdout_arg=""
          if [ -n "${{ inputs.holdout_file }}" ]; then
            holdout_arg="--holdout-crops ${{ inputs.holdout_file }}"
          fi
          python3 scripts/nano_sft/train_pilot.py \
            --pairs $pairs \
            --model huihui-ai/Huihui-Qwen3.5-0.8B-abliterated \
            $init_arg \
            $prompts_arg \
            $holdout_arg \
            --out pilot-out \
            --max-pairs "${{ inputs.max_pairs }}" \
            --epochs "${{ inputs.epochs }}" \
            --batch 1 --accum 8 --lr 1e-4 \
            --dtype float32 2>&1 | tee pilot-train.log
          echo "--- pilot report ---"
          cat pilot-out/pilot-report.json
      - name: Upload pilot adapter + report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nano-sft-pilot
          path: |
            pilot-out/
            pilot-train.log
          retention-days: 30
