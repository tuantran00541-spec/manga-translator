name: Kiuyha ONNX export

on:
  push:
    paths:
      - "scripts/export_kiuyha_onnx.py"
      - "app/detector/kiuyha_detector.py"
      - ".github/workflows/kiuyha-onnx.yml"
  workflow_dispatch:
    inputs:
      chapter_url:
        description: "Chapter to clean"
        required: false

permissions:
  contents: write

concurrency:
  group: kiuyha-onnx-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: "."
      MANGA_PROCESSING_PIPELINE: fast
      MANGA_USE_DYNAMIC_LAMA: "1"
      MANGA_ORT_PROVIDER: openvino
      MANGA_ORT_REQUIRE_PROVIDER: "1"
      MANGA_ORT_OPENVINO_SCOPE: detectors
      MANGA_ORT_OPENVINO_THREADS: "2"
      MANGA_ORT_OPENVINO_STREAMS: "1"
      MANGA_ORT_OPENVINO_CACHE_DIR: /tmp/manga-openvino-cache
      OPENBLAS_NUM_THREADS: "1"
      CHAPTER_URL: ${{ github.event.inputs.chapter_url || 'https://asurascans.com/comics/the-academy-s-weapon-replicator-05c7df14/chapter/1' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install processing runtime
        run: |
          python -m pip install --only-binary :all: numpy==1.26.4 Pillow==10.4.0 opencv-contrib-python==4.10.0.84 \
            onnxruntime-openvino==1.24.1 psutil==6.1.1 loguru==0.7.2 requests==2.32.3 \
            beautifulsoup4==4.12.3 lxml==5.3.0 playwright==1.47.0 fastapi==0.115.0 \
            pydantic==2.9.2 filelock==3.16.1 python-multipart==0.0.12
          python -m playwright install --with-deps chromium
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "ultralytics>=8.4" huggingface_hub onnx onnxslim
          # ultralytics pulls opencv-python; the app needs the contrib build.
          python -m pip uninstall -y opencv-python opencv-python-headless || true
          python -m pip install --force-reinstall --no-deps opencv-contrib-python==4.10.0.84
          python -c "import ultralytics, cv2; print(ultralytics.__version__, cv2.__version__)"

      - name: Restore detector and inpaint models
        uses: actions/cache/restore@v4
        with:
          path: |
            models/*.onnx
            models/.e2e-provenance.json
          key: processing-profile-models-b224548-v1

      - name: Check the models are there
        run: |
          ls -la models
          test -f models/text_segmenter.onnx && test -f models/lama-manga-dynamic.onnx

      - name: Export to ONNX and check against the .pt model
        run: python scripts/export_kiuyha_onnx.py "$CHAPTER_URL" --out audit-results/kiuyha-onnx --slices 16

      - name: Keep the ONNX files for the benches
        uses: actions/cache/save@v4
        with:
          path: models/kiuyha_text*.onnx
          key: kiuyha-onnx-${{ github.sha }}

      - name: Upload the ONNX files
        uses: actions/upload-artifact@v4
        with:
          name: kiuyha-onnx
          path: models/kiuyha_text*.onnx
          retention-days: 30

      - name: Save evidence to audit-evidence
        if: always()
        uses: ./.github/actions/save-evidence
        with:
          paths: audit-results/kiuyha-onnx
          message: "audit: Kiuyha ONNX export (run ${{ github.run_id }})"
