name: Qwen3.8 exact two-position K3 weight reuse probe

on:
  push:
    branches: [research/qwen3.8-27b-runtime-finish]
    paths:
      - "research/qwen38/qwen38_k3_pair_reuse_probe.py"
      - ".github/workflows/qwen38-k3-pair-reuse-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  HF_HUB_DISABLE_TELEMETRY: "1"

jobs:
  pair-reuse:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[qwen-pair-reuse]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Exact kernel and pair-reuse sanity gates
        shell: bash
        run: |
          set -euo pipefail
          cc -O3 -std=c11 -mavx2 -fno-fast-math -ffp-contract=off \
            -DQWEN_AVX2_EXACT_SELFTEST research/qwen38/gguf_quant_dot_avx2.c -lm \
            -o "$RUNNER_TEMP/qwen-avx2-selftest"
          "$RUNNER_TEMP/qwen-avx2-selftest"
          PYTHONPATH=research/qwen38 python -u research/qwen38/qwen38_k3_pair_reuse_probe.py sanity

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Runner CPU and storage information
        shell: bash
        run: |
          lscpu
          df -h
          free -h

      - name: Reclaim disk
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true
          docker system prune -af || true
          df -h
          free -h

      - name: Install download dependencies
        run: python -m pip install --no-cache-dir huggingface_hub hf_xet

      - name: Download pinned real GGUF once
        shell: bash
        run: |
          set -euo pipefail
          MODEL=$(python - <<'PY'
          from huggingface_hub import hf_hub_download
          print(hf_hub_download(
              "bartowski/Qwen3.8-27B-GGUF",
              filename="Qwen3.8-27B-Q6_K_L.gguf",
              local_dir="${{ runner.temp }}/qwen38-model",
          ))
          PY
          )
          test -f "$MODEL"
          echo "MODEL=$MODEL" >> "$GITHUB_ENV"
          echo "K3_WORK=$RUNNER_TEMP/qwen38-pair-reuse-k3" >> "$GITHUB_ENV"
          echo "EVIDENCE=$RUNNER_TEMP/qwen38-pair-reuse-evidence" >> "$GITHUB_ENV"

      - name: Validate pinned decoder inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          PYTHONPATH=research/qwen38 python -u research/qwen38/qwen35_gguf_decoder_contract.py real \
            --model "$MODEL" --output "$EVIDENCE/inventory.json" \
            2>&1 | tee "$EVIDENCE/inventory.log"

      - name: Compile exact target and recurrent-state bridges
        shell: bash
        run: |
          set -euo pipefail
          cc -O3 -std=c11 -mavx2 -fno-fast-math -ffp-contract=off -fPIC -shared \
            research/qwen38/gguf_quant_dot_avx2.c -lm \
            -o "$RUNNER_TEMP/libqwen_quant_avx2.so"
          cc -O2 -std=c11 -fPIC -shared research/qwen38/gdn_state_ar.c -lm \
            -o "$RUNNER_TEMP/libqwen_gdn_serial.so"

      - name: Run exact sequential-vs-pair K3 reuse probe
        timeout-minutes: 18
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$K3_WORK" "$EVIDENCE"
          PYTHONPATH=research/qwen38 python -u research/qwen38/qwen38_k3_pair_reuse_probe.py run \
            --model "$MODEL" \
            --native-lib "$RUNNER_TEMP/libqwen_quant_avx2.so" \
            --state-lib "$RUNNER_TEMP/libqwen_gdn_serial.so" \
            --inventory "$EVIDENCE/inventory.json" \
            --work-dir "$K3_WORK" \
            --output "$EVIDENCE/pair-reuse.json" \
            2>&1 | tee "$EVIDENCE/pair-reuse.log"
          grep -F "QWEN38_K3_PAIR_REUSE_EXACT_PASS" "$EVIDENCE/pair-reuse.log"

      - name: Require exact semantics and exact 2-to-1 K3 traffic
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads((Path(os.environ["EVIDENCE"])/"pair-reuse.json").read_text(encoding="utf-8"))
          assert r["status"] == "PASS"
          assert r["model_sha256"] == "a487690b9f17de581857c4ae484dab50800335bb9eb978a4fb02c0465629dc0a"
          assert r["prefix_token_ids"] == [12675, 11]
          assert r["pair_token_ids"] == [353, 2688]
          assert r["target_verify_token"] == 2688
          assert r["mtp_pair_accepted"] is True
          assert r["hidden_a_bitwise_exact"] is True
          assert r["hidden_b_bitwise_exact"] is True
          assert r["persistent_state_bitwise_exact"] is True
          assert r["sequential_final_state_sha256"] == r["pair_final_state_sha256"]
          assert r["pair_k3_bytes"] > 20_000_000_000
          assert r["sequential_k3_bytes"] == 2 * r["pair_k3_bytes"]
          assert r["k3_bytes_saved"] == r["pair_k3_bytes"]
          assert r["exact_two_to_one_k3_bytes"] is True
          assert r["reader"]["direct_io"] is True
          print("QWEN38_K3_PAIR_REUSE_REAL_GATE_PASS")
          print(json.dumps({
              "sequential_seconds": r["sequential_seconds"],
              "pair_seconds": r["pair_seconds"],
              "pair_speedup_vs_two_sequential_steps": r["pair_speedup_vs_two_sequential_steps"],
              "sequential_k3_bytes": r["sequential_k3_bytes"],
              "pair_k3_bytes": r["pair_k3_bytes"],
              "k3_bytes_saved": r["k3_bytes_saved"],
              "rollback_checkpoint_bytes": r["rollback_checkpoint_bytes"],
              "verify_lm_head_seconds": r["verify_lm_head_seconds"],
              "max_rss_gib": r["max_rss_gib"],
          }, indent=2))
          PY

      - name: Upload compact pair-reuse evidence
        uses: actions/upload-artifact@v4
        with:
          name: qwen38-k3-pair-reuse-${{ github.run_id }}
          path: ${{ runner.temp }}/qwen38-pair-reuse-evidence/
          retention-days: 14
