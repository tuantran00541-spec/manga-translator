name: One-shot parser-verified Python comment cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/python-inline-comment-cleanup-once.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove non-semantic Python comments
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo 'main moved after this cleanup run started; refusing stale rewrite'
            exit 1
          }

          python - <<'PY'
          from __future__ import annotations

          import ast
          import io
          import tokenize
          from pathlib import Path

          files = sorted(Path('app').rglob('*.py'))
          if Path('run.py').exists():
              files.append(Path('run.py'))

          keep_markers = (
              '#!', 'coding:', 'coding=', 'noqa', 'type:', 'nosec', 'fmt:',
              'pylint:', 'pyright:', 'mypy:', 'pragma:', 'isort:', 'ruff:',
              'coverage:', 'yapf:', 'flake8:', 'bandit:',
          )

          def keep_comment(text: str) -> bool:
              lowered = text.lower()
              return any(marker in lowered for marker in keep_markers)

          def ast_shape(source: str, filename: str) -> str:
              tree = ast.parse(source, filename=filename, type_comments=True)
              return ast.dump(tree, annotate_fields=True, include_attributes=False)

          total = 0
          changed: list[tuple[str, int]] = []

          for path in files:
              original = path.read_text(encoding='utf-8')
              before_ast = ast_shape(original, str(path))
              removals: list[tokenize.TokenInfo] = []
              for token in tokenize.generate_tokens(io.StringIO(original).readline):
                  if token.type == tokenize.COMMENT and not keep_comment(token.string):
                      removals.append(token)
              if not removals:
                  continue

              lines = original.splitlines(keepends=True)
              by_line: dict[int, list[tokenize.TokenInfo]] = {}
              for token in removals:
                  by_line.setdefault(token.start[0], []).append(token)

              for line_no, tokens in by_line.items():
                  index = line_no - 1
                  line = lines[index]
                  newline = ''
                  body = line
                  if line.endswith('\r\n'):
                      body, newline = line[:-2], '\r\n'
                  elif line.endswith('\n') or line.endswith('\r'):
                      body, newline = line[:-1], line[-1]
                  for token in sorted(tokens, key=lambda item: item.start[1], reverse=True):
                      start = token.start[1]
                      end = token.end[1]
                      body = body[:start] + body[end:]
                  body = body.rstrip(' \t')
                  lines[index] = body + newline

              cleaned = ''.join(lines)
              after_ast = ast_shape(cleaned, str(path))
              if before_ast != after_ast:
                  raise SystemExit(f'AST changed after comment cleanup: {path}')

              path.write_text(cleaned, encoding='utf-8')
              count = len(removals)
              total += count
              changed.append((str(path), count))

          print(f'Python files scanned: {len(files)}')
          print(f'Removed comments: {total}')
          for path, count in changed:
              print(f'  {path}: {count}')
          PY

          python -m compileall -q app run.py
          find app/static/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app run.py
          git rm .github/workflows/python-inline-comment-cleanup-once.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'refactor(py): remove non-semantic comments'
          git push origin HEAD:main
