name: Kiuyha yolo26s check

# One-off: score the stock yolo26s against stock yolo26n and our tuned model on the held-out checks.
on:
  push:
    branches-ignore: [main]
    paths:
      - ".github/workflows/kiuyha-26s-check.yml"

permissions:
  contents: write
  actions: read

env:
  OUT: audit-results/kiuyha-26s/run-${{ github.run_id }}
  PYTHONUNBUFFERED: "1"

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        pair: ["yolo26n.pt yolo26s.pt", "yolo26s.pt kiuyha-tuned.pt"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: kiuyha-data
          path: .
          run-id: 38535523379
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: kiuyha-tuned-all
          path: .
          run-id: 38715287486
          github-token: ${{ github.token }}
      - name: Install Ultralytics on CPU torch
        run: |
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "ultralytics==8.4.164"
      - name: Fetch the stock weights and the hard-case checks
        run: |
          curl -sSfL -o yolo26s.pt https://huggingface.co/Kiuyha/Manga-Bubble-YOLO/resolve/main/weights/yolo26s.pt
          python .github/kiuyha/fetch_hard.py kiuyha-data
          ls -la *.pt
      - name: Score
        id: score
        run: |
          set -- ${{ matrix.pair }}
          name="${1%.pt}-vs-${2%.pt}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          python .github/kiuyha/evaluate.py kiuyha-data "$OUT/$name" "$1" "$2"
      - name: Give git access only now
        if: always()
        env:
          TOKEN: ${{ github.token }}
        run: |
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
      - uses: ./.github/actions/save-evidence
        if: always()
        with:
          paths: ${{ env.OUT }}/${{ steps.score.outputs.name }}
          message: "audit: Kiuyha yolo26s check (${{ steps.score.outputs.name }}, run ${{ github.run_id }})"
