name: ONNX input surgery probe

on:
  push:
    branches:
      - release/onnx-input-surgery-probe
    paths:
      - scripts/onnx_input_surgery_probe.py
      - scripts/onnx_head_shape_probe.py
      - scripts/onnx_head_patch_probe.py
      - .github/workflows/onnx-input-surgery-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install probe runtime
        run: |
          python -m pip install numpy==1.26.4 onnx==1.17.0 onnxruntime-openvino==1.24.1

      - name: Restore benchmark models
        id: models
        uses: actions/cache@v4
        with:
          path: |
            models/*.onnx
            models/.e2e-provenance.json
          key: processing-profile-models-b224548-v1

      - name: Read pinned model provisioner
        if: steps.models.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          ref: b22454827f8190655d7070b80eb20c2550beadfa
          path: benchmark-bootstrap
          sparse-checkout: scripts/provision_real_e2e_models.py
          sparse-checkout-cone-mode: false

      - name: Provision text segmenter if cache missed
        if: steps.models.outputs.cache-hit != 'true'
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple torch==2.5.1+cpu torchvision==0.20.1+cpu
          python -m pip install --no-deps ultralytics==8.3.221 onnxslim==0.1.71
          python -m pip install sympy==1.13.1 PyYAML==6.0.2 scipy==1.14.1 tqdm==4.67.1 matplotlib==3.9.2 pandas==2.2.3 py-cpuinfo==9.0.0 ml_dtypes==0.5.3 colorama==0.4.6 polars==1.33.1 ultralytics-thop==2.0.17
          python benchmark-bootstrap/scripts/provision_real_e2e_models.py
          cp benchmark-bootstrap/models/text_segmenter.onnx models/

      - name: Inspect baked detector-head shapes
        run: |
          python scripts/onnx_head_shape_probe.py

      - name: Probe declared 1024 to 640 and 512 surgery
        run: |
          python scripts/onnx_input_surgery_probe.py --sizes 1024 640 512 --repeats 2

      - name: Probe regenerated YOLO head at 640 and 512
        run: |
          python scripts/onnx_head_patch_probe.py --sizes 640 512 --repeats 3

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: onnx-input-surgery-${{ github.run_id }}
          path: |
            benchmark-results/onnx-surgery/report.json
            benchmark-results/onnx-surgery/head-shapes.json
            benchmark-results/onnx-surgery/head-patch-report.json
          retention-days: 3
          if-no-files-found: error
