name: phase43-sonar-diagnostic

on:
  push:
    branches:
      - phase-4-3-visual-qc-core

jobs:
  sonar-findings:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Query public SonarQube Cloud PR findings
        env:
          SONAR_PROJECT: tuantran00541-spec_manga-translator
          SONAR_PR: "7"
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          base = "https://sonarcloud.io/api/issues/search"
          query = urllib.parse.urlencode({
              "componentKeys": os.environ["SONAR_PROJECT"],
              "pullRequest": os.environ["SONAR_PR"],
              "resolved": "false",
              "ps": "100",
          })
          with urllib.request.urlopen(base + "?" + query, timeout=20) as response:
              payload = json.load(response)

          findings = []
          for issue in payload.get("issues", []):
              impacts = issue.get("impacts") or []
              security = issue.get("type") == "VULNERABILITY" or any(
                  impact.get("softwareQuality") == "SECURITY" for impact in impacts
              )
              if not security:
                  continue
              findings.append({
                  "key": issue.get("key"),
                  "rule": issue.get("rule"),
                  "severity": issue.get("severity"),
                  "type": issue.get("type"),
                  "component": issue.get("component"),
                  "line": issue.get("line"),
                  "message": issue.get("message"),
                  "impacts": impacts,
                  "flows": issue.get("flows"),
              })
          print(json.dumps({"total": len(findings), "findings": findings}, indent=2))
          PY
