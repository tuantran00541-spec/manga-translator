name: Agent sits the slide exam again

# One-off: the exam alone, on what the seven-day run 37553875857 left, once Agnes's daily quota is back.
on:
  push:
    branches-ignore: [main]
    paths:
      - ".github/workflows/agent-exam.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  AGENT_BASE: https://apihub.agnes-ai.com/v1
  AGENT_MODEL: agnes-3.0-flash
  AGENT_LABEL: Agnes

jobs:
  exam:
    runs-on: ubuntu-22.04
    timeout-minutes: 355
    env:
      OUT: audit-results/agent-evolve/exam
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -q -r requirements-test.txt python-pptx pillow
          sudo apt-get update -q > /dev/null
          sudo apt-get install -y -q --no-install-recommends libreoffice-impress poppler-utils fonts-dejavu > /dev/null
      - uses: actions/download-artifact@v4
        with:
          name: agent-state
          path: /tmp/state
          run-id: 37553875857
          github-token: ${{ github.token }}
      - name: Restore what the agent made
        run: |
          tar xzf /tmp/state/work.tgz
          tar xzf /tmp/state/home.tgz -C "$HOME"
          ls deck-lab | head; ls .mcp.json "$HOME/.manga-agent/plugins"
      - name: Wait for the daily quota
        env:
          AGENT_API_KEY: ${{ secrets.Agnes_key }}
        run: python -u .github/agent-evolve/wait_quota.py 240
      - name: Exam with only the MCP server
        env:
          AGENT_API_KEY: ${{ secrets.Agnes_key }}
          TINYFISH_API_KEY: ${{ secrets.TINYFISH }}
          TAVILY_API_KEY: ${{ secrets.TAVILY }}
        run: |
          [ -n "$AGENT_API_KEY" ] || { echo "::error::secret Agnes_key is not set"; exit 1; }
          python -u .github/agent-evolve/drive.py exam "$OUT" 2>&1 || true
      - name: Keep the exam deck and its pictures
        if: always()
        run: |
          mkdir -p "$OUT/final" "$OUT/previews"
          cp -r final/. "$OUT/final/" 2>/dev/null || true
          for deck in final/*.pptx; do
            [ -f "$deck" ] || continue
            timeout 120 soffice -env:UserInstallation=file:///tmp/lo_ci --headless --convert-to pdf --outdir /tmp/pdf "$deck" > /dev/null 2>&1 || continue
            pdftoppm -png -r 50 "/tmp/pdf/$(basename "${deck%.pptx}").pdf" "$OUT/previews/$(basename "${deck%.pptx}")" || true
          done
          ls "$OUT/previews" || true
      - name: Give git access only now that the agent is done
        if: always()
        env:
          TOKEN: ${{ github.token }}
        run: |
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
      - uses: ./.github/actions/save-evidence
        if: always()
        with:
          paths: audit-results/agent-evolve/exam
          message: "audit: Agent sits the slide exam again (run ${{ github.run_id }})"
