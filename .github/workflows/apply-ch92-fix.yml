name: Apply chapter 92 fix patch

on:
  push:
    branches:
      - fix/chapter92-acceptance
    paths:
      - .github/ch92-fix.patch.gz.b64

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/chapter92-acceptance
          fetch-depth: 1
      - name: Apply audited local patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/ch92-fix.patch.gz.b64 | gzip -d > /tmp/ch92-fix.patch
          git apply --check /tmp/ch92-fix.patch
          git apply /tmp/ch92-fix.patch
          rm .github/ch92-fix.patch.gz.b64
          rm .github/workflows/apply-ch92-fix.yml
      - name: Commit feature changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix chapter 92 downloader and safety blockers"
          git push origin HEAD:fix/chapter92-acceptance
