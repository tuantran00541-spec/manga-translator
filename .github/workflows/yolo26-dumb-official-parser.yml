name: YOLO26 dumb official-parser A/B

on:
  workflow_dispatch:
  push:
    branches: ["experiment/one-shot-yolo26"]
    paths:
      - .github/workflows/yolo26-dumb-official-parser.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: yolo26-dumb-official-parser
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      PYTHONUNBUFFERED: "1"
      CHAPTER_URL: "https://asurascans.com/comics/shadow-slave-6f7fe6eb/chapter/1"
      ROOT: "benchmark-results/yolo26-dumb"
      RAW_DIR: "benchmark-results/yolo26-dumb/raw"
      SLICE_DIR: "benchmark-results/yolo26-dumb/slices"
      STUDENT_DIR: "benchmark-results/yolo26-dumb/student"
      MANGA_ORT_PROVIDER: cpu

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install only runtime dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple torch==2.8.0+cpu torchvision==0.23.0+cpu
          python -m pip install ultralytics==8.4.156 onnxruntime==1.24.1
          python -m pip install numpy==1.26.4 Pillow==10.4.0 opencv-contrib-python==4.10.0.84 psutil==6.1.1 loguru==0.7.2 requests==2.32.3 beautifulsoup4==4.12.3 lxml==5.3.0 playwright==1.47.0 fastapi==0.115.0 pydantic==2.9.2 filelock==3.16.1 threadpoolctl==3.6.0

      - name: Restore teacher model
        id: models
        uses: actions/cache@v4
        with:
          path: |
            models/*.onnx
            models/.e2e-provenance.json
          key: processing-profile-models-b224548-v1

      - name: Read pinned teacher provisioner
        if: ${{ steps.models.outputs.cache-hit != 'true' }}
        uses: actions/checkout@v4
        with:
          ref: b22454827f8190655d7070b80eb20c2550beadfa
          path: benchmark-bootstrap
          sparse-checkout: scripts/provision_real_e2e_models.py
          sparse-checkout-cone-mode: false

      - name: Provision teacher on cache miss
        if: ${{ steps.models.outputs.cache-hit != 'true' }}
        run: |
          python benchmark-bootstrap/scripts/provision_real_e2e_models.py
          cp benchmark-bootstrap/models/*.onnx models/
          cp benchmark-bootstrap/models/.e2e-provenance.json models/

      - name: Download frozen YOLO26 checkpoint from previous artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$STUDENT_DIR"
          gh run download 35516657301             --repo "$GITHUB_REPOSITORY"             --name yolo26-text-distill             --dir "$STUDENT_DIR"
          test -f "$STUDENT_DIR/yolo26-text-seg.onnx"
          ls -lh "$STUDENT_DIR/yolo26-text-seg.onnx"

      - name: Download and slice chapter
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from app.downloader.registry import download_chapter
          from app.downloader.slicer import slice_image

          raw = Path(os.environ["RAW_DIR"])
          slc = Path(os.environ["SLICE_DIR"])
          raw.mkdir(parents=True, exist_ok=True)
          slc.mkdir(parents=True, exist_ok=True)

          paths = download_chapter(os.environ["CHAPTER_URL"], raw)
          slices = []
          for i, path in enumerate(sorted(paths)):
              recs = slice_image(path, slc, f"{i:03d}", return_metadata=True)
              slices.extend(Path(r["path"]) for r in recs)

          print("raw_images", len(paths))
          print("slices", len(slices))
          if len(slices) != 135:
              print("warning: expected 135 slices, got", len(slices))
          PY

      - name: Dumb threshold sweep using official Ultralytics parser
        run: |
          python - <<'PY'
          import json
          import os
          import statistics
          import time
          from pathlib import Path

          import cv2
          import numpy as np
          from ultralytics import YOLO

          from app.detector.mask_builder import build_mask
          from app.image_io import read_image
          from app.one_shot_cleanup import OneShotTextMaskDetector

          root = Path(os.environ["ROOT"])
          slices = sorted(Path(os.environ["SLICE_DIR"]).glob("*.png"))
          model_path = Path(os.environ["STUDENT_DIR"]) / "yolo26-text-seg.onnx"
          thresholds = [0.005, 0.01, 0.015, 0.02]

          teacher = OneShotTextMaskDetector()
          student = YOLO(str(model_path), task="segment")

          teacher_masks = []
          teacher_times = []
          teacher_pixels = 0

          print("building teacher reference", len(slices))
          for idx, path in enumerate(slices):
              image = read_image(path)
              t0 = time.perf_counter()
              boxes, metrics = teacher.detect(image)
              teacher_times.append((time.perf_counter() - t0) * 1000.0)
              mask = (
                  build_mask(image.shape[:2], boxes, image)
                  if boxes else np.zeros(image.shape[:2], np.uint8)
              )
              teacher_masks.append(mask > 127)
              teacher_pixels += int(np.count_nonzero(mask > 127))
              if idx % 20 == 0:
                  print("teacher", idx, path.name, "boxes", len(boxes), "pixels", int(np.count_nonzero(mask > 127)))

          rows = []
          for conf in thresholds:
              inter_total = 0
              union_total = 0
              student_pixels = 0
              per_slice = []
              student_times = []
              zero_slices = 0
              giant_slices = 0

              for idx, path in enumerate(slices):
                  image = read_image(path)
                  h, w = image.shape[:2]

                  t0 = time.perf_counter()
                  result = student.predict(
                      source=str(path),
                      imgsz=1024,
                      conf=conf,
                      iou=0.7,
                      device="cpu",
                      verbose=False,
                      retina_masks=True,
                      max_det=300,
                  )[0]
                  student_times.append((time.perf_counter() - t0) * 1000.0)

                  smask = np.zeros((h, w), dtype=np.uint8)
                  if result.masks is not None and len(result.masks.data):
                      arr = result.masks.data.detach().cpu().numpy()
                      union = np.any(arr > 0.5, axis=0).astype(np.uint8) * 255
                      if union.shape != (h, w):
                          union = cv2.resize(union, (w, h), interpolation=cv2.INTER_NEAREST)
                      smask = union

                  sa = smask > 127
                  ta = teacher_masks[idx]
                  sp = int(np.count_nonzero(sa))
                  tp = int(np.count_nonzero(ta))
                  inter = int(np.count_nonzero(sa & ta))
                  union_px = int(np.count_nonzero(sa | ta))

                  student_pixels += sp
                  inter_total += inter
                  union_total += union_px
                  if sp == 0:
                      zero_slices += 1
                  if sp > int(0.35 * h * w):
                      giant_slices += 1

                  per_slice.append({
                      "index": idx,
                      "file": path.name,
                      "teacher_pixels": tp,
                      "student_pixels": sp,
                      "intersection": inter,
                      "union": union_px,
                      "pixel_recall": inter / max(1, tp),
                      "pixel_precision": inter / max(1, sp),
                      "pixel_iou": inter / max(1, union_px),
                      "detections": 0 if result.boxes is None else len(result.boxes),
                  })

              recall = inter_total / max(1, teacher_pixels)
              precision = inter_total / max(1, student_pixels)
              iou = inter_total / max(1, union_total)
              row = {
                  "conf": conf,
                  "slice_count": len(slices),
                  "teacher_pixels": teacher_pixels,
                  "student_pixels": student_pixels,
                  "intersection_pixels": inter_total,
                  "union_pixels": union_total,
                  "pixel_recall_vs_teacher": recall,
                  "pixel_precision_vs_teacher": precision,
                  "pixel_iou_vs_teacher": iou,
                  "zero_student_slices": zero_slices,
                  "giant_mask_slices_gt35pct": giant_slices,
                  "student_median_ms": statistics.median(student_times),
                  "student_p95_ms": sorted(student_times)[int(0.95 * (len(student_times)-1))],
                  "slice_000": per_slice[0],
                  "per_slice": per_slice,
              }
              rows.append(row)
              print(json.dumps({k:v for k,v in row.items() if k != "per_slice"}, indent=2))

          best = max(
              rows,
              key=lambda r: (
                  r["pixel_recall_vs_teacher"]
                  if r["giant_mask_slices_gt35pct"] == 0 else -1.0,
                  r["pixel_precision_vs_teacher"],
              ),
          )

          report = {
              "model": str(model_path),
              "weights_frozen": True,
              "training_this_run": False,
              "parser": "Ultralytics official ONNX segmentation parser",
              "thresholds": thresholds,
              "teacher_median_ms": statistics.median(teacher_times),
              "rows": rows,
              "best_conf_by_recall_without_giant_masks": best["conf"],
          }
          (root / "official-parser-sweep.json").write_text(json.dumps(report, indent=2) + "\n")

          print("BEST")
          print(json.dumps({
              "conf": best["conf"],
              "recall": best["pixel_recall_vs_teacher"],
              "precision": best["pixel_precision_vs_teacher"],
              "iou": best["pixel_iou_vs_teacher"],
              "student_median_ms": best["student_median_ms"],
              "student_p95_ms": best["student_p95_ms"],
              "zero_slices": best["zero_student_slices"],
              "giant_slices": best["giant_mask_slices_gt35pct"],
              "slice_000": best["slice_000"],
          }, indent=2))

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("## YOLO26 dumb official-parser sweep\n\n")
              f.write("No training. Frozen checkpoint. Official Ultralytics parser only.\n\n")
              f.write(f"- teacher median: {statistics.median(teacher_times):.2f} ms\n")
              f.write(f"- best conf: {best['conf']}\n")
              f.write(f"- recall vs teacher: {best['pixel_recall_vs_teacher']:.4f}\n")
              f.write(f"- precision vs teacher: {best['pixel_precision_vs_teacher']:.4f}\n")
              f.write(f"- IoU vs teacher: {best['pixel_iou_vs_teacher']:.4f}\n")
              f.write(f"- student median: {best['student_median_ms']:.2f} ms\n")
              f.write(f"- student p95: {best['student_p95_ms']:.2f} ms\n")
              f.write(f"- zero slices: {best['zero_student_slices']}\n")
              f.write(f"- giant-mask slices: {best['giant_mask_slices_gt35pct']}\n")
              f.write(f"- slice 000 student pixels: {best['slice_000']['student_pixels']}\n")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yolo26-dumb-official-parser
          path: benchmark-results/yolo26-dumb/official-parser-sweep.json
          retention-days: 7
