name: Chapter 351 Checkpoint 03 OCR Review

on:
  push:
    branches:
      - chapter/logging-10000-years-into-the-future-351
    paths:
      - .github/workflows/chapter-351-ocr-review.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: chapter-351-human-loop
  cancel-in-progress: false

jobs:
  ocr-from-raw:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: ${{ github.workspace }}
      GH_TOKEN: ${{ github.token }}
      CHAPTER_ID: c3513510
      IMPORT_RUN_ID: "34700742617"
      IMPORT_ARTIFACT: 01-import-c3513510
      CLEAN_RUN_ID: "34700955145"
      CLEAN_ARTIFACT: 02-clean-review-c3513510
      REPAIR_RUN_ID: "34702416332"
      REPAIR_ARTIFACT: 02b-clean-local-repair-c3513510
      STATE_DIR: chapters/logging-10000-years-into-the-future-351
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
      MANGA_PPOCRV6_TIER: small
      MANGA_OCR_TARGET_SELECTION: all
      MANGA_PPOCRV6_TEXTLINE_ORIENTATION: "0"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "2"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: chapter/logging-10000-years-into-the-future-351

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install production OCR runtime
        run: |
          python -m pip install --only-binary=:all: \
            numpy==1.26.4 \
            Pillow==10.4.0 \
            opencv-contrib-python==4.10.0.84 \
            paddlepaddle==3.2.2 \
            paddleocr==3.7.0 \
            onnxruntime-openvino==1.24.1 \
            psutil==6.1.1 \
            loguru==0.7.2 \
            requests==2.32.3 \
            beautifulsoup4==4.12.3 \
            lxml==5.3.0 \
            playwright==1.47.0 \
            fastapi==0.115.0 \
            pydantic==2.9.2 \
            filelock==3.16.1 \
            python-multipart==0.0.12

      - name: Restore Paddle model cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.paddlex
            ~/.paddleocr
          key: chapter-trial-ppocrv6-small-en-v1

      - name: Restore approved checkpoints
        run: |
          rm -rf checkpoint/01-import checkpoint/02-clean checkpoint/02b-repair checkpoint/03-ocr-review
          mkdir -p checkpoint/01-import checkpoint/02-clean checkpoint/02b-repair checkpoint/03-ocr-review
          gh run download "$IMPORT_RUN_ID" -n "$IMPORT_ARTIFACT" -D checkpoint/01-import
          gh run download "$CLEAN_RUN_ID" -n "$CLEAN_ARTIFACT" -D checkpoint/02-clean
          gh run download "$REPAIR_RUN_ID" -n "$REPAIR_ARTIFACT" -D checkpoint/02b-repair
          test -f checkpoint/01-import/manifest.json
          test -d checkpoint/01-import/raw/sliced
          test -f checkpoint/02-clean/processed/manifest.json
          test -f checkpoint/02b-repair/clean-repair.json
          test -f "$STATE_DIR/clean-review.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          review=json.loads((Path(os.environ['STATE_DIR'])/'clean-review.json').read_text(encoding='utf-8'))
          human=review.get('human_review') or {}
          repair=json.loads(Path('checkpoint/02b-repair/clean-repair.json').read_text(encoding='utf-8'))
          if review.get('status')!='PASS' or not review.get('editorial_pass'):
              raise SystemExit(f'CLEAN gate not approved: {review.get("status")}')
          if human.get('story_text_blockers')!=0 or human.get('artwork_damage_blockers')!=0 or human.get('source_story_residue_blockers')!=0:
              raise SystemExit(f'CLEAN blockers remain: {human}')
          if len(repair.get('drop_from_story_object_ids') or [])!=8:
              raise SystemExit('expected eight durable non-story tombstone seeds')
          for item in repair.get('repairs') or []:
              if item.get('raw_vs_repaired_pixel_diff',0)!=0 or item.get('raw_tail_pixel_diff',0)!=0 or item.get('base_story_area_pixel_diff',0)!=0:
                  raise SystemExit(f'local repair proof is not pixel-exact: {item}')
          print('approved CLEAN stack verified')
          PY

      - name: Validate OCR helper syntax
        run: python -m py_compile "$STATE_DIR/run_ocr_review.py"

      - name: Run production OCR from RAW and build human review pack
        run: |
          python "$STATE_DIR/run_ocr_review.py" \
            --chapter-id "$CHAPTER_ID" \
            --import-root checkpoint/01-import \
            --clean-root checkpoint/02-clean \
            --repair-root checkpoint/02b-repair \
            --output checkpoint/03-ocr-review \
            --lang en

      - name: Verify OCR checkpoint contract
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('checkpoint/03-ocr-review')
          summary=json.loads((root/'ocr-review-summary.json').read_text(encoding='utf-8'))
          if summary.get('ocr_source')!='RAW' or not summary.get('ocr_source_invariant_verified'):
              raise SystemExit('OCR did not prove RAW source invariant')
          if summary.get('failed')!=0:
              raise SystemExit(f"OCR failures remain: {summary.get('failed')}")
          if summary.get('resurrection_count')!=0:
              raise SystemExit(f"tombstone resurrection: {summary.get('resurrection_count')}")
          if len(summary.get('seeded_non_story_tombstones') or [])!=8:
              raise SystemExit('expected eight non-story tombstones')
          if summary.get('status')!='REVIEW_REQUIRED':
              raise SystemExit('checkpoint must stop for human OCR review')
          print(json.dumps(summary,indent=2))
          PY

      - name: Upload checkpoint 03 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 03-ocr-review-c3513510
          path: checkpoint/03-ocr-review/
          retention-days: 7
          if-no-files-found: warn
