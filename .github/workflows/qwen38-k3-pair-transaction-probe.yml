name: Qwen3.8 transactional two-position K3 rollback gate

on:
  push:
    branches: [research/qwen3.8-27b-runtime-finish]
    paths:
      - "research/qwen38/qwen38_k3_pair_transaction_probe.py"
      - ".github/workflows/qwen38-k3-pair-transaction-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  HF_HUB_DISABLE_TELEMETRY: "1"

jobs:
  pair-transaction:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[qwen-pair-tx]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Exact kernel and transactional sanity gates
        shell: bash
        run: |
          set -euo pipefail
          cc -O3 -std=c11 -mavx2 -fno-fast-math -ffp-contract=off \
            -DQWEN_AVX2_EXACT_SELFTEST research/qwen38/gguf_quant_dot_avx2.c -lm \
            -o "$RUNNER_TEMP/qwen-avx2-selftest"
          "$RUNNER_TEMP/qwen-avx2-selftest"
          PYTHONPATH=research/qwen38 python -u research/qwen38/qwen38_k3_pair_transaction_probe.py sanity

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Runner CPU and storage information
        shell: bash
        run: |
          lscpu
          df -h
          free -h

      - name: Reclaim disk
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true
          docker system prune -af || true
          df -h
          free -h

      - name: Install download dependencies
        run: python -m pip install --no-cache-dir huggingface_hub hf_xet

      - name: Download pinned real GGUF once
        shell: bash
        run: |
          set -euo pipefail
          MODEL=$(python - <<'PY'
          from huggingface_hub import hf_hub_download
          print(hf_hub_download(
              "bartowski/Qwen3.8-27B-GGUF",
              filename="Qwen3.8-27B-Q6_K_L.gguf",
              local_dir="${{ runner.temp }}/qwen38-model",
          ))
          PY
          )
          test -f "$MODEL"
          echo "MODEL=$MODEL" >> "$GITHUB_ENV"
          echo "K3_WORK=$RUNNER_TEMP/qwen38-pair-tx-k3" >> "$GITHUB_ENV"
          echo "EVIDENCE=$RUNNER_TEMP/qwen38-pair-tx-evidence" >> "$GITHUB_ENV"

      - name: Validate pinned decoder inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          PYTHONPATH=research/qwen38 python -u research/qwen38/qwen35_gguf_decoder_contract.py real \
            --model "$MODEL" --output "$EVIDENCE/inventory.json" \
            2>&1 | tee "$EVIDENCE/inventory.log"

      - name: Compile exact target and recurrent-state bridges
        shell: bash
        run: |
          set -euo pipefail
          cc -O3 -std=c11 -mavx2 -fno-fast-math -ffp-contract=off -fPIC -shared \
            research/qwen38/gguf_quant_dot_avx2.c -lm \
            -o "$RUNNER_TEMP/libqwen_quant_avx2.so"
          cc -O2 -std=c11 -fPIC -shared research/qwen38/gdn_state_ar.c -lm \
            -o "$RUNNER_TEMP/libqwen_gdn_serial.so"

      - name: Run exact miss rollback and accepted commit probe
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$K3_WORK" "$EVIDENCE"
          PYTHONPATH=research/qwen38 python -u research/qwen38/qwen38_k3_pair_transaction_probe.py run \
            --model "$MODEL" \
            --native-lib "$RUNNER_TEMP/libqwen_quant_avx2.so" \
            --state-lib "$RUNNER_TEMP/libqwen_gdn_serial.so" \
            --inventory "$EVIDENCE/inventory.json" \
            --work-dir "$K3_WORK" \
            --output "$EVIDENCE/pair-transaction.json" \
            2>&1 | tee "$EVIDENCE/pair-transaction.log"
          grep -F "QWEN38_K3_PAIR_TRANSACTION_EXACT_PASS" "$EVIDENCE/pair-transaction.log"

      - name: Require exact miss rollback and accepted commit semantics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads((Path(os.environ["EVIDENCE"])/"pair-transaction.json").read_text(encoding="utf-8"))
          assert r["status"] == "PASS"
          assert r["model_sha256"] == "a487690b9f17de581857c4ae484dab50800335bb9eb978a4fb02c0465629dc0a"

          miss=r["miss"]
          assert [miss["a"], miss["draft_b"], miss["target_verify"]] == [11, 1092, 353]
          assert miss["candidate_rejected"] is True
          assert miss["hidden_a_bitwise_exact"] is True
          assert miss["rollback_state_bitwise_exact"] is True
          assert miss["rollback_state_mismatch"] is None
          assert miss["after_a_state_sha256"] == miss["rollback_state_sha256"]
          assert miss["pair_k3_bytes"] == miss["ordinary_a_k3_bytes"]
          assert miss["pair_k3_bytes"] > 20_000_000_000
          assert miss["checkpoint_logical_bytes"] > 150_000_000
          assert miss["rollback_seconds"] >= 0.0

          acc=r["accept"]
          assert [acc["a"], acc["draft_b"], acc["target_verify"]] == [353, 2688, 2688]
          assert acc["candidate_accepted"] is True
          assert acc["hidden_a_bitwise_exact"] is True
          assert acc["hidden_b_bitwise_exact"] is True
          assert acc["final_state_bitwise_exact"] is True
          assert acc["final_state_mismatch"] is None
          assert acc["sequential_final_state_sha256"] == acc["pair_final_state_sha256"]
          assert acc["sequential_k3_bytes"] == 2 * acc["pair_k3_bytes"]
          assert acc["k3_bytes_saved"] == acc["pair_k3_bytes"]
          assert acc["pair_k3_bytes"] > 20_000_000_000
          assert r["reader"]["direct_io"] is True

          print("QWEN38_K3_PAIR_TRANSACTION_REAL_GATE_PASS")
          print(json.dumps({
              "miss": {
                  "draft": miss["draft_b"],
                  "verify": miss["target_verify"],
                  "ordinary_a_seconds": miss["ordinary_a_seconds"],
                  "pair_seconds": miss["pair_seconds"],
                  "ordinary_a_k3_bytes": miss["ordinary_a_k3_bytes"],
                  "pair_k3_bytes": miss["pair_k3_bytes"],
                  "checkpoint_logical_bytes": miss["checkpoint_logical_bytes"],
                  "checkpoint_copy_seconds": miss["checkpoint_copy_seconds"],
                  "rollback_seconds": miss["rollback_seconds"],
              },
              "accept": {
                  "draft": acc["draft_b"],
                  "verify": acc["target_verify"],
                  "sequential_seconds": acc["sequential_seconds"],
                  "pair_seconds": acc["pair_seconds"],
                  "speedup": acc["pair_speedup_vs_two_sequential_steps"],
                  "sequential_k3_bytes": acc["sequential_k3_bytes"],
                  "pair_k3_bytes": acc["pair_k3_bytes"],
                  "checkpoint_logical_bytes": acc["checkpoint_logical_bytes"],
                  "checkpoint_copy_seconds": acc["checkpoint_copy_seconds"],
              },
              "max_rss_gib": r["max_rss_gib"],
          }, indent=2))
          PY

      - name: Upload compact transaction evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: qwen38-k3-pair-transaction-${{ github.run_id }}
          path: ${{ runner.temp }}/qwen38-pair-tx-evidence/
          retention-days: 14
