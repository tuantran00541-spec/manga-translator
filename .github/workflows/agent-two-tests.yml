name: Agent two tests

# One-off: two simple tests on PolarGrid Qwen: audit this project's backend and frontend, and build a small project from nothing.
on:
  push:
    branches-ignore: [main]
    paths:
      - ".github/workflows/agent-two-tests.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        scenario: [audit, scratch]
    runs-on: ubuntu-22.04
    timeout-minutes: 130
    env:
      OUT: audit-results/agent-two-tests/polargrid-${{ matrix.scenario }}
      WORK: /tmp/agent-work
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q -r requirements-test.txt

      - name: Prepare the project the agent works in
        run: |
          mkdir -p "$OUT" "$WORK/project" "$HOME/.manga-agent"
          # Bounded: at most 12M tokens (cached ones not counted) and 300 steps per turn.
          echo '{"token_budget": 12000000, "max_steps": 300}' > "$HOME/.manga-agent/profile.json"
          if [ "${{ matrix.scenario }}" = audit ]; then
            # A copy without .git, so the agent never sees repository credentials.
            tar --exclude=.git --exclude=audit-results -cf - . | tar -xf - -C "$WORK/project"
          fi

      - name: Run the test
        env:
          AGENT_API_KEY: ${{ secrets.polagrid_ }}
        run: |
          if [ "${{ matrix.scenario }}" = audit ]; then
            SANDBOX=read-only
            PROMPT='Audit toàn bộ code backend (thư mục app, Python) và frontend (app/static và app/templates) của dự án manga-translator này. Chia việc cho nhiều agent con chạy song song theo từng vùng code, đọc kỹ code thật rồi tìm lỗi thật: bug logic, lỗ hổng bảo mật, race condition, xử lý lỗi thiếu, code chết, chỗ frontend gọi API không khớp backend. Mỗi phát hiện ghi mức độ, file:dòng, mô tả và cách sửa. Chỉ nêu những gì bạn đã đọc thấy trong code, không đoán. Cuối cùng tổng hợp một báo cáo xếp theo mức độ.'
          else
            SANDBOX=workspace-write
            PROMPT='Hãy tạo từ con số 0 một dự án Python nhỏ tên notekeeper: ứng dụng dòng lệnh quản lý ghi chú (thêm, liệt kê, tìm, xóa, gắn tag), lưu bằng file JSON. Có pyproject.toml, bố cục src, test pytest đầy đủ và README. Dùng nhiều agent con chạy song song khi hợp lý, ví dụ một agent viết phần lưu trữ, một agent viết CLI, một agent viết test. Chạy test cho đến khi xanh hết rồi báo cáo.'
          fi
          python -m app.agent.cli exec "$PROMPT" --base "https://api.mia-01.edge.polargrid.ai/v1" --model "qwen-3.8-27b" \
            --provider polargrid --workspace "$WORK/project" --mode auto --sandbox "$SANDBOX" \
            --timeout-min 100 --json > "$OUT/events.jsonl" 2> "$OUT/stderr.log" || true
          tail -c 600 "$OUT/stderr.log"

      - name: Summarize what happened
        if: always()
        run: |
          python - <<'PY'
          import json, os
          out = os.environ["OUT"]
          rows = []
          for line in open(f"{out}/events.jsonl", encoding="utf-8"):
              try:
                  rows.append(json.loads(line))
              except ValueError:
                  pass
          tools = [r["name"] for r in rows if r.get("type") == "tool"]
          result = next((r for r in reversed(rows) if r.get("type") == "result"), {})
          final = next((r["text"] for r in reversed(rows) if r.get("type") == "assistant" and r.get("text")), "")
          summary = {"status": result.get("status"), "usage": result.get("usage"), "stats": result.get("stats"),
                     "steps": sum(r.get("type") == "assistant" for r in rows), "tool_counts": {n: tools.count(n) for n in sorted(set(tools))},
                     "failed_tools": [(r["name"], r["output"][:140]) for r in rows if r.get("type") == "tool" and not r.get("ok")][:30],
                     "helpers_started": sum(1 for r in rows if r.get("type") == "subagent" and r.get("state") == "started"),
                     "errors": [r["text"][:200] for r in rows if r.get("type") == "error"],
                     "notices": [r["text"][:160] for r in rows if r.get("type") == "notice"][:40]}
          open(f"{out}/summary.json", "w", encoding="utf-8").write(json.dumps(summary, ensure_ascii=False, indent=1))
          open(f"{out}/answer.md", "w", encoding="utf-8").write(final)
          print(json.dumps({k: v for k, v in summary.items() if k not in ("notices", "failed_tools")}, ensure_ascii=False))
          PY

      - name: Check the project the agent built
        if: matrix.scenario == 'scratch'
        run: |
          cd "$WORK/project"
          find . -type f -not -path './.git/*' -not -path '*/__pycache__/*' | sort | tee "$GITHUB_WORKSPACE/$OUT/files.txt" | head -40
          (python -m pip install -q -e . pytest && python -m pytest -q -p no:cacheprovider 2>&1 | tail -15) | tee "$GITHUB_WORKSPACE/$OUT/project-pytest.txt" || true

      - name: Give git access only now that the agents are done
        if: always()
        env:
          TOKEN: ${{ github.token }}
        run: |
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"

      - name: Save evidence to audit-evidence
        if: always()
        uses: ./.github/actions/save-evidence
        with:
          paths: audit-results/agent-two-tests/polargrid-${{ matrix.scenario }}
          message: "audit: Agent two tests polargrid ${{ matrix.scenario }} (run ${{ github.run_id }})"
