name: Apply chapter 92 pipeline context patch

on:
  push:
    branches:
      - fix/chapter-92-acceptance
    paths:
      - .github/workflows/apply-ch92-pipeline.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/chapter-92-acceptance
          fetch-depth: 1
      - name: Apply validated pipeline patch
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/pipeline.patch
          git apply --check /tmp/pipeline.patch
          git apply /tmp/pipeline.patch
          python -m compileall -q app tests
          git diff --check
      - name: Commit and self-remove bootstrap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-ch92-pipeline.yml
          git add app/pipeline.py
          git commit -m "fix: protect Asura final source tail context"
          git push origin HEAD:fix/chapter-92-acceptance
