name: CPU detector probe

# Probe ONLY: benchmark CPU-runnable text detectors on GitHub runners.
# No pipeline change, no deploy, no training. Triggered by pushing this file
# (workflow_dispatch on a branch-only workflow 404s via the API, so push is
# the reliable trigger — same lesson as the bubble-harvest workflow).
# This workflow's only trigger path is its own file, so pushing it cannot
# retrigger kiuyha-train.yml / kiuyha-train-s.yml / kiuyha-train-ns.yml.

on:
  push:
    branches-ignore: [main]
    paths:
      - ".github/workflows/cpu-detector-probe.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install light deps
        run: |
          python -m pip install --upgrade pip
          pip install onnxruntime numpy opencv-python-headless Pillow pyclipper shapely

      - name: Record runner specs
        run: |
          mkdir -p probe-results
          {
            echo "runner: ubuntu-latest (GitHub-hosted)"
            echo "nproc: $(nproc)"
            grep -m1 "model name" /proc/cpuinfo
            free -h
            python --version
            pip show onnxruntime numpy opencv-python-headless Pillow pyclipper 2>/dev/null | grep -E "Name|Version"
          } | tee probe-results/specs.txt

      - name: Download candidate models
        run: |
          mkdir -p models
          curl -sL -o models/rtdetr.onnx "https://huggingface.co/ogkalu/comic-text-and-bubble-detector/resolve/main/detector.onnx"
          curl -sL -o models/rtdetr_int8.onnx "https://huggingface.co/ogkalu/comic-text-and-bubble-detector/resolve/main/detector_int8.onnx"
          curl -sL -o models/ctd.onnx "https://huggingface.co/mayocream/comic-text-detector-onnx/resolve/main/comic-text-detector.onnx"
          curl -sL -o models/dbnet_ppocrv4.onnx "https://huggingface.co/SWHL/RapidOCR/resolve/main/PP-OCRv4/ch_PP-OCRv4_det_infer.onnx"
          ls -la models/

      - name: Download Wimp ch.27 slices
        run: |
          gh release download cpu-probe-slices-v1 -p wimp30-slices.zip
          mkdir -p slices && python -c "import zipfile; zipfile.ZipFile('wimp30-slices.zip').extractall('slices')"
          ls slices | wc -l
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download run-9 Kiuyha baseline ONNX
        run: |
          GH_TOKEN=${{ github.token }} gh run download 40340455331 -n kiuyha-tuned-s-onnx -D kiuyha || echo "KIUYHA_DOWNLOAD_FAILED" > kiuyha_download_failed.txt
          find kiuyha -name "*.onnx" 2>/dev/null | head
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Run benchmark (script embedded as base64, push contains only this file)
        run: |
          echo '' | base64 -d > bench_cpu_probe.py
          python bench_cpu_probe.py
        env:
          PYTHONUNBUFFERED: "1"

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: cpu-probe-results
          path: probe-results/
          if-no-files-found: error
