name: Chapter 251 OCR Compact Table
on:
  push:
    branches: [trial/chapter-render-251]
    paths: [.github/workflows/chapter-251-ocr-compact-table.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  table:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: trial/chapter-render-251
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build compact table
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('trials/chapter-251/ocr-context-review.json')
          rows=json.loads(p.read_text(encoding='utf-8'))
          out=[]
          for r in rows:
              s=r['suspect']; owners=r.get('owner_objects') or []
              owner_ids=','.join(str(o.get('id') or '') for o in owners)
              dup='Y' if r.get('duplicate_group') else 'N'
              neigh=' || '.join(str(o.get('ocr_text') or '').replace('\n',' / ') for o in (r.get('neighbor_context') or []))
              text=str(s.get('text') or '').replace('\n',' / ')
              out.append(f"{r['review_number']:02d}\tp{s['page_index']:03d}\tsrc{s.get('source_page')}\ts{s.get('slice_index')}\t{s.get('box_id')}\t{owner_ids}\t{s.get('semantic_type')}\t{s.get('quality')}:{s.get('quality_reason')}\tdup={dup}\tOCR={text}\tCTX={neigh}")
          Path('trials/chapter-251/ocr-context-compact.tsv').write_text('\n'.join(out)+'\n',encoding='utf-8')
          PY
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trials/chapter-251/ocr-context-compact.tsv
          git commit -m "review: publish chapter 251 OCR compact table"
          git push origin HEAD:trial/chapter-render-251
