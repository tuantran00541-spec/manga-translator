name: Chapter 212 Render Review Rev2

on:
  push:
    branches:
      - trial/chapter-render-212
    paths:
      - .github/workflows/chapter-212-render-review.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: chapter-212-human-loop
  cancel-in-progress: false

jobs:
  render-review:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      CHAPTER_ID: c2120212
      TRANSLATION_RUN_ID: "34330784797"
      TRANSLATION_ARTIFACT: 04-translation-review-c2120212-rev2
      PRIMARY_DIALOGUE_FONT: Manga-fonts
      REVIEW_ZIP: The-Return-of-the-Crazy-Demon-Chapter-212-VI-RENDER-REVIEW-REV2.zip
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install production render runtime
        run: |
          python -m pip install \
            Pillow==10.4.0 numpy==1.26.4 opencv-contrib-python==4.10.0.84 \
            fastapi==0.115.0 pydantic==2.9.2 filelock==3.16.1 loguru==0.7.2 \
            fonttools==4.59.2

      - name: Restore translation review rev2 checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf checkpoint/04-translation-review
          mkdir -p checkpoint/04-translation-review
          gh run download "$TRANSLATION_RUN_ID" -n "$TRANSLATION_ARTIFACT" -D checkpoint/04-translation-review
          test -f checkpoint/04-translation-review/processed/manifest.json
          test -f checkpoint/04-translation-review/translation-review-summary.json
          test -d checkpoint/04-translation-review/raw

      - name: Validate translation rev2 checkpoint
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path('checkpoint/04-translation-review/translation-review-summary.json').read_text(encoding='utf-8'))
          expected = {
              'revision': 2,
              'status': 'PASS',
              'active_story_objects': 119,
              'translated_story_objects': 119,
              'active_untranslated_story_objects': 0,
              'persistent_tombstones': 82,
          }
          for key, value in expected.items():
              if summary.get(key) != value:
                  raise SystemExit(f'translation checkpoint {key}: expected {value}, got {summary.get(key)}')
          print('translation rev2 checkpoint PASS')
          PY

      - name: Restore production chapter layout
        run: |
          python - <<'PY'
          import json
          import shutil
          from pathlib import Path

          chapter_id = 'c2120212'
          root = Path('checkpoint/04-translation-review')
          raw_dst = Path('data/raw') / chapter_id
          processed_dst = Path('data/processed') / chapter_id
          output_dst = Path('data/output') / chapter_id

          for dst in (raw_dst, processed_dst, output_dst):
              if dst.exists():
                  shutil.rmtree(dst)
              dst.parent.mkdir(parents=True, exist_ok=True)

          shutil.copytree(root / 'raw', raw_dst)
          shutil.copytree(root / 'processed', processed_dst)
          output_dst.mkdir(parents=True, exist_ok=True)

          manifest_path = processed_dst / 'manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          for page in manifest.get('pages') or []:
              original = Path(str(page.get('original') or ''))
              clean = Path(str(page.get('clean') or ''))
              if original.name:
                  page['original'] = (raw_dst / 'sliced' / original.name).as_posix()
              if clean.name:
                  page['clean'] = str((processed_dst / clean.name).resolve())
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          print(f"restored {len(manifest.get('pages') or [])} slices")
          PY

      - name: Build stable typography plan
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from fontTools.ttLib import TTFont

          chapter_id = 'c2120212'
          primary = os.environ['PRIMARY_DIALOGUE_FONT']
          manifest_path = Path('data/processed') / chapter_id / 'manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          font_dir = Path('app/static/fonts')
          primary_path = font_dir / f'{primary}.ttf'
          if not primary_path.is_file():
              raise SystemExit(f'primary font missing: {primary_path}')

          font = TTFont(primary_path, lazy=True)
          cmap = set((font.getBestCmap() or {}).keys())
          font.close()

          probe = 'ăâêôơưđĂÂÊÔƠƯĐáàảãạấầẩẫậắằẳẵặéèẻẽẹếềểễệíìỉĩịóòỏõọốồổỗộớờởỡợúùủũụứừửữựýỳỷỹỵÁÀẢÃẠẤẦẨẪẬẮẰẲẴẶÉÈẺẼẸẾỀỂỄỆÍÌỈĨỊÓÒỎÕỌỐỒỔỖỘỚỜỞỠỢÚÙỦŨỤỨỪỬỮỰÝỲỶỸỴ'
          missing_probe = ''.join(ch for ch in probe if ord(ch) not in cmap)
          if missing_probe:
              raise SystemExit(f'primary font fails Vietnamese glyph probe: {missing_probe}')

          plan = []
          active = 0
          for pi, page in enumerate(manifest.get('pages') or []):
              for obj in page.get('text_objects') or []:
                  if obj.get('source_missing') or obj.get('human_review') != 'keep_story':
                      continue
                  oid = str(obj.get('id') or '')
                  vi = str(obj.get('translation') or '').strip()
                  if not vi:
                      raise SystemExit(f'active untranslated object page={pi} id={oid}')
                  missing = ''.join(sorted({ch for ch in vi if not ch.isspace() and ord(ch) not in cmap}))
                  if missing:
                      raise SystemExit(f'primary font missing glyphs for {oid}: {missing}')

                  style = obj.setdefault('style', {})
                  style.update({
                      'font': primary,
                      'fontSize': 'auto',
                      'color': 'auto',
                      'strokeWidth': 'auto',
                      'strokeColor': 'auto',
                      'bgColor': 'transparent',
                      'cornerRadius': '0',
                      'horizontalAlign': 'center',
                      'verticalAlign': 'middle',
                      'bold': False,
                  })
                  obj['human_typeset_class'] = 'dialogue'
                  obj['human_typeset_font'] = primary
                  obj['human_typeset_reason'] = 'primary_dialogue_font_consistency'
                  plan.append({
                      'page_index': pi,
                      'id': oid,
                      'font': primary,
                      'fontSize': 'auto',
                      'bold': False,
                      'stroke': 'auto',
                      'color': 'auto',
                      'alignment': 'center/middle',
                      'semantic_role': 'dialogue',
                      'style_reason': 'primary_dialogue_font_consistency',
                      'translation': vi,
                  })
                  active += 1

          if active != 119:
              raise SystemExit(f'expected 119 styled active objects, got {active}')

          typography_summary = {
              'status': 'PLAN_READY_PENDING_RENDER_VISUAL_REVIEW',
              'primary_dialogue_font': primary,
              'active_story_objects': active,
              'distinct_fonts_used': 1,
              'font_usage': {primary: active},
              'specialized_fonts_used': [],
              'forced_font_diversity': False,
              'vietnamese_glyph_probe': 'PASS',
          }
          manifest['human_typeset_review'] = typography_summary
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          Path('typography-plan.json').write_text(json.dumps({
              'chapter_id': chapter_id,
              **typography_summary,
              'assignments': plan,
          }, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(typography_summary, ensure_ascii=False, indent=2))
          PY

      - name: Render all slices with production renderer and export
        run: |
          python - <<'PY'
          import json
          import zipfile
          from pathlib import Path
          from PIL import Image
          from app.routers.export import export_chapter, render_chapter

          chapter_id = 'c2120212'
          result = render_chapter(chapter_id)
          stats = result.get('chapter_render') or {}
          if stats.get('total') != 56:
              raise SystemExit(f'expected 56 render slices, got {stats}')
          if stats.get('skipped') != 0:
              raise SystemExit(f'unexpected skipped render slices: {stats}')

          export_chapter(chapter_id)
          output_dir = Path('data/output') / chapter_id
          slice_paths = sorted(output_dir.glob('page_*.png'))
          if len(slice_paths) != 56:
              raise SystemExit(f'expected 56 rendered slice files, got {len(slice_paths)}')

          export_zip = output_dir / f'chapter_{chapter_id}.zip'
          if not export_zip.is_file():
              raise SystemExit('production export zip missing')
          with zipfile.ZipFile(export_zip) as z:
              names = [name for name in z.namelist() if name.lower().endswith('.png')]
              if len(names) != 16:
                  raise SystemExit(f'expected 16 stitched source pages, got {len(names)}')
              for name in names:
                  with z.open(name) as src:
                      with Image.open(src) as image:
                          if image.width <= 0 or image.height <= 0:
                              raise SystemExit(f'invalid exported image dimensions: {name}')
          print(json.dumps({'render_stats': stats, 'rendered_slice_files': len(slice_paths), 'stitched_source_pages': 16}, ensure_ascii=False, indent=2))
          PY

      - name: Pack render review checkpoint rev2
        run: |
          python - <<'PY'
          import json
          import shutil
          import zipfile
          from pathlib import Path
          from PIL import Image

          chapter_id = 'c2120212'
          checkpoint = Path('checkpoint/05-render-review-rev2')
          if checkpoint.exists():
              shutil.rmtree(checkpoint)
          checkpoint.mkdir(parents=True)

          processed_src = Path('data/processed') / chapter_id
          output_src = Path('data/output') / chapter_id
          shutil.copytree(processed_src, checkpoint / 'processed')
          shutil.copytree(output_src, checkpoint / 'output')
          shutil.copy2('typography-plan.json', checkpoint / 'typography-plan.json')

          export_zip = output_src / f'chapter_{chapter_id}.zip'
          review_zip = checkpoint / 'The-Return-of-the-Crazy-Demon-Chapter-212-VI-RENDER-REVIEW-REV2.zip'
          shutil.copy2(export_zip, review_zip)
          final_pages = checkpoint / 'final-pages'
          final_pages.mkdir()
          with zipfile.ZipFile(export_zip) as z:
              z.extractall(final_pages)

          typography = json.loads(Path('typography-plan.json').read_text(encoding='utf-8'))
          manifest = json.loads((processed_src / 'manifest.json').read_text(encoding='utf-8'))
          active_untranslated = []
          tombstones = 0
          for pi, page in enumerate(manifest.get('pages') or []):
              for obj in page.get('text_objects') or []:
                  if obj.get('source_missing'):
                      if obj.get('human_review') == 'drop_duplicate_credit_sfx_or_noise':
                          tombstones += 1
                      continue
                  if obj.get('human_review') == 'keep_story' and not str(obj.get('translation') or '').strip():
                      active_untranslated.append((pi, obj.get('id')))
          if active_untranslated:
              raise SystemExit(f'active untranslated after render: {active_untranslated[:20]}')
          if tombstones != 82:
              raise SystemExit(f'expected 82 tombstones after render, got {tombstones}')
          if typography.get('distinct_fonts_used') != 1 or typography.get('font_usage') != {'Manga-fonts': 119}:
              raise SystemExit(f'unexpected typography usage: {typography.get("font_usage")}')

          dims = []
          for path in sorted(final_pages.glob('*.png')):
              with Image.open(path) as image:
                  dims.append({'file': path.name, 'width': image.width, 'height': image.height})
          summary = {
              'checkpoint': '05-render-review',
              'revision': 2,
              'chapter_id': chapter_id,
              'slices': 56,
              'source_pages': 16,
              'active_story_objects': 119,
              'active_untranslated_story_objects': 0,
              'persistent_tombstones': 82,
              'primary_dialogue_font': 'Manga-fonts',
              'distinct_fonts_used': 1,
              'font_usage': {'Manga-fonts': 119},
              'forced_font_diversity': False,
              'final_page_dimensions': dims,
              'status': 'TECHNICAL_PASS_PENDING_HUMAN_VISUAL_REVIEW',
              'next_action': 'STOP_FOR_HUMAN_VISUAL_REVIEW',
          }
          (checkpoint / 'render-review-summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps({k: v for k, v in summary.items() if k != 'final_page_dimensions'}, ensure_ascii=False, indent=2))
          PY

      - name: Upload render review checkpoint rev2
        uses: actions/upload-artifact@v4
        with:
          name: 05-render-review-c2120212-rev2
          path: checkpoint/05-render-review-rev2
          if-no-files-found: error
          retention-days: 7
