name: UI tour

on:
  workflow_dispatch:
    inputs:
      chapter_url:
        description: "Chapter URL to import"
        required: true
        default: "https://asurascans.com/comics/the-academy-s-weapon-replicator-05c7df14/chapter/1"
      keep:
        description: "Slice indices to keep (0-based); every other slice is skipped"
        required: true
        default: "16,19,24,27"
      repaint:
        description: "x1,y1,x2,y2 on the first kept slice to brush and repaint with LaMa (empty to skip)"
        required: false
        default: "60,540,440,790"

permissions:
  contents: write

concurrency:
  group: ui-tour-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tour:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: "."
      MANGA_PROCESSING_PIPELINE: fast
      MANGA_USE_DYNAMIC_LAMA: "1"
      MANGA_ORT_PROVIDER: openvino
      MANGA_ORT_REQUIRE_PROVIDER: "1"
      MANGA_ORT_OPENVINO_SCOPE: detectors
      MANGA_ORT_OPENVINO_THREADS: "2"
      MANGA_ORT_OPENVINO_STREAMS: "1"
      MANGA_ORT_OPENVINO_CACHE_DIR: /tmp/manga-openvino-cache
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install app runtime
        run: |
          python -m pip install --only-binary :all: numpy==1.26.4 Pillow==10.4.0 opencv-contrib-python==4.10.0.84 \
            onnxruntime-openvino==1.24.1 psutil==6.1.1 loguru==0.7.2 requests==2.32.3 \
            beautifulsoup4==4.12.3 lxml==5.3.0 playwright==1.47.0 fastapi==0.115.0 \
            'uvicorn[standard]==0.30.6' pydantic==2.9.2 filelock==3.16.1 python-multipart==0.0.12 keyring==25.6.0
          python -m playwright install --with-deps chromium

      - name: Restore detector and inpaint models
        id: models
        uses: actions/cache@v4
        with:
          path: |
            models/*.onnx
            models/.e2e-provenance.json
          key: processing-profile-models-b224548-v1

      - name: Read pinned model provisioner
        if: steps.models.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          ref: b22454827f8190655d7070b80eb20c2550beadfa
          path: benchmark-bootstrap
          sparse-checkout: scripts/provision_real_e2e_models.py
          sparse-checkout-cone-mode: false

      - name: Provision production detector and LaMa models
        if: steps.models.outputs.cache-hit != 'true'
        run: |
          python -m pip install --only-binary :all: --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple torch==2.5.1+cpu torchvision==0.20.1+cpu
          python -m pip install --only-binary :all: --no-deps ultralytics==8.3.221 onnx==1.17.0 onnxslim==0.1.71
          python -m pip install --only-binary :all: sympy==1.13.1 PyYAML==6.0.2 scipy==1.14.1 tqdm==4.67.1 matplotlib==3.9.2 pandas==2.2.3 py-cpuinfo==9.0.0 ml_dtypes==0.5.3 colorama==0.4.6 polars==1.33.1 ultralytics-thop==2.0.17
          python benchmark-bootstrap/scripts/provision_real_e2e_models.py
          cp benchmark-bootstrap/models/*.onnx models/
          cp benchmark-bootstrap/models/.e2e-provenance.json models/ || true

      - name: Start the app
        run: |
          ls -la models/
          nohup python run.py > /tmp/server.log 2>&1 &
          timeout 120 bash -c 'until curl -sf http://127.0.0.1:8000/health >/dev/null; do sleep 2; done'
          curl -s http://127.0.0.1:8000/health | head -c 400; echo

      - name: Tour the UI on a real chapter
        env:
          INPUT_URL: ${{ github.event.inputs.chapter_url }}
          INPUT_KEEP: ${{ github.event.inputs.keep }}
          INPUT_REPAINT: ${{ github.event.inputs.repaint }}
        run: |
          rm -rf audit-results/ui-tour
          python scripts/ui_tour.py --chapter-url "$INPUT_URL" --keep "$INPUT_KEEP" \
            ${INPUT_REPAINT:+--repaint "$INPUT_REPAINT"} --out audit-results/ui-tour

      - name: Server log
        if: always()
        run: tail -n 200 /tmp/server.log

      - name: Commit screenshots to the branch
        if: always() && github.ref_name != github.event.repository.default_branch
        run: |
          test -d audit-results/ui-tour || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit-results/ui-tour
          git commit -m "audit: UI tour screenshots (run ${{ github.run_id }}) [skip ci]" || exit 0
          git push origin "HEAD:${GITHUB_REF_NAME}"
