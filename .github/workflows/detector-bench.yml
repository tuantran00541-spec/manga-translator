name: Detector bench

on:
  push:
    paths:
      - ".github/workflows/detector-bench.yml"
      - "scripts/detector_bench.py"
      - "scripts/koharu_bench_dir.rs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: detector-bench-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PYTHONPATH: "."

jobs:
  slices:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      MANGA_PROCESSING_PIPELINE: fast
      MANGA_USE_DYNAMIC_LAMA: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install processing runtime
        run: |
          python -m pip install --only-binary :all: numpy==1.26.4 Pillow==10.4.0 opencv-contrib-python==4.10.0.84 \
            onnxruntime==1.20.1 psutil==6.1.1 loguru==0.7.2 requests==2.32.3 \
            beautifulsoup4==4.12.3 lxml==5.3.0 playwright==1.47.0 fastapi==0.115.0 \
            pydantic==2.9.2 filelock==3.16.1 python-multipart==0.0.12
          python -m playwright install --with-deps chromium
      - name: Restore detector and inpaint models
        uses: actions/cache/restore@v4
        with:
          path: |
            models/*.onnx
            models/.e2e-provenance.json
          key: processing-profile-models-b224548-v1
      - name: Build the CTD mask model
        uses: ./.github/actions/build-ctd
      - run: test -f models/kiuyha_text_1280.onnx && test -f models/ctd_seg.onnx
      - name: Download the chapters and slice them
        run: python scripts/detector_bench.py slices --out bench/slices
      - name: Our detector
        run: python scripts/detector_bench.py ours --slices bench/slices --out bench/boxes
      - uses: actions/upload-artifact@v4
        with:
          name: slices
          path: bench/slices
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: boxes-ours
          path: bench/boxes
          retention-days: 3

  kiuyha-pt:
    needs: slices
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "ultralytics>=8.4" huggingface_hub
      - uses: actions/download-artifact@v4
        with:
          name: slices
          path: bench/slices
      - run: python scripts/detector_bench.py kiuyha-pt --slices bench/slices --out bench/boxes
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boxes-kiuyha-pt
          path: bench/boxes
          retention-days: 3

  comic-translate:
    needs: slices
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install numpy==1.26.4 Pillow==10.4.0 opencv-python-headless==4.10.0.84 onnxruntime==1.20.1 huggingface_hub
          git clone -q --depth 1 https://github.com/ogkalu2/comic-translate /tmp/comic-translate
          python - <<'EOF'
          from huggingface_hub import hf_hub_download
          for name in ("detector.onnx", "detector-v4-s_int8.onnx"):
              print(hf_hub_download("ogkalu/comic-text-and-bubble-detector", name, local_dir="/tmp/ct-models"))
          EOF
      - uses: actions/download-artifact@v4
        with:
          name: slices
          path: bench/slices
      - name: RT-DETR-v2 int8 (comic-translate default)
        run: python scripts/detector_bench.py rtdetr --slices bench/slices --out bench/boxes --repo /tmp/comic-translate --model /tmp/ct-models/detector-v4-s_int8.onnx --name comic-translate
      - name: RT-DETR-v2 full precision
        if: always()
        run: python scripts/detector_bench.py rtdetr --slices bench/slices --out bench/boxes --repo /tmp/comic-translate --model /tmp/ct-models/detector.onnx --name comic-translate-fp32
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boxes-comic-translate
          path: bench/boxes
          retention-days: 3

  ballons-ctd:
    needs: slices
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==1.26.4 opencv-python-headless==4.10.0.84 einops shapely pyclipper networkx numba \
            natsort pillow-jxl-plugin requests tqdm packaging
          git clone -q --depth 1 https://github.com/dmMaze/BallonsTranslator /tmp/ballons
          curl -sSL -o /tmp/ctd.onnx https://github.com/zyddnys/manga-image-translator/releases/download/beta-0.3/comictextdetector.pt.onnx
          echo "1a86ace74961413cbd650002e7bb4dcec4980ffa21b2f19b86933372071d718f  /tmp/ctd.onnx" | sha256sum -c
      - uses: actions/download-artifact@v4
        with:
          name: slices
          path: bench/slices
      - run: python scripts/detector_bench.py ctd --slices bench/slices --out bench/boxes --repo /tmp/ballons --model /tmp/ctd.onnx
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boxes-ballons-ctd
          path: bench/boxes
          retention-days: 3

  koharu:
    needs: slices
    runs-on: ubuntu-22.04
    timeout-minutes: 330
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends build-essential cmake clang libssl-dev pkg-config
          python -m pip install numpy==1.26.4 opencv-python-headless==4.10.0.84
          git clone -q --depth 1 https://github.com/koharu-rs/koharu /tmp/koharu
          cp scripts/koharu_bench_dir.rs /tmp/koharu/crates/koharu-ml/src/bin/koharu_bench_dir.rs
      - uses: dtolnay/rust-toolchain@stable
      - name: Build koharu's layout model runner
        working-directory: /tmp/koharu
        run: cargo build --release -p koharu-ml --bin koharu_bench_dir
      - uses: actions/download-artifact@v4
        with:
          name: slices
          path: bench/slices
      - name: Koharu layout RF-DETR (default detector)
        run: timeout 240m /tmp/koharu/target/release/koharu_bench_dir bench/slices bench/koharu-json || true
      - if: always()
        run: python scripts/detector_bench.py koharu --slices bench/slices --out bench/boxes --json-dir bench/koharu-json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boxes-koharu
          path: bench/boxes
          retention-days: 3

  report:
    needs: [slices, kiuyha-pt, comic-translate, ballons-ctd, koharu]
    permissions:
      contents: write
    if: always() && needs.slices.result == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy==1.26.4 opencv-python-headless==4.10.0.84
      - uses: actions/download-artifact@v4
        with:
          name: slices
          path: bench/slices
      - uses: actions/download-artifact@v4
        with:
          pattern: boxes-*
          path: bench/boxes
          merge-multiple: true
      - run: python scripts/detector_bench.py report --slices bench/slices --boxes bench/boxes --out audit-results/detector-bench
      - run: cp bench/boxes/*.json audit-results/detector-bench/ 2>/dev/null || true
      - name: Save evidence to audit-evidence
        if: always()
        uses: ./.github/actions/save-evidence
        with:
          paths: audit-results/detector-bench
          message: "audit: detector bench (run ${{ github.run_id }})"
