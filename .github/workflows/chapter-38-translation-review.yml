name: Chapter 38 translation review checkpoint

on:
  push:
    branches: [trial/chapter-render-38]
    paths:
      - .github/workflows/chapter-38-translation-review.yml
      - scripts/chapter38_human_curation.py
      - scripts/chapter38_finalize_curation.py
  workflow_dispatch:
    inputs:
      ocr_run_id:
        description: "Workflow run id that produced chapter38-ocr-review"
        required: false
        default: "34299483703"

permissions:
  contents: read
  actions: read

concurrency:
  group: chapter-38-translation-review
  cancel-in-progress: false

jobs:
  translation-review:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lightweight curation runtime
        run: python -m pip install Pillow==10.4.0

      - name: Download OCR-review artifact
        uses: actions/download-artifact@v4
        with:
          name: chapter38-ocr-review
          run-id: ${{ inputs.ocr_run_id || '34299483703' }}
          github-token: ${{ github.token }}
          path: imported-ocr-review

      - name: Restore OCR-review checkpoint
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path

          outer = Path('imported-ocr-review/chapter38-ocr-review.zip')
          if not outer.exists():
              raise SystemExit(f'missing OCR artifact: {outer}')
          with zipfile.ZipFile(outer) as z:
              z.extractall('.')
          root = Path('chapter38-ocr-review')
          if not (root / 'processed' / 'manifest.json').exists():
              raise SystemExit('restored OCR artifact has no processed/manifest.json')
          print('restored OCR review checkpoint')
          PY

      - name: Apply reviewed Vietnamese translation and deterministic clean repairs
        run: python scripts/chapter38_human_curation.py

      - name: Finalize human drop tombstones and preserve non-story credits
        run: python scripts/chapter38_finalize_curation.py

      - name: Validate translation review checkpoint
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('chapter38-ocr-review')
          summary = json.loads((root / 'chapter38-curation-summary.json').read_text(encoding='utf-8'))
          manifest = json.loads((root / 'processed' / 'manifest.json').read_text(encoding='utf-8'))
          if summary.get('checkpoint') != 'translation_review':
              raise SystemExit(f'wrong checkpoint: {summary}')
          if summary.get('curated_translation_count') != 115:
              raise SystemExit(f"expected 115 curated translations, got {summary.get('curated_translation_count')}")
          if not summary.get('end_card_credit_restored_from_raw'):
              raise SystemExit('end-card credit restoration did not run')
          active_untranslated = []
          tombstones = 0
          for pi, page in enumerate(manifest.get('pages', [])):
              for obj in page.get('text_objects') or []:
                  if obj.get('source_missing'):
                      if obj.get('human_review') == 'drop_duplicate_credit_sfx_or_noise':
                          tombstones += 1
                          if obj.get('auto_generated'):
                              raise SystemExit(f'human drop is still auto-generated: {obj.get("id")}')
                      continue
                  src = str(obj.get('ocr_text') or '').strip()
                  vi = str(obj.get('translation') or '').strip()
                  if src and not vi:
                      active_untranslated.append({'page_index': pi, 'id': obj.get('id'), 'source': src})
          if active_untranslated:
              raise SystemExit(f'untranslated active rows remain: {active_untranslated[:10]}')
          if tombstones < 25:
              raise SystemExit(f'expected reviewed tombstones, got {tombstones}')
          print(json.dumps({**summary, 'active_untranslated': 0, 'persistent_tombstones': tombstones}, ensure_ascii=False, indent=2))
          PY

      - name: Pack translation-review handoff
        run: |
          zip -qr chapter38-translation-review.zip chapter38-ocr-review

      - name: Upload translation-review handoff
        uses: actions/upload-artifact@v4
        with:
          name: chapter38-translation-review
          path: chapter38-translation-review.zip
          if-no-files-found: error
          retention-days: 7
