name: Repaint repro

on:
  push:
    paths:
      - "scripts/repaint_repro.py"
      - ".github/workflows/repaint-repro.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repaint-repro-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repro:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: "."
      MANGA_USE_DYNAMIC_LAMA: "1"
      OPENBLAS_NUM_THREADS: "1"
      # LaMa code before the mask padding fix, for the before/after comparison.
      BEFORE_REF: e08a56569d049d2bec6697829b5c23b1942809fb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime
        run: |
          python -m pip install --only-binary :all: numpy==1.26.4 Pillow==10.4.0 opencv-contrib-python==4.10.0.84 \
            onnxruntime-openvino==1.24.1 psutil==6.1.1 loguru==0.7.2 requests==2.32.3 fastapi==0.115.0 \
            pydantic==2.9.2 filelock==3.16.1 python-multipart==0.0.12

      - name: Restore LaMa model
        id: models
        uses: actions/cache/restore@v4
        with:
          path: |
            models/*.onnx
            models/.e2e-provenance.json
          key: processing-profile-models-b224548-v1

      - name: Check the model is there
        run: |
          ls -la models
          test -f models/lama-manga-dynamic.onnx || { echo "::error::LaMa model cache missing"; exit 1; }

      - name: Repaint with the fix
        run: python scripts/repaint_repro.py audit-results/repaint-repro/input.webp --out audit-results/repaint-repro/after

      - name: Repaint with the code before the fix
        run: |
          cp app/inpaint/lama_inpainter.py /tmp/lama_after.py
          git show "$BEFORE_REF:app/inpaint/lama_inpainter.py" > app/inpaint/lama_inpainter.py
          python scripts/repaint_repro.py audit-results/repaint-repro/input.webp --out audit-results/repaint-repro/before
          cp /tmp/lama_after.py app/inpaint/lama_inpainter.py

      - name: Commit evidence to the branch
        if: always() && github.ref_name != github.event.repository.default_branch
        run: |
          compgen -G "audit-results/repaint-repro/*/report.json" >/dev/null || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf /tmp/evidence && cp -r audit-results/repaint-repro /tmp/evidence
          for i in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            git checkout -f -B evidence FETCH_HEAD
            rm -rf audit-results/repaint-repro && cp -r /tmp/evidence audit-results/repaint-repro
            git add -A audit-results/repaint-repro
            git commit -m "audit: repaint repro with the real LaMa model (run ${{ github.run_id }}) [skip ci]" || exit 0
            git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep 5
          done
