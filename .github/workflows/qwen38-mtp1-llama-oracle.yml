name: Qwen3.8 upstream llama.cpp MTP-1 oracle

on:
  push:
    branches: [research/qwen3.8-27b-runtime-finish]
    paths:
      - "research/qwen38/llama_mtp1_oracle.cpp"
      - ".github/workflows/qwen38-mtp1-llama-oracle.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  HF_HUB_DISABLE_TELEMETRY: "1"
  LLAMA_CPP_COMMIT: "b81c99b479d4c24e5eeca10de99032ebd343ef8f"

jobs:
  mtp1-oracle:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[qwen-mtp-oracle]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Reclaim disk
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true
          docker system prune -af || true
          df -h
          free -h

      - name: Install download dependency
        run: python -m pip install --no-cache-dir huggingface_hub hf_xet

      - name: Download pinned real GGUF
        shell: bash
        run: |
          set -euo pipefail
          MODEL=$(python - <<'PY'
          from huggingface_hub import hf_hub_download
          print(hf_hub_download(
              "bartowski/Qwen3.8-27B-GGUF",
              filename="Qwen3.8-27B-Q6_K_L.gguf",
              local_dir="${{ runner.temp }}/qwen38-model",
          ))
          PY
          )
          test -f "$MODEL"
          echo "MODEL=$MODEL" >> "$GITHUB_ENV"
          echo "EVIDENCE=$RUNNER_TEMP/qwen38-mtp1-llama-oracle" >> "$GITHUB_ENV"

      - name: Build exact upstream MTP oracle revision
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build
          llama="$RUNNER_TEMP/llama.cpp"
          mkdir -p "$llama"
          git -C "$llama" init
          git -C "$llama" remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C "$llama" fetch --depth 1 origin "$LLAMA_CPP_COMMIT"
          git -C "$llama" checkout --detach FETCH_HEAD
          test "$(git -C "$llama" rev-parse HEAD)" = "$LLAMA_CPP_COMMIT"

          mkdir -p "$llama/examples/qwen38-mtp1-oracle"
          cp research/qwen38/llama_mtp1_oracle.cpp "$llama/examples/qwen38-mtp1-oracle/main.cpp"
          cat > "$llama/examples/qwen38-mtp1-oracle/CMakeLists.txt" <<'EOF'
          set(TARGET llama-qwen38-mtp1-oracle)
          add_executable(${TARGET} main.cpp)
          target_link_libraries(${TARGET} PRIVATE llama)
          target_include_directories(${TARGET} PRIVATE ${CMAKE_SOURCE_DIR}/src)
          target_compile_features(${TARGET} PRIVATE cxx_std_17)
          EOF
          printf '\nadd_subdirectory(qwen38-mtp1-oracle)\n' >> "$llama/examples/CMakeLists.txt"

          cmake -S "$llama" -B "$llama/build" -G Ninja \
            -DGGML_NATIVE=OFF -DGGML_OPENMP=ON -DLLAMA_BUILD_EXAMPLES=ON \
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_SERVER=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build "$llama/build" --target llama-qwen38-mtp1-oracle -j2

      - name: Run upstream target plus MTP-1 oracle
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          /usr/bin/time -v "$RUNNER_TEMP/llama.cpp/build/bin/llama-qwen38-mtp1-oracle" \
            "$MODEL" "$EVIDENCE/oracle.json" \
            2>&1 | tee "$EVIDENCE/oracle.log"

      - name: Require target parity and report MTP result
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ["EVIDENCE"])/"oracle.json"
          r=json.loads(p.read_text(encoding="utf-8"))
          assert r["schema"] == "qwen38-llama-mtp1-oracle-v1"
          assert r["llama_cpp_revision"] == "b81c99b479d4c24e5eeca10de99032ebd343ef8f"
          assert r["prompt_token"] == 12675
          # The upstream revision must reproduce the exact target path already
          # measured by our native runtime before its MTP output is comparable.
          assert r["target_first_token"] == 11, r
          assert r["target_verify_token"] == 353, r
          print("QWEN38_LLAMA_MTP1_TARGET_PARITY_PASS")
          print(json.dumps({
              "target_first_token": r["target_first_token"],
              "mtp_draft_token": r["mtp_draft_token"],
              "target_verify_token": r["target_verify_token"],
              "mtp1_accepted": r["mtp1_accepted"],
              "native_previous_mtp_draft_token": 1092,
              "native_oracle_same_draft": r["mtp_draft_token"] == 1092,
          }, indent=2))
          print("QWEN38_LLAMA_MTP1_ORACLE_PASS")
          PY

      - name: Upload compact oracle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen38-mtp1-llama-oracle-${{ github.run_id }}
          path: ${{ runner.temp }}/qwen38-mtp1-llama-oracle/
          if-no-files-found: warn
          retention-days: 14
