name: Scan probe

on:
  push:
    paths:
      - ".github/scan-probe/config.json"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --only-binary :all: numpy==1.26.4 Pillow==10.4.0 opencv-contrib-python==4.10.0.84 \
            loguru==0.7.2 requests==2.32.3 beautifulsoup4==4.12.3 lxml==5.3.0 playwright==1.47.0 fastapi==0.115.0 \
            pydantic==2.9.2 filelock==3.16.1 python-multipart==0.0.12 keyring==25.6.0 psutil==6.1.1
          python -m playwright install --with-deps chromium
      - id: conf
        run: python -c 'import json; c=json.load(open(".github/scan-probe/config.json")); print("label=" + c["label"])' >> "$GITHUB_OUTPUT"
      - env:
          MINIROUTER_API_KEY: ${{ secrets.MINIROUTER_API_KEY }}
        run: |
          python - <<'PY'
          import json, subprocess, sys
          c = json.load(open(".github/scan-probe/config.json"))
          sys.exit(subprocess.call([sys.executable, ".github/scan-probe/probe.py", c["chapter_url"],
                                    "audit-results/scan-probe/" + c["label"], c["models"], str(c["count"])]))
          PY
      - if: always()
        uses: ./.github/actions/save-evidence
        with:
          paths: audit-results/scan-probe/${{ steps.conf.outputs.label }}
          message: "audit: scan probe ${{ steps.conf.outputs.label }} (run ${{ github.run_id }})"
