name: Clean harness

# One-off: a scored second erase pass against today's clean on chapters with known leftovers.
on:
  push:
    branches-ignore: [main]
    paths:
      - "scripts/clean_harness_bench.py"
      - ".github/workflows/clean-harness.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clean-harness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    name: bench (${{ matrix.slug }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: shadow-slave-1
            url: https://asurascans.com/comics/shadow-slave-05c7df14/chapter/1
          - slug: solo-swordmaster-1
            url: https://asurascans.com/comics/solo-swordmaster-3ec3b16f/chapter/1
          - slug: the-world-after-the-end-254
            url: https://asurascans.com/comics/the-world-after-the-end-3ec3b16f/chapter/254
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: "."
      MANGA_PROCESSING_PIPELINE: fast
      MANGA_USE_DYNAMIC_LAMA: "1"
      MANGA_ORT_PROVIDER: openvino
      MANGA_ORT_REQUIRE_PROVIDER: "1"
      MANGA_ORT_OPENVINO_SCOPE: detectors
      MANGA_ORT_OPENVINO_THREADS: "2"
      MANGA_ORT_OPENVINO_STREAMS: "1"
      MANGA_ORT_OPENVINO_CACHE_DIR: /tmp/manga-openvino-cache
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install processing runtime
        run: |
          python -m pip install --only-binary :all: numpy==1.26.4 Pillow==10.4.0 opencv-contrib-python==4.10.0.84 \
            onnxruntime-openvino==1.24.1 psutil==6.1.1 loguru==0.7.2 requests==2.32.3 \
            beautifulsoup4==4.12.3 lxml==5.3.0 playwright==1.47.0 fastapi==0.115.0 \
            pydantic==2.9.2 filelock==3.16.1 python-multipart==0.0.12
          python -m playwright install --with-deps chromium

      - name: Restore detector and inpaint models
        uses: actions/cache/restore@v4
        with:
          path: |
            models/*.onnx
            models/.e2e-provenance.json
          key: processing-profile-models-b224548-v1

      - name: Build the CTD mask model
        uses: ./.github/actions/build-ctd

      - name: Check the models are there
        run: |
          ls -la models
          test -f models/lama-manga-dynamic.onnx && test -f models/kiuyha_text_1280.onnx

      - name: Clean the chapter, then run the harness
        run: python scripts/clean_harness_bench.py "${{ matrix.url }}" --out audit-results/clean-harness/${{ matrix.slug }}

      - name: Save evidence to audit-evidence
        if: always()
        uses: ./.github/actions/save-evidence
        with:
          paths: audit-results/clean-harness/${{ matrix.slug }}
          message: "audit: clean harness ${{ matrix.slug }} (run ${{ github.run_id }})"
