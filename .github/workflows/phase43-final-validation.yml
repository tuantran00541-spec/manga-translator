name: phase43-final-validation

on:
  push:
    branches:
      - phase-4-3-visual-qc-core
  pull_request:
    paths:
      - ".github/workflows/phase43-final-validation.yml"
      - "app/**"
      - "tests/**"

jobs:
  broad-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install regression dependencies
        run: |
          python -m pip install \
            pytest==8.3.5 \
            fastapi==0.115.0 \
            pydantic==2.9.2 \
            requests==2.32.3 \
            beautifulsoup4==4.12.3 \
            lxml==5.3.0 \
            playwright==1.47.0 \
            python-multipart==0.0.12 \
            Pillow==10.4.0 \
            numpy==1.26.4 \
            opencv-python-headless==4.10.0.84 \
            onnxruntime==1.21.0 \
            filelock==3.16.1 \
            loguru==0.7.2 \
            psutil==6.1.1 \
            keyring==25.6.0
      - name: Prepare runtime directories
        run: mkdir -p logs data/raw data/processed data/output models
      - name: Run full pytest suite
        run: python -m pytest -q
      - name: Audit Sonar PR issues
        if: always()
        env:
          SONAR_PROJECT: tuantran00541-spec_manga-translator
          SONAR_PR: "7"
        run: |
          python - <<'PY'
          import collections
          import json
          import os
          import urllib.parse
          import urllib.request

          query = urllib.parse.urlencode({
              "componentKeys": os.environ["SONAR_PROJECT"],
              "pullRequest": os.environ["SONAR_PR"],
              "resolved": "false",
              "ps": "100",
          })
          url = "https://sonarcloud.io/api/issues/search?" + query
          with urllib.request.urlopen(url, timeout=20) as response:
              payload = json.load(response)

          issues = []
          for issue in payload.get("issues", []):
              component = str(issue.get("component") or "")
              path = component.split(":", 1)[-1]
              if path.startswith(".github/workflows/phase43-final-validation.yml"):
                  continue
              issues.append({
                  "rule": issue.get("rule"),
                  "severity": issue.get("severity"),
                  "type": issue.get("type"),
                  "path": path,
                  "line": issue.get("line"),
                  "message": issue.get("message"),
                  "impacts": issue.get("impacts") or [],
              })
          by_severity = collections.Counter(str(i["severity"]) for i in issues)
          by_type = collections.Counter(str(i["type"]) for i in issues)
          by_rule = collections.Counter(str(i["rule"]) for i in issues)
          print("SONAR_SUMMARY=" + json.dumps({
              "total": len(issues),
              "severity": dict(by_severity),
              "type": dict(by_type),
              "rules": dict(by_rule),
          }, separators=(",", ":")))
          for issue in issues:
              print("SONAR_ISSUE=" + json.dumps(issue, separators=(",", ":")))
          PY
