name: Chapter 1 Checkpoint 03B OCR Human Curation

on:
  push:
    branches:
      - chapter/war-of-extinction-1
    paths:
      - .github/workflows/chapter-1-ocr-curation.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: chapter-1-human-loop
  cancel-in-progress: false

jobs:
  curate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      OCR_RUN_ID: "35296030515"
      OCR_ARTIFACT: 03-ocr-review-05efce51
      STATE_DIR: chapters/war-of-extinction-1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chapter/war-of-extinction-1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore OCR review artifact
        run: |
          rm -rf checkpoint/03-ocr checkpoint/03b-curated
          mkdir -p checkpoint/03-ocr checkpoint/03b-curated
          gh run download "$OCR_RUN_ID" -n "$OCR_ARTIFACT" -D checkpoint/03-ocr
          test -f checkpoint/03-ocr/processed-manifest.json
          test -f checkpoint/03-ocr/ocr-review-summary.json
          test -f "$STATE_DIR/ocr-curation.json"

      - name: Apply human OCR curation
        run: |
          python - <<'PY'
          from __future__ import annotations
          import copy, json
          from pathlib import Path
          from app.text_objects import DEFAULT_TEXT_OBJECT_STYLE, ensure_page_text_objects

          state_dir=Path("chapters/war-of-extinction-1")
          src=Path("checkpoint/03-ocr")
          out=Path("checkpoint/03b-curated")
          c=json.loads((state_dir/"ocr-curation.json").read_text(encoding="utf-8"))
          s=json.loads((src/"ocr-review-summary.json").read_text(encoding="utf-8"))
          m=json.loads((src/"processed-manifest.json").read_text(encoding="utf-8"))

          if c.get("status")!="READY_TO_APPLY":
              raise SystemExit("curation map is not ready")
          if s.get("ocr_source")!="RAW" or not s.get("ocr_source_invariant_verified"):
              raise SystemExit("OCR source invariant is not RAW")
          if s.get("failed")!=0 or s.get("ocr_results")!=197:
              raise SystemExit(f"unexpected OCR technical summary: {s}")

          pages=m.get("pages") or []
          for page in pages:
              ensure_page_text_objects(page)

          box_index={}
          page_index_by_box={}
          object_refs={}
          for pi,page in enumerate(pages):
              for b in page.get("boxes") or []:
                  if isinstance(b,dict) and b.get("id"):
                      bid=str(b["id"])
                      box_index[bid]=b
                      page_index_by_box[bid]=pi
              for obj in page.get("text_objects") or []:
                  if not isinstance(obj,dict):
                      continue
                  for bid in obj.get("source_boxes") or []:
                      if isinstance(bid,str):
                          object_refs.setdefault(bid,[]).append(obj)

          def style():
              return copy.deepcopy(DEFAULT_TEXT_OBJECT_STYLE)

          def make_obj(obj_id, region, text, source_boxes, origin="human_ocr_review", semantic_type=None):
              o={
                  "id":obj_id,
                  "shape":"rectangle",
                  "region":{k:int(region[k]) for k in ("x1","y1","x2","y2")},
                  "source_boxes":list(source_boxes),
                  "ocr_text":text,
                  "translation":"",
                  "style":style(),
                  "origin":origin,
                  "auto_generated":False,
                  "source_missing":False,
                  "human_reviewed":True,
                  "ocr_quality":"human_reviewed",
                  "ocr_quality_reason":"manual_curation",
              }
              if semantic_type:
                  o["semantic_type"]=semantic_type
              return o

          drop_ids=[]
          reason_by_id={}
          for category,ids in (c.get("drops") or {}).items():
              for bid in ids:
                  if bid in reason_by_id:
                      raise SystemExit(f"duplicate drop id {bid}")
                  reason_by_id[bid]=category
                  drop_ids.append(bid)

          correction_ids=set((c.get("corrections") or {}).keys())
          promotion_ids=set((c.get("promotions") or {}).keys())
          overlap=(set(drop_ids)&correction_ids)|(set(drop_ids)&promotion_ids)
          if overlap:
              raise SystemExit(f"curation conflict drop vs active: {sorted(overlap)}")

          for bid,reason in reason_by_id.items():
              b=box_index.get(bid)
              if b is None:
                  raise SystemExit(f"drop box missing: {bid}")
              before=str(b.get("ocr_text") or "")
              if before:
                  b["machine_ocr_text_before_review"]=before
              b["ocr_eligible"]=False
              b["human_review_drop"]=True
              b["human_review_origin"]="human_review_drop"
              b["story_role"]=reason
              b["human_reviewed"]=True
              refs=object_refs.get(bid,[])
              if not refs:
                  pi=page_index_by_box[bid]
                  obj=make_obj(
                      "text_"+bid.removeprefix("box_"),
                      {k:int(b[k]) for k in ("x1","y1","x2","y2")},
                      "",
                      [bid],
                      origin="human_review_drop",
                      semantic_type=b.get("semantic_type"),
                  )
                  obj["source_missing"]=True
                  obj["reason"]=reason
                  pages[pi].setdefault("text_objects",[]).append(obj)
                  object_refs.setdefault(bid,[]).append(obj)
                  refs=[obj]
              for obj in refs:
                  old=str(obj.get("ocr_text") or "")
                  if old:
                      obj["machine_ocr_text_before_review"]=old
                  obj["ocr_text"]=""
                  obj["translation"]=""
                  obj["origin"]="human_review_drop"
                  obj["auto_generated"]=False
                  obj["source_missing"]=True
                  obj["human_reviewed"]=True
                  obj["reason"]=reason
                  obj.pop("auto_ocr_text",None)
                  obj.pop("auto_geometry",None)

          for bid,item in (c.get("corrections") or {}).items():
              b=box_index.get(bid)
              if b is None:
                  raise SystemExit(f"correction box missing: {bid}")
              before=str(item["before"])
              after=str(item["after"])
              if str(b.get("ocr_text") or "")!=before:
                  raise SystemExit(f"OCR drift {bid}: {b.get('ocr_text')!r} != {before!r}")
              b["machine_ocr_text_before_review"]=before
              b["ocr_text"]=after
              b["ocr_quality"]="human_reviewed"
              b["ocr_quality_reason"]="manual_correction"
              b["human_reviewed"]=True
              if item.get("region"):
                  b.update({k:int(item["region"][k]) for k in ("x1","y1","x2","y2")})
              refs=[o for o in object_refs.get(bid,[]) if o.get("origin")!="human_review_drop"]
              if len(refs)!=1:
                  raise SystemExit(f"expected one active object for correction {bid}, got {len(refs)}")
              obj=refs[0]
              obj["machine_ocr_text_before_review"]=before
              obj["ocr_text"]=after
              obj["translation"]=""
              obj["origin"]="human_ocr_review"
              obj["auto_generated"]=False
              obj["source_missing"]=False
              obj["human_reviewed"]=True
              obj["ocr_quality"]="human_reviewed"
              obj["ocr_quality_reason"]="manual_correction"
              if item.get("region"):
                  obj["region"]={k:int(item["region"][k]) for k in ("x1","y1","x2","y2")}
              obj.pop("auto_ocr_text",None)
              obj.pop("auto_geometry",None)

          for bid,item in (c.get("promotions") or {}).items():
              b=box_index.get(bid)
              if b is None:
                  raise SystemExit(f"promotion box missing: {bid}")
              pi=int(item["page_index"])
              if page_index_by_box.get(bid)!=pi:
                  raise SystemExit(f"promotion page mismatch for {bid}")
              region={k:int(item["region"][k]) for k in ("x1","y1","x2","y2")}
              text=str(item["text"])
              b.update(region)
              b["ocr_text"]=text
              b["ocr_eligible"]=True
              b["ocr_quality"]="human_reviewed"
              b["ocr_quality_reason"]="manual_promotion"
              b["human_reviewed"]=True
              b["semantic_type"]=item.get("semantic_type") or b.get("semantic_type")
              b.pop("human_review_drop",None)
              refs=[o for o in object_refs.get(bid,[]) if o.get("origin")!="human_review_drop"]
              if len(refs)>1:
                  raise SystemExit(f"multiple live refs for promoted box {bid}")
              if refs:
                  obj=refs[0]
                  obj["region"]=region
                  obj["ocr_text"]=text
                  obj["translation"]=""
                  obj["origin"]="human_ocr_review"
                  obj["auto_generated"]=False
                  obj["source_missing"]=False
                  obj["human_reviewed"]=True
                  obj["semantic_type"]=item.get("semantic_type")
              else:
                  obj=make_obj("text_"+bid.removeprefix("box_"),region,text,[bid],semantic_type=item.get("semantic_type"))
                  pages[pi].setdefault("text_objects",[]).append(obj)
                  object_refs.setdefault(bid,[]).append(obj)

          manual_ids=set()
          for item in c.get("manual_additions") or []:
              pi=int(item["page_index"])
              obj_id=str(item["id"])
              if obj_id in manual_ids:
                  raise SystemExit(f"duplicate manual object id {obj_id}")
              manual_ids.add(obj_id)
              if not 0<=pi<len(pages):
                  raise SystemExit(f"bad manual page {pi}")
              if any(isinstance(o,dict) and o.get("id")==obj_id for o in pages[pi].get("text_objects") or []):
                  raise SystemExit(f"manual object already exists {obj_id}")
              obj=make_obj(
                  obj_id,item["region"],str(item["text"]),item.get("source_boxes") or [],
                  semantic_type=item.get("semantic_type"),
              )
              obj["origin"]="human_ocr_review"
              obj["manual_added"]=True
              pages[pi].setdefault("text_objects",[]).append(obj)

          # Reconcile twice to prove human drops persist.
          for _ in range(2):
              for page in pages:
                  ensure_page_text_objects(page)

          resurrection=0
          for page in pages:
              for obj in page.get("text_objects") or []:
                  if not isinstance(obj,dict):
                      continue
                  refs={str(v) for v in (obj.get("source_boxes") or []) if isinstance(v,str)}
                  if refs & set(drop_ids):
                      if obj.get("origin")!="human_review_drop" or obj.get("auto_generated") is not False or not obj.get("source_missing"):
                          resurrection+=1
          if resurrection:
              raise SystemExit(f"tombstone resurrection detected: {resurrection}")

          # Rebuild indexes after reconciliation.
          live_refs={}
          for page in pages:
              for obj in page.get("text_objects") or []:
                  if not isinstance(obj,dict) or obj.get("source_missing"):
                      continue
                  for bid in obj.get("source_boxes") or []:
                      if isinstance(bid,str):
                          live_refs.setdefault(bid,[]).append(obj)

          scene=[]
          active_box_count=0
          for pi,page in enumerate(pages):
              core=page.get("stitch_core") or {}
              source_y1=int(core.get("source_y1") or 0)
              source_page=int(page.get("source_page") or 0)
              slice_index=int(page.get("slice_index") or 0)
              for b in page.get("boxes") or []:
                  if not isinstance(b,dict) or b.get("removed") or b.get("ocr_eligible") is False:
                      continue
                  bid=str(b.get("id") or "")
                  if not bid:
                      continue
                  text=str(b.get("ocr_text") or "").strip()
                  if not text:
                      raise SystemExit(f"active story OCR empty: {bid}")
                  refs=live_refs.get(bid,[])
                  if len(refs)!=1:
                      raise SystemExit(f"active box {bid} maps to {len(refs)} live objects")
                  obj=refs[0]
                  obj["ocr_text"]=str(b.get("ocr_text") or "")
                  obj["origin"]="human_ocr_review"
                  obj["auto_generated"]=False
                  obj["human_reviewed"]=True
                  if str(obj.get("translation") or "").strip():
                      raise SystemExit(f"translation exists before translation gate: {obj.get('id')}")
                  active_box_count+=1
                  scene.append({
                      "page_index":pi,"source_page":source_page,"slice_index":slice_index,
                      "object_id":obj.get("id"),"box_id":bid,
                      "global_y1":source_y1+int(obj["region"]["y1"]),
                      "global_x1":int(obj["region"]["x1"]),
                      "ocr_text":str(obj.get("ocr_text") or ""),
                      "semantic_type":obj.get("semantic_type") or b.get("semantic_type"),
                  })
              for obj in page.get("text_objects") or []:
                  if not isinstance(obj,dict) or obj.get("source_missing") or not obj.get("manual_added"):
                      continue
                  text=str(obj.get("ocr_text") or "").strip()
                  if not text:
                      raise SystemExit(f"manual story object empty: {obj.get('id')}")
                  scene.append({
                      "page_index":pi,"source_page":source_page,"slice_index":slice_index,
                      "object_id":obj.get("id"),"box_id":None,
                      "global_y1":source_y1+int(obj["region"]["y1"]),
                      "global_x1":int(obj["region"]["x1"]),
                      "ocr_text":text,
                      "semantic_type":obj.get("semantic_type"),
                  })

          scene.sort(key=lambda r:(r["source_page"],r["global_y1"],r["global_x1"],str(r["object_id"])))
          if len(scene)!=168:
              raise SystemExit(f"expected 168 active story objects, got {len(scene)} (active boxes={active_box_count})")

          # Known overlap/fragment regressions must be absent.
          forbidden=set(drop_ids)
          active_box_ids={r["box_id"] for r in scene if r.get("box_id")}
          if forbidden & active_box_ids:
              raise SystemExit("dropped box survived active scene order")

          (out/"processed-manifest.json").write_text(json.dumps(m,ensure_ascii=False,indent=2),encoding="utf-8")
          (out/"active-source-text.json").write_text(json.dumps(scene,ensure_ascii=False,indent=2),encoding="utf-8")
          result={
              "checkpoint":"03b-ocr-human-curation",
              "chapter_id":"05efce51",
              "status":"PASS",
              "editorial_pass":True,
              "ocr_source":"RAW",
              "machine_ocr_targets":197,
              "drops":len(drop_ids),
              "manual_corrections":len(c.get("corrections") or {}),
              "manual_promotions":len(c.get("promotions") or {}),
              "manual_additions":len(c.get("manual_additions") or []),
              "active_story_objects":len(scene),
              "empty_active_story_objects":0,
              "duplicate_blockers":0,
              "fragment_blockers":0,
              "resurrection_count":resurrection,
              "story_ocr_blockers":0,
              "next_action":"TRANSLATION_REVIEW",
          }
          (out/"ocr-curation-summary.json").write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding="utf-8")
          (out/"HUMAN_CHECKPOINT.txt").write_text(
              "CHECKPOINT: OCR HUMAN CURATION PASS\n"
              "168 active story objects are human-reviewed, non-empty, duplicate-free, and resurrection-safe.\n"
              "Next: translate by scene, then translation review.\n",
              encoding="utf-8",
          )
          print(json.dumps(result,indent=2))
          PY

      - name: Verify curation gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path("checkpoint/03b-curated/ocr-curation-summary.json").read_text())
          required={
            "status":"PASS","editorial_pass":True,"active_story_objects":168,
            "empty_active_story_objects":0,"duplicate_blockers":0,
            "fragment_blockers":0,"resurrection_count":0,"story_ocr_blockers":0,
          }
          for k,v in required.items():
              if s.get(k)!=v:
                  raise SystemExit(f"{k}: expected {v!r}, got {s.get(k)!r}")
          print(json.dumps(s,indent=2))
          PY

      - name: Upload curated OCR checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: 03b-ocr-curated-05efce51
          path: checkpoint/03b-curated/
          retention-days: 7
          if-no-files-found: error
