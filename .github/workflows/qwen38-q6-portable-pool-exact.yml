name: Qwen3.8 exact portable Q6 persistent pool

on:
  push:
    branches:
      - research/qwen3.8-27b-runtime-finish
    paths:
      - research/qwen38/qwen_thread_compat.h
      - research/qwen38/q6_persistent_pool_portable_exact.c
      - .github/workflows/qwen38-q6-portable-pool-exact.yml
  workflow_dispatch:

jobs:
  portable-q6-pool:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Linux compile and exact synthetic gate
        if: runner.os == 'Linux'
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -euo pipefail
          cc -O3 -std=c11 -mavx2 -fno-fast-math -ffp-contract=off -pthread \
            -DQWEN_Q6_PERSISTENT_POOL_SELFTEST \
            research/qwen38/q6_persistent_pool_portable_exact.c -lm \
            -o "$RUNNER_TEMP/qwen_q6_portable_selftest"
          "$RUNNER_TEMP/qwen_q6_portable_selftest" 2>&1 | tee "$RUNNER_TEMP/q6-portable.log"
          grep -F "QWEN38_Q6_PORTABLE_PERSISTENT_POOL_BITWISE_PASS" "$RUNNER_TEMP/q6-portable.log"

          cc -O3 -std=c11 -mavx2 -fno-fast-math -ffp-contract=off -pthread -fPIC -shared \
            research/qwen38/q6_persistent_pool_portable_exact.c -lm \
            -o "$RUNNER_TEMP/libqwen_q6_portable.so"
          QWEN_PORTABLE_LIB="$RUNNER_TEMP/libqwen_q6_portable.so" python - <<'PY'
          import ctypes, os
          lib = ctypes.CDLL(os.environ["QWEN_PORTABLE_LIB"])
          for name in (
              "qwen_q6_pool_create", "qwen_q6_pool_destroy",
              "qwen_q6_pool_matvec_many", "qwen_q6_pool_calls",
              "qwen_q6_pool_threads",
              "qwen_matvec_many_q6_k_q8_k_bridge",
              "qwen_matvec_many_q8_0_q8_0_bridge",
          ):
              getattr(lib, name)
          print("QWEN38_Q6_PORTABLE_LINUX_ABI_PASS")
          PY
          echo "QWEN_PORTABLE_LIB=$RUNNER_TEMP/libqwen_q6_portable.so" >> "$GITHUB_ENV"

          # Match the Linux current-best quantizer build, not the stricter
          # Win32 bundle flags.  This makes the fingerprint compare the two
          # actual full-model build policies rather than an artificial common
          # compiler configuration.
          cc -O3 -std=c11 -mavx2 -fno-fast-math -ffp-contract=off -fPIC -shared \
            research/qwen38/gguf_quant_matvec_many_bridge.c -lm \
            -o "$RUNNER_TEMP/libqwen_quant_base.so"
          echo "QWEN_QUANT_LIB=$RUNNER_TEMP/libqwen_quant_base.so" >> "$GITHUB_ENV"

      - name: Windows compiler information
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          clang --version
          python --version

      - name: Windows compile and exact synthetic gate
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:RUNNER_TEMP 'qwen_q6_portable_selftest.exe'
          clang -O3 -std=c11 -mavx2 -fno-fast-math -ffp-contract=off `
            -DQWEN_Q6_PERSISTENT_POOL_SELFTEST `
            research/qwen38/q6_persistent_pool_portable_exact.c `
            -o $exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $log = Join-Path $env:RUNNER_TEMP 'q6-portable.log'
          & $exe 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Select-String -Path $log -SimpleMatch 'QWEN38_Q6_PORTABLE_PERSISTENT_POOL_BITWISE_PASS')) {
            throw 'portable Windows exact marker missing'
          }

          $dll = Join-Path $env:RUNNER_TEMP 'qwen_q6_portable.dll'
          clang -O3 -std=c11 -mavx2 -fno-fast-math -ffp-contract=off -shared `
            research/qwen38/q6_persistent_pool_portable_exact.c `
            -o $dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:QWEN_PORTABLE_LIB = $dll
          @'
          import ctypes, os
          lib = ctypes.CDLL(os.environ["QWEN_PORTABLE_LIB"])
          for name in (
              "qwen_q6_pool_create", "qwen_q6_pool_destroy",
              "qwen_q6_pool_matvec_many", "qwen_q6_pool_calls",
              "qwen_q6_pool_threads",
              "qwen_matvec_many_q6_k_q8_k_bridge",
              "qwen_matvec_many_q8_0_q8_0_bridge",
          ):
              getattr(lib, name)
          print("QWEN38_Q6_PORTABLE_WINDOWS_ABI_PASS")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "QWEN_PORTABLE_LIB=$dll" | Out-File -FilePath $env:GITHUB_ENV -Append

          # Match Build-Dll qwen_quant_base.dll in the full Win32 gate.
          $quant = Join-Path $env:RUNNER_TEMP 'qwen_quant_base.dll'
          clang -O3 -std=c11 -shared `
            -fno-fast-math -fno-associative-math -ffp-contract=off `
            -fno-vectorize -fno-slp-vectorize -mavx2 `
            research/qwen38/gguf_quant_matvec_many_bridge.c `
            -Xlinker '/EXPORT:qwen_quantize_q8_k_scalar' `
            -Xlinker '/EXPORT:qwen_quantize_q8_0_scalar' `
            -o $quant
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "QWEN_QUANT_LIB=$quant" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Cross-platform activation quantization fingerprint
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python - <<'PY'
          import ctypes
          import hashlib
          import os
          import struct

          lib = ctypes.CDLL(os.environ['QWEN_QUANT_LIB'])
          F32P = ctypes.POINTER(ctypes.c_float)
          U8P = ctypes.POINTER(ctypes.c_uint8)
          for name in ('qwen_quantize_q8_0_scalar', 'qwen_quantize_q8_k_scalar'):
              fn = getattr(lib, name)
              fn.argtypes = [F32P, ctypes.c_size_t, U8P, ctypes.c_size_t]
              fn.restype = ctypes.c_int

          # Inputs are built from raw finite F32 bit patterns so Python/libm is
          # not involved in fixture generation.  Exponents stay within a broad
          # but model-plausible range; fixed edge values cover signed zero,
          # tiny normals, common fractions, and larger finite activations.
          edge_bits = (
              0x00000000, 0x80000000, 0x00800000, 0x80800000,
              0x33800000, 0xb3800000, 0x3dcccccd, 0xbdcccccd,
              0x3eaaaaab, 0xbeaaaaab, 0x3f000000, 0xbf000000,
              0x3f800000, 0xbf800000, 0x40000000, 0xc0000000,
              0x41200000, 0xc1200000, 0x42c80000, 0xc2c80000,
          )

          state = 0x9E3779B9
          def u32():
              global state
              state = (state * 1664525 + 1013904223) & 0xffffffff
              return state

          def fixture(n, salt):
              words = []
              for i in range(n):
                  if i < len(edge_bits):
                      bits = edge_bits[(i + salt) % len(edge_bits)]
                  else:
                      r = u32()
                      sign = r & 0x80000000
                      # unbiased exponents [-20, +8], broad enough to stress
                      # scale/division rounding without pathological overflow.
                      exp = 127 - 20 + ((r >> 24) % 29)
                      mant = u32() & 0x007fffff
                      bits = sign | (exp << 23) | mant
                  words.append(bits)
              raw = struct.pack('<' + 'I' * n, *words)
              values = (ctypes.c_float * n).from_buffer_copy(raw)
              return values

          q80 = hashlib.sha256()
          q8k = hashlib.sha256()
          cases = 0
          for salt, n in enumerate((256, 5120, 6144, 17408), 1):
              x = fixture(n, salt)

              n80 = (n // 32) * 34
              out80 = (ctypes.c_uint8 * n80)()
              rc = lib.qwen_quantize_q8_0_scalar(x, n, out80, n80)
              if rc != 0:
                  raise SystemExit(f'Q8_0 quantize rc={rc} n={n}')
              q80.update(struct.pack('<I', n))
              q80.update(bytes(out80))

              nk = (n // 256) * 292
              outk = (ctypes.c_uint8 * nk)()
              rc = lib.qwen_quantize_q8_k_scalar(x, n, outk, nk)
              if rc != 0:
                  raise SystemExit(f'Q8_K quantize rc={rc} n={n}')
              q8k.update(struct.pack('<I', n))
              q8k.update(bytes(outk))
              cases += 1

          q80_hex = q80.hexdigest()
          q8k_hex = q8k.hexdigest()
          combined = hashlib.sha256(bytes.fromhex(q80_hex) + bytes.fromhex(q8k_hex)).hexdigest()
          print(f'QWEN38_Q8_0_QUANT_CROSS_PLATFORM_SHA256 {q80_hex}')
          print(f'QWEN38_Q8_K_QUANT_CROSS_PLATFORM_SHA256 {q8k_hex}')
          print(f'QWEN38_ACTIVATION_QUANT_CROSS_PLATFORM_SHA256 {combined}')
          print(f'QWEN38_ACTIVATION_QUANT_CASES {cases}')
          print('QWEN38_ACTIVATION_QUANT_CROSS_PLATFORM_FINGERPRINT_PASS')
          PY

      - name: Cross-platform exact Q6 output fingerprint
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          python - <<'PY'
          import ctypes
          import hashlib
          import os
          import struct

          N = 512
          ROWS = 17
          NV = 3
          QK = 256
          BLOCK_Q6 = 210
          BLOCK_Q8K = 292
          row_bytes = (N // QK) * BLOCK_Q6
          act_bytes = (N // QK) * BLOCK_Q8K

          state = 0x243F6A88
          def u32():
              global state
              state = (state * 1664525 + 1013904223) & 0xffffffff
              return state

          weights = bytearray(ROWS * row_bytes)
          for r in range(ROWS):
              for ib in range(N // QK):
                  off = r * row_bytes + ib * BLOCK_Q6
                  for j in range(128 + 64):
                      weights[off + j] = (u32() >> 24) & 0xff
                  for j in range(16):
                      weights[off + 192 + j] = (((u32() >> 24) % 31) - 15) & 0xff
                  # Exact binary16 0.03125, kept finite and identical on both OSes.
                  weights[off + 208:off + 210] = struct.pack('<H', 0x2800)

          activations = bytearray(NV * act_bytes)
          for v in range(NV):
              for ib in range(N // QK):
                  off = v * act_bytes + ib * BLOCK_Q8K
                  d = 0.00390625 * (1 + v + ib)
                  activations[off:off + 4] = struct.pack('<f', d)
                  qs = []
                  for j in range(QK):
                      q = int((u32() >> 24) % 255) - 127
                      qs.append(q)
                      activations[off + 4 + j] = q & 0xff
                  bs_off = off + 4 + QK
                  for group in range(QK // 16):
                      s = sum(qs[group * 16:(group + 1) * 16])
                      activations[bs_off + 2 * group:bs_off + 2 * group + 2] = struct.pack('<h', s)

          lib = ctypes.CDLL(os.environ['QWEN_PORTABLE_LIB'])
          U8P = ctypes.POINTER(ctypes.c_uint8)
          F32P = ctypes.POINTER(ctypes.c_float)
          lib.qwen_q6_pool_create.argtypes = [ctypes.c_int, ctypes.c_size_t, ctypes.c_size_t]
          lib.qwen_q6_pool_create.restype = ctypes.c_void_p
          lib.qwen_q6_pool_destroy.argtypes = [ctypes.c_void_p]
          lib.qwen_q6_pool_destroy.restype = None
          lib.qwen_q6_pool_matvec_many.argtypes = [
              ctypes.c_void_p, U8P, ctypes.c_size_t, ctypes.c_size_t, ctypes.c_size_t,
              U8P, ctypes.c_size_t, ctypes.c_size_t, F32P,
          ]
          lib.qwen_q6_pool_matvec_many.restype = ctypes.c_int
          lib.qwen_matvec_many_q6_k_q8_k_bridge.argtypes = [
              U8P, ctypes.c_size_t, ctypes.c_size_t, ctypes.c_size_t,
              U8P, ctypes.c_size_t, ctypes.c_size_t, F32P,
          ]
          lib.qwen_matvec_many_q6_k_q8_k_bridge.restype = ctypes.c_int

          W = (ctypes.c_uint8 * len(weights)).from_buffer(weights)
          A = (ctypes.c_uint8 * len(activations)).from_buffer(activations)
          Ref = ctypes.c_float * (NV * ROWS)
          ref = Ref()
          cand = Ref()
          rc = lib.qwen_matvec_many_q6_k_q8_k_bridge(
              W, len(weights), ROWS, N, A, act_bytes, NV, ref)
          if rc != 0:
              raise SystemExit(f'direct Q6 bridge rc={rc}')
          pool = lib.qwen_q6_pool_create(2, ROWS, NV)
          if not pool:
              raise SystemExit('Q6 pool create failed')
          try:
              rc = lib.qwen_q6_pool_matvec_many(
                  pool, W, len(weights), ROWS, N, A, act_bytes, NV, cand)
          finally:
              lib.qwen_q6_pool_destroy(pool)
          if rc != 0:
              raise SystemExit(f'pooled Q6 bridge rc={rc}')
          ref_bytes = ctypes.string_at(ctypes.addressof(ref), ctypes.sizeof(ref))
          cand_bytes = ctypes.string_at(ctypes.addressof(cand), ctypes.sizeof(cand))
          if cand_bytes != ref_bytes:
              raise SystemExit('2-worker pool differs from direct Q6 bridge')
          digest = hashlib.sha256(ref_bytes).hexdigest()
          print(f'QWEN38_Q6_CROSS_PLATFORM_SHA256 {digest}')
          print('QWEN38_Q6_CROSS_PLATFORM_FINGERPRINT_PASS')
          PY
