name: Shadow Slave Chapter 1 Render Review V2

on:
  push:
    branches:
      - trial/shadow-slave-chapter-1
    paths:
      - .github/workflows/shadow-slave-1-render-review-v2.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: shadow-slave-1-human-loop
  cancel-in-progress: false

jobs:
  render-review-v2:
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    env:
      CHAPTER_ID: c0010001
      TRANSLATION_RUN_ID: "34371649065"
      TRANSLATION_ARTIFACT: 04-translation-review-c0010001
      PRIMARY_DIALOGUE_FONT: Mac-dinh-3
      FREE_TEXT_FONT: Manga-fonts
      SYSTEM_FONT: Shadow-fonts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install production render runtime
        run: |
          python -m pip install \
            Pillow==10.4.0 numpy==1.26.4 opencv-contrib-python==4.10.0.84 \
            fastapi==0.115.0 pydantic==2.9.2 filelock==3.16.1 loguru==0.7.2 \
            fonttools==4.59.2

      - name: Restore reviewed translation checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf checkpoint/04-translation-review
          mkdir -p checkpoint/04-translation-review
          gh run download "$TRANSLATION_RUN_ID" -n "$TRANSLATION_ARTIFACT" -D checkpoint/04-translation-review
          test -f checkpoint/04-translation-review/processed/manifest.json
          test -f checkpoint/04-translation-review/translation-review-summary.json
          test -d checkpoint/04-translation-review/raw

      - name: Validate translation gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('checkpoint/04-translation-review/translation-review-summary.json').read_text(encoding='utf-8'))
          expected={'status':'PASS','active_story_objects':101,'translated_story_objects':101,'active_untranslated_story_objects':0,'persistent_tombstones':319}
          for k,v in expected.items():
              if s.get(k)!=v: raise SystemExit(f'translation gate {k}: expected {v}, got {s.get(k)}')
          print('TRANSLATION GATE PASS')
          PY

      - name: Restore production chapter layout
        run: |
          python - <<'PY'
          import json, shutil
          from pathlib import Path
          cid='c0010001'; root=Path('checkpoint/04-translation-review')
          raw_dst=Path('data/raw')/cid; proc_dst=Path('data/processed')/cid; out_dst=Path('data/output')/cid
          for dst in (raw_dst,proc_dst,out_dst):
              if dst.exists(): shutil.rmtree(dst)
              dst.parent.mkdir(parents=True,exist_ok=True)
          shutil.copytree(root/'raw',raw_dst)
          shutil.copytree(root/'processed',proc_dst)
          out_dst.mkdir(parents=True,exist_ok=True)
          mp=proc_dst/'manifest.json'; m=json.loads(mp.read_text(encoding='utf-8'))
          if len(m.get('pages') or [])!=135: raise SystemExit(f'expected 135 slices, got {len(m.get("pages") or [])}')
          for p in m.get('pages') or []:
              op=Path(str(p.get('original') or '')); cp=Path(str(p.get('clean') or ''))
              if op.name: p['original']=(raw_dst/'sliced'/op.name).as_posix()
              if cp.name: p['clean']=str((proc_dst/cp.name).resolve())
          mp.write_text(json.dumps(m,ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - name: Apply semantic typography with glyph-safe fallback
        run: |
          python - <<'PY'
          import json, os
          from collections import Counter
          from pathlib import Path
          from fontTools.ttLib import TTFont

          cid='c0010001'; font_dir=Path('app/static/fonts')
          primary=os.environ['PRIMARY_DIALOGUE_FONT']; free_font=os.environ['FREE_TEXT_FONT']; system_font=os.environ['SYSTEM_FONT']
          mp=Path('data/processed')/cid/'manifest.json'; m=json.loads(mp.read_text(encoding='utf-8'))
          files=sorted(font_dir.glob('*.ttf'))
          if len(files)!=15: raise SystemExit(f'expected 15 TTF fonts, got {len(files)}')
          cmaps={}; audit={}
          probe='ăâêôơưđĂÂÊÔƠƯĐáàảãạấầẩẫậắằẳẵặéèẻẽẹếềểễệíìỉĩịóòỏõọốồổỗộớờởỡợúùủũụứừửữựýỳỷỹỵÁÀẢÃẠẤẦẨẪẬẮẰẲẴẶÉÈẺẼẸẾỀỂỄỆÍÌỈĨỊÓÒỎÕỌỐỒỔỖỘỚỜỞỠỢÚÙỦŨỤỨỪỬỮỰÝỲỶỸỴ'
          for fp in files:
              f=TTFont(fp,lazy=True); cmap=set((f.getBestCmap() or {}).keys()); f.close()
              cmaps[fp.stem]=cmap
              missing=''.join(ch for ch in probe if ord(ch) not in cmap)
              audit[fp.stem]={'vietnamese_probe':'PASS' if not missing else 'PARTIAL','missing_probe_chars':missing}
          for name in (primary,free_font,system_font):
              if name not in cmaps: raise SystemExit(f'missing configured font {name}')
          if audit[primary]['vietnamese_probe']!='PASS': raise SystemExit(f'primary Vietnamese probe failed: {audit[primary]}')
          def supports(name,text): return all(ch.isspace() or ord(ch) in cmaps[name] for ch in text)

          usage=Counter(); roles=Counter(); fallbacks=[]; assignments=[]
          for pi,p in enumerate(m.get('pages') or []):
              for obj in p.get('text_objects') or []:
                  if obj.get('source_missing') or obj.get('human_review')!='keep_story': continue
                  oid=str(obj.get('id') or ''); vi=str(obj.get('translation') or '').strip(); role=str(obj.get('role') or 'dialogue')
                  if not vi: raise SystemExit(f'blank translation page={pi} id={oid}')
                  roles[role]+=1
                  preferred=system_font if role=='system' else free_font if role=='free_text' else primary
                  chosen=preferred
                  if not supports(chosen,vi):
                      if not supports(primary,vi):
                          bad=''.join(sorted({c for c in vi if not c.isspace() and ord(c) not in cmaps[primary]}))
                          raise SystemExit(f'primary exact glyph failure id={oid}: {bad}')
                      chosen=primary
                      fallbacks.append({'page_index':pi,'id':oid,'role':role,'preferred':preferred,'fallback':primary})
                  style=obj.setdefault('style',{})
                  style.update({'font':chosen,'fontSize':'auto','color':'auto','strokeWidth':'auto','strokeColor':'auto','bgColor':'transparent','cornerRadius':'0','horizontalAlign':'center','verticalAlign':'middle','bold':False})
                  obj['human_typeset_class']=role; obj['human_typeset_font']=chosen; obj['human_typeset_reason']='semantic_role_consistency' if chosen==preferred else 'glyph_safe_primary_fallback'
                  usage[chosen]+=1
                  assignments.append({'page_index':pi,'source_page':p.get('source_page'),'slice_index':p.get('slice_index'),'id':oid,'role':role,'font':chosen,'preferred_font':preferred,'translation':vi,'region':obj.get('region')})
          if len(assignments)!=101: raise SystemExit(f'expected 101 styled objects, got {len(assignments)}')
          summary={'status':'PLAN_READY_PENDING_RENDER_VISUAL_REVIEW','active_story_objects':101,'primary_dialogue_font':primary,'semantic_preferences':{'dialogue':primary,'narration':primary,'free_text':free_font,'system':system_font},'font_usage':dict(usage),'distinct_fonts_used':len(usage),'forced_font_diversity':False,'role_counts':dict(roles),'fallbacks':fallbacks,'bundled_font_audit':audit}
          m['human_typeset_review']=summary; mp.write_text(json.dumps(m,ensure_ascii=False,indent=2),encoding='utf-8')
          Path('typography-plan.json').write_text(json.dumps({'chapter_id':cid,**summary,'assignments':assignments},ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({k:v for k,v in summary.items() if k not in {'bundled_font_audit','fallbacks'}},ensure_ascii=False,indent=2))
          PY

      - name: Production render and 43-page export
        run: |
          python - <<'PY'
          import json, zipfile
          from pathlib import Path
          from PIL import Image
          from app.routers.export import render_chapter, export_chapter
          cid='c0010001'; result=render_chapter(cid); stats=result.get('chapter_render') or {}
          if stats.get('total')!=135 or stats.get('skipped')!=0: raise SystemExit(f'render stats mismatch: {stats}')
          export_chapter(cid)
          out=Path('data/output')/cid; slice_paths=sorted(out.glob('page_*.png'))
          if len(slice_paths)!=135: raise SystemExit(f'expected 135 rendered slices, got {len(slice_paths)}')
          zp=out/f'chapter_{cid}.zip'
          with zipfile.ZipFile(zp) as z:
              names=sorted(n for n in z.namelist() if n.lower().endswith('.png'))
              if len(names)!=43: raise SystemExit(f'expected 43 final pages, got {len(names)}')
              if z.testzip(): raise SystemExit('production export ZIP integrity failure')
              for n in names:
                  with z.open(n) as src, Image.open(src) as im:
                      if im.width<=0 or im.height<=0: raise SystemExit(f'invalid image {n}')
          print(json.dumps({'render_stats':stats,'rendered_slices':135,'final_source_pages':43},ensure_ascii=False,indent=2))
          PY

      - name: Build full render checkpoint and compact visual pack
        run: |
          python - <<'PY'
          import json, math, shutil, zipfile
          from collections import defaultdict
          from pathlib import Path
          from PIL import Image, ImageDraw

          cid='c0010001'; proc=Path('data/processed')/cid; out=Path('data/output')/cid
          review=Path('checkpoint/05-render-review-v2'); visual=Path('checkpoint/05-render-visual-v2')
          for d in (review,visual):
              if d.exists(): shutil.rmtree(d)
              d.mkdir(parents=True)
          final=review/'final-pages'; final.mkdir()
          zp=out/f'chapter_{cid}.zip'
          with zipfile.ZipFile(zp) as z: z.extractall(final)
          finals=sorted(final.glob('*.png'))
          if len(finals)!=43: raise SystemExit(f'final page count {len(finals)}')
          shutil.copy2(proc/'manifest.json',review/'manifest.json'); shutil.copy2('typography-plan.json',review/'typography-plan.json'); shutil.copy2(zp,review/'Shadow-Slave-Chapter-1-VI-RENDER-REVIEW.zip')
          m=json.loads((proc/'manifest.json').read_text(encoding='utf-8')); tp=json.loads(Path('typography-plan.json').read_text(encoding='utf-8')); assignments=tp['assignments']
          summary={'checkpoint':'05-render-review','revision':2,'chapter_id':cid,'slices':135,'source_pages':43,'active_story_objects':101,'active_untranslated_story_objects':0,'persistent_tombstones':319,'font_usage':tp.get('font_usage'),'semantic_preferences':tp.get('semantic_preferences'),'forced_font_diversity':False,'status':'TECHNICAL_PASS_PENDING_HUMAN_VISUAL_REVIEW','next_action':'STOP_FOR_HUMAN_VISUAL_REVIEW'}
          (review/'render-review-summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8'); (visual/'render-review-summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8'); shutil.copy2('typography-plan.json',visual/'typography-plan.json')

          # Full final page thumbnails, six per sheet.
          od=visual/'overview'; od.mkdir()
          for start in range(0,43,6):
              cards=[]
              for idx,pth in enumerate(finals[start:start+6],start):
                  with Image.open(pth) as im0:
                      im=im0.convert('RGB'); sc=min(1.0,280/im.width); im=im.resize((int(im.width*sc),int(im.height*sc)))
                      card=Image.new('RGB',(im.width,im.height+34),'white'); ImageDraw.Draw(card).text((6,7),f'source {idx:02d} {pth.name}',fill='black'); card.paste(im,(0,34)); cards.append(card)
              sheet=Image.new('RGB',(sum(c.width for c in cards),max(c.height for c in cards)),'white'); x=0
              for c in cards: sheet.paste(c,(x,0)); x+=c.width
              sheet.save(od/f'overview_{start//6+1:02d}.jpg',quality=86,optimize=True)

          # 101 rendered object crops.
          rendered=sorted(out.glob('page_*.png')); crop_cards=[]; crop_index=[]
          for n,a in enumerate(assignments):
              pi=int(a['page_index']); r=a.get('region') or {}
              with Image.open(rendered[pi]) as im0:
                  im=im0.convert('RGB'); w,h=im.size; x1=max(0,int(r['x1'])-100); y1=max(0,int(r['y1'])-100); x2=min(w,int(r['x2'])+100); y2=min(h,int(r['y2'])+100)
                  crop=im.crop((x1,y1,x2,y2)); sc=min(1.0,680/crop.width,400/crop.height); crop=crop.resize((max(1,int(crop.width*sc)),max(1,int(crop.height*sc))))
                  card=Image.new('RGB',(740,490),'white'); card.paste(crop,((740-crop.width)//2,78+(400-crop.height)//2)); d=ImageDraw.Draw(card); d.multiline_text((8,8),f"#{n:03d} p{pi:03d} src{a.get('source_page')} {a.get('role')} font={a.get('font')}\n{a.get('id')}",fill='black',spacing=3); crop_cards.append(card); crop_index.append({'card':n,**a,'crop':[x1,y1,x2,y2]})
          cd=visual/'object-crops'; cd.mkdir()
          for start in range(0,len(crop_cards),8):
              sheet=Image.new('RGB',(1480,1960),'white')
              for j,c in enumerate(crop_cards[start:start+8]): sheet.paste(c,((j%2)*740,(j//2)*490))
              sheet.save(cd/f'crops_{start//8+1:02d}.jpg',quality=88,optimize=True)
          (visual/'object-crop-index.json').write_text(json.dumps(crop_index,ensure_ascii=False,indent=2),encoding='utf-8')

          # 92 stitch seams from core source boundaries.
          bysrc=defaultdict(list)
          for p in m.get('pages') or []: bysrc[int(p.get('source_page'))].append(p)
          seam_cards=[]; seam_index=[]
          for sp,pages in sorted(bysrc.items()):
              pages=sorted(pages,key=lambda p:int(p.get('slice_index') or 0))
              with Image.open(finals[sp]) as im0:
                  src=im0.convert('RGB'); w,h=src.size
                  for p in pages[:-1]:
                      core=p.get('stitch_core') or {}; sy=int(core.get('core_source_y2') or 0)
                      if not 0<sy<h: continue
                      y1=max(0,sy-130); y2=min(h,sy+130); crop=src.crop((0,y1,w,y2)); sc=min(1.0,1000/crop.width); crop=crop.resize((int(crop.width*sc),int(crop.height*sc)))
                      card=Image.new('RGB',(1040,crop.height+48),'white'); card.paste(crop,(20,48)); d=ImageDraw.Draw(card); d.text((8,8),f"source {sp:02d} seam after slice {p.get('slice_index')} y={sy}",fill='black'); gy=48+int((sy-y1)*sc); d.line((20,gy,20+crop.width,gy),fill='black',width=1); seam_cards.append(card); seam_index.append({'source_page':sp,'after_slice':p.get('slice_index'),'source_y':sy})
          if len(seam_index)!=92: raise SystemExit(f'expected 92 seams, got {len(seam_index)}')
          sd=visual/'seams'; sd.mkdir()
          for start in range(0,len(seam_cards),6):
              batch=seam_cards[start:start+6]; sheet=Image.new('RGB',(max(c.width for c in batch),sum(c.height for c in batch)),'white'); y=0
              for c in batch: sheet.paste(c,(0,y)); y+=c.height
              sheet.save(sd/f'seams_{start//6+1:02d}.jpg',quality=88,optimize=True)
          (visual/'seam-index.json').write_text(json.dumps(seam_index,ensure_ascii=False,indent=2),encoding='utf-8')
          vs={**summary,'overview_sheets':8,'object_crop_sheets':13,'reviewed_object_candidates':101,'seam_count':92,'seam_sheets':16}
          (visual/'visual-pack-summary.json').write_text(json.dumps(vs,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(vs,ensure_ascii=False,indent=2))
          PY

      - name: Upload render review checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: 05-render-review-v2-c0010001
          path: checkpoint/05-render-review-v2
          if-no-files-found: error
          retention-days: 7

      - name: Upload compact visual review pack
        uses: actions/upload-artifact@v4
        with:
          name: 05-render-visual-v2-c0010001
          path: checkpoint/05-render-visual-v2
          if-no-files-found: error
          retention-days: 7
