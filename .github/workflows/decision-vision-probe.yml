name: Decision model vision probe

on:
  push:
    branches: [claude/friendly-hypatia-xi865r]
    paths: [".github/workflows/decision-vision-probe.yml"]
  workflow_dispatch:
    inputs:
      models:
        description: "Model ids separated by spaces; empty tries both Perplexity deciders"
        required: false

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ask each decider whether cleaned crops still show text
        env:
          MINIROUTER_API_KEY: ${{ secrets.MINIROUTER_API_KEY }}
          MODELS: ${{ github.event.inputs.models }}
        run: |
          mkdir -p audit-results/decision-probe
          python3 -m pip install -q pillow
          git fetch -q origin audit-evidence
          python3 - <<'PY'
          import base64, io, json, os, subprocess, time, urllib.request
          from concurrent.futures import ThreadPoolExecutor
          from PIL import Image
          base, key = "https://api.minirouter.sh/v1", os.environ["MINIROUTER_API_KEY"]
          out = "audit-results/decision-probe"
          models = os.environ.get("MODELS", "").split() or ["perplexity/pplx-decider-v1.2", "perplexity/pplx-decider-flash-v1.2"]

          def blob(path):
              return Image.open(io.BytesIO(subprocess.check_output(["git", "show", f"FETCH_HEAD:{path}"]))).convert("RGB")

          def data_url(img):
              # Requests must stay under 32 KiB, so shrink until the JPEG fits.
              side, quality = 768, 80
              while True:
                  im = img.copy()
                  im.thumbnail((side, side))
                  buf = io.BytesIO()
                  im.save(buf, "JPEG", quality=quality)
                  if len(buf.getvalue()) < 20000:
                      return "data:image/jpeg;base64," + base64.b64encode(buf.getvalue()).decode()
                  side, quality = int(side * 0.85), max(50, quality - 5)

          items = []
          # Hand labels: does the cleaned half still show letters, and can they be read.
          hand = {"final/shadow-slave-1/leftovers/01-slice003-ghost.jpg": "ghost",
                  "final/shadow-slave-1/leftovers/02-slice087-text.jpg": "text",
                  "noluna/shadow-slave-1/leftovers/03-slice133-text.jpg": "clean",
                  "final/solo-swordmaster-1/leftovers/01-slice055-text.jpg": "text",
                  "final/the-world-after-the-end-254/leftovers/01-slice048-text.jpg": "clean",
                  "luna/the-hero-cannot-rest-1/leftovers/01-slice061-text.jpg": "ghost",
                  "luna/the-hero-cannot-rest-1/leftovers/02-slice132-ghost.jpg": "ghost",
                  "sov-luna/solo-swordmaster-1/leftovers/01-slice127-ghost.jpg": "ghost",
                  "transcript/solo-swordmaster-1/leftovers/02-slice102-text.jpg": "text",
                  "readme-peppercarrot/en-ep38_The-Healer.html/leftovers/01-slice003-ghost.jpg": "clean"}
          for name, label in hand.items():
              img = blob("audit-results/ai-cost/" + name)
              w, h = img.size
              raw_label = "clean" if "world-after" in name else "text"
              items.append({"set": "leftover-raw", "name": name, "label": raw_label, "img": img.crop((0, 0, w // 2 - 8, h))})
              items.append({"set": "leftover-clean", "name": name, "label": label, "img": img.crop((w // 2 + 8, 0, w, h))})
          rows = json.loads(subprocess.check_output(["git", "show", "FETCH_HEAD:audit-results/flow-bench/summary.json"]))["rows"]
          for row in rows:
              img = blob("audit-results/flow-bench/blocks/" + row["block"])
              w, h = img.size
              third = w // 3
              # The top band holds the panel captions, which must not be read as text.
              items.append({"set": "bench-raw", "name": row["block"], "label": "text", "img": img.crop((3, 26, third - 3, h))})
              items.append({"set": "bench-clean", "name": row["block"], "label": "text" if row["left_current"] else "clean",
                            "img": img.crop((third + 3, 26, 2 * third - 3, h))})
          for it in items:
              it["url"] = data_url(it.pop("img"))
          print("items:", len(items))

          questions = {"any": {"type": "boolean", "instructions": "Are there any letters, words or parts of letters visible in this image, even faint or smeared?"},
                       "read": {"type": "boolean", "instructions": "Is there text in this image that a reader could still read?"}}

          def ask(model, it):
              body = json.dumps({"model": model, "state": [{"type": "image_url", "image_url": {"url": it["url"]}}], "questions": questions}).encode()
              req = urllib.request.Request(base + "/evaluate", data=body, headers={"Authorization": f"Bearer {key}", "Content-Type": "application/json"})
              t = time.time()
              try:
                  with urllib.request.urlopen(req, timeout=120) as r:
                      reply = json.loads(r.read())
                  a = reply["answers"]
                  return {"any": a["any"]["probability"], "read": a["read"]["probability"], "usage": reply.get("usage"), "seconds": round(time.time() - t, 2)}
              except Exception as e:
                  return {"error": f"{e} {e.read().decode()[:300] if hasattr(e, 'read') else ''}"}

          report = {}
          for model in models:
              t = time.time()
              with ThreadPoolExecutor(8) as pool:
                  answers = list(pool.map(lambda it: ask(model, it), items))
              rows_out = [{k: v for k, v in it.items() if k != "url"} | a for it, a in zip(items, answers)]
              summary = {"seconds": round(time.time() - t, 1), "errors": sum("error" in a for a in answers),
                         "input_tokens": sum((a.get("usage") or {}).get("inputTokens", 0) for a in answers)}
              for s in ("leftover-raw", "leftover-clean", "bench-raw", "bench-clean"):
                  part = [r for r in rows_out if r["set"] == s and "error" not in r]
                  for q in ("any", "read"):
                      tp = sum(r[q] >= 0.5 and r["label"] != "clean" for r in part)
                      fn = sum(r[q] < 0.5 and r["label"] != "clean" for r in part)
                      fp = sum(r[q] >= 0.5 and r["label"] == "clean" for r in part)
                      tn = sum(r[q] < 0.5 and r["label"] == "clean" for r in part)
                      summary[f"{s}/{q}"] = {"tp": tp, "fn": fn, "fp": fp, "tn": tn}
              report[model] = summary
              print(model, json.dumps(summary, indent=1))
              json.dump(rows_out, open(f"{out}/{model.split('/')[-1]}.json", "w"), indent=1)
          json.dump(report, open(f"{out}/summary.json", "w"), indent=1)
          PY
      - if: always()
        uses: ./.github/actions/save-evidence
        with:
          paths: audit-results/decision-probe
          message: "audit: decider residue probe (run ${{ github.run_id }})"
