name: Research production Docker build

on:
  push:
    branches:
      - feat/ppocrv6-runtime-migration
    paths:
      - .github/workflows/research-docker-build.yml
      - Dockerfile
      - requirements.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7

      - name: Build production image
        run: docker build --pull -t manga-translator:research .

      - name: Validate image runtime and dependency contract
        run: |
          docker run --rm -i --entrypoint python manga-translator:research - <<'PY'
          import sys
          from importlib import metadata

          import chardet
          import cv2
          import paddle
          import paddleocr
          import requests
          import torch
          from playwright.sync_api import sync_playwright

          distributions = {
              (dist.metadata.get('Name') or '').strip().lower()
              for dist in metadata.distributions()
              if (dist.metadata.get('Name') or '').strip()
          }
          opencv_dists = sorted(name for name in distributions if name.startswith('opencv-'))
          nvidia_dists = sorted(name for name in distributions if name.startswith('nvidia-'))
          assert sys.version_info[:2] == (3, 12), sys.version
          assert opencv_dists == ['opencv-contrib-python'], opencv_dists
          assert requests.__version__ == '2.32.3', requests.__version__
          assert chardet.__version__ == '5.2.0', chardet.__version__
          assert paddle.__version__ == '3.2.2', paddle.__version__
          assert paddleocr.__version__ == '3.7.0', paddleocr.__version__
          assert torch.__version__.startswith('2.5.1'), torch.__version__
          assert torch.version.cuda is None, torch.version.cuda
          assert not nvidia_dists, nvidia_dists
          with sync_playwright() as playwright:
              browser = playwright.chromium.launch(headless=True)
              page = browser.new_page()
              page.set_content('<title>manga-translator-smoke</title>')
              assert page.title() == 'manga-translator-smoke'
              browser.close()
          print('DOCKER_OCR_RUNTIME', {
              'python': sys.version.split()[0],
              'opencv': cv2.__version__,
              'opencv_distributions': opencv_dists,
              'requests': requests.__version__,
              'chardet': chardet.__version__,
              'paddle': paddle.__version__,
              'paddleocr': paddleocr.__version__,
              'torch': torch.__version__,
              'torch_cuda': torch.version.cuda,
              'nvidia_distributions': nvidia_dists,
              'chromium_launch': 'ok',
          })
          PY
          docker run --rm --entrypoint python manga-translator:research -m pip check

      - name: Validate non-root production user
        run: |
          test "$(docker image inspect manga-translator:research --format '{{.Config.User}}')" = "appuser"
          docker run --rm --entrypoint sh manga-translator:research -c 'test "$(id -u)" != "0" && python -m compileall -q app run.py'
