name: Apply perf adaptive OCR edge recrop

on:
  push:
    branches:
      - perf/bubble-fastpath-roi-lama
    paths:
      - .github/workflows/apply-perf-ocr-adaptive-edge-recrop.yml

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  apply-source:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/bubble-fastpath-roi-lama
          fetch-depth: 0

      - name: Refuse stale branch mutation
        run: |
          remote_head="$(git ls-remote origin refs/heads/perf/bubble-fastpath-roi-lama | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"

      - name: Apply adaptive edge recrop
        run: |
          python - <<'PY'
          from pathlib import Path

          service_path = Path('app/ocr/service.py')
          service = service_path.read_text(encoding='utf-8')
          old = '''OCR_EDGE_RECROP_EXTRA_PADDING = 24


def _expand_ocr_crop_bounds(
    image_shape: tuple[int, ...],
    crop_bounds: tuple[int, int, int, int],
    extra_padding: int = OCR_EDGE_RECROP_EXTRA_PADDING,
) -> tuple[int, int, int, int]:
'''
          new = '''OCR_EDGE_RECROP_EXTRA_PADDINGS = (24, 48, 96)


def _expand_ocr_crop_bounds(
    image_shape: tuple[int, ...],
    crop_bounds: tuple[int, int, int, int],
    extra_padding: int = OCR_EDGE_RECROP_EXTRA_PADDINGS[0],
) -> tuple[int, int, int, int]:
'''
          if old not in service:
              raise SystemExit('edge padding constant block not found')
          service = service.replace(old, new, 1)

          anchor = '''def _normalized_ocr_lines(text: str) -> tuple[str, ...]:
'''
          helper = '''def _edge_recrop_bounds_sequence(
    image_shape: tuple[int, ...],
    crop_bounds: tuple[int, int, int, int],
) -> tuple[tuple[int, int, int, int], ...]:
    """Return distinct, bounded OCR-only retries from the original crop.

    The schedule grows only after a crop-edge quality signal. Keeping every
    retry anchored to the original crop prevents accidental cumulative growth.
    """
    seen = {tuple(int(v) for v in crop_bounds)}
    bounds = []
    for extra_padding in OCR_EDGE_RECROP_EXTRA_PADDINGS:
        expanded = _expand_ocr_crop_bounds(
            image_shape, crop_bounds, extra_padding=extra_padding
        )
        if expanded in seen:
            continue
        seen.add(expanded)
        bounds.append(expanded)
    return tuple(bounds)


'''
          if anchor not in service:
              raise SystemExit('normalized lines anchor not found')
          service = service.replace(anchor, helper + anchor, 1)

          start = service.index('            recrop_attempted = False\n            if quality_reason == "crop-edge-text":\n')
          end = service.index('\n            self._result_local.metadata = {', start)
          replacement = '''            recrop_attempted = False
            if quality_reason == "crop-edge-text":
                initial_crop_bounds = crop_bounds
                for expanded_bounds in _edge_recrop_bounds_sequence(
                    image.shape, initial_crop_bounds
                ):
                    ex1, ey1, ex2, ey2 = expanded_bounds
                    expanded_crop = image[ey1:ey2, ex1:ex2]
                    if not expanded_crop.size:
                        continue
                    recrop_attempted = True
                    expanded_rgb = cv2.cvtColor(expanded_crop, cv2.COLOR_BGR2RGB)
                    try:
                        expanded_result = detailed_reader(
                            expanded_rgb, lang, target_mode=target_mode
                        )
                    except TypeError:
                        expanded_result = detailed_reader(expanded_rgb, lang)
                    expanded_text = str(
                        getattr(expanded_result, "text", "") or ""
                    ).strip()
                    expanded_coverage = self._mask_text_coverage(
                        box_snapshot, expanded_bounds, expanded_result
                    )
                    expanded_checked = classify_ocr_quality(
                        expanded_text,
                        lang,
                        confidence=getattr(expanded_result, "confidence", None),
                        coverage=expanded_coverage,
                    )
                    expanded_quality, expanded_reason = self._conservative_quality(
                        str(
                            getattr(expanded_result, "quality", "unknown")
                            or "unknown"
                        ),
                        getattr(expanded_result, "quality_reason", None),
                        expanded_checked.status,
                        expanded_checked.reason,
                    )
                    if not _prefer_edge_recrop(
                        base_text=text,
                        base_quality=quality,
                        base_reason=quality_reason,
                        base_confidence=getattr(result, "confidence", None),
                        base_region_count=int(
                            getattr(result, "region_count", 0) or 0
                        ),
                        expanded_text=expanded_text,
                        expanded_quality=expanded_quality,
                        expanded_reason=expanded_reason,
                        expanded_confidence=getattr(
                            expanded_result, "confidence", None
                        ),
                        expanded_region_count=int(
                            getattr(expanded_result, "region_count", 0) or 0
                        ),
                    ):
                        continue
                    result = expanded_result
                    text = expanded_text
                    crop_bounds = expanded_bounds
                    coverage = expanded_coverage
                    quality = expanded_quality
                    quality_reason = expanded_reason
                    if quality_reason != "crop-edge-text":
                        break
'''
          service = service[:start] + replacement + service[end:]
          service_path.write_text(service, encoding='utf-8')

          test_path = Path('tests/test_ocr_pipeline_regressions.py')
          tests = test_path.read_text(encoding='utf-8')
          tests = tests.replace(
              '    _expand_ocr_crop_bounds,\n',
              '    _edge_recrop_bounds_sequence,\n    _expand_ocr_crop_bounds,\n',
              1,
          )
          test_anchor = '''def test_edge_recrop_bounds_add_only_bounded_context():
    assert _expand_ocr_crop_bounds((100, 120, 3), (10, 20, 80, 90)) == (0, 0, 104, 100)


'''
          test_extra = '''def test_edge_recrop_bounds_sequence_grows_from_original_crop_without_cumulative_drift():
    assert _edge_recrop_bounds_sequence(
        (400, 500, 3), (100, 100, 200, 200)
    ) == (
        (76, 76, 224, 224),
        (52, 52, 248, 248),
        (4, 4, 296, 296),
    )


def test_edge_recrop_bounds_sequence_deduplicates_page_clamped_retries():
    assert _edge_recrop_bounds_sequence(
        (100, 120, 3), (0, 0, 120, 100)
    ) == ()


'''
          if test_anchor not in tests:
              raise SystemExit('test anchor not found')
          tests = tests.replace(test_anchor, test_anchor + test_extra, 1)
          test_path.write_text(tests, encoding='utf-8')
          PY

      - name: Compile and run OCR regressions
        run: |
          python -m compileall -q app/ocr/service.py tests/test_ocr_pipeline_regressions.py
          python -m pip install -q numpy==1.26.4 opencv-python-headless==4.10.0.84 pytest==8.3.5 pydantic==2.9.2 filelock==3.16.1
          pytest -q tests/test_ocr_pipeline_regressions.py

      - name: Commit source only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/ocr/service.py tests/test_ocr_pipeline_regressions.py
          git diff --cached --check
          git commit -m "perf(ocr): adaptively widen edge-limited crops"
          git push origin HEAD:perf/bubble-fastpath-roi-lama
