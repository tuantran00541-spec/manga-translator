name: Qwen3.8 GGUF stream parser sanity

on:
  push:
    branches: [test/qwen3.8-27b]
    paths:
      - "research/qwen38/gguf_stream.py"
      - "research/qwen38/gguf_stream_sanity.py"
      - ".github/workflows/qwen38-gguf-stream-sanity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-gguf-directory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile parser gate
        run: |
          python -m py_compile \
            research/qwen38/gguf_stream.py \
            research/qwen38/gguf_stream_sanity.py
      - name: Run zero-model GGUF parser/layout gate
        working-directory: research/qwen38
        run: python gguf_stream_sanity.py
