name: Clean quality

on:
  push:
    paths:
      - "scripts/clean_quality_bench.py"
      - ".github/workflows/clean-quality.yml"
  workflow_dispatch:
    inputs:
      chapter_url:
        description: "Chapter to clean"
        required: false

permissions:
  contents: write

concurrency:
  group: clean-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: "."
      MANGA_PROCESSING_PIPELINE: fast
      MANGA_USE_DYNAMIC_LAMA: "1"
      MANGA_ORT_PROVIDER: openvino
      MANGA_ORT_REQUIRE_PROVIDER: "1"
      MANGA_ORT_OPENVINO_SCOPE: detectors
      MANGA_ORT_OPENVINO_THREADS: "2"
      MANGA_ORT_OPENVINO_STREAMS: "1"
      MANGA_ORT_OPENVINO_CACHE_DIR: /tmp/manga-openvino-cache
      OPENBLAS_NUM_THREADS: "1"
      CHAPTER_URL: ${{ github.event.inputs.chapter_url || 'https://asurascans.com/comics/the-academy-s-weapon-replicator-05c7df14/chapter/1' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install processing runtime
        run: |
          python -m pip install --only-binary :all: numpy==1.26.4 Pillow==10.4.0 opencv-contrib-python==4.10.0.84 \
            onnxruntime-openvino==1.24.1 psutil==6.1.1 loguru==0.7.2 requests==2.32.3 \
            beautifulsoup4==4.12.3 lxml==5.3.0 playwright==1.47.0 fastapi==0.115.0 \
            pydantic==2.9.2 filelock==3.16.1 python-multipart==0.0.12
          python -m playwright install --with-deps chromium
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "ultralytics>=8.4" huggingface_hub
          # ultralytics pulls opencv-python; the app needs the contrib build.
          python -m pip uninstall -y opencv-python opencv-python-headless || true
          python -m pip install --force-reinstall --no-deps opencv-contrib-python==4.10.0.84

      - name: Restore detector and inpaint models
        uses: actions/cache/restore@v4
        with:
          path: |
            models/*.onnx
            models/.e2e-provenance.json
          key: processing-profile-models-b224548-v1

      - name: Check the models are there
        run: |
          ls -la models
          test -f models/text_segmenter.onnx && test -f models/lama-manga-dynamic.onnx

      - name: Clean the same slices with each variant
        run: python scripts/clean_quality_bench.py "$CHAPTER_URL" --out audit-results/clean-quality --slices 16

      - name: Commit evidence to the branch
        if: always() && github.ref_name != github.event.repository.default_branch
        run: |
          test -f audit-results/clean-quality/report.json || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf /tmp/evidence && cp -r audit-results/clean-quality /tmp/evidence
          for i in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            git checkout -f -B evidence FETCH_HEAD
            rm -rf audit-results/clean-quality && cp -r /tmp/evidence audit-results/clean-quality
            git add -A audit-results/clean-quality
            git commit -m "audit: clean quality variants on a real chapter (run ${{ github.run_id }}) [skip ci]" || exit 0
            git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep 5
          done
