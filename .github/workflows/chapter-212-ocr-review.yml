name: Chapter 212 Checkpoint 03 OCR Review

on:
  push:
    branches:
      - trial/chapter-render-212
    paths:
      - .github/workflows/chapter-212-ocr-review.yml
  workflow_dispatch:
    inputs:
      clean_run_id:
        description: "Workflow run id that produced fixed clean checkpoint"
        required: false
        default: "34321124709"

permissions:
  contents: read
  actions: read

concurrency:
  group: chapter-212-human-loop
  cancel-in-progress: false

jobs:
  ocr-review:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
      CHAPTER_ID: c2120212
      CLEAN_RUN_ID: ${{ inputs.clean_run_id || '34321124709' }}
      CLEAN_ARTIFACT: 02-clean-review-fixed-c2120212
      MANGA_OCR_TARGET_SELECTION: centered
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install production OCR runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple torch==2.5.1+cpu torchvision==0.20.1+cpu
          python -m pip install -r requirements.txt

      - name: Restore fixed clean checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p checkpoint/02-clean-review-fixed
          gh run download "$CLEAN_RUN_ID" -n "$CLEAN_ARTIFACT" -D checkpoint/02-clean-review-fixed
          test -f checkpoint/02-clean-review-fixed/processed/manifest.json
          test -d checkpoint/02-clean-review-fixed/raw/sliced
          test -f checkpoint/02-clean-review-fixed/clean-review-report.json

      - name: Restore production chapter layout
        run: |
          python - <<'PY'
          import json, shutil
          from pathlib import Path

          chapter_id = 'c2120212'
          root = Path('checkpoint/02-clean-review-fixed')
          raw_dst = Path('data/raw') / chapter_id
          processed_dst = Path('data/processed') / chapter_id
          output_dst = Path('data/output') / chapter_id
          for dst in (raw_dst, processed_dst, output_dst):
              if dst.exists():
                  shutil.rmtree(dst)
              dst.parent.mkdir(parents=True, exist_ok=True)
          shutil.copytree(root / 'raw', raw_dst)
          shutil.copytree(root / 'processed', processed_dst)
          output_dst.mkdir(parents=True, exist_ok=True)

          manifest = json.loads((processed_dst / 'manifest.json').read_text(encoding='utf-8'))
          review = manifest.get('human_clean_review') or {}
          if review.get('status') != 'pass_after_repair':
              raise RuntimeError(f'clean checkpoint is not human-approved: {review}')
          if int(review.get('story_inpaint_blockers', -1)) != 0:
              raise RuntimeError(f'clean checkpoint still has blockers: {review}')
          print(f"restored {len(manifest.get('pages', []))} approved clean slices")
          PY

      - name: Create text objects and run production OCR
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          from collections import Counter, defaultdict
          from pathlib import Path

          from app.dependencies import ocr
          from app.manifest_utils import load_manifest_raw, save_manifest_raw
          from app.ocr.service import OCRService
          from app.optimized_pipeline import OptimizedChapterPipeline
          from app.text_objects import ensure_page_text_objects

          chapter_id = 'c2120212'
          pipeline = OptimizedChapterPipeline()
          manifest = load_manifest_raw(chapter_id)

          created = 0
          for page in manifest.get('pages', []):
              if page.get('skipped'):
                  continue
              n, _changed = ensure_page_text_objects(page)
              created += int(n)
          save_manifest_raw(chapter_id, manifest)

          service = OCRService(ocr, pipeline)
          manifest = load_manifest_raw(chapter_id)
          attempted = ok = failed = 0
          failures = []
          for pi, page in enumerate(manifest.get('pages', [])):
              if page.get('skipped'):
                  continue
              for obj in list(page.get('text_objects') or []):
                  oid = obj.get('id')
                  if not oid:
                      continue
                  attempted += 1
                  try:
                      service.group_text_object(chapter_id, pi, oid, 'en')
                      ok += 1
                  except Exception as exc:
                      failed += 1
                      failures.append({
                          'page_index': pi,
                          'id': oid,
                          'error_type': type(exc).__name__,
                          'error': str(exc)[:300],
                      })
                      print(f'OCR_FAIL page={pi} object={oid}: {type(exc).__name__}: {exc}')

          manifest = load_manifest_raw(chapter_id)
          rows = []
          normalized_occurrences = defaultdict(list)
          box_quality_counts = Counter()
          model_counts = Counter()
          empty_objects = []

          for pi, page in enumerate(manifest.get('pages', [])):
              if page.get('skipped'):
                  continue
              boxes_by_id = {
                  str(box.get('id')): box
                  for box in (page.get('boxes') or [])
                  if isinstance(box, dict) and box.get('id')
              }
              for obj in page.get('text_objects') or []:
                  text = str(obj.get('ocr_text') or obj.get('source_text') or obj.get('text') or '').strip()
                  source_box_meta = []
                  for box_id in obj.get('source_boxes') or []:
                      box = boxes_by_id.get(str(box_id), {})
                      quality = str(box.get('ocr_quality') or 'unknown')
                      model = str(box.get('ocr_model') or '')
                      box_quality_counts[quality] += 1
                      if model:
                          model_counts[model] += 1
                      source_box_meta.append({
                          'box_id': box_id,
                          'ocr_text': box.get('ocr_text') or '',
                          'confidence': box.get('ocr_confidence'),
                          'quality': quality,
                          'quality_reason': box.get('ocr_quality_reason'),
                          'model': model,
                          'orientation': box.get('ocr_orientation'),
                          'region_count': box.get('ocr_region_count'),
                      })
                  row = {
                      'page_index': pi,
                      'source_page': page.get('source_page'),
                      'slice_index': page.get('slice_index'),
                      'id': obj.get('id'),
                      'source_text': text,
                      'translation': obj.get('translation') or '',
                      'region': obj.get('region') or obj.get('bbox') or obj.get('rect'),
                      'source_boxes': obj.get('source_boxes') or [],
                      'source_box_meta': source_box_meta,
                      'ocr_source': obj.get('ocr_source'),
                      'ocr_lang': obj.get('ocr_lang'),
                      'ocr_engine': obj.get('ocr_engine'),
                      'ocr_quality': obj.get('ocr_quality'),
                      'ocr_quality_reason': obj.get('ocr_quality_reason'),
                      'auto_generated': obj.get('auto_generated'),
                      'origin': obj.get('origin'),
                  }
                  rows.append(row)
                  if not text:
                      empty_objects.append({'page_index': pi, 'id': obj.get('id')})
                  normalized = ' '.join(text.lower().split())
                  if normalized:
                      normalized_occurrences[normalized].append({'page_index': pi, 'id': obj.get('id'), 'text': text})

          duplicates = [
              {'normalized': key, 'occurrences': value}
              for key, value in normalized_occurrences.items()
              if len(value) > 1
          ]
          summary = {
              'checkpoint': '03-ocr-review',
              'chapter_id': chapter_id,
              'slices': len(manifest.get('pages', [])),
              'text_objects': len(rows),
              'created_text_objects': created,
              'ocr_attempted': attempted,
              'ocr_ok': ok,
              'ocr_failed': failed,
              'empty_objects': len(empty_objects),
              'duplicate_text_groups': len(duplicates),
              'box_quality_counts': dict(box_quality_counts),
              'ocr_models': dict(model_counts),
              'failures': failures,
              'next_action': 'STOP_FOR_HUMAN_OCR_REVIEW',
          }
          out = Path('checkpoint/03-ocr-review')
          out.mkdir(parents=True, exist_ok=True)
          (out / 'ocr-summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2), encoding='utf-8')
          (out / 'ocr-text.json').write_text(json.dumps(rows, ensure_ascii=False, indent=2), encoding='utf-8')
          (out / 'ocr-empty.json').write_text(json.dumps(empty_objects, ensure_ascii=False, indent=2), encoding='utf-8')
          (out / 'ocr-duplicates.json').write_text(json.dumps(duplicates, ensure_ascii=False, indent=2), encoding='utf-8')
          (out / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          if failed:
              raise RuntimeError(f'OCR technical failures: {failed}')
          PY

      - name: Pack OCR human-review checkpoint
        if: always()
        run: |
          mkdir -p checkpoint/03-ocr-review
          rm -rf checkpoint/03-ocr-review/raw checkpoint/03-ocr-review/processed
          cp -a "data/raw/${CHAPTER_ID}" checkpoint/03-ocr-review/raw || true
          cp -a "data/processed/${CHAPTER_ID}" checkpoint/03-ocr-review/processed || true
          cp checkpoint/02-clean-review-fixed/clean-review-report.json checkpoint/03-ocr-review/clean-review-report.json 2>/dev/null || true
          cat > checkpoint/03-ocr-review/HUMAN_CHECKPOINT.txt <<'EOF'
          CHECKPOINT: OCR REVIEW
          STOP here. Technical OCR success is not OCR correctness.
          Review source RAW crop + object region + OCR text + neighboring context.
          Drop duplicate fragments, credits/watermarks/noise and hallucinations persistently.
          Correct story text before translation. Do not proceed until active story OCR is curated.
          EOF

      - name: Upload OCR-review checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 03-ocr-review-c2120212
          path: checkpoint/03-ocr-review
          if-no-files-found: error
          retention-days: 7
