name: Qwen3.8 real Q6 GDN layer0 semantic gate

on:
  push:
    branches: [test/qwen3.8-27b]
    paths:
      - "research/qwen38/qwen35_gdn_quant_layer_gate.py"
      - "research/qwen38/llama_layer0_oracle.cpp"
      - "research/qwen38/gguf_stream.py"
      - "research/qwen38/gguf_k3_layout.py"
      - "research/qwen38/k3_stream.py"
      - "research/qwen38/gguf_quant_ref.py"
      - "research/qwen38/gguf_quant_dot.c"
      - ".github/workflows/qwen38-gdn-real-layer0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sanity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile layer gate
        run: |
          python -m py_compile \
            research/qwen38/gguf_stream.py \
            research/qwen38/gguf_k3_layout.py \
            research/qwen38/k3_stream.py \
            research/qwen38/gguf_quant_ref.py \
            research/qwen38/qwen35_gdn_quant_layer_gate.py
      - name: Run zero-model GDN execution sanity
        run: python research/qwen38/qwen35_gdn_quant_layer_gate.py sanity
      - name: Compile and run native quant regression
        shell: bash
        run: |
          set -euo pipefail
          cc -O2 -std=c11 -DQWEN_QUANT_DOT_SELFTEST \
            research/qwen38/gguf_quant_dot.c -lm -o "$RUNNER_TEMP/qwen-quant-selftest"
          "$RUNNER_TEMP/qwen-quant-selftest"

  real-layer0:
    needs: sanity
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[qwen-gdn-real]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      LLAMA_CPP_COMMIT: "557614e0296ff4a5b6f649737a65ae2076eea2fd"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Reclaim disk
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true
          docker system prune -af || true
          df -h
          free -h

      - name: Install download dependency
        run: python -m pip install --no-cache-dir huggingface_hub hf_xet

      - name: Download pinned gold GGUF once
        shell: bash
        run: |
          set -euo pipefail
          model="$(python - <<'PY'
          from huggingface_hub import hf_hub_download
          print(hf_hub_download(
              "bartowski/Qwen3.8-27B-GGUF",
              filename="Qwen3.8-27B-Q6_K_L.gguf",
              local_dir="${{ runner.temp }}/qwen38-model",
          ))
          PY
          )"
          test -f "$model"
          echo "MODEL=$model" >> "$GITHUB_ENV"
          ls -lh "$model"

      - name: Emit decoder inventory before risky validation
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/qwen38-gdn-layer0-evidence"
          mkdir -p "$evidence"
          python -u research/qwen38/qwen35_gdn_quant_layer_gate.py inventory \
            --model "$MODEL" \
            --output "$evidence/inventory.json" \
            2>&1 | tee "$evidence/inventory.log"

      - name: Build pinned llama.cpp layer0 oracle
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build
          llama="$RUNNER_TEMP/llama.cpp"
          mkdir -p "$llama"
          git -C "$llama" init
          git -C "$llama" remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C "$llama" fetch --depth 1 origin "$LLAMA_CPP_COMMIT"
          git -C "$llama" checkout --detach FETCH_HEAD
          test "$(git -C "$llama" rev-parse HEAD)" = "$LLAMA_CPP_COMMIT"

          mkdir -p "$llama/examples/qwen38-layer0-oracle"
          cp research/qwen38/llama_layer0_oracle.cpp \
            "$llama/examples/qwen38-layer0-oracle/qwen38_layer0_oracle.cpp"
          cat > "$llama/examples/qwen38-layer0-oracle/CMakeLists.txt" <<'EOF'
          set(TARGET llama-qwen38-layer0-oracle)
          add_executable(${TARGET} qwen38_layer0_oracle.cpp)
          target_link_libraries(${TARGET} PRIVATE llama)
          target_compile_features(${TARGET} PRIVATE cxx_std_17)
          EOF
          printf '\nadd_subdirectory(qwen38-layer0-oracle)\n' >> "$llama/examples/CMakeLists.txt"

          cmake -S "$llama" -B "$llama/build" -G Ninja \
            -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=ON \
            -DLLAMA_BUILD_EXAMPLES=ON \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build "$llama/build" --target llama-qwen38-layer0-oracle -j2
          test -x "$llama/build/bin/llama-qwen38-layer0-oracle"

      - name: Compile native quant bridge
        shell: bash
        run: |
          set -euo pipefail
          cc -O2 -std=c11 -fPIC -shared research/qwen38/gguf_quant_dot.c -lm \
            -o "$RUNNER_TEMP/libqwen_quant_dot.so"
          cc -O2 -std=c11 -DQWEN_QUANT_DOT_SELFTEST research/qwen38/gguf_quant_dot.c -lm \
            -o "$RUNNER_TEMP/qwen-quant-selftest"
          "$RUNNER_TEMP/qwen-quant-selftest"

      - name: Capture pinned llama.cpp layer0 oracle
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/qwen38-gdn-layer0-evidence"
          /usr/bin/time -v "$RUNNER_TEMP/llama.cpp/build/bin/llama-qwen38-layer0-oracle" \
            "$MODEL" "$evidence/oracle.json" \
            2>&1 | tee "$evidence/oracle.log"

      - name: Run custom K3 real Q6 layer0 semantic gate
        timeout-minutes: 25
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/qwen38-gdn-layer0-evidence"
          work="$RUNNER_TEMP/qwen38-k3-layer0"
          mkdir -p "$work"
          /usr/bin/time -v python -u research/qwen38/qwen35_gdn_quant_layer_gate.py run \
            --model "$MODEL" \
            --native-lib "$RUNNER_TEMP/libqwen_quant_dot.so" \
            --inventory "$evidence/inventory.json" \
            --oracle "$evidence/oracle.json" \
            --work-dir "$work" \
            --output "$evidence/layer0.json" \
            2>&1 | tee "$evidence/layer0.log"

      - name: Show evidence and cleanup
        if: always()
        shell: bash
        run: |
          evidence="$RUNNER_TEMP/qwen38-gdn-layer0-evidence"
          for f in inventory.json oracle.json layer0.json; do
            echo "=== $f ==="
            cat "$evidence/$f" 2>/dev/null || true
          done
          echo "=== log tails ==="
          tail -n 120 "$evidence/inventory.log" 2>/dev/null || true
          tail -n 120 "$evidence/oracle.log" 2>/dev/null || true
          tail -n 160 "$evidence/layer0.log" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/qwen38-model" "$RUNNER_TEMP/qwen38-k3-layer0" "$RUNNER_TEMP/llama.cpp" || true
          df -h
          free -h

      - name: Upload semantic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen38-gdn-real-layer0-${{ github.run_id }}
          path: ${{ runner.temp }}/qwen38-gdn-layer0-evidence/
          if-no-files-found: warn
          retention-days: 14
