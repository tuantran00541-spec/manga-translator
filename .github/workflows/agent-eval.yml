name: Agent eval

# Real-model runs of the Agent with every tool on, one job per model and scenario, with long timeouts.
on:
  push:
    branches-ignore: [main]
    paths:
      - ".github/workflows/agent-eval.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  eval:
    strategy:
      fail-fast: false
      matrix:
        provider:
          - {name: polargrid, base_url: "https://api.mia-01.edge.polargrid.ai/v1", model: qwen-3.8-27b, key: POLARGRID_KEY}
          - {name: agnes, base_url: "https://apihub.agnes-ai.com/v1", model: agnes-3.0-flash, key: AGNES_KEY}
        scenario: [research, build, debug, server, longrun]
    runs-on: ubuntu-22.04
    timeout-minutes: 170
    env:
      OUT: audit-results/agent-eval
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q -r requirements-test.txt

      - name: Run the scenario
        env:
          POLARGRID_KEY: ${{ secrets.polagrid_ }}
          AGNES_KEY: ${{ secrets.Agnes_key }}
        run: |
          mkdir -p "$OUT"
          python scripts/agent_eval.py --app-dir "$PWD" --base "${{ matrix.provider.base_url }}" --model "${{ matrix.provider.model }}" \
            --key-env "${{ matrix.provider.key }}" --label "${{ matrix.provider.name }}" --out "$OUT" --scenarios "${{ matrix.scenario }}" --timeout-min 150 | cut -c1-600

      - name: Give git access only now that the agents are done
        if: always()
        env:
          TOKEN: ${{ github.token }}
        run: |
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"

      - name: Save evidence to audit-evidence
        if: always()
        uses: ./.github/actions/save-evidence
        with:
          paths: audit-results/agent-eval
          message: "audit: Agent eval ${{ matrix.provider.name }} ${{ matrix.scenario }} (run ${{ github.run_id }})"
