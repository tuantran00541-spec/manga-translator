name: Free model probe

on:
  push:
    paths:
      - ".github/free-probe/config.json"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy==1.26.4 opencv-python-headless==4.10.0.84 requests==2.32.3
      - id: conf
        run: python -c 'import json; c=json.load(open(".github/free-probe/config.json")); print("label=" + c["label"]); print("models=" + c["models"])' >> "$GITHUB_OUTPUT"
      - env:
          COMMANDCODE: ${{ secrets.COMMANDCODE }}
          MODELS: ${{ steps.conf.outputs.models }}
          OUT: audit-results/free-probe/${{ steps.conf.outputs.label }}
        run: python .github/free-probe/probe.py "$OUT" "$MODELS"
      - if: always()
        uses: ./.github/actions/save-evidence
        with:
          paths: audit-results/free-probe/${{ steps.conf.outputs.label }}
          message: "audit: free model probe ${{ steps.conf.outputs.label }} (run ${{ github.run_id }})"
