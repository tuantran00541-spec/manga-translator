name: YOLO26 teacher-distill shadow spike

on:
  push:
    branches:
      - release/focused-segmenter-640
    paths:
      - scripts/yolo26_teacher_distill_spike.py
      - tests/test_yolo26_teacher_distill_spike.py
      - .github/workflows/yolo26-teacher-distill-spike.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yolo26-teacher-distill-release-focused-segmenter-640
  cancel-in-progress: false

jobs:
  teacher-distill:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
      YOLO_AUTOINSTALL: "False"
      MANGA_ORT_PROVIDER: openvino
      MANGA_ORT_REQUIRE_PROVIDER: "1"
      MANGA_ORT_OPENVINO_SCOPE: all
      MANGA_ORT_OPENVINO_THREADS: "2"
      MANGA_ORT_OPENVINO_STREAMS: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install benchmark runtime
        run: |
          python -m pip install \
            numpy==1.26.4 Pillow==10.4.0 opencv-contrib-python==4.10.0.84 \
            onnx==1.17.0 onnxruntime-openvino==1.24.1 loguru==0.7.2 \
            requests==2.32.3 beautifulsoup4==4.12.3 lxml==5.3.0 \
            playwright==1.47.0 fastapi==0.115.0 pydantic==2.9.2 \
            filelock==3.16.1 threadpoolctl==3.6.0

      - name: Restore production-equivalent teacher models
        id: models
        uses: actions/cache@v4
        with:
          path: |
            models/*.onnx
            models/.e2e-provenance.json
          key: processing-profile-models-b224548-v1

      - name: Read pinned production model provisioner
        if: steps.models.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          ref: b22454827f8190655d7070b80eb20c2550beadfa
          path: benchmark-bootstrap
          sparse-checkout: scripts/provision_real_e2e_models.py
          sparse-checkout-cone-mode: false

      - name: Provision production-equivalent teacher models
        if: steps.models.outputs.cache-hit != 'true'
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple torch==2.5.1+cpu torchvision==0.20.1+cpu
          python -m pip install --no-deps ultralytics==8.3.221 onnxslim==0.1.71
          python -m pip install sympy==1.13.1 PyYAML==6.0.2 scipy==1.14.1 tqdm==4.67.1 matplotlib==3.9.2 pandas==2.2.3 py-cpuinfo==9.0.0 ml_dtypes==0.5.3 colorama==0.4.6 polars==1.33.1 ultralytics-thop==2.0.17
          python benchmark-bootstrap/scripts/provision_real_e2e_models.py
          cp benchmark-bootstrap/models/*.onnx models/
          cp benchmark-bootstrap/models/.e2e-provenance.json models/

      - name: Fetch identical full-chapter input
        run: |
          python scripts/profile_processing.py \
            --prepare --prepare-all \
            --raw-dir benchmark-results/yolo26-distill-input

      - name: Materialize production slices
        run: |
          python - <<'PY'
          import json
          import shutil
          from pathlib import Path

          from app.pipeline import ChapterPipeline

          raw_dir = Path("benchmark-results/yolo26-distill-input")
          raw_paths = sorted(
              path for path in raw_dir.iterdir()
              if path.is_file() and path.suffix.lower() in {".png", ".jpg", ".jpeg", ".webp"}
          )
          manifest = ChapterPipeline()._build_chapter_from_raw_paths(
              "yolo26-teacher-distill-slices",
              raw_paths,
              source_url=None,
              workers=2,
          )
          pages = manifest.get("pages") or []
          if len(pages) < 32:
              raise RuntimeError(f"need at least 32 production slices, got {len(pages)}")
          out = Path("benchmark-results/yolo26-distill-slices")
          out.mkdir(parents=True, exist_ok=True)
          rows = []
          for index, page in enumerate(pages[:32]):
              source = Path(page["original"])
              target = out / f"{index:04d}{source.suffix.lower()}"
              shutil.copy2(source, target)
              rows.append({
                  "index": index,
                  "source_page": page.get("source_page"),
                  "slice_index": page.get("slice_index"),
                  "file": target.name,
              })
          (out / "manifest.json").write_text(
              json.dumps(rows, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps({"production_slices": len(rows), "benchmark_window": [0, 31]}))
          PY

      - name: Build teacher-dataset from production authority masks
        run: |
          python scripts/yolo26_teacher_distill_spike.py \
            --raw-dir benchmark-results/yolo26-distill-slices \
            --output-dir benchmark-results/teacher-dataset \
            --max-pages 32 \
            --validation-stride 4 \
            --provider openvino \
            --report benchmark-results/teacher-dataset/report.json

      - name: Verify pseudo-label reconstruction quality
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("benchmark-results/teacher-dataset/report.json").read_text())
          reconstruction = report["polygon_reconstruction"]
          if reconstruction["pixel_recall"] < 0.98:
              raise RuntimeError(f"teacher polygon recall too low: {reconstruction}")
          if reconstruction["pixel_precision"] < 0.98:
              raise RuntimeError(f"teacher polygon precision too low: {reconstruction}")
          if report["split_counts"] != {"train": 24, "val": 8}:
              raise RuntimeError(f"unexpected deterministic split: {report['split_counts']}")
          print(json.dumps({
              "split_counts": report["split_counts"],
              "authority_boxes": report["authority_boxes"],
              "polygons": report["polygons"],
              "polygon_reconstruction": reconstruction,
          }, indent=2))
          PY

      - name: Fetch pinned ShadowB YOLO26s manga segmentation checkpoint
        run: |
          mkdir -p benchmark-models
          python - <<'PY'
          import hashlib
          from pathlib import Path
          import urllib.request

          repo = "ShadowB/Manga109-panel-balloon-text-yolov26-segmentation"
          url = f"https://huggingface.co/{repo}/resolve/main/best.pt"
          expected = "0b4376e426fa96af3976afa6a2602421dacf2dec96ef87b4a44f5e8d4971cb6f"
          path = Path("benchmark-models/yolo26s_manga_best.pt")
          request = urllib.request.Request(
              url,
              headers={"User-Agent": "manga-translator-yolo26-distill-spike/1.0"},
          )
          with urllib.request.urlopen(request, timeout=90) as response, path.open("wb") as output:
              while True:
                  chunk = response.read(1024 * 1024)
                  if not chunk:
                      break
                  output.write(chunk)
          actual = hashlib.sha256(path.read_bytes()).hexdigest()
          if actual != expected:
              path.unlink(missing_ok=True)
              raise RuntimeError(f"YOLO26s checkpoint SHA mismatch: {actual}")
          print({"repo": repo, "path": str(path), "sha256": actual, "bytes": path.stat().st_size})
          PY

      - name: Install pinned YOLO26 training and export runtime
        run: |
          python -m venv /tmp/yolo26-distill
          /tmp/yolo26-distill/bin/python -m pip install --upgrade pip
          /tmp/yolo26-distill/bin/python -m pip install \
            --index-url https://download.pytorch.org/whl/cpu \
            torch==2.7.1+cpu torchvision==0.22.1+cpu
          /tmp/yolo26-distill/bin/python -m pip install \
            ultralytics==8.4.117 onnx==1.22.0 onnxslim

      - name: Export baseline YOLO26s 768 shadow model
        run: |
          mkdir -p benchmark-models/baseline
          /tmp/yolo26-distill/bin/python - <<'PY'
          from pathlib import Path
          import shutil
          from ultralytics import YOLO

          model = YOLO("benchmark-models/yolo26s_manga_best.pt")
          exported = Path(model.export(
              format="onnx",
              imgsz=768,
              opset=17,
              simplify=True,
              dynamic=False,
              end2end=False,
              device="cpu",
              verbose=False,
          ))
          target = Path("benchmark-models/baseline/yolo26s_manga_seg_768.onnx")
          if exported.resolve() != target.resolve():
              shutil.move(str(exported), target)
          if not target.is_file():
              raise RuntimeError(f"missing baseline export: {target}")
          print({"path": str(target), "bytes": target.stat().st_size})
          PY

      - name: Benchmark baseline checkpoint on held-out teacher val pages
        run: |
          python scripts/yolo26_segmentation_spike.py \
            --raw-dir benchmark-results/teacher-dataset/images/val \
            --candidate-dir benchmark-models/baseline \
            --text-class-id 1 \
            --max-pages 8 \
            --sizes 768 \
            --thresholds 0.01,0.03,0.05,0.10,0.20 \
            --provider openvino \
            --output benchmark-results/yolo26-teacher-distill/baseline.json

      - name: Fine-tune YOLO26s 768 on teacher pseudo-labels
        env:
          OMP_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
        run: |
          /tmp/yolo26-distill/bin/python - <<'PY'
          from pathlib import Path
          import torch
          from ultralytics import YOLO

          torch.set_num_threads(2)
          torch.set_num_interop_threads(1)

          project = Path("benchmark-results/yolo26-teacher-distill").resolve()
          project.mkdir(parents=True, exist_ok=True)
          model = YOLO("benchmark-models/yolo26s_manga_best.pt")
          model.train(
              data="benchmark-results/teacher-dataset/dataset.yaml",
              imgsz=768,
              epochs=3,
              batch=2,
              device="cpu",
              workers=0,
              cache=False,
              amp=False,
              seed=0,
              deterministic=True,
              project=str(project),
              name="train",
              exist_ok=True,
              plots=False,
              verbose=True,
              mosaic=0.0,
              mixup=0.0,
              copy_paste=0.0,
          )
          if model.trainer is None:
              raise RuntimeError("Ultralytics training finished without trainer state")
          save_dir = Path(model.trainer.save_dir).resolve()
          marker = project / "train-save-dir.txt"
          marker.write_text(str(save_dir) + "\n", encoding="utf-8")
          print({"train_save_dir": str(save_dir), "marker": str(marker)})
          PY

      - name: Export tuned one-class YOLO26s 768 ONNX
        run: |
          mkdir -p benchmark-models/tuned
          /tmp/yolo26-distill/bin/python - <<'PY'
          from pathlib import Path
          import shutil
          from ultralytics import YOLO

          marker = Path("benchmark-results/yolo26-teacher-distill/train-save-dir.txt")
          if not marker.is_file():
              raise RuntimeError(f"missing Ultralytics save-dir marker: {marker}")
          save_dir = Path(marker.read_text(encoding="utf-8").strip())
          checkpoint = save_dir / "weights" / "best.pt"
          if not checkpoint.is_file():
              checkpoint = save_dir / "weights" / "last.pt"
          if not checkpoint.is_file():
              raise RuntimeError(
                  f"training produced no best.pt or last.pt under {save_dir / 'weights'}"
              )

          model = YOLO(str(checkpoint))
          exported = Path(model.export(
              format="onnx",
              imgsz=768,
              opset=17,
              simplify=True,
              dynamic=False,
              end2end=False,
              device="cpu",
              verbose=False,
          ))
          target = Path("benchmark-models/tuned/yolo26s_manga_seg_768.onnx")
          if exported.resolve() != target.resolve():
              shutil.move(str(exported), target)
          if not target.is_file():
              raise RuntimeError(f"missing tuned export: {target}")
          print({"checkpoint": str(checkpoint), "path": str(target), "bytes": target.stat().st_size})
          PY

      - name: Verify tuned one-class segmentation ONNX contract
        run: |
          python - <<'PY'
          import onnxruntime as ort

          path = "benchmark-models/tuned/yolo26s_manga_seg_768.onnx"
          session = ort.InferenceSession(path, providers=["CPUExecutionProvider"])
          inputs = session.get_inputs()
          outputs = session.get_outputs()
          if len(inputs) != 1 or inputs[0].name != "images":
              raise RuntimeError(f"{path}: unexpected input contract")
          if list(inputs[0].shape) != [1, 3, 768, 768]:
              raise RuntimeError(f"{path}: unexpected input shape {inputs[0].shape}")
          if len(outputs) != 2:
              raise RuntimeError(f"{path}: expected two segmentation outputs, got {len(outputs)}")

          output0 = list(outputs[0].shape)
          output1 = list(outputs[1].shape)
          if len(output0) != 3 or output0[0] != 1 or output0[1] != 37:
              raise RuntimeError(f"{path}: expected raw [1,37,N], got {output0}")
          if len(output1) != 4 or output1[0] != 1 or output1[1] != 32:
              raise RuntimeError(f"{path}: expected prototypes [1,32,H,W], got {output1}")
          print({
              "path": path,
              "input": inputs[0].shape,
              "expected raw [1,37,N]": output0,
              "expected prototypes [1,32,H,W]": output1,
          })
          PY

      - name: Benchmark tuned one-class YOLO26s on held-out teacher val pages
        run: |
          python scripts/yolo26_segmentation_spike.py \
            --raw-dir benchmark-results/teacher-dataset/images/val \
            --candidate-dir benchmark-models/tuned \
            --text-class-id 0 \
            --max-pages 8 \
            --sizes 768 \
            --thresholds 0.01,0.03,0.05,0.10,0.20 \
            --provider openvino \
            --output benchmark-results/yolo26-teacher-distill/tuned.json

      - name: Publish teacher-distill decision
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          dataset = json.loads(Path("benchmark-results/teacher-dataset/report.json").read_text())
          baseline = json.loads(Path("benchmark-results/yolo26-teacher-distill/baseline.json").read_text())
          tuned = json.loads(Path("benchmark-results/yolo26-teacher-distill/tuned.json").read_text())

          def best(report):
              return max(
                  report["rows"],
                  key=lambda row: (
                      row["pixel_recall"],
                      row["pixel_precision"],
                      row["pixel_iou"],
                  ),
              )

          before = best(baseline)
          after = best(tuned)
          recall_gain = after["pixel_recall"] - before["pixel_recall"]
          training_signal = bool(
              recall_gain > 0.05
              and after["pixel_precision"] >= 0.50
          )
          decision = {
              "benchmark_only": True,
              "production_model_replaced": False,
              "destructive_authority_granted": False,
              "teacher_pages": dataset["pages"],
              "split_counts": dataset["split_counts"],
              "polygon_reconstruction": dataset["polygon_reconstruction"],
              "baseline_best": before,
              "tuned_best": after,
              "pixel_recall_gain": recall_gain,
              "training_signal_present": training_signal,
          }
          path = Path("benchmark-results/yolo26-teacher-distill/decision.json")
          path.write_text(json.dumps(decision, indent=2) + "\n", encoding="utf-8")

          lines = [
              "## YOLO26s 768 teacher-distill smoke",
              "",
              "- benchmark-only; production model unchanged; destructive authority disabled",
              f"- dataset split: {dataset['split_counts']}",
              f"- polygon reconstruction recall: {dataset['polygon_reconstruction']['pixel_recall']:.6f}",
              f"- polygon reconstruction precision: {dataset['polygon_reconstruction']['pixel_precision']:.6f}",
              f"- baseline best recall/precision/IoU: {before['pixel_recall']:.6f} / {before['pixel_precision']:.6f} / {before['pixel_iou']:.6f}",
              f"- tuned best recall/precision/IoU: {after['pixel_recall']:.6f} / {after['pixel_precision']:.6f} / {after['pixel_iou']:.6f}",
              f"- tuned latency ratio: {after['candidate_to_baseline_latency']:.3f}x teacher",
              f"- pixel recall gain: {recall_gain:+.6f}",
              f"- training signal present: {training_signal}",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("\n".join(lines) + "\n")
          print("\n".join(lines))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yolo26-teacher-distill-${{ github.run_id }}
          path: |
            benchmark-results/teacher-dataset/report.json
            benchmark-results/teacher-dataset/dataset.yaml
            benchmark-results/yolo26-teacher-distill/baseline.json
            benchmark-results/yolo26-teacher-distill/tuned.json
            benchmark-results/yolo26-teacher-distill/decision.json
            benchmark-results/yolo26-teacher-distill/train-save-dir.txt
            benchmark-results/yolo26-teacher-distill/train/results.csv
            benchmark-results/yolo26-teacher-distill/train/weights/best.pt
            benchmark-models/tuned/yolo26s_manga_seg_768.onnx
          retention-days: 7
          if-no-files-found: warn
