name: Qwen3.8 K3 bounded I/O queue-depth sweep

on:
  push:
    branches: [research/qwen3.8-27b-runtime-finish]
    paths:
      - "research/qwen38/k3_stream_qd.py"
      - "research/qwen38/k3_stream_qd_sanity.py"
      - "research/qwen38/qwen35_k3_generate_cached.py"
      - ".github/workflows/qwen38-k3-io-qd-sweep.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  HF_HUB_DISABLE_TELEMETRY: "1"
  QWEN_REVISION: "1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0"

jobs:
  qd-sweep:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[qwen-k3-io]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Exact kernel and multi-QD synthetic gates
        shell: bash
        run: |
          set -euo pipefail
          cc -O3 -std=c11 -mavx2 -fno-fast-math -ffp-contract=off \
            -DQWEN_AVX2_EXACT_SELFTEST research/qwen38/gguf_quant_dot_avx2.c -lm \
            -o "$RUNNER_TEMP/qwen-avx2-selftest"
          "$RUNNER_TEMP/qwen-avx2-selftest"
          PYTHONPATH=research/qwen38 python -u research/qwen38/k3_stream_sanity.py
          PYTHONPATH=research/qwen38 python -u research/qwen38/k3_stream_qd_sanity.py

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Runner CPU and storage information
        shell: bash
        run: |
          lscpu
          uname -a
          df -h
          free -h

      - name: Reclaim disk
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true
          docker system prune -af || true
          df -h
          free -h

      - name: Install runtime dependencies
        run: python -m pip install --no-cache-dir huggingface_hub hf_xet tokenizers

      - name: Download pinned real GGUF and tokenizer once
        shell: bash
        run: |
          set -euo pipefail
          readarray -t files < <(python - <<'PY'
          from huggingface_hub import hf_hub_download
          rev="1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0"
          print(hf_hub_download(
              "bartowski/Qwen3.8-27B-GGUF",
              filename="Qwen3.8-27B-Q6_K_L.gguf",
              local_dir="${{ runner.temp }}/qwen38-model",
          ))
          print(hf_hub_download(
              "Qwen/Qwen3.8-27B",
              filename="tokenizer.json",
              revision=rev,
              local_dir="${{ runner.temp }}/qwen38-tokenizer",
          ))
          PY
          )
          test -f "${files[0]}"; test -f "${files[1]}"
          echo "MODEL=${files[0]}" >> "$GITHUB_ENV"
          echo "TOKENIZER_JSON=${files[1]}" >> "$GITHUB_ENV"
          echo "K3_WORK=$RUNNER_TEMP/qwen38-k3-qd-work" >> "$GITHUB_ENV"
          echo "EVIDENCE=$RUNNER_TEMP/qwen38-k3-qd-evidence" >> "$GITHUB_ENV"

      - name: Validate pinned decoder inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          PYTHONPATH=research/qwen38 python -u research/qwen38/qwen35_gguf_decoder_contract.py real \
            --model "$MODEL" --output "$EVIDENCE/inventory.json" \
            2>&1 | tee "$EVIDENCE/inventory.log"

      - name: Compile exact AVX2 runtime bridges
        shell: bash
        run: |
          set -euo pipefail
          cc -O3 -std=c11 -mavx2 -fno-fast-math -ffp-contract=off -fPIC -shared \
            research/qwen38/gguf_quant_dot_avx2.c -lm -o "$RUNNER_TEMP/libqwen_quant_avx2.so"
          cc -O2 -std=c11 -fPIC -shared research/qwen38/gdn_state_ar.c -lm \
            -o "$RUNNER_TEMP/libqwen_gdn_serial.so"

      - name: Pack 64-layer K3 decoder exactly once
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$K3_WORK"
          PYTHONPATH=research/qwen38 python - <<'PY'
          import os
          from pathlib import Path
          import qwen35_gdn_quant_layer_gate as gdn
          from gguf_stream import parse_gguf
          from gguf_k3_layout import pack_gguf_layers
          model=Path(os.environ["MODEL"])
          work=Path(os.environ["K3_WORK"])
          manifest=pack_gguf_layers(
              parse_gguf(model), work/"decoder64.k3.bin", work/"decoder64.k3.json",
              layers=range(64), model_id=gdn.MODEL_ID, revision=gdn.REVISION,
              source_sha256=gdn.SHA256, expected_layers=64,
          )
          print("QWEN38_K3_QD_REAL_PREPACK_PASS",
                "bytes=", manifest["packed_file_bytes"],
                "layers=", len(manifest["layers"]))
          PY

      - name: Run cache-neutral bounded queue-depth ABCCBA sweep
        timeout-minutes: 18
        shell: bash
        run: |
          set -euo pipefail
          run_one () {
            local name="$1" slots="$2" workers="$3" ahead="$4"
            echo "=== $name slots=$slots workers=$workers lookahead=$ahead ==="
            QWEN38_K3_IO_EXPERIMENT=1 \
            QWEN38_K3_RING_SLOTS="$slots" \
            QWEN38_K3_IO_WORKERS="$workers" \
            QWEN38_K3_LOOKAHEAD="$ahead" \
            PYTHONPATH=research/qwen38 \
              python -u research/qwen38/qwen35_k3_generate_cached.py run \
                --model "$MODEL" --native-lib "$RUNNER_TEMP/libqwen_quant_avx2.so" \
                --state-lib "$RUNNER_TEMP/libqwen_gdn_serial.so" \
                --inventory "$EVIDENCE/inventory.json" --tokenizer-json "$TOKENIZER_JSON" \
                --prompt "Hi" --raw-prompt --max-new-tokens 1 --max-prompt-tokens 4 \
                --work-dir "$K3_WORK" --output "$EVIDENCE/$name.json"
          }
          run_one qd2-a 2 1 1
          run_one qd3-a 3 2 2
          run_one qd4-a 4 3 3
          run_one qd4-b 4 3 3
          run_one qd3-b 3 2 2
          run_one qd2-b 2 1 1

      - name: Require exact semantics and report queue-depth attribution
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, statistics
          from pathlib import Path

          root=Path(os.environ["EVIDENCE"])
          names=("qd2-a","qd3-a","qd4-a","qd4-b","qd3-b","qd2-b")
          runs={name:json.loads((root/f"{name}.json").read_text(encoding="utf-8")) for name in names}
          ref=runs["qd2-a"]
          exact_keys=(
              "status","model_sha256","tokenizer_revision","mode","prompt","rendered_prompt",
              "prompt_token_count","prompt_token_ids","generated_token_ids","generated_text",
              "token_reports","stop_reason",
          )
          state_keys=("position","gdn_state_bytes_f32","conv_history_bytes_f32","attention_kv_bytes_f16")
          reference_bytes=None
          for name,run in runs.items():
              assert run["status"] == "PASS", name
              for key in exact_keys:
                  assert run[key] == ref[key], (name,key)
              for key in state_keys:
                  assert run["state"][key] == ref["state"][key], (name,key)
              assert run["state"]["packed_trunk_reused"] is True, name
              reader=run["state"]["reader"]
              assert reader["experimental_qd"] is True, name
              assert reader["direct_io"] is True, name
              assert reader["io_bytes_completed"] > 20_000_000_000, name
              if reference_bytes is None:
                  reference_bytes=reader["io_bytes_completed"]
              assert reader["io_bytes_completed"] == reference_bytes, name
              assert reader["io_span_seconds"] > 0.0, name

          groups={
              "qd2":[runs["qd2-a"],runs["qd2-b"]],
              "qd3":[runs["qd3-a"],runs["qd3-b"]],
              "qd4":[runs["qd4-a"],runs["qd4-b"]],
          }
          def med(group, fn): return statistics.median(fn(r) for r in group)
          summary={}
          for key,group in groups.items():
              r0=group[0]["state"]["reader"]
              elapsed=med(group,lambda r:float(r["elapsed_seconds"]))
              rss=med(group,lambda r:float(r["max_rss_gib"]))
              span=med(group,lambda r:float(r["state"]["reader"]["io_span_seconds"]))
              service=med(group,lambda r:float(r["state"]["reader"]["io_service_seconds_sum_nonadditive"]))
              wait=med(group,lambda r:float(r["state"]["reader"]["bind_wait_seconds"]))
              ready=med(group,lambda r:int(r["state"]["reader"]["prefetch_ready_before_bind"]))
              pending=med(group,lambda r:int(r["state"]["reader"]["max_pending"]))
              summary[key]={
                  "ring_slots":r0["ring_slots"],
                  "io_workers":r0["io_workers"],
                  "lookahead_layers":r0["lookahead_layers"],
                  "planned_bytes":r0["planned_bytes"],
                  "median_elapsed_s":elapsed,
                  "median_max_rss_gib":rss,
                  "median_io_span_s":span,
                  "median_io_service_sum_s_nonadditive":service,
                  "median_bind_wait_s":wait,
                  "median_prefetch_ready_before_bind":ready,
                  "median_max_pending":pending,
                  "achieved_k3_GBps":reference_bytes/span/1e9,
              }
          base=summary["qd2"]
          for key in ("qd3","qd4"):
              summary[key]["end_to_end_speedup_vs_qd2"]=base["median_elapsed_s"]/summary[key]["median_elapsed_s"]
              summary[key]["io_span_speedup_vs_qd2"]=base["median_io_span_s"]/summary[key]["median_io_span_s"]
              summary[key]["rss_delta_gib_vs_qd2"]=summary[key]["median_max_rss_gib"]-base["median_max_rss_gib"]
          print("QWEN38_K3_QD_REAL_TOKEN_TOP5_EXACT_PASS")
          print(json.dumps(summary,indent=2,sort_keys=True))
          print("QWEN38_K3_QD_SWEEP_PASS")
          (root/"qd-summary.json").write_text(json.dumps(summary,indent=2,sort_keys=True)+"\n")
          PY

      - name: Upload compact queue-depth evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen38-k3-qd-${{ github.run_id }}
          path: ${{ runner.temp }}/qwen38-k3-qd-evidence/
          if-no-files-found: warn
          retention-days: 14
