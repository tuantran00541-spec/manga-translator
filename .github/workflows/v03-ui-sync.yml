name: Sync tested v0.3 UI snapshot

on:
  push:
    branches:
      - test/v03-ui-sync
    paths:
      - .github/workflows/v03-ui-sync.yml
      - .v03-sync/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout sync payload
        uses: actions/checkout@v4
        with:
          ref: test/v03-ui-sync
          path: sync-source

      - name: Checkout v0.3 feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/v03-workstation-ui
          path: target
          fetch-depth: 0

      - name: Verify target and payload
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C target rev-parse HEAD)" = "a110b47c211ddab05e96530b94bea980640cae5f"
          cat sync-source/.v03-sync/payload.* | base64 --decode > /tmp/v03-ui-final.tar.gz
          echo "b51d05eeb32c95d24ac15f1ee5737f36c280c43aba77278ab24f0b020baad713  /tmp/v03-ui-final.tar.gz" | sha256sum --check
          tar -tzf /tmp/v03-ui-final.tar.gz | sort > /tmp/archive-files
          test "$(wc -l < /tmp/archive-files)" -eq 20

      - name: Apply tested snapshot
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/v03-ui-final.tar.gz -C target
          git -C target diff --check
          for f in target/app/static/js/*.js; do node --check "$f" >/dev/null; done
          python -m compileall -q target/app target/tests
          test "$(grep -o '/static/css/' target/app/templates/index.html | wc -l)" -eq 1
          test "$(grep -Roh '!important' target/app/static/css | wc -l)" -eq 5
          test "$(grep -R -E 'workspace-nav-|preview-navigation|preview-thumbnail|review-page-nav|translation-page-nav' target/app/static/css target/app/static/js 2>/dev/null | wc -l)" -eq 0

      - name: Commit v0.3 UI snapshot
        shell: bash
        run: |
          set -euo pipefail
          cd target
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/static/css app/static/js app/templates/index.html tests docs/UI_GUIDELINES.md docs/UI_V03_WORKSTATION_AUDIT.md
          git diff --cached --quiet && exit 0
          git commit -m "feat(v0.3): unify workstation UI and CSS architecture"
          git push origin HEAD:feat/v03-workstation-ui
