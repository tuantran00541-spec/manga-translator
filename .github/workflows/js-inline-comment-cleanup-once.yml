name: One-shot parser-verified JavaScript comment cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/js-inline-comment-cleanup-once.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Remove non-semantic JavaScript comments
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo 'main moved after this cleanup run started; refusing stale rewrite'
            exit 1
          }

          npm install --no-save --ignore-scripts --no-audit --no-fund acorn@8.15.0 >/dev/null

          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const acorn = require('acorn');

          const root = 'app/static/js';
          const files = [];
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (entry.isFile() && full.endsWith('.js')) files.push(full);
            }
          }
          walk(root);
          files.sort();

          const keepMarkers = [
            'eslint', 'prettier', '@ts-', 'ts-check', 'ts-nocheck',
            'sourceurl', 'sourcemappingurl', 'istanbul', 'c8 ignore',
            'spdx-', 'copyright', 'license', 'licence', '@preserve',
            '__pure__', '#__pure__', '@__pure__', 'webpack', 'vite-', 'rollup',
          ];
          const jsdocTags = [
            '@param', '@return', '@returns', '@typedef', '@type', '@property',
            '@template', '@implements', '@extends', '@this', '@throws',
            '@deprecated', '@callback', '@enum', '@satisfies',
          ];

          function shouldKeep(comment) {
            const text = comment.value.toLowerCase();
            if (keepMarkers.some(marker => text.includes(marker))) return true;
            if (comment.type === 'Block' && comment.value.startsWith('*')) {
              return jsdocTags.some(tag => text.includes(tag));
            }
            return false;
          }

          function parse(source, comments, tokens) {
            const options = {
              ecmaVersion: 'latest',
              sourceType: 'module',
              allowHashBang: true,
              allowAwaitOutsideFunction: true,
              onComment: comments,
              onToken: tokens,
            };
            try {
              return acorn.parse(source, options);
            } catch (moduleError) {
              comments.length = 0;
              tokens.length = 0;
              return acorn.parse(source, { ...options, sourceType: 'script', allowReturnOutsideFunction: true });
            }
          }

          function normalizedAst(value) {
            if (Array.isArray(value)) return value.map(normalizedAst);
            if (!value || typeof value !== 'object') return value;
            const out = {};
            for (const [key, child] of Object.entries(value)) {
              if (key === 'start' || key === 'end' || key === 'loc' || key === 'range') continue;
              out[key] = normalizedAst(child);
            }
            return out;
          }

          function tokenShape(tokens) {
            return tokens.map(token => ({ type: token.type.label, value: token.value ?? null }));
          }

          let totalRemoved = 0;
          let lineRemoved = 0;
          let blockRemoved = 0;
          const changed = [];

          for (const file of files) {
            const source = fs.readFileSync(file, 'utf8');
            const comments = [];
            const beforeTokens = [];
            const beforeAst = parse(source, comments, beforeTokens);
            const removable = comments.filter(comment => !shouldKeep(comment));
            if (!removable.length) continue;

            let cleaned = source;
            for (const comment of removable.slice().sort((a, b) => b.start - a.start)) {
              const raw = source.slice(comment.start, comment.end);
              let replacement = '';
              if (comment.type === 'Block') {
                const breaks = raw.match(/\r\n|\r|\n/g);
                replacement = breaks ? breaks.join('') : ' ';
              }
              cleaned = cleaned.slice(0, comment.start) + replacement + cleaned.slice(comment.end);
            }
            cleaned = cleaned.replace(/[ \t]+(?=\r?$)/gm, '');

            const afterComments = [];
            const afterTokens = [];
            const afterAst = parse(cleaned, afterComments, afterTokens);
            const beforeTokenJson = JSON.stringify(tokenShape(beforeTokens));
            const afterTokenJson = JSON.stringify(tokenShape(afterTokens));
            if (beforeTokenJson !== afterTokenJson) {
              throw new Error(`Token stream changed after comment removal: ${file}`);
            }
            const beforeAstJson = JSON.stringify(normalizedAst(beforeAst));
            const afterAstJson = JSON.stringify(normalizedAst(afterAst));
            if (beforeAstJson !== afterAstJson) {
              throw new Error(`AST changed after comment removal: ${file}`);
            }

            fs.writeFileSync(file, cleaned, 'utf8');
            const lines = removable.filter(comment => comment.type === 'Line').length;
            const blocks = removable.length - lines;
            totalRemoved += removable.length;
            lineRemoved += lines;
            blockRemoved += blocks;
            changed.push({ file, comments: removable.length, lines, blocks });
          }

          console.log(`JS files parsed: ${files.length}`);
          console.log(`Removed comments: ${totalRemoved} (line=${lineRemoved}, block=${blockRemoved})`);
          for (const item of changed) {
            console.log(`  ${item.file}: ${item.comments} (line=${item.lines}, block=${item.blocks})`);
          }
          NODE

          rm -rf node_modules package-lock.json package.json 2>/dev/null || true
          find app/static/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          python -m compileall -q app run.py
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/static/js
          git rm .github/workflows/js-inline-comment-cleanup-once.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'refactor(js): remove non-semantic comments'
          git push origin HEAD:main
