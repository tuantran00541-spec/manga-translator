name: Qwen3.8 current-best Python orchestration profile

on:
  push:
    branches:
      - research/qwen3.8-27b-runtime-finish
    paths:
      - .github/workflows/qwen38-post-fastmarshal-python-profile.yml
  workflow_dispatch:

jobs:
  python-profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      QWEN_REVISION: 1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0
    steps:
      - uses: actions/checkout@v4

      - name: Current-best profiler syntax sanity
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -euo pipefail
          python -m py_compile research/qwen38/qwen38_post_fastmarshal_profile.py
          PYTHONPATH=research/qwen38 python -u research/qwen38/qwen38_post_fastmarshal_profile.py sanity

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Runner CPU and storage information
        run: |
          lscpu
          df -h
          free -h

      - name: Reclaim disk
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true
          docker system prune -af || true
          df -h
          free -h

      - name: Install runtime dependencies
        run: python -m pip install --no-cache-dir huggingface_hub hf_xet

      - name: Download pinned GGUF
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -euo pipefail
          MODEL=$(python - <<'PY'
          from huggingface_hub import hf_hub_download
          print(hf_hub_download("bartowski/Qwen3.8-27B-GGUF", filename="Qwen3.8-27B-Q6_K_L.gguf", local_dir="${{ runner.temp }}/qwen38-model"))
          PY
          )
          echo "MODEL=$MODEL" >> "$GITHUB_ENV"
          echo "K3_WORK=$RUNNER_TEMP/qwen38-python-profile-k3" >> "$GITHUB_ENV"
          echo "EVIDENCE=$RUNNER_TEMP/qwen38-python-profile-evidence" >> "$GITHUB_ENV"

      - name: Validate pinned decoder inventory
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          PYTHONPATH=research/qwen38 python -u research/qwen38/qwen35_gguf_decoder_contract.py real \
            --model "$MODEL" --output "$EVIDENCE/inventory.json" 2>&1 | tee "$EVIDENCE/inventory.log"

      - name: Compile exact current-best bridges
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -euo pipefail
          cc -O3 -std=c11 -mavx2 -fno-fast-math -ffp-contract=off -fPIC -shared \
            research/qwen38/gguf_quant_matvec_many_bridge.c -lm -o "$RUNNER_TEMP/libqwen_quant_base.so"
          cc -O3 -std=c11 -mavx2 -fno-fast-math -ffp-contract=off -fPIC -shared \
            research/qwen38/gguf_quant_matvec_many_noalloc_bridge.c -lm -o "$RUNNER_TEMP/libqwen_quant_many_noalloc.so"
          cc -O2 -std=c11 -fno-fast-math -ffp-contract=off -fPIC -shared \
            research/qwen38/gdn_state_ar.c -lm -o "$RUNNER_TEMP/libqwen_gdn_serial.so"
          cc -O3 -std=c11 -fno-fast-math -fno-associative-math -ffp-contract=off -fPIC -shared \
            research/qwen38/f32_fsum_matvec.c -lm -o "$RUNNER_TEMP/libqwen_f32_fsum.so"
          cc -O3 -std=c11 -fno-fast-math -fno-associative-math -ffp-contract=off -fPIC -shared \
            research/qwen38/attention_core_exact.c -lm -o "$RUNNER_TEMP/libqwen_attention_exact.so"
          cc -O3 -std=c11 -fno-fast-math -fno-associative-math -ffp-contract=off -fno-tree-vectorize -fPIC -shared \
            research/qwen38/gdn_conv_silu_exact.c -lm -o "$RUNNER_TEMP/libqwen_gdn_conv_exact.so"
          cc -O3 -std=c11 -fno-fast-math -fno-associative-math -ffp-contract=off -fno-tree-vectorize -fPIC -shared \
            research/qwen38/gdn_output_gate_exact.c -lm -o "$RUNNER_TEMP/libqwen_gdn_output_gate_exact.so"
          cc -O3 -std=c11 -fno-fast-math -fno-associative-math -ffp-contract=off -fno-tree-vectorize -fPIC -shared \
            research/qwen38/swiglu_exact.c -lm -o "$RUNNER_TEMP/libqwen_swiglu_exact.so"
          cc -O3 -std=c11 -fno-fast-math -fno-associative-math -ffp-contract=off -fno-tree-vectorize -fPIC -shared \
            research/qwen38/rmsnorm_exact.c -lm -o "$RUNNER_TEMP/libqwen_rmsnorm_exact.so"
          cc -O3 -std=c11 -fno-fast-math -fno-associative-math -ffp-contract=off -fno-tree-vectorize -fPIC -shared \
            research/qwen38/residual_add_exact.c -o "$RUNNER_TEMP/libqwen_residual_add_exact.so"
          cc -O3 -std=c11 -fno-fast-math -fno-associative-math -ffp-contract=off -fno-tree-vectorize -fPIC -shared \
            research/qwen38/attention_gate_exact.c -lm -o "$RUNNER_TEMP/libqwen_attention_gate_exact.so"
          cc -O3 -std=c11 -fno-fast-math -fno-associative-math -ffp-contract=off -fno-tree-vectorize -fPIC -shared \
            research/qwen38/gdn_repeat_scale_exact.c -o "$RUNNER_TEMP/libqwen_gdn_repeat_scale_exact.so"

      - name: Run exact current-best under cProfile
        timeout-minutes: 18
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          PYTHONPATH=research/qwen38 python -u -m cProfile -o "$EVIDENCE/current-best.pstats" \
            research/qwen38/qwen38_post_fastmarshal_profile.py run \
            --model "$MODEL" \
            --quant-lib "$RUNNER_TEMP/libqwen_quant_base.so" \
            --many-lib "$RUNNER_TEMP/libqwen_quant_many_noalloc.so" \
            --state-lib "$RUNNER_TEMP/libqwen_gdn_serial.so" \
            --f32-lib "$RUNNER_TEMP/libqwen_f32_fsum.so" \
            --attn-lib "$RUNNER_TEMP/libqwen_attention_exact.so" \
            --conv-lib "$RUNNER_TEMP/libqwen_gdn_conv_exact.so" \
            --gate-lib "$RUNNER_TEMP/libqwen_gdn_output_gate_exact.so" \
            --swiglu-lib "$RUNNER_TEMP/libqwen_swiglu_exact.so" \
            --rmsnorm-lib "$RUNNER_TEMP/libqwen_rmsnorm_exact.so" \
            --residual-lib "$RUNNER_TEMP/libqwen_residual_add_exact.so" \
            --attention-gate-lib "$RUNNER_TEMP/libqwen_attention_gate_exact.so" \
            --repeat-lib "$RUNNER_TEMP/libqwen_gdn_repeat_scale_exact.so" \
            --inventory "$EVIDENCE/inventory.json" \
            --work-dir "$K3_WORK" \
            --output "$EVIDENCE/instrumented-exact.json" \
            2>&1 | tee "$EVIDENCE/instrumented-exact.log"
          grep -F "QWEN38_POST_FASTMARSHAL_PROFILE_BITWISE_PASS" "$EVIDENCE/instrumented-exact.log"

      - name: Extract Qwen Python hotspot ranking
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pstats
          from pathlib import Path
          root=Path(os.environ["EVIDENCE"])
          s=pstats.Stats(str(root/"current-best.pstats"))
          rows=[]
          for (filename, lineno, func), (cc, nc, tt, ct, callers) in s.stats.items():
              norm=filename.replace("\\", "/")
              if "/research/qwen38/" not in norm:
                  continue
              rows.append({
                  "file": norm.rsplit("/", 1)[-1], "line": lineno, "function": func,
                  "primitive_calls": cc, "calls": nc,
                  "self_seconds_profiled": tt, "cumulative_seconds_profiled": ct,
              })
          by_self=sorted(rows, key=lambda x: x["self_seconds_profiled"], reverse=True)
          by_cum=sorted(rows, key=lambda x: x["cumulative_seconds_profiled"], reverse=True)
          out={
              "schema":"qwen38-current-best-python-hotspots-v1",
              "warning":"cProfile timings are instrumentation-distorted; use ranking only, not speed benchmark",
              "profile_total_seconds": s.total_tt,
              "top_self": by_self[:80],
              "top_cumulative": by_cum[:80],
          }
          (root/"python-hotspots.json").write_text(json.dumps(out, indent=2)+"\n")
          print(json.dumps({"profile_total_seconds":s.total_tt,"top_self":by_self[:30]}, indent=2))
          print("QWEN38_CURRENT_BEST_PYTHON_HOTSPOTS_PASS")
          PY

      - name: Upload profiler evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen38-current-best-python-hotspots-${{ github.run_id }}
          path: ${{ env.EVIDENCE }}/
          if-no-files-found: warn
          retention-days: 14
