name: Apply backend Phase 1

on:
  push:
    branches: [main]
    paths: [.github/workflows/phase1-apply.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply publication-safety patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/manifest_utils.py'); s=p.read_text()
          old='''def atomic_replace(src: Path | str, dst: Path | str, max_retries: int = 8, delay: float = 0.05) -> None:\n    src_path = Path(src)\n    dst_path = Path(dst)\n    for attempt in range(max_retries):\n        try:\n            os.replace(src_path, dst_path)\n            return\n        except PermissionError:\n            if attempt == max_retries - 1:\n                try:\n                    shutil.copyfile(src_path, dst_path)\n                    try:\n                        src_path.unlink()\n                    except OSError:\n                        pass\n                    return\n                except Exception:\n                    raise\n            time.sleep(delay)\n\n\n'''
          new='''def atomic_replace(src: Path | str, dst: Path | str, max_retries: int = 8, delay: float = 0.05) -> None:\n    \"\"\"Publish by atomic rename only; exhausted retries leave old bytes intact.\"\"\"\n    if max_retries < 1:\n        raise ValueError(\"max_retries must be >= 1\")\n    if delay < 0:\n        raise ValueError(\"delay must be >= 0\")\n    src_path, dst_path = Path(src), Path(dst)\n    last_error = None\n    for attempt in range(max_retries):\n        try:\n            os.replace(src_path, dst_path)\n            return\n        except PermissionError as exc:\n            last_error = exc\n            if attempt + 1 < max_retries and delay:\n                time.sleep(delay)\n    raise last_error\n\n\ndef _copy_rollback_snapshot(src: Path, dst: Path) -> None:\n    \"\"\"Create a durable byte-independent rollback snapshot.\"\"\"\n    try:\n        with src.open(\"rb\") as source, dst.open(\"xb\") as backup:\n            shutil.copyfileobj(source, backup, length=1024 * 1024)\n            backup.flush()\n            os.fsync(backup.fileno())\n        try:\n            shutil.copystat(src, dst, follow_symlinks=False)\n        except OSError:\n            pass\n    except Exception:\n        dst.unlink(missing_ok=True)\n        raise\n\n\ndef publish_then_commit(src: Path | str, dst: Path | str, commit_callback) -> None:\n    \"\"\"Publish one artifact and restore its previous bytes if metadata commit fails.\"\"\"\n    src_path, dst_path = Path(src), Path(dst)\n    rollback = None\n    if dst_path.is_symlink():\n        raise ValueError(f\"Refusing symlink publication target: {dst_path}\")\n    if dst_path.is_file():\n        rollback = dst_path.with_name(f\".{dst_path.name}.{uuid.uuid4().hex}.publish-rollback\")\n        _copy_rollback_snapshot(dst_path, rollback)\n    published = committed = False\n    try:\n        atomic_replace(src_path, dst_path)\n        published = True\n        commit_callback()\n        committed = True\n    except Exception:\n        if published:\n            if rollback is not None and rollback.is_file():\n                atomic_replace(rollback, dst_path)\n                rollback = None\n            else:\n                dst_path.unlink(missing_ok=True)\n        raise\n    finally:\n        if committed and rollback is not None:\n            rollback.unlink(missing_ok=True)\n\n\n'''
          assert s.count(old)==1; s=s.replace(old,new,1)
          old='''                if existed:\n                    backup = self.chapter_dir / (\n                        f\".{path.name}.{self.transaction_id}.rollback\"\n                    )\n                    try:\n                        os.link(path, backup)\n                    except OSError:\n                        shutil.copy2(path, backup)\n'''
          new='''                if existed:\n                    backup = self.chapter_dir / (\n                        f\".{path.name}.{self.transaction_id}.rollback\"\n                    )\n                    _copy_rollback_snapshot(path, backup)\n'''
          assert s.count(old)==1; p.write_text(s.replace(old,new,1))

          p=Path('app/routers/render_commit.py'); s=p.read_text()
          old='from app.manifest_utils import bump_page_revision, get_manifest_lock, load_manifest_raw, save_manifest_raw\n'
          new='''from app.manifest_utils import (\n    bump_page_revision, get_manifest_lock, load_manifest_raw,\n    publish_then_commit, save_manifest_raw,\n)\n'''; assert s.count(old)==1; s=s.replace(old,new,1)
          old='''        final_signature = render_input_signature(manifest, req.page_index)\n        os.replace(tmp_path, final_path)\n        render_revision = bump_page_revision(page, \"render_revision\")\n        stamp_render_artifact(\n            page,\n            input_signature=final_signature,\n            output_path=final_path,\n        )\n        save_manifest_raw(req.chapter_id, manifest)\n        return True, render_revision\n'''
          new='''        final_signature = render_input_signature(manifest, req.page_index)\n        target_render_revision = int(page.get(\"render_revision\") or 0) + 1\n        def commit_manifest() -> None:\n            render_revision = bump_page_revision(page, \"render_revision\")\n            if render_revision != target_render_revision:\n                raise RuntimeError(\"Page render revision changed during commit\")\n            stamp_render_artifact(page, input_signature=final_signature, output_path=final_path)\n            save_manifest_raw(req.chapter_id, manifest)\n        publish_then_commit(tmp_path, final_path, commit_manifest)\n        return True, target_render_revision\n'''; assert s.count(old)==1; p.write_text(s.replace(old,new,1))

          p=Path('app/routers/export.py'); s=p.read_text()
          old='from app.manifest_utils import get_manifest_lock, load_manifest_raw, save_manifest_raw, urlify_manifest\n'
          new='from app.manifest_utils import atomic_replace, get_manifest_lock, load_manifest_raw, save_manifest_raw, urlify_manifest\n'; assert s.count(old)==1; s=s.replace(old,new,1)
          assert s.count('            os.replace(tmp_archive, final_archive)\n')==1
          p.write_text(s.replace('            os.replace(tmp_archive, final_archive)\n','            atomic_replace(tmp_archive, final_archive)\n',1))
          PY
          cat > scripts/backend_foundation_sanity.py <<'PY'
          from __future__ import annotations
          import json, os, sys, tempfile
          from pathlib import Path
          from unittest import mock
          ROOT=Path(__file__).resolve().parent.parent; sys.path.insert(0,str(ROOT))
          def check(c,m):
              if not c: raise AssertionError(m)
          def mb(r): return json.dumps({"schema_version":3,"chapter_id":"a1b2c3d4","pages":[{"clean_revision":r}]},separators=(",",":")).encode()
          def publication_safety_checks():
              import app.manifest_utils as mu
              with tempfile.TemporaryDirectory() as t:
                  r=Path(t); src=r/'n.tmp'; dst=r/'live'; src.write_bytes(b'NEW'); dst.write_bytes(b'OLD'); calls=0
                  def locked(a,b):
                      nonlocal calls; calls+=1; raise PermissionError('locked')
                  with mock.patch.object(mu.os,'replace',side_effect=locked):
                      try: mu.atomic_replace(src,dst,max_retries=3,delay=0)
                      except PermissionError: pass
                      else: raise AssertionError('rename unexpectedly succeeded')
                  check(calls==3,'retry count'); check(dst.read_bytes()==b'OLD','old destination changed'); check(src.read_bytes()==b'NEW','temp changed')
              with tempfile.TemporaryDirectory() as t:
                  r=Path(t); live=r/'clean.png'; live.write_bytes(b'OLD'); (r/'manifest.json').write_bytes(mb(0)); tx=mu.PageArtifactTransaction(r,0,[live],1); tx.__enter__(); backup=r/str(tx.records[0]['backup']); live.write_bytes(b'NEW'); check(backup.read_bytes()==b'OLD','rollback shares inode'); check(tx.rollback(),'rollback failed'); check(live.read_bytes()==b'OLD','rollback bytes wrong')
              with tempfile.TemporaryDirectory() as t:
                  r=Path(t); live=r/'clean.png'; live.write_bytes(b'OLD'); (r/'manifest.json').write_bytes(mb(0)); tx=mu.PageArtifactTransaction(r,0,[live],1); tx.__enter__(); live.write_bytes(b'NEW'); check(mu.recover_page_artifact_transactions(r)==1,'recovery count'); check(live.read_bytes()==b'OLD','precommit crash not restored')
              with tempfile.TemporaryDirectory() as t:
                  r=Path(t); live=r/'clean.png'; live.write_bytes(b'OLD'); (r/'manifest.json').write_bytes(mb(0)); tx=mu.PageArtifactTransaction(r,0,[live],1); tx.__enter__(); n=r/'n.tmp'; n.write_bytes(b'NEW'); mu.atomic_replace(n,live); (r/'manifest.json').write_bytes(mb(1)); check(mu.recover_page_artifact_transactions(r)==1,'commit recovery count'); check(live.read_bytes()==b'NEW','committed artifact rolled back')
              with tempfile.TemporaryDirectory() as t:
                  r=Path(t); src=r/'render.tmp'; dst=r/'page.png'; src.write_bytes(b'NEW'); dst.write_bytes(b'OLD')
                  try: mu.publish_then_commit(src,dst,lambda: (_ for _ in ()).throw(RuntimeError('manifest')))
                  except RuntimeError: pass
                  else: raise AssertionError('metadata failure succeeded')
                  check(dst.read_bytes()==b'OLD','render rollback failed')
              p=(ROOT/'app/pipeline.py').read_text(); rr=(ROOT/'app/routers/render_commit.py').read_text(); ex=(ROOT/'app/routers/export.py').read_text()
              check('atomic_replace(tmp_clean_path, final_clean_path)' in p,'clean publish'); check('atomic_replace(tmp_auto_clean_path, auto_clean_path)' in p,'auto-clean publish'); check('publish_then_commit(tmp_path, final_path, commit_manifest)' in rr,'render publish'); check('atomic_replace(tmp_archive, final_archive)' in ex,'export publish')
          def windows_locked_reader_check():
              if os.name!='nt': return
              import ctypes; from ctypes import wintypes; import app.manifest_utils as mu
              k=ctypes.WinDLL('kernel32',use_last_error=True); cf=k.CreateFileW; cf.argtypes=[wintypes.LPCWSTR,wintypes.DWORD,wintypes.DWORD,wintypes.LPVOID,wintypes.DWORD,wintypes.DWORD,wintypes.HANDLE]; cf.restype=wintypes.HANDLE; ch=k.CloseHandle
              with tempfile.TemporaryDirectory() as t:
                  r=Path(t); src=r/'n.tmp'; dst=r/'live'; src.write_bytes(b'NEW'); dst.write_bytes(b'OLD'); h=cf(str(dst),0x80000000,1,None,3,0,None)
                  try:
                      try: mu.atomic_replace(src,dst,max_retries=2,delay=0)
                      except PermissionError: pass
                      else: raise AssertionError('locked Windows rename succeeded')
                      check(dst.read_bytes()==b'OLD','Windows old bytes changed'); check(src.read_bytes()==b'NEW','Windows temp changed')
                  finally: ch(h)
          publication_safety_checks(); windows_locked_reader_check(); print('backend foundation sanity: publication safety PASS')
          PY
          python -m py_compile app/manifest_utils.py app/routers/render_commit.py app/routers/export.py scripts/backend_foundation_sanity.py
      - run: python -m pip install numpy==1.26.4 Pillow==10.4.0 opencv-contrib-python==4.10.0.84 fastapi==0.115.0 pydantic==2.9.2 filelock==3.16.1 loguru==0.7.2
      - name: Run Phase 1 regressions before commit
        run: python scripts/backend_foundation_sanity.py
      - name: Commit Phase 1 code only
        shell: bash
        run: |
          git config user.name "Manga backend CI"
          git config user.email "actions@users.noreply.github.com"
          git add app/manifest_utils.py app/routers/render_commit.py app/routers/export.py scripts/backend_foundation_sanity.py
          git commit -m "fix(storage): preserve atomic publication rollback"
          git push origin HEAD:main

  windows-proof:
    needs: apply
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy==1.26.4 Pillow==10.4.0 opencv-contrib-python==4.10.0.84 fastapi==0.115.0 pydantic==2.9.2 filelock==3.16.1 loguru==0.7.2
      - run: python scripts/backend_foundation_sanity.py
