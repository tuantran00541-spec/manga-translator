name: Qwen3.8 K3 real MLP quant probe

on:
  push:
    branches:
      - test/qwen3.8-27b
    paths:
      - "research/qwen38/k3_quant_real_mlp_probe.py"
      - ".github/workflows/qwen38-k3-real-mlp-quant-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-mlp-q5-q4-probe:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        contains(github.event.head_commit.message, '[qwen-quant-real]')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU dependencies
        run: |
          python -m pip install --no-cache-dir huggingface_hub safetensors
          python -m pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile probe
        run: |
          python -m py_compile research/qwen38/core.py research/qwen38/k3_quant_real_mlp_probe.py
      - name: Run official layer-0 MLP Q5/Q4 probe
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/qwen38-real-quant"
          evidence="$RUNNER_TEMP/qwen38-real-quant-evidence"
          mkdir -p "$work" "$evidence"
          /usr/bin/time -v python research/qwen38/k3_quant_real_mlp_probe.py \
            --work-dir "$work" \
            --layer 0 \
            --rows 256 \
            --group-size 64 \
            --samples 3 \
            --output "$evidence/real-mlp-quant.json" \
            2>&1 | tee "$evidence/real-mlp-quant.log"
      - name: Show evidence and cleanup
        if: always()
        run: |
          cat "$RUNNER_TEMP/qwen38-real-quant-evidence/real-mlp-quant.json" || true
          df -h || true
          free -h || true
          rm -rf "$RUNNER_TEMP/qwen38-real-quant" || true
      - name: Upload metrics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen38-k3-real-mlp-quant-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/qwen38-real-quant-evidence/real-mlp-quant.json
            ${{ runner.temp }}/qwen38-real-quant-evidence/real-mlp-quant.log
          if-no-files-found: warn
          retention-days: 14
