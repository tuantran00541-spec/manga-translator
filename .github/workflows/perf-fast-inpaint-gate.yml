name: Perf fast inpaint gate

on:
  push:
    branches:
      - perf/bubble-fastpath-roi-lama
  workflow_dispatch:

jobs:
  fast-inpaint-tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install correctness-test runtime
        run: python -m pip install -r requirements-test.txt
      - name: Compile candidate
        run: python -m compileall -q app
      - name: Run fast processing and OCR candidate tests
        run: |
          python -m pytest -q \
            tests/test_fast_inpaint_paths.py \
            tests/test_fast_residue_detector.py \
            tests/test_parallel_focus_detector.py \
            tests/test_cleanup_safety_regressions.py \
            tests/test_inpaint_preload.py \
            tests/test_adaptive_lama_runtime.py \
            tests/test_ocr_pipeline_regressions.py \
            tests/test_ai_repair_controls.py \
            tests/test_benchmark_registry.py \
            tests/test_detector_inference_cache.py
