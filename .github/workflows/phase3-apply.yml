name: Apply backend Phase 3

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/phase3-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply Phase 3 patch
        run: python scripts/phase3_apply.py
      - name: Compile Phase 3 source
        run: >-
          python -m py_compile app/detector/bubble_detector.py
          app/detector/combined_detector.py app/inpaint/lama_inpainter.py
          app/pipeline.py app/routers/render_commit.py scripts/backend_foundation_sanity.py
      - name: Install deterministic test runtime
        run: >-
          python -m pip install
          numpy==1.26.4 Pillow==10.4.0 opencv-contrib-python==4.10.0.84
          fastapi==0.115.0 pydantic==2.9.2 filelock==3.16.1 loguru==0.7.2
      - name: Run Phase 3 acceptance fixtures
        run: python scripts/backend_foundation_sanity.py
      - name: Run source sanity before commit
        run: python scripts/release_sanity.py
      - name: Commit Phase 3 production code
        shell: bash
        run: |
          git config user.name "Manga backend CI"
          git config user.email "actions@users.noreply.github.com"
          git add app/detector/bubble_detector.py app/detector/combined_detector.py app/inpaint/lama_inpainter.py app/pipeline.py app/routers/render_commit.py scripts/backend_foundation_sanity.py
          git commit -m "fix(detector): retain deferred text evidence"
          git push origin HEAD:main
