name: Apply Phase 9 release gate repair

on:
  push:
    branches: [main]
    paths:
      - scripts/apply_phase9_release_gate_fix.py
      - .github/workflows/phase9-apply.yml

permissions:
  contents: write

concurrency:
  group: phase9-release-gate-repair-main
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply Phase 9 release gate patch
        run: python scripts/apply_phase9_release_gate_fix.py
      - name: Compile browser sanity
        run: python -m py_compile scripts/browser_sanity.py
      - name: Run browser sanity
        run: python scripts/browser_sanity.py
      - name: Commit Phase 9 production repair
        shell: bash
        run: |
          git config user.name "Manga frontend CI"
          git config user.email "actions@users.noreply.github.com"
          git add app/static/css/workbench.css app/static/css/tokens.css scripts/browser_sanity.py
          git diff --cached --quiet && exit 0
          git commit -m "fix(ui): repair design token release gate"
          git push origin HEAD:main
