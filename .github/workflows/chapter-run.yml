name: Chapter run

on:
  push:
    paths:
      - "scripts/chapter_run.py"
      - ".github/workflows/chapter-run.yml"
  workflow_dispatch:
    inputs:
      chapter_url:
        description: "Chapter to clean"
        required: false
      save_slices:
        description: "Slice numbers to save whole, comma separated"
        required: false
      lama_model:
        description: "Inpaint model: manga (default) or biglama (one-off comparison)"
        required: false

permissions:
  contents: write

concurrency:
  group: chapter-run-${{ github.ref }}-${{ github.event.inputs.chapter_url }}-${{ github.event.inputs.lama_model }}
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: "."
      MANGA_PROCESSING_PIPELINE: fast
      MANGA_USE_DYNAMIC_LAMA: "1"
      MANGA_ORT_PROVIDER: openvino
      MANGA_ORT_REQUIRE_PROVIDER: "1"
      MANGA_ORT_OPENVINO_SCOPE: detectors
      MANGA_ORT_OPENVINO_THREADS: "2"
      MANGA_ORT_OPENVINO_STREAMS: "1"
      MANGA_ORT_OPENVINO_CACHE_DIR: /tmp/manga-openvino-cache
      OPENBLAS_NUM_THREADS: "1"
      CHAPTER_URL: ${{ github.event.inputs.chapter_url || 'https://asurascans.com/comics/shadow-slave-05c7df14/chapter/1' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install processing runtime
        run: |
          python -m pip install --only-binary :all: numpy==1.26.4 Pillow==10.4.0 opencv-contrib-python==4.10.0.84 \
            onnxruntime-openvino==1.24.1 psutil==6.1.1 loguru==0.7.2 requests==2.32.3 \
            beautifulsoup4==4.12.3 lxml==5.3.0 playwright==1.47.0 fastapi==0.115.0 \
            pydantic==2.9.2 filelock==3.16.1 python-multipart==0.0.12
          python -m playwright install --with-deps chromium

      - name: Restore detector and inpaint models
        uses: actions/cache/restore@v4
        with:
          path: |
            models/*.onnx
            models/.e2e-provenance.json
          key: processing-profile-models-b224548-v1

      - name: Build the CTD mask model
        uses: ./.github/actions/build-ctd

      - name: Swap in Big-LaMa
        if: github.event.inputs.lama_model == 'biglama'
        run: |
          curl -sSL -o models/lama-manga-dynamic.onnx https://huggingface.co/Carve/LaMa-ONNX/resolve/main/lama_fp32.onnx
          echo "1faef5301d78db7dda502fe59966957ec4b79dd64e16f03ed96913c7a4eb68d6  models/lama-manga-dynamic.onnx" | sha256sum -c
          python -m pip install --only-binary :all: onnx==1.17.0
          # Carve's file is fixed at 512 px with 0..255 output; the app wants any size and 0..1.
          python - <<'PY'
          import numpy as np, onnx
          from onnx import helper, numpy_helper
          path = "models/lama-manga-dynamic.onnx"
          m = onnx.load(path)
          for v in m.graph.input:
              v.type.tensor_type.shape.dim[2].dim_param = "height"
              v.type.tensor_type.shape.dim[3].dim_param = "width"
          for n in m.graph.node:
              n.output[:] = ["raw255" if o == "output" else o for o in n.output]
          m.graph.initializer.append(numpy_helper.from_array(np.array(255.0, np.float32), "k255"))
          m.graph.node.append(helper.make_node("Div", ["raw255", "k255"], ["inpainted"]))
          m.graph.output[0].name = "inpainted"
          onnx.save(m, path)
          PY
          echo "22923b852e34fa326a5afb9ef8df1beed29eedcc0b671f10f84235d98c916931  models/lama-manga-dynamic.onnx" | sha256sum -c

      - name: Check the models are there
        run: |
          ls -la models
          test -f models/lama-manga-dynamic.onnx && test -f models/kiuyha_text_1280.onnx

      - name: Process the whole chapter
        run: python scripts/chapter_run.py "$CHAPTER_URL" --out audit-results/chapter-run --save-slices "${{ github.event.inputs.save_slices }}"

      - name: Save evidence to audit-evidence
        if: always()
        uses: ./.github/actions/save-evidence
        with:
          paths: audit-results/chapter-run
          message: "audit: chapter run (run ${{ github.run_id }})"
