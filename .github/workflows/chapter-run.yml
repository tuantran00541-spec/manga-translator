name: Chapter run

on:
  push:
    paths:
      - "scripts/chapter_run.py"
      - ".github/workflows/chapter-run.yml"
  workflow_dispatch:
    inputs:
      chapter_url:
        description: "Chapter to clean"
        required: false

permissions:
  contents: write

concurrency:
  group: chapter-run-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: "."
      MANGA_PROCESSING_PIPELINE: fast
      MANGA_USE_DYNAMIC_LAMA: "1"
      MANGA_ORT_PROVIDER: openvino
      MANGA_ORT_REQUIRE_PROVIDER: "1"
      MANGA_ORT_OPENVINO_SCOPE: detectors
      MANGA_ORT_OPENVINO_THREADS: "2"
      MANGA_ORT_OPENVINO_STREAMS: "1"
      MANGA_ORT_OPENVINO_CACHE_DIR: /tmp/manga-openvino-cache
      OPENBLAS_NUM_THREADS: "1"
      CHAPTER_URL: ${{ github.event.inputs.chapter_url || 'https://asurascans.com/comics/shadow-slave-05c7df14/chapter/1' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install processing runtime
        run: |
          python -m pip install --only-binary :all: numpy==1.26.4 Pillow==10.4.0 opencv-contrib-python==4.10.0.84 \
            onnxruntime-openvino==1.24.1 psutil==6.1.1 loguru==0.7.2 requests==2.32.3 \
            beautifulsoup4==4.12.3 lxml==5.3.0 playwright==1.47.0 fastapi==0.115.0 \
            pydantic==2.9.2 filelock==3.16.1 python-multipart==0.0.12
          python -m playwright install --with-deps chromium

      - name: Restore detector and inpaint models
        uses: actions/cache/restore@v4
        with:
          path: |
            models/*.onnx
            models/.e2e-provenance.json
          key: processing-profile-models-b224548-v1

      - name: Use the committed Kiuyha, not the cached one
        run: git checkout -- models/kiuyha_text_1280.onnx && md5sum models/kiuyha_text_1280.onnx

      - name: Download LaMa when the cache has expired
        run: |
          test -f models/lama-manga-dynamic.onnx || curl -fsSL -o models/lama-manga-dynamic.onnx \
            https://huggingface.co/ogkalu/lama-manga-onnx-dynamic/resolve/main/lama-manga-dynamic.onnx
          echo "de31ffa5ba26916b8ea35319f6c12151ff9654d4261bccf0583a69bb095315f9  models/lama-manga-dynamic.onnx" | sha256sum -c

      - name: Build the CTD mask model
        uses: ./.github/actions/build-ctd

      - name: Check the models are there
        run: |
          ls -la models
          test -f models/lama-manga-dynamic.onnx && test -f models/kiuyha_text_1280.onnx

      - name: Process the whole chapter
        run: python scripts/chapter_run.py "$CHAPTER_URL" --out audit-results/chapter-run

      - name: Save evidence to audit-evidence
        if: always()
        uses: ./.github/actions/save-evidence
        with:
          paths: audit-results/chapter-run
          message: "audit: chapter run (run ${{ github.run_id }})"
