name: Apply staged UI rewrite

on:
  pull_request:
    branches:
      - ui-rewrite-helper-base
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'ui-system-rewrite'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Verify and apply staged payload
        shell: bash
        run: |
          set -euo pipefail
          test -f .ui-rewrite-payload/.ready
          cat .ui-rewrite-payload/part-* > /tmp/ui-rewrite.tar.gz.b64
          base64 -d /tmp/ui-rewrite.tar.gz.b64 > /tmp/ui-rewrite.tar.gz
          echo "c42cbd1e942866a673473bb6e1a839fb7c5d66ef0fd60978bfc2f27de285b2d4  /tmp/ui-rewrite.tar.gz" | sha256sum -c -
          tar -xzf /tmp/ui-rewrite.tar.gz -C .
          rm -rf .ui-rewrite-payload
          rm -f .github/workflows/apply-ui-system-rewrite.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No UI changes to commit."
            exit 0
          fi
          git commit -m "refactor(ui): unify application workspace and product language [ui-applied]"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
