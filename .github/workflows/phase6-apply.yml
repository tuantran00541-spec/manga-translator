name: Apply backend Phase 6 safety

on:
  push:
    branches: [main]
    paths:
      - scripts/apply_phase6_patch.py
      - scripts/run_phase6_apply.py
      - scripts/research_mask_quality_sanity.py
      - .github/workflows/phase6-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply Phase 6 safety patch
        run: python scripts/run_phase6_apply.py
      - name: Compile Phase 6 source
        run: >-
          python -m py_compile app/parameters.py app/detector/recovery.py
          app/detector/mask_builder.py app/detector/combined_detector.py
          app/inpaint/lama_inpainter.py scripts/inpaint_authority_sanity.py
          scripts/backend_phase6_sanity.py scripts/research_mask_quality_sanity.py
      - name: Install deterministic test runtime
        run: >-
          python -m pip install numpy==1.26.4 opencv-contrib-python==4.10.0.84
          fastapi==0.115.0 pydantic==2.9.2 filelock==3.16.1 loguru==0.7.2 Pillow==10.4.0
      - name: Run Phase 6 deterministic safety fixtures
        run: python scripts/backend_phase6_sanity.py
      - name: Verify research truth gate still blocks missing human labels
        run: python scripts/research_mask_quality_sanity.py
      - name: Run existing backend source/authority regressions
        run: |
          python scripts/release_sanity.py
          python scripts/inpaint_authority_sanity.py
          python scripts/backend_phase4_sanity.py
          python scripts/backend_phase5_sanity.py --correctness-only
      - name: Commit Phase 6 deterministic safety fixes
        shell: bash
        run: |
          git config user.name "Manga backend CI"
          git config user.email "actions@users.noreply.github.com"
          git add app/parameters.py app/detector/recovery.py app/detector/mask_builder.py app/detector/combined_detector.py app/inpaint/lama_inpainter.py scripts/inpaint_authority_sanity.py scripts/backend_phase6_sanity.py scripts/research_mask_quality_sanity.py
          git diff --cached --quiet && exit 0
          git commit -m "fix(inpaint): harden mask authority and compositing"
          git push origin HEAD:main
