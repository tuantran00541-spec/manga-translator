name: Audit checks

on:
  push:
    branches: ["audit/project-tests-20261101"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regressions:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: python -m pip install -r requirements-test.txt
      - name: Audit regression checks
        run: python -m pytest -v scripts/audit/regression_check.py --junitxml=audit-regression.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-regression-results
          path: audit-regression.xml
          if-no-files-found: ignore
          retention-days: 14

  minirouter-smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: python -m pip install -r requirements-test.txt
      - name: Live AI scan and translation (two requests)
        env:
          MINIROUTER_API_KEY: ${{ secrets.MINIROUTER_API_KEY }}
          PYTHONPATH: .
        run: python scripts/audit/live_minirouter.py
