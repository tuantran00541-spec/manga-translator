name: Qwen3.8 exact GDN internal stage profile

on:
  push:
    branches:
      - research/qwen3.8-27b-runtime-finish
    paths:
      - research/qwen38/qwen38_gdn_stage_profile.py
      - .github/workflows/qwen38-gdn-stage-profile.yml
  workflow_dispatch:

jobs:
  gdn-stage-profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      QWEN_REVISION: 1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0
    steps:
      - uses: actions/checkout@v4

      - name: Profiler sanity
        run: PYTHONPATH=research/qwen38 python -u research/qwen38/qwen38_gdn_stage_profile.py sanity

      - name: Compile native attention synthetic exact gate
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -euo pipefail
          cc -O3 -std=c11 -fno-fast-math -fno-associative-math -ffp-contract=off -fPIC -shared \
            research/qwen38/attention_core_exact.c -lm \
            -o "$RUNNER_TEMP/libqwen_attention_exact.so"
          PYTHONPATH=research/qwen38 python -u research/qwen38/qwen38_attention_core_exact_probe.py sanity \
            --attn-lib "$RUNNER_TEMP/libqwen_attention_exact.so"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Runner CPU and storage information
        run: |
          lscpu
          df -h
          free -h

      - name: Reclaim disk
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true
          docker system prune -af || true
          df -h
          free -h

      - name: Install runtime dependencies
        run: python -m pip install --no-cache-dir huggingface_hub hf_xet

      - name: Download pinned GGUF
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -euo pipefail
          MODEL=$(python - <<'PY'
          from huggingface_hub import hf_hub_download
          print(hf_hub_download("bartowski/Qwen3.8-27B-GGUF", filename="Qwen3.8-27B-Q6_K_L.gguf", local_dir="${{ runner.temp }}/qwen38-model"))
          PY
          )
          echo "MODEL=$MODEL" >> "$GITHUB_ENV"
          echo "K3_WORK=$RUNNER_TEMP/qwen38-gdn-stage-k3" >> "$GITHUB_ENV"
          echo "EVIDENCE=$RUNNER_TEMP/qwen38-gdn-stage-evidence" >> "$GITHUB_ENV"

      - name: Validate pinned decoder inventory
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          PYTHONPATH=research/qwen38 python -u research/qwen38/qwen35_gguf_decoder_contract.py real \
            --model "$MODEL" --output "$EVIDENCE/inventory.json" \
            2>&1 | tee "$EVIDENCE/inventory.log"

      - name: Compile exact runtime bridges
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -euo pipefail
          cc -O3 -std=c11 -mavx2 -fno-fast-math -ffp-contract=off -fPIC -shared \
            research/qwen38/gguf_quant_matvec_many_bridge.c -lm \
            -o "$RUNNER_TEMP/libqwen_quant_many.so"
          cc -O2 -std=c11 -fno-fast-math -ffp-contract=off -fPIC -shared \
            research/qwen38/gdn_state_ar.c -lm \
            -o "$RUNNER_TEMP/libqwen_gdn_serial.so"
          cc -O3 -std=c11 -fno-fast-math -fno-associative-math -ffp-contract=off -fPIC -shared \
            research/qwen38/f32_fsum_matvec.c -lm \
            -o "$RUNNER_TEMP/libqwen_f32_fsum.so"
          cc -O3 -std=c11 -fno-fast-math -fno-associative-math -ffp-contract=off -fPIC -shared \
            research/qwen38/attention_core_exact.c -lm \
            -o "$RUNNER_TEMP/libqwen_attention_exact.so"

      - name: Run exact 11-token GDN stage profile
        timeout-minutes: 12
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          PYTHONPATH=research/qwen38 python -u research/qwen38/qwen38_gdn_stage_profile.py run \
            --model "$MODEL" \
            --quant-lib "$RUNNER_TEMP/libqwen_quant_many.so" \
            --many-lib "$RUNNER_TEMP/libqwen_quant_many.so" \
            --state-lib "$RUNNER_TEMP/libqwen_gdn_serial.so" \
            --f32-lib "$RUNNER_TEMP/libqwen_f32_fsum.so" \
            --attn-lib "$RUNNER_TEMP/libqwen_attention_exact.so" \
            --inventory "$EVIDENCE/inventory.json" \
            --work-dir "$K3_WORK" \
            --output "$EVIDENCE/gdn-stage-profile.json" \
            2>&1 | tee "$EVIDENCE/gdn-stage-profile.log"
          grep -F "QWEN38_GDN_STAGE_PROFILE_BITWISE_PASS" "$EVIDENCE/gdn-stage-profile.log"

      - name: Print GDN stage summary
        if: always()
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -euo pipefail
          if [[ -f "$EVIDENCE/gdn-stage-profile.json" ]]; then
            python - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads((Path(os.environ["EVIDENCE"])/"gdn-stage-profile.json").read_text())
          print(json.dumps({
              "status": r["status"],
              "hidden_sha256": r["hidden_sha256"],
              "state_sha256": r["state_sha256"],
              "prefill_seconds": r["prefill_seconds"],
              "gdn_profile": r["gdn_profile"],
              "native_attention_core_seconds": r["native_attention_core_seconds"],
              "k3_bytes": r["k3_bytes"],
              "max_rss_gib": r["max_rss_gib"],
          }, indent=2))
          PY
          fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen38-gdn-stage-profile-${{ github.run_id }}
          path: ${{ env.EVIDENCE }}/
          if-no-files-found: warn
          retention-days: 14
