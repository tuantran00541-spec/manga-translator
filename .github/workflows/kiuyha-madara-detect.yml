name: Kiuyha Madara detect

on:
  workflow_dispatch:
    inputs:
      chapter_urls:
        description: "MadaraScans chapter URLs, one per line"
        required: true
        default: |
          https://madarascans.net/hero-killer-chapter-275/
          https://madarascans.net/hero-killer-chapter-274/
          https://madarascans.net/hero-killer-chapter-273/
      out_dir:
        description: "Output directory under audit-results"
        required: false
        default: "madara-detect"

permissions:
  contents: write

jobs:
  detect:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: "."
      MANGA_PROCESSING_PIPELINE: fast
      MANGA_ORT_PROVIDER: openvino
      MANGA_ORT_REQUIRE_PROVIDER: "1"
      MANGA_ORT_OPENVINO_SCOPE: detectors
      MANGA_ORT_OPENVINO_THREADS: "2"
      MANGA_ORT_OPENVINO_STREAMS: "1"
      MANGA_ORT_OPENVINO_CACHE_DIR: /tmp/manga-openvino-cache
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install processing runtime
        run: |
          python -m pip install --only-binary :all: numpy==1.26.4 Pillow==10.4.0 opencv-contrib-python==4.10.0.84 \
            onnxruntime-openvino==1.24.1 psutil==6.1.1 loguru==0.7.2 requests==2.32.3 \
            beautifulsoup4==4.12.3 lxml==5.3.0 playwright==1.47.0 playwright-stealth==2.0.3 fastapi==0.115.0 \
            pydantic==2.9.2 filelock==3.16.1 python-multipart==0.0.20

      - name: Restore detector models
        uses: actions/cache/restore@v4
        with:
          path: |
            models/*.onnx
            models/.e2e-provenance.json
          key: processing-profile-models-b224548-v1

      - name: Use the committed Kiuyha, not the cached one
        run: git checkout -- models/kiuyha-tuned-1023.onnx && md5sum models/kiuyha-tuned-1023.onnx

      - name: Check the models are there
        run: |
          ls -la models
          test -f models/kiuyha-tuned-1023.onnx

      - name: Download all chapters
        run: |
          cat > /tmp/chapter-urls.txt <<'URLS_EOF'
          ${{ inputs.chapter_urls }}
          URLS_EOF
          wc -l /tmp/chapter-urls.txt
          python3 scripts/download_madara.py --urls-file /tmp/chapter-urls.txt --out "audit-results/${{ inputs.out_dir }}"

      - name: Detect all chapters
        run: |
          FAILED=0
          for dir in audit-results/${{ inputs.out_dir }}/ch*/; do
            CHAPTER=$(basename "$dir" | sed 's/^ch//')
            CID=$(printf "a%07x" "$((10#$CHAPTER))")
            if ! python scripts/detect_chapter_zip.py --zip "$dir/madara-ch${CHAPTER}.zip" --chapter "$CHAPTER" --chapter-id "$CID" --out "$dir"; then
              echo "detect failed for ch$CHAPTER"
              FAILED=1
            fi
          done
          exit $FAILED

      - name: Save evidence to audit-evidence
        if: always()
        uses: ./.github/actions/save-evidence
        with:
          paths: audit-results/${{ inputs.out_dir }}
          message: "audit: madara detect batch (run ${{ github.run_id }})"
