name: Agent opened in codex and omp

# One-off: `manga` typed inside clones of openai/codex and can1357/oh-my-pi, key saved in Settings, gpt-6-luna asked about each folder.
on:
  push:
    branches-ignore: [main]
    paths:
      - ".github/workflows/agent-real.yml"
      - ".github/agent-real/drive.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  real:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      OUT: audit-results/agent-real/out
      CODEX: /tmp/real/codex
      OMP: /tmp/real/omp
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -q -r requirements-test.txt playwright
          python -m playwright install --with-deps chromium > /dev/null
          git clone -q --depth 1 https://github.com/openai/codex "$CODEX"
          git clone -q --depth 1 https://github.com/can1357/oh-my-pi "$OMP"
      - name: Does the OS secret store work on a headless Linux box
        run: |
          mkdir -p "$OUT"
          python - <<'PY' 2>&1 | tee "$OUT/keyring-probe.txt"
          import keyring
          print("backend:", keyring.get_keyring())
          try:
              keyring.set_password("manga-probe", "probe", "x")
              print("set/get:", keyring.get_password("manga-probe", "probe") == "x")
          except Exception as exc:
              print("fails:", type(exc).__name__, exc)
              open(__import__("os").environ["GITHUB_ENV"], "a").write("NEEDS_FILE_KEYRING=1\n")
          PY
          if [ -n "${NEEDS_FILE_KEYRING:-}" ] || grep -q fails "$OUT/keyring-probe.txt"; then
            python -m pip install -q keyrings.alt
            echo "PYTHON_KEYRING_BACKEND=keyrings.alt.file.PlaintextKeyring" >> "$GITHUB_ENV"
          fi
      - name: Pick the model id
        env:
          KEY: ${{ secrets.MINIROUTER_API_KEY }}
        run: |
          [ -n "$KEY" ] || { echo "::error::secret MINIROUTER_API_KEY is not set"; exit 1; }
          curl -sS -m 30 -H "Authorization: Bearer $KEY" https://api.minirouter.sh/v1/models > /tmp/models.json || true
          python - <<'PY'
          import json, os
          ids = [r["id"] for r in json.load(open("/tmp/models.json")).get("data", []) if isinstance(r, dict) and "id" in r]
          hits = sorted((i for i in ids if "gpt-6-luna" in i.lower()), key=lambda i: (not i.startswith("openai/"), len(i)))
          if not hits:
              raise SystemExit("no gpt-6-luna model listed")
          open(os.environ["GITHUB_ENV"], "a").write(f"AGENT_MODEL={hits[0]}\n")
          PY
      - name: Type manga in each folder and ask the agent
        env:
          AGENT_API_KEY: ${{ secrets.MINIROUTER_API_KEY }}
          MINUTES_EACH: "20"
        run: |
          python .github/agent-real/drive.py 2>&1 | tail -c 6000 || true
          grep -nE "Traceback|ERROR|Exception" "$OUT/server.log" | head -40 || true
          git -C "$CODEX" status --short | head; git -C "$OMP" status --short | head
          rm -rf "$HOME/.local/share/python_keyring"
      - name: Give git access only now that the agent is done
        if: always()
        env:
          TOKEN: ${{ github.token }}
        run: |
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
      - uses: ./.github/actions/save-evidence
        if: always()
        with:
          paths: audit-results/agent-real/out
          message: "audit: Agent opened in codex and omp (run ${{ github.run_id }})"
