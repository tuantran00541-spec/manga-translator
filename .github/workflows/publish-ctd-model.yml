name: Publish the CTD model

# One-off: builds models/ctd_seg.onnx once and attaches it to the models-v1 release, so installs skip torch.
on:
  push:
    branches: [claude/friendly-hypatia-xi865r]
    paths:
      - .github/workflows/publish-ctd-model.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ./.github/actions/build-ctd
      - name: Check the model loads and runs
        run: |
          python -m pip install -q onnxruntime==1.20.1 numpy==1.26.4
          python -c "import onnxruntime as ort, numpy as np; s = ort.InferenceSession('models/ctd_seg.onnx'); i = s.get_inputs()[0]; print(i.name, i.shape, [o.shape for o in s.run(None, {i.name: np.zeros((1, 3, 1024, 1024), np.float32)})])"
          echo "::notice title=ctd_seg.onnx::sha256 $(sha256sum models/ctd_seg.onnx | cut -d' ' -f1) bytes $(stat -c %s models/ctd_seg.onnx)"
      - name: Attach it to the models-v1 release, never marked latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Model files for the installer, not an app release. ctd_seg.onnx is exported by scripts/export_ctd_onnx.py from comic-text-detector (zyddnys/manga-image-translator, beta-0.3, GPL-3.0)."
          gh release view models-v1 > /dev/null 2>&1 || gh release create models-v1 --target "$GITHUB_SHA" --title "Models v1" --notes "$notes" --latest=false
          gh release upload models-v1 models/ctd_seg.onnx --clobber
