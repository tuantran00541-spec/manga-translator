name: Clean probe (rebuild cleaning from the first commit)

on:
  push:
    paths:
      - ".github/clean-probe/config.json"

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"
  RUNTIME: >-
    numpy==1.26.4 Pillow==10.4.0 opencv-python-headless==4.10.0.84 onnxruntime==1.20.1 scipy==1.14.1 scikit-image==0.24.0
    psutil==6.1.1 loguru==0.7.2 requests==2.32.3 beautifulsoup4==4.12.3 lxml==5.3.0 fastapi==0.115.0 pydantic==2.9.2
    filelock==3.16.1 python-multipart==0.0.12

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      runs: ${{ steps.c.outputs.runs }}
      minutes: ${{ steps.c.outputs.minutes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: c
        run: python3 -c 'import json; c=json.load(open(".github/clean-probe/config.json")); print("runs=" + json.dumps(c["runs"])); print("minutes=" + str(c["minutes"]))' >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the runtime and the browser downloader
        run: |
          python -m pip install -q --only-binary :all: $RUNTIME playwright==1.47.0
          python -m playwright install --with-deps chromium
      - name: Today's models
        run: |
          curl -fsSL -o models/lama-manga-dynamic.onnx https://huggingface.co/ogkalu/lama-manga-onnx-dynamic/resolve/main/lama-manga-dynamic.onnx
          echo "de31ffa5ba26916b8ea35319f6c12151ff9654d4261bccf0583a69bb095315f9  models/lama-manga-dynamic.onnx" | sha256sum -c
      - uses: ./.github/actions/build-ctd
      - name: The first commit's tree and models
        run: |
          mkdir -p probe/work && git archive 509fe361 | tar -x -C probe/work
          mkdir -p probe/work/models
          python -m venv /tmp/yolo
          /tmp/yolo/bin/pip install -q --extra-index-url https://download.pytorch.org/whl/cpu torch==2.5.1+cpu torchvision==0.20.1+cpu \
            ultralytics==8.3.40 onnx==1.17.0 onnxslim==0.1.42 onnxruntime==1.20.1
          for m in comic-speech-bubble-detector:bubble_yolo comic-text-segmenter:text_segmenter; do
            curl -fsSL -o /tmp/${m%%:*}.pt https://huggingface.co/ogkalu/${m%%:*}-yolov8m/resolve/main/${m%%:*}.pt
            /tmp/yolo/bin/python -c 'import sys; from ultralytics import YOLO; YOLO(sys.argv[1]).export(format="onnx", imgsz=1024, opset=12)' /tmp/${m%%:*}.pt
            mv /tmp/${m%%:*}.onnx probe/work/models/${m##*:}.onnx
          done
          curl -fsSL -o probe/work/models/lama.onnx https://huggingface.co/Carve/LaMa-ONNX/resolve/main/lama_fp32.onnx
          cp .github/clean-probe/clean.py probe/work/clean.py
          ls -la probe/work/models
      - name: Chapters, hidden slices and today's cleans
        env:
          PYTHONPATH: "."
        run: python .github/clean-probe/prepare.py probe
      - name: Score the first version and today's pipeline on the hidden slices
        env:
          PYTHONPATH: "."
        run: |
          D=audit-results/clean-probe/baselines/run-${{ github.run_id }}
          mkdir -p "$D"
          (cd probe/work && PYTHONPATH=. timeout 2400 python clean.py ../hidden/raw ../hidden/first) 2>&1 | tail -20 | tee "$D/first-clean.log" || true
          python .github/clean-probe/grade.py probe/hidden/raw probe/hidden/first "$D/first" | tee "$D/first.txt"
          python .github/clean-probe/grade.py probe/hidden/raw probe/hidden/main "$D/main" | tee "$D/main.txt"
          cp probe/hidden/picked.json "$D/"
      - uses: actions/upload-artifact@v4
        with:
          name: task
          path: probe/work
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: hidden
          path: probe/hidden/raw
          retention-days: 3
      - if: always()
        uses: ./.github/actions/save-evidence
        with:
          paths: audit-results/clean-probe/baselines/run-${{ github.run_id }}
          message: "audit: clean probe baselines (run ${{ github.run_id }})"

  probe:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        run: ${{ fromJson(needs.prepare.outputs.runs) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: "python -m pip install -q --only-binary :all: $RUNTIME"
      - uses: ./.github/actions/build-ctd
      - uses: actions/download-artifact@v4
        with:
          name: task
          path: /tmp/task
      - uses: actions/download-artifact@v4
        with:
          name: hidden
          path: /tmp/hidden-raw
      - name: Start the key relay as another user
        env:
          COMMANDCODE: ${{ secrets.COMMANDCODE }}
        run: |
          sudo mkdir -p /opt/relay && sudo chown nobody /opt/relay
          sudo install -m 755 .github/terminal-bench/proxy.py /opt/relay/proxy.py
          printf '%s' "$COMMANDCODE" | sudo -u nobody tee /opt/relay/key > /dev/null
          sudo chmod 600 /opt/relay/key
          sudo -u nobody nohup "$(which python)" /opt/relay/proxy.py /opt/relay/key /opt/relay/stats.json 18081 https://api.commandcode.ai/provider/v1 '{}' "${{ matrix.run.model }}" > /dev/null 2>&1 &
          sleep 2
      - name: Lay out the task; hide the hidden slices; cut the agent user off the internet
        run: |
          sudo useradd -m probe
          sudo mkdir -p /tmp/work /home/probe/.manga-agent /home/probe/src
          sudo cp -r /tmp/task/. /tmp/work/
          sudo mkdir -p /opt/hidden && sudo mv /tmp/hidden-raw /opt/hidden/raw && sudo chmod -R go-rwx /opt/hidden
          sudo cp -r app .github/terminal-bench/run_agent.py /home/probe/src/
          python -c 'import json, sys; r = json.loads(sys.argv[1]); p = {"token_budget": 10**15, "max_steps": 100000, "max_output_tokens": 16000, "models": {".": {"request": {"reasoning_effort": r["effort"]}, "max_output": 16000}}}; p.update({"echo_reasoning": r["echo_reasoning"]} if r.get("echo_reasoning") else {}); print(json.dumps(p))' '${{ toJson(matrix.run) }}' | sudo tee /home/probe/.manga-agent/profile.json > /dev/null
          sudo chown -R probe /tmp/work /home/probe
          # Today's code and the grader are not readable by the agent user.
          chmod 700 "$GITHUB_WORKSPACE" /home/runner/work 2>/dev/null || true
          for t in iptables ip6tables; do
            sudo $t -I OUTPUT -m owner --uid-owner probe -j REJECT
            sudo $t -I OUTPUT -o lo -m owner --uid-owner probe -j ACCEPT
          done
          (sudo -u probe curl -sS -m 8 -o /dev/null https://pypi.org && echo "::error::the agent user still reaches the internet" && exit 1) || echo "internet is off for the agent user"
          sudo -u probe curl -sS -m 8 -o /dev/null -w "relay: HTTP %{http_code}\n" http://127.0.0.1:18081/v1/models || true
          sudo -u probe ls /opt/hidden/raw > /dev/null 2>&1 && echo "::error::hidden slices are readable" && exit 1 || echo "hidden slices are out of reach"
          sudo -u probe test -r "$GITHUB_WORKSPACE/app/detector/ctd_mask.py" && echo "::error::today's code is readable" && exit 1 || echo "today's code is out of reach"
          sudo -u probe -H env PATH="$PATH" python -c "import cv2, onnxruntime, scipy, skimage; print('agent python ok')"
      - name: Run the agent
        run: |
          mkdir -p out
          cd /tmp/work
          sudo -u probe -H env PATH="$PATH" PYTHONPATH=/home/probe/src "$(which python)" -X faulthandler /home/probe/src/run_agent.py - \
            --base http://127.0.0.1:18081/v1 --model "${{ matrix.run.model }}" --workspace /tmp/work --minutes "${{ needs.prepare.outputs.minutes }}" \
            < "$GITHUB_WORKSPACE/.github/clean-probe/task.md" > "$GITHUB_WORKSPACE/out/events.jsonl" 2> "$GITHUB_WORKSPACE/out/stderr.log" && rc=0 || rc=$?
          echo "agent exit code: $rc" | tee "$GITHUB_WORKSPACE/out/exit.txt"
      - name: Clean the hidden slices with the agent's code, grade, and count what the agent used
        if: always()
        env:
          PYTHONPATH: "."
        run: |
          D=audit-results/clean-probe/${{ matrix.run.label }}/run-${{ github.run_id }}
          mkdir -p "$D"
          sudo pkill -u probe || true
          sudo mkdir -p /tmp/eval && sudo cp -r /opt/hidden/raw /tmp/eval/in && sudo chown -R probe /tmp/eval
          start=$(date +%s)
          (cd /tmp/work && sudo -u probe -H env PATH="$PATH" PYTHONPATH=/tmp/work timeout 2400 python clean.py /tmp/eval/in /tmp/eval/out) > "$D/clean.log" 2>&1 && echo "clean.py exit 0" >> "$D/clean.log" || echo "clean.py exit $?" >> "$D/clean.log"
          echo "clean seconds: $(( $(date +%s) - start ))" | tee -a "$D/clean.log"
          tail -5 "$D/clean.log"
          sudo chown -R "$(id -u)" /tmp/eval
          python .github/clean-probe/grade.py /tmp/eval/in /tmp/eval/out "$D/grade" | tee "$D/grade.txt"
          sudo tar -czf "$D/work.tgz" --exclude=models --exclude=dev --exclude='__pycache__' -C /tmp work
          sudo chown -R "$(id -u)" "$D"
          python - "$D" <<'PY'
          import collections, json, re, sys
          d = sys.argv[1]
          def parsed(line):
              try:
                  return json.loads(line)
              except ValueError:
                  return None  # a line cut off when the agent was stopped
          events = [e for e in map(parsed, open("out/events.jsonl", encoding="utf-8", errors="replace")) if isinstance(e, dict)]
          calls = [c for e in events if e.get("type") == "assistant" for c in e.get("calls") or []]
          names = collections.Counter(c["name"] for c in calls)
          text = lambda c: json.dumps(c.get("args") or {}, ensure_ascii=False)
          bridge = collections.Counter(m for c in calls if c["name"] == "run_command" for m in re.findall(r"agent-tool\s+(\w+)", text(c)))
          dots = collections.Counter(m for c in calls if c["name"] == "create" for m in re.findall(r"tools\.(\w+)\(", text(c)))
          times = [e["time"] for e in events if "time" in e]
          result = next((e for e in events if e.get("type") == "result"), {})
          summary = {"tool_calls": dict(names.most_common()), "agent_tool": dict(bridge), "tools_dot_in_create": dict(dots.most_common()),
                     "skills": [(c.get("args") or {}).get("name") for c in calls if c["name"] == "skill"],
                     "helpers": sum(names[n] for n in ("task", "spawn_agent", "fan_out", "agent")) + bridge["task"] + bridge["agent"] + dots["agent"] + dots["task"],
                     "notices": [e.get("text", "")[:160] for e in events if e.get("type") in ("notice", "error")][:40],
                     "minutes": round((times[-1] - times[0]) / 60, 1) if times else None, "status": result.get("status"), "usage": result.get("usage"),
                     "final": next((e.get("text", "") for e in reversed(events) if e.get("type") == "assistant" and e.get("text")), "")[-2500:]}
          json.dump(summary, open(f"{d}/summary.json", "w"), indent=1, ensure_ascii=False)
          print(json.dumps({k: summary[k] for k in ("tool_calls", "agent_tool", "skills", "helpers", "minutes", "status")}, indent=1))
          PY
          gzip -c out/events.jsonl > "$D/events.jsonl.gz"; cp out/stderr.log out/exit.txt "$D/" || true
          sudo cat /opt/relay/stats.json > "$D/relay-stats.json" 2>/dev/null || true
      - name: Restore push credentials for the evidence step
        if: always()
        env:
          TOKEN: ${{ github.token }}
        run: |
          chmod 755 "$GITHUB_WORKSPACE" /home/runner/work 2>/dev/null || true
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
      - if: always()
        uses: ./.github/actions/save-evidence
        with:
          paths: audit-results/clean-probe/${{ matrix.run.label }}/run-${{ github.run_id }}
          message: "audit: clean probe ${{ matrix.run.label }} (run ${{ github.run_id }})"
