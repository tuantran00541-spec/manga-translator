name: Qwen3.8 exact multi-vector quant kernel probe

on:
  push:
    branches: [research/qwen3.8-27b-runtime-finish]
    paths:
      - "research/qwen38/gguf_quant_matvec_many_avx2.c"
      - ".github/workflows/qwen38-matvec-many-exact.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matvec-many-exact:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[qwen-matvec-many]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Runner CPU information
        run: lscpu

      - name: Compile exact multi-vector selftest
        shell: bash
        run: |
          set -euo pipefail
          cc -O3 -std=c11 -mavx2 -fno-fast-math -ffp-contract=off \
            -D_POSIX_C_SOURCE=200809L -DQWEN_MATVEC_MANY_SELFTEST \
            research/qwen38/gguf_quant_matvec_many_avx2.c -lm \
            -o "$RUNNER_TEMP/qwen-matvec-many-selftest"

      - name: Run bitwise multi-vector gate
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/qwen-matvec-many-selftest" | tee "$RUNNER_TEMP/matvec-many.log"
          grep -F "QWEN38_MATVEC_MANY_BITWISE_PASS" "$RUNNER_TEMP/matvec-many.log"
