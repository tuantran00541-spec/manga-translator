name: Real Asura full-chapter E2E

on:
  push:
    branches:
      - test/real-e2e-asura
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manga-translator-real-asura-e2e
  cancel-in-progress: false

jobs:
  real-e2e:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      MANGA_USE_DYNAMIC_LAMA: "1"
      MANGA_OCR_TARGET_SELECTION: centered
      MANGA_DETECTOR_EXPERIMENT: adaptive_focus_v2
      MANGA_DETECTOR_ADAPTIVE_TILE_MAX: "1344"
      MANGA_DETECTOR_ADAPTIVE_OVERLAP: "200"
      MANGA_DETECTOR_FOCUS_PAD_Y: "96"
      MANGA_DETECTOR_FOCUS_FREE_PAD_Y: "160"
      MANGA_DETECTOR_FOCUS_MERGE_GAP: "64"
      MANGA_DETECTOR_FOCUS_MAX_CHIPS: "2"
      MANGA_COLOR_FREE_TEXT_RESCUE: lab_mser_v1
      MANGA_COLOR_RESCUE_MIN_CHROMA: "18"
      MANGA_ORT_PROVIDER: openvino
      MANGA_ORT_REQUIRE_PROVIDER: "1"
      MANGA_ORT_OPENVINO_SCOPE: detectors
      MANGA_ORT_OPENVINO_THREADS: "2"
      MANGA_ORT_OPENVINO_STREAMS: "1"
      MANGA_ORT_OPENVINO_CACHE_DIR: /tmp/manga-openvino-cache
      MANGA_ORT_CPU_MEM_ARENA: "1"
      MANGA_ORT_MEM_PATTERN: "1"
      E2E_BENCHMARK_CHAPTER_URL: https://asurascans.com/comics/killer-pietro-08677664/chapter/120
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      E2E_MODEL_BUNDLE_URL: ${{ secrets.E2E_MODEL_BUNDLE_URL }}

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install native runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libgl1 libglib2.0-0 libgomp1 libsm6 libxext6 libxrender1 \
            fonts-liberation fonts-noto-cjk

      - name: Install CPU runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple \
            "torch==2.5.1+cpu" "torchvision==0.20.1+cpu"
          python -m pip install -r requirements.txt
          python -m pip install --no-deps \
            "ultralytics==8.3.221" "onnx==1.17.0" "onnxslim==0.1.71"
          python -m pip install --only-binary=:all: \
            "numpy==1.26.4" "sympy==1.13.1" \
            "PyYAML==6.0.2" "scipy==1.14.1" "tqdm==4.67.1" \
            "matplotlib==3.9.2" "pandas==2.2.3" "py-cpuinfo==9.0.0" \
            "ml_dtypes==0.5.3" "colorama==0.4.6" \
            "polars==1.33.1" "ultralytics-thop==2.0.17"

      - name: Install Chromium for Asura JS fallback
        run: python -m playwright install --with-deps chromium

      - name: Validate E2E source
        run: |
          python -m py_compile \
            app/ort_utils.py \
            scripts/provision_real_e2e_models.py \
            scripts/real_e2e_asura.py \
            scripts/detector_experiment.py \
            scripts/color_free_text_rescue_v6.py
          python scripts/detector_experiment.py
          python scripts/color_free_text_rescue_v6.py
          python scripts/release_sanity.py

      - name: Restore detector and inpaint model cache
        id: model-cache
        uses: actions/cache@v4
        with:
          path: |
            models/bubble_yolo.onnx
            models/text_segmenter.onnx
            models/lama-manga-dynamic.onnx
            models/.e2e-provenance.json
          key: real-e2e-models-v2-${{ runner.os }}-${{ hashFiles('scripts/provision_real_e2e_models.py') }}

      - name: Provision and validate real models
        run: python scripts/provision_real_e2e_models.py

      - name: Install OpenVINO runtime for benchmark
        run: |
          python -m pip uninstall -y onnxruntime onnxruntime-openvino || true
          python -m pip install --only-binary=:all: "onnxruntime-openvino==1.24.1"
          python - <<'PY'
          import onnxruntime as ort
          providers = ort.get_available_providers()
          print({'onnxruntime': ort.__version__, 'providers': providers})
          assert 'OpenVINOExecutionProvider' in providers, providers
          PY

      - name: Restore OCR runtime cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.paddlex
            ~/.paddleocr
            ~/.cache/huggingface
          key: real-e2e-ocr-v2-${{ runner.os }}-${{ hashFiles('requirements.txt', 'app/ocr/**') }}
          restore-keys: |
            real-e2e-ocr-v2-${{ runner.os }}-

      - name: Run real full-chapter Asura E2E
        shell: bash
        run: |
          args=(
            --chapter-url "${E2E_BENCHMARK_CHAPTER_URL}"
            --workers 2
            --ocr-concurrency 2
            --source-lang en
            --target-lang vi
            --translation-budget-usd 0.02
            --max-download-attempts 1
          )
          if [[ -n "${DEEPSEEK_API_KEY:-}" ]]; then
            args+=(--require-translation)
          fi
          python -c 'import runpy; from scripts.detector_experiment import install_from_env; assert install_from_env(), "detector experiment was not enabled"; from scripts.color_free_text_rescue_v6 import install_from_env as install_color_rescue; assert install_color_rescue(), "color rescue was not enabled"; runpy.run_path("scripts/real_e2e_asura.py", run_name="__main__")' "${args[@]}"

      - name: Publish run summary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report_path = Path('benchmark-results/real-e2e-asura-report.json')
          experiment_path = Path('benchmark-results/detector-experiment.json')
          color_path = Path('benchmark-results/color-free-text-rescue-v6.json')
          lines = ['## Real Asura full-chapter E2E — color free-text rescue', '']
          if not report_path.is_file():
              lines += ['No E2E report was produced.']
          else:
              report = json.loads(report_path.read_text(encoding='utf-8'))
              detector = ((report.get('process') or {}).get('detector') or {})
              boxes = report.get('boxes') or {}
              ocr = report.get('ocr') or {}
              lines += [
                  f"- Status: **{report.get('status')}**",
                  f"- Promotion ready: **{report.get('promotion_ready')}**",
                  f"- Detector experiment: `{os.getenv('MANGA_DETECTOR_EXPERIMENT') or 'baseline'}` + `{os.getenv('MANGA_COLOR_FREE_TEXT_RESCUE') or 'none'}`",
                  f"- Runtime provider: `{os.getenv('MANGA_ORT_PROVIDER') or 'cpu'}`",
                  f"- Chapter: `{report.get('chapter_url') or 'unresolved'}`",
                  f"- Source pages / slices: `{report.get('source_pages')}` / `{report.get('slices')}`",
                  f"- Boxes total / safe / review: `{boxes.get('total')}` / `{boxes.get('safe_to_inpaint')}` / `{boxes.get('review_only')}`",
                  f"- Detector total ms: `{detector.get('total_ms')}`",
                  f"- Bubble model ms: `{detector.get('bubble_model_ms')}`",
                  f"- Text model ms: `{detector.get('text_model_ms')}`",
                  f"- OCR recognized: `{ocr.get('recognized')}` / `{ocr.get('planned')}`",
                  f"- Total wall ms: `{report.get('wall_ms')}`",
              ]
          if experiment_path.is_file():
              experiment = json.loads(experiment_path.read_text(encoding='utf-8'))
              lines += ['', '### Detector focus counters']
              for name, row in sorted((experiment.get('models') or {}).items()):
                  lines.append(
                      f"- `{name}`: calls={row.get('single_model_calls')}, "
                      f"full_text={row.get('full_image_text_calls')}, "
                      f"focus_chips={row.get('focus_chip_calls')}, "
                      f"focus_uncovered={row.get('focus_uncovered_proposals')}"
                  )
          if color_path.is_file():
              color = json.loads(color_path.read_text(encoding='utf-8'))
              lines += ['', '### Color proposal rescue']
              lines.append(
                  f"- Invocations/skipped: `{color.get('invocations')}` / `{color.get('skipped_low_chroma')}`; "
                  f"extra proposals: `{color.get('extra_boxes')}`; total ms: `{color.get('total_ms')}`"
              )
              for name, row in sorted((color.get('channels') or {}).items()):
                  lines.append(
                      f"- `{name}`: runs={row.get('runs')}, raw={row.get('raw_regions')}, "
                      f"accepted={row.get('proposals')}, ms={row.get('ms')}"
                  )
          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary:
              with open(summary, 'a', encoding='utf-8') as handle:
                  handle.write('\n'.join(lines) + '\n')
          print('\n'.join(lines))
          PY

      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-asura-e2e-${{ github.run_id }}
          path: |
            benchmark-results/
          retention-days: 7
          if-no-files-found: warn
