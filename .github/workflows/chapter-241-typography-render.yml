name: Chapter 241 Checkpoint 05 Typography Render Candidate

on:
  push:
    branches:
      - 'chapter/doctors-rebirth\+241'
    paths:
      - '.github/workflows/chapter-241-typography-render.yml'
      - 'chapters/doctors-rebirth-241/run_typography_render.py'
      - 'chapters/doctors-rebirth-241/run_typography_render_safe.py'
      - 'chapters/doctors-rebirth-241/apply_typography_overrides.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: chapter-241-human-loop
  cancel-in-progress: false

jobs:
  typography-render:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      TRANSLATION_RUN_ID: '34740261560'
      TRANSLATION_ARTIFACT: 04-translation-reviewed-c241d001
      CLEAN_REPAIR_RUN_ID: '34734740336'
      CLEAN_REPAIR_ARTIFACT: 02b-clean-local-repair-c241d001
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'chapter/doctors-rebirth+241'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install render dependencies
        run: |
          python -m pip install --only-binary=:all: Pillow==10.4.0 numpy==1.26.4 fonttools==4.59.2

      - name: Restore approved checkpoints
        run: |
          rm -rf checkpoint/04-translation checkpoint/02b-repair checkpoint/05-render data/processed/c241d001
          mkdir -p checkpoint/04-translation checkpoint/02b-repair checkpoint/05-render data/processed
          gh run download "$TRANSLATION_RUN_ID" -n "$TRANSLATION_ARTIFACT" -D checkpoint/04-translation
          gh run download "$CLEAN_REPAIR_RUN_ID" -n "$CLEAN_REPAIR_ARTIFACT" -D checkpoint/02b-repair
          test -f checkpoint/04-translation/translated-manifest.json
          test -f checkpoint/04-translation/translation-review-summary.json
          test -d checkpoint/02b-repair/processed
          cp -a checkpoint/02b-repair/processed data/processed/c241d001

      - name: Apply reviewed typography geometry override
        run: PYTHONPATH=. python chapters/doctors-rebirth-241/apply_typography_overrides.py

      - name: Build fixed-size render candidate with guarded raster fallback
        run: PYTHONPATH=. python chapters/doctors-rebirth-241/run_typography_render_safe.py

      - name: Verify render candidate contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          root=Path('checkpoint/05-render')
          summary=json.loads((root/'render-summary.json').read_text(encoding='utf-8'))
          if summary.get('status')!='REVIEW_REQUIRED': raise SystemExit(summary)
          if summary.get('active_story_objects')!=76 or summary.get('rendered_story_objects')!=76: raise SystemExit(summary)
          if summary.get('rendered_slices')!=68 or summary.get('source_pages')!=17: raise SystemExit(summary)
          if summary.get('autosize_active_objects')!=0 or summary.get('font_size_min_px',0)<28: raise SystemExit(summary)
          fallback=json.loads((root/'raster-fallbacks.json').read_text(encoding='utf-8'))
          if summary.get('raster_fallback_count')!=len(fallback): raise SystemExit('raster fallback report mismatch')
          pages=sorted((root/'final_pages').glob('*.png'))
          if len(pages)!=17: raise SystemExit(f'expected 17 pages, got {len(pages)}')
          for page in pages:
              with Image.open(page) as image:
                  if image.width<=0 or image.height<=0: raise SystemExit(f'invalid page {page}')
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          print('render candidate contract PASS; human visual review required')
          PY

      - name: Upload render candidate
        uses: actions/upload-artifact@v4
        with:
          name: 05-render-candidate-c241d001
          path: checkpoint/05-render
          if-no-files-found: error
          retention-days: 7
