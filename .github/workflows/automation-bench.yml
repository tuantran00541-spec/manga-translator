name: AutomationBench

# One-off: the bench's own agent loop against our harness (hybrid and lean) on a sample of AutomationBench, same model;
# settings come from .github/automation-bench/run.json, and a relay holds the API key.
on:
  push:
    branches-ignore: [main]
    paths:
      - ".github/workflows/automation-bench.yml"
      - ".github/automation-bench/**"

permissions:
  contents: write

jobs:
  config:
    runs-on: ubuntu-22.04
    outputs:
      arms: ${{ steps.cfg.outputs.arms }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read the run settings
        id: cfg
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, re, sys
          from urllib.parse import urlparse
          cfg = json.load(open(".github/automation-bench/run.json"))
          arms = []
          # An arm is a mode name with the file's model, or an object that sets its own name, mode, key, model and note.
          for arm in cfg["arms"]:
              arm = {"name": arm, "tools": arm} if isinstance(arm, str) else dict(arm)
              arm = {"secret": cfg["secret"], "base_url": cfg["base_url"], "model": cfg["model"], "request": cfg.get("request") or {},
                     "concurrent": cfg["concurrent"], "limits": cfg.get("limits") or {}, "note": "", **arm}
              url = urlparse(arm["base_url"])
              if url.scheme != "https" or not url.hostname or url.username or url.query:
                  sys.exit("base_url must be https without credentials or query")
              if not re.fullmatch(r"[A-Za-z0-9_]+", arm["secret"]) or not re.fullmatch(r"[A-Za-z0-9_-]+", arm["name"]):
                  sys.exit("secret and name must be plain names")
              if arm["tools"] not in ("native", "hybrid", "lean", "create", "full"):
                  sys.exit(f"unknown mode {arm['tools']}")
              arm["base_url"] = arm["base_url"].rstrip("/")
              arms.append(arm)
          print(f"arms={json.dumps(arms)}")
          PY

  bench:
    needs: config
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        arm: ${{ fromJSON(needs.config.outputs.arms) }}
    env:
      OUT: audit-results/automation-bench/run-${{ github.run_id }}/${{ matrix.arm.name }}
      PORT: "18080"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Get AutomationBench where the agent user cannot read it
        run: |
          python -m pip install -q uv requests
          # The tasks hold their own answers (assertions), so only the runner user can read the checkout.
          sudo install -d -o "$USER" -m 700 /opt/ab
          git clone -q https://github.com/zapier/AutomationBench /opt/ab/src
          git -C /opt/ab/src checkout -q 4a8e1061254004d9dac807054eed33fad7d1ff14
          cd /opt/ab/src && uv sync -q 2>&1 | tail -2
          mkdir -p "$GITHUB_WORKSPACE/$OUT"

      - name: Start the key relay as another user
        env:
          API_KEY: ${{ secrets[matrix.arm.secret] }}
          LIMITS: ${{ toJSON(matrix.arm.limits) }}
        run: |
          [ -n "$API_KEY" ] || { echo "::error::secret ${{ matrix.arm.secret }} is not set"; exit 1; }
          sudo install -d -o nobody -m 711 /opt/relay
          sudo install -m 755 .github/terminal-bench/proxy.py /opt/relay/proxy.py
          printf '%s' "$API_KEY" | sudo -u nobody tee /opt/relay/key > /dev/null
          sudo chmod 600 /opt/relay/key
          sudo -u nobody nohup "$(which python)" /opt/relay/proxy.py /opt/relay/key /opt/relay/stats.json "$PORT" "${{ matrix.arm.base_url }}" "$LIMITS" "${{ matrix.arm.model }}" > /dev/null 2>&1 &
          sleep 3
          curl -sS -m 30 -o /dev/null -w "models endpoint: HTTP %{http_code}\n" "http://127.0.0.1:$PORT/v1/models" || true

      - name: Run the bench's own agent loop
        if: matrix.arm.tools == 'native'
        env:
          ARM: ${{ toJSON(matrix.arm) }}
        run: |
          cd /opt/ab/src
          TASKS=$(AB_CONFIG="$(cat "$GITHUB_WORKSPACE/.github/automation-bench/run.json")" OUT=/tmp uv run python "$GITHUB_WORKSPACE/.github/automation-bench/run.py" list)
          EFFORT=$(python -c 'import json, os; print(json.loads(os.environ["ARM"])["request"].get("reasoning_effort", "high"))')
          timeout 200m uv run auto-bench --model "${{ matrix.arm.model }}" --base-url "http://127.0.0.1:$PORT/v1" --api-key relay \
            --toolset api --domains sales,marketing,operations,support,finance,hr --tasks "$TASKS" --reasoning-effort "$EFFORT" \
            --max-concurrent 8 --export-json /tmp/native.json 2>&1 | tail -40 || true
          OUT="$GITHUB_WORKSPACE/$OUT" AB_CONFIG='{}' uv run python "$GITHUB_WORKSPACE/.github/automation-bench/run.py" native-summary /tmp/native.json || true

      - name: Run our harness as a user without the internet
        if: matrix.arm.tools != 'native'
        env:
          ARM: ${{ toJSON(matrix.arm) }}
        run: |
          sudo useradd -m agent
          # The agent reaches only this machine (the relay and the task's MCP server), so it cannot look the answers up online.
          sudo iptables -A OUTPUT -m owner --uid-owner agent -d 127.0.0.0/8 -j ACCEPT
          sudo iptables -A OUTPUT -m owner --uid-owner agent -j REJECT
          sudo install -d -m 755 /opt/chaos
          sudo cp -r app /opt/chaos/app
          # The app makes its data and log folders next to the code on import.
          sudo chown -R agent /opt/chaos
          sudo "$(which python)" -m venv /opt/chaos-venv
          sudo /opt/chaos-venv/bin/pip install -q requests loguru pydantic fastapi pillow numpy beautifulsoup4 lxml
          sudo -u agent /opt/chaos-venv/bin/python -c "import sys; sys.path.insert(0, '/opt/chaos'); import app.agent.cli; print('agent imports ok')"
          (sudo -u agent cat /opt/ab/src/README.md > /dev/null 2>&1 && echo "::error::the agent user can read the tasks" && exit 1) || echo "tasks are not readable by the agent user"
          cd /opt/ab/src
          CFG=$(python - <<PY
          import json, os
          cfg = json.load(open("$GITHUB_WORKSPACE/.github/automation-bench/run.json"))
          arm = json.loads(os.environ["ARM"])
          cfg.update(tools=arm["tools"], model=arm["model"], request=arm["request"], concurrent=arm["concurrent"], note=arm["note"],
                     base="http://127.0.0.1:$PORT/v1", agent_python="/opt/chaos-venv/bin/python")
          print(json.dumps(cfg))
          PY
          )
          AB_CONFIG="$CFG" OUT="$GITHUB_WORKSPACE/$OUT" timeout 200m uv run python "$GITHUB_WORKSPACE/.github/automation-bench/run.py" 2>&1 | tail -80 || true

      - name: Summarize
        if: always()
        run: |
          cp /opt/relay/stats.json "$OUT/relay-stats.json" 2>/dev/null || true
          cat "$OUT/summary.json" 2>/dev/null || echo "no summary"
          python -c "import json; s=json.load(open('$OUT/relay-stats.json')); print({k: s.get(k) for k in ('requests','errors','prompt_tokens','completion_tokens','usd','stopped')})" || true

      - name: Give git access only now that the agents are done
        if: always()
        env:
          TOKEN: ${{ github.token }}
        run: |
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"

      - name: Save evidence to audit-evidence
        if: always()
        uses: ./.github/actions/save-evidence
        with:
          paths: audit-results/automation-bench/run-${{ github.run_id }}/${{ matrix.arm.name }}
          message: "audit: AutomationBench ${{ matrix.arm.name }} (run ${{ github.run_id }})"
