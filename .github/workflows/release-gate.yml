name: Release gate

on:
  push:
    branches:
      - main
      - "release/**"
  pull_request:
  workflow_dispatch:

jobs:
  source-sanity:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile production Python source
        run: python -m compileall -q app run.py scripts

      - name: Run source sanity checks
        run: python scripts/release_sanity.py

      - name: Run processing responsiveness regression
        run: python scripts/process_responsiveness_sanity.py

      - name: Run inpaint authority sanity checks
        run: python scripts/inpaint_authority_sanity.py

      - name: Run browser markup safety checks
        run: python scripts/browser_sanity.py

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check browser JavaScript syntax
        run: find app/static/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run frontend coordinator regression
        run: node scripts/frontend_coordinator_sanity.js

      - name: Run frontend release regression
        run: node scripts/frontend_release_sanity.js

      - name: Run frontend browser, geometry, and mask benchmark gate
        run: python scripts/frontend_release_browser_check.py --artifacts frontend-browser-artifacts

      - name: Upload frontend browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-browser-evidence-${{ github.run_number }}
          path: frontend-browser-artifacts
          if-no-files-found: warn
          retention-days: 14

      - name: Test-suite location
        run: |
          echo "Runtime main intentionally excludes tests/."
          echo "The preserved regression/browser suite is on archive/main-tests-20260828 and development branches."
