name: Release gate

on:
  push:
    branches:
      - main
      - "release/**"
  pull_request:
  workflow_dispatch:

jobs:
  source-sanity:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile production Python source
        run: python -m compileall -q app run.py scripts/release_sanity.py

      - name: Run source sanity checks
        run: python scripts/release_sanity.py

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check browser JavaScript syntax
        run: find app/static/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Test-suite location
        run: |
          echo "Runtime main intentionally excludes tests/."
          echo "The preserved regression/browser suite is on archive/main-tests-20260828 and development branches."
