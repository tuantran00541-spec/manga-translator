name: Release gate

on:
  push:
    branches:
      - main
      - "release/**"
  pull_request:
  workflow_dispatch:

jobs:
  product-closure:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest httpx

      - name: Compile source
        run: python -m compileall -q app tests

      - name: Check browser JavaScript syntax
        run: |
          for file in app/static/js/*.js; do
            node --check "$file"
          done

      - name: Run model-independent product gate
        run: |
          python -m pytest -q \
            tests/test_auto_text_objects.py \
            tests/test_translation_deepseek.py \
            tests/test_chapter_export.py \
            tests/test_downloader_discovery.py \
            tests/test_inpaint_artwork_quality.py \
            tests/test_geometry_override_mask.py \
            tests/test_v01_product_closure.py \
            tests/test_manifest_data_model.py \
            tests/test_review_artifacts.py \
            tests/test_chapter_qc_ui.py \
            tests/test_render_export.py \
            tests/test_ui_system_contract.py \
            tests/test_editorial_p0.py \
            tests/test_editorial_p0_ui.py \
            tests/test_v02_detection_recovery.py \
            tests/test_ort_low_memory.py

      - name: Install Chromium
        run: playwright install --with-deps chromium

      - name: Run browser regression gate
        run: |
          python tests/browser_chapter_qc.py
          python tests/browser_ocr.py
          python tests/browser_render_export.py
          python tests/browser_editorial_p0.py

      - name: Explain model gate
        run: |
          echo "Detection/inpaint model-integrity tests remain a local/model-artifact gate because ONNX production binaries are intentionally not stored in Git."
