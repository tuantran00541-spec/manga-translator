name: Release gate

on:
  push:
    branches:
      - main
      - "release/**"
  pull_request:
  workflow_dispatch:

jobs:
  source-sanity:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile production source
        run: python -m compileall -q app run.py

      - name: Test-suite location
        run: |
          echo "Runtime main intentionally excludes tests/."
          echo "The preserved regression/browser suite is on archive/main-tests-20260828 and development branches."
