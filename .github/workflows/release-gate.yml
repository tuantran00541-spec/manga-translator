name: Release gate

on:
  push:
    branches:
      - main
      - "release/**"
  pull_request:
  workflow_dispatch:

jobs:
  python-tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install correctness-test runtime
        run: python -m pip install -r requirements-test.txt
      - name: Run model-independent correctness and product-closure tests
        run: python -m pytest -q

  source-sanity:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile production Python source
        run: python -m compileall -q app run.py scripts

      - name: Run source sanity checks
        run: python scripts/release_sanity.py

      - name: Run processing responsiveness regression
        run: python scripts/process_responsiveness_sanity.py

      - name: Run detector pass telemetry contract
        run: python scripts/profile_detector_pass_sanity.py

      - name: Run inpaint authority sanity checks
        run: python scripts/inpaint_authority_sanity.py

      - name: Run browser markup safety checks
        run: python scripts/browser_sanity.py

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check browser JavaScript syntax
        run: find app/static/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run editor auto-sync regression
        run: node scripts/editor_auto_sync_sanity.js

      - name: Run studio runtime regression
        run: node scripts/studio_runtime_sanity.js

      - name: Run theme and application shell regression
        run: node scripts/theme_runtime_sanity.js
