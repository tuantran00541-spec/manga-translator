name: Resident segmenter contention probe

on:
  push:
    branches:
      - release/focused-segmenter-640
    paths:
      - scripts/probe_resident_segmenter_contention.py
      - scripts/specialize_text_segmenter.py
      - .github/workflows/resident-segmenter-contention.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"
      MANGA_ORT_PROVIDER: openvino
      MANGA_ORT_REQUIRE_PROVIDER: "1"
      MANGA_ORT_OPENVINO_SCOPE: detectors
      MANGA_ORT_OPENVINO_THREADS: "2"
      MANGA_ORT_OPENVINO_STREAMS: "1"
      MANGA_ORT_OPENVINO_CACHE_DIR: /tmp/manga-openvino-contention-cache
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install probe runtime
        run: |
          python -m pip install numpy==1.26.4 onnx==1.17.0 onnxruntime-openvino==1.24.1

      - name: Restore benchmark models
        id: models
        uses: actions/cache@v4
        with:
          path: |
            models/*.onnx
            models/.e2e-provenance.json
          key: processing-profile-models-b224548-v1

      - name: Read pinned model provisioner
        if: steps.models.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          ref: b22454827f8190655d7070b80eb20c2550beadfa
          path: benchmark-bootstrap
          sparse-checkout: scripts/provision_real_e2e_models.py
          sparse-checkout-cone-mode: false

      - name: Provision detector models
        if: steps.models.outputs.cache-hit != 'true'
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple torch==2.5.1+cpu torchvision==0.20.1+cpu
          python -m pip install --no-deps ultralytics==8.3.221 onnxslim==0.1.71
          python -m pip install sympy==1.13.1 PyYAML==6.0.2 scipy==1.14.1 tqdm==4.67.1 matplotlib==3.9.2 pandas==2.2.3 py-cpuinfo==9.0.0 ml_dtypes==0.5.3 colorama==0.4.6 polars==1.33.1 ultralytics-thop==2.0.17
          python benchmark-bootstrap/scripts/provision_real_e2e_models.py
          cp benchmark-bootstrap/models/bubble_yolo.onnx models/
          cp benchmark-bootstrap/models/text_segmenter.onnx models/

      - name: Build 640 specialized segmenter
        run: |
          python scripts/specialize_text_segmenter.py             --source models/text_segmenter.onnx             --output models/text_segmenter_640.onnx             --size 640

      - name: Benchmark without extra resident session
        run: |
          python scripts/probe_resident_segmenter_contention.py             --resident none --repeats 5             --output benchmark-results/resident-contention/none.json

      - name: Benchmark with resident 640 OpenVINO session
        run: |
          python scripts/probe_resident_segmenter_contention.py             --resident openvino --repeats 5             --output benchmark-results/resident-contention/openvino.json

      - name: Benchmark with resident 640 CPU session
        run: |
          python scripts/probe_resident_segmenter_contention.py             --resident cpu --repeats 5             --output benchmark-results/resident-contention/cpu.json

      - name: Compare resident-session impact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("benchmark-results/resident-contention")
          rows = {name: json.loads((root / f"{name}.json").read_text()) for name in ("none", "openvino", "cpu")}
          base = rows["none"]
          report = {"rows": rows, "ratios": {}}
          for mode in ("openvino", "cpu"):
              report["ratios"][mode] = {
                  "bubble_vs_none": rows[mode]["bubble"]["median_ms"] / base["bubble"]["median_ms"],
                  "text_vs_none": rows[mode]["text"]["median_ms"] / base["text"]["median_ms"],
              }
          (root / "comparison.json").write_text(json.dumps(report, indent=2) + "\n")
          print(json.dumps(report, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resident-segmenter-contention-${{ github.run_id }}
          path: benchmark-results/resident-contention/
          retention-days: 3
          if-no-files-found: error
