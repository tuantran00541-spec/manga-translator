name: Starting With 13 Hidden Traits 46 Checkpoint 01 Import

on:
  push:
    branches:
      - trial/starting-with-13-hidden-traits-46
    paths:
      - .github/workflows/starting-with-13-hidden-traits-46-import.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: starting-with-13-hidden-traits-46-import
  cancel-in-progress: false

jobs:
  import-slice:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout trial branch
        uses: actions/checkout@v4
        with:
          ref: trial/starting-with-13-hidden-traits-46

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install import dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            fastapi==0.115.0 \
            requests==2.32.3 \
            beautifulsoup4==4.12.3 \
            lxml==5.3.0 \
            playwright==1.47.0 \
            Pillow==10.4.0 \
            numpy==1.26.4 \
            opencv-contrib-python==4.10.0.84

      - name: Discover, download, production-slice, and reconstruct chapter 46
        env:
          CHAPTER_URL: https://asurascans.com/comics/starting-with-13-hidden-traits-53fc8424/chapter/46
          CHAPTER_ID: 57d7b970
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path

          import cv2
          import numpy as np
          from PIL import Image, ImageDraw

          from app.downloader.registry import ASURA_JS_ADAPTER, ASURA_STATIC_ADAPTER, download_chapter
          from app.downloader.slicer import slice_image
          from app.parameters import PIPELINE_DEFAULT_WORKERS, PIPELINE_SLICE_WORKER_LIMIT
          from app.security import validate_chapter_id

          chapter_url = os.environ['CHAPTER_URL']
          chapter_id = validate_chapter_id(os.environ['CHAPTER_ID'])
          root = Path('checkpoint/01-import')
          raw_dir = root / 'raw'
          sliced_dir = raw_dir / 'sliced'
          raw_dir.mkdir(parents=True, exist_ok=True)
          sliced_dir.mkdir(parents=True, exist_ok=True)

          discovery_method = 'asura-static'
          reader_urls = []
          try:
              reader_urls = ASURA_STATIC_ADAPTER.extract_image_urls(chapter_url)
          except Exception as exc:
              print(f'static reader discovery failed: {exc!r}')
          if len(reader_urls) < 2:
              discovery_method = 'asura-js'
              try:
                  reader_urls = ASURA_JS_ADAPTER.extract_image_urls(chapter_url)
              except Exception as exc:
                  raise RuntimeError(f'Asura reader discovery failed: {exc!r}') from exc
          if len(reader_urls) < 2:
              raise RuntimeError(f'Asura reader discovery returned only {len(reader_urls)} page(s)')

          raw_paths = download_chapter(chapter_url, raw_dir)
          if not raw_paths:
              raise RuntimeError('Production downloader returned zero source images')
          if len(raw_paths) != len(reader_urls):
              raise RuntimeError(
                  f'reader/download count mismatch: reader={len(reader_urls)} downloaded={len(raw_paths)}'
              )

          max_workers = max(1, min(int(PIPELINE_DEFAULT_WORKERS), int(PIPELINE_SLICE_WORKER_LIMIT), len(raw_paths)))
          slice_results: dict[int, list[dict]] = {}

          def slice_one(item):
              idx, raw_path = item
              return idx, slice_image(raw_path, sliced_dir, f'{idx:03d}', return_metadata=True)

          with ThreadPoolExecutor(max_workers=max_workers) as pool:
              futures = {pool.submit(slice_one, (idx, path)): idx for idx, path in enumerate(raw_paths)}
              for future in as_completed(futures):
                  idx, items = future.result()
                  slice_results[idx] = items

          pages = []
          source_rows = []
          for source_index, raw_path in enumerate(raw_paths):
              image = cv2.imread(str(raw_path), cv2.IMREAD_COLOR)
              if image is None:
                  raise RuntimeError(f'Could not read downloaded source image: {raw_path}')
              height, width = image.shape[:2]
              source_rows.append({
                  'source_page': source_index,
                  'filename': raw_path.name,
                  'width': int(width),
                  'height': int(height),
                  'slice_count': len(slice_results[source_index]),
              })
              for slice_index, item in enumerate(slice_results[source_index]):
                  slice_path = Path(item['path'])
                  stitch_core = {key: item.get(key) for key in (
                      'source_y1', 'source_y2', 'core_y1', 'core_y2',
                      'core_source_y1', 'core_source_y2', 'unsafe_before',
                      'unsafe_after', 'source_height'
                  )}
                  pages.append({
                      'original': slice_path.as_posix(),
                      'clean': None,
                      'boxes': [],
                      'skipped': False,
                      'excluded_regions': [],
                      'source_page': source_index,
                      'slice_index': slice_index,
                      'stitch_core': stitch_core,
                  })

          manifest = {
              'chapter_id': chapter_id,
              'series_slug': 'starting-with-13-hidden-traits-53fc8424',
              'chapter_number': 46,
              'source_url': chapter_url,
              'pages': pages,
              'workflow': {'stage': 'preview', 'page_index': 0},
          }
          (root / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')

          ownership_issues = []
          reconstruction_rows = []
          for source_index, raw_path in enumerate(raw_paths):
              owned = [p for p in pages if p['source_page'] == source_index]
              owned.sort(key=lambda p: p['slice_index'])
              source = cv2.imread(str(raw_path), cv2.IMREAD_COLOR)
              source_h, source_w = source.shape[:2]
              recon = np.zeros_like(source)
              prev_end = 0
              for page in owned:
                  core = page['stitch_core']
                  src_y1 = int(core.get('core_source_y1') or 0)
                  src_y2 = int(core.get('core_source_y2') or 0)
                  local_y1 = int(core.get('core_y1') or 0)
                  local_y2 = int(core.get('core_y2') or 0)
                  if src_y1 != prev_end:
                      ownership_issues.append({
                          'source_page': source_index,
                          'slice_index': page['slice_index'],
                          'expected_y1': prev_end,
                          'actual_y1': src_y1,
                      })
                  if src_y2 < src_y1 or local_y2 < local_y1:
                      ownership_issues.append({
                          'source_page': source_index,
                          'slice_index': page['slice_index'],
                          'invalid_source_range': [src_y1, src_y2],
                          'invalid_local_range': [local_y1, local_y2],
                      })
                      continue
                  slice_image_bgr = cv2.imread(page['original'], cv2.IMREAD_COLOR)
                  if slice_image_bgr is None:
                      raise RuntimeError(f"Could not read slice {page['original']}")
                  core_pixels = slice_image_bgr[local_y1:local_y2, :]
                  expected_h = src_y2 - src_y1
                  if core_pixels.shape[0] != expected_h or core_pixels.shape[1] != source_w:
                      ownership_issues.append({
                          'source_page': source_index,
                          'slice_index': page['slice_index'],
                          'core_shape': list(core_pixels.shape[:2]),
                          'expected_shape': [expected_h, source_w],
                      })
                  else:
                      recon[src_y1:src_y2, :] = core_pixels
                  prev_end = src_y2
              if prev_end != source_h:
                  ownership_issues.append({
                      'source_page': source_index,
                      'expected_end': source_h,
                      'actual_end': prev_end,
                  })
              diff = cv2.absdiff(source, recon)
              differing_pixels = int(np.count_nonzero(np.any(diff != 0, axis=2)))
              max_channel_diff = int(diff.max()) if diff.size else 0
              reconstruction_rows.append({
                  'source_page': source_index,
                  'pixel_exact': differing_pixels == 0,
                  'differing_pixels': differing_pixels,
                  'max_channel_diff': max_channel_diff,
              })

          reconstruction_pass = all(row['pixel_exact'] for row in reconstruction_rows)
          reconstruction = {
              'source_pages': len(raw_paths),
              'pixel_exact_pages': sum(1 for row in reconstruction_rows if row['pixel_exact']),
              'all_pixel_exact': reconstruction_pass,
              'rows': reconstruction_rows,
          }
          (root / 'reconstruction-check.json').write_text(
              json.dumps(reconstruction, ensure_ascii=False, indent=2), encoding='utf-8'
          )

          summary = {
              'checkpoint': '01-import',
              'chapter_id': chapter_id,
              'series_slug': 'starting-with-13-hidden-traits-53fc8424',
              'series_title': 'Starting With 13 Hidden Traits',
              'chapter_number': 46,
              'source_url': chapter_url,
              'reader_discovery_method': discovery_method,
              'reader_page_count': len(reader_urls),
              'source_images': len(raw_paths),
              'source_count_matches_reader': len(raw_paths) == len(reader_urls),
              'slices': len(pages),
              'slice_workers': max_workers,
              'skipped_pages': [],
              'source_order': [path.name for path in raw_paths],
              'source_pages': source_rows,
              'ownership_issues': ownership_issues,
              'pixel_exact_reconstruction': reconstruction_pass,
              'slice_order': [
                  {
                      'page_index': idx,
                      'source_page': page['source_page'],
                      'slice_index': page['slice_index'],
                      'original': page['original'],
                  }
                  for idx, page in enumerate(pages)
              ],
              'next_action': 'STOP_FOR_HUMAN_IMPORT_REVIEW',
          }
          (root / 'import-summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2), encoding='utf-8')

          def contact_sheet(paths, out_path, label_prefix, thumb_w=220, thumb_h=320, cols=5):
              cards=[]
              for idx, path in enumerate(paths):
                  with Image.open(path) as im:
                      rgb=im.convert('RGB')
                      rgb.thumbnail((thumb_w, thumb_h))
                      canvas=Image.new('RGB',(thumb_w+16,thumb_h+42),'white')
                      x=(canvas.width-rgb.width)//2
                      y=8+(thumb_h-rgb.height)//2
                      canvas.paste(rgb,(x,y))
                      draw=ImageDraw.Draw(canvas)
                      draw.text((8,thumb_h+14),f'{label_prefix} {idx:03d}: {Path(path).name}',fill='black')
                      cards.append(canvas)
              rows=(len(cards)+cols-1)//cols
              sheet=Image.new('RGB',(cols*(thumb_w+16),rows*(thumb_h+42)),'white')
              for i,card in enumerate(cards):
                  sheet.paste(card,((i%cols)*card.width,(i//cols)*card.height))
              sheet.save(out_path,quality=88)

          contact_sheet(raw_paths, root / 'source-contact-sheet.jpg', 'SRC')
          ordered_slices=[Path(page['original']) for page in pages]
          contact_sheet(ordered_slices, root / 'slice-contact-sheet.jpg', 'SLICE', thumb_h=260)

          (root / 'HUMAN_CHECKPOINT.txt').write_text(
              'CHECKPOINT: IMPORT REVIEW\nSTOP here. Inspect source/slice contact sheets, story/promo ordering, source count, ownership and pixel-exact reconstruction before CLEAN.\n',
              encoding='utf-8',
          )

          print(json.dumps({
              'chapter_id': chapter_id,
              'reader_pages': len(reader_urls),
              'source_images': len(raw_paths),
              'slices': len(pages),
              'ownership_issues': len(ownership_issues),
              'pixel_exact_pages': reconstruction['pixel_exact_pages'],
              'next_action': 'STOP_FOR_HUMAN_IMPORT_REVIEW',
          }, ensure_ascii=False))
          if ownership_issues:
              raise RuntimeError(f'ownership validation failed: {len(ownership_issues)} issue(s)')
          if not reconstruction_pass:
              raise RuntimeError('pixel-exact reconstruction failed')
          PY

      - name: Publish compact import review evidence to trial branch
        run: |
          mkdir -p trials/starting-with-13-hidden-traits-46/review/01-import
          cp checkpoint/01-import/import-summary.json trials/starting-with-13-hidden-traits-46/review/01-import/
          cp checkpoint/01-import/manifest.json trials/starting-with-13-hidden-traits-46/review/01-import/
          cp checkpoint/01-import/reconstruction-check.json trials/starting-with-13-hidden-traits-46/review/01-import/
          cp checkpoint/01-import/source-contact-sheet.jpg trials/starting-with-13-hidden-traits-46/review/01-import/
          cp checkpoint/01-import/slice-contact-sheet.jpg trials/starting-with-13-hidden-traits-46/review/01-import/
          cp checkpoint/01-import/HUMAN_CHECKPOINT.txt trials/starting-with-13-hidden-traits-46/review/01-import/
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('trials/starting-with-13-hidden-traits-46/chapter-state.json')
          state=json.loads(p.read_text(encoding='utf-8'))
          state.update({
              'current_stage':'IMPORT_REVIEW',
              'current_artifact':'01-import-57d7b970',
              'blockers':[],
              'next_action':'HUMAN_IMPORT_REVIEW'
          })
          p.write_text(json.dumps(state,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trials/starting-with-13-hidden-traits-46
          if ! git diff --cached --quiet; then
            git commit -m "review: publish chapter 46 import checkpoint"
            git push origin HEAD:trial/starting-with-13-hidden-traits-46
          fi

      - name: Upload checkpoint 01 artifact
        uses: actions/upload-artifact@v4
        with:
          name: 01-import-57d7b970
          path: checkpoint/01-import
          if-no-files-found: error
          retention-days: 7
