name: Roll back rejected Phase 12 focus budget

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/phase12-rollback.yml

permissions:
  contents: write

concurrency:
  group: phase12-rollback-main
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore Phase 11 focus budget
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/parameters.py')
          source = path.read_text(encoding='utf-8')
          old = '''DETECTOR_FOCUS_MAX_CHIPS = _env_int(\n    "MANGA_DETECTOR_FOCUS_MAX_CHIPS", 1, minimum=1, maximum=4\n)\n'''
          new = '''DETECTOR_FOCUS_MAX_CHIPS = _env_int(\n    "MANGA_DETECTOR_FOCUS_MAX_CHIPS", 2, minimum=1, maximum=4\n)\n'''
          if source.count(old) != 1:
              raise SystemExit('Phase 12 focus-budget anchor not found exactly once')
          path.write_text(source.replace(old, new), encoding='utf-8')
          PY
      - name: Compile rollback source
        run: >-
          python -m py_compile app/parameters.py app/detector/adaptive_focus_detector.py
          app/detector/combined_detector.py scripts/backend_phase11_sanity.py
      - name: Install deterministic test runtime
        run: >-
          python -m pip install numpy==1.26.4 opencv-contrib-python==4.10.0.84
          fastapi==0.115.0 pydantic==2.9.2 filelock==3.16.1
          loguru==0.7.2 Pillow==10.4.0
      - name: Verify restored focus budget and Phase 11 contract
        run: |
          python - <<'PY'
          from app.parameters import DETECTOR_FOCUS_MAX_CHIPS
          assert DETECTOR_FOCUS_MAX_CHIPS == 2, DETECTOR_FOCUS_MAX_CHIPS
          print('focus budget restored to 2')
          PY
          python scripts/backend_phase11_sanity.py
      - name: Run backend safety regressions
        run: |
          python scripts/release_sanity.py
          python scripts/inpaint_authority_sanity.py
          python scripts/backend_phase4_sanity.py
          python scripts/backend_phase5_sanity.py --correctness-only
          python scripts/backend_phase6_sanity.py
          python scripts/backend_phase8_sanity.py --correctness-only
          python scripts/research_mask_quality_sanity.py
      - name: Commit rollback
        shell: bash
        run: |
          git config user.name "Manga backend CI"
          git config user.email "actions@users.noreply.github.com"
          git add app/parameters.py
          git diff --cached --quiet && exit 0
          git commit -m "revert(detector): restore two focus refinement chips"
          git push origin HEAD:main
