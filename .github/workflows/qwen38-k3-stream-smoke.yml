name: Qwen3.8 K3 stream smoke

on:
  workflow_dispatch:
    inputs:
      layers:
        description: "Comma-separated real Qwen language layers"
        required: true
        default: "0,1"
        type: string
  push:
    branches:
      - test/qwen3.8-27b
    paths:
      - "research/qwen38/k3_stream.py"
      - "research/qwen38/k3_stream_sanity.py"
      - "research/qwen38/k3_real_layer_smoke.py"
      - ".github/workflows/qwen38-k3-stream-smoke.yml"

permissions:
  contents: read

jobs:
  synthetic-storage-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Prove pack layout and ring safety
        run: |
          python -m py_compile research/qwen38/k3_stream.py research/qwen38/k3_stream_sanity.py research/qwen38/k3_real_layer_smoke.py
          python research/qwen38/k3_stream_sanity.py

  real-layer-stream:
    needs: synthetic-storage-runtime
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        contains(github.event.head_commit.message, '[qwen-stream-real]')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true
          docker system prune -af || true
          sudo apt-get clean || true
          df -h
          free -h
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install real-weight dependencies
        run: python -m pip install --no-cache-dir huggingface_hub torch --index-url https://download.pytorch.org/whl/cpu
      - name: Resolve layers
        id: layers
        env:
          DISPATCH_LAYERS: ${{ inputs.layers }}
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            layers="$DISPATCH_LAYERS"
          else
            layers="0,1"
          fi
          echo "layers=$layers" >> "$GITHUB_OUTPUT"
      - name: Pack and stream real Qwen layers without generation
        env:
          QWEN38_STREAM_LAYERS: ${{ steps.layers.outputs.layers }}
        shell: bash
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP}/qwen38-k3-real"
          evidence="${RUNNER_TEMP}/qwen38-k3-evidence"
          mkdir -p "$work" "$evidence"
          /usr/bin/time -v python research/qwen38/k3_real_layer_smoke.py \
            --work-dir "$work" \
            --layers "$QWEN38_STREAM_LAYERS" \
            --output "$evidence/stream.json" \
            2>&1 | tee "$evidence/stream.log"
      - name: Show evidence and clean weights
        if: always()
        run: |
          cat "${RUNNER_TEMP}/qwen38-k3-evidence/stream.json" || true
          df -h || true
          free -h || true
          rm -rf "${RUNNER_TEMP}/qwen38-k3-real" || true
      - name: Upload metrics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen38-k3-stream-evidence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/qwen38-k3-evidence/stream.json
            ${{ runner.temp }}/qwen38-k3-evidence/stream.log
          if-no-files-found: warn
          retention-days: 14
