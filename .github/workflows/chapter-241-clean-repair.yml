name: Chapter 241 Checkpoint 02b Clean Local Repair

on:
  push:
    branches:
      - 'chapter/doctors-rebirth\+241'
    paths:
      - '.github/workflows/chapter-241-clean-repair.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: chapter-241-human-loop
  cancel-in-progress: false

jobs:
  repair-clean:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      CHAPTER_ID: c241d001
      CLEAN_RUN_ID: '34732864896'
      CLEAN_ARTIFACT: 02-clean-review-c241d001
      IMPORT_RUN_ID: '34732495460'
      IMPORT_ARTIFACT: 01-import-c241dr01
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'chapter/doctors-rebirth+241'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install repair runtime
        run: python -m pip install Pillow==10.4.0

      - name: Restore approved clean and import artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf checkpoint/01-import checkpoint/02-clean-review checkpoint/02b-clean-local-repair
          mkdir -p checkpoint/01-import checkpoint/02-clean-review checkpoint/02b-clean-local-repair
          gh run download "$CLEAN_RUN_ID" -n "$CLEAN_ARTIFACT" -D checkpoint/02-clean-review
          gh run download "$IMPORT_RUN_ID" -n "$IMPORT_ARTIFACT" -D checkpoint/01-import
          test -f checkpoint/02-clean-review/processed/manifest.json
          test -f checkpoint/01-import/raw/sliced/000_00.png
          test -f checkpoint/01-import/raw/sliced/003_02.png
          test -f checkpoint/01-import/raw/sliced/016_00.png

      - name: Apply human-reviewed local repairs
        run: |
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, shutil
          from pathlib import Path
          from PIL import Image

          src_clean = Path('checkpoint/02-clean-review/processed')
          raw_slices = Path('checkpoint/01-import/raw/sliced')
          out = Path('checkpoint/02b-clean-local-repair')
          processed = out / 'processed'
          shutil.copytree(src_clean, processed)

          manifest_path = processed / 'manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          pages = manifest.get('pages') or []
          if len(pages) != 68:
              raise RuntimeError(f'expected 68 slices, got {len(pages)}')
          if manifest.get('chapter_id') != 'c241d001':
              raise RuntimeError(f'unexpected runtime chapter id: {manifest.get("chapter_id")}')

          def sha(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          before = {p.name: sha(p) for p in processed.glob('clean_*.png')}

          # source 000 is a cover/scanlation splash: preserve exactly and exclude from OCR/render edits.
          p0 = pages[0]
          if (int(p0.get('source_page', -1)), int(p0.get('slice_index', -1))) != (0, 0):
              raise RuntimeError('page 0 no longer owns source 000/00')
          c0 = processed / Path(str(p0['clean'])).name
          r0 = raw_slices / '000_00.png'
          shutil.copy2(r0, c0)
          p0['skipped'] = True
          p0['skip_reason'] = 'non_story_cover_scanlation_splash_preserved'
          p0['editorial_role'] = 'non_story_preserve'
          for box in p0.get('boxes') or []:
              box['ocr_eligible'] = False
              box['safe_to_inpaint'] = False
              box['manual_preserve'] = True
              box['preserve_reason'] = 'non_story_cover'

          # source 003 slice 02 contains the decorative Doctor's Rebirth logo immediately above story dialogue.
          p11 = pages[11]
          if (int(p11.get('source_page', -1)), int(p11.get('slice_index', -1))) != (3, 2):
              raise RuntimeError('page 11 no longer owns source 003/02')
          c11 = processed / Path(str(p11['clean'])).name
          r11 = raw_slices / '003_02.png'
          restore_box = (20, 500, 880, 830)
          with Image.open(c11) as clean_im, Image.open(r11) as raw_im:
              clean = clean_im.convert('RGB')
              raw = raw_im.convert('RGB')
              if clean.size != raw.size:
                  raise RuntimeError('source 003/02 clean/raw size mismatch')
              patch = raw.crop(restore_box)
              clean.paste(patch, restore_box[:2])
              clean.save(c11, format='PNG')
          logo_box = next((b for b in (p11.get('boxes') or []) if b.get('id') == 'box_b04869771481418a'), None)
          if logo_box is None:
              raise RuntimeError('decorative title detector box missing')
          logo_box['ocr_eligible'] = False
          logo_box['safe_to_inpaint'] = False
          logo_box['manual_preserve'] = True
          logo_box['preserve_reason'] = 'decorative_series_title_logo'
          logo_box['editorial_role'] = 'artwork_title'

          # source 016 is the credit/promo tail: preserve exactly and exclude from OCR/render edits.
          p67 = pages[67]
          if (int(p67.get('source_page', -1)), int(p67.get('slice_index', -1))) != (16, 0):
              raise RuntimeError('page 67 no longer owns source 016/00')
          c67 = processed / Path(str(p67['clean'])).name
          r67 = raw_slices / '016_00.png'
          shutil.copy2(r67, c67)
          p67['skipped'] = True
          p67['skip_reason'] = 'non_story_credit_promo_tail_preserved'
          p67['editorial_role'] = 'non_story_preserve'
          for box in p67.get('boxes') or []:
              box['ocr_eligible'] = False
              box['safe_to_inpaint'] = False
              box['manual_preserve'] = True
              box['preserve_reason'] = 'non_story_credit_promo_tail'

          # Normalize clean paths for downstream restore; raw paths are restored from checkpoint 01 later.
          for p in pages:
              if p.get('clean'):
                  p['clean'] = f"data/processed/c241d001/{Path(str(p['clean'])).name}"

          manifest['clean_review'] = {
              'status': 'LOCAL_REPAIR_CANDIDATE',
              'base_run_id': 34732864896,
              'repair_targets': [
                  {'page_index': 0, 'source_page': 0, 'action': 'restore_entire_non_story_slice_and_skip'},
                  {'page_index': 11, 'source_page': 3, 'action': 'restore_decorative_title_region', 'box': list(restore_box)},
                  {'page_index': 67, 'source_page': 16, 'action': 'restore_entire_non_story_slice_and_skip'},
              ],
          }
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')

          after = {p.name: sha(p) for p in processed.glob('clean_*.png')}
          changed = sorted(name for name in before if before[name] != after.get(name))
          expected = ['clean_000_00.png', 'clean_003_02.png', 'clean_016_00.png']
          if changed != expected:
              raise RuntimeError(f'unexpected repaired clean files: {changed}')

          # Hard assertions for preservation repairs.
          if sha(c0) != sha(r0):
              raise RuntimeError('source 000 preservation restore is not pixel-exact')
          if sha(c67) != sha(r67):
              raise RuntimeError('source 016 preservation restore is not pixel-exact')
          with Image.open(c11) as ci, Image.open(r11) as ri:
              ca = ci.convert('RGB').crop(restore_box).tobytes()
              ra = ri.convert('RGB').crop(restore_box).tobytes()
              if ca != ra:
                  raise RuntimeError('source 003 title restore region is not pixel-exact')

          summary = {
              'checkpoint': '02b-clean-local-repair',
              'status': 'CANDIDATE_FOR_HUMAN_REVIEW',
              'chapter_id': 'c241d001',
              'base_clean_run_id': 34732864896,
              'base_clean_artifact': '02-clean-review-c241d001',
              'changed_clean_files': changed,
              'repairs': [
                  {'source_page': 0, 'page_index': 0, 'kind': 'non_story_preservation', 'pixel_exact_full_slice': True, 'skipped': True},
                  {'source_page': 3, 'page_index': 11, 'kind': 'decorative_title_preservation', 'restore_box': list(restore_box), 'pixel_exact_restore_region': True},
                  {'source_page': 16, 'page_index': 67, 'kind': 'non_story_preservation', 'pixel_exact_full_slice': True, 'skipped': True},
              ],
              'core_review': {
                  'slices_reviewed': 68,
                  'source_pages_reconstructed': 17,
                  'story_text_residue_blockers_found': 0,
                  'overlap_false_positives_discarded': [14, 20, 59, 63, 64],
                  'artwork_or_non_story_damage_repairs': 3,
              },
              'next_action': 'STOP_FOR_HUMAN_REPAIR_PROOF_REVIEW',
          }
          (out / 'repair-summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - name: Build repair proof images
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          import json

          raw = Path('checkpoint/01-import/raw/sliced')
          base = Path('checkpoint/02-clean-review/processed')
          fixed = Path('checkpoint/02b-clean-local-repair/processed')
          proof = Path('checkpoint/02b-clean-local-repair/proof')
          proof.mkdir(parents=True, exist_ok=True)
          font = ImageFont.load_default()

          def panel(src_name, crop=None, label=''):
              paths = [raw/src_name.replace('clean_', ''), base/src_name, fixed/src_name]
              ims=[]
              for p in paths:
                  with Image.open(p) as im:
                      x=im.convert('RGB')
                      if crop is not None: x=x.crop(crop)
                      x.thumbnail((500, 420), Image.Resampling.LANCZOS)
                      ims.append(x.copy())
              canvas=Image.new('RGB',(1530,470),'white'); d=ImageDraw.Draw(canvas)
              d.text((8,5),label,fill='black',font=font)
              for i,(im,title) in enumerate(zip(ims,['RAW','BASE CLEAN','REPAIRED'])):
                  x=i*510+(500-im.width)//2; y=28+(420-im.height)//2
                  canvas.paste(im,(x,y)); d.text((i*510+220,450),title,fill='black',font=font)
              return canvas

          panel('clean_000_00.png', None, 'source 000 non-story cover preservation').save(proof/'source-000.jpg',quality=92)
          panel('clean_003_02.png', (0,430,900,880), "source 003 Doctor's Rebirth decorative title repair").save(proof/'source-003-title.jpg',quality=92)
          panel('clean_016_00.png', None, 'source 016 credit/promo tail preservation').save(proof/'source-016.jpg',quality=92)
          PY

      - name: Upload repaired clean candidate
        uses: actions/upload-artifact@v4
        with:
          name: 02b-clean-local-repair-c241d001
          path: checkpoint/02b-clean-local-repair
          if-no-files-found: error
          retention-days: 7
