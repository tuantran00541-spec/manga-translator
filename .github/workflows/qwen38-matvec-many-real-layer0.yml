name: Qwen3.8 real layer0 matvec-many projection gate

on:
  push:
    branches: [research/qwen3.8-27b-runtime-finish]
    paths:
      - "research/qwen38/gguf_quant_matvec_many_avx2.c"
      - "research/qwen38/gguf_quant_matvec_many_bridge.c"
      - "research/qwen38/qwen38_matvec_many_real_layer0_probe.py"
      - ".github/workflows/qwen38-matvec-many-real-layer0.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  HF_HUB_DISABLE_TELEMETRY: "1"
  QWEN_REVISION: "1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0"

jobs:
  matvec-many-layer0:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[qwen-matvec-many-real]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4

      - name: Synthetic exactness and real-probe sanity
        shell: bash
        run: |
          set -euo pipefail
          cc -O3 -std=c11 -mavx2 -fno-fast-math -ffp-contract=off \
            -D_POSIX_C_SOURCE=200809L -DQWEN_MATVEC_MANY_SELFTEST \
            research/qwen38/gguf_quant_matvec_many_avx2.c -lm \
            -o "$RUNNER_TEMP/qwen-matvec-many-selftest"
          "$RUNNER_TEMP/qwen-matvec-many-selftest"
          PYTHONPATH=research/qwen38 python -u research/qwen38/qwen38_matvec_many_real_layer0_probe.py sanity

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Runner CPU and storage information
        shell: bash
        run: |
          lscpu
          df -h
          free -h

      - name: Reclaim disk
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true
          docker system prune -af || true
          df -h

      - name: Install download dependency
        run: python -m pip install --no-cache-dir huggingface_hub hf_xet

      - name: Download pinned real GGUF once
        shell: bash
        run: |
          set -euo pipefail
          MODEL=$(python - <<'PY'
          from huggingface_hub import hf_hub_download
          print(hf_hub_download(
              "bartowski/Qwen3.8-27B-GGUF",
              filename="Qwen3.8-27B-Q6_K_L.gguf",
              local_dir="${{ runner.temp }}/qwen38-model",
          ))
          PY
          )
          test -f "$MODEL"
          echo "MODEL=$MODEL" >> "$GITHUB_ENV"
          echo "WORK=$RUNNER_TEMP/qwen38-matvec-many-real" >> "$GITHUB_ENV"
          echo "EVIDENCE=$RUNNER_TEMP/qwen38-matvec-many-evidence" >> "$GITHUB_ENV"

      - name: Validate pinned decoder inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          PYTHONPATH=research/qwen38 python -u research/qwen38/qwen35_gguf_decoder_contract.py real \
            --model "$MODEL" --output "$EVIDENCE/inventory.json" \
            2>&1 | tee "$EVIDENCE/inventory.log"

      - name: Compile exact many-vector bridge
        shell: bash
        run: |
          set -euo pipefail
          cc -O3 -std=c11 -mavx2 -fno-fast-math -ffp-contract=off -fPIC -shared \
            research/qwen38/gguf_quant_matvec_many_bridge.c -lm \
            -o "$RUNNER_TEMP/libqwen_matvec_many.so"

      - name: Run real layer0 11-vector Q8/Q6 gate
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$WORK" "$EVIDENCE"
          PYTHONPATH=research/qwen38 python -u research/qwen38/qwen38_matvec_many_real_layer0_probe.py run \
            --model "$MODEL" \
            --many-lib "$RUNNER_TEMP/libqwen_matvec_many.so" \
            --inventory "$EVIDENCE/inventory.json" \
            --work-dir "$WORK" \
            --output "$EVIDENCE/matvec-many-real.json" \
            2>&1 | tee "$EVIDENCE/matvec-many-real.log"
          grep -F "QWEN38_MATVEC_MANY_REAL_LAYER0_BITWISE_PASS" "$EVIDENCE/matvec-many-real.log"

      - name: Validate real outputs and print summary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads((Path(os.environ["EVIDENCE"])/"matvec-many-real.json").read_text(encoding="utf-8"))
          assert r["status"] == "PASS"
          assert r["model_sha256"] == "a487690b9f17de581857c4ae484dab50800335bb9eb978a4fb02c0465629dc0a"
          assert r["prompt_token_count"] == 11
          assert r["q8_attn_qkv"]["bitwise_exact"] is True
          assert r["q6_attn_gate"]["bitwise_exact"] is True
          assert r["q8_attn_qkv"]["shape"] == [5120, 10240]
          assert r["q6_attn_gate"]["shape"] == [5120, 6144]
          assert r["reader"]["direct_io"] is True
          print("QWEN38_MATVEC_MANY_REAL_LAYER0_PASS")
          print(json.dumps({
              "q8_speedup": r["q8_attn_qkv"]["speedup"],
              "q6_speedup": r["q6_attn_gate"]["speedup"],
              "q8_seq_s": r["q8_attn_qkv"]["sequential_median_seconds"],
              "q8_many_s": r["q8_attn_qkv"]["many_median_seconds"],
              "q6_seq_s": r["q6_attn_gate"]["sequential_median_seconds"],
              "q6_many_s": r["q6_attn_gate"]["many_median_seconds"],
              "max_rss_gib": r["max_rss_gib"],
          }, indent=2))
          PY

      - name: Upload matvec-many evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen38-matvec-many-real-layer0-${{ github.run_id }}
          path: ${{ runner.temp }}/qwen38-matvec-many-evidence/
          if-no-files-found: warn
          retention-days: 14
