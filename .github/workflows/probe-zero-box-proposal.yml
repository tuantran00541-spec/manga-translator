name: Probe zero-box proposal fallback

on:
  workflow_dispatch:
  push:
    branches: ["experiment/one-shot-cleanup"]
    paths:
      - .github/workflows/probe-zero-box-proposal.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"
      CHAPTER_URL: "https://asurascans.com/comics/shadow-slave-6f7fe6eb/chapter/1"
      MANGA_ORT_PROVIDER: openvino
      MANGA_ORT_REQUIRE_PROVIDER: "1"
      MANGA_ORT_OPENVINO_SCOPE: detectors
      MANGA_ORT_OPENVINO_THREADS: "2"
      MANGA_ORT_OPENVINO_STREAMS: "1"
      MANGA_ORT_OPENVINO_CACHE_DIR: /tmp/manga-openvino-cache

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install probe dependencies
        run: |
          python -m pip install numpy==1.26.4 Pillow==10.4.0 opencv-contrib-python==4.10.0.84 onnxruntime-openvino==1.24.1 psutil==6.1.1 loguru==0.7.2 requests==2.32.3 beautifulsoup4==4.12.3 lxml==5.3.0 playwright==1.47.0 fastapi==0.115.0 pydantic==2.9.2 filelock==3.16.1 threadpoolctl==3.6.0

      - name: Restore benchmark models
        id: models
        uses: actions/cache@v4
        with:
          path: |
            models/*.onnx
            models/.e2e-provenance.json
          key: processing-profile-models-b224548-v1

      - name: Prepare slice zero
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from app.downloader.registry import download_chapter
          from app.downloader.slicer import slice_image

          raw = Path("probe/raw")
          slices = Path("probe/slices")
          raw.mkdir(parents=True, exist_ok=True)
          slices.mkdir(parents=True, exist_ok=True)
          paths = download_chapter(os.environ["CHAPTER_URL"], raw)
          all_slices = []
          for i, path in enumerate(sorted(paths)):
              records = slice_image(path, slices, f"{i:03d}", return_metadata=True)
              all_slices.extend(Path(r["path"]) for r in records)
          first = all_slices[0]
          Path("probe/slice0.txt").write_text(str(first))
          print("slice0", first)
          PY

      - name: Inspect raw detector scores on slice zero
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np

          from app.config import BUBBLE_DETECTOR_MODEL, TEXT_SEGMENTER_MODEL
          from app.detector.bubble_detector import YoloDetector
          from app.image_io import read_image
          from app.parameters import BUBBLE_PROPOSAL_CONF_THRESHOLD, TEXT_CONF_THRESHOLD

          path = Path(Path("probe/slice0.txt").read_text().strip())
          image = read_image(path)
          h, w = image.shape[:2]

          def raw_scores(detector, crop, ox=0, oy=0):
              blob, transform = detector._preprocess(crop, offset_x=ox, offset_y=oy)
              outputs = detector.session.run(None, {detector.input_name: blob})
              arr = np.squeeze(outputs[0])
              if arr.ndim == 1:
                  arr = arr[np.newaxis, :]
              if arr.ndim == 2 and arr.shape[0] < arr.shape[1]:
                  arr = arr.T
              num_mask = outputs[1].shape[1] if len(outputs) > 1 and outputs[1].ndim == 4 else 0
              num_classes = max(1, arr.shape[1] - 4 - num_mask)
              scores = arr[:, 4:4+num_classes]
              conf = scores[:, 0] if num_classes == 1 else scores.max(axis=1)
              top = np.sort(conf)[-10:][::-1]
              return [round(float(v), 6) for v in top]

          segmenter = YoloDetector(
              TEXT_SEGMENTER_MODEL,
              TEXT_CONF_THRESHOLD,
              use_tta=False,
              model_role="text_segmenter",
          )
          bubble = YoloDetector(
              BUBBLE_DETECTOR_MODEL,
              BUBBLE_PROPOSAL_CONF_THRESHOLD,
              use_tta=False,
              model_role="bubble_detector",
          )

          report = {
              "slice": path.name,
              "shape": [h, w],
              "segmenter_full_top": raw_scores(segmenter, image),
              "bubble_full_top": raw_scores(bubble, image),
              "segmenter_tiles": [],
          }

          ratio = 0.60
          tw, th = int(round(w*ratio)), int(round(h*ratio))
          for y in sorted({0, h-th}):
              for x in sorted({0, w-tw}):
                  crop = image[y:y+th, x:x+tw]
                  report["segmenter_tiles"].append({
                      "xyxy": [x,y,x+tw,y+th],
                      "top": raw_scores(segmenter, crop, x, y),
                  })

          # Also test the lowest confidence worth considering. Destructive
          # authority still requires a verified text-segmenter mask.
          segmenter.conf_threshold = 0.01
          low_conf_verified = []
          for item in report["segmenter_tiles"]:
              x1,y1,x2,y2 = item["xyxy"]
              boxes = segmenter._detect_single(image[y1:y2, x1:x2], x1, y1)
              low_conf_verified.extend([
                  b for b in boxes
                  if b.source_role == "text_segmenter" and b.verified_mask
              ])
          report["verified_at_0_01"] = [
              {
                  "xyxy":[b.x1,b.y1,b.x2,b.y2],
                  "confidence":round(float(b.confidence),6),
                  "mask_pixels":int((b.mask>127).sum()) if b.mask is not None else 0,
              }
              for b in low_conf_verified
          ]
          print(json.dumps(report, indent=2))
          PY
