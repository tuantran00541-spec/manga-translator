name: Chapter 251 Clean Review Repairs

on:
  push:
    branches:
      - trial/chapter-render-251
    paths:
      - .github/workflows/chapter-251-clean-repair.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: chapter-251-human-loop
  cancel-in-progress: false

jobs:
  repair-clean:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      CHAPTER_ID: c2510251
      CLEAN_RUN_ID: "34428272591"
      CLEAN_ARTIFACT: 02-clean-review-c2510251
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image repair dependency
        run: python -m pip install Pillow==10.4.0

      - name: Restore clean review checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf checkpoint/02-clean-review-fixed
          mkdir -p checkpoint/02-clean-review-fixed
          gh run download "$CLEAN_RUN_ID" -n "$CLEAN_ARTIFACT" -D checkpoint/02-clean-review-fixed
          test -f checkpoint/02-clean-review-fixed/processed/manifest.json
          test -d checkpoint/02-clean-review-fixed/raw/sliced

      - name: Apply deterministic human clean repairs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image

          root = Path('checkpoint/02-clean-review-fixed')
          raw_dir = root / 'raw' / 'sliced'
          processed = root / 'processed'
          manifest_path = processed / 'manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          pages = manifest.get('pages') or []
          if len(pages) != 77:
              raise RuntimeError(f'expected 77 slices, got {len(pages)}')

          def paths_for(page_index):
              page = pages[page_index]
              raw_name = Path(str(page.get('original') or '')).name
              clean_name = Path(str(page.get('clean') or '')).name
              raw_path = raw_dir / raw_name
              clean_path = processed / clean_name
              if not clean_path.is_file():
                  clean_path = processed / f'clean_{raw_name}'
              if not raw_path.is_file() or not clean_path.is_file():
                  raise RuntimeError(f'missing repair files page={page_index}: raw={raw_path} clean={clean_path}')
              return page, raw_path, clean_path

          repairs = []

          # p000 is a scanlation/chapter card, not story content. Automatic text
          # cleanup partially erased card typography, so preserve it exactly.
          page, raw_path, clean_path = paths_for(0)
          clean_path.write_bytes(raw_path.read_bytes())
          page['human_clean_review'] = {
              'action': 'restore_full_raw_non_story',
              'reason': 'scanlation_or_chapter_card_non_story_text',
              'review_status': 'pass_after_repair',
          }
          repairs.append({'page_index': 0, 'action': 'restore_full_raw', 'reason': 'non_story_card'})

          # p076 contains the final story line near the top, followed by creator
          # credits / scanlation promo. Keep the cleaned story area, restore only
          # the non-story tail so credits are not left half-erased.
          page, raw_path, clean_path = paths_for(76)
          clean = Image.open(clean_path).convert('RGB')
          raw = Image.open(raw_path).convert('RGB')
          if clean.size != raw.size:
              raise RuntimeError(f'p076 size mismatch clean={clean.size} raw={raw.size}')
          restore_y = 2500
          if not (0 < restore_y < raw.height):
              raise RuntimeError(f'p076 invalid restore_y={restore_y}, h={raw.height}')
          clean.paste(raw.crop((0, restore_y, raw.width, raw.height)), (0, restore_y))
          clean.save(clean_path)
          page['human_clean_review'] = {
              'action': 'restore_raw_tail_non_story',
              'reason': 'creator_credits_and_scanlation_promo_after_story',
              'restore_y': restore_y,
              'review_status': 'pass_after_repair',
              'story_region_preserved_clean': True,
          }
          repairs.append({'page_index': 76, 'action': 'restore_raw_tail', 'restore_y': restore_y, 'reason': 'non_story_credits_and_promo'})

          manifest['human_clean_review'] = {
              'status': 'pass_after_repair',
              'reviewed_slices': 77,
              'repairs': repairs,
              'story_inpaint_blockers': 0,
              'free_text_review': {
                  'destructive_authority_regions': 97,
                  'safe_free_text_candidates_audited': 23,
                  'review_only_regions_preserved': 161,
                  'known_non_story_overclean_repairs': 2,
              },
              'notes': (
                  'RAW/CLEAN review found no obvious story cleanup blocker. '
                  'Recovery/deferred proposals without safe_to_inpaint authority were intentionally preserved. '
                  'Final non-story credit/promo residue is preserved from RAW rather than half-deleted.'
              ),
              'next_action': 'OCR_CHECKPOINT_ALLOWED',
          }
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')

          summary_path = root / 'clean-review-summary.json'
          summary = json.loads(summary_path.read_text(encoding='utf-8')) if summary_path.exists() else {}
          summary.update({
              'human_review_status': 'PASS_AFTER_REPAIR',
              'human_reviewed_slices': 77,
              'story_inpaint_blockers': 0,
              'repairs': repairs,
              'next_action': 'OCR_CHECKPOINT_ALLOWED',
          })
          summary_path.write_text(json.dumps(summary, ensure_ascii=False, indent=2), encoding='utf-8')

          report = {
              'checkpoint': '02-clean-review-fixed',
              'chapter_id': 'c2510251',
              'status': 'PASS_AFTER_REPAIR',
              'reviewed_slices': 77,
              'repairs': repairs,
              'classification': {
                  'story_inpaint_blockers': 0,
                  'non_story_partial_cleanup': 2,
                  'review_only_regions_preserved': 161,
                  'destructive_authority_regions': 97,
              },
              'next_action': 'OCR_CHECKPOINT_ALLOWED',
          }
          (root / 'clean-review-report.json').write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY

      - name: Validate local repairs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image, ImageChops

          root=Path('checkpoint/02-clean-review-fixed')
          m=json.loads((root/'processed/manifest.json').read_text(encoding='utf-8'))
          pages=m['pages']
          rawdir=root/'raw'/'sliced'; proc=root/'processed'
          def paths(i):
              p=pages[i]; rn=Path(str(p.get('original') or '')).name; cn=Path(str(p.get('clean') or '')).name
              cp=proc/cn
              if not cp.is_file(): cp=proc/f'clean_{rn}'
              return rawdir/rn, cp
          r,c=paths(0)
          if ImageChops.difference(Image.open(r).convert('RGB'), Image.open(c).convert('RGB')).getbbox() is not None:
              raise RuntimeError('p000 full RAW restore failed')
          r,c=paths(76); a=Image.open(r).convert('RGB'); b=Image.open(c).convert('RGB')
          if ImageChops.difference(a.crop((0,2500,a.width,a.height)), b.crop((0,2500,b.width,b.height))).getbbox() is not None:
              raise RuntimeError('p076 tail RAW restore failed')
          review=m.get('human_clean_review') or {}
          if review.get('status')!='pass_after_repair' or review.get('story_inpaint_blockers')!=0:
              raise RuntimeError(f'clean human gate invalid: {review}')
          print('chapter 251 deterministic clean repair validation PASS')
          PY

      - name: Upload fixed clean checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: 02-clean-review-fixed-c2510251
          path: checkpoint/02-clean-review-fixed
          if-no-files-found: error
          retention-days: 7
