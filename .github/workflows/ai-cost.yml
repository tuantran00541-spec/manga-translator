name: A.I cost

on:
  push:
    paths:
      - ".github/ai-cost.txt"
  workflow_dispatch:
    inputs:
      chapter_url:
        description: "Chapter URLs to translate through the Manga Cloud gateway, separated by spaces; each runs on its own runner"
        required: true
      label:
        description: "Name of this run; evidence goes to audit-results/ai-cost/<label>/<chapter>"
        required: false
        default: run
      model:
        description: "Upstream model for this run instead of the one in .github/ai-cost.txt"
        required: false
      price:
        description: "USD per million tokens for that model: input output [cached]"
        required: false
      polish:
        description: "Advanced: the Jev judge grades every translated line and weak ones are rewritten"
        type: boolean
        default: false
      stage_models:
        description: 'Models per checkpoint, in fallback order: [{"stage":"review","model":"...","price":[in,out],"effort":"none"}]'
        required: false
        # Free sovinfra qwen3.8-27b scans and checks residue (two images a request, no thinking); muse, whose
        # glossary is far cleaner than qwen's, reads names and terms; luna translates.
        default: '[{"stage":"scan","model":"qwen3.8-27b","base":"https://api.sovinfra.ai/v1","key_env":"GATEWAY_SOVINFRA_KEY","price":[0,0],"effort":"none"},{"stage":"scan","model":"meta/muse-spark-1.2-contributor","price":[0.105,0.21,0.0021],"effort":"none"},{"stage":"glossary","model":"meta/muse-spark-1.2-contributor","price":[0.105,0.21,0.0021],"effort":"none"},{"stage":"glossary","model":"openai/gpt-6-luna","price":[0.105,0.525,0.0105]},{"stage":"review","model":"qwen3.8-27b","base":"https://api.sovinfra.ai/v1","key_env":"GATEWAY_SOVINFRA_KEY","price":[0,0],"effort":"none"},{"stage":"review","model":"meta/muse-spark-1.2-contributor","price":[0.105,0.21,0.0021],"effort":"none"},{"stage":"translate","model":"openai/gpt-6-luna","price":[0.105,0.525,0.0105]},{"stage":"translate","model":"xiaomi/mimo-v2.6-flash","price":[0.147,0.294,0.00294]}]'

permissions:
  contents: write

concurrency:
  group: ai-cost-${{ github.ref }}-${{ github.event.inputs.label || 'push' }}
  cancel-in-progress: true

jobs:
  chapters:
    runs-on: ubuntu-22.04
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/ai-cost.txt
          sparse-checkout-cone-mode: false

      - id: list
        env:
          INPUT_URL: ${{ github.event.inputs.chapter_url }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re
          urls = (os.environ.get("INPUT_URL") or open(".github/ai-cost.txt").readline()).split()
          rows = []
          for url in urls:
              parts = [part for part in url.split("?")[0].split("/") if part]
              name = re.sub(r"-[0-9a-f]{8}$", "", parts[-3] if len(parts) >= 3 else "chapter")
              rows.append({"url": url, "slug": f"{name}-{parts[-1]}"})
          print("list=" + json.dumps(rows))
          PY

  cost:
    needs: chapters
    name: cost (${{ matrix.slug }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.chapters.outputs.list) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: "."
      MANGA_PROCESSING_PIPELINE: fast
      MANGA_USE_DYNAMIC_LAMA: "1"
      MANGA_ORT_PROVIDER: openvino
      MANGA_ORT_REQUIRE_PROVIDER: "1"
      MANGA_ORT_OPENVINO_SCOPE: detectors
      MANGA_ORT_OPENVINO_THREADS: "2"
      MANGA_ORT_OPENVINO_STREAMS: "1"
      MANGA_ORT_OPENVINO_CACHE_DIR: /tmp/manga-openvino-cache
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/load-evidence

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install processing runtime
        run: |
          python -m pip install --only-binary :all: numpy==1.26.4 Pillow==10.4.0 opencv-contrib-python==4.10.0.84 \
            onnxruntime-openvino==1.24.1 psutil==6.1.1 loguru==0.7.2 requests==2.32.3 \
            beautifulsoup4==4.12.3 lxml==5.3.0 playwright==1.47.0 fastapi==0.115.0 \
            'uvicorn[standard]==0.30.6' pydantic==2.9.2 filelock==3.16.1 python-multipart==0.0.12 keyring==25.6.0
          python -m playwright install --with-deps chromium

      - name: Restore detector and inpaint models
        id: models
        uses: actions/cache@v4
        with:
          path: |
            models/*.onnx
            models/.e2e-provenance.json
          key: processing-profile-models-b224548-v1

      - name: Read pinned model provisioner
        if: steps.models.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          ref: b22454827f8190655d7070b80eb20c2550beadfa
          path: benchmark-bootstrap
          sparse-checkout: scripts/provision_real_e2e_models.py
          sparse-checkout-cone-mode: false

      - name: Provision production detector and LaMa models
        if: steps.models.outputs.cache-hit != 'true'
        run: |
          python -m pip install --only-binary :all: --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple torch==2.5.1+cpu torchvision==0.20.1+cpu
          python -m pip install --only-binary :all: --no-deps ultralytics==8.3.221 onnx==1.17.0 onnxslim==0.1.71
          python -m pip install --only-binary :all: sympy==1.13.1 PyYAML==6.0.2 scipy==1.14.1 tqdm==4.67.1 matplotlib==3.9.2 pandas==2.2.3 py-cpuinfo==9.0.0 ml_dtypes==0.5.3 colorama==0.4.6 polars==1.33.1 ultralytics-thop==2.0.17
          python benchmark-bootstrap/scripts/provision_real_e2e_models.py
          cp benchmark-bootstrap/models/*.onnx models/
          cp benchmark-bootstrap/models/.e2e-provenance.json models/ || true

      - name: Build the CTD mask model
        uses: ./.github/actions/build-ctd

      - name: Pick the provider
        env:
          INPUT_MODEL: ${{ github.event.inputs.model }}
          INPUT_PRICE: ${{ github.event.inputs.price }}
          INPUT_STAGES: ${{ github.event.inputs.stage_models }}
        run: |
          conf() { sed -n "s/^$1: *//p" .github/ai-cost.txt | head -n1 | tr -d '\r'; }
          provider="$(conf provider)"
          case "${provider:-sovinfra}" in
            sovinfra)
              base=https://api.sovinfra.ai/v1; model=qwen3.8-27b; secret=SOVINFRA_LAB_1B_TOKEN; price_in=0.12; price_out=0.12 ;;
            minirouter)
              base=https://api.minirouter.sh/v1; model=; secret=MINIROUTER_API_KEY; price_in=0; price_out=0 ;;
            *) echo "::error::Unknown provider '$provider'"; exit 1 ;;
          esac
          model="${INPUT_MODEL:-$(conf model)}"; model="${model:-$( [ "$provider" = minirouter ] || echo qwen3.8-27b )}"
          price="${INPUT_PRICE:-$(conf price)}"
          price_cached=
          if [ -n "$price" ]; then read -r price_in price_out price_cached <<< "$price"; fi
          {
            echo "PROVIDER=${provider:-sovinfra}"
            echo "PROVIDER_SECRET=$secret"
            echo "GATEWAY_UPSTREAM_BASE=$base"
            echo "GATEWAY_UPSTREAM_MODEL=$model"
            echo "GATEWAY_PRICE_INPUT_PER_M=$price_in"
            echo "GATEWAY_PRICE_OUTPUT_PER_M=${price_out:-$price_in}"
            echo "GATEWAY_UPSTREAM_REASONING_TOKENS=$(conf reasoning)"
            echo "GATEWAY_UPSTREAM_REASONING_EFFORT=$(conf effort)"
            echo "GATEWAY_PRICE_CACHED_PER_M=$price_cached"
            echo "GATEWAY_STAGE_MODELS=$(printf '%s' "$INPUT_STAGES" | tr -d '\n')"
            # minirouter serves the Jev judge; its answers are free and input costs this much per million tokens.
            if [ "${provider:-sovinfra}" = minirouter ]; then
              echo "GATEWAY_JUDGE_MODEL=typesafe-ai/jev"
              echo "GATEWAY_JUDGE_PRICE_PER_M=0.0462"
            fi
          } >> "$GITHUB_ENV"

      - name: Check the provider secret
        env:
          SOVINFRA_LAB_1B_TOKEN: ${{ secrets.SOVINFRA_LAB_1B_TOKEN }}
          MINIROUTER_API_KEY: ${{ secrets.MINIROUTER_API_KEY }}
        run: |
          test -n "${!PROVIDER_SECRET}" || { echo "::error::Secret $PROVIDER_SECRET is missing or empty"; exit 1; }

      - name: List the provider's models
        env:
          SOVINFRA_LAB_1B_TOKEN: ${{ secrets.SOVINFRA_LAB_1B_TOKEN }}
          MINIROUTER_API_KEY: ${{ secrets.MINIROUTER_API_KEY }}
        run: |
          mkdir -p audit-results/providers
          curl -sS --max-time 30 -H "Authorization: Bearer ${!PROVIDER_SECRET}" "$GATEWAY_UPSTREAM_BASE/models" \
            | python -c 'import json,sys; d=json.load(sys.stdin); rows=d.get("data", d) if isinstance(d, dict) else d; json.dump([{k: m.get(k) for k in ("id","name","context_length","pricing","architecture") if k in m} for m in rows if isinstance(m, dict)], sys.stdout, indent=1)' \
            > "audit-results/providers/$PROVIDER-models.json" || echo "::warning::Could not list models"
          python -c 'import json,sys; print(len(json.load(open(sys.argv[1]))), "models")' "audit-results/providers/$PROVIDER-models.json" || true
          if [ -z "$GATEWAY_UPSTREAM_MODEL" ]; then
            echo "No model: line in .github/ai-cost.txt; only the model list is recorded."
            echo "SKIP_TRANSLATE=1" >> "$GITHUB_ENV"
          fi

      - name: Check the model reads images
        if: env.SKIP_TRANSLATE != '1'
        env:
          SOVINFRA_LAB_1B_TOKEN: ${{ secrets.SOVINFRA_LAB_1B_TOKEN }}
          MINIROUTER_API_KEY: ${{ secrets.MINIROUTER_API_KEY }}
          GATEWAY_SOVINFRA_KEY: ${{ secrets.SOVINFRA_LAB_1B_TOKEN }}
        run: |
          KEY="${!PROVIDER_SECRET}" python - <<'PY'
          import base64, json, os, sys, time, cv2, numpy as np, requests
          image = np.full((96, 160, 3), 255, np.uint8)
          cv2.putText(image, "HELLO", (12, 62), cv2.FONT_HERSHEY_SIMPLEX, 1.3, (0, 0, 0), 3)
          data = base64.b64encode(cv2.imencode(".jpg", image)[1].tobytes()).decode()
          # Every model a checkpoint may reach must read images and take the thinking level the app asks for.
          stages = json.loads(os.environ.get("GATEWAY_STAGE_MODELS") or "[]")
          main = (os.environ["GATEWAY_UPSTREAM_BASE"], os.environ["KEY"])
          models = {os.environ["GATEWAY_UPSTREAM_MODEL"]: (os.environ.get("GATEWAY_UPSTREAM_REASONING_EFFORT") or "low", *main)}
          for item in stages:
              where = (item["base"], os.environ.get(item.get("key_env") or "", "")) if item.get("base") else main
              models.setdefault(item["model"], (item.get("effort") or "low", *where))
          failed = False
          for model, (effort, base, key) in models.items():
              body = {"model": model, "max_tokens": 2000, "reasoning_effort": effort, "messages": [{"role": "user", "content": [
                  {"type": "text", "text": "What word is written in this image? Answer with the word only."},
                  {"type": "image_url", "image_url": {"url": "data:image/jpeg;base64," + data}}]}]}
              started = time.time()
              response = requests.post(
                  base.rstrip("/") + "/chat/completions",
                  headers={"Authorization": "Bearer " + key}, json=body, timeout=(10, 120))
              reply, usage = "", {}
              if response.ok:
                  reply = ((response.json().get("choices") or [{}])[0].get("message") or {}).get("content") or ""
                  usage = response.json().get("usage") or {}
              reasoning = (usage.get("completion_tokens_details") or {}).get("reasoning_tokens")
              print(f"{model} ({effort}): HTTP {response.status_code} in {time.time() - started:.1f}s: {reply[:80]!r}, reasoning tokens {reasoning}")
              if not response.ok or "HELLO" not in reply.upper():
                  print(f"::error::{model} did not read a test image: HTTP {response.status_code} {response.text[:300]}")
                  failed = True
          sys.exit(1 if failed else 0)
          PY

      - name: Translate a real chapter through the gateway
        if: env.SKIP_TRANSLATE != '1'
        env:
          SOVINFRA_LAB_1B_TOKEN: ${{ secrets.SOVINFRA_LAB_1B_TOKEN }}
          MINIROUTER_API_KEY: ${{ secrets.MINIROUTER_API_KEY }}
          # A stage route with "base" and "key_env": "GATEWAY_SOVINFRA_KEY" runs on sovinfra's free tokens.
          GATEWAY_SOVINFRA_KEY: ${{ secrets.SOVINFRA_LAB_1B_TOKEN }}
          CHAPTER_URL: ${{ matrix.url }}
          OUT: audit-results/ai-cost/${{ github.event.inputs.label || 'push' }}/${{ matrix.slug }}
          INPUT_POLISH: ${{ github.event.inputs.polish }}
        run: |
          export GATEWAY_UPSTREAM_KEY="${!PROVIDER_SECRET}"
          rm -rf "audit-results/ai-cost"
          python scripts/ai_cost_run.py "$CHAPTER_URL" --out "$OUT" $( [ "$INPUT_POLISH" = true ] && echo --polish )

      - name: Logs
        if: always()
        run: |
          tail -n 60 /tmp/gateway.log || true
          grep -E "ERROR|WARNING|A.I mode" /tmp/app.log | tail -n 80 || true

      - name: Save evidence to audit-evidence
        if: always()
        uses: ./.github/actions/save-evidence
        with:
          paths: audit-results/ai-cost/${{ github.event.inputs.label || 'push' }}/${{ matrix.slug }} audit-results/providers
          message: "audit: A.I cost ${{ github.event.inputs.label || 'push' }} ${{ matrix.slug }} (run ${{ github.run_id }})"
