name: Research OCR Python 3.12 compatibility

on:
  push:
    branches:
      - feat/ppocrv6-runtime-migration
    paths:
      - .github/workflows/research-ocr-python312.yml
      - requirements.txt
      - Dockerfile
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python312-ocr-deps:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Resolve full production requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install --dry-run --ignore-installed --report /tmp/requirements-plan.json -r requirements.txt
          python - <<'PY'
          import json
          from pathlib import Path

          plan = json.loads(Path('/tmp/requirements-plan.json').read_text(encoding='utf-8'))
          names = sorted({
              str(item.get('metadata', {}).get('name') or '').lower()
              for item in plan.get('install', [])
              if item.get('metadata', {}).get('name')
          })
          required = {'paddleocr', 'paddlepaddle', 'opencv-contrib-python', 'manga-ocr', 'torch'}
          missing = sorted(required - set(names))
          assert not missing, f'missing from resolver plan: {missing}'
          assert 'opencv-python-headless' not in names, names
          print('PY312_REQUIREMENTS_RESOLVED', {'packages': len(names), 'required': sorted(required)})
          PY

      - name: Install production OCR dependency pins
        run: |
          python -m pip install \
            "numpy==1.26.4" \
            "opencv-contrib-python==4.10.0.84" \
            "paddlepaddle==3.2.2" \
            "paddleocr==3.7.0"

      - name: Import OCR runtime on Python 3.12
        run: |
          python - <<'PY'
          import sys
          from importlib import metadata

          import cv2
          import numpy
          import paddle
          import paddleocr

          opencv_dists = sorted(
              {
                  (dist.metadata.get("Name") or "").strip().lower()
                  for dist in metadata.distributions()
                  if (dist.metadata.get("Name") or "").strip().lower().startswith("opencv-")
              }
          )
          assert opencv_dists == ["opencv-contrib-python"], opencv_dists

          print("PY312_OCR_RUNTIME", {
              "python": sys.version,
              "numpy": numpy.__version__,
              "opencv": cv2.__version__,
              "opencv_distributions": opencv_dists,
              "paddle": paddle.__version__,
              "paddleocr": paddleocr.__version__,
          })
          PY
