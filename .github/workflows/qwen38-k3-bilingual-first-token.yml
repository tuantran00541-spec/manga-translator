name: Qwen3.8 K3 bilingual first-token smoke

on:
  push:
    branches:
      - test/qwen3.8-27b
    paths:
      - "research/qwen38/k3_bilingual_first_token.py"
      - ".github/workflows/qwen38-k3-bilingual-first-token.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bilingual-first-token:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        contains(github.event.head_commit.message, '[qwen-stream-bilingual]')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      HF_HUB_DISABLE_TELEMETRY: "1"
      USE_HUB_KERNELS: "NO"
    steps:
      - uses: actions/checkout@v4

      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true
          docker system prune -af || true
          sudo apt-get clean || true
          df -h
          free -h

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install exact tokenizer and decoder dependencies
        run: |
          python -m pip install --no-cache-dir numpy "transformers==5.16.1" safetensors huggingface_hub tokenizers
          python -m pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu

      - name: Compile bilingual smoke before downloading weights
        run: |
          python -m py_compile \
            research/qwen38/core.py \
            research/qwen38/k3_stream.py \
            research/qwen38/k3_linear_layer_gate.py \
            research/qwen38/k3_full_attention_gate.py \
            research/qwen38/k3_windowed_chain_gate.py \
            research/qwen38/k3_logits_gate.py \
            research/qwen38/k3_cache_gate.py \
            research/qwen38/k3_full_cached_logits_gate.py \
            research/qwen38/k3_bilingual_first_token.py

      - name: Run real VI and EN chat-template first-token smoke
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/qwen38-k3-bilingual"
          evidence="$RUNNER_TEMP/qwen38-k3-bilingual-evidence"
          mkdir -p "$work" "$evidence"
          /usr/bin/time -v python research/qwen38/k3_bilingual_first_token.py \
            --work-dir "$work" \
            --window-size 8 \
            --output "$evidence/bilingual.json" \
            2>&1 | tee "$evidence/bilingual.log"

      - name: Show evidence and clean temporary weights
        if: always()
        run: |
          cat "$RUNNER_TEMP/qwen38-k3-bilingual-evidence/bilingual.json" || true
          df -h || true
          free -h || true
          rm -rf "$RUNNER_TEMP/qwen38-k3-bilingual" || true

      - name: Upload metrics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen38-k3-bilingual-evidence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/qwen38-k3-bilingual-evidence/bilingual.json
            ${{ runner.temp }}/qwen38-k3-bilingual-evidence/bilingual.log
          if-no-files-found: warn
          retention-days: 14
