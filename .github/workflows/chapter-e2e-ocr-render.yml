name: Chapter E2E OCR render gate

on:
  push:
    branches:
      - chapter/test-e2e
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chapter-e2e-ocr-render
  cancel-in-progress: true

jobs:
  chapter-e2e:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUNBUFFERED: "1"
      MANGA_USE_DYNAMIC_LAMA: "1"
      MANGA_ORT_PROVIDER: openvino
      MANGA_ORT_REQUIRE_PROVIDER: "1"
      MANGA_ORT_OPENVINO_SCOPE: detectors
      MANGA_ORT_OPENVINO_THREADS: "2"
      MANGA_ORT_OPENVINO_STREAMS: "1"
      MANGA_ORT_OPENVINO_CACHE_DIR: /tmp/manga-openvino-cache
      OPENBLAS_NUM_THREADS: "1"
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install processing and English OCR runtime
        run: |
          python -m pip install             numpy==1.26.4 Pillow==10.4.0 opencv-contrib-python==4.10.0.84             onnxruntime-openvino==1.24.1 psutil==6.1.1 loguru==0.7.2             requests==2.32.3 beautifulsoup4==4.12.3 lxml==5.3.0             playwright==1.47.0 fastapi==0.115.0 pydantic==2.9.2             filelock==3.16.1 threadpoolctl==3.6.0 chardet==5.2.0             pyclipper==1.3.0.post5 shapely==2.0.6             paddleocr==3.7.0 paddlepaddle==3.2.2

      - name: Restore detector and inpaint models
        id: models
        uses: actions/cache@v4
        with:
          path: |
            models/*.onnx
            models/.e2e-provenance.json
          key: processing-profile-models-b224548-v1

      - name: Read pinned model provisioner
        if: steps.models.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          ref: b22454827f8190655d7070b80eb20c2550beadfa
          path: benchmark-bootstrap
          sparse-checkout: scripts/provision_real_e2e_models.py
          sparse-checkout-cone-mode: false

      - name: Provision production detector and LaMa models
        if: steps.models.outputs.cache-hit != 'true'
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple torch==2.5.1+cpu torchvision==0.20.1+cpu
          python -m pip install --no-deps ultralytics==8.3.221 onnx==1.17.0 onnxslim==0.1.71
          python -m pip install numpy==1.26.4 sympy==1.13.1 PyYAML==6.0.2 scipy==1.14.1 tqdm==4.67.1 matplotlib==3.9.2 pandas==2.2.3 py-cpuinfo==9.0.0 ml_dtypes==0.5.3 colorama==0.4.6 polars==1.33.1 ultralytics-thop==2.0.17
          python benchmark-bootstrap/scripts/provision_real_e2e_models.py
          cp benchmark-bootstrap/models/*.onnx models/
          cp benchmark-bootstrap/models/.e2e-provenance.json models/

      - name: Cache PaddleOCR model downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.paddlex
            ~/.cache/paddle
          key: paddleocr-v6-small-en-v1

      - name: Run real War of Extinction chapter E2E
        run: |
          mkdir -p benchmark-results/chapter-e2e
          python scripts/chapter_e2e_ocr_render_gate.py             --url "https://asurascans.com/comics/war-of-extinction-6f7fe6eb/chapter/1"             --workers 2             --max-render-pages 8             --output benchmark-results/chapter-e2e/report.json

      - name: Publish E2E summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path("benchmark-results/chapter-e2e/report.json")
          if not path.is_file():
              raise SystemExit(0)
          r = json.loads(path.read_text(encoding="utf-8"))
          lines = [
              "## War of Extinction chapter 1 — OCR metadata E2E",
              "",
              f"- Passed: **{r.get('passed')}**",
              f"- Source pages / slices: {r.get('source_pages')} / {r.get('slices')}",
              f"- Detector + inpaint: **{r.get('process_s')} s**",
              f"- OCR targets / recognized: {r.get('ocr_targets')} / {r.get('recognized_text_boxes')}",
              f"- Metadata-complete recognized boxes: **{r.get('metadata_complete_boxes')}**",
              f"- Missing metadata: **{len(r.get('metadata_missing_boxes') or [])}**",
              f"- Rendered sample pages / objects: {r.get('rendered_pages')} / {r.get('rendered_objects')}",
              f"- OCR time: **{r.get('ocr_s')} s**",
              f"- Total measured time: **{r.get('total_s')} s**",
          ]
          failures = r.get("failures") or []
          if failures:
              lines.extend(["", "### Failures", *[f"- {item}" for item in failures]])
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("\n".join(lines) + "\n")
          print("\n".join(lines))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: war-of-extinction-ch1-e2e-${{ github.run_id }}
          path: benchmark-results/chapter-e2e/
          retention-days: 7
          if-no-files-found: warn
