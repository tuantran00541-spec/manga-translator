name: Focused segmenter 640 A/B

on:
  push:
    branches:
      - release/focused-segmenter-640
    paths:
      - scripts/specialize_text_segmenter.py
      - scripts/profile_processing.py
      - app/config.py
      - app/parameters.py
      - app/detector/bubble_detector.py
      - app/detector/combined_detector.py
      - app/detector/fast_residue_detector.py
      - .github/workflows/focused-segmenter-ab.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-specialized-model:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
      MANGA_USE_DYNAMIC_LAMA: "1"
      MANGA_ORT_PROVIDER: openvino
      MANGA_ORT_REQUIRE_PROVIDER: "1"
      MANGA_ORT_OPENVINO_SCOPE: detectors
      MANGA_ORT_OPENVINO_THREADS: "2"
      MANGA_ORT_OPENVINO_STREAMS: "1"
      MANGA_ORT_OPENVINO_CACHE_DIR: /tmp/manga-openvino-focused-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install model surgery and production profile runtime
        run: |
          python -m pip install numpy==1.26.4 onnx==1.17.0 onnxruntime-openvino==1.24.1 Pillow==10.4.0 opencv-contrib-python==4.10.0.84 psutil==6.1.1 loguru==0.7.2 requests==2.32.3 beautifulsoup4==4.12.3 lxml==5.3.0 playwright==1.47.0 fastapi==0.115.0 pydantic==2.9.2 filelock==3.16.1 threadpoolctl==3.6.0

      - name: Restore benchmark models
        id: models
        uses: actions/cache@v4
        with:
          path: |
            models/*.onnx
            models/.e2e-provenance.json
          key: processing-profile-models-b224548-v1

      - name: Read pinned model provisioner
        if: steps.models.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          ref: b22454827f8190655d7070b80eb20c2550beadfa
          path: benchmark-bootstrap
          sparse-checkout: scripts/provision_real_e2e_models.py
          sparse-checkout-cone-mode: false

      - name: Provision source text segmenter
        if: steps.models.outputs.cache-hit != 'true'
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple torch==2.5.1+cpu torchvision==0.20.1+cpu
          python -m pip install --no-deps ultralytics==8.3.221 onnxslim==0.1.71
          python -m pip install sympy==1.13.1 PyYAML==6.0.2 scipy==1.14.1 tqdm==4.67.1 matplotlib==3.9.2 pandas==2.2.3 py-cpuinfo==9.0.0 ml_dtypes==0.5.3 colorama==0.4.6 polars==1.33.1 ultralytics-thop==2.0.17
          python benchmark-bootstrap/scripts/provision_real_e2e_models.py
          cp benchmark-bootstrap/models/text_segmenter.onnx models/

      - name: Build 640 specialized segmenter
        run: |
          python scripts/specialize_text_segmenter.py \
            --source models/text_segmenter.onnx \
            --output models/text_segmenter_640.onnx \
            --size 640

      - name: Verify 640 contract and execution
        run: |
          python - <<'PY'
          import json, time
          import numpy as np
          import onnxruntime as ort

          providers = ["CPUExecutionProvider"]
          if "OpenVINOExecutionProvider" in ort.get_available_providers():
              providers = [
                  ("OpenVINOExecutionProvider", {
                      "device_type": "CPU",
                      "precision": "FP32",
                      "num_of_threads": "2",
                      "num_streams": "1",
                  }),
                  "CPUExecutionProvider",
              ]
          session = ort.InferenceSession("models/text_segmenter_640.onnx", providers=providers)
          inp = session.get_inputs()[0]
          assert list(inp.shape) == [1, 3, 640, 640], inp.shape
          declared = [list(x.shape) for x in session.get_outputs()]
          assert declared == [[1, 37, 8400], [1, 32, 160, 160]], declared
          x = np.zeros((1, 3, 640, 640), np.float32)
          started = time.perf_counter()
          out = session.run(None, {inp.name: x})
          elapsed_ms = (time.perf_counter() - started) * 1000
          actual = [list(np.asarray(v).shape) for v in out]
          assert actual == [[1, 37, 8400], [1, 32, 160, 160]], actual
          print(json.dumps({
              "providers": session.get_providers(),
              "input": list(inp.shape),
              "outputs": actual,
              "first_run_ms": round(elapsed_ms, 3),
          }))
          PY


      - name: Fetch identical production profile inputs
        run: |
          python scripts/profile_processing.py --prepare \
            --raw-dir benchmark-results/focused-ab-input

      - name: Baseline profile with 1024 retry segmenter
        env:
          MANGA_DETECTOR_RETRY_SEGMENTER_ENABLED: "0"
        run: |
          python scripts/profile_processing.py \
            --raw-dir benchmark-results/focused-ab-input \
            --profile retry1024 \
            --workers 1 \
            --repeats 2 \
            --output benchmark-results/focused-ab/retry1024.json

      - name: Candidate profile with 640 retry segmenter
        env:
          MANGA_DETECTOR_RETRY_SEGMENTER_ENABLED: "1"
        run: |
          python scripts/profile_processing.py \
            --raw-dir benchmark-results/focused-ab-input \
            --profile retry640 \
            --workers 1 \
            --repeats 2 \
            --output benchmark-results/focused-ab/retry640.json

      - name: Compare warm detector evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import cv2
          import numpy as np

          root = Path("benchmark-results/focused-ab")
          base = json.loads((root / "retry1024.json").read_text())
          cand = json.loads((root / "retry640.json").read_text())
          b = base["runs"][-1]
          c = cand["runs"][-1]

          def detector_sum(run):
              total = 0.0
              for page in run.get("pages", []):
                  metrics = page.get("metrics") or {}
                  det = metrics.get("detector") or {}
                  total += float(det.get("total_ms") or metrics.get("detect_ms") or 0.0)
              return total

          masks = []
          for page in b.get("pages", []):
              index = int(page["index"])
              bp = root / "retry1024" / f"{index}-mask.png"
              cp = root / "retry640" / f"{index}-mask.png"
              bm = cv2.imread(str(bp), cv2.IMREAD_GRAYSCALE)
              cm = cv2.imread(str(cp), cv2.IMREAD_GRAYSCALE)
              if bm is None or cm is None or bm.shape != cm.shape:
                  raise RuntimeError(f"missing/mismatched authority mask for page {index}")
              bb = bm > 127
              cc = cm > 127
              inter = int(np.count_nonzero(bb & cc))
              bpix = int(np.count_nonzero(bb))
              cpix = int(np.count_nonzero(cc))
              masks.append({
                  "index": index,
                  "baseline_pixels": bpix,
                  "candidate_pixels": cpix,
                  "intersection": inter,
                  "recall_vs_baseline": inter / float(max(1, bpix)),
                  "precision_vs_baseline": inter / float(max(1, cpix)),
              })

          baseline_passes = b.get("detector_passes") or {}
          candidate_passes = c.get("detector_passes") or {}
          baseline_phases = baseline_passes.get("by_phase") or {}
          candidate_phases = candidate_passes.get("by_phase") or {}
          report = {
              "baseline_warm_wall_ms": float(b["wall_ms"]),
              "candidate_warm_wall_ms": float(c["wall_ms"]),
              "baseline_detector_sum_ms": detector_sum(b),
              "candidate_detector_sum_ms": detector_sum(c),
              "wall_speedup": float(b["wall_ms"]) / max(1e-9, float(c["wall_ms"])),
              "detector_speedup": detector_sum(b) / max(1e-9, detector_sum(c)),
              "baseline_passes": baseline_passes,
              "candidate_passes": candidate_passes,
              "authority_masks": masks,
          }
          (root / "comparison.json").write_text(json.dumps(report, indent=2) + "\n")
          print(json.dumps(report, indent=2))
          if any(page.get("outside_mask_changed") for page in c.get("pages", [])):
              raise RuntimeError("candidate changed pixels outside its authority mask")

          if any(
              row["baseline_pixels"] != row["candidate_pixels"]
              or row["intersection"] != row["baseline_pixels"]
              for row in masks
          ):
              raise RuntimeError("residue-only candidate changed destructive authority masks")

          if baseline_passes.get("total_forward_calls") != candidate_passes.get("total_forward_calls"):
              raise RuntimeError("residue-only candidate changed detector forward-call count")

          for phase in ("primary", "grayscale_retry", "mser_promotion"):
              base_phase = baseline_phases.get(phase) or {}
              cand_phase = candidate_phases.get(phase) or {}
              if base_phase.get("calls") != cand_phase.get("calls"):
                  raise RuntimeError(f"{phase} call count changed under residue-only specialization")
              if base_phase.get("model_pixels") != cand_phase.get("model_pixels"):
                  raise RuntimeError(f"{phase} resolution changed under residue-only specialization")

          base_residue = baseline_phases.get("residue_verify") or {}
          cand_residue = candidate_phases.get("residue_verify") or {}
          if base_residue.get("calls") != cand_residue.get("calls"):
              raise RuntimeError("residue verification call count changed")
          if not (
              int(cand_residue.get("model_pixels") or 0)
              < int(base_residue.get("model_pixels") or 0)
          ):
              raise RuntimeError("residue specialization did not reduce model pixels")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: focused-segmenter-ab-${{ github.run_id }}
          path: |
            benchmark-results/focused-ab/
            benchmark-results/focused-ab-input/
          retention-days: 7
          if-no-files-found: error
