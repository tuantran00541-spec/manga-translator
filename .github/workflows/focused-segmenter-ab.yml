name: Focused segmenter 640 A/B

on:
  push:
    branches:
      - release/focused-segmenter-640
    paths:
      - scripts/specialize_text_segmenter.py
      - scripts/profile_processing.py
      - app/config.py
      - app/parameters.py
      - app/detector/bubble_detector.py
      - app/detector/combined_detector.py
      - app/detector/fast_residue_detector.py
      - .github/workflows/focused-segmenter-ab.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-specialized-model:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install model surgery runtime
        run: |
          python -m pip install numpy==1.26.4 onnx==1.17.0 onnxruntime-openvino==1.24.1

      - name: Restore benchmark models
        id: models
        uses: actions/cache@v4
        with:
          path: |
            models/*.onnx
            models/.e2e-provenance.json
          key: processing-profile-models-b224548-v1

      - name: Read pinned model provisioner
        if: steps.models.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          ref: b22454827f8190655d7070b80eb20c2550beadfa
          path: benchmark-bootstrap
          sparse-checkout: scripts/provision_real_e2e_models.py
          sparse-checkout-cone-mode: false

      - name: Provision source text segmenter
        if: steps.models.outputs.cache-hit != 'true'
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple torch==2.5.1+cpu torchvision==0.20.1+cpu
          python -m pip install --no-deps ultralytics==8.3.221 onnxslim==0.1.71
          python -m pip install sympy==1.13.1 PyYAML==6.0.2 scipy==1.14.1 tqdm==4.67.1 matplotlib==3.9.2 pandas==2.2.3 py-cpuinfo==9.0.0 ml_dtypes==0.5.3 colorama==0.4.6 polars==1.33.1 ultralytics-thop==2.0.17
          python benchmark-bootstrap/scripts/provision_real_e2e_models.py
          cp benchmark-bootstrap/models/text_segmenter.onnx models/

      - name: Build 640 specialized segmenter
        run: |
          python scripts/specialize_text_segmenter.py \
            --source models/text_segmenter.onnx \
            --output models/text_segmenter_640.onnx \
            --size 640

      - name: Verify 640 contract and execution
        run: |
          python - <<'PY'
          import json, time
          import numpy as np
          import onnxruntime as ort

          providers = ["CPUExecutionProvider"]
          if "OpenVINOExecutionProvider" in ort.get_available_providers():
              providers = [
                  ("OpenVINOExecutionProvider", {
                      "device_type": "CPU",
                      "precision": "FP32",
                      "num_of_threads": "2",
                      "num_streams": "1",
                  }),
                  "CPUExecutionProvider",
              ]
          session = ort.InferenceSession("models/text_segmenter_640.onnx", providers=providers)
          inp = session.get_inputs()[0]
          assert list(inp.shape) == [1, 3, 640, 640], inp.shape
          declared = [list(x.shape) for x in session.get_outputs()]
          assert declared == [[1, 37, 8400], [1, 32, 160, 160]], declared
          x = np.zeros((1, 3, 640, 640), np.float32)
          started = time.perf_counter()
          out = session.run(None, {inp.name: x})
          elapsed_ms = (time.perf_counter() - started) * 1000
          actual = [list(np.asarray(v).shape) for v in out]
          assert actual == [[1, 37, 8400], [1, 32, 160, 160]], actual
          print(json.dumps({
              "providers": session.get_providers(),
              "input": list(inp.shape),
              "outputs": actual,
              "first_run_ms": round(elapsed_ms, 3),
          }))
          PY
