name: Apply backend Phase 8 recovery cache

on:
  push:
    branches: [main]
    paths:
      - scripts/apply_phase8_patch.py
      - scripts/backend_phase8_sanity.py
      - .github/workflows/phase8-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply Phase 8 recovery cache patch
        run: python scripts/apply_phase8_patch.py
      - name: Compile Phase 8 source
        run: >-
          python -m py_compile app/detector/recovery.py scripts/backend_phase8_sanity.py
      - name: Install deterministic test runtime
        run: >-
          python -m pip install numpy==1.26.4 opencv-contrib-python==4.10.0.84
          fastapi==0.115.0 pydantic==2.9.2 filelock==3.16.1 loguru==0.7.2 Pillow==10.4.0
      - name: Run Phase 8 equivalence ownership and performance fixture
        run: python scripts/backend_phase8_sanity.py
      - name: Run existing backend regressions
        run: |
          python scripts/release_sanity.py
          python scripts/inpaint_authority_sanity.py
          python scripts/backend_phase4_sanity.py
          python scripts/backend_phase5_sanity.py --correctness-only
          python scripts/backend_phase6_sanity.py
          python scripts/backend_phase7_sanity.py
          python scripts/research_mask_quality_sanity.py
      - name: Commit Phase 8 production code
        shell: bash
        run: |
          git config user.name "Manga backend CI"
          git config user.email "actions@users.noreply.github.com"
          git add app/detector/recovery.py scripts/backend_phase8_sanity.py
          git diff --cached --quiet && exit 0
          git commit -m "perf(detector): cache MSER base candidates"
          git push origin HEAD:main
