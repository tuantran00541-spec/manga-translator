name: Chapter 241 Checkpoint 02 Clean Review

on:
  push:
    branches:
      - 'chapter/doctors-rebirth\+241'
    paths:
      - '.github/workflows/chapter-241-clean-review.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: chapter-241-human-loop
  cancel-in-progress: false

jobs:
  detect-mask-inpaint:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: '1'
      MANGA_USE_DYNAMIC_LAMA: '1'
      MANGA_ORT_PROVIDER: openvino
      MANGA_ORT_REQUIRE_PROVIDER: '1'
      MANGA_ORT_OPENVINO_SCOPE: detectors
      MANGA_ORT_OPENVINO_THREADS: '2'
      MANGA_ORT_OPENVINO_STREAMS: '1'
      MANGA_ORT_OPENVINO_CACHE_DIR: /tmp/manga-openvino-cache
      OPENBLAS_NUM_THREADS: '1'
      CHAPTER_ID: c241dr01
      CHAPTER_URL: https://asurascans.com/comics/doctors-rebirth-53fc8424/chapter/241
      IMPORT_RUN_ID: '34732495460'
      IMPORT_ARTIFACT: 01-import-c241dr01
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'chapter/doctors-rebirth+241'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install production clean runtime
        run: |
          python -m pip install numpy==1.26.4 Pillow==10.4.0 opencv-contrib-python==4.10.0.84 onnxruntime-openvino==1.24.1 psutil==6.1.1 loguru==0.7.2 requests==2.32.3 beautifulsoup4==4.12.3 lxml==5.3.0 playwright==1.47.0 fastapi==0.115.0 'uvicorn[standard]==0.30.6' pydantic==2.9.2 filelock==3.16.1 python-multipart==0.0.12
      - name: Restore detector and inpaint models
        id: models
        uses: actions/cache@v4
        with:
          path: |
            models/*.onnx
            models/.e2e-provenance.json
          key: processing-profile-models-b224548-v1
      - name: Read pinned model provisioner
        if: steps.models.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          ref: b22454827f8190655d7070b80eb20c2550beadfa
          path: benchmark-bootstrap
          sparse-checkout: scripts/provision_real_e2e_models.py
          sparse-checkout-cone-mode: false
      - name: Provision production-equivalent models
        if: steps.models.outputs.cache-hit != 'true'
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple torch==2.5.1+cpu torchvision==0.20.1+cpu
          python -m pip install --no-deps ultralytics==8.3.221 onnx==1.17.0 onnxslim==0.1.71
          python -m pip install sympy==1.13.1 PyYAML==6.0.2 scipy==1.14.1 tqdm==4.67.1 matplotlib==3.9.2 pandas==2.2.3 py-cpuinfo==9.0.0 ml_dtypes==0.5.3 colorama==0.4.6 polars==1.33.1 ultralytics-thop==2.0.17
          python benchmark-bootstrap/scripts/provision_real_e2e_models.py
          cp benchmark-bootstrap/models/*.onnx models/
          cp benchmark-bootstrap/models/.e2e-provenance.json models/
      - name: Restore approved import artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p checkpoint/01-import checkpoint/02-clean-review
          gh run download "$IMPORT_RUN_ID" -n "$IMPORT_ARTIFACT" -D checkpoint/01-import
          test -f checkpoint/01-import/manifest.json
          test -d checkpoint/01-import/raw/sliced
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('chapters/doctors-rebirth-241/import-review.json').read_text(encoding='utf-8'))
          if r.get('status')!='PASS' or r.get('reconstruction',{}).get('pixel_exact_pages')!=17:
              raise SystemExit(f'import review not approved: {r}')
          PY
      - name: Restore production data layout
        run: |
          python - <<'PY'
          import json, shutil
          from pathlib import Path
          cid='c241dr01'; src=Path('checkpoint/01-import'); raw=Path('data/raw')/cid; proc=Path('data/processed')/cid
          raw.parent.mkdir(parents=True,exist_ok=True); proc.mkdir(parents=True,exist_ok=True)
          if raw.exists(): shutil.rmtree(raw)
          shutil.copytree(src/'raw',raw)
          m=json.loads((src/'manifest.json').read_text(encoding='utf-8'))
          if m.get('chapter_id')!=cid: raise RuntimeError('chapter id mismatch')
          for page in m['pages']:
              old=str(page['original']); prefix='checkpoint/01-import/raw/'
              if not old.startswith(prefix): raise RuntimeError(f'unexpected path {old}')
              page['original']=(raw/old[len(prefix):]).as_posix()
          (proc/'manifest.json').write_text(json.dumps(m,ensure_ascii=False,indent=2),encoding='utf-8')
          print('restored',len(m['pages']),'slices')
          PY
      - name: Run production detector mask and inpaint
        run: |
          python - <<'PY'
          import json, time
          from pathlib import Path
          from app.manifest_utils import load_manifest_raw
          from app.optimized_pipeline import OptimizedChapterPipeline
          cid='c241dr01'; pipe=OptimizedChapterPipeline(); m=load_manifest_raw(cid)
          indices=[i for i,p in enumerate(m['pages']) if not p.get('skipped')]
          batches=[]
          for start in range(0,len(indices),16):
              batch=indices[start:start+16]; t=time.perf_counter(); pipe.process_pages(cid,batch,workers=2); elapsed=time.perf_counter()-t
              batches.append({'indices':batch,'elapsed_s':round(elapsed,3)}); print('processed',start+len(batch),'/',len(indices),round(elapsed,1),'s')
          m=load_manifest_raw(cid); rows=[]
          for i,p in enumerate(m['pages']):
              boxes=p.get('boxes') or p.get('detections') or []
              rows.append({'page_index':i,'source_page':p.get('source_page'),'slice_index':p.get('slice_index'),'original':p.get('original'),'clean':p.get('clean'),'box_count':len(boxes),'needs_review':bool(p.get('needs_review')),'detection_state':p.get('detection_state'),'detection_issues':p.get('detection_issues') or []})
          out=Path('checkpoint/02-clean-review'); out.mkdir(parents=True,exist_ok=True)
          summary={'checkpoint':'02-clean-review','chapter_id':cid,'slices':len(rows),'processed':len(indices),'total_boxes':sum(r['box_count'] for r in rows),'needs_review_pages':[r['page_index'] for r in rows if r['needs_review']],'batches':batches,'next_action':'STOP_FOR_HUMAN_RAW_VS_CLEAN_REVIEW'}
          (out/'clean-review-summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'review-index.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY
      - name: Pack clean review checkpoint
        run: |
          cp -a data/processed/c241dr01 checkpoint/02-clean-review/processed
      - name: Upload clean review artifact
        uses: actions/upload-artifact@v4
        with:
          name: 02-clean-review-c241dr01
          path: checkpoint/02-clean-review
          if-no-files-found: error
          retention-days: 7
