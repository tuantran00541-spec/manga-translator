name: Sovinfra probe

# One-off: does sovinfra qwen3.8-27b read images, and how many tokens does a comic slice cost.
on:
  push:
    branches: [claude/friendly-hypatia-xi865r]
    paths: [.github/workflows/sovinfra-probe.yml]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Probe
        env:
          KEY: ${{ secrets.SOVINFRA_LAB_1B_TOKEN }}
        run: |
          python -m pip install -q requests==2.32.3 opencv-python-headless==4.10.0.84 numpy==1.26.4
          git fetch -q origin audit-evidence
          git show origin/audit-evidence:audit-results/ai-cost/pages/003.jpg > /tmp/page.jpg
          mkdir -p audit-results/sovinfra-probe
          python - <<'PY'
          import base64, json, os, time, cv2, numpy as np, requests
          base, key = "https://api.sovinfra.ai/v1", os.environ["KEY"]
          head = {"Authorization": "Bearer " + key}
          out = {}
          r = requests.get(base + "/models", headers=head, timeout=30)
          out["models"] = {"status": r.status_code, "body": r.json() if r.ok else r.text[:500]}

          def b64(image):
              return base64.b64encode(cv2.imencode(".jpg", image, [cv2.IMWRITE_JPEG_QUALITY, 92])[1].tobytes()).decode()

          hello = np.full((96, 160, 3), 255, np.uint8)
          cv2.putText(hello, "HELLO", (12, 62), cv2.FONT_HERSHEY_SIMPLEX, 1.3, (0, 0, 0), 3)
          page = cv2.imread("/tmp/page.jpg")[:1600]
          tests = [
              ("hello", hello, "What word is written in this image? Answer with the word only."),
              ("page", page, "Transcribe every line of English text in this comic image, top to bottom, one line each. Text only."),
              ("page-again", page, "List the speech bubbles in this comic image and who seems to speak in each. Be brief."),
              ("translate", page, "Translate every line of text in this comic image into natural Vietnamese, one line each."),
          ]
          out["tests"] = []
          for name, image, question in tests:
              for model in ("qwen3.8-27b",):
                  body = {"model": model, "max_tokens": 1500, "messages": [{"role": "user", "content": [
                      {"type": "image_url", "image_url": {"url": "data:image/jpeg;base64," + b64(image)}},
                      {"type": "text", "text": question}]}]}
                  started = time.time()
                  r = requests.post(base + "/chat/completions", headers=head, json=body, timeout=(10, 180))
                  row = {"test": name, "model": model, "image": list(image.shape[:2]), "status": r.status_code,
                         "s": round(time.time() - started, 1)}
                  if r.ok:
                      data = r.json()
                      row["reply"] = ((data.get("choices") or [{}])[0].get("message") or {}).get("content")
                      row["usage"] = data.get("usage")
                  else:
                      row["error"] = r.text[:500]
                  print(json.dumps(row, ensure_ascii=False)[:1500])
                  out["tests"].append(row)
          json.dump(out, open("audit-results/sovinfra-probe/probe.json", "w"), ensure_ascii=False, indent=1)
          PY

      - name: Save evidence to audit-evidence
        if: always()
        uses: ./.github/actions/save-evidence
        with:
          paths: audit-results/sovinfra-probe
          message: "audit: sovinfra probe (run ${{ github.run_id }})"
