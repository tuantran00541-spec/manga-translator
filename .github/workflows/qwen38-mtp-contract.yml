name: Qwen3.8 pinned MTP contract

on:
  push:
    branches: [research/qwen3.8-27b-runtime-finish]
    paths:
      - "research/qwen38/qwen38_mtp_contract.py"
      - ".github/workflows/qwen38-mtp-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  HF_HUB_DISABLE_TELEMETRY: "1"

jobs:
  mtp-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Static MTP contract sanity
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=research/qwen38 python -u research/qwen38/qwen38_mtp_contract.py sanity

      - name: Reclaim disk
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true
          docker system prune -af || true
          df -h

      - name: Install download dependency
        run: python -m pip install --no-cache-dir huggingface_hub hf_xet

      - name: Download pinned real GGUF
        shell: bash
        run: |
          set -euo pipefail
          MODEL=$(python - <<'PY'
          from huggingface_hub import hf_hub_download
          print(hf_hub_download(
              "bartowski/Qwen3.8-27B-GGUF",
              filename="Qwen3.8-27B-Q6_K_L.gguf",
              local_dir="${{ runner.temp }}/qwen38-model",
          ))
          PY
          )
          test -f "$MODEL"
          echo "MODEL=$MODEL" >> "$GITHUB_ENV"
          echo "EVIDENCE=$RUNNER_TEMP/qwen38-mtp-evidence" >> "$GITHUB_ENV"

      - name: Validate and measure real MTP block
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          PYTHONPATH=research/qwen38 python -u research/qwen38/qwen38_mtp_contract.py real \
            --model "$MODEL" --output "$EVIDENCE/mtp-contract.json" \
            2>&1 | tee "$EVIDENCE/mtp-contract.log"
          echo "QWEN38_MTP_REAL_CONTRACT_PASS"

      - name: Upload compact MTP evidence
        uses: actions/upload-artifact@v4
        with:
          name: qwen38-mtp-contract-${{ github.run_id }}
          path: ${{ runner.temp }}/qwen38-mtp-evidence/
          retention-days: 14
