name: phase43-security

on:
  push:
    branches:
      - phase-4-3-visual-qc-core
  pull_request:
    paths:
      - "app/security.py"
      - "app/upload_utils.py"
      - "app/downloader/**"
      - "app/routers/chapters.py"
      - "app/routers/image.py"
      - "app/routers/visual_qc.py"
      - "app/visual_qc/**"
      - "tests/test_visual_qc.py"
      - "tests/test_phase43_*.py"
      - "tests/test_security_regressions_phase43.py"
  workflow_dispatch:

jobs:
  focused-security-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            pytest==8.3.5 \
            fastapi==0.115.0 \
            pydantic==2.9.2 \
            requests==2.32.3 \
            Pillow==10.4.0 \
            numpy==1.26.4 \
            opencv-python-headless==4.10.0.84 \
            filelock==3.16.1 \
            loguru==0.7.2
      - name: Prepare runtime directories
        run: mkdir -p logs data/raw data/processed data/output models
      - name: Run Phase 4.3 security and QC unit tests
        run: |
          python -m pytest -q \
            tests/test_visual_qc.py \
            tests/test_phase43_*.py \
            tests/test_security_regressions_phase43.py
      - name: Diagnose Sonar PR security findings
        if: always()
        env:
          SONAR_PROJECT: tuantran00541-spec_manga-translator
          SONAR_PR: "7"
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          query = urllib.parse.urlencode({
              "componentKeys": os.environ["SONAR_PROJECT"],
              "pullRequest": os.environ["SONAR_PR"],
              "resolved": "false",
              "ps": "100",
          })
          url = "https://sonarcloud.io/api/issues/search?" + query
          with urllib.request.urlopen(url, timeout=20) as response:
              payload = json.load(response)
          findings = []
          for issue in payload.get("issues", []):
              impacts = issue.get("impacts") or []
              if issue.get("type") != "VULNERABILITY" and not any(
                  impact.get("softwareQuality") == "SECURITY" for impact in impacts
              ):
                  continue
              findings.append({
                  "key": issue.get("key"),
                  "rule": issue.get("rule"),
                  "severity": issue.get("severity"),
                  "type": issue.get("type"),
                  "component": issue.get("component"),
                  "line": issue.get("line"),
                  "message": issue.get("message"),
                  "impacts": impacts,
                  "flows": issue.get("flows"),
              })
          print("SONAR_SECURITY_FINDINGS=" + json.dumps(findings, separators=(",", ":")))
          PY
