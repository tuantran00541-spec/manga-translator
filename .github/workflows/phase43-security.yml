name: phase43-security

on:
  push:
    branches:
      - phase-4-3-visual-qc-core
  pull_request:
    paths:
      - "app/security.py"
      - "app/downloader/**"
      - "app/routers/image.py"
      - "app/routers/visual_qc.py"
      - "app/visual_qc/**"
      - "tests/test_visual_qc.py"
      - "tests/test_phase43_*.py"
      - "tests/test_security_regressions_phase43.py"
  workflow_dispatch:

jobs:
  focused-security-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            pytest==8.3.5 \
            fastapi==0.115.0 \
            pydantic==2.9.2 \
            requests==2.32.3 \
            Pillow==10.4.0 \
            numpy==1.26.4 \
            opencv-python-headless==4.10.0.84 \
            filelock==3.16.1 \
            loguru==0.7.2
      - name: Prepare runtime directories
        run: mkdir -p logs data/raw data/processed data/output models
      - name: Run Phase 4.3 security and QC unit tests
        run: |
          python -m pytest -q \
            tests/test_visual_qc.py \
            tests/test_phase43_visual_qc_core.py \
            tests/test_phase43_visual_qc_jobs.py \
            tests/test_phase43_visual_qc_planner.py \
            tests/test_phase43_security_resource_guards.py \
            tests/test_phase43_qc_cache_security.py \
            tests/test_security_regressions_phase43.py
