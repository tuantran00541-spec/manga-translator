name: One-shot pipeline consolidation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply validated pipeline consolidation
        shell: bash
        run: |
          set -euo pipefail

          test "$(git hash-object app/pipeline.py)" = "d8486646b16fc2396b608f0e043d24e14cdf1814"
          test "$(git hash-object app/pipeline_artwork_safe.py)" = "6b41c5e39c87271c1013e7b738d3573dced58963"
          test "$(git hash-object app/dependencies.py)" = "40644c6a51f97eba10cfb42b6c48cc92178c67c0"

          cat > /tmp/pipeline-consolidation.patch.gz.b64 <<'EOF'
          
          EOF
          tr -d '[:space:]' < /tmp/pipeline-consolidation.patch.gz.b64 | base64 -d | gzip -d > /tmp/pipeline-consolidation.patch
          git apply --check /tmp/pipeline-consolidation.patch
          git apply /tmp/pipeline-consolidation.patch

          cat > app/pipeline_artwork_safe.py <<'EOF'
          from app.pipeline import ChapterPipeline


          class ArtworkSafeChapterPipeline(ChapterPipeline):
              """Backward-compatible name for the canonical artwork-safe pipeline."""

              pass
          EOF

          cat > app/dependencies.py <<'EOF'
          from app.pipeline import ChapterPipeline

          from app.ocr.multi_lang_ocr import MultiLangOCR

          pipeline = ChapterPipeline()
          ocr = MultiLangOCR()
          EOF

          python -m compileall -q app run.py
          python - <<'PY'
          import ast
          from pathlib import Path

          pipeline_src = Path("app/pipeline.py").read_text(encoding="utf-8")
          module = ast.parse(pipeline_src)
          chapter = next(
              node for node in module.body
              if isinstance(node, ast.ClassDef) and node.name == "ChapterPipeline"
          )
          method_names = [
              node.name for node in chapter.body
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
          ]
          for name in ("process_pages", "_do_reinpaint", "update_box", "_apply_box_geometry"):
              assert method_names.count(name) == 1, (name, method_names.count(name))
          assert "seam_boxes = self.detector.detect(seam_image, parallel=True)" in pipeline_src

          compat = ast.parse(Path("app/pipeline_artwork_safe.py").read_text(encoding="utf-8"))
          compat_cls = next(node for node in compat.body if isinstance(node, ast.ClassDef))
          assert not any(isinstance(node, ast.FunctionDef) for node in compat_cls.body)

          deps = Path("app/dependencies.py").read_text(encoding="utf-8")
          assert "from app.pipeline import ChapterPipeline" in deps
          assert "pipeline = ChapterPipeline()" in deps
          PY
          git diff --check

          test "$(git hash-object app/pipeline.py)" = "e716cc6933ec0cb4abdb6508c6eef556f7bfc4ec"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/pipeline.py app/pipeline_artwork_safe.py app/dependencies.py
          git rm .github/workflows/pipeline-consolidate-once.yml
          git commit -m 'refactor(pipeline): consolidate artwork-safe runtime'
          git push origin HEAD:main
