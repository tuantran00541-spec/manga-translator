name: Agent smoke

# One-off: the harness v3 features on a real model (PolarGrid qwen-3.8-27b), sandboxed.
on:
  push:
    branches-ignore: [main]
    paths:
      - ".github/workflows/agent-smoke.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    env:
      OUT: audit-results/agent-smoke-v3
      PYTHONPATH: "."
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -q -r requirements-test.txt

      - name: Six scenarios on the real model
        env:
          POLARGRID_KEY: ${{ secrets.polagrid_ }}
        run: |
          mkdir -p "$OUT"
          python - <<'PY'
          import json, os, subprocess, sys, tempfile, threading, time
          from pathlib import Path
          from app.agent import sandbox
          from app.agent.session import AgentSessionManager
          from app.agent.tools import Workspace
          from app.ai_providers import resolve_provider

          out = Path(os.environ["OUT"])
          provider = resolve_provider("polargrid", label="polargrid", protocol="openai", api_base="https://api.mia-01.edge.polargrid.ai/v1")
          MODEL = "qwen-3.8-27b"
          SHOP = ("def total(prices, discount=0.0):\n"
                  "    \"\"\"Sum of prices after a fractional discount, rounded to cents.\"\"\"\n"
                  "    subtotal = sum(prices)\n"
                  "    return round(subtotal * discount, 2)\n")
          TESTS = ("from shop import total\n\n"
                   "def test_no_discount():\n    assert total([1.5, 2.5]) == 4.0\n\n"
                   "def test_discount():\n    assert total([10, 10], 0.25) == 15.0\n")

          def project():
              root = Path(tempfile.mkdtemp())
              (root / "shop.py").write_text(SHOP, encoding="utf-8")
              (root / "test_shop.py").write_text(TESTS, encoding="utf-8")
              (root / "AGENTS.md").write_text("Run tests with `python -m pytest -q -p no:cacheprovider`.\n", encoding="utf-8")
              return root

          def pytest(root):
              r = subprocess.run([sys.executable, "-m", "pytest", "-q", "-p", "no:cacheprovider"], cwd=root, capture_output=True, text=True)
              return r.returncode == 0

          def start(root, home, mode="edits"):
              agents = AgentSessionManager(Path(tempfile.mkdtemp()), home=home)
              session = agents.create(provider, os.environ["POLARGRID_KEY"], MODEL, Workspace(root, sandbox.Policy("workspace-write", False)), mode)
              session.answered = []
              stop = threading.Event()

              def helper():
                  while not stop.is_set():
                      if session.status == "waiting" and session.pending:
                          name = session.pending["name"]
                          session.answered.append(name)
                          if name == "ask_user":
                              session.decide("allow", "after")
                          elif name == "exit_plan_mode":
                              session.decide("allow")
                          else:
                              session.decide("deny", "no approvals in this test")
                      time.sleep(0.4)

              threading.Thread(target=helper, daemon=True).start()
              session._stopper = stop
              return session

          def wait(session, limit=360):
              end = time.time() + limit
              time.sleep(1)
              while session.status != "idle" and time.time() < end:
                  time.sleep(1)
              if session.status != "idle":
                  session.stop()
                  time.sleep(3)

          def used(session):
              return [e["name"] for e in session.events if e["type"] == "tool"]

          def row(name, session, started, **checks):
              final = next((e["text"] for e in reversed(session.events) if e["type"] == "assistant" and e["text"]), "")
              data = {"scenario": name, "ok": all(checks.values()), "checks": checks, "seconds": round(time.time() - started, 1),
                      "steps": sum(1 for e in session.events if e["type"] == "assistant"), "usage": session.usage, "tools": used(session),
                      "errors": [e["text"] for e in session.events if e["type"] == "error"], "final": final[:600]}
              (out / f"{name}-events.json").write_text(json.dumps(session.events, ensure_ascii=False, indent=1), encoding="utf-8")
              print(json.dumps({k: v for k, v in data.items() if k != "final"}, ensure_ascii=False), flush=True)
              session._stopper.set()
              return data

          report = []
          home = Path(tempfile.mkdtemp())

          # 1. Anchored edit.
          root = project(); s = start(root, home); t = time.time()
          s.send("The tests fail. Read shop.py with read_file anchors=true, fix the bug using edit_lines (not apply_patch or edit_file), then run the tests.")
          wait(s)
          report.append(row("anchored-edit", s, t, tests_pass=pytest(root), used_edit_lines="edit_lines" in used(s),
                            edit_lines_ok=any(e["type"] == "tool" and e["name"] == "edit_lines" and e["ok"] for e in s.events)))

          # 2. Helpers at the same time: spawn_agent twice, then wait_agent.
          root = project(); s = start(root, home, "auto"); t = time.time()
          s.send("Run two helpers at the same time: call spawn_agent once for an explore helper that says what test_shop.py checks and once for an explore helper that says what shop.py does (never the same job twice), then wait_agent for both. Then answer in two sentences.")
          wait(s)
          tools = used(s)
          report.append(row("spawned-helpers", s, t, spawned_two=tools.count("spawn_agent") >= 2, waited="wait_agent" in tools or any(m["role"] == "user" and m["content"].startswith("<subagent_notification>") for m in s.history),
                            both_reports=sum(1 for m in s.history if "report" in m.get("content", "").lower() or "shop.py" in m.get("content", "")) >= 2,
                            no_duplicate_error=not any(e["type"] == "tool" and "already has this exact job" in e["output"] for e in s.events)))

          # 3. Plan, question, implement.
          root = project(); s = start(root, home); t = time.time()
          s.command("/plan")
          s.send("Plan adding an optional `tax` rate parameter to total(). Ask me with ask_user whether tax applies before or after the discount (options before, after). Present the plan with exit_plan_mode; after approval implement it and run the tests.")
          wait(s, 420)
          tools = used(s)
          report.append(row("plan-and-ask", s, t, asked_user="ask_user" in s.answered, plan_presented="exit_plan_mode" in s.answered,
                            plan_mode_off=not s.plan_mode, edited_after_plan=("shop.py" in (root / "shop.py").read_text() or True) and "tax" in (root / "shop.py").read_text(),
                            tests_still_pass=pytest(root)))

          # 4. Goal.
          root = project(); s = start(root, home, "auto"); t = time.time()
          s.command("/goal Fix the failing test in this project, add one more passing test to test_shop.py, and finish only when pytest passes.")
          wait(s, 480)
          report.append(row("goal", s, t, tests_pass=pytest(root), goal_done_called="goal_done" in used(s), goal_cleared=s.goal is None,
                            three_tests=(root / "test_shop.py").read_text().count("def test_") >= 3))

          # 5. Reference, memory, undo.
          root = project(); s = start(root, home, "auto"); t = time.time()
          s.send("Look at @shop.py and save a project memory note that this shop rounds to cents.")
          wait(s)
          from app.agent import memory
          notes = memory.entries(home, root, "project")
          s.send("Add the comment line `# touched` at the top of shop.py.")
          wait(s)
          touched = (root / "shop.py").read_text().startswith("# touched")
          s.command("/undo")
          report.append(row("ref-memory-undo", s, t, memory_note_saved=any("cent" in n.lower() for n in notes), reference_attached="<attached path=\"shop.py\">" in s.history[0]["content"],
                            edit_made=touched, undo_restored=(root / "shop.py").read_text() == SHOP))

          # 6. Rules.
          root = project(); h2 = Path(tempfile.mkdtemp()); (h2 / ".manga-agent").mkdir()
          (h2 / ".manga-agent" / "settings.json").write_text(json.dumps({"permission": {"edit": {"secret/*": "deny"}}}), encoding="utf-8")
          s = start(root, h2, "auto"); t = time.time()
          s.send("Create the file secret/key.txt with the text hello, then tell me whether it worked.")
          wait(s)
          denied = any(e["type"] == "tool" and "Denied by a permission rule" in e["output"] for e in s.events)
          report.append(row("rules-deny", s, t, file_not_created=not (root / "secret" / "key.txt").exists(), model_saw_denial=denied))

          (out / "report.json").write_text(json.dumps(report, ensure_ascii=False, indent=1), encoding="utf-8")
          print("PASSED", sum(r["ok"] for r in report), "of", len(report))
          PY

      - name: Save evidence to audit-evidence
        if: always()
        uses: ./.github/actions/save-evidence
        with:
          paths: audit-results/agent-smoke-v3
          message: "audit: Agent smoke v3 on PolarGrid (run ${{ github.run_id }})"
