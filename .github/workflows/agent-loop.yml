name: Agent loop on a trending repo

# One-off: minirouter gpt-6-luna finds a trending GitHub project on the web, clones it, fixes something small and runs its tests, with screenshots of the Agent screen.
on:
  push:
    branches-ignore: [main]
    paths:
      - ".github/workflows/agent-loop.yml"
      - ".github/agent-loop/drive.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  loop:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    env:
      OUT: audit-results/agent-loop
      WORK: /tmp/agent-loop
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -q -r requirements-test.txt playwright pyyaml
          python -m playwright install --with-deps chromium > /dev/null
      - name: Pick the model id
        env:
          KEY: ${{ secrets.MINIROUTER_API_KEY }}
        run: |
          [ -n "$KEY" ] || { echo "::error::secret MINIROUTER_API_KEY is not set"; exit 1; }
          mkdir -p "$OUT"
          curl -sS -m 30 -H "Authorization: Bearer $KEY" https://api.minirouter.sh/v1/models > /tmp/models.json || true
          python - <<'PY'
          import json, os
          ids = [r["id"] for r in json.load(open("/tmp/models.json")).get("data", []) if isinstance(r, dict) and "id" in r]
          hits = sorted((i for i in ids if "gpt-6-luna" in i.lower()), key=lambda i: (not i.startswith("openai/"), len(i)))
          print("matching:", hits[:6])
          if not hits:
              raise SystemExit("no gpt-6-luna model listed")
          open(os.environ["GITHUB_ENV"], "a").write(f"AGENT_MODEL={hits[0]}\n")
          PY
      - name: Run the agent through its screen
        env:
          AGENT_API_KEY: ${{ secrets.MINIROUTER_API_KEY }}
          AGENT_BASE: https://api.minirouter.sh/v1
          AGENT_LABEL: minirouter
          TINYFISH_API_KEY: ${{ secrets.TINYFISH }}
          TAVILY_API_KEY: ${{ secrets.TAVILY }}
        run: |
          python .github/agent-loop/drive.py "$OUT" "$WORK" 320 2>&1 | tail -c 4000 || true
      - name: Keep the diff the agent made
        if: always()
        run: |
          for d in "$WORK"/project/*/; do
            [ -d "$d/.git" ] || continue
            name=$(basename "$d")
            git -C "$d" status --short > "$OUT/$name-status.txt" 2>&1 || true
            git -C "$d" diff > "$OUT/$name.diff" 2>&1 || true
          done
          ls -la "$OUT" | head -80
      - name: Give git access only now that the agent is done
        if: always()
        env:
          TOKEN: ${{ github.token }}
        run: |
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
      - uses: ./.github/actions/save-evidence
        if: always()
        with:
          paths: audit-results/agent-loop
          message: "audit: Agent loop on a trending repo (run ${{ github.run_id }})"
