name: Live UI smoke

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "scripts/create_ui_smoke_fixture.py"
      - "scripts/live_ui_smoke.py"
      - ".github/workflows/live-ui-smoke.yml"
  workflow_dispatch:

concurrency:
  group: live-ui-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-browser:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install server and browser dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Seed a model-free browser chapter
        run: python scripts/create_ui_smoke_fixture.py

      - name: Start the real application server
        run: |
          python run.py > server.log 2>&1 &
          echo $! > server.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/docs > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat server.log
          exit 1

      - name: Exercise desktop and mobile application flows
        run: python scripts/live_ui_smoke.py --artifacts artifacts/ui-smoke

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-ui-smoke-${{ github.run_id }}
          path: |
            artifacts/ui-smoke
            server.log
          if-no-files-found: warn

      - name: Stop application server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill "$(cat server.pid)" || true
          fi
