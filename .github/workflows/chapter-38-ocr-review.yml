name: Chapter 38 OCR review checkpoint

on:
  push:
    branches: [trial/chapter-render-38]
    paths:
      - .github/workflows/chapter-38-ocr-review.yml
  workflow_dispatch:
    inputs:
      clean_run_id:
        description: "Workflow run id that produced chapter38-clean-review artifact"
        required: false
        default: "34248306368"

permissions:
  contents: read
  actions: read

concurrency:
  group: chapter-38-ocr-review
  cancel-in-progress: false

jobs:
  ocr-review:
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    env:
      PYTHONUNBUFFERED: "1"
      CHAPTER_ID: c0380038
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install production OCR runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple torch==2.5.1+cpu torchvision==0.20.1+cpu
          python -m pip install -r requirements.txt

      - name: Download clean-review artifact
        uses: actions/download-artifact@v4
        with:
          name: chapter38-clean-review
          run-id: ${{ inputs.clean_run_id || '34248306368' }}
          github-token: ${{ github.token }}
          path: imported-clean-review

      - name: Restore chapter state from clean-review artifact
        run: |
          python - <<'PY'
          import shutil, zipfile
          from pathlib import Path

          outer = Path('imported-clean-review/chapter38-clean-review.zip')
          if not outer.exists():
              raise SystemExit(f'missing artifact zip: {outer}')
          with zipfile.ZipFile(outer) as z:
              z.extractall('imported-clean-review/unpacked')
          root = Path('imported-clean-review/unpacked/chapter38-clean-review')
          for sub in ('raw', 'processed', 'output'):
              src = root / sub
              if not src.exists():
                  continue
              dst = Path('data') / sub / 'c0380038'
              dst.parent.mkdir(parents=True, exist_ok=True)
              if dst.exists():
                  shutil.rmtree(dst)
              shutil.copytree(src, dst)
          print('restored chapter to data/raw|processed|output/c0380038')
          PY

      - name: Create text objects and OCR checkpoint
        run: |
          python - <<'PY'
          from __future__ import annotations
          import json
          from pathlib import Path
          from app.manifest_utils import load_manifest_raw, save_manifest_raw
          from app.optimized_pipeline import OptimizedChapterPipeline
          from app.text_objects import ensure_page_text_objects
          from app.ocr.service import OCRService
          from app.dependencies import ocr

          chapter_id = 'c0380038'
          pipeline = OptimizedChapterPipeline()
          manifest = load_manifest_raw(chapter_id)
          created = 0
          for page in manifest.get('pages', []):
              if page.get('skipped'):
                  continue
              n, _changed = ensure_page_text_objects(page)
              created += int(n)
          save_manifest_raw(chapter_id, manifest)

          service = OCRService(ocr, pipeline)
          manifest = load_manifest_raw(chapter_id)
          ok = failed = 0
          rows = []
          for pi, page in enumerate(manifest.get('pages', [])):
              if page.get('skipped'):
                  continue
              for obj in list(page.get('text_objects') or []):
                  oid = obj.get('id')
                  if not oid:
                      continue
                  try:
                      service.group_text_object(chapter_id, pi, oid, 'en')
                      ok += 1
                  except Exception as exc:
                      failed += 1
                      print(f'OCR_FAIL page={pi} object={oid}: {exc}')
          manifest = load_manifest_raw(chapter_id)
          for pi, page in enumerate(manifest.get('pages', [])):
              if page.get('skipped'):
                  continue
              for obj in page.get('text_objects') or []:
                  rows.append({
                      'page_index': pi,
                      'id': obj.get('id'),
                      'source_text': obj.get('source_text') or obj.get('ocr_text') or obj.get('text') or '',
                      'translation': obj.get('translation') or '',
                      'bbox': obj.get('bbox') or obj.get('rect'),
                      'lang': obj.get('source_lang') or obj.get('lang') or 'en',
                  })
          summary = {
              'checkpoint': 'ocr_review',
              'chapter_id': chapter_id,
              'slices': len(manifest.get('pages', [])),
              'text_objects': sum(len(p.get('text_objects') or []) for p in manifest.get('pages', [])),
              'created_text_objects': created,
              'ocr_ok': ok,
              'ocr_failed': failed,
              'next_action': 'human_review_ocr_then_translate',
          }
          Path('chapter38-ocr-summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2), encoding='utf-8')
          Path('chapter38-ocr-text.json').write_text(json.dumps(rows, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - name: Pack OCR-review handoff
        if: always()
        run: |
          mkdir -p chapter38-ocr-review
          cp chapter38-ocr-summary.json chapter38-ocr-review/ 2>/dev/null || true
          cp chapter38-ocr-text.json chapter38-ocr-review/ 2>/dev/null || true
          cp -a data/raw/c0380038 chapter38-ocr-review/raw || true
          cp -a data/processed/c0380038 chapter38-ocr-review/processed || true
          cp -a data/output/c0380038 chapter38-ocr-review/output || true
          zip -qr chapter38-ocr-review.zip chapter38-ocr-review

      - name: Upload OCR-review handoff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapter38-ocr-review
          path: chapter38-ocr-review.zip
          if-no-files-found: error
          retention-days: 7
