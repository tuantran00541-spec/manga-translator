name: README Chapter 241 Demo

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: readme-chapter-241-demo
  cancel-in-progress: true

jobs:
  demo:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: '.'
      CHAPTER_ID: c241dr01
      MANGA_USE_DYNAMIC_LAMA: '1'
      MANGA_ORT_PROVIDER: openvino
      MANGA_ORT_REQUIRE_PROVIDER: '1'
      MANGA_ORT_OPENVINO_SCOPE: detectors
      MANGA_ORT_OPENVINO_THREADS: '2'
      MANGA_ORT_OPENVINO_STREAMS: '1'
      MANGA_ORT_OPENVINO_CACHE_DIR: /tmp/manga-openvino-cache
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - name: Install runtime
        run: python -m pip install numpy==1.26.4 Pillow==10.4.0 opencv-contrib-python==4.10.0.84 onnxruntime-openvino==1.24.1 psutil==6.1.1 loguru==0.7.2 requests==2.32.3 beautifulsoup4==4.12.3 lxml==5.3.0 playwright==1.47.0 fastapi==0.115.0 'uvicorn[standard]==0.30.6' pydantic==2.9.2 python-multipart==0.0.12
      - name: Restore models
        id: models
        uses: actions/cache@v4
        with:
          path: models/*.onnx
          key: processing-profile-models-b224548-v1
      - name: Read pinned model provisioner
        if: steps.models.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          ref: b22454827f8190655d7070b80eb20c2550beadfa
          path: benchmark-bootstrap
          sparse-checkout: scripts/provision_real_e2e_models.py
          sparse-checkout-cone-mode: false
      - name: Provision models
        if: steps.models.outputs.cache-hit != 'true'
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple torch==2.5.1+cpu torchvision==0.20.1+cpu
          python -m pip install --no-deps ultralytics==8.3.221 onnx==1.17.0 onnxslim==0.1.71
          python -m pip install sympy==1.13.1 PyYAML==6.0.2 scipy==1.14.1 tqdm==4.67.1 matplotlib==3.9.2 pandas==2.2.3 py-cpuinfo==9.0.0 ml_dtypes==0.5.3 colorama==0.4.6 polars==1.33.1 ultralytics-thop==2.0.17
          python benchmark-bootstrap/scripts/provision_real_e2e_models.py
          cp benchmark-bootstrap/models/*.onnx models/
      - name: Import chapter and select visually rich slice
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import cv2, numpy as np
          from app.downloader.registry import download_chapter
          from app.downloader.slicer import slice_image
          root=Path('checkpoint/readme-demo'); raw=root/'raw'; sliced=raw/'sliced'; raw.mkdir(parents=True,exist_ok=True); sliced.mkdir(parents=True,exist_ok=True)
          url='https://asurascans.com/comics/doctors-rebirth-53fc8424/chapter/241'
          sources=download_chapter(url,raw)
          if len(sources)!=17: raise RuntimeError(f'expected 17 source images, got {len(sources)}')
          candidates=[]
          for si,src in enumerate(sources):
              for sj,item in enumerate(slice_image(src,sliced,f'{si:03d}',return_metadata=True)):
                  g=cv2.imread(str(item['path']),cv2.IMREAD_GRAYSCALE)
                  if g is None: continue
                  small=cv2.resize(g,(min(900,g.shape[1]),min(900,g.shape[0])),interpolation=cv2.INTER_AREA)
                  edge=float((cv2.Canny(small,80,180)>0).mean()); contrast=min(1.0,float(np.std(small))/64.0)
                  candidates.append((edge*.65+contrast*.35,si,sj,str(item['path'])))
          score,si,sj,path=max(candidates); chosen={'score':score,'source_page':si,'slice_index':sj,'path':path}
          (root/'chosen.json').write_text(json.dumps(chosen,ensure_ascii=False,indent=2),encoding='utf-8'); print(json.dumps(chosen,ensure_ascii=False))
          PY
      - name: Run production clean on chosen slice
        run: |
          python - <<'PY'
          import json, shutil, time
          from pathlib import Path
          from app.optimized_pipeline import OptimizedChapterPipeline
          from app.manifest_utils import load_manifest_raw
          chosen=json.loads(Path('checkpoint/readme-demo/chosen.json').read_text()); raw=Path('data/raw/c241dr01'); processed=Path('data/processed/c241dr01')
          if raw.exists(): shutil.rmtree(raw)
          if processed.exists(): shutil.rmtree(processed)
          (raw/'sliced').mkdir(parents=True); processed.mkdir(parents=True)
          target=Path(chosen['path']); dst=raw/'sliced'/target.name; shutil.copy2(target,dst)
          manifest={'chapter_id':'c241dr01','pages':[{'original':dst.as_posix(),'clean':None,'boxes':[],'skipped':False,'source_page':chosen['source_page'],'slice_index':chosen['slice_index'],'stitch_core':{}}],'workflow':{'stage':'clean','page_index':0}}
          (processed/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          t=time.perf_counter(); OptimizedChapterPipeline().process_pages('c241dr01',[0],workers=1); page=load_manifest_raw('c241dr01')['pages'][0]
          if not page.get('clean'): raise RuntimeError('clean output missing')
          Path('checkpoint/readme-demo/meta.json').write_text(json.dumps({'chosen':chosen,'clean':page['clean'],'boxes':len(page.get('boxes') or page.get('detections') or []),'elapsed_s':round(time.perf_counter()-t,3)},ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Build RAW detector CLEAN images
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image,ImageDraw
          meta=json.loads(Path('checkpoint/readme-demo/meta.json').read_text()); page=json.loads(Path('data/processed/c241dr01/manifest.json').read_text())['pages'][0]
          raw=Image.open(page['original']).convert('RGB'); clean=Image.open(page['clean']).convert('RGB'); detector=raw.copy(); d=ImageDraw.Draw(detector); n=0
          for b in page.get('boxes') or page.get('detections') or []:
              v=[b.get(k) for k in ('x1','y1','x2','y2')]
              if any(x is None for x in v): continue
              x1,y1,x2,y2=map(int,v)
              if x2>x1 and y2>y1: d.rectangle((x1,y1,x2,y2),outline='red',width=max(3,min(10,round(min(raw.size)/400)))); n+=1
          out=Path('trials/chapter-241/demo'); out.mkdir(parents=True,exist_ok=True)
          raw.save(out/'raw.jpg',quality=94,optimize=True); detector.save(out/'detector.jpg',quality=94,optimize=True); clean.save(out/'clean.jpg',quality=94,optimize=True)
          (out/'README.json').write_text(json.dumps({'chapter':'Doctors Rebirth 241','source_page':meta['chosen']['source_page'],'slice_index':meta['chosen']['slice_index'],'detector_boxes':n,'elapsed_s':meta['elapsed_s']},ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Commit assets and remove temporary workflow
        run: |
          git add trials/chapter-241/demo
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: add chapter 241 README demo'
          git rm .github/workflows/readme-chapter-241-demo.yml
          git commit -m 'chore: remove temporary README demo workflow'
          git push origin main
