name: README Chapter 241 Demo

on:
  push:
    branches:
      - 'chapter/doctors-rebirth+241'
    paths:
      - '.github/workflows/readme-chapter-241-demo.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-chapter-241-demo
  cancel-in-progress: true

jobs:
  demo:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: '.'
      CHAPTER_ID: c241dr01
      DEMO_ROOT: trials/chapter-241/demo
      MANGA_USE_DYNAMIC_LAMA: '1'
      MANGA_ORT_PROVIDER: openvino
      MANGA_ORT_REQUIRE_PROVIDER: '1'
      MANGA_ORT_OPENVINO_SCOPE: detectors
      MANGA_ORT_OPENVINO_THREADS: '2'
      MANGA_ORT_OPENVINO_STREAMS: '1'
      MANGA_ORT_OPENVINO_CACHE_DIR: /tmp/manga-openvino-cache
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'chapter/doctors-rebirth+241'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install runtime
        run: |
          python -m pip install numpy==1.26.4 Pillow==10.4.0 opencv-contrib-python==4.10.0.84 onnxruntime-openvino==1.24.1 psutil==6.1.1 loguru==0.7.2 requests==2.32.3 beautifulsoup4==4.12.3 lxml==5.3.0 playwright==1.47.0 fastapi==0.115.0 'uvicorn[standard]==0.30.6' pydantic==2.9.2 python-multipart==0.0.12

      - name: Restore production models
        id: models
        uses: actions/cache@v4
        with:
          path: |
            models/*.onnx
            models/.e2e-provenance.json
          key: processing-profile-models-b224548-v1

      - name: Read pinned model provisioner
        if: steps.models.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          ref: b22454827f8190655d7070b80eb20c2550beadfa
          path: benchmark-bootstrap
          sparse-checkout: scripts/provision_real_e2e_models.py
          sparse-checkout-cone-mode: false

      - name: Provision models
        if: steps.models.outputs.cache-hit != 'true'
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple torch==2.5.1+cpu torchvision==0.20.1+cpu
          python -m pip install --no-deps ultralytics==8.3.221 onnx==1.17.0 onnxslim==0.1.71
          python -m pip install sympy==1.13.1 PyYAML==6.0.2 scipy==1.14.1 tqdm==4.67.1 matplotlib==3.9.2 pandas==2.2.3 py-cpuinfo==9.0.0 ml_dtypes==0.5.3 colorama==0.4.6 polars==1.33.1 ultralytics-thop==2.0.17
          python benchmark-bootstrap/scripts/provision_real_e2e_models.py
          cp benchmark-bootstrap/models/*.onnx models/
          cp benchmark-bootstrap/models/.e2e-provenance.json models/

      - name: Download chapter and choose a rich slice
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path
          import cv2, numpy as np
          from app.downloader.registry import download_chapter
          from app.downloader.slicer import slice_image

          root=Path('checkpoint/readme-demo'); raw=root/'raw'; sliced=raw/'sliced'
          raw.mkdir(parents=True,exist_ok=True); sliced.mkdir(parents=True,exist_ok=True)
          url='https://asurascans.com/comics/doctors-rebirth-53fc8424/chapter/241'
          sources=download_chapter(url,raw)
          if len(sources)!=17: raise RuntimeError(f'expected 17 source images, got {len(sources)}')
          candidates=[]
          for si,src in enumerate(sources):
              items=slice_image(src,sliced,f'{si:03d}',return_metadata=True)
              for sj,item in enumerate(items):
                  image=cv2.imread(str(item['path']),cv2.IMREAD_GRAYSCALE)
                  if image is None: continue
                  small=cv2.resize(image,(min(900,image.shape[1]),min(900,image.shape[0])),interpolation=cv2.INTER_AREA)
                  edges=cv2.Canny(small,80,180)
                  edge_density=float((edges>0).mean())
                  contrast=float(np.std(small))/64.0
                  score=edge_density*0.65+min(1.0,contrast)*0.35
                  candidates.append({'score':score,'source_page':si,'slice_index':sj,'path':str(item['path']),'width':int(image.shape[1]),'height':int(image.shape[0])})
          candidates.sort(key=lambda x:x['score'],reverse=True)
          chosen=candidates[0]
          Path('checkpoint/readme-demo/chosen.json').write_text(json.dumps({'source_url':url,'chosen':chosen,'top_candidates':candidates[:10]},ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(chosen,ensure_ascii=False))
          PY

      - name: Process chosen slice with production pipeline
        run: |
          python - <<'PY'
          import json, os, shutil, time
          from pathlib import Path
          from app.optimized_pipeline import OptimizedChapterPipeline
          from app.manifest_utils import load_manifest_raw

          chosen=json.loads(Path('checkpoint/readme-demo/chosen.json').read_text())['chosen']
          target=Path(chosen['path'])
          chapter=os.environ['CHAPTER_ID']
          raw_root=Path('data/raw')/chapter
          processed=Path('data/processed')/chapter
          if raw_root.exists(): shutil.rmtree(raw_root)
          if processed.exists(): shutil.rmtree(processed)
          (raw_root/'sliced').mkdir(parents=True)
          shutil.copy2(target,raw_root/'sliced'/target.name)
          pages=[{'original':(raw_root/'sliced'/target.name).as_posix(),'clean':None,'boxes':[],'skipped':False,'source_page':chosen['source_page'],'slice_index':chosen['slice_index'],'stitch_core':{}}]
          processed.mkdir(parents=True)
          (processed/'manifest.json').write_text(json.dumps({'chapter_id':chapter,'pages':pages,'workflow':{'stage':'clean','page_index':0}},ensure_ascii=False,indent=2),encoding='utf-8')
          t=time.perf_counter()
          OptimizedChapterPipeline().process_pages(chapter,[0],workers=1)
          manifest=load_manifest_raw(chapter); page=manifest['pages'][0]
          if not page.get('clean'): raise RuntimeError('production clean output missing')
          meta={'source_page':chosen['source_page'],'slice_index':chosen['slice_index'],'score':chosen['score'],'original':page['original'],'clean':page['clean'],'boxes':len(page.get('boxes') or page.get('detections') or []),'elapsed_s':round(time.perf_counter()-t,3)}
          Path('checkpoint/readme-demo/meta.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(meta,ensure_ascii=False))
          PY

      - name: Build demo images
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image, ImageDraw
          meta=json.loads(Path('checkpoint/readme-demo/meta.json').read_text())
          manifest=json.loads(Path('data/processed/c241dr01/manifest.json').read_text())
          page=manifest['pages'][0]
          raw=Image.open(page['original']).convert('RGB')
          clean=Image.open(page['clean']).convert('RGB')
          detector=raw.copy(); draw=ImageDraw.Draw(detector)
          boxes=page.get('boxes') or page.get('detections') or []
          count=0
          for box in boxes:
              vals=[box.get(k) for k in ('x1','y1','x2','y2')]
              if any(v is None for v in vals): continue
              x1,y1,x2,y2=map(int,vals)
              if x2<=x1 or y2<=y1: continue
              draw.rectangle((x1,y1,x2,y2),outline='red',width=max(3,min(10,round(min(raw.size)/400))))
              count+=1
          out=Path('trials/chapter-241/demo'); out.mkdir(parents=True,exist_ok=True)
          raw.save(out/'raw.jpg',quality=94,optimize=True)
          detector.save(out/'detector.jpg',quality=94,optimize=True)
          clean.save(out/'clean.jpg',quality=94,optimize=True)
          payload={'chapter':'Doctors Rebirth 241','source_page':meta['source_page'],'slice_index':meta['slice_index'],'detector_boxes':count,'elapsed_s':meta['elapsed_s'],'selection':'highest edge/contrast score among chapter slices'}
          (out/'README.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(payload,ensure_ascii=False))
          PY

      - name: Commit demo assets
        run: |
          git fetch origin 'chapter/doctors-rebirth+241'
          git reset --hard 'origin/chapter/doctors-rebirth+241'
          git add trials/chapter-241/demo
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --quiet || git commit -m 'docs: add chapter 241 README demo'
          git push origin 'HEAD:chapter/doctors-rebirth+241'
