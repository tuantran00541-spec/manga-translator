name: Apply UI system rewrite

on:
  push:
    branches:
      - ui-system-rewrite

permissions:
  contents: write

concurrency:
  group: ui-system-rewrite-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wait for complete payload
        id: payload
        shell: bash
        run: |
          if [[ -f .ui-rewrite-payload/.ready ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Apply tested UI rewrite
        if: steps.payload.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat .ui-rewrite-payload/part-* > /tmp/ui-rewrite.tar.gz.b64
          base64 -d /tmp/ui-rewrite.tar.gz.b64 > /tmp/ui-rewrite.tar.gz
          echo "c42cbd1e942866a673473bb6e1a839fb7c5d66ef0fd60978bfc2f27de285b2d4  /tmp/ui-rewrite.tar.gz" | sha256sum -c -
          tar -xzf /tmp/ui-rewrite.tar.gz -C .
          rm -rf .ui-rewrite-payload
          rm -f .github/workflows/apply-ui-system-rewrite.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No UI changes to commit."
            exit 0
          fi
          git commit -m "refactor(ui): unify application workspace and product language [ui-applied]"
          git push origin HEAD:ui-system-rewrite
