name: Apply v0.2 local patch

on:
  push:
    branches:
      - feat/detection-recovery-pipeline
    paths:
      - .v02-local.patch

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/detection-recovery-pipeline
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply patch
        run: git apply --check .v02-local.patch && git apply .v02-local.patch
      - name: Compile and targeted regression
        run: |
          python -m pip install -r requirements.txt pytest
          python -m compileall -q app tests
          python -m pytest -q tests/test_v02_detection_recovery.py tests/test_inpaint_artwork_quality.py tests/test_manifest_data_model.py tests/test_chapter_export.py tests/test_auto_text_objects.py
      - name: Commit patched branch and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app tests
          git rm .v02-local.patch .github/workflows/apply-v02-local-patch.yml
          git commit -m "feat(v0.2): add recovery review states and overlap slicing"
          git push origin HEAD:feat/detection-recovery-pipeline
