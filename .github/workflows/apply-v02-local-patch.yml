name: Apply v0.2 final source

on:
  push:
    branches:
      - feat/detection-recovery-pipeline
    paths:
      - .v02-local.patch

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/detection-recovery-pipeline
      - name: Apply locally-validated source patch
        run: |
          cat .v02-patch-* > /tmp/v02.patch
          git apply --check --exclude=.github/workflows/release-gate.yml /tmp/v02.patch
          git apply --exclude=.github/workflows/release-gate.yml /tmp/v02.patch
      - name: Commit source without workflow mutations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .v02-local.patch .v02-patch-*
          git add app tests README.md Makefile
          git commit -m "feat(v0.2): ship safe detection recovery and low-memory CPU pipeline"
          git push origin HEAD:feat/detection-recovery-pipeline
