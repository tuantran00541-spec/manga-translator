name: Apply v0.2 final source

on:
  push:
    branches:
      - feat/detection-recovery-pipeline
    paths:
      - .v02-local.patch

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/detection-recovery-pipeline
      - name: Apply locally-validated final patch
        run: |
          cat .v02-patch-* > /tmp/v02.patch
          git apply --check /tmp/v02.patch
          git apply /tmp/v02.patch
      - name: Commit final source and remove transfer helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .v02-local.patch .v02-patch-* \
            .github/workflows/apply-v02-local-patch.yml \
            .github/workflows/v02-source-artifact.yml
          git add -A
          git commit -m "feat(v0.2): ship safe detection recovery and low-memory CPU pipeline"
          git push origin HEAD:feat/detection-recovery-pipeline
