name: Apply stroke mask refinement candidate

on:
  push:
    branches:
      - test/preserve-region-repaint
    paths:
      - .github/workflows/apply-stroke-mask-refinement-candidate.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/preserve-region-repaint
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply candidate patch
        run: python scripts/apply_stroke_mask_refinement_candidate_v2.py

      - name: Install unit-test runtime
        run: |
          python -m pip install \
            numpy==1.26.4 Pillow==10.4.0 opencv-contrib-python==4.10.0.84 \
            onnxruntime-openvino==1.24.1 psutil==6.1.1 loguru==0.7.2 \
            requests==2.32.3 beautifulsoup4==4.12.3 lxml==5.3.0 playwright==1.47.0 \
            fastapi==0.115.0 'uvicorn[standard]==0.30.6' \
            pydantic==2.9.2 filelock==3.16.1 python-multipart==0.0.12 pytest==8.3.5

      - name: Unit gate
        run: python -m pytest tests/test_fast_inpaint_paths.py tests/test_fast_residue_detector.py -q

      - name: Commit candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/inpaint/fast_lama_inpainter.py tests/test_fast_inpaint_paths.py
          git diff --cached --check
          git commit -m "test(inpaint): refine dense masks to text strokes"
          git push origin HEAD:test/preserve-region-repaint
