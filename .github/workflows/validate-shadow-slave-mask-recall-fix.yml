name: Validate Shadow Slave mask recall fix

on:
  push:
    branches:
      - test/preserve-region-repaint
    paths:
      - .github/workflows/validate-shadow-slave-mask-recall-fix.yml
      - app/mask_recall_pipeline.py
      - app/optimized_pipeline.py
      - tests/test_mask_recall_pipeline.py
      - tests/test_fast_inpaint_paths.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-shadow-slave-mask-recall-fix
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  MANGA_USE_DYNAMIC_LAMA: "1"
  MANGA_ORT_PROVIDER: openvino
  MANGA_ORT_REQUIRE_PROVIDER: "1"
  MANGA_ORT_OPENVINO_SCOPE: detectors
  MANGA_ORT_OPENVINO_THREADS: "2"
  MANGA_ORT_OPENVINO_STREAMS: "1"
  MANGA_ORT_OPENVINO_CACHE_DIR: /tmp/manga-openvino-cache
  OPENBLAS_NUM_THREADS: "1"
  CHAPTER_ID: c0010016
  CHAPTER_URL: https://asurascans.com/comics/shadow-slave-6f7fe6eb/chapter/1

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/preserve-region-repaint

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install production runtime
        run: |
          python -m pip install \
            numpy==1.26.4 Pillow==10.4.0 opencv-contrib-python==4.10.0.84 \
            onnxruntime-openvino==1.24.1 psutil==6.1.1 loguru==0.7.2 \
            requests==2.32.3 beautifulsoup4==4.12.3 lxml==5.3.0 playwright==1.47.0 \
            fastapi==0.115.0 'uvicorn[standard]==0.30.6' \
            pydantic==2.9.2 filelock==3.16.1 python-multipart==0.0.12 pytest==8.3.5

      - name: Focused unit tests
        run: |
          python -m pytest -q tests/test_mask_recall_pipeline.py tests/test_fast_inpaint_paths.py -k 'residue'

      - name: Restore detector and inpaint models
        id: models
        uses: actions/cache@v4
        with:
          path: |
            models/*.onnx
            models/.e2e-provenance.json
          key: processing-profile-models-b224548-v1

      - name: Read pinned model provisioner
        if: steps.models.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          ref: b22454827f8190655d7070b80eb20c2550beadfa
          path: benchmark-bootstrap
          sparse-checkout: scripts/provision_real_e2e_models.py
          sparse-checkout-cone-mode: false

      - name: Provision public-equivalent production models
        if: steps.models.outputs.cache-hit != 'true'
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple torch==2.5.1+cpu torchvision==0.20.1+cpu
          python -m pip install --no-deps ultralytics==8.3.221 onnx==1.17.0 onnxslim==0.1.71
          python -m pip install sympy==1.13.1 PyYAML==6.0.2 scipy==1.14.1 tqdm==4.67.1 matplotlib==3.9.2 pandas==2.2.3 py-cpuinfo==9.0.0 ml_dtypes==0.5.3 colorama==0.4.6 polars==1.33.1 ultralytics-thop==2.0.17
          python benchmark-bootstrap/scripts/provision_real_e2e_models.py
          cp benchmark-bootstrap/models/*.onnx models/
          cp benchmark-bootstrap/models/.e2e-provenance.json models/

      - name: Validate targeted Shadow Slave slices
        run: |
          python - <<'PY'
          from __future__ import annotations
          import json, os, shutil
          from pathlib import Path
          import cv2

          from app.dependencies import pipeline
          from app.image_io import read_image
          from app.manifest_utils import load_manifest_raw
          from app.mask_recall_pipeline import MaskRecallOptimizedChapterPipeline

          if not isinstance(pipeline, MaskRecallOptimizedChapterPipeline):
              raise RuntimeError(type(pipeline).__name__)

          cid = os.environ["CHAPTER_ID"]
          url = os.environ["CHAPTER_URL"]
          targets = [51, 69, 95, 117, 121]
          out = Path("benchmark-results/shadow-slave-mask-recall-fix")
          if out.exists():
              shutil.rmtree(out)
          out.mkdir(parents=True)

          manifest = pipeline.download_chapter(url, cid, workers=2)
          if len(manifest.get("pages") or []) <= max(targets):
              raise RuntimeError("chapter slicing changed unexpectedly")

          pipeline.process_pages(cid, targets, workers=2)
          state = load_manifest_raw(cid)
          report = {"head_sha": os.environ.get("GITHUB_SHA"), "targets": {}}

          for idx in targets:
              page = state["pages"][idx]
              clean = read_image(Path(page["clean"]))
              cv2.imwrite(str(out / f"p{idx:03d}-clean.png"), clean)
              metrics = page.get("processing_metrics") or {}
              repair = metrics.get("residue_repair") or {}
              records = page.get("boxes") or []
              overlap_safe = sum(
                  1 for r in records
                  if isinstance(r, dict)
                  and r.get("safe_to_inpaint")
                  and r.get("overlap_context_only")
                  and not r.get("geometry_overridden")
              )
              report["targets"][str(idx)] = {
                  "detection_state": page.get("detection_state"),
                  "detection_issues": page.get("detection_issues") or [],
                  "residue_regions": page.get("residue_regions") or [],
                  "overlap_safe_records": overlap_safe,
                  "detector_authorized": (metrics.get("detector") or {}).get("authorized"),
                  "repair": repair,
                  "timing_ms": metrics.get("timing_ms") or {},
                  "auto_inpaint": metrics.get("auto_inpaint") or {},
              }

          (out / "candidate.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          print("MASK_RECALL_FIX=" + json.dumps({
              p: {
                  "issues": v["detection_issues"],
                  "residue": len(v["residue_regions"]),
                  "overlap_safe": v["overlap_safe_records"],
                  "repair_pixels": v["repair"].get("repair_mask_pixels", 0),
                  "outside": v["repair"].get("outside_authority_changed_channel_values", 0),
              }
              for p, v in report["targets"].items()
          }))
          PY

      - name: Upload targeted validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shadow-slave-mask-recall-fix-${{ github.run_id }}
          path: benchmark-results/shadow-slave-mask-recall-fix/
          retention-days: 7
          compression-level: 6
          if-no-files-found: error
