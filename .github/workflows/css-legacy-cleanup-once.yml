name: One-shot residual legacy CSS cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/css-legacy-cleanup-once.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove confirmed dead selectors and repair transform selector
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo 'main moved after this cleanup run started; refusing stale rewrite'
            exit 1
          }

          python - <<'PY'
          from pathlib import Path
          import re

          runtime_files = [
              *Path('app/static/js').rglob('*.js'),
              *Path('app/templates').rglob('*.html'),
              *Path('app').rglob('*.py'),
          ]
          runtime_text = '\n'.join(path.read_text(encoding='utf-8', errors='ignore') for path in runtime_files)

          dead_tokens = (
              '#wordmark', '#wordmark-tag',
              '.wordmark-mark', '.wordmark-text', '.wordmark-accent',
              '.ui-surface', '.ui-surface-raised', '.ui-muted', '.ui-subtle', '.ui-mono',
              '.page-status-badge',
              '.add-box-btn', '.empty-boxes-notice', '.box-item', '.box-header',
              '.remove-box-btn', '.box-panel',
              '.preview-page-position', '.translation-position',
          )

          for token in dead_tokens:
              name = token[1:]
              if name in runtime_text:
                  raise SystemExit(f'Refusing cleanup; runtime still references {token}')

          transform_path = Path('app/static/css/editor-box-transform.css')
          transform_css = transform_path.read_text(encoding='utf-8')
          if '.box-overlay' not in transform_css:
              raise SystemExit('Expected stale .box-overlay selector is missing from editor-box-transform.css')
          if 'box-overlay' in runtime_text:
              raise SystemExit('Runtime still references legacy box-overlay')
          if 'text-object-overlay' not in runtime_text:
              raise SystemExit('Runtime text-object-overlay target is missing')
          transform_css = transform_css.replace('.box-overlay', '.text-object-overlay')
          if '.box-overlay' in transform_css:
              raise SystemExit('Legacy box-overlay selector remains after migration')
          transform_path.write_text(transform_css, encoding='utf-8')

          token_patterns = {
              token: re.compile(re.escape(token) + r'(?![A-Za-z0-9_-])')
              for token in dead_tokens
          }
          before_counts = {token: 0 for token in dead_tokens}
          removed_rules = []

          def matching_brace(text: str, open_pos: int) -> int:
              depth = 0
              quote = None
              comment = False
              i = open_pos
              while i < len(text):
                  if comment:
                      if text.startswith('*/', i):
                          comment = False
                          i += 2
                          continue
                      i += 1
                      continue
                  if quote is not None:
                      if text[i] == '\\' and i + 1 < len(text):
                          i += 2
                          continue
                      if text[i] == quote:
                          quote = None
                      i += 1
                      continue
                  if text.startswith('/*', i):
                      comment = True
                      i += 2
                      continue
                  ch = text[i]
                  if ch in ('"', "'"):
                      quote = ch
                  elif ch == '{':
                      depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0:
                          return i
                  i += 1
              raise SystemExit('Unterminated CSS block')

          def next_delimiter(text: str, start: int, end: int):
              quote = None
              comment = False
              paren = 0
              bracket = 0
              i = start
              while i < end:
                  if comment:
                      if text.startswith('*/', i):
                          comment = False
                          i += 2
                          continue
                      i += 1
                      continue
                  if quote is not None:
                      if text[i] == '\\' and i + 1 < end:
                          i += 2
                          continue
                      if text[i] == quote:
                          quote = None
                      i += 1
                      continue
                  if text.startswith('/*', i):
                      comment = True
                      i += 2
                      continue
                  ch = text[i]
                  if ch in ('"', "'"):
                      quote = ch
                  elif ch == '(':
                      paren += 1
                  elif ch == ')':
                      paren = max(0, paren - 1)
                  elif ch == '[':
                      bracket += 1
                  elif ch == ']':
                      bracket = max(0, bracket - 1)
                  elif paren == 0 and bracket == 0 and ch in '{;':
                      return i, ch
                  i += 1
              return end, None

          recursive_at_rules = ('@media', '@supports', '@container', '@layer', '@document')

          def clean_region(text: str) -> str:
              out = []
              pos = 0
              end = len(text)
              while pos < end:
                  delim_pos, delim = next_delimiter(text, pos, end)
                  if delim is None:
                      out.append(text[pos:])
                      break
                  if delim == ';':
                      out.append(text[pos:delim_pos + 1])
                      pos = delim_pos + 1
                      continue

                  close = matching_brace(text, delim_pos)
                  prelude = text[pos:delim_pos]
                  header = prelude.strip()
                  if header.startswith('@'):
                      if header.lower().startswith(recursive_at_rules):
                          inner = text[delim_pos + 1:close]
                          out.append(prelude)
                          out.append('{')
                          out.append(clean_region(inner))
                          out.append('}')
                      else:
                          out.append(text[pos:close + 1])
                      pos = close + 1
                      continue

                  hits = [token for token, pattern in token_patterns.items() if pattern.search(header)]
                  if hits:
                      for token in hits:
                          before_counts[token] += 1
                      removed_rules.append((header, hits))
                      pos = close + 1
                      continue

                  out.append(text[pos:close + 1])
                  pos = close + 1
              return ''.join(out)

          css_files = sorted(Path('app/static/css').glob('*.css'))
          changed_files = []
          for path in css_files:
              original = path.read_text(encoding='utf-8')
              if path == transform_path:
                  original = transform_path.read_text(encoding='utf-8')
              cleaned = clean_region(original)
              cleaned = re.sub(r'\n{4,}', '\n\n\n', cleaned)
              if original.endswith('\n') and cleaned and not cleaned.endswith('\n'):
                  cleaned += '\n'
              if cleaned != original:
                  path.write_text(cleaned, encoding='utf-8')
                  changed_files.append(str(path))

          missing = [token for token, count in before_counts.items() if count == 0]
          if missing:
              raise SystemExit(f'Expected confirmed dead selectors not found in CSS rules: {missing}')

          all_css = '\n'.join(path.read_text(encoding='utf-8', errors='ignore') for path in css_files)
          leftovers = [token for token, pattern in token_patterns.items() if pattern.search(all_css)]
          if leftovers:
              raise SystemExit(f'Dead selector leftovers remain: {leftovers}')

          print(f'Removed {len(removed_rules)} confirmed-dead CSS rules')
          for token, count in before_counts.items():
              print(f'  {token}: {count} rule(s)')
          print('Changed CSS files:')
          for path in changed_files:
              print(f'  {path}')
          print('Migrated editor transform styling: .box-overlay -> .text-object-overlay')
          PY

          python - <<'PY'
          from pathlib import Path
          for path in Path('app/static/css').glob('*.css'):
              text = path.read_text(encoding='utf-8')
              depth = 0
              quote = None
              comment = False
              i = 0
              while i < len(text):
                  if comment:
                      if text.startswith('*/', i):
                          comment = False
                          i += 2
                          continue
                      i += 1
                      continue
                  if quote is not None:
                      if text[i] == '\\' and i + 1 < len(text):
                          i += 2
                          continue
                      if text[i] == quote:
                          quote = None
                      i += 1
                      continue
                  if text.startswith('/*', i):
                      comment = True
                      i += 2
                      continue
                  ch = text[i]
                  if ch in ('"', "'"):
                      quote = ch
                  elif ch == '{':
                      depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth < 0:
                          raise SystemExit(f'Unbalanced CSS braces: {path}')
