                  raise SystemExit(f'Invalid CSS structure: {path}, quote={quote!r}, comment={comment}, depth={depth}')
          PY

          python -m compileall -q app run.py
          find app/static/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/static/css
          git rm .github/workflows/css-legacy-cleanup-once.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'refactor(ui): remove residual legacy CSS'
          git push origin HEAD:main
