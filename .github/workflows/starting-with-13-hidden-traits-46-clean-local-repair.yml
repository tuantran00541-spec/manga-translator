name: Starting With 13 Hidden Traits 46 Checkpoint 02B Clean Local Repair

on:
  push:
    branches:
      - trial/starting-with-13-hidden-traits-46
    paths:
      - .github/workflows/starting-with-13-hidden-traits-46-clean-local-repair.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: starting-with-13-hidden-traits-46-human-loop
  cancel-in-progress: false

jobs:
  repair-non-story-slices:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      CHAPTER_ID: 57d7b970
      IMPORT_RUN_ID: "34587403083"
      IMPORT_ARTIFACT: 01-import-57d7b970
      CLEAN_RUN_ID: "34587852339"
      CLEAN_ARTIFACT: 02-clean-review-57d7b970
    steps:
      - uses: actions/checkout@v4
        with:
          ref: trial/starting-with-13-hidden-traits-46

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install proof dependency
        run: python -m pip install Pillow==10.4.0

      - name: Restore base checkpoints
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf checkpoint repair
          mkdir -p checkpoint/01-import checkpoint/02-clean repair/overlay/processed repair/proof
          gh run download "$IMPORT_RUN_ID" -n "$IMPORT_ARTIFACT" -D checkpoint/01-import
          gh run download "$CLEAN_RUN_ID" -n "$CLEAN_ARTIFACT" -D checkpoint/02-clean
          test -f checkpoint/01-import/raw/sliced/000_00.png
          test -f checkpoint/01-import/raw/sliced/021_04.png
          test -f checkpoint/02-clean/processed/clean_000_00.png
          test -f checkpoint/02-clean/processed/clean_021_04.png
          test -f checkpoint/02-clean/box-index.json

      - name: Apply local human repair
        run: |
          cp checkpoint/01-import/raw/sliced/000_00.png repair/overlay/processed/clean_000_00.png
          cp checkpoint/01-import/raw/sliced/021_04.png repair/overlay/processed/clean_021_04.png
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          from PIL import Image, ImageChops, ImageDraw

          box_index=json.loads(Path('checkpoint/02-clean/box-index.json').read_text(encoding='utf-8'))
          targets=[
            {
              'page_index':0,'source_page':0,'slice_index':0,
              'raw':'checkpoint/01-import/raw/sliced/000_00.png',
              'base':'checkpoint/02-clean/processed/clean_000_00.png',
              'repaired':'repair/overlay/processed/clean_000_00.png',
              'classification':'non_story_title_credit',
              'issue':'base clean removed series title and damaged scanlation credit text on title card'
            },
            {
              'page_index':76,'source_page':21,'slice_index':4,
              'raw':'checkpoint/01-import/raw/sliced/021_04.png',
              'base':'checkpoint/02-clean/processed/clean_021_04.png',
              'repaired':'repair/overlay/processed/clean_021_04.png',
              'classification':'non_story_promo_credit',
              'issue':'base clean removed To be continued and chapter-end credit material that must be preserved'
            }
          ]

          def sha256(path):
              h=hashlib.sha256()
              with open(path,'rb') as f:
                  for chunk in iter(lambda:f.read(1024*1024),b''): h.update(chunk)
              return h.hexdigest()

          repair_rows=[]
          for t in targets:
              raw=Image.open(t['raw']).convert('RGB')
              base=Image.open(t['base']).convert('RGB')
              repaired=Image.open(t['repaired']).convert('RGB')
              if raw.size!=base.size or raw.size!=repaired.size:
                  raise SystemExit(f"repair dimensions changed for p{t['page_index']:03d}")
              if ImageChops.difference(raw,repaired).getbbox() is not None:
                  raise SystemExit(f"repaired p{t['page_index']:03d} is not pixel-exact RAW")
              page_boxes=[b for b in box_index if int(b.get('page_index',-1))==t['page_index']]
              if not page_boxes:
                  raise SystemExit(f"expected detector boxes for p{t['page_index']:03d}")

              def thumb(img):
                  out=img.copy(); out.thumbnail((380,1100)); return out
              panels=[('RAW / PRESERVE',thumb(raw)),('BASE CLEAN / REJECT',thumb(base)),('REPAIRED / APPROVE',thumb(repaired))]
              pad=20; label_h=36
              canvas=Image.new('RGB',(sum(im.width for _,im in panels)+pad*4,max(im.height for _,im in panels)+label_h+pad*2),'white')
              d=ImageDraw.Draw(canvas); x=pad
              for label,im in panels:
                  d.text((x,pad),label,fill='black'); canvas.paste(im,(x,pad+label_h)); x+=im.width+pad
              canvas.save(f"repair/proof/p{t['page_index']:03d}-raw-base-repaired.jpg",quality=92)

              repair_rows.append({
                **{k:t[k] for k in ('page_index','source_page','slice_index','classification')},
                'editorial_issue':t['issue'],
                'action':'restore_raw_slice_pixel_exact',
                'raw_sha256':sha256(t['raw']),
                'base_clean_sha256':sha256(t['base']),
                'repaired_sha256':sha256(t['repaired']),
                'raw_vs_repaired_pixel_diff':0,
                'drop_from_story_object_ids':[b.get('box_id') for b in page_boxes]
              })

          payload={
            'checkpoint':'02b-clean-local-repair',
            'chapter_id':'57d7b970',
            'base_clean_run_id':34587852339,
            'base_clean_artifact':'02-clean-review-57d7b970',
            'import_run_id':34587403083,
            'import_artifact':'01-import-57d7b970',
            'repairs':repair_rows,
            'tombstone_seed':{
              'source_missing':True,
              'auto_generated':False,
              'origin':'human_review_drop',
              'reason':'non_story_title_credit_or_promo'
            },
            'next_action':'STOP_FOR_TARGETED_HUMAN_REVIEW'
          }
          Path('repair/clean-repair.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2),encoding='utf-8')
          Path('repair/HUMAN_CHECKPOINT.txt').write_text(
            'CHECKPOINT: CLEAN LOCAL REPAIR\nReview p000 and p076 RAW vs BASE CLEAN vs REPAIRED. Approve only if title/credits/promo are fully restored and both repaired slices are pixel-exact RAW.\n',encoding='utf-8')
          print(json.dumps(payload,indent=2))
          PY

      - name: Upload local repair delta
        uses: actions/upload-artifact@v4
        with:
          name: 02b-clean-local-repair-57d7b970
          path: repair/
          retention-days: 7
          if-no-files-found: error
