name: Chapter 241 Checkpoint 03 OCR Review

on:
  push:
    branches:
      - 'chapter/doctors-rebirth\+241'
    paths:
      - '.github/workflows/chapter-241-ocr-review.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: chapter-241-human-loop
  cancel-in-progress: false

jobs:
  ocr-from-raw:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: ${{ github.workspace }}
      GH_TOKEN: ${{ github.token }}
      CHAPTER_ID: c241d001
      IMPORT_RUN_ID: '34732495460'
      IMPORT_ARTIFACT: 01-import-c241dr01
      REPAIR_RUN_ID: '34734740336'
      REPAIR_ARTIFACT: 02b-clean-local-repair-c241d001
      STATE_DIR: chapters/doctors-rebirth-241
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: 'True'
      MANGA_PPOCRV6_TIER: small
      MANGA_OCR_TARGET_SELECTION: all
      MANGA_PPOCRV6_TEXTLINE_ORIENTATION: '0'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'chapter/doctors-rebirth+241'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install production OCR runtime
        run: |
          python -m pip install --only-binary=:all: \
            numpy==1.26.4 \
            Pillow==10.4.0 \
            opencv-contrib-python==4.10.0.84 \
            paddlepaddle==3.2.2 \
            paddleocr==3.7.0 \
            onnxruntime-openvino==1.24.1 \
            psutil==6.1.1 \
            loguru==0.7.2 \
            requests==2.32.3 \
            beautifulsoup4==4.12.3 \
            lxml==5.3.0 \
            playwright==1.47.0 \
            fastapi==0.115.0 \
            pydantic==2.9.2 \
            filelock==3.16.1 \
            python-multipart==0.0.12

      - name: Restore Paddle model cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.paddlex
            ~/.paddleocr
          key: chapter-trial-ppocrv6-small-en-v1

      - name: Verify approved CLEAN gate and restore artifacts
        run: |
          rm -rf checkpoint/01-import checkpoint/02b-repair checkpoint/03-ocr-review
          mkdir -p checkpoint/01-import checkpoint/02b-repair checkpoint/03-ocr-review
          gh run download "$IMPORT_RUN_ID" -n "$IMPORT_ARTIFACT" -D checkpoint/01-import
          gh run download "$REPAIR_RUN_ID" -n "$REPAIR_ARTIFACT" -D checkpoint/02b-repair
          test -f checkpoint/01-import/manifest.json
          test -d checkpoint/01-import/raw/sliced
          test -f checkpoint/02b-repair/processed/manifest.json
          test -f "$STATE_DIR/clean-review.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          review=json.loads((Path(os.environ['STATE_DIR'])/'clean-review.json').read_text(encoding='utf-8'))
          approved=review.get('approved_clean') or {}
          human=review.get('review') or {}
          if review.get('status')!='PASS' or not review.get('editorial_pass'):
              raise SystemExit(f'CLEAN gate not approved: {review}')
          if human.get('story_text_residue_blockers')!=0 or human.get('artwork_damage_blockers')!=0:
              raise SystemExit(f'CLEAN blockers remain: {human}')
          if approved.get('run_id')!=34734740336 or approved.get('artifact')!='02b-clean-local-repair-c241d001':
              raise SystemExit(f'approved CLEAN artifact mismatch: {approved}')
          repair=json.loads(Path('checkpoint/02b-repair/repair-summary.json').read_text(encoding='utf-8'))
          if repair.get('core_review',{}).get('story_text_residue_blockers_found')!=0:
              raise SystemExit(f'repair proof still has story residue: {repair}')
          if repair.get('changed_clean_files')!=['clean_000_00.png','clean_003_02.png','clean_016_00.png']:
              raise SystemExit(f'unexpected repair file set: {repair.get("changed_clean_files")}')
          print('approved CLEAN stack verified')
          PY

      - name: Validate OCR helper syntax and imports
        run: |
          python -m py_compile "$STATE_DIR/run_ocr_review.py"
          python - <<'PY'
          from app.ocr.service import OCRService, _ocr_crop_bounds, ocr_target_skip_reason
          from app.ocr.multi_lang_ocr import MultiLangOCR
          print('current OCR service API imports verified')
          PY

      - name: Run production OCR from RAW and build human review pack
        run: |
          python "$STATE_DIR/run_ocr_review.py" \
            --chapter-id "$CHAPTER_ID" \
            --import-root checkpoint/01-import \
            --repaired-root checkpoint/02b-repair \
            --output checkpoint/03-ocr-review \
            --lang en

      - name: Verify OCR checkpoint contract
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('checkpoint/03-ocr-review')
          summary=json.loads((root/'ocr-review-summary.json').read_text(encoding='utf-8'))
          if summary.get('ocr_source')!='RAW' or not summary.get('ocr_source_invariant_verified'):
              raise SystemExit('OCR did not prove RAW source invariant')
          if summary.get('failed')!=0:
              raise SystemExit(f"OCR failures remain: {summary.get('failed')}")
          if summary.get('skipped_non_story_pages')!=[0,67]:
              raise SystemExit('non-story skip invariant changed')
          if not summary.get('decorative_title_box_ocr_excluded'):
              raise SystemExit('decorative title OCR exclusion was lost')
          if summary.get('status')!='REVIEW_REQUIRED':
              raise SystemExit('checkpoint must stop for human OCR review')
          print(json.dumps(summary,indent=2))
          PY

      - name: Upload checkpoint 03 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 03-ocr-review-c241d001
          path: checkpoint/03-ocr-review/
          retention-days: 7
          if-no-files-found: warn
