name: Test dense surface contrast gate

on:
  push:
    branches:
      - test/preserve-region-repaint
    paths:
      - .github/workflows/test-p025-dense-ring-fallback.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  MANGA_ORT_PROVIDER: openvino
  MANGA_ORT_REQUIRE_PROVIDER: "1"
  MANGA_ORT_OPENVINO_SCOPE: detectors
  MANGA_ORT_OPENVINO_THREADS: "2"
  MANGA_ORT_OPENVINO_STREAMS: "1"
  MANGA_ORT_OPENVINO_CACHE_DIR: /tmp/manga-openvino-cache
  OPENBLAS_NUM_THREADS: "1"
  CHAPTER_ID: c159aa13
  CHAPTER_URL: https://asurascans.com/comics/player-who-returned-10000-years-later-53fc8424/chapter/159

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/preserve-region-repaint

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime
        run: |
          python -m pip install \
            pytest==8.3.3 numpy==1.26.4 Pillow==10.4.0 opencv-contrib-python==4.10.0.84 \
            onnxruntime-openvino==1.24.1 psutil==6.1.1 loguru==0.7.2 \
            requests==2.32.3 beautifulsoup4==4.12.3 lxml==5.3.0 playwright==1.47.0 \
            fastapi==0.115.0 'uvicorn[standard]==0.30.6' \
            pydantic==2.9.2 filelock==3.16.1 python-multipart==0.0.12

      - name: Unit regression gate
        run: |
          python -m pytest -q tests/test_dense_authority_surface.py tests/test_fast_inpaint_paths.py

      - name: Restore detector and inpaint models
        id: models
        uses: actions/cache@v4
        with:
          path: |
            models/*.onnx
            models/.e2e-provenance.json
          key: processing-profile-models-b224548-v1

      - name: Read pinned model provisioner
        if: steps.models.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          ref: b22454827f8190655d7070b80eb20c2550beadfa
          path: benchmark-bootstrap
          sparse-checkout: scripts/provision_real_e2e_models.py
          sparse-checkout-cone-mode: false

      - name: Provision models
        if: steps.models.outputs.cache-hit != 'true'
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple torch==2.5.1+cpu torchvision==0.20.1+cpu
          python -m pip install --no-deps ultralytics==8.3.221 onnx==1.17.0 onnxslim==0.1.71
          python -m pip install sympy==1.13.1 PyYAML==6.0.2 scipy==1.14.1 tqdm==4.67.1 matplotlib==3.9.2 pandas==2.2.3 py-cpuinfo==9.0.0 ml_dtypes==0.5.3 colorama==0.4.6 polars==1.33.1 ultralytics-thop==2.0.17
          python benchmark-bootstrap/scripts/provision_real_e2e_models.py
          cp benchmark-bootstrap/models/*.onnx models/
          cp benchmark-bootstrap/models/.e2e-provenance.json models/

      - name: Run real p025 p035 contrast gate
        run: |
          python - <<'PY'
          from __future__ import annotations
          import json
          import os
          from pathlib import Path
          import cv2
          import numpy as np
          from app.dependencies import pipeline
          from app.image_io import read_image
          from app.manifest_utils import load_manifest_raw

          out = Path("benchmark-results/dense-contrast-gate")
          out.mkdir(parents=True, exist_ok=True)
          chapter_id = os.environ["CHAPTER_ID"]
          manifest = pipeline.download_chapter(os.environ["CHAPTER_URL"], chapter_id, workers=1)
          targets = {
              "p025": ((5, 4), (315, 2120, 845, 2425)),
              "p035": ((8, 1), (105, 1005, 815, 1455)),
          }
          located = {}
          for name, (key, roi) in targets.items():
              matches = [
                  i for i,p in enumerate(manifest["pages"])
                  if int(p.get("source_page",-1)) == key[0]
                  and int(p.get("slice_index",-1)) == key[1]
              ]
              if len(matches) != 1:
                  raise RuntimeError(f"{name} lookup failed: {matches}")
              located[name] = (matches[0], roi)

          pipeline.process_pages(
              chapter_id,
              [located["p025"][0], located["p035"][0]],
              workers=1,
          )
          state = load_manifest_raw(chapter_id)
          report = {}
          for name, (page_index, roi) in located.items():
              page = state["pages"][page_index]
              metrics = (page.get("processing_metrics") or {}).get("auto_inpaint") or {}
              raw = read_image(Path(page["original"]))
              clean = read_image(Path(page["clean"]))
              x1,y1,x2,y2 = roi
              raw_roi = raw[y1:y2,x1:x2]
              clean_roi = clean[y1:y2,x1:x2]
              cv2.imwrite(str(out / f"{name}-raw.png"), raw_roi)
              cv2.imwrite(str(out / f"{name}-clean.png"), clean_roi)
              diff = np.abs(clean_roi.astype(np.int16) - raw_roi.astype(np.int16))
              report[name] = {
                  "page_index": page_index,
                  "auto_inpaint": metrics,
                  "roi_changed_channel_values": int(np.count_nonzero(diff)),
                  "roi_max_diff": int(diff.max()) if diff.size else 0,
                  "roi_mean_diff": float(diff.mean()) if diff.size else 0.0,
              }

          p025 = report["p025"]["auto_inpaint"]
          if int(p025.get("dense_authority_gradient_regions", 0)) < 1:
              raise AssertionError(f"p025 dense surface fallback not used: {p025}")
          if int(p025.get("lama_model_runs", 0)) != 0:
              raise AssertionError(f"p025 unexpectedly used LaMa: {p025}")

          p035 = report["p035"]["auto_inpaint"]
          if int(p035.get("dense_authority_gradient_regions", 0)) != 0:
              raise AssertionError(f"p035 incorrectly used dense surface: {p035}")
          if int(p035.get("dense_authority_contrast_rejects", 0)) < 1:
              raise AssertionError(f"p035 did not hit contrast gate: {p035}")
          if int(p035.get("lama_model_runs", 0)) < 1:
              raise AssertionError(f"p035 did not fall back to LaMa: {p035}")

          (out / "report.json").write_text(json.dumps(report, indent=2), encoding="utf-8")
          print("DENSE_CONTRAST_GATE=" + json.dumps(report))
          PY

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: dense-contrast-gate-${{ github.run_id }}
          path: benchmark-results/dense-contrast-gate/
          retention-days: 7
          if-no-files-found: error
