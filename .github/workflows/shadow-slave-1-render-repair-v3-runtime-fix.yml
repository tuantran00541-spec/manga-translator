name: Shadow Slave Chapter 1 Render Repair V3 Runtime Fix

on:
  push:
    branches:
      - trial/shadow-slave-chapter-1
    paths:
      - .github/workflows/shadow-slave-1-render-repair-v3-runtime-fix.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: shadow-slave-1-human-loop
  cancel-in-progress: false

jobs:
  retry-v3:
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    env:
      PYTHONUNBUFFERED: "1"
      CHAPTER_ID: c0010001
      TRANSLATION_RUN_ID: "34371649065"
      TRANSLATION_ARTIFACT: 04-translation-review-c0010001
      PRIMARY_DIALOGUE_FONT: Mac-dinh-3
      FREE_TEXT_FONT: Manga-fonts
      SYSTEM_FONT: Shadow-fonts
      MANGA_USE_DYNAMIC_LAMA: "1"
      MANGA_ORT_PROVIDER: openvino
      MANGA_ORT_REQUIRE_PROVIDER: "1"
      MANGA_ORT_OPENVINO_SCOPE: detectors
      MANGA_ORT_OPENVINO_THREADS: "2"
      MANGA_ORT_OPENVINO_STREAMS: "1"
      MANGA_ORT_OPENVINO_CACHE_DIR: /tmp/manga-openvino-cache
      OPENBLAS_NUM_THREADS: "1"
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install complete production repair runtime
        run: |
          python -m pip install \
            Pillow==10.4.0 numpy==1.26.4 opencv-contrib-python==4.10.0.84 \
            onnxruntime-openvino==1.24.1 psutil==6.1.1 loguru==0.7.2 \
            requests==2.32.3 beautifulsoup4==4.12.3 lxml==5.3.0 playwright==1.47.0 \
            fastapi==0.115.0 'uvicorn[standard]==0.30.6' pydantic==2.9.2 \
            filelock==3.16.1 python-multipart==0.0.12 fonttools==4.59.2 \
            pyyaml==6.0.2

      - name: Restore inpaint models
        id: models
        uses: actions/cache@v4
        with:
          path: |
            models/*.onnx
            models/.e2e-provenance.json
          key: processing-profile-models-b224548-v1

      - name: Fail if model cache unexpectedly missing
        if: steps.models.outputs.cache-hit != 'true'
        run: exit 1

      - name: Execute reviewed V3 run steps unchanged
        run: |
          python - <<'PY'
          import os
          import subprocess
          from pathlib import Path
          import yaml

          workflow = yaml.safe_load(
              Path('.github/workflows/shadow-slave-1-render-repair-v3.yml').read_text(encoding='utf-8')
          )
          steps = workflow['jobs']['render-repair-v3']['steps']
          wanted = [
              'Restore reviewed translation checkpoint',
              'Validate translation gate and restore production layout',
              'Repair 18 human-identified English residue regions',
              'Apply semantic typography and audit exact Vietnamese glyph coverage',
              'Production render and validate 43-page export',
              'Build repair checkpoint and compact human visual pack',
          ]
          by_name = {step.get('name'): step for step in steps if isinstance(step, dict)}
          missing = [name for name in wanted if name not in by_name]
          if missing:
              raise SystemExit(f'missing reviewed V3 steps: {missing}')
          env = os.environ.copy()
          for name in wanted:
              command = by_name[name].get('run')
              if not command:
                  raise SystemExit(f'V3 step has no run body: {name}')
              print(f'\n===== {name} =====', flush=True)
              subprocess.run(
                  ['bash', '-e', '-u', '-o', 'pipefail', '-c', command],
                  check=True,
                  env=env,
              )
          PY

      - name: Upload repaired render checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: 05-render-repair-v3-c0010001
          path: checkpoint/05-render-repair-v3
          if-no-files-found: error
          retention-days: 7

      - name: Upload compact repaired visual pack
        uses: actions/upload-artifact@v4
        with:
          name: 05-render-repair-v3-visual-c0010001
          path: checkpoint/05-render-repair-v3-visual
          if-no-files-found: error
          retention-days: 7
