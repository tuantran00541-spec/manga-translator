name: Research chapter 210 probe

on:
  push:
    branches:
      - research/paper-gates-ocr-mask-inpaint-20260829
      - feat/ppocrv6-runtime-migration
    paths:
      - .github/workflows/research-chapter210.yml
      - requirements.txt
      - scripts/asura_chapter_action_probe.py
      - scripts/ppocrv6_chapter_probe.py
      - scripts/korean_fallback_probe.py
      - scripts/runtime_v6_chapter_probe.py
      - scripts/ocr_v6_runtime_sanity.py
      - scripts/ocr_hybrid_sanity.py
      - scripts/hybrid_service_sanity.py
      - app/ocr/**
      - app/text_objects.py
      - app/routers/ocr.py
      - app/routers/translation.py
      - app/downloader/**
      - app/security.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chapter-probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      CHAPTER_URL: https://asurascans.com/comics/the-return-of-the-crazy-demon-b57aa235/chapter/210
      PROBE_ROOT: benchmark-results/chapter210
      MANGA_DOWNLOAD_WORKERS: "4"
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
      MANGA_PPOCRV6_TIER: "small"
      MANGA_PPOCRV6_TEXTLINE_ORIENTATION: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile OCR migration sources
        run: |
          python -m compileall -q app/ocr app/text_objects.py app/routers/ocr.py app/routers/translation.py scripts/ocr_hybrid_sanity.py scripts/hybrid_service_sanity.py scripts/runtime_v6_chapter_probe.py

      - name: Install downloader and service-sanity dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests==2.32.3 beautifulsoup4==4.12.3 lxml==5.3.0 Pillow==10.4.0 playwright==1.47.0 fastapi==0.115.0 numpy==1.26.4 opencv-python-headless==4.10.0.84 onnxruntime==1.21.0 filelock==3.16.1 loguru==0.7.2
          python -m playwright install --with-deps chromium

      - name: Validate hybrid service cache and concurrency
        run: |
          PYTHONPATH=. python scripts/hybrid_service_sanity.py

      - name: Download and slice full Asura chapter with project pipeline
        run: |
          python scripts/asura_chapter_action_probe.py "$CHAPTER_URL" --output "$PROBE_ROOT"
          cat "$PROBE_ROOT/chapter_info.json" | python -c 'import json,sys; d=json.load(sys.stdin); print("pages=",d["page_count"],"bytes=",d["total_bytes"],"slices=",d["slice_count"],"max_slice_height=",d["max_slice_height"])'

      - name: Install production-shaped PaddleOCR 3.x runtime
        run: |
          python -m venv .venv-ppocrv6
          .venv-ppocrv6/bin/python -m pip install --upgrade pip
          .venv-ppocrv6/bin/pip install \
            "numpy==1.26.4" \
            "Pillow==10.4.0" \
            "opencv-contrib-python==4.10.0.84" \
            "paddlepaddle==3.2.2" \
            "paddleocr==3.7.0"
          .venv-ppocrv6/bin/python - <<'PY'
          from importlib import metadata
          import cv2, numpy, paddle, paddleocr

          opencv_dists = sorted(
              {
                  (dist.metadata.get("Name") or "").strip().lower()
                  for dist in metadata.distributions()
                  if (dist.metadata.get("Name") or "").strip().lower().startswith("opencv-")
              }
          )
          assert opencv_dists == ["opencv-contrib-python"], opencv_dists
          print("RUNTIME_VERSIONS", {
              "numpy": numpy.__version__,
              "opencv": cv2.__version__,
              "opencv_distributions": opencv_dists,
              "paddle": paddle.__version__,
              "paddleocr": paddleocr.__version__,
          })
          PY

      - name: Validate reading order and Paddle runtime models
        run: |
          PYTHONPATH=. .venv-ppocrv6/bin/python scripts/ocr_v6_runtime_sanity.py --model-smoke --korean

      - name: Validate hybrid routing and quality invariants
        run: |
          PYTHONPATH=. .venv-ppocrv6/bin/python scripts/ocr_hybrid_sanity.py

      - name: Probe PP-OCRv6 small on all production slices
        run: |
          .venv-ppocrv6/bin/python scripts/ppocrv6_chapter_probe.py \
            --selected-file "$PROBE_ROOT/all_slices.txt" \
            --output "$PROBE_ROOT/ppocrv6" \
            --tier small
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("benchmark-results/chapter210/ppocrv6/summary.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          print("PPOCRV6_FINAL", json.dumps({k:v for k,v in d.items() if k != "rows"}, ensure_ascii=False))
          PY

      - name: Run current all-region adapter baseline
        run: |
          PYTHONPATH=. .venv-ppocrv6/bin/python scripts/runtime_v6_chapter_probe.py \
            --ppocr-summary "$PROBE_ROOT/ppocrv6/summary.json" \
            --output "$PROBE_ROOT/runtime_v6_all" \
            --lang en \
            --target-mode all

      - name: Run centered-target adapter candidate
        run: |
          PYTHONPATH=. .venv-ppocrv6/bin/python scripts/runtime_v6_chapter_probe.py \
            --ppocr-summary "$PROBE_ROOT/ppocrv6/summary.json" \
            --output "$PROBE_ROOT/runtime_v6_centered" \
            --lang en \
            --target-mode centered

      - name: Enforce target-selection A/B gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("benchmark-results/chapter210")
          baseline = json.loads((root / "runtime_v6_all/summary.json").read_text(encoding="utf-8"))
          centered = json.loads((root / "runtime_v6_centered/summary.json").read_text(encoding="utf-8"))
          b_m = baseline["mismatch_counts"]
          c_m = centered["mismatch_counts"]
          comparison = {
              "baseline_agreement": baseline["same_normalized_rate"],
              "centered_agreement": centered["same_normalized_rate"],
              "agreement_delta": centered["same_normalized_rate"] - baseline["same_normalized_rate"],
              "baseline_plus_noise": b_m["runtime_contains_reference_plus_noise"],
              "centered_plus_noise": c_m["runtime_contains_reference_plus_noise"],
              "plus_noise_removed": b_m["runtime_contains_reference_plus_noise"] - c_m["runtime_contains_reference_plus_noise"],
              "baseline_partial": b_m["runtime_partial_reference"],
              "centered_partial": c_m["runtime_partial_reference"],
              "baseline_blank": b_m["runtime_blank"],
              "centered_blank": c_m["runtime_blank"],
              "baseline_different": b_m["different"],
              "centered_different": c_m["different"],
              "baseline_mean_latency_ms": baseline["mean_region_latency_ms"],
              "centered_mean_latency_ms": centered["mean_region_latency_ms"],
          }
          limits = {
              "agreement_not_worse": comparison["centered_agreement"] >= comparison["baseline_agreement"],
              "neighbor_noise_not_worse": comparison["centered_plus_noise"] <= comparison["baseline_plus_noise"],
              "partial_not_worse": comparison["centered_partial"] <= comparison["baseline_partial"],
              "blank_not_worse": comparison["centered_blank"] <= comparison["baseline_blank"],
              "different_not_worse": comparison["centered_different"] <= comparison["baseline_different"],
              "latency_within_10_percent": comparison["centered_mean_latency_ms"] <= comparison["baseline_mean_latency_ms"] * 1.10,
          }
          comparison["gate_checks"] = limits
          comparison["passed"] = all(limits.values())
          (root / "target_selection_comparison.json").write_text(
              json.dumps(comparison, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print("TARGET_SELECTION_AB", json.dumps(comparison, ensure_ascii=False))
          failed = [name for name, passed in limits.items() if not passed]
          if failed:
              raise SystemExit("Centered target selection regression: " + ", ".join(failed))
          PY

      - name: Recheck PP-OCRv6 regions with Korean PP-OCRv5 mobile recognizer
        run: |
          .venv-ppocrv6/bin/python scripts/korean_fallback_probe.py \
            --ppocr-summary "$PROBE_ROOT/ppocrv6/summary.json" \
            --output "$PROBE_ROOT/korean_fallback" \
            --v6-low-threshold 0.75
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("benchmark-results/chapter210/korean_fallback/summary.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          keys = ["model", "init_ms", "regions_rechecked", "mean_rec_latency_ms", "p95_rec_latency_ms", "v6_low_conf_candidates", "ko_confidence_improved_count", "hangul_recovered_count"]
          print("KO_FALLBACK_FINAL", json.dumps({k:d.get(k) for k in keys}, ensure_ascii=False))
          PY

      - name: Upload downloaded chapter metadata and raw images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapter210-download
          path: |
            benchmark-results/chapter210/raw
            benchmark-results/chapter210/chapter_info.json
            benchmark-results/chapter210/all_slices.txt
          retention-days: 3
          if-no-files-found: warn

      - name: Upload OCR migration results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapter210-ocr-v6-runtime
          path: |
            benchmark-results/chapter210/ppocrv6
            benchmark-results/chapter210/runtime_v6_all
            benchmark-results/chapter210/runtime_v6_centered
            benchmark-results/chapter210/target_selection_comparison.json
            benchmark-results/chapter210/korean_fallback
          retention-days: 7
          if-no-files-found: warn
