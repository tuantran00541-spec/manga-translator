name: Research chapter 210 probe

on:
  push:
    branches:
      - research/paper-gates-ocr-mask-inpaint-20260829
    paths:
      - .github/workflows/research-chapter210.yml
      - scripts/asura_chapter_action_probe.py
      - scripts/ppocrv6_chapter_probe.py
      - scripts/korean_fallback_probe.py
      - scripts/chapter210_current_vs_v6_probe.py
      - app/ocr/multi_lang_ocr.py
      - app/downloader/**
      - app/security.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chapter-probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      CHAPTER_URL: https://asurascans.com/comics/the-return-of-the-crazy-demon-b57aa235/chapter/210
      PROBE_ROOT: benchmark-results/chapter210
      MANGA_DOWNLOAD_WORKERS: "4"
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install downloader and slicer dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests==2.32.3 beautifulsoup4==4.12.3 lxml==5.3.0 Pillow==10.4.0 playwright==1.47.0 fastapi==0.115.0 numpy==1.26.4 opencv-python-headless==4.10.0.84
          python -m playwright install --with-deps chromium

      - name: Download and slice full Asura chapter with project pipeline
        run: |
          python scripts/asura_chapter_action_probe.py "$CHAPTER_URL" --output "$PROBE_ROOT"
          cat "$PROBE_ROOT/chapter_info.json" | python -c 'import json,sys; d=json.load(sys.stdin); print("pages=",d["page_count"],"bytes=",d["total_bytes"],"slices=",d["slice_count"],"max_slice_height=",d["max_slice_height"])'

      - name: Install isolated PaddleOCR 3.x challenger
        run: |
          python -m venv .venv-ppocrv6
          .venv-ppocrv6/bin/python -m pip install --upgrade pip
          .venv-ppocrv6/bin/pip install "paddlepaddle>=3.2,<3.3" "paddleocr==3.7.0"

      - name: Probe PP-OCRv6 small on all production slices
        run: |
          .venv-ppocrv6/bin/python scripts/ppocrv6_chapter_probe.py \
            --selected-file "$PROBE_ROOT/all_slices.txt" \
            --output "$PROBE_ROOT/ppocrv6" \
            --tier small
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("benchmark-results/chapter210/ppocrv6/summary.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          print("PPOCRV6_FINAL", json.dumps({k:v for k,v in d.items() if k != "rows"}, ensure_ascii=False))
          noisy = sorted(d["rows"], key=lambda r: (r["mean_confidence"] is None, r["mean_confidence"] or 0))[:12]
          print("LOWEST_CONFIDENCE_SLICES")
          for row in noisy:
              print("SLICE", Path(row["source"]).name, "regions", row["regions"], "conf", row["mean_confidence"], "low", row["low_confidence_lt_0_65"], "ms", row["latency_ms"])
              print("TEXT", " | ".join(row["texts"][:20]))
          PY

      - name: Install exact current PaddleOCR 2.8 baseline
        run: |
          python -m venv .venv-current-ocr
          .venv-current-ocr/bin/python -m pip install --upgrade pip
          .venv-current-ocr/bin/pip install "numpy==1.26.4" "Pillow==10.4.0" "opencv-python-headless==4.10.0.84" "paddlepaddle==2.6.2" "paddleocr==2.8.1"

      - name: Recheck all chapter regions with production MultiLangOCR
        run: |
          PYTHONPATH=. .venv-current-ocr/bin/python scripts/chapter210_current_vs_v6_probe.py \
            --ppocr-summary "$PROBE_ROOT/ppocrv6/summary.json" \
            --output "$PROBE_ROOT/current_vs_v6"
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("benchmark-results/chapter210/current_vs_v6/summary.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          keys = ["regions_compared","current_init_ms","current_mean_region_latency_ms","current_p95_region_latency_ms","same_normalized_count","same_normalized_rate","disagreement_count","current_blank_count","v6_blank_count","v6_likely_win_review_count","current_likely_win_review_count","current_normalized_chars","v6_normalized_chars","candidate_full_slice_mean_latency_ms","candidate_full_slice_p95_latency_ms"]
          print("CURRENT_VS_V6_FINAL", json.dumps({k:d.get(k) for k in keys}, ensure_ascii=False))
          PY

      - name: Recheck PP-OCRv6 regions with Korean PP-OCRv5 mobile recognizer
        run: |
          .venv-ppocrv6/bin/python scripts/korean_fallback_probe.py \
            --ppocr-summary "$PROBE_ROOT/ppocrv6/summary.json" \
            --output "$PROBE_ROOT/korean_fallback" \
            --v6-low-threshold 0.75
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("benchmark-results/chapter210/korean_fallback/summary.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          keys = ["model", "init_ms", "regions_rechecked", "mean_rec_latency_ms", "p95_rec_latency_ms", "v6_low_conf_candidates", "ko_confidence_improved_count", "hangul_recovered_count"]
          print("KO_FALLBACK_FINAL", json.dumps({k:d.get(k) for k in keys}, ensure_ascii=False))
          for item in d.get("hangul_examples", [])[:20]:
              print("KO_RECOVERED", Path(item["source"]).name, "region", item["region_index"], "v6=", repr(item["v6_text"]), item["v6_score"], "ko=", repr(item["ko_text"]), item["ko_score"], "ms=", item["ko_latency_ms"])
          PY

      - name: Upload downloaded chapter metadata and raw images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapter210-download
          path: |
            benchmark-results/chapter210/raw
            benchmark-results/chapter210/chapter_info.json
            benchmark-results/chapter210/all_slices.txt
          retention-days: 3
          if-no-files-found: warn

      - name: Upload OCR comparison results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapter210-ocr-research
          path: |
            benchmark-results/chapter210/ppocrv6
            benchmark-results/chapter210/current_vs_v6
            benchmark-results/chapter210/korean_fallback
          retention-days: 7
          if-no-files-found: warn
