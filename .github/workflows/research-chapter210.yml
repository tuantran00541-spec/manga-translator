name: Research chapter 210 probe

on:
  push:
    branches:
      - research/paper-gates-ocr-mask-inpaint-20260829
    paths:
      - .github/workflows/research-chapter210.yml
      - scripts/asura_chapter_action_probe.py
      - scripts/ppocrv6_chapter_probe.py
      - app/downloader/**
      - app/security.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chapter-probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      CHAPTER_URL: https://asurascans.com/comics/the-return-of-the-crazy-demon-b57aa235/chapter/210
      PROBE_ROOT: benchmark-results/chapter210
      MANGA_DOWNLOAD_WORKERS: "4"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install downloader dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests==2.32.3 beautifulsoup4==4.12.3 lxml==5.3.0 Pillow==10.4.0 playwright==1.47.0 fastapi==0.115.0
          python -m playwright install --with-deps chromium

      - name: Download full Asura chapter with project downloader
        run: |
          python scripts/asura_chapter_action_probe.py "$CHAPTER_URL" --output "$PROBE_ROOT" --samples 8
          cat "$PROBE_ROOT/chapter_info.json" | python -c 'import json,sys; d=json.load(sys.stdin); print("pages=",d["page_count"],"bytes=",d["total_bytes"],"selected=",d["selected_indices"])'

      - name: Install isolated PaddleOCR 3.x challenger
        run: |
          python -m venv .venv-ppocrv6
          .venv-ppocrv6/bin/python -m pip install --upgrade pip
          .venv-ppocrv6/bin/pip install "paddlepaddle>=3.2,<3.3" "paddleocr==3.7.0" opencv-python-headless

      - name: Probe PP-OCRv6 small on representative pages
        run: |
          .venv-ppocrv6/bin/python scripts/ppocrv6_chapter_probe.py \
            --selected-file "$PROBE_ROOT/selected_pages.txt" \
            --output "$PROBE_ROOT/ppocrv6" \
            --tier small
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("benchmark-results/chapter210/ppocrv6/summary.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          print("PPOCRV6_FINAL", json.dumps({k:v for k,v in d.items() if k != "rows"}, ensure_ascii=False))
          for row in d["rows"]:
              print("PAGE", Path(row["source"]).name, "regions", row["regions"], "conf", row["mean_confidence"], "ms", row["latency_ms"])
              print("TEXT", " | ".join(row["texts"][:20]))
          PY

      - name: Upload downloaded chapter
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapter210-download
          path: |
            benchmark-results/chapter210/raw
            benchmark-results/chapter210/chapter_info.json
            benchmark-results/chapter210/selected_pages.txt
          retention-days: 3
          if-no-files-found: warn

      - name: Upload PP-OCRv6 probe results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapter210-ppocrv6
          path: benchmark-results/chapter210/ppocrv6
          retention-days: 7
          if-no-files-found: warn
