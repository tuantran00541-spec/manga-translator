name: Agent uno bench

# One-off: a small build-from-scratch task on six free chat models of api.unorouter.com (the list came from /v1/models).
on:
  push:
    branches-ignore: [main]
    paths:
      - ".github/workflows/agent-uno.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        model:
          - {id: "glm-5.3-flash:free", slug: glm-5-3-flash}
          - {id: "glm-5.3:free", slug: glm-5-3}
          - {id: "deepseek-v4-flash:free", slug: deepseek-v4-flash}
          - {id: "qwen3.5-122b-a10b:free", slug: qwen3-5-122b}
          - {id: "gemini-3.6-flash:free", slug: gemini-3-6-flash}
          - {id: "minimax-m2.7:free", slug: minimax-m2-7}
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      OUT: audit-results/agent-uno/${{ matrix.model.slug }}
      WORK: /tmp/agent-work
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q -r requirements-test.txt

      - name: Run the task
        env:
          AGENT_API_KEY: ${{ secrets.UNO_ROUTER }}
          MODEL_ID: ${{ matrix.model.id }}
        run: |
          mkdir -p "$OUT" "$WORK/project" "$HOME/.manga-agent"
          echo '{"token_budget": 1500000, "max_steps": 120}' > "$HOME/.manga-agent/profile.json"
          PROMPT='Hãy tạo từ con số 0 một dự án Python nhỏ tên notekeeper: ứng dụng dòng lệnh quản lý ghi chú (thêm, liệt kê, tìm, xóa, gắn tag), lưu bằng file JSON. Có pyproject.toml, bố cục src, test pytest đầy đủ và README. Chạy test cho đến khi xanh hết rồi báo cáo.'
          python -m app.agent.cli exec "$PROMPT" --base "https://api.unorouter.com/v1" --model "$MODEL_ID" \
            --provider uno --workspace "$WORK/project" --mode auto --sandbox workspace-write \
            --timeout-min 25 --json > "$OUT/events.jsonl" 2> "$OUT/stderr.log" || true
          tail -c 600 "$OUT/stderr.log"

      - name: Summarize what happened
        if: always()
        env:
          MODEL_ID: ${{ matrix.model.id }}
        run: |
          python - <<'PY'
          import json, os
          out = os.environ["OUT"]
          rows = []
          for line in open(f"{out}/events.jsonl", encoding="utf-8"):
              try:
                  rows.append(json.loads(line))
              except ValueError:
                  pass
          tools = [r["name"] for r in rows if r.get("type") == "tool"]
          result = next((r for r in reversed(rows) if r.get("type") == "result"), {})
          final = next((r["text"] for r in reversed(rows) if r.get("type") == "assistant" and r.get("text")), "")
          summary = {"model": os.environ.get("MODEL_ID"), "status": result.get("status"), "usage": result.get("usage"), "stats": result.get("stats"),
                     "steps": sum(r.get("type") == "assistant" for r in rows), "tool_counts": {n: tools.count(n) for n in sorted(set(tools))},
                     "failed_tools": [(r["name"], r["output"][:140]) for r in rows if r.get("type") == "tool" and not r.get("ok")][:30],
                     "errors": [r["text"][:200] for r in rows if r.get("type") == "error"],
                     "notices": [r["text"][:160] for r in rows if r.get("type") == "notice"][:40]}
          open(f"{out}/summary.json", "w", encoding="utf-8").write(json.dumps(summary, ensure_ascii=False, indent=1))
          open(f"{out}/answer.md", "w", encoding="utf-8").write(final)
          print(json.dumps({k: v for k, v in summary.items() if k not in ("notices", "failed_tools")}, ensure_ascii=False))
          PY

      - name: Check the project the agent built
        if: always()
        run: |
          cd "$WORK/project"
          find . -type f -not -path './.git/*' -not -path '*/__pycache__/*' | sort | tee "$GITHUB_WORKSPACE/$OUT/files.txt" | head -40
          (python -m pip install -q -e . pytest && python -m pytest -q -p no:cacheprovider 2>&1 | tail -15) | tee "$GITHUB_WORKSPACE/$OUT/project-pytest.txt" || true

      - name: Give git access only now that the agent is done
        if: always()
        env:
          TOKEN: ${{ github.token }}
        run: |
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"

      - uses: ./.github/actions/save-evidence
        if: always()
        with:
          paths: audit-results/agent-uno/${{ matrix.model.slug }}
          message: "audit: Agent uno ${{ matrix.model.slug }} (run ${{ github.run_id }})"
