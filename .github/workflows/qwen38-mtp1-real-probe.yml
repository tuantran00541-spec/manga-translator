name: Qwen3.8 real MTP-1 acceptance probe

on:
  push:
    branches: [research/qwen3.8-27b-runtime-finish]
    paths:
      - "research/qwen38/qwen38_mtp1_real_probe.py"
      - "research/qwen38/qwen38_mtp_quant_runtime.py"
      - "research/qwen38/gguf_quant_q4_avx2.c"
      - ".github/workflows/qwen38-mtp1-real-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  HF_HUB_DISABLE_TELEMETRY: "1"
  QWEN_REVISION: "1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0"

jobs:
  mtp1-probe:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[qwen-mtp]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Exact kernel and MTP probe sanity gates
        shell: bash
        run: |
          set -euo pipefail
          cc -O3 -std=c11 -mavx2 -fno-fast-math -ffp-contract=off \
            -DQWEN_AVX2_EXACT_SELFTEST research/qwen38/gguf_quant_dot_avx2.c -lm \
            -o "$RUNNER_TEMP/qwen-avx2-selftest"
          "$RUNNER_TEMP/qwen-avx2-selftest"
          cc -O3 -std=c11 -mavx2 -fno-fast-math -ffp-contract=off \
            -DQWEN_Q4_AVX2_EXACT_SELFTEST research/qwen38/gguf_quant_q4_avx2.c -lm \
            -o "$RUNNER_TEMP/qwen-q4-selftest"
          "$RUNNER_TEMP/qwen-q4-selftest"
          PYTHONPATH=research/qwen38 python -u research/qwen38/qwen38_mtp_quant_runtime.py
          PYTHONPATH=research/qwen38 python -u research/qwen38/qwen38_mtp1_real_probe.py sanity

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Runner CPU and storage information
        shell: bash
        run: |
          lscpu
          df -h
          free -h

      - name: Reclaim disk
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true
          docker system prune -af || true
          df -h
          free -h

      - name: Install runtime dependencies
        run: python -m pip install --no-cache-dir huggingface_hub hf_xet tokenizers

      - name: Download pinned real GGUF and tokenizer once
        shell: bash
        run: |
          set -euo pipefail
          readarray -t files < <(python - <<'PY'
          from huggingface_hub import hf_hub_download
          rev="1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0"
          print(hf_hub_download(
              "bartowski/Qwen3.8-27B-GGUF",
              filename="Qwen3.8-27B-Q6_K_L.gguf",
              local_dir="${{ runner.temp }}/qwen38-model",
          ))
          print(hf_hub_download(
              "Qwen/Qwen3.8-27B",
              filename="tokenizer.json",
              revision=rev,
              local_dir="${{ runner.temp }}/qwen38-tokenizer",
          ))
          PY
          )
          test -f "${files[0]}"; test -f "${files[1]}"
          echo "MODEL=${files[0]}" >> "$GITHUB_ENV"
          echo "TOKENIZER_JSON=${files[1]}" >> "$GITHUB_ENV"
          echo "K3_WORK=$RUNNER_TEMP/qwen38-mtp1-k3-work" >> "$GITHUB_ENV"
          echo "EVIDENCE=$RUNNER_TEMP/qwen38-mtp1-evidence" >> "$GITHUB_ENV"

      - name: Validate pinned decoder inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          PYTHONPATH=research/qwen38 python -u research/qwen38/qwen35_gguf_decoder_contract.py real \
            --model "$MODEL" --output "$EVIDENCE/inventory.json" \
            2>&1 | tee "$EVIDENCE/inventory.log"

      - name: Compile exact target, Q4 and recurrent-state bridges
        shell: bash
        run: |
          set -euo pipefail
          cc -O3 -std=c11 -mavx2 -fno-fast-math -ffp-contract=off -fPIC -shared \
            research/qwen38/gguf_quant_dot_avx2.c -lm \
            -o "$RUNNER_TEMP/libqwen_quant_avx2.so"
          cc -O3 -std=c11 -mavx2 -fno-fast-math -ffp-contract=off -fPIC -shared \
            research/qwen38/gguf_quant_q4_avx2.c -lm \
            -o "$RUNNER_TEMP/libqwen_mtp_q4.so"
          cc -O2 -std=c11 -fPIC -shared research/qwen38/gdn_state_ar.c -lm \
            -o "$RUNNER_TEMP/libqwen_gdn_serial.so"

      - name: Run real MTP-1 acceptance probe against exact target
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$K3_WORK" "$EVIDENCE"
          PYTHONPATH=research/qwen38 python -u research/qwen38/qwen38_mtp1_real_probe.py run \
            --model "$MODEL" \
            --target-native-lib "$RUNNER_TEMP/libqwen_quant_avx2.so" \
            --q4-native-lib "$RUNNER_TEMP/libqwen_mtp_q4.so" \
            --state-lib "$RUNNER_TEMP/libqwen_gdn_serial.so" \
            --inventory "$EVIDENCE/inventory.json" \
            --tokenizer-json "$TOKENIZER_JSON" \
            --prompt "Hi" --raw-prompt --max-prompt-tokens 4 \
            --work-dir "$K3_WORK" \
            --output "$EVIDENCE/mtp1-probe.json" \
            2>&1 | tee "$EVIDENCE/mtp1-probe.log"
          grep -F "QWEN38_MTP1_REAL_PROBE_PASS" "$EVIDENCE/mtp1-probe.log"

      - name: Summarize MTP-1 evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ["EVIDENCE"])/"mtp1-probe.json"
          r=json.loads(p.read_text(encoding="utf-8"))
          assert r["status"] == "PASS"
          assert r["model_sha256"] == "a487690b9f17de581857c4ae484dab50800335bb9eb978a4fb02c0465629dc0a"
          assert r["prompt_token_count"] == 1
          assert r["mtp"]["resident_mtp_weight_bytes"] > 200_000_000
          assert r["global_lm_head_bytes"] == 1_350_860_800
          print("QWEN38_MTP1_REAL_SEMANTIC_PROBE_PASS")
          print(json.dumps({
              "first_target_token": r["first_target_token"],
              "mtp_draft_token": r["mtp_draft_token"],
              "target_verify_token": r["target_verify_token"],
              "mtp1_accepted": r["mtp1_accepted"],
              "mtp_catchup_seconds": r["mtp_catchup_seconds"],
              "mtp_draft_seconds": r["mtp_draft_seconds"],
              "mtp_lm_head_seconds": r["mtp_lm_head_seconds"],
              "resident_mtp_weight_bytes": r["mtp"]["resident_mtp_weight_bytes"],
              "q4_weight_bytes_executed": r["mtp"]["quant"]["q4_weight_bytes"],
              "max_rss_gib": r["max_rss_gib"],
          }, indent=2))
          PY

      - name: Upload compact MTP-1 evidence
        uses: actions/upload-artifact@v4
        with:
          name: qwen38-mtp1-real-${{ github.run_id }}
          path: ${{ runner.temp }}/qwen38-mtp1-evidence/
          retention-days: 14
