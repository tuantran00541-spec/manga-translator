name: Temporary v0.3 UI finalizer

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v03-ui-snapshot-sync.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - name: Checkout control script
        uses: actions/checkout@v4
        with:
          ref: main
          path: control

      - name: Checkout feature target
        uses: actions/checkout@v4
        with:
          ref: feat/v03-workstation-ui
          path: target
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply deterministic UI finalizer
        run: |
          test "$(git -C target rev-parse HEAD)" = "0003e10e064ee88731ce00847b88b00207cc574f"
          python control/.github/scripts/finalize_v03_ui.py target
          git -C target diff --check
          for f in target/app/static/js/*.js; do node --check "$f" >/dev/null; done
          python -m compileall -q target/app target/tests

      - name: Install test dependencies
        working-directory: target
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest httpx

      - name: Run full feature regression
        working-directory: target
        run: python -m pytest -q

      - name: Commit finalized UI to feature branch
        working-directory: target
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/static/css app/static/js app/templates/index.html tests
          git commit -m "refactor(v0.3-ui): finalize layered workstation CSS"
          git push origin HEAD:feat/v03-workstation-ui
