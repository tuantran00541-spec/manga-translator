name: YOLO26 gate teacher A/B

on:
  workflow_dispatch:
  push:
    branches: ["experiment/one-shot-yolo26"]
    paths:
      - .github/workflows/yolo26-gate-teacher-ab.yml

permissions:
  contents: read
  actions: read

jobs:
  gate:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
      CHAPTER_URL: "https://asurascans.com/comics/shadow-slave-6f7fe6eb/chapter/1"
      ROOT: "benchmark-results/yolo26-gate"
      RAW_DIR: "benchmark-results/yolo26-gate/raw"
      SLICE_DIR: "benchmark-results/yolo26-gate/slices"
      STUDENT_DIR: "benchmark-results/yolo26-gate/student"
      MANGA_ORT_PROVIDER: cpu

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime only
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple torch==2.8.0+cpu torchvision==0.23.0+cpu
          python -m pip install ultralytics==8.4.156 onnxruntime==1.24.1
          python -m pip install numpy==1.26.4 Pillow==10.4.0 opencv-contrib-python==4.10.0.84 psutil==6.1.1 loguru==0.7.2 requests==2.32.3 beautifulsoup4==4.12.3 lxml==5.3.0 playwright==1.47.0 fastapi==0.115.0 pydantic==2.9.2 filelock==3.16.1 threadpoolctl==3.6.0

      - name: Restore teacher model
        id: models
        uses: actions/cache@v4
        with:
          path: |
            models/*.onnx
            models/.e2e-provenance.json
          key: processing-profile-models-b224548-v1

      - name: Read pinned teacher provisioner
        if: ${{ steps.models.outputs.cache-hit != 'true' }}
        uses: actions/checkout@v4
        with:
          ref: b22454827f8190655d7070b80eb20c2550beadfa
          path: benchmark-bootstrap
          sparse-checkout: scripts/provision_real_e2e_models.py
          sparse-checkout-cone-mode: false

      - name: Provision teacher on cache miss
        if: ${{ steps.models.outputs.cache-hit != 'true' }}
        run: |
          python benchmark-bootstrap/scripts/provision_real_e2e_models.py
          cp benchmark-bootstrap/models/*.onnx models/
          cp benchmark-bootstrap/models/.e2e-provenance.json models/

      - name: Download frozen YOLO26 checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$STUDENT_DIR"
          gh run download 35516657301             --repo "$GITHUB_REPOSITORY"             --name yolo26-text-distill             --dir "$STUDENT_DIR"
          test -f "$STUDENT_DIR/yolo26-text-seg.onnx"

      - name: Download and slice full chapter
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from app.downloader.registry import download_chapter
          from app.downloader.slicer import slice_image

          raw = Path(os.environ["RAW_DIR"])
          slc = Path(os.environ["SLICE_DIR"])
          raw.mkdir(parents=True, exist_ok=True)
          slc.mkdir(parents=True, exist_ok=True)

          paths = download_chapter(os.environ["CHAPTER_URL"], raw)
          slices = []
          for i, path in enumerate(sorted(paths)):
              recs = slice_image(path, slc, f"{i:03d}", return_metadata=True)
              slices.extend(Path(r["path"]) for r in recs)
          print("slices", len(slices))
          PY

      - name: Measure YOLO26 empty-gate safety at conf 0.02
        run: |
          python - <<'PY'
          import json, os, statistics, time
          from pathlib import Path
          from ultralytics import YOLO

          from app.image_io import read_image
          from app.one_shot_cleanup import OneShotTextMaskDetector

          slices = sorted(Path(os.environ["SLICE_DIR"]).glob("*.png"))
          model = YOLO(str(Path(os.environ["STUDENT_DIR"]) / "yolo26-text-seg.onnx"), task="segment")
          teacher = OneShotTextMaskDetector()
          conf = 0.02

          rows = []
          yolo_times = []
          teacher_times = []

          for idx, path in enumerate(slices):
              t0 = time.perf_counter()
              pred = model.predict(
                  source=str(path), imgsz=1024, conf=conf, iou=0.7,
                  device="cpu", verbose=False, retina_masks=False, max_det=300,
              )[0]
              yolo_ms = (time.perf_counter()-t0)*1000.0
              yolo_times.append(yolo_ms)
              proposals = 0 if pred.boxes is None else len(pred.boxes)

              image = read_image(path)
              t0 = time.perf_counter()
              boxes, metrics = teacher.detect(image)
              teacher_ms = (time.perf_counter()-t0)*1000.0
              teacher_times.append(teacher_ms)

              rows.append({
                  "index": idx,
                  "file": path.name,
                  "yolo_proposals": proposals,
                  "teacher_boxes": len(boxes),
                  "teacher_mask_positive": bool(boxes),
                  "yolo_empty": proposals == 0,
                  "teacher_ms": teacher_ms,
                  "yolo_ms": yolo_ms,
              })

          skipped = [r for r in rows if r["yolo_empty"]]
          false_skips = [r for r in skipped if r["teacher_mask_positive"]]
          true_skips = [r for r in skipped if not r["teacher_mask_positive"]]

          teacher_total = sum(teacher_times)
          hybrid_est = sum(yolo_times) + sum(r["teacher_ms"] for r in rows if not r["yolo_empty"])

          report = {
              "conf": conf,
              "slice_count": len(rows),
              "yolo_empty_slices": len(skipped),
              "safe_true_empty_skips": len(true_skips),
              "false_skip_teacher_positive": len(false_skips),
              "false_skip_indices": [r["index"] for r in false_skips],
              "false_skip_files": [r["file"] for r in false_skips],
              "teacher_median_ms": statistics.median(teacher_times),
              "yolo_median_ms": statistics.median(yolo_times),
              "teacher_total_ms": teacher_total,
              "hybrid_estimated_total_ms": hybrid_est,
              "hybrid_estimated_speedup": teacher_total / max(1.0, hybrid_est),
              "teacher_calls_baseline": len(rows),
              "teacher_calls_hybrid": len(rows) - len(skipped),
              "rows": rows,
          }
          out = Path(os.environ["ROOT"]) / "gate-report.json"
          out.write_text(json.dumps(report, indent=2) + "\n")

          print(json.dumps({k:v for k,v in report.items() if k!="rows"}, indent=2))
          if false_skips:
              print("FALSE SKIPS")
              print(json.dumps(false_skips, indent=2))

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("## YOLO26 empty-gate vs teacher\n\n")
              f.write(f"- YOLO conf: {conf}\n")
              f.write(f"- slices: {len(rows)}\n")
              f.write(f"- YOLO-empty slices: {len(skipped)}\n")
              f.write(f"- safe teacher-empty skips: {len(true_skips)}\n")
              f.write(f"- FALSE skips (teacher positive): {len(false_skips)}\n")
              f.write(f"- teacher calls: {len(rows)} -> {len(rows)-len(skipped)}\n")
              f.write(f"- teacher median: {statistics.median(teacher_times):.2f} ms\n")
              f.write(f"- YOLO median: {statistics.median(yolo_times):.2f} ms\n")
              f.write(f"- estimated hybrid speedup: {report['hybrid_estimated_speedup']:.3f}x\n")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yolo26-gate-teacher-ab
          path: benchmark-results/yolo26-gate/gate-report.json
          retention-days: 7
