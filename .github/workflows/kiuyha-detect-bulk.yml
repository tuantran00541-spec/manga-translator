name: Kiuyha detect bulk

# 100 chapters x 2 models: the committed yolo26s soup (R8+R6) vs the run-8
# single. Per chapter: download once, rejoin strips, slice, detect every
# slice with both models. Detection only; raw/strip/slice files are deleted
# per chapter. The soup model is committed in this directory — no in-job
# mixing, no md5 gate (YOLO save bytes are not reproducible across saves).
on:
  push:
    branches-ignore: [main]
    paths:
      - ".github/workflows/kiuyha-detect-bulk.yml"
      - ".github/detect-bulk/**"

permissions:
  contents: write
  actions: read

env:
  PYTHONPATH: "."

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ultralytics on CPU torch + app downloader deps
        run: |
          python -m pip install --only-binary :all: numpy==1.26.4 Pillow==10.4.0 opencv-contrib-python==4.10.0.84 \
            loguru==0.7.2 requests==2.32.3 beautifulsoup4==4.12.3 lxml==5.3.0 playwright==1.47.0 \
            fastapi==0.115.0 pydantic==2.9.2
          python -m playwright install --with-deps chromium
          python -m pip install --only-binary :all: torch==2.14.1 torchvision==0.29.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --only-binary :all: ultralytics==8.4.164
          python -m pip uninstall -y opencv-python opencv-python-headless || true
          python -m pip install --force-reinstall --no-deps opencv-contrib-python==4.10.0.84
      - name: Detect shard (soup + run-8 single)
        run: |
          python .github/detect-bulk/run.py --chapters .github/detect-bulk/chapters100.jsonl \
            --shard ${{ matrix.shard }} --shards 4 \
            --model-soup .github/detect-bulk/soup-s-top2-r8-r6.pt \
            --model-r8 .github/detect-bulk/yolo26s-r8.pt \
            --out stats.jsonl --samples samples
      - name: Upload shard stats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kiuyha-detect-100-shard-${{ matrix.shard }}
          path: |
            stats.jsonl
            samples
          retention-days: 30
