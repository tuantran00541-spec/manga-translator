name: Qwen3.8 real Q6 GGUF K3 storage gate

on:
  push:
    branches: [test/qwen3.8-27b]
    paths:
      - "research/qwen38/gguf_k3_real_layout_gate.py"
      - "research/qwen38/gguf_k3_layout.py"
      - "research/qwen38/gguf_stream.py"
      - "research/qwen38/k3_stream.py"
      - ".github/workflows/qwen38-gguf-k3-real-layout.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-q6-storage:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[qwen-gguf-k3-real]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reclaim disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true
          docker system prune -af || true
          df -h
          free -h
      - name: Install download dependency
        run: python -m pip install --no-cache-dir huggingface_hub hf_xet
      - name: Compile gate
        run: |
          python -m py_compile \
            research/qwen38/gguf_stream.py \
            research/qwen38/k3_stream.py \
            research/qwen38/gguf_k3_layout.py \
            research/qwen38/gguf_k3_real_layout_gate.py
      - name: Run real Q6 storage integration gate
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/qwen38-real-layout"
          evidence="$RUNNER_TEMP/qwen38-real-layout-evidence"
          mkdir -p "$work" "$evidence"
          /usr/bin/time -v python -u research/qwen38/gguf_k3_real_layout_gate.py \
            --work-dir "$work" \
            --output "$evidence/layout.json" \
            2>&1 | tee "$evidence/layout.log"
      - name: Show evidence and cleanup
        if: always()
        run: |
          cat "$RUNNER_TEMP/qwen38-real-layout-evidence/layout.json" || true
          tail -n 160 "$RUNNER_TEMP/qwen38-real-layout-evidence/layout.log" || true
          rm -rf "$RUNNER_TEMP/qwen38-real-layout" || true
          df -h
          free -h
      - name: Upload metrics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen38-real-q6-layout-${{ github.run_id }}
          path: ${{ runner.temp }}/qwen38-real-layout-evidence/
          if-no-files-found: warn
          retention-days: 14
