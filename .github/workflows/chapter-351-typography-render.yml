name: Chapter 351 Checkpoint 05 Typography Render Candidate

on:
  push:
    branches:
      - chapter/logging-10000-years-into-the-future-351
    paths:
      - .github/workflows/chapter-351-typography-render.yml
      - chapters/logging-10000-years-into-the-future-351/run_typography_render.py
      - chapters/logging-10000-years-into-the-future-351/run_typography_review_repair.py
      - chapters/logging-10000-years-into-the-future-351/typography-review-repair.json
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: chapter-351-human-loop
  cancel-in-progress: false

jobs:
  typography-render:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      TRANSLATION_RUN_ID: "34725698624"
      TRANSLATION_ARTIFACT: 04-translation-reviewed-c3513510
      CLEAN_RUN_ID: "34700955145"
      CLEAN_ARTIFACT: 02-clean-review-c3513510
      REPAIR_RUN_ID: "34702416332"
      REPAIR_ARTIFACT: 02b-clean-local-repair-c3513510
      LOGO_RUN_ID: "34703327058"
      LOGO_ARTIFACT: 02c-clean-logo-repair-c3513510

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lightweight render dependencies
        run: 'python -m pip install --only-binary=:all: Pillow==10.4.0 numpy==1.26.4 fonttools==4.59.2'

      - name: Restore approved checkpoints
        run: |
          rm -rf checkpoint/04-translation checkpoint/02-clean checkpoint/02b-repair checkpoint/02c-logo checkpoint/05-render data/processed/c3513510
          mkdir -p checkpoint/04-translation checkpoint/02-clean checkpoint/02b-repair checkpoint/02c-logo checkpoint/05-render
          gh run download "$TRANSLATION_RUN_ID" -n "$TRANSLATION_ARTIFACT" -D checkpoint/04-translation
          gh run download "$CLEAN_RUN_ID" -n "$CLEAN_ARTIFACT" -D checkpoint/02-clean
          gh run download "$REPAIR_RUN_ID" -n "$REPAIR_ARTIFACT" -D checkpoint/02b-repair
          gh run download "$LOGO_RUN_ID" -n "$LOGO_ARTIFACT" -D checkpoint/02c-logo
          test -f checkpoint/04-translation/translated-manifest.json
          test -f checkpoint/04-translation/translation-review-summary.json
          test -d checkpoint/02-clean/processed
          test -d checkpoint/02b-repair/overlay/processed
          test -d checkpoint/02c-logo/overlay/processed

      - name: Apply human typography review repair and rerender
        run: PYTHONPATH=. python chapters/logging-10000-years-into-the-future-351/run_typography_review_repair.py

      - name: Verify candidate contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image

          root = Path("checkpoint/05-render")
          typography = json.loads((root / "typography-summary.json").read_text(encoding="utf-8"))
          render = json.loads((root / "render-summary.json").read_text(encoding="utf-8"))
          repair = json.loads((root / "typography-review-repair-applied.json").read_text(encoding="utf-8"))
          plan = json.loads((root / "typography-plan.json").read_text(encoding="utf-8"))

          if typography.get("normal_dialogue_font") != "Mac-dinh-3":
              raise SystemExit("normal dialogue font drifted from Mac-dinh-3")
          if typography.get("autosize_active_objects") != 0 or typography.get("hard_min_font_size") != 28:
              raise SystemExit(f"typography contract failed: {typography}")
          if typography.get("font_fallback_count") != 0:
              raise SystemExit(f"font fallback remains after human repair: {typography}")
          if len(plan) != 71 or min(row["font_size"] for row in plan) < 28:
              raise SystemExit("fixed typography plan invalid")
          if render.get("rendered_story_objects") != 71 or render.get("rendered_slices") != 40 or render.get("source_pages") != 11:
              raise SystemExit(f"render counts invalid: {render}")
          if render.get("status") != "REVIEW_REQUIRED" or repair.get("status") != "RERENDERED_REVIEW_REQUIRED":
              raise SystemExit("candidate must stop for human visual review")

          pages = sorted((root / "final_pages").glob("*.png"))
          if len(pages) != 11:
              raise SystemExit(f"expected 11 final candidate pages, got {len(pages)}")
          for page in pages:
              with Image.open(page) as image:
                  if image.width <= 0 or image.height <= 0:
                      raise SystemExit(f"invalid rendered page dimensions: {page} {image.size}")
          print("repaired candidate contract PASS; human visual review still required")
          PY

      - name: Upload typography and render candidate
        uses: actions/upload-artifact@v4
        with:
          name: 05-render-candidate-c3513510
          path: checkpoint/05-render/
          retention-days: 7
          if-no-files-found: error
