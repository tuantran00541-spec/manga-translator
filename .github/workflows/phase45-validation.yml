name: phase45-render-export-validation

on:
  push:
    branches:
      - phase-4-5-render-export

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install pinned test dependencies
        run: |
          python -m pip install \
            pytest==8.3.5 \
            fastapi==0.115.0 \
            pydantic==2.9.2 \
            requests==2.32.3 \
            httpx==0.28.1 \
            beautifulsoup4==4.12.3 \
            lxml==5.3.0 \
            playwright==1.47.0 \
            python-multipart==0.0.12 \
            Pillow==10.4.0 \
            numpy==1.26.4 \
            opencv-python-headless==4.10.0.84 \
            onnxruntime==1.21.0 \
            filelock==3.16.1 \
            loguru==0.7.2 \
            keyring==25.6.0 \
            psutil==6.1.1
      - name: Prepare runtime directories
        run: mkdir -p logs data/raw data/processed data/output models
      - name: Check render client JavaScript syntax
        run: node --check app/static/js/api.js
      - name: Run Phase 4.5 focused regression
        run: |
          python -m pytest -q \
            tests/test_phase45_render_export.py \
            tests/test_phase4_correctness_foundation.py \
            tests/test_phase41_data_model.py \
            tests/test_phase44_ocr_routes.py
      - name: Run full regression suite
        run: |
          python -m pytest -q \
            --deselect=tests/test_inpaint_benchmark.py::TestInpaintBenchmarkFinalTrustClosure::test_01_prod_and_model_integrity_real_files_pass \
            --deselect=tests/test_inpaint_benchmark.py::TestInpaintBenchmarkFinalTrustClosure::test_02_prod_integrity_mutate_one_byte_fails
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run Phase 4.5 Chromium smoke
        run: python tests/browser_phase45_render_export.py
