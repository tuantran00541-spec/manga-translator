name: Apply backend Phase 2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/phase2-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply Phase 2 patch
        run: |
          python scripts/phase2_apply.py
          python - <<'PY'
          from pathlib import Path
          for name in ("app/routers/render_commit.py", "app/routers/export.py"):
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              if text.startswith("from __future__ import annotations\n\nimport os\n"):
                  text = text.replace("from __future__ import annotations\n\nimport os\n", "from __future__ import annotations\n\n", 1)
              path.write_text(text, encoding="utf-8")
          PY
      - name: Compile Phase 2 source
        run: >-
          python -m py_compile app/model_contracts.py app/detector/bubble_detector.py
          app/detector/combined_detector.py app/inpaint/lama_inpainter.py
          app/routers/render_commit.py app/routers/export.py scripts/backend_foundation_sanity.py
      - name: Install deterministic test runtime
        run: >-
          python -m pip install
          numpy==1.26.4 Pillow==10.4.0 opencv-contrib-python==4.10.0.84
          fastapi==0.115.0 pydantic==2.9.2 filelock==3.16.1 loguru==0.7.2
      - name: Run Phase 2 acceptance fixtures
        run: python scripts/backend_foundation_sanity.py
      - name: Commit Phase 2 production code
        shell: bash
        run: |
          git config user.name "Manga backend CI"
          git config user.email "actions@users.noreply.github.com"
          git add app/model_contracts.py app/detector/bubble_detector.py app/detector/combined_detector.py app/inpaint/lama_inpainter.py app/routers/render_commit.py app/routers/export.py scripts/backend_foundation_sanity.py
          git commit -m "fix(detector): establish geometry and model contracts"
          git push origin HEAD:main
