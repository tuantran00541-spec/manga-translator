name: Apply backend Phase 2

on:
  push:
    branches: [main]
    paths: [.github/workflows/phase2-apply.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Add explicit model contracts
        shell: bash
        run: |
          cat > app/model_contracts.py <<'PY'
          from __future__ import annotations
          from dataclasses import dataclass
          import numpy as np

          FLOAT_TENSOR = "tensor(float)"

          def _shape(meta) -> tuple:
              return tuple(meta.shape)

          def _is_dynamic(value) -> bool:
              return value is None or isinstance(value, str)

          def _check_float(meta, label: str) -> None:
              if getattr(meta, "type", None) != FLOAT_TENSOR:
                  raise ValueError(f"{label} must be {FLOAT_TENSOR}; got {getattr(meta, 'type', None)!r}")

          @dataclass(frozen=True)
          class DetectorModelContract:
              role: str
              input_name: str
              input_height: int
              input_width: int
              class_names: tuple[str, ...]
              provides_prototypes: bool
              destructive_text_mask: bool

          def validate_detector_session(session, *, role: str, configured_input_size: int) -> DetectorModelContract:
              specs = {
                  "bubble_detector": (("text_bubble", "text_free"), False, False),
                  "text_segmenter": (("text_comic",), True, True),
              }
              if role not in specs:
                  raise ValueError(f"Unknown detector model role: {role!r}")
              inputs = list(session.get_inputs())
              outputs = list(session.get_outputs())
              if len(inputs) != 1:
                  raise ValueError(f"{role} requires exactly one input; got {len(inputs)}")
              inp = inputs[0]
              if inp.name != "images":
                  raise ValueError(f"{role} input must be named 'images'; got {inp.name!r}")
              _check_float(inp, f"{role} input")
              shape = _shape(inp)
              if len(shape) != 4 or shape[0] != 1 or shape[1] != 3:
                  raise ValueError(f"{role} input must be NCHW [1,3,H,W]; got {shape}")
              if not all(isinstance(v, int) and v > 0 for v in shape[2:4]):
                  raise ValueError(f"{role} detector spatial shape must be static; got {shape}")
              h, w = int(shape[2]), int(shape[3])
              if h != w or h != int(configured_input_size):
                  raise ValueError(f"{role} model is {w}x{h}, incompatible with DETECTOR_INPUT_SIZE={configured_input_size}")
              output_by_name = {item.name: item for item in outputs}
              if "output0" not in output_by_name:
                  raise ValueError(f"{role} is missing output0")
              _check_float(output_by_name["output0"], f"{role} output0")
              detection_shape = _shape(output_by_name["output0"])
              if len(detection_shape) != 3 or detection_shape[0] != 1:
                  raise ValueError(f"{role} output0 must be rank-3 batch 1; got {detection_shape}")
              class_names, needs_proto, destructive = specs[role]
              expected_features = 4 + len(class_names) + (32 if needs_proto else 0)
              if detection_shape[1] != expected_features:
                  raise ValueError(f"{role} output0 feature count must be {expected_features}; got {detection_shape}")
              if needs_proto:
                  proto = output_by_name.get("output1")
                  if proto is None:
                      raise ValueError("text_segmenter requires output1 mask prototypes")
                  _check_float(proto, "text_segmenter output1")
                  proto_shape = _shape(proto)
                  if len(proto_shape) != 4 or proto_shape[0] != 1 or proto_shape[1] != 32:
                      raise ValueError(f"text_segmenter prototype shape must be [1,32,H,W]; got {proto_shape}")
              elif len(outputs) != 1:
                  raise ValueError("bubble_detector contract is detection-only and must not expose implicit mask authority")
              return DetectorModelContract(role, inp.name, h, w, class_names, needs_proto, destructive)

          @dataclass(frozen=True)
          class LamaModelContract:
              dynamic: bool
              image_input_name: str
              mask_input_name: str
              output_name: str
              output_range: str
              mask_value_for_inpaint: float = 1.0

          def _check_lama_tensor(meta, *, name: str, channels: int) -> tuple:
              if meta.name != name:
                  raise ValueError(f"LaMa tensor must be named {name!r}; got {meta.name!r}")
              _check_float(meta, f"LaMa {name}")
              shape = _shape(meta)
              if len(shape) != 4 or shape[1] != channels:
                  raise ValueError(f"LaMa {name} must be NCHW with {channels} channels; got {shape}")
              if not (_is_dynamic(shape[0]) or shape[0] == 1):
                  raise ValueError(f"LaMa {name} batch must be symbolic or 1; got {shape[0]!r}")
              return shape

          def validate_lama_session(session, *, dynamic: bool, fixed_size: int = 512) -> LamaModelContract:
              inputs = {item.name: item for item in session.get_inputs()}
              if set(inputs) != {"image", "mask"}:
                  raise ValueError(f"LaMa inputs must be exactly image/mask; got {sorted(inputs)}")
              image_shape = _check_lama_tensor(inputs["image"], name="image", channels=3)
              mask_shape = _check_lama_tensor(inputs["mask"], name="mask", channels=1)
              if dynamic:
                  if not all(_is_dynamic(v) for v in image_shape[2:4]) or not all(_is_dynamic(v) for v in mask_shape[2:4]):
                      raise ValueError(f"Dynamic LaMa requires symbolic spatial inputs; got image={image_shape}, mask={mask_shape}")
                  output_name, output_range = "inpainted", "zero_to_one"
              else:
                  expected = (int(fixed_size), int(fixed_size))
                  if tuple(image_shape[2:4]) != expected or tuple(mask_shape[2:4]) != expected:
                      raise ValueError(f"Fixed LaMa requires {fixed_size}x{fixed_size} spatial inputs; got image={image_shape}, mask={mask_shape}")
                  output_name, output_range = "output", "zero_to_255"
              outputs = {item.name: item for item in session.get_outputs()}
              if set(outputs) != {output_name}:
                  raise ValueError(f"LaMa output must be exactly {output_name!r}; got {sorted(outputs)}")
              out = outputs[output_name]
              _check_float(out, f"LaMa {output_name}")
              out_shape = _shape(out)
              if len(out_shape) != 4 or out_shape[1] != 3 or not (_is_dynamic(out_shape[0]) or out_shape[0] == 1):
                  raise ValueError(f"LaMa output must be NCHW RGB; got {out_shape}")
              return LamaModelContract(bool(dynamic), "image", "mask", output_name, output_range)

          def decode_lama_output(output, contract: LamaModelContract) -> np.ndarray:
              arr = np.asarray(output)
              if arr.ndim != 4 or arr.shape[0] != 1 or arr.shape[1] != 3:
                  raise ValueError(f"LaMa runtime output must have shape [1,3,H,W]; got {arr.shape}")
              if not np.isfinite(arr).all():
                  raise ValueError("LaMa runtime output contains non-finite values")
              lo, hi = float(arr.min()), float(arr.max())
              eps = 1e-3
              if contract.output_range == "zero_to_one":
                  if lo < -eps or hi > 1.0 + eps:
                      raise ValueError(f"Normalized LaMa output out of range: [{lo}, {hi}]")
                  arr = arr * 255.0
              elif contract.output_range == "zero_to_255":
                  if lo < -eps or hi > 255.0 + eps:
                      raise ValueError(f"Byte-range LaMa output out of range: [{lo}, {hi}]")
              else:
                  raise ValueError(f"Unknown LaMa output range contract: {contract.output_range}")
              return np.clip(arr[0].transpose(1, 2, 0), 0, 255).astype(np.uint8)
          PY
      - name: Apply half-open detector geometry and explicit roles
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/detector/bubble_detector.py'); s=p.read_text(encoding='utf-8')
          s=s.replace('from app.ort_utils import make_session\n','from app.ort_utils import make_session\nfrom app.model_contracts import validate_detector_session\n',1)
          marker='@dataclass\nclass BubbleBox:\n'
          insert='''@dataclass(frozen=True)\nclass LetterboxTransform:\n    src_w: int\n    src_h: int\n    input_w: int\n    input_h: int\n    resized_w: int\n    resized_h: int\n    pad_x: int\n    pad_y: int\n    scale_x: float\n    scale_y: float\n    offset_x: int = 0\n    offset_y: int = 0\n\n    @classmethod\n    def create(cls, src_w: int, src_h: int, input_w: int, input_h: int, *, offset_x: int = 0, offset_y: int = 0):\n        if min(src_w, src_h, input_w, input_h) <= 0:\n            raise ValueError(\"Letterbox dimensions must be positive\")\n        nominal = min(input_w / src_w, input_h / src_h)\n        resized_w = max(1, min(input_w, int(src_w * nominal)))\n        resized_h = max(1, min(input_h, int(src_h * nominal)))\n        pad_x = (input_w - resized_w) // 2\n        pad_y = (input_h - resized_h) // 2\n        return cls(src_w, src_h, input_w, input_h, resized_w, resized_h, pad_x, pad_y, resized_w / src_w, resized_h / src_h, int(offset_x), int(offset_y))\n\n    def page_box_from_canvas(self, canvas_box) -> tuple[int, int, int, int]:\n        import math\n        x1,y1,x2,y2=(float(v) for v in canvas_box)\n        lx1=max(0.0,min(float(self.src_w),(x1-self.pad_x)/self.scale_x))\n        ly1=max(0.0,min(float(self.src_h),(y1-self.pad_y)/self.scale_y))\n        lx2=max(0.0,min(float(self.src_w),(x2-self.pad_x)/self.scale_x))\n        ly2=max(0.0,min(float(self.src_h),(y2-self.pad_y)/self.scale_y))\n        ix1=max(0,min(self.src_w,int(math.floor(lx1))))\n        iy1=max(0,min(self.src_h,int(math.floor(ly1))))\n        ix2=max(ix1,min(self.src_w,int(math.ceil(lx2))))\n        iy2=max(iy1,min(self.src_h,int(math.ceil(ly2))))\n        return ix1+self.offset_x, iy1+self.offset_y, ix2+self.offset_x, iy2+self.offset_y\n\n    def canvas_box_from_page(self, page_box) -> tuple[float, float, float, float]:\n        x1,y1,x2,y2=(float(v) for v in page_box)\n        x1-=self.offset_x; x2-=self.offset_x; y1-=self.offset_y; y2-=self.offset_y\n        return (x1*self.scale_x+self.pad_x, y1*self.scale_y+self.pad_y, x2*self.scale_x+self.pad_x, y2*self.scale_y+self.pad_y)\n\n\n@dataclass(frozen=True)\nclass MaskDecodeGeometry:\n    transform: LetterboxTransform\n    source_box: tuple[int, int, int, int]\n\n\n'''
          assert s.count(marker)==1; s=s.replace(marker,insert+marker,1)
          s=s.replace('    needs_review: bool = False\n','    needs_review: bool = False\n    source_role: str = "unknown"\n',1)
          old='''    def __init__(self, model_path, conf_threshold: float, use_tta: bool | None = None):\n        self.model_path = str(model_path)\n        self.source_model = Path(model_path).name\n        self.session = make_session(model_path)\n        self.input_name = self.session.get_inputs()[0].name\n        self.conf_threshold = conf_threshold\n        self.use_tta = ENABLE_TTA if use_tta is None else use_tta\n\n    def _class_name(self, class_id: int, num_classes: int) -> str:\n        name = getattr(self, \"source_model\", \"unknown\").lower()\n        if \"bubble\" in name and num_classes >= 2:\n            return \"text_bubble\" if class_id == 0 else \"text_free\" if class_id == 1 else f\"class_{class_id}\"\n        if \"text_segmenter\" in name or num_classes == 1:\n            return \"text_comic\"\n        return f\"class_{class_id}\"\n'''
          new='''    def __init__(self, model_path, conf_threshold: float, use_tta: bool | None = None, *, model_role: str):\n        self.model_path = str(model_path)\n        self.source_model = Path(model_path).name\n        self.model_role = str(model_role)\n        self.session = make_session(model_path)\n        self.contract = validate_detector_session(self.session, role=self.model_role, configured_input_size=INPUT_SIZE)\n        self.input_name = self.contract.input_name\n        self.conf_threshold = conf_threshold\n        self.use_tta = ENABLE_TTA if use_tta is None else use_tta\n\n    def _class_name(self, class_id: int, num_classes: int) -> str:\n        if num_classes != len(self.contract.class_names):\n            return f\"class_{class_id}\"\n        return self.contract.class_names[class_id] if 0 <= class_id < len(self.contract.class_names) else f\"class_{class_id}\"\n'''
          assert s.count(old)==1; s=s.replace(old,new,1)
          s=s.replace('        segmenter_evidence = "text_segmenter" in box.source_model.lower()\n','        segmenter_evidence = box.source_role == "text_segmenter"\n',1)
          s=s.replace('            needs_review=not safe,\n','            needs_review=not safe,\n            source_role=self.model_role,\n',1)
          s=s.replace('            if "text_segmenter" in self.source_model.lower():\n','            if self.model_role == "text_segmenter":\n',1)
          old='''    def _detect_single_plain(self, image: np.ndarray, offset_x: int, offset_y: int) -> list[BubbleBox]:\n        h, w = image.shape[:2]\n        blob, scale, pad = self._preprocess(image)\n        if blob is None:\n            return []\n        outputs = self.session.run(None, {self.input_name: blob})\n        boxes = self._postprocess(outputs, scale, pad, w, h)\n        if offset_x or offset_y:\n            boxes = [\n                replace(\n                    b,\n                    x1=b.x1 + offset_x,\n                    y1=b.y1 + offset_y,\n                    x2=b.x2 + offset_x,\n                    y2=b.y2 + offset_y,\n                )\n                for b in boxes\n            ]\n        return boxes\n'''
          new='''    def _detect_single_plain(self, image: np.ndarray, offset_x: int, offset_y: int) -> list[BubbleBox]:\n        blob, transform = self._preprocess(image, offset_x=offset_x, offset_y=offset_y)\n        if blob is None or transform is None:\n            return []\n        outputs = self.session.run(None, {self.input_name: blob})\n        return self._postprocess(outputs, transform)\n'''
          assert s.count(old)==1; s=s.replace(old,new,1)
          start=s.index('    def _preprocess(self, image: np.ndarray):\n')
          end=s.index('    @staticmethod\n    def _candidate_fields',start)
          block='''    def _preprocess(self, image: np.ndarray, *, offset_x: int = 0, offset_y: int = 0):\n        h, w = image.shape[:2]\n        if h <= 0 or w <= 0:\n            return None, None\n        transform = LetterboxTransform.create(w, h, INPUT_SIZE, INPUT_SIZE, offset_x=offset_x, offset_y=offset_y)\n        img_rgb = cv2.cvtColor(image, cv2.COLOR_BGR2RGB) if image.ndim == 3 and image.shape[2] == 3 else image\n        resized = cv2.resize(img_rgb, (transform.resized_w, transform.resized_h))\n        canvas = np.full((transform.input_h, transform.input_w, 3), DETECTOR_LETTERBOX_VALUE, dtype=np.uint8)\n        y1,y2=transform.pad_y,transform.pad_y+transform.resized_h\n        x1,x2=transform.pad_x,transform.pad_x+transform.resized_w\n        canvas[y1:y2,x1:x2]=resized\n        blob=(canvas.astype(np.float32)/255.0).transpose(2,0,1)[None]\n        return blob, transform\n\n    def _postprocess(self, outputs, transform: LetterboxTransform) -> list[BubbleBox]:\n        out_arr=np.squeeze(outputs[0])\n        if out_arr.ndim==1: out_arr=out_arr[np.newaxis,:]\n        if out_arr.ndim==2 and out_arr.shape[0] < out_arr.shape[1]: out_arr=out_arr.T\n        if out_arr.ndim!=2 or out_arr.shape[0]==0: return []\n        has_proto=len(outputs)>1 and outputs[1].ndim==4\n        if has_proto:\n            num_mask_coeffs=outputs[1].shape[1]; num_classes=max(1,out_arr.shape[1]-4-num_mask_coeffs); prototypes=outputs[1][0]\n        else:\n            num_mask_coeffs=0; num_classes=max(1,out_arr.shape[1]-4); prototypes=None\n        class_end=4+num_classes\n        class_scores=out_arr[:,4:class_end].astype(np.float32,copy=False)\n        if num_classes==1:\n            class_ids=np.zeros(out_arr.shape[0],dtype=np.int32); confidences=class_scores[:,0]\n        else:\n            class_ids=np.argmax(class_scores,axis=1).astype(np.int32,copy=False); confidences=class_scores[np.arange(class_scores.shape[0]),class_ids]\n        keep=np.flatnonzero(confidences>=self.conf_threshold)\n        if keep.size==0: return []\n        selected=out_arr[keep]; conf_selected=confidences[keep]; class_selected=class_ids[keep]\n        coeff_start=4+num_classes; coeff_end=coeff_start+num_mask_coeffs\n        candidates=[]\n        for j in range(selected.shape[0]):\n            cx,cy,bw,bh=(float(v) for v in selected[j,:4])\n            raw_canvas=(cx-bw/2.0,cy-bh/2.0,cx+bw/2.0,cy+bh/2.0)\n            source_box=transform.page_box_from_canvas(raw_canvas)\n            x1,y1,x2,y2=source_box\n            if (x2-x1)<DETECTOR_MIN_BOX_SIDE or (y2-y1)<DETECTOR_MIN_BOX_SIDE: continue\n            geometry=None; mask_coeffs=None\n            if has_proto and num_mask_coeffs>0:\n                geometry=MaskDecodeGeometry(transform,source_box)\n                mask_coeffs=selected[j,coeff_start:coeff_end].copy()\n            candidates.append((float(x1),float(y1),float(x2),float(y2),float(conf_selected[j]),int(class_selected[j]),num_classes,geometry,mask_coeffs))\n        return self._nms(candidates,prototypes)\n\n    def _decode_mask(self, mask_coeffs, prototypes, geometry, box_w: int, box_h: int) -> np.ndarray | None:\n        if mask_coeffs is None or prototypes is None or box_w < 1 or box_h < 1:\n            return None\n        num_proto,mh,mw=prototypes.shape\n        logits=np.clip(mask_coeffs @ prototypes.reshape(num_proto,-1),-88.0,88.0)\n        mask_full=1/(1+np.exp(-logits.reshape(mh,mw)))\n        if isinstance(geometry,MaskDecodeGeometry):\n            canvas_box=geometry.transform.canvas_box_from_page(geometry.source_box)\n            input_w,input_h=geometry.transform.input_w,geometry.transform.input_h\n        else:\n            canvas_box=geometry; input_w=input_h=INPUT_SIZE\n        if canvas_box is None: return None\n        ccx1,ccy1,ccx2,ccy2=(float(v) for v in canvas_box)\n        sx=mw/float(input_w); sy=mh/float(input_h)\n        px1=max(0,min(mw-1,int(np.floor(ccx1*sx)))); py1=max(0,min(mh-1,int(np.floor(ccy1*sy))))\n        px2=max(px1+1,min(mw,int(np.ceil(ccx2*sx)))); py2=max(py1+1,min(mh,int(np.ceil(ccy2*sy))))\n        crop=mask_full[py1:py2,px1:px2]\n        if crop.size==0: return None\n        probabilities=cv2.resize(crop,(box_w,box_h),interpolation=cv2.INTER_LINEAR)\n        return (probabilities>DETECTOR_MASK_THRESHOLD).astype(np.uint8)*255\n\n'''
          s=s[:start]+block+s[end:]
          s=s.replace('        source_name = str(members[kept[0]].source_model).lower()\n        if "text_segmenter" not in source_name:\n','        if members[kept[0]].source_role != "text_segmenter":\n',1)
          s=s.replace('                score, cid, num_classes, canvas_box, mask_coeffs = self._candidate_fields(c)\n                mask = self._decode_mask(mask_coeffs, prototypes, canvas_box, x2 - x1, y2 - y1)\n','                score, cid, num_classes, decode_geometry, mask_coeffs = self._candidate_fields(c)\n                mask = self._decode_mask(mask_coeffs, prototypes, decode_geometry, x2 - x1, y2 - y1)\n',1)
          s=s.replace('                    semantic_type=self._semantic_type(class_name),\n','                    semantic_type=self._semantic_type(class_name),\n                    source_role=self.model_role,\n',1)
          s=s.replace('        by_class: dict[tuple[str, int], list[BubbleBox]] = {}\n        for b in boxes:\n            by_class.setdefault((b.source_model, b.class_id), []).append(b)\n','        by_class: dict[tuple[str, str, int], list[BubbleBox]] = {}\n        for b in boxes:\n            by_class.setdefault((b.source_role, b.source_model, b.class_id), []).append(b)\n',1)
          p.write_text(s,encoding='utf-8')

          p=Path('app/detector/combined_detector.py'); s=p.read_text(encoding='utf-8')
          s=s.replace('''        self.bubble_detector = YoloDetector(\n            BUBBLE_DETECTOR_MODEL, BUBBLE_PROPOSAL_CONF_THRESHOLD\n        )\n        self.text_detector = YoloDetector(TEXT_SEGMENTER_MODEL, TEXT_CONF_THRESHOLD)\n''','''        self.bubble_detector = YoloDetector(\n            BUBBLE_DETECTOR_MODEL, BUBBLE_PROPOSAL_CONF_THRESHOLD, model_role=\"bubble_detector\"\n        )\n        self.text_detector = YoloDetector(\n            TEXT_SEGMENTER_MODEL, TEXT_CONF_THRESHOLD, model_role=\"text_segmenter\"\n        )\n''',1)
          s=s.replace('        if box.verified_mask and "text_segmenter" in box.source_model.lower():\n','        if box.verified_mask and box.source_role == "text_segmenter":\n',1)
          s=s.replace('            "text_segmenter" in box.source_model.lower()\n            or box.source_model == "opencv_mser"\n','            box.source_role == "text_segmenter"\n            or box.source_model == "opencv_mser"\n',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Apply explicit LaMa IO and range contracts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/inpaint/lama_inpainter.py'); s=p.read_text(encoding='utf-8')
          s=s.replace('from app.logging_config import logger\n','from app.logging_config import logger\nfrom app.model_contracts import decode_lama_output, validate_lama_session\n',1)
          s=s.replace('        self.dynamic_lama = False\n','        self.dynamic_lama = False\n        self.lama_contract = None\n        self.output_name = None\n',1)
          old='''    def _configure_loaded_session(self, session, model_path) -> None:\n        inputs = session.get_inputs()\n        image_shape = inputs[0].shape\n        dynamic_lama = any(\n            isinstance(dim, str) or dim is None for dim in image_shape[2:4]\n        )\n        self.session = session\n        self.image_input = inputs[0].name\n        self.mask_input = inputs[1].name\n        self.dynamic_lama = dynamic_lama\n        self._serialize_fixed_inference = bool(\n            not dynamic_lama and type(session).__name__ == \"_SerializedSession\"\n        )\n        self.lama_model_path = model_path\n        self._session_run_count = 0\n        self._recycle_fixed_session = (\n            self._serialize_fixed_inference and _should_recycle_fixed_session()\n        )\n'''
          new='''    def _configure_loaded_session(self, session, model_path, *, expected_dynamic: bool) -> None:\n        contract = validate_lama_session(\n            session, dynamic=bool(expected_dynamic), fixed_size=INPAINT_SIZE\n        )\n        self.session = session\n        self.lama_contract = contract\n        self.image_input = contract.image_input_name\n        self.mask_input = contract.mask_input_name\n        self.output_name = contract.output_name\n        self.dynamic_lama = contract.dynamic\n        self._serialize_fixed_inference = bool(\n            not contract.dynamic and type(session).__name__ == \"_SerializedSession\"\n        )\n        self.lama_model_path = model_path\n        self._session_run_count = 0\n        self._recycle_fixed_session = (\n            self._serialize_fixed_inference and _should_recycle_fixed_session()\n        )\n'''
          assert s.count(old)==1; s=s.replace(old,new,1)
          s=s.replace('            self._configure_loaded_session(session, model_path)\n','            self._configure_loaded_session(session, model_path, expected_dynamic=(model_path == LAMA_DYNAMIC_MODEL))\n',1)
          s=s.replace('        self._configure_loaded_session(session, self.lama_model_path)\n','        self._configure_loaded_session(session, self.lama_model_path, expected_dynamic=False)\n',1)
          count=s.count('output = self.session.run(None, feed)[0]')
          assert count==2, count
          s=s.replace('output = self.session.run(None, feed)[0]','output = self.session.run([self.output_name], feed)[0]')
          old='''        painted_rgb = output[0].transpose(1, 2, 0)\n        if painted_rgb.max() <= 1.0:\n            painted_rgb = painted_rgb * 255.0\n        painted_rgb = np.clip(painted_rgb, 0, 255).astype(np.uint8)\n        return cv2.cvtColor(painted_rgb, cv2.COLOR_RGB2BGR)\n'''
          new='''        painted_rgb = decode_lama_output(output, self.lama_contract)\n        return cv2.cvtColor(painted_rgb, cv2.COLOR_RGB2BGR)\n'''
          assert s.count(old)==1; s=s.replace(old,new,1)
