def model_contract_checks():
    import numpy as np
    from app.model_contracts import validate_detector_session, validate_lama_session, decode_lama_output
    class M:
        def __init__(self,name,shape,type='tensor(float)'): self.name=name; self.shape=shape; self.type=type
    class S:
        def __init__(self,inputs,outputs): self._i=inputs; self._o=outputs
        def get_inputs(self): return self._i
        def get_outputs(self): return self._o
    bubble=S([M('images',[1,3,1024,1024])],[M('output0',[1,6,21504])])
    bc=validate_detector_session(bubble,role='bubble_detector',configured_input_size=1024)
    check(bc.class_names==('text_bubble','text_free') and not bc.destructive_text_mask,'bubble role authority')
    text=S([M('images',[1,3,1024,1024])],[M('output0',[1,37,21504]),M('output1',[1,32,256,256])])
    tc=validate_detector_session(text,role='text_segmenter',configured_input_size=1024)
    check(tc.provides_prototypes and tc.destructive_text_mask,'text role authority')
    try: validate_detector_session(text,role='text_segmenter',configured_input_size=960)
    except ValueError: pass
    else: raise AssertionError('incompatible detector resolution accepted')
    dynamic=S([M('mask',['batch',1,'h','w']),M('image',['batch',3,'h','w'])],[M('inpainted',['batch',3,'h','w'])])
    dc=validate_lama_session(dynamic,dynamic=True,fixed_size=512)
    check(dc.image_input_name=='image' and dc.mask_input_name=='mask' and dc.output_range=='zero_to_one','dynamic names/range')
    check(int(decode_lama_output(np.full((1,3,2,2),0.5,np.float32),dc)[0,0,0])==127,'dynamic scale contract')
    fixed=S([M('mask',['batch',1,512,512]),M('image',['batch',3,512,512])],[M('output',['batch',3,'H','W'])])
    fc=validate_lama_session(fixed,dynamic=False,fixed_size=512)
    check(fc.output_range=='zero_to_255' and fc.output_name=='output','fixed output contract')
    check(int(decode_lama_output(np.full((1,3,2,2),0.5,np.float32),fc)[0,0,0])==0,'fixed dark output was rescaled')
    try: decode_lama_output(np.full((1,3,2,2),1.5,np.float32),dc)
    except ValueError: pass
    else: raise AssertionError('out-of-range dynamic output accepted')


def geometry_contract_checks():
    import math, types, numpy as np
    if 'onnxruntime' not in sys.modules: sys.modules['onnxruntime']=types.ModuleType('onnxruntime')
    from app.detector.bubble_detector import LetterboxTransform, MaskDecodeGeometry, YoloDetector
    def reference(src_w,src_h,box,ox=0,oy=0):
        nominal=min(1024/src_w,1024/src_h); rw=max(1,min(1024,int(src_w*nominal))); rh=max(1,min(1024,int(src_h*nominal)))
        px=(1024-rw)//2; py=(1024-rh)//2; sx=rw/src_w; sy=rh/src_h
        a,b,c,d=box; a=max(0.0,min(src_w,(a-px)/sx)); c=max(0.0,min(src_w,(c-px)/sx)); b=max(0.0,min(src_h,(b-py)/sy)); d=max(0.0,min(src_h,(d-py)/sy))
        x1=max(0,min(src_w,math.floor(a))); x2=max(x1,min(src_w,math.ceil(c))); y1=max(0,min(src_h,math.floor(b))); y2=max(y1,min(src_h,math.ceil(d)))
        return (x1+ox,y1+oy,x2+ox,y2+oy)
    cases=[(800,1338,(-50,200,300,600),0,0),(517,333,(0,-40,1024,600),0,0),(333,517,(900,900,1100,1200),0,0),(401,277,(-20,-30,1080,1060),37,91)]
    for sw,sh,box,ox,oy in cases:
        t=LetterboxTransform.create(sw,sh,1024,1024,offset_x=ox,offset_y=oy)
        check(t.page_box_from_canvas(box)==reference(sw,sh,box,ox,oy),f'geometry mismatch {(sw,sh,box)}')
    odd=LetterboxTransform.create(333,517,1024,1024)
    check(abs(odd.scale_x-odd.scale_y)>1e-6,'odd-size transform lost actual x/y scale')
    tile=LetterboxTransform.create(320,240,1024,1024,offset_x=100,offset_y=200)
    full=(tile.pad_x,tile.pad_y,tile.pad_x+tile.resized_w,tile.pad_y+tile.resized_h)
    check(tile.page_box_from_canvas(full)==(100,200,420,440),'tile source ownership offset')
    t=LetterboxTransform.create(400,200,1024,1024)
    source=(0,50,80,100); g=MaskDecodeGeometry(t,source)
    proto=np.full((1,256,256),-10.0,np.float32); proto[0,96:128,0:26]=10.0
    mask=YoloDetector._decode_mask(None,np.array([1.0],np.float32),proto,g,80,50)
    xs=np.where(mask>0)[1]
    check(xs.size>0 and int(xs.min())==0 and 37<=int(xs.max())<=42,f'clipped mask shifted: {xs.min() if xs.size else None}..{xs.max() if xs.size else None}')


model_contract_checks(); geometry_contract_checks()
publication_safety_checks(); windows_locked_reader_check(); print('backend foundation sanity: phases 1-2 PASS')
'''
