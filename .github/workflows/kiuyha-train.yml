name: Kiuyha train

# One-off: fine-tune the Kiuyha text detector on our chapters, drawn text and colour webtoon words, then score it against the old one.
on:
  push:
    branches-ignore: [main]
    paths:
      - ".github/workflows/kiuyha-train.yml"
      - ".github/kiuyha/**"

permissions:
  contents: write
  actions: read

env:
  OUT: audit-results/kiuyha-train/run-${{ github.run_id }}
  PYTHONPATH: "."
  PYTHONUNBUFFERED: "1"
  # The run whose kiuyha-data artifact is reused; empty builds a new set.
  DATA_RUN: "38535523379"

jobs:
  data:
    # Skipped while DATA_RUN names a set already built (job conditions cannot read env, so this mirrors it).
    if: false
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the downloader and Ultralytics on CPU torch
        run: |
          python -m pip install --only-binary :all: numpy==1.26.4 Pillow==10.4.0 opencv-contrib-python==4.10.0.84 \
            onnxruntime-openvino==1.24.1 psutil==6.1.1 loguru==0.7.2 requests==2.32.3 \
            beautifulsoup4==4.12.3 lxml==5.3.0 playwright==1.47.0 fastapi==0.115.0 \
            pydantic==2.9.2 filelock==3.16.1 python-multipart==0.0.12 pyarrow
          python -m playwright install --with-deps chromium
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "ultralytics==8.4.164"
          python -m pip uninstall -y opencv-python opencv-python-headless || true
          python -m pip install --force-reinstall --no-deps opencv-contrib-python==4.10.0.84
      - name: Fetch the current Kiuyha weights
        run: curl -sSfL -o yolo26n.pt https://huggingface.co/Kiuyha/Manga-Bubble-YOLO/resolve/main/weights/yolo26n.pt
      - name: Build the set
        run: python .github/kiuyha/build.py yolo26n.pt kiuyha-data .github/kiuyha/plan.json
      - uses: actions/upload-artifact@v4
        with:
          name: kiuyha-data
          path: |
            kiuyha-data
            yolo26n.pt
          retention-days: 7

  tune:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    strategy:
      fail-fast: false
      matrix:
        arm: [all]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: kiuyha-data
          path: .
          run-id: ${{ env.DATA_RUN }}
          github-token: ${{ github.token }}
      # The previously tuned weights: this run continues training our model,
      # it does not start over from the base weights.
      - uses: actions/download-artifact@v4
        with:
          name: kiuyha-tuned-all
          path: .
          run-id: 38672322338
          github-token: ${{ github.token }}
      - name: Install Ultralytics on CPU torch
        run: |
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "ultralytics==8.4.164" onnx onnxslim
      - name: Add hard-case data (Total-Text hard + webtoon + AnimeText hard)
        run: python .github/kiuyha/fetch_hard.py kiuyha-data
      - name: Tune
        run: |
          sed -i "s#^path: .*#path: $PWD/kiuyha-data#" kiuyha-data/data.yaml
          freeze=0
          [ "${{ matrix.arm }}" = frozen ] && freeze=10
          yolo detect train model=kiuyha-tuned.pt data=kiuyha-data/data.yaml imgsz=1024 batch=8 workers=3 device=cpu \
            time=5.0 epochs=40 patience=100 freeze=$freeze optimizer=AdamW lr0=0.0005 cos_lr=True \
            degrees=5 fliplr=0.0 plots=False project=$PWD/runs name=tune exist_ok=True 2>&1 | grep -v "it/s\]\|s/it\]" | tee train.log
      # Ultralytics may write elsewhere than asked, so the weights are found wherever they landed and kept before anything else runs.
      - name: Keep the weights
        if: always()
        run: |
          best=$(find "$PWD/runs" / -path '*/tune/weights/best.pt' 2>/dev/null | head -1)
          [ -n "$best" ] || best=$(find "$PWD/runs" / -path '*/tune/weights/last.pt' 2>/dev/null | head -1)
          cp "$best" kiuyha-tuned.pt && cp "$(dirname "$(dirname "$best")")/results.csv" . 2>/dev/null || true
          ls -la kiuyha-tuned.pt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kiuyha-tuned-${{ matrix.arm }}
          path: |
            kiuyha-tuned.pt
            results.csv
          retention-days: 30
      - name: Export to ONNX at the app's size
        run: |
          yolo export model=kiuyha-tuned.pt format=onnx imgsz=1280 opset=17
          ls -la kiuyha-tuned.onnx
      - uses: actions/upload-artifact@v4
        with:
          name: kiuyha-tuned-${{ matrix.arm }}-onnx
          path: kiuyha-tuned.onnx
          retention-days: 30
      - name: Score old against tuned on the held-out checks
        run: python .github/kiuyha/evaluate.py kiuyha-data "$OUT/${{ matrix.arm }}" yolo26n.pt kiuyha-tuned.pt
      - name: Keep the logs
        if: always()
        run: |
          mkdir -p "$OUT/${{ matrix.arm }}"
          cp train.log results.csv kiuyha-data/stats.json "$OUT/${{ matrix.arm }}/" 2>/dev/null || true
      - name: Give git access only now
        if: always()
        env:
          TOKEN: ${{ github.token }}
        run: |
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
      - uses: ./.github/actions/save-evidence
        if: always()
        with:
          paths: ${{ env.OUT }}/${{ matrix.arm }}
          message: "audit: Kiuyha tuned (${{ matrix.arm }}, run ${{ github.run_id }})"
