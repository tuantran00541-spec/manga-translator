name: Kiuyha train

# One-off: fine-tune the Kiuyha text detector on our chapters, drawn text and colour webtoon words, then score it against the old one.
on:
  push:
    branches-ignore: [main]
    paths:
      - ".github/workflows/kiuyha-train.yml"
      - ".github/kiuyha/**"

permissions:
  contents: write

env:
  OUT: audit-results/kiuyha-train/run-${{ github.run_id }}
  PYTHONPATH: "."
  PYTHONUNBUFFERED: "1"

jobs:
  data:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the downloader and Ultralytics on CPU torch
        run: |
          python -m pip install --only-binary :all: numpy==1.26.4 Pillow==10.4.0 opencv-contrib-python==4.10.0.84 \
            onnxruntime-openvino==1.24.1 psutil==6.1.1 loguru==0.7.2 requests==2.32.3 \
            beautifulsoup4==4.12.3 lxml==5.3.0 playwright==1.47.0 fastapi==0.115.0 \
            pydantic==2.9.2 filelock==3.16.1 python-multipart==0.0.12 pyarrow
          python -m playwright install --with-deps chromium
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "ultralytics==8.4.164"
          python -m pip uninstall -y opencv-python opencv-python-headless || true
          python -m pip install --force-reinstall --no-deps opencv-contrib-python==4.10.0.84
      - name: Fetch the current Kiuyha weights
        run: curl -sSfL -o yolo26n.pt https://huggingface.co/Kiuyha/Manga-Bubble-YOLO/resolve/main/weights/yolo26n.pt
      - name: Build the set
        run: python .github/kiuyha/build.py yolo26n.pt kiuyha-data .github/kiuyha/plan.json
      - uses: actions/upload-artifact@v4
        with:
          name: kiuyha-data
          path: |
            kiuyha-data
            yolo26n.pt
          retention-days: 7

  tune:
    needs: data
    runs-on: ubuntu-latest
    timeout-minutes: 345
    strategy:
      fail-fast: false
      matrix:
        arm: [all, frozen]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: kiuyha-data
          path: .
      - name: Install Ultralytics on CPU torch
        run: |
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "ultralytics==8.4.164" onnx onnxslim
      - name: Tune
        run: |
          sed -i "s#^path: .*#path: $PWD/kiuyha-data#" kiuyha-data/data.yaml
          freeze=0
          [ "${{ matrix.arm }}" = frozen ] && freeze=10
          yolo detect train model=yolo26n.pt data=kiuyha-data/data.yaml imgsz=1024 batch=8 workers=3 device=cpu \
            time=3.9 epochs=30 patience=100 freeze=$freeze optimizer=AdamW lr0=0.0005 cos_lr=True \
            degrees=5 fliplr=0.0 plots=False project=runs name=tune exist_ok=True 2>&1 | grep -v "it/s\]\|s/it\]" | tee train.log
      - name: Export to ONNX at the app's size
        run: |
          cp runs/tune/weights/best.pt kiuyha-tuned.pt
          yolo export model=kiuyha-tuned.pt format=onnx imgsz=1280 opset=17
          ls -la kiuyha-tuned.*
      # Uploaded before scoring, so a scoring failure cannot lose the model.
      - uses: actions/upload-artifact@v4
        with:
          name: kiuyha-tuned-${{ matrix.arm }}
          path: |
            kiuyha-tuned.pt
            kiuyha-tuned.onnx
            runs/tune/results.csv
          retention-days: 30
      - name: Score old against tuned on the held-out checks
        run: python .github/kiuyha/evaluate.py kiuyha-data "$OUT/${{ matrix.arm }}" yolo26n.pt kiuyha-tuned.pt
      - name: Keep the logs
        if: always()
        run: |
          mkdir -p "$OUT/${{ matrix.arm }}"
          cp train.log runs/tune/results.csv kiuyha-data/stats.json "$OUT/${{ matrix.arm }}/" 2>/dev/null || true
      - name: Give git access only now
        if: always()
        env:
          TOKEN: ${{ github.token }}
        run: |
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
      - uses: ./.github/actions/save-evidence
        if: always()
        with:
          paths: ${{ env.OUT }}/${{ matrix.arm }}
          message: "audit: Kiuyha tuned (${{ matrix.arm }}, run ${{ github.run_id }})"
