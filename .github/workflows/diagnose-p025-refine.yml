name: Diagnose dense authority candidates

on:
  push:
    branches:
      - test/preserve-region-repaint
    paths:
      - .github/workflows/diagnose-p025-refine.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  MANGA_ORT_PROVIDER: openvino
  MANGA_ORT_REQUIRE_PROVIDER: "1"
  MANGA_ORT_OPENVINO_SCOPE: detectors
  MANGA_ORT_OPENVINO_THREADS: "2"
  MANGA_ORT_OPENVINO_STREAMS: "1"
  MANGA_ORT_OPENVINO_CACHE_DIR: /tmp/manga-openvino-cache
  OPENBLAS_NUM_THREADS: "1"
  CHAPTER_ID: c159aa12
  CHAPTER_URL: https://asurascans.com/comics/player-who-returned-10000-years-later-53fc8424/chapter/159

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/preserve-region-repaint

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime
        run: |
          python -m pip install \
            numpy==1.26.4 Pillow==10.4.0 opencv-contrib-python==4.10.0.84 \
            onnxruntime-openvino==1.24.1 psutil==6.1.1 loguru==0.7.2 \
            requests==2.32.3 beautifulsoup4==4.12.3 lxml==5.3.0 playwright==1.47.0 \
            fastapi==0.115.0 'uvicorn[standard]==0.30.6' \
            pydantic==2.9.2 filelock==3.16.1 python-multipart==0.0.12

      - name: Restore detector and inpaint models
        id: models
        uses: actions/cache@v4
        with:
          path: |
            models/*.onnx
            models/.e2e-provenance.json
          key: processing-profile-models-b224548-v1

      - name: Read pinned model provisioner
        if: steps.models.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          ref: b22454827f8190655d7070b80eb20c2550beadfa
          path: benchmark-bootstrap
          sparse-checkout: scripts/provision_real_e2e_models.py
          sparse-checkout-cone-mode: false

      - name: Provision models
        if: steps.models.outputs.cache-hit != 'true'
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple torch==2.5.1+cpu torchvision==0.20.1+cpu
          python -m pip install --no-deps ultralytics==8.3.221 onnx==1.17.0 onnxslim==0.1.71
          python -m pip install sympy==1.13.1 PyYAML==6.0.2 scipy==1.14.1 tqdm==4.67.1 matplotlib==3.9.2 pandas==2.2.3 py-cpuinfo==9.0.0 ml_dtypes==0.5.3 colorama==0.4.6 polars==1.33.1 ultralytics-thop==2.0.17
          python benchmark-bootstrap/scripts/provision_real_e2e_models.py
          cp benchmark-bootstrap/models/*.onnx models/
          cp benchmark-bootstrap/models/.e2e-provenance.json models/

      - name: Compare p025 and p035 dense gates
        run: |
          python - <<'PY'
          from __future__ import annotations
          import json
          import os
          import types
          from pathlib import Path
          import cv2
          import numpy as np
          import app.inpaint.fast_lama_inpainter as fast_mod
          from app.dependencies import pipeline
          from app.manifest_utils import load_manifest_raw

          out = Path("benchmark-results/dense-candidate-compare")
          out.mkdir(parents=True, exist_ok=True)
          targets = {
              (5, 4): "p025",
              (8, 1): "p035",
          }
          trace = []
          context = {"box": None}

          chapter_id = os.environ["CHAPTER_ID"]
          manifest = pipeline.download_chapter(os.environ["CHAPTER_URL"], chapter_id, workers=1)
          located = {}
          for key, name in targets.items():
              matches = [
                  i for i,p in enumerate(manifest["pages"])
                  if int(p.get("source_page",-1)) == key[0]
                  and int(p.get("slice_index",-1)) == key[1]
              ]
              if len(matches) != 1:
                  raise RuntimeError(f"{name} lookup failed: {matches}")
              located[matches[0]] = name

          inp = pipeline.inpainter
          orig_try = inp._try_stroke_authority_fill
          def wrapped_try(self, image, box, protected_regions):
              context["box"] = {
                  "geometry": [int(box.x1), int(box.y1), int(box.x2), int(box.y2)],
                  "semantic_type": getattr(box, "semantic_type", None),
                  "source_role": getattr(box, "source_role", None),
                  "source_model": getattr(box, "source_model", None),
                  "class_id": getattr(box, "class_id", None),
                  "class_name": getattr(box, "class_name", None),
                  "mask_source": getattr(box, "mask_source", None),
                  "verified_mask": bool(getattr(box, "verified_mask", False)),
                  "safe_to_inpaint": bool(getattr(box, "safe_to_inpaint", False)),
              }
              try:
                  return orig_try(image, box, protected_regions)
              finally:
                  context["box"] = None
          inp._try_stroke_authority_fill = types.MethodType(wrapped_try, inp)

          orig_refine = inp._refine_dense_smooth_stroke_mask
          def wrapped_refine(self, crop, authority_mask):
              authority = authority_mask > 127
              ys, xs = np.nonzero(authority)
              rec = {
                  "box": dict(context["box"] or {}),
                  "crop_shape": [int(v) for v in crop.shape[:2]],
                  "authority_pixels": int(xs.size),
              }
              if xs.size:
                  bx1, bx2 = int(xs.min()), int(xs.max()) + 1
                  by1, by2 = int(ys.min()), int(ys.max()) + 1
                  tight_area = max(1, (bx2 - bx1) * (by2 - by1))
                  rec["tight_bbox"] = [bx1, by1, bx2, by2]
                  rec["tight_area"] = int(tight_area)
                  rec["occupancy"] = float(xs.size) / float(tight_area)
                  ring = self._mask_ring(authority_mask, fast_mod._BUBBLE_FASTPATH_RING)
                  rec["ring_pixels"] = int(np.count_nonzero(ring))
                  gray = cv2.cvtColor(crop, cv2.COLOR_BGR2GRAY) if crop.ndim == 3 else crop
                  gray_f = gray.astype(np.float32, copy=False)
                  if np.any(ring):
                      ring_gray = gray_f[ring]
                      rec["ring_std"] = float(ring_gray.std())
                      rec["background"] = float(np.median(ring_gray))
                      edges = cv2.Canny(gray, 64, 128, L2gradient=True) > 0
                      rec["ring_edge_density"] = float(edges[ring].mean())
                      if crop.ndim == 3 and crop.shape[2] == 3:
                          lab = cv2.cvtColor(crop, cv2.COLOR_BGR2LAB)
                          ring_ab = lab[ring, 1:3].astype(np.float32, copy=False)
                          rec["ring_chroma_std_max"] = float(np.max(ring_ab.std(axis=0))) if ring_ab.size else 0.0
                      inside = gray_f[authority]
                      low = float(np.percentile(inside, 10.0))
                      high = float(np.percentile(inside, 90.0))
                      rec["inside_std"] = float(inside.std())
                      rec["inside_low_p10"] = low
                      rec["inside_high_p90"] = high
                      rec["dark_contrast"] = rec["background"] - low
                      rec["light_contrast"] = high - rec["background"]
              result = orig_refine(crop, authority_mask)
              rec["stroke_refine_accepted"] = result is not None
              rec["model_pixels"] = int(np.count_nonzero(result > 127)) if result is not None else 0
              rec["model_fraction"] = rec["model_pixels"] / float(max(1, rec["authority_pixels"]))
              surface = self._bubble_gradient_fill_from_authority_ring(
                  crop, authority_mask, authority_mask
              )
              rec["full_authority_surface_accepted"] = surface is not None
              trace.append(rec)
              return result
          inp._refine_dense_smooth_stroke_mask = types.MethodType(wrapped_refine, inp)

          pipeline.process_pages(chapter_id, list(located.keys()), workers=1)
          state = load_manifest_raw(chapter_id)
          report = {"trace": trace, "pages": {}}
          for idx, name in located.items():
              page = state["pages"][idx]
              report["pages"][name] = {
                  "page_index": idx,
                  "auto_inpaint": (page.get("processing_metrics") or {}).get("auto_inpaint"),
              }
          (out / "report.json").write_text(json.dumps(report, indent=2), encoding="utf-8")
          print("DENSE_COMPARE=" + json.dumps(report))
          PY

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: dense-candidate-compare-${{ github.run_id }}
          path: benchmark-results/dense-candidate-compare/
          retention-days: 7
          if-no-files-found: error
