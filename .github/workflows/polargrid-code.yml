name: PolarGrid code probe

# One-off: how well does qwen-3.8-27b on PolarGrid write and fix real functions from this repo, checked by tests.
on:
  push:
    branches-ignore: [main]
    paths:
      - ".github/workflows/polargrid-code.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  code:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      OUT: audit-results/polargrid-code
    steps:
      - uses: actions/checkout@v4

      - name: Three tasks, thinking off and on, each checked against the repo's own function
        env:
          POLARGRID_KEY: ${{ secrets.polagrid_ }}
        run: |
          python3 -m pip install -q numpy requests
          mkdir -p "$OUT"
          python3 - <<'PY'
          import json, os, random, re, time, traceback
          import numpy as np, requests

          out = os.environ["OUT"]
          url = "https://api.mia-01.edge.polargrid.ai/v1/chat/completions"
          head = {"Authorization": "Bearer " + os.environ["POLARGRID_KEY"], "Content-Type": "application/json"}

          # Reference implementations, copied from app/inpaint/clustering.py, lama_inpainter.py and mask_geometry.py.
          def ref_split(cluster, avg_h):
              lines = []
              for b in sorted(cluster, key=lambda b: (b.y1, b.x1)):
                  for line in lines:
                      ly1, ly2 = min(x.y1 for x in line), max(x.y2 for x in line)
                      overlap = min(b.y2, ly2) - max(b.y1, ly1)
                      min_h = min(b.y2 - b.y1, ly2 - ly1)
                      if min_h > 0 and overlap / min_h > 0.5:
                          line.append(b); break
                  else:
                      lines.append([b])
              lines.sort(key=lambda line: min(b.y1 for b in line))
              groups, cur = [], []
              for line in lines:
                  if not cur:
                      cur = list(line)
                  elif max(b.y2 for b in cur + line) - min(b.y1 for b in cur + line) > 3.0 * avg_h:
                      groups.append(cur); cur = list(line)
                  else:
                      cur.extend(line)
              if cur:
                  groups.append(cur)
              return groups

          def ref_weight(length, overlap, has_before, has_after):
              weight = np.ones(length, dtype=np.float32)
              if overlap <= 0:
                  return weight
              ramp = np.linspace(0.0, 1.0, min(overlap, length), dtype=np.float32)
              if has_before:
                  weight[:len(ramp)] = np.minimum(weight[:len(ramp)], ramp)
              if has_after:
                  weight[-len(ramp):] = np.minimum(weight[-len(ramp):], ramp[::-1])
              return weight

          def ref_remap(mask, source_box, target_box):
              if mask is None:
                  return None
              sx1, sy1, sx2, sy2 = (int(source_box[k]) for k in ("x1", "y1", "x2", "y2"))
              tx1, ty1, tx2, ty2 = (int(target_box[k]) for k in ("x1", "y1", "x2", "y2"))
              sw, sh, tw, th = sx2 - sx1, sy2 - sy1, tx2 - tx1, ty2 - ty1
              if sw <= 0 or sh <= 0 or tw <= 0 or th <= 0:
                  return None
              target = np.zeros((th, tw), dtype=np.uint8)
              ix1, iy1, ix2, iy2 = max(sx1, tx1), max(sy1, ty1), min(sx2, tx2), min(sy2, ty2)
              if ix2 <= ix1 or iy2 <= iy1:
                  return target
              target[iy1 - ty1:iy2 - ty1, ix1 - tx1:ix2 - tx1] = mask[iy1 - sy1:iy2 - sy1, ix1 - sx1:ix2 - sx1]
              return target

          class Box:
              def __init__(self, i, x1, y1, x2, y2):
                  self.id, self.x1, self.y1, self.x2, self.y2 = i, x1, y1, x2, y2

          def test_split(fn):
              rng, bad = random.Random(1), 0
              for case in range(300):
                  boxes = []
                  for i in range(rng.randint(1, 9)):
                      x, y = rng.randint(0, 500), rng.randint(0, 600)
                      boxes.append(Box(i, x, y, x + rng.randint(5, 200), y + rng.randint(0 if case % 7 == 0 else 5, 60)))
                  avg = sum(b.y2 - b.y1 for b in boxes) / len(boxes)
                  want = [[b.id for b in g] for g in ref_split(boxes, avg)]
                  try:
                      got = [[b.id for b in g] for g in fn([Box(b.id, b.x1, b.y1, b.x2, b.y2) for b in boxes], avg)]
                  except Exception:
                      got = None
                  bad += got != want
              return 300 - bad, 300

          def test_weight(fn):
              rng, bad = random.Random(2), 0
              for _ in range(400):
                  args = (rng.randint(1, 300), rng.choice([0, 1, 2, 7, 64, 192, 400]), rng.random() < 0.6, rng.random() < 0.6)
                  try:
                      ok = np.allclose(np.asarray(fn(*args), np.float32), ref_weight(*args), atol=1e-6)
                  except Exception:
                      ok = False
                  bad += not ok
              return 400 - bad, 400

          def test_remap(fn):
              rng, bad = np.random.default_rng(3), 0
              for case in range(400):
                  def box():
                      x, y = int(rng.integers(-20, 80)), int(rng.integers(-20, 80))
                      return {"x1": x, "y1": y, "x2": x + int(rng.integers(-3, 60)), "y2": y + int(rng.integers(-3, 60))}
                  s, t = box(), box()
                  sw, sh = max(1, s["x2"] - s["x1"]), max(1, s["y2"] - s["y1"])
                  mask = None if case % 50 == 0 else (rng.random((sh, sw)) > 0.5).astype(np.uint8) * 255
                  want = ref_remap(mask, s, t)
                  try:
                      got = fn(mask, s, t)
                      ok = (got is None and want is None) or (got is not None and want is not None and got.shape == want.shape
                                                              and np.array_equal(got, want))
                  except Exception:
                      ok = False
                  bad += not ok
              return 400 - bad, 400

          tasks = {
              "split_lines": ("split_cluster_lines", test_split, """Write a Python function `split_cluster_lines(cluster, avg_h)`.
          `cluster` is a list of box objects with integer attributes x1, y1, x2, y2 (y grows downward). It returns a list of groups (lists of the same box objects).
          1. Go through the boxes sorted by (y1, x1). Put each box into the FIRST existing line where the line's vertical span is [min y1, max y2] of its boxes and
             overlap = min(box.y2, line_y2) - max(box.y1, line_y1), min_h = min(box height, line span height), and min_h > 0 and overlap / min_h > 0.5.
             If no line qualifies, start a new line with this box.
          2. Sort lines by their min y1. Walk them in order, building groups: the first line starts a group; each next line joins the current group
             unless max y2 - min y1 over the current group's boxes plus that line's boxes is greater than 3.0 * avg_h, in which case the current group
             is closed and the line starts a new group. Box order inside a group is the order they were added (line by line, box order inside each line).
          Reply with one ```python code block holding only the function."""),
              "fix_weight": ("tile_weight", test_weight, """This function builds 1-D blending weights for overlapping image tiles; a tile is blended in with a linear ramp
          from 0 to 1 over `overlap` pixels on each side that has a neighbouring tile. Users report black seams and zero weights when a tile is shorter than
          twice the overlap and has neighbours on both sides, and crashes on very short tiles. Find the bugs and return the fixed function with the same name and signature.
          Where both ramps cover a pixel, the smaller weight wins. When overlap <= 0 every weight is 1. The ramp length is min(overlap, length) and runs
          from 0.0 to 1.0 inclusive (np.linspace). Use float32.

          ```python
          import numpy as np

          def tile_weight(length, overlap, has_before, has_after):
              weight = np.ones(length, dtype=np.float32)
              ramp = np.linspace(0.0, 1.0, overlap, dtype=np.float32)
              if has_before:
                  weight[:overlap] = ramp
              if has_after:
                  weight[-overlap:] = ramp[::-1]
              return weight
          ```
          Reply with one ```python code block holding only the fixed function and its imports."""),
              "remap_mask": ("remap_local_mask_page_space", test_remap, """Write `remap_local_mask_page_space(mask, source_box, target_box)` with numpy.
          A text box's mask (uint8 2-D array of shape (source height, source width)) is stored in the box's local coordinates. The box was moved/resized
          on the page, and the mask must be re-expressed in the new box's local coordinates without scaling: page pixels covered by both boxes keep their
          mask value, everything else in the new box is 0.
          Boxes are dicts with integer keys x1, y1, x2, y2 in page pixels (x2/y2 exclusive).
          - mask None -> return None.
          - If either box has width <= 0 or height <= 0 -> return None.
          - The result is a uint8 array of shape (target height, target width).
          - If the boxes do not overlap, return the all-zero array.
          Reply with one ```python code block holding only the function and its imports."""),
          }

          log = []
          for think in (False, True):
              for key, (name, test, prompt) in tasks.items():
                  body = {"model": "qwen-3.8-27b", "temperature": 0, "max_tokens": 16000,
                          "chat_template_kwargs": {"enable_thinking": think},
                          "messages": [{"role": "user", "content": prompt.replace("\n          ", "\n")}]}
                  start = time.time()
                  r = requests.post(url, headers=head, json=body, timeout=600)
                  row = {"task": key, "thinking": think, "status": r.status_code, "seconds": round(time.time() - start, 1)}
                  try:
                      data = r.json()
                      msg = data["choices"][0]["message"]
                      row["usage"] = data.get("usage")
                      reply = msg.get("content") or ""
                      row["reply"] = reply
                      if msg.get("reasoning_content"):
                          row["reasoning_chars"] = len(msg["reasoning_content"])
                      code = re.findall(r"```(?:python)?\n(.*?)```", reply, re.S)
                      env = {}
                      exec(code[-1] if code else reply, env)
                      row["passed"], row["cases"] = test(env[name])
                  except Exception:
                      row["error"] = traceback.format_exc()[-1500:]
                      if "reply" not in row:
                          row["body"] = r.text[:1500]
                  log.append(row)
                  print(json.dumps({k: v for k, v in row.items() if k != "reply"}, ensure_ascii=False)[:1500], flush=True)
          json.dump(log, open(f"{out}/replies.json", "w"), ensure_ascii=False, indent=1)
          PY

      - name: Save evidence to audit-evidence
        if: always()
        uses: ./.github/actions/save-evidence
        with:
          paths: audit-results/polargrid-code
          message: "audit: PolarGrid code probe (run ${{ github.run_id }})"
