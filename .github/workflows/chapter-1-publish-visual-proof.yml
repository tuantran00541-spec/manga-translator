name: Chapter 1 Publish Final Visual Proof PDF
on:
  push:
    branches:
      - chapter/war-of-extinction-1
    paths:
      - .github/workflows/chapter-1-publish-visual-proof.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PROOF_RUN_ID: "35306773202"
      PROOF_ARTIFACT: 05a-render-proof-05efce51
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chapter/war-of-extinction-1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install proof runtime
        run: python -m pip install Pillow==10.4.0
      - name: Restore repaired visual proof
        run: |
          rm -rf checkpoint/visual-proof
          mkdir -p checkpoint/visual-proof
          gh run download "$PROOF_RUN_ID" -n "$PROOF_ARTIFACT" -D checkpoint/visual-proof
          find checkpoint/visual-proof -type f | sort
          test "$(find checkpoint/visual-proof -type f -name 'seam-proof-*.jpg' | wc -l)" -eq 9
          test "$(find checkpoint/visual-proof -type f -name 'p067-focused.jpg' | wc -l)" -eq 1
      - name: Build durable visual proof PDF
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps, ImageDraw
          root=Path('checkpoint/visual-proof')
          seam=sorted(root.rglob('seam-proof-*.jpg'))
          focused=list(root.rglob('p067-focused.jpg'))
          if len(seam)!=9 or len(focused)!=1:
              raise SystemExit(f'proof file mismatch seam={len(seam)} focused={len(focused)}')
          paths=seam+focused
          pages=[]
          for idx,p in enumerate(paths):
              im=Image.open(p).convert('RGB')
              canvas=Image.new('RGB',(max(1400,im.width+80),max(1000,im.height+120)),'white')
              x=(canvas.width-im.width)//2
              canvas.paste(im,(x,70))
              d=ImageDraw.Draw(canvas)
              title=f'Seam proof {idx+1}/9' if idx<9 else 'p067 local visual repair proof'
              d.text((30,25),title,fill='black')
              pages.append(canvas)
          out=Path('chapters/war-of-extinction-1/visual-proof-seams-p067.pdf')
          pages[0].save(out,save_all=True,append_images=pages[1:],resolution=110.0)
          print(out, out.stat().st_size)
          PY
      - name: Commit visual proof PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chapters/war-of-extinction-1/visual-proof-seams-p067.pdf
          if git diff --cached --quiet; then
            echo "No proof changes"
          else
            git commit -m "review(chapter): publish final seam and p067 visual proof"
            git push origin HEAD:chapter/war-of-extinction-1
          fi
