name: Qwen3.8 K3 progressive storage gate

on:
  push:
    branches:
      - research/qwen3.8-27b-runtime-finish
    paths:
      - research/qwen38/qwen38_k3_progressive.py
      - .github/workflows/qwen38-k3-progressive-storage.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  k3-progressive-storage:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      QWEN_GGUF_SHA256: a487690b9f17de581857c4ae484dab50800335bb9eb978a4fb02c0465629dc0a
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Synthetic progressive lifecycle gate
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            research/qwen38/qwen38_k3_sub_layer_frontier_probe.py \
            research/qwen38/qwen38_k3_progressive.py
          PYTHONPATH=research/qwen38 python -u research/qwen38/qwen38_k3_progressive.py sanity \
            2>&1 | tee "$RUNNER_TEMP/k3-progressive-synthetic.log"
          grep -F "QWEN38_K3_PROGRESSIVE_SYNTHETIC_PASS" "$RUNNER_TEMP/k3-progressive-synthetic.log"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Reclaim disk and show storage
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true
          docker system prune -af || true
          lscpu
          lsblk -o NAME,TYPE,SIZE,ROTA,MOUNTPOINTS || true
          df -h
          free -h

      - name: Install runtime dependencies
        run: python -m pip install --no-cache-dir huggingface_hub hf_xet

      - name: Download and hash pinned GGUF
        shell: bash
        run: |
          set -euo pipefail
          MODEL=$(python - <<'PY'
          from huggingface_hub import hf_hub_download
          print(hf_hub_download(
              "bartowski/Qwen3.8-27B-GGUF",
              filename="Qwen3.8-27B-Q6_K_L.gguf",
              local_dir="${{ runner.temp }}/qwen38-model",
          ))
          PY
          )
          echo "$QWEN_GGUF_SHA256  $MODEL" | sha256sum -c -
          echo "MODEL=$MODEL" >> "$GITHUB_ENV"
          echo "K3_WORK=$RUNNER_TEMP/qwen38-k3-progressive-work" >> "$GITHUB_ENV"
          echo "EVIDENCE=$RUNNER_TEMP/qwen38-k3-progressive-evidence" >> "$GITHUB_ENV"

      - name: Run real execution-layout direct-I-O storage gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE" "$K3_WORK"
          PYTHONPATH=research/qwen38 python -u research/qwen38/qwen38_k3_progressive.py real \
            --model "$MODEL" \
            --work-dir "$K3_WORK" \
            --output "$EVIDENCE/k3-progressive-storage.json" \
            2>&1 | tee "$EVIDENCE/k3-progressive-storage.log"
          grep -F "QWEN38_K3_PROGRESSIVE_STORAGE_REAL_PASS" "$EVIDENCE/k3-progressive-storage.log"

      - name: Print progressive storage summary
        if: always()
        shell: bash
        run: |
          if [[ -f "$EVIDENCE/k3-progressive-storage.json" ]]; then
            python - <<'PY'
          import json, os
          from pathlib import Path
          r = json.loads((Path(os.environ["EVIDENCE"]) / "k3-progressive-storage.json").read_text())
          print(json.dumps({
              "status": r["status"],
              "layout_policy": r["layout_policy"],
              "decoder_tensors_checked": r["decoder_tensors_checked"],
              "decoder_tensor_bytes_checked": r["decoder_tensor_bytes_checked"],
              "k3_read_bytes": r["k3_read_bytes"],
              "reader": r["reader"],
              "optimization": r["optimization"],
          }, indent=2, sort_keys=True))
          PY
          fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen38-k3-progressive-storage-${{ github.run_id }}
          path: ${{ runner.temp }}/qwen38-k3-progressive-evidence/
          if-no-files-found: warn
          retention-days: 14
