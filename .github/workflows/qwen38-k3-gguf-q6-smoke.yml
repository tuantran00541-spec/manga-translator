name: Qwen3.8 Q6_K_L compressed smoke

on:
  push:
    branches: [test/qwen3.8-27b]
    paths:
      - "research/qwen38/k3_gguf_q6_smoke.py"
      - ".github/workflows/qwen38-k3-gguf-q6-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  q6-gguf-cpu-smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[qwen-gguf-q6]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reclaim disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true
          docker system prune -af || true
          df -h
      - name: Install download dependency
        run: python -m pip install --no-cache-dir huggingface_hub hf_xet
      - name: Build current llama.cpp CPU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git "$RUNNER_TEMP/llama.cpp"
          cmake -S "$RUNNER_TEMP/llama.cpp" -B "$RUNNER_TEMP/llama.cpp/build" -G Ninja -DGGML_NATIVE=OFF -DGGML_OPENMP=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/llama.cpp/build" --target llama-cli -j2
      - name: Compile smoke
        run: python -m py_compile research/qwen38/k3_gguf_q6_smoke.py
      - name: Run Q6_K_L real compressed smoke
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/qwen38-q6"
          evidence="$RUNNER_TEMP/qwen38-q6-evidence"
          mkdir -p "$work" "$evidence"
          /usr/bin/time -v python research/qwen38/k3_gguf_q6_smoke.py \
            --work-dir "$work" \
            --llama-cli "$RUNNER_TEMP/llama.cpp/build/bin/llama-cli" \
            --output "$evidence/q6.json" \
            2>&1 | tee "$evidence/q6.log"
      - name: Show evidence and remove downloaded model
        if: always()
        run: |
          cat "$RUNNER_TEMP/qwen38-q6-evidence/q6.json" || true
          rm -rf "$RUNNER_TEMP/qwen38-q6" "$RUNNER_TEMP/llama.cpp" || true
          df -h
          free -h
      - name: Upload metrics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen38-q6-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/qwen38-q6-evidence/
          retention-days: 14
