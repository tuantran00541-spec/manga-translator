name: Code review by Beam (one-off)

on:
  push:
    paths:
      - ".github/code-review/config.json"

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        area: [clean, translate]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -q requests
      - id: c
        run: python -c 'import json; c=json.load(open(".github/code-review/config.json")); print("model=" + c["model"]); print("effort=" + c["effort"]); print("label=" + c["label"])' >> "$GITHUB_OUTPUT"
      - env:
          COMMANDCODE: ${{ secrets.COMMANDCODE }}
        run: python .github/code-review/review.py "${{ matrix.area }}" "${{ steps.c.outputs.model }}" "${{ steps.c.outputs.effort }}" "audit-results/code-review/${{ steps.c.outputs.label }}/${{ matrix.area }}"
      - if: always()
        uses: ./.github/actions/save-evidence
        with:
          paths: audit-results/code-review/${{ steps.c.outputs.label }}/${{ matrix.area }}
          message: "audit: code review ${{ matrix.area }} by ${{ steps.c.outputs.label }} (run ${{ github.run_id }})"
