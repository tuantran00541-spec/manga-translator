name: Apply backend Phase 5

on:
  push:
    branches: [main]
    paths:
      - scripts/apply_phase5_patch.py
      - .github/workflows/phase5-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply Phase 5 patch
        run: python scripts/apply_phase5_patch.py
      - name: Compile Phase 5 source
        run: >-
          python -m py_compile app/detector/bubble_detector.py
          scripts/backend_phase5_sanity.py
      - name: Install deterministic test runtime
        run: python -m pip install numpy==1.26.4 opencv-contrib-python==4.10.0.84
      - name: Run Phase 5 equivalence/performance fixtures
        run: python scripts/backend_phase5_sanity.py
      - name: Run existing backend source/authority sanity
        run: |
          python scripts/release_sanity.py
          python scripts/inpaint_authority_sanity.py
          python scripts/backend_phase4_sanity.py
      - name: Commit Phase 5 production code
        shell: bash
        run: |
          git config user.name "Manga backend CI"
          git config user.email "actions@users.noreply.github.com"
          git add app/detector/bubble_detector.py scripts/backend_phase5_sanity.py
          git diff --cached --quiet && exit 0
          git commit -m "perf(detector): batch suppression mask decoding"
          git push origin HEAD:main
