name: Speed matrix

on:
  push:
    branches: ["claude/**"]
    paths:
      - ".github/speed-matrix.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: speed-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: "."
      MANGA_PROCESSING_PIPELINE: fast
      MANGA_USE_DYNAMIC_LAMA: "1"
      MANGA_ORT_PROVIDER: openvino
      MANGA_ORT_REQUIRE_PROVIDER: "1"
      MANGA_ORT_OPENVINO_SCOPE: detectors
      MANGA_ORT_OPENVINO_CACHE_DIR: /tmp/manga-openvino-cache
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install app runtime
        run: |
          python -m pip install --only-binary :all: numpy==1.26.4 Pillow==10.4.0 opencv-contrib-python==4.10.0.84 \
            onnxruntime-openvino==1.24.1 psutil==6.1.1 loguru==0.7.2 requests==2.32.3 \
            beautifulsoup4==4.12.3 lxml==5.3.0 playwright==1.47.0 fastapi==0.115.0 \
            'uvicorn[standard]==0.30.6' pydantic==2.9.2 filelock==3.16.1 python-multipart==0.0.12 keyring==25.6.0
          python -m playwright install --with-deps chromium

      - name: Restore detector and inpaint models
        id: models
        uses: actions/cache@v4
        with:
          path: |
            models/*.onnx
            models/.e2e-provenance.json
          key: processing-profile-models-b224548-v1

      - name: Read pinned model provisioner
        if: steps.models.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          ref: b22454827f8190655d7070b80eb20c2550beadfa
          path: benchmark-bootstrap
          sparse-checkout: scripts/provision_real_e2e_models.py
          sparse-checkout-cone-mode: false

      - name: Provision production detector and LaMa models
        if: steps.models.outputs.cache-hit != 'true'
        run: |
          python -m pip install --only-binary :all: --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple torch==2.5.1+cpu torchvision==0.20.1+cpu
          python -m pip install --only-binary :all: --no-deps ultralytics==8.3.221 onnx==1.17.0 onnxslim==0.1.71
          python -m pip install --only-binary :all: sympy==1.13.1 PyYAML==6.0.2 scipy==1.14.1 tqdm==4.67.1 matplotlib==3.9.2 pandas==2.2.3 py-cpuinfo==9.0.0 ml_dtypes==0.5.3 colorama==0.4.6 polars==1.33.1 ultralytics-thop==2.0.17
          python benchmark-bootstrap/scripts/provision_real_e2e_models.py
          cp benchmark-bootstrap/models/*.onnx models/
          cp benchmark-bootstrap/models/.e2e-provenance.json models/ || true

      - name: Runner
        run: |
          nproc
          lscpu | grep -E 'Model name|^CPU\(s\)|Thread|Core'
          free -h

      - name: Clean the chapter (base)
        run: |
          url="$(head -n1 .github/speed-matrix.txt | tr -d '\r')"
          python scripts/speed_matrix.py run "$url" --workers 2 --out /tmp/speed/base

      - name: Clean the chapter (base2)
        continue-on-error: true
        run: |
          url="$(head -n1 .github/speed-matrix.txt | tr -d '\r')"
          python scripts/speed_matrix.py run "$url" --workers 2 --out /tmp/speed/base2

      - name: Clean the chapter (w4)
        continue-on-error: true
        run: |
          url="$(head -n1 .github/speed-matrix.txt | tr -d '\r')"
          python scripts/speed_matrix.py run "$url" --workers 4 --out /tmp/speed/w4

      - name: Clean the chapter (ov-all)
        continue-on-error: true
        env:
          MANGA_ORT_OPENVINO_SCOPE: "all"
        run: |
          url="$(head -n1 .github/speed-matrix.txt | tr -d '\r')"
          python scripts/speed_matrix.py run "$url" --workers 2 --out /tmp/speed/ov-all

      - name: Clean the chapter (ov-all-w4)
        continue-on-error: true
        env:
          MANGA_ORT_OPENVINO_SCOPE: "all"
        run: |
          url="$(head -n1 .github/speed-matrix.txt | tr -d '\r')"
          python scripts/speed_matrix.py run "$url" --workers 4 --out /tmp/speed/ov-all-w4

      - name: Compare with the base run
        if: always()
        run: |
          mkdir -p audit-results/speed
          python scripts/speed_matrix.py summarize /tmp/speed/base /tmp/speed/base2 /tmp/speed/w4 /tmp/speed/ov-all /tmp/speed/ov-all-w4 --base base --out audit-results/speed/report.json
          for n in base2 w4 ov-all ov-all-w4; do
            test -d /tmp/speed/$n && python scripts/refactor_parity.py compare /tmp/speed/base /tmp/speed/$n \
              --out audit-results/speed/$n-vs-base.json --crops audit-results/speed/crops-$n || true
          done

      - name: Save evidence to audit-evidence
        if: always()
        uses: ./.github/actions/save-evidence
        with:
          paths: audit-results/speed
          message: "audit: speed matrix (run ${{ github.run_id }})"
