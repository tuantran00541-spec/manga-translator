name: Jev calibrate

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  calibrate:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --only-binary :all: numpy==1.26.4 Pillow==10.4.0 opencv-contrib-python==4.10.0.84 \
            psutil==6.1.1 loguru==0.7.2 requests==2.32.3 fastapi==0.115.0 pydantic==2.9.2 filelock==3.16.1 \
            python-multipart==0.0.12 keyring==25.6.0
      - name: Grade labelled lines
        env:
          KEY: ${{ secrets.MINIROUTER_API_KEY }}
          JUDGE_URL: https://api.minirouter.sh/v1/evaluate
          PYTHONPATH: "."
        run: python scripts/jev_calibrate.py audit-results/jev-calibrate
      - name: Save evidence to audit-evidence
        if: always()
        uses: ./.github/actions/save-evidence
        with:
          paths: audit-results/jev-calibrate
          message: "audit: Jev calibrate (run ${{ github.run_id }})"
